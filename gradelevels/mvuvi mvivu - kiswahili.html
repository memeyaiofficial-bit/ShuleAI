<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mvuvi Mvivu - Darasa la 2 CBC | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e6b5e 0%, #0e4d42 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #1e6b5e;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🎣🐟 Mvuvi Mvivu! Jifunze kusikiliza, kuzungumza, kusoma na kuandika hadithi hii.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Hadithi ya Mvuvi Mvivu! Andika jibu sahihi. Bonyeza kitufe cha sauti kusikia swali.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- SAUTI KWA KISWAHILI ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa. Swali linalofuata linakuja.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakKiswahili(qData.text);
        else speakKiswahili("Hakuna swali kwa sasa.");
    }

    // ---------- MASWALI: Mvuvi Mvivu (Kusikiliza, Kuzungumza, Kusoma, Kuandika) ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // KUSIKILIZA - Kusikiliza hadithi ya Mvuvi Mvivu
        const kusikiliza = [
            { q: "Katika hadithi, mvuvi alikuwa mtu ______.", a: "mvivu" },
            { q: "Mvuvi mvivu hakuwa na hamu ya kwenda ______.", a: "uvuani" },
            { q: "Tunaposikiliza hadithi ya mvuvi mvivu, tunapaswa kuwa ______.", a: "makini" },
            { q: "Mvuvi mvivu alipenda kulala na kukaa nyumbani badala ya ______.", a: "kufanya kazi" },
            { q: "Watu wa kijijini walimcheka mvuvi mvivu kwa sababu alikuwa ______.", a: "wavivu" },
            { q: "Kusikiliza kwa makini kunatusaidia kuelewa ______ ya hadithi.", a: "fundisho" },
            { q: "Mvuvi mvivu hakuwa na chakula kwa sababu hakuwa anapata ______.", a: "samaki" },
            { q: "Bobo alisikiliza hadithi ya mvuvi aliyekuwa ______.", a: "mvivu" },
            { q: "Mwishowe, mvuvi mvivu alijifunza kuwa uvivu haulipi ______.", a: "mshahara" },
            { q: "Kusikiliza hadithi za mafundisho ni jambo la ______.", a: "kufurahisha" }
        ];
        
        // KUZUNGUMZA - Kuzungumza kuhusu Mvuvi Mvivu
        const kuzungumza = [
            { q: "Tunapozungumza kuhusu mvuvi mvivu, tunapaswa kutumia lugha ya ______.", a: "heshima" },
            { q: "Talia alimwuliza rafiki yake, 'Je, unajua hadithi ya ______ mvivu?'", a: "mvuvi" },
            { q: "Kuzungumza kwa ______ ni alama ya adabu.", a: "upole" },
            { q: "Mvuvi mvivu alijibu, 'Sitaki kwenda uvuani, napenda ______.'", a: "kulala" },
            { q: "Kuzungumza kwa ukweli kunajenga ______ miongoni mwa watu.", a: "uaminifu" },
            { q: "Mama yake mvuvi alimwambia, 'Mwanangu, uvivu ni ______.'", a: "mbaya" },
            { q: "Kuzungumza kwa ______ kunasaidia kuepuka migogoro.", a: "heshima" },
            { q: "Wanakijiji walimwambia mvuvi, 'Anza ______ ili upate samaki.'", a: "kufanya kazi" },
            { q: "Talia alisema, 'Mvuvi mvivu alikuwa anapenda ______ kuliko kazi.'", a: "kulala" },
            { q: "Kuzungumza kuhusu wavivu kunatufundisha kuhusu ______ wa kazi.", a: "umuhimu" }
        ];
        
        // KUSOMA - Kusoma hadithi ya Mvuvi Mvivu
        const kusoma = [
            { q: "Bobo alisoma hadithi ya 'Mvuvi ______'.", a: "Mvivu" },
            { q: "Kusoma kunatusaidia kujua kwamba uvivu haulipi ______.", a: "mshahara" },
            { q: "Mvuvi mvivu hakuwa na chakula kwa sababu hakuwa na ______.", a: "samaki" },
            { q: "Talia alisoma kwamba mvuvi mvivu aliamua kubadilika na kuwa ______.", a: "mchapakazi" },
            { q: "Kusoma kwa ______ kunasaidia kuelewa funzo la hadithi.", a: "umakini" },
            { q: "Bobo alisoma, 'Uvivu ni ______ kwa mtu.'", a: "sumu" },
            { q: "Mvuvi mvivu alikuwa akilala kitandani wakati wengine wakifanya ______.", a: "kazi" },
            { q: "Kusoma hadithi za mafundisho hutufanya kuwa ______.", a: "wema" },
            { q: "Talia alisoma kwamba mvuvi alianza kupata samaki wengi baada ya kuwa ______.", a: "hodari" },
            { q: "Kusoma kunatuwezesha kujua tofauti kati ya mvivu na ______.", a: "mchapakazi" }
        ];
        
        // KUANDIKA - Kuandika kuhusu Mvuvi Mvivu
        const kuandika = [
            { q: "Bobo aliandika sentensi: 'Mvuvi mvivu hakupenda ______.'", a: "kufanya kazi" },
            { q: "Kuandika kwa ______ kunasaidia kuwasilisha ujumbe vizuri.", a: "maridadi" },
            { q: "Talia aliandika muhtasari wa hadithi ya 'Mvuvi ______.'", a: "Mvivu" },
            { q: "Kuandika kwa usafi ni alama ya mwanafunzi ______.", a: "mwema" },
            { q: "Bobo aliandika orodha ya sifa za mvuvi mvivu: wavivu, mzembe na ______.", a: "mlalaji" },
            { q: "Talia aliandika ubaoni: 'Uvivu haulipi ______.'", a: "mshahara" },
            { q: "Kuandika kunatusaidia kukumbuka ______ za hadithi.", a: "mafunzo" },
            { q: "Bobo aliandika insha fupi kuhusu mtu aliye ______.", a: "mvivu" },
            { q: "Talia aliandika barua kwa rafiki yake akimtaka asiwe ______.", a: "mvivu" },
            { q: "Kuandika kwa bidii kunasaidia kuboresha ______ yetu.", a: "ujuzi" }
        ];
        
        const allTopics = [...kusikiliza, ...kuzungumza, ...kusoma, ...kuandika];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo anamsikiliza mwalimu akisoma hadithi ya mvuvi ambaye hakupenda ______.";
                correctAnswer = "kufanya kazi";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "Mvuvi mvivu alisema, 'Napenda ______ kuliko kwenda uvuani.'";
                correctAnswer = "kulala";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Talia anasoma hadithi ya mvuvi aliyekuwa ______ na akakosa samaki.";
                correctAnswer = "mvivu";
            }
            if (i % 8 === 0) {
                qText = "Bobo anaandika katika shajara yake: 'Uvivu haulipi ______.'";
                correctAnswer = "mshahara";
            }
            if (i % 9 === 0) {
                qText = "Kusikiliza hadithi za mafundisho kunatusaidia kujua kuwa kazi ni ______.";
                correctAnswer = "njema";
            }
            if (i % 11 === 0) {
                qText = "Mvuvi mvivu alijifunza kuwa uvivu humletea mtu ______.";
                correctAnswer = "matatizo";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}. Uvivu haulipi mshahara!`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Tunasonga kwenye swali linalofuata.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako! Bonyeza kitufe cha sauti kusikia swali tena. Hadithi ya Mvuvi Mvivu inaendelea!";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Kusikiliza hadithi ya Mvuvi Mvivu! Jifunze kusikiliza kwa makini.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Kuzungumza kuhusu Mvuvi Mvivu! Zungumza kuhusu umuhimu wa kufanya kazi.";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Kusoma hadithi ya Mvuvi Mvivu! Soma na uelewe funzo la hadithi.";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Kuandika kuhusu Mvuvi Mvivu! Andika muhtasari na mafunzo ya hadithi.";
        else levelDesc = "Ngazi 5: Ngazi ya mwisho! Kuwa Bingwa wa Hadithi ya Mvuvi Mvivu Darasa la 2!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele. ⏱️ 40s/swali. Uvivu haulipi mshahara! 🎣🐟`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5! Wewe ni Bingwa wa Hadithi ya Mvuvi Mvivu Darasa la 2! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza ngazi zote tano. Wewe ni bingwa wa hadithi ya Mvuvi Mvivu! Kumbuka kuwa kazi ni njema na uvivu haulipi mshahara!");
                storyAreaDiv.innerHTML = "🏁 MCHEZO UMEMALIZIKA! Sasa unajua hadithi ya Mvuvi Mvivu vizuri! Endelea kusoma hadithi za Kiswahili na uepuke uvivu! 🎣🐟📖✨";
                nextLevelMsgDiv.innerHTML = "✨ UMESHINDA! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel}. Sasa unaenda ngazi ${currentLevel+1}. Endelea kujifunza hadithi za Kiswahili!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukufika 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu Ngazi ${currentLevel} tena.`;
            speakKiswahili(`Pole! Unahitaji angalau asilimia themanini kupita. Una alama ${scoreCorrect} kati ya ${totalQuestionsInLevel}. Tafadhali jaribu ngazi ${currentLevel} tena. Kumbuka uvivu haulipi mshahara!`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Hadithi ya Mvuvi Mvivu! Andika jibu lako. Bonyeza kitufe cha sauti kusikia swali.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu! Mvuvi Mvivu anakungoja.";
            speakKiswahili("Tafadhali andika jibu.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for Kiswahili answers
        if (!isCorrect) {
            const forgiving = {
                "mvivu": ["wavivu", "mvivu sana", "mtu asiye na hamu"],
                "uvuani": ["baharini", "kwenye mto", "pwani"],
                "makini": ["kwa makini", "umakini", "mwangalifu"],
                "kufanya kazi": ["kazi", "kufanya kazi yake", "kuchapa kazi"],
                "wavivu": ["wavivu sana", "wazembe", "watu wa uvivu"],
                "fundisho": ["somo", "mafunzo", "elimu"],
                "samaki": ["samaki wengi", "viumbe vya majini"],
                "mshahara": ["malipo", "mapato", "fedha"],
                "kufurahisha": ["furahisha", "kuvutia", "kupendeza"],
                "heshima": ["adabu", "staha", "taadhima"],
                "mvuvi": ["mvulana", "mvuvi wa samaki"],
                "upole": ["laini", "taratibu", "utulivu"],
                "kulala": ["lala", "kupumzika", "usingizi"],
                "uaminifu": ["aminifu", "kweli", "ukweli"],
                "mbaya": ["baya", "si nzuri", "hasara"],
                "kufanya kazi": ["kuchapa kazi", "kutenda kazi"],
                "umuhimu": ["thamani", "maana", "ukubwa"],
                "mchapakazi": ["hodari", "mwenye bidii", "mwenye nguvu"],
                "umakini": ["makini", "uzingatiaji", "tahadhari"],
                "sumu": ["dutu hatari", "madhara"],
                "wema": ["wema wa maadili", "uzuri", "adabu"],
                "hodari": ["stadi", "bora", "fundi"],
                "maridadi": ["uzuri", "nzuri", "safi"],
                "mwema": ["mwema", "mzuri", "mtukufu"],
                "mlalaji": ["mtu wa kulala", "mzembe"],
                "mafunzo": ["somo", "fundisho", "elimu"],
                "njema": ["nzuri", "safi", "faida"],
                "matatizo": ["shida", "mashaka", "madhara"],
                "kufanya kazi": ["kazi", "tendo"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama! Kumbuka, uvivu haulipi mshahara! Endelea kufanya kazi kwa bidii!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi ni: "${currentQ.answer}". Endelea kujifunza hadithi ya Mvuvi Mvivu! Kumbuka kuwa kazi ni njema! ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Usikate tamaa! Soma hadithi za Kiswahili kila siku!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa hadithi ya Mvuvi Mvivu! Jifunze kusikiliza, kuzungumza, kusoma na kuandika kwa Kiswahili. Una sekunde arobaini kwa kila swali. Bonyeza kitufe cha sauti kusikia swali. Andika jibu lako. Kumbuka: Uvivu haulipi mshahara! Wacha tujifunze kutoka kwa hadithi hii!");
        }, 500);
    });
</script>

</html>
