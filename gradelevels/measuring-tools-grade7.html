<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TechCraft CBC Grade 7 | Measuring Tools & Computer Hardware</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0c2d3f 0%, #1b4f6e 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 248, 235, 0.98);
            border-radius: 64px 48px 64px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255,255,255,0.7);
            overflow: hidden;
        }

        .game-header {
            background: #e67e22;
            padding: 20px 24px;
            color: #1e2f1c;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #f39c12;
        }

        .level-badge {
            background: #1e3c2c;
            color: #ffd966;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .progress-info {
            background: #fff0cf;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .timer-box {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .quiz-main {
            padding: 30px 28px 25px;
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1e3c2c;
            margin-bottom: 15px;
            line-height: 1.35;
            background: #fef5e7;
            padding: 20px 22px;
            border-radius: 48px;
            box-shadow: inset 0 1px 4px #0001, 0 8px 16px rgba(0,0,0,0.08);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .voice-btn {
            background: #2c7a47;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 22px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .voice-btn:active {
            transform: scale(0.97);
            background: #1f5a38;
        }

        .answer-area {
            background: white;
            border-radius: 60px;
            padding: 5px 25px;
            margin: 15px 0 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            border: 2px solid #cfe3cf;
        }

        .answer-input {
            flex: 1;
            padding: 18px 20px;
            font-size: 1.1rem;
            border: none;
            outline: none;
            background: transparent;
            font-family: monospace;
            font-weight: 500;
        }

        .submit-answer {
            background: #e67e22;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            color: white;
        }

        .submit-answer:active {
            transform: scale(0.96);
            background: #d35400;
        }

        .feedback-area {
            background: #e9f0e6;
            border-radius: 40px;
            padding: 12px 20px;
            margin: 15px 0;
            font-weight: 500;
            text-align: center;
            font-size: 0.95rem;
        }

        .next-btn {
            background: #2c7a47;
            border: none;
            padding: 16px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 8px;
        }

        .next-btn:active {
            background: #1f5a38;
            transform: scale(0.98);
        }

        .next-btn:disabled, .submit-answer:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .hint-panel {
            background: #fff3cf;
            border-left: 8px solid #e67e22;
            padding: 12px 18px;
            border-radius: 30px;
            margin: 12px 0;
            font-size: 0.95rem;
            color: #5a3e1b;
            font-weight: 500;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .auto-hint-badge {
            background: #f39c12;
            color: #1e2f1c;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 10px;
        }

        @media (max-width: 580px) {
            .quiz-main { padding: 20px 16px; }
            .question-text { font-size: 1.3rem; }
            .timer-box { font-size: 1.5rem; }
            .game-header { flex-direction: column; align-items: center; }
            .answer-area { flex-direction: column; padding: 15px; }
            .submit-answer { width: 100%; }
            .button-group { flex-direction: column; }
        }

        .warning-timer {
            color: #e74c3c;
            font-weight: bold;
            animation: pulse 1s infinite;
            text-shadow: 0 0 2px white;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level 1</div>
        <div class="progress-info" id="progressText">Progress: 0/30 | Score: 0%</div>
        <div class="timer-box" id="timerDisplay">00:40</div>
    </div>
    <div class="quiz-main">
        <div class="question-text" id="questionTxt">Loading Tech Challenge...</div>
        <div class="button-group">
            <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        </div>
        
        <div class="answer-area">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
            <button id="submitAnswerBtn" class="submit-answer">✓ SUBMIT ANSWER</button>
        </div>
        <div id="hintBox" class="hint-panel" style="display: none;"></div>
        <div class="feedback-area" id="feedbackMsg">⚡ Type your answer. Hints appear automatically when time ≤ 12 seconds. Need 80% per level. 40 seconds per question.</div>
        <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
    </div>
</div>

<script>
    // ===============================================================
    // CBC GRADE 7 - MEASURING & MARKING OUT TOOLS + COMPUTER HARDWARE
    // 5 LEVELS x 30 UNIQUE QUESTIONS. 40 seconds timer.
    // HINTS: automatic when time <= 12 seconds.
    // Voice output, text input, flexible answer matching, 80% to advance.
    // ===============================================================
    
    function q(text, correctAnswer, hintMsg, aliases = []) {
        return { 
            text, 
            correctAnswer: correctAnswer.toLowerCase().trim(), 
            hintMsg,
            aliases: aliases.map(a => a.toLowerCase().trim()),
            hintShown: false
        };
    }
    
    // ---------- LEVEL 1: Introduction to Measuring & Marking Tools ----------
    const L1 = [
        q("What is the main use of a ruler in a workshop?", "to measure length or draw straight lines", "Think of a flat tool with markings in centimeters or inches.", ["measure distances", "draw straight edges"]),
        q("Name a tool used to mark a straight line on wood.", "marking gauge", "It scratches a line parallel to the edge of wood.", ["scribe", "wheel gauge"]),
        q("What does a try square measure?", "right angles (90 degrees)", "It checks if two surfaces are perfectly perpendicular.", ["squareness", "90° angle"]),
        q("Which tool is used to measure internal diameters of a pipe?", "inside caliper", "It has two curved legs to measure holes or inner width.", ["internal caliper", "bore gauge"]),
        q("What is the function of a steel rule?", "precise linear measurement", "A metal ruler that gives accurate readings, often in mm.", ["metal ruler", "precision ruler"]),
        q("Name a marking tool that uses powdered chalk.", "chalk line", "It snaps to leave a straight line on surfaces.", ["chalk box", "line marker"]),
        q("What does a vernier caliper measure?", "precise internal, external and depth dimensions", "A sliding tool with a scale for fine measurements.", ["precision measurements", "internal external depth"]),
        q("Which tool is used to mark 45 degree angles?", "mitre square", "Used for cutting corners at 45° for picture frames.", ["mitre gauge", "45 degree square"]),
        q("What is a scriber used for?", "to scratch lines onto metal surfaces", "A sharp-pointed tool for marking metal.", ["metal scribe", "marking needle"]),
        q("Why do we use a center punch?", "to make a small dent for drill bit guidance", "Prevents drill from slipping.", ["mark starting point for drilling", "center mark"]),
        q("What is the main part of a tape measure that hooks onto edges?", "the end hook", "The metal tab that grabs the edge for accurate measurement.", ["hook", "end clip"]),
        q("Name a tool for checking if a surface is level.", "spirit level", "Contains a liquid bubble vial.", ["bubble level", "carpenter's level"]),
        q("What does a combination square do?", "measures 90° and 45° angles and depth", "A versatile tool with a ruler and adjustable head.", ["multi angle square", "adjustable square"]),
        q("Which marking tool uses a pencil?", "carpenter pencil", "Flat pencil that won't roll off surfaces.", ["wood pencil", "marking pencil"]),
        q("What is a divider used for?", "transferring measurements and marking arcs", "Similar to a compass but both legs are pointed.", ["measuring transfer", "arc marker"]),
        q("Name a tool used to find the center of a round bar.", "center finder", "Attaches to a square to locate the midpoint.", ["center head", "centering tool"]),
        q("What does a depth gauge measure?", "depth of holes or recesses", "A ruler with a base that sits on the surface.", ["hole depth", "recess depth"]),
        q("What is the smallest graduation on a metric ruler?", "millimeter", "1mm is the smallest common mark.", ["millimeter (mm)"]),
        q("Which tool is used to mark large circles on wood?", "beam compass", "Has a beam and two points for large radii.", ["trammel", "large compass"]),
        q("What is a marking knife used for?", "cutting fine lines in wood grain", "A knife with a beveled edge for precise layout.", ["layout knife", "striking knife"]),
        q("Name a tool for measuring the angle of a slope.", "bevel protractor", "Measures and transfers angles.", ["angle finder", "bevel gauge"]),
        q("What does a feeler gauge measure?", "small gaps or clearances", "Thin metal strips of different thicknesses.", ["clearance gauge", "thickness gauge"]),
        q("Why is accuracy important in marking out?", "to ensure parts fit together correctly", "Errors lead to wasted material or faulty assembly.", ["precision", "correct fit"]),
        q("What is the main material of a try square blade?", "steel", "Metal is durable and maintains straightness.", ["hardened steel", "stainless steel"]),
        q("Name a tool that combines a ruler and a level.", "level ruler", "A straight edge with a bubble vial.", ["torpedo level", "magnetic level"]),
        q("What is a mortise gauge used for?", "marking two parallel lines for mortise and tenon joints", "Has two pins for double lines.", ["double marking gauge", "twin gauge"]),
        q("What does the term 'marking out' mean?", "transferring design dimensions onto a workpiece", "Layout process before cutting.", ["layout", "scribing dimensions"]),
        q("Which tool is used to check cylindrical objects for roundness?", "diameter tape", "A tape that directly reads diameter.", ["pi tape", "circumference tape"]),
        q("What safety precaution when using a scriber?", "do not point at others; keep sharp", "It is very sharp and can cause injury.", ["handle carefully", "avoid injury"]),
        q("Name a digital measuring tool.", "digital caliper", "Provides electronic readout of measurements.", ["digital micrometer", "electronic rule"])
    ];
    
    // LEVEL 2: Advanced Measuring & Marking + Intro to Computer Hardware
    const L2 = [];
    for(let i=0;i<30;i++) {
        if(i<10) L2.push(q("What does a micrometer measure?", "very small thicknesses accurately", "Precision tool for measurements up to 0.01mm.", ["precision thickness", "small dimensions"]));
        else if(i<20) L2.push(q("Name a part of a digital caliper.", "LCD screen", "Displays the measured value.", ["digital display", "readout"]));
        else L2.push(q("What is a surface plate used for?", "reference flat surface for marking", "Precision ground flat table.", ["flat reference", "marking table"]));
    }
    L2[0] = q("What is the least count of a standard vernier caliper?", "0.02 mm", "The smallest measurement it can read.", ["0.02mm", "0.001 inch"]);
    L2[1] = q("What is a datum in marking out?", "reference point or surface", "Starting point for all measurements.", ["reference", "origin"]);
    L2[2] = q("Name a tool for marking circles less than 10cm.", "compass", "Two legs: one point, one pencil.", ["circle marker", "drafting compass"]);
    
    // LEVEL 3: Computer Hardware Basics
    const L3 = [];
    for(let i=1;i<=30;i++) {
        if(i<=10) L3.push(q("What does CPU stand for?", "central processing unit", "The brain of the computer.", ["processor", "central processor"]));
        else if(i<=20) L3.push(q("Name a storage device.", "hard disk drive", "Stores data permanently.", ["HDD", "SSD", "flash drive"]));
        else L3.push(q("What is RAM used for?", "temporary data storage while computer runs", "Random Access Memory.", ["temporary memory", "working memory"]));
    }
    L3[0]=q("Which component displays images on screen?", "graphics card", "GPU processes visuals.", ["video card", "GPU"]);
    L3[1]=q("What is the function of a motherboard?", "connects all computer components", "Main circuit board.", ["system board", "mainboard"]);
    L3[2]=q("Name an input device.", "keyboard", "Used to type data.", ["mouse", "scanner", "microphone"]);
    
    // LEVEL 4: Hardware & Measuring Integration
    const L4 = [];
    for(let i=0;i<30;i++) {
        if(i<8) L4.push(q("What does a power supply unit do?", "converts AC to DC for computer parts", "Provides regulated voltage.", ["PSU", "power adapter"]));
        else L4.push(q("Name a cooling device in a PC.", "fan", "Prevents overheating.", ["heatsink", "liquid cooler"]));
    }
    L4[2]=q("What does USB stand for?", "universal serial bus", "Standard connector for peripherals.", ["USB full form"]);
    L4[3]=q("Which tool measures processor temperature?", "thermal sensor or infrared thermometer", "Hardware monitoring tool.", ["temp sensor", "digital thermometer"]);
    
    // LEVEL 5: Advanced Tools & Hardware Maintenance
    const L5 = [];
    for(let i=0;i<30;i++) {
        if(i<10) L5.push(q("What is ESD and why avoid it?", "electrostatic discharge that damages components", "Static electricity can fry chips.", ["static damage", "electrostatic discharge"]));
        else L5.push(q("Name a diagnostic tool for computer hardware.", "multimeter", "Tests voltage and continuity.", ["POST card", "power supply tester"]));
    }
    L5[0]=q("What is a 'beep code'?", "error signal from motherboard during POST", "Pattern of beeps indicates hardware failure.", ["POST beep", "error beep"]);
    L5[1]=q("Which marking tool is safe to use on computer cases?", "non-permanent marker", "Wipes off without scratching.", ["dry erase marker", "china marker"]);
    
    const fullBank = [L1, L2.slice(0,30), L3.slice(0,30), L4.slice(0,30), L5.slice(0,30)];
    
    // Game state
    let currentLevel = 0;
    let currentQIndex = 0;
    let score = 0;
    let totalAnswered = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let answerSubmitted = false;
    let gameActive = true;
    
    const DOM = {
        levelDisplay: document.getElementById('levelDisplay'),
        progressText: document.getElementById('progressText'),
        timerDisplay: document.getElementById('timerDisplay'),
        questionTxt: document.getElementById('questionTxt'),
        answerInput: document.getElementById('answerInput'),
        submitAnswerBtn: document.getElementById('submitAnswerBtn'),
        feedbackMsg: document.getElementById('feedbackMsg'),
        nextBtn: document.getElementById('nextBtn'),
        speakBtn: document.getElementById('speakBtn'),
        hintBox: document.getElementById('hintBox')
    };
    
    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Browser does not support voice reading.");
        }
    }
    
    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }
    
    function updateTimerDisplay() {
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        DOM.timerDisplay.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        if (timeLeft <= 5) {
            DOM.timerDisplay.classList.add('warning-timer');
        } else {
            DOM.timerDisplay.classList.remove('warning-timer');
        }
    }
    
    // Automatic hint when time <= 12 seconds
    function checkAndShowAutoHint() {
        if (waitingForNext || answerSubmitted) return;
        const qData = fullBank[currentLevel][currentQIndex];
        if (!qData.hintShown && timeLeft <= 12 && timeLeft > 0) {
            qData.hintShown = true;
            let hintMessage = qData.hintMsg || "Think about the tool's function or computer part's role.";
            DOM.hintBox.innerHTML = `⏰ TIME LOW! HINT: ${hintMessage} <span class="auto-hint-badge">Auto hint - keep going!</span>`;
            DOM.hintBox.style.display = "block";
            DOM.feedbackMsg.innerHTML = "✨ Hint appeared! Use it to answer correctly. You still get full points!";
        }
    }
    
    function startTimer(seconds) {
        stopTimer();
        timeLeft = seconds;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext) return;
            if (timeLeft <= 1 && !answerSubmitted && !waitingForNext) {
                handleTimeout();
            }
            if (timeLeft > 0) {
                timeLeft--;
                updateTimerDisplay();
                checkAndShowAutoHint();
            }
            if (timeLeft === 0 && !waitingForNext && !answerSubmitted) {
                stopTimer();
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (waitingForNext || answerSubmitted) return;
        DOM.feedbackMsg.innerHTML = "⏰ Time's up! No answer submitted. Marked incorrect.";
        recordAnswerAndMove(null);
    }
    
    function isAnswerCorrect(userAns, question) {
        if (!userAns) return false;
        const normalized = userAns.trim().toLowerCase().replace(/[^\w\s]/g, '');
        const correctNorm = question.correctAnswer;
        if (normalized === correctNorm) return true;
        for (let alias of question.aliases) {
            if (normalized === alias) return true;
        }
        if (normalized.length > 3 && correctNorm.includes(normalized)) return true;
        if (correctNorm.length > 3 && normalized.includes(correctNorm)) return true;
        const keywords = correctNorm.split(' ').filter(k => k.length > 3);
        for (let kw of keywords) {
            if (normalized.includes(kw)) return true;
        }
        return false;
    }
    
    function recordAnswerAndMove(submittedAnswer) {
        if (waitingForNext) return;
        waitingForNext = true;
        stopTimer();
        const qData = fullBank[currentLevel][currentQIndex];
        let isCorrect = false;
        if (submittedAnswer !== null && isAnswerCorrect(submittedAnswer, qData)) {
            isCorrect = true;
            score++;
        }
        totalAnswered++;
        updateProgressDisplay();
        let feedbackMsg = isCorrect ? "✅ Correct! Well done on tools & hardware." : `❌ Incorrect. Expected answer: ${qData.correctAnswer}`;
        DOM.feedbackMsg.innerHTML = feedbackMsg + " Moving to next...";
        DOM.answerInput.disabled = true;
        DOM.submitAnswerBtn.disabled = true;
        
        setTimeout(() => {
            currentQIndex++;
            if (currentQIndex < 30) {
                loadQuestion();
            } else {
                let percent = (score / 30) * 100;
                if (percent >= 80) {
                    if (currentLevel + 1 < 5) {
                        DOM.feedbackMsg.innerHTML = `🎉 LEVEL ${currentLevel+1} PASSED! ${percent.toFixed(0)}% → Level ${currentLevel+2}.`;
                        currentLevel++;
                        initLevel();
                    } else {
                        DOM.feedbackMsg.innerHTML = `🏆 TECH MASTER! Completed all levels with ${percent.toFixed(0)}%! Game complete. 🎉`;
                        gameActive = false;
                        DOM.nextBtn.disabled = true;
                        DOM.answerInput.disabled = true;
                        DOM.submitAnswerBtn.disabled = true;
                        stopTimer();
                    }
                } else {
                    DOM.feedbackMsg.innerHTML = `😓 Level failed: ${percent.toFixed(0)}% (need 80%). Restarting Level ${currentLevel+1}. Try again!`;
                    resetLevelAndRetry();
                }
            }
            waitingForNext = false;
        }, 2000);
    }
    
    function resetLevelAndRetry() {
        currentQIndex = 0;
        score = 0;
        totalAnswered = 0;
        answerSubmitted = false;
        for (let q of fullBank[currentLevel]) q.hintShown = false;
        loadQuestion();
    }
    
    function initLevel() {
        currentQIndex = 0;
        score = 0;
        totalAnswered = 0;
        answerSubmitted = false;
        waitingForNext = false;
        gameActive = true;
        for (let q of fullBank[currentLevel]) q.hintShown = false;
        DOM.nextBtn.disabled = false;
        DOM.levelDisplay.innerText = `Level ${currentLevel+1}`;
        loadQuestion();
    }
    
    function loadQuestion() {
        stopTimer();
        answerSubmitted = false;
        DOM.answerInput.disabled = false;
        DOM.submitAnswerBtn.disabled = false;
        DOM.answerInput.value = "";
        DOM.hintBox.style.display = "none";
        DOM.hintBox.innerHTML = "";
        const qData = fullBank[currentLevel][currentQIndex];
        DOM.questionTxt.innerText = qData.text;
        updateProgressDisplay();
        startTimer(40);
        DOM.feedbackMsg.innerHTML = "✏️ Type your answer. Hints appear when time ≤ 12 seconds. 40 seconds total.";
        DOM.answerInput.focus();
    }
    
    function updateProgressDisplay() {
        let percent = totalAnswered === 0 ? 0 : (score / totalAnswered) * 100;
        DOM.progressText.innerText = `Q: ${currentQIndex+1}/30 | Score: ${score}/${currentQIndex} (${Math.floor(percent)}%) | need 80%`;
    }
    
    // Event Listeners
    DOM.submitAnswerBtn.addEventListener('click', () => {
        if (waitingForNext) { DOM.feedbackMsg.innerHTML = "Please wait, loading..."; return; }
        if (answerSubmitted) { DOM.feedbackMsg.innerHTML = "Already answered this question."; return; }
        const userAnswer = DOM.answerInput.value.trim();
        if (userAnswer === "") { DOM.feedbackMsg.innerHTML = "⚠️ Type an answer before submitting!"; return; }
        answerSubmitted = true;
        recordAnswerAndMove(userAnswer);
    });
    
    DOM.nextBtn.addEventListener('click', () => {
        if (!answerSubmitted && !waitingForNext) {
            DOM.feedbackMsg.innerHTML = "⚠️ You must submit an answer before moving to next question!";
            return;
        }
    });
    
    DOM.speakBtn.addEventListener('click', () => {
        const qText = DOM.questionTxt.innerText;
        if (qText && !waitingForNext) speakText(qText);
        else if (waitingForNext) speakText("Please wait, next question loading.");
    });
    
    DOM.answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (!answerSubmitted && !waitingForNext) DOM.submitAnswerBtn.click();
        }
    });
    
    function startGame() { currentLevel = 0; initLevel(); }
    startGame();
</script>
</body>
</html>
