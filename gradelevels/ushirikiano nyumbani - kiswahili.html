<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ushirikiano Nyumbani - Mchezo wa CBC Darasa la 2 | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #F9A825 0%, #F57F17 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #FFF8E1;
            background-image: radial-gradient(circle at 10% 30%, rgba(250,180,80,0.15) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 70px 70px 70px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #FF8F00;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #E65100;
        }

        .level-badge, .score-badge, .progress-badge {
            background: #2c2b28;
            color: #FFD54F;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 -2px 0 #4b3a1e, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #1f2c0e;
            padding: 5px 15px;
            border-radius: 50px;
            color: #FFD54F;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
        }

        .story-card {
            background: #FFFDE7;
            margin: 20px 25px;
            padding: 20px 25px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
        }

        .narrative-text {
            font-size: 1.4rem;
            line-height: 1.4;
            font-weight: 600;
            color: #BF360C;
            text-shadow: 1px 1px 0 #FFE0B2;
            background: #FFF3E0;
            padding: 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: #FFE0B2;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            color: #BF360C;
            margin: 15px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .option-btn {
            background: #FFE0B2;
            border: 4px solid #FF8F00;
            font-size: 1.2rem;
            padding: 15px 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #E65100;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s;
            text-align: left;
            font-family: inherit;
            box-shadow: 0 5px 0 #EF6C00;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            background: #FF8F00;
            color: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-left: 8px;
            box-shadow: inset 0 -1px 0 #E65100;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #EF6C00;
        }

        .option-btn:hover {
            background: #FFCC80;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .next-area {
            text-align: center;
            margin: 20px 0 10px;
        }

        .next-btn {
            background: #FF8F00;
            border: none;
            font-size: 1.5rem;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #E65100;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #E65100;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-message {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px;
            font-weight: bold;
            background: #FFE0B2;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            border-radius: 30px;
        }

        footer {
            background: #FFCC80;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #BF360C;
        }

        @media (max-width: 650px) {
            .narrative-text { font-size: 1.1rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 5px; }
            .option-prefix { width: 32px; height: 32px; font-size: 1rem; }
            .level-badge, .score-badge { font-size: 0.8rem; }
        }

        .correct-fx {
            background: #A5D6A7 !important;
            border-color: #2E7D32 !important;
        }

        .wrong-fx {
            background: #EF9A9A !important;
            border-color: #C62828 !important;
        }
        
        .heart-glow {
            display: inline-block;
            animation: pulse 0.4s ease;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 0</div>
        <div class="progress-badge" id="progressDisplay">Swali: 1 / 40</div>
        <div class="timer-area">⏱️ <span id="timerSeconds">40</span> s</div>
    </div>
    <div class="story-card">
        <div class="narrative-text" id="storyNarrative">🏠 Ushirikiano Nyumbani! Familia inafanya kazi pamoja kwa amani na upendo! 🤝</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ Swali linalofuata</button>
        </div>
        <div style="text-align: center; margin-top: 8px;"><span id="feedbackMsg" class="info-message">✨ Chagua jibu (A, B, C, au D)</span></div>
    </div>
    <footer>🎵 "Ushirikiano Nyumbani" - Kusikiliza, Kuzungumza, Kusoma na Kuandika 🎵</footer>
</div>

<script>
    // ------------------- INTRO SONG (Ushirikiano Nyumbani - warm family cooperation theme) ------------------
    function playIntroSong() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration, vol = 0.3) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            // Warm, harmonious melody representing family cooperation
            playNote(523.25, now, 0.3);
            playNote(587.33, now + 0.35, 0.3);
            playNote(659.25, now + 0.7, 0.35);
            playNote(523.25, now + 1.1, 0.3);
            playNote(783.99, now + 1.45, 0.35);
            playNote(698.46, now + 1.85, 0.3);
            playNote(659.25, now + 2.2, 0.4);
            playNote(587.33, now + 2.6, 0.35);
            playNote(523.25, now + 3.0, 0.5);
            playNote(659.25, now + 3.5, 0.35);
            playNote(783.99, now + 3.9, 0.4);
            playNote(880.00, now + 4.3, 0.45);
        } catch(e) { console.log("audio context error", e); }
    }

    // Voice synthesis in Kiswahili
    function speakKiswahili(text, type = "info") {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "sw-KE";
            utterance.rate = 0.9;
            utterance.pitch = (type === "correct") ? 1.15 : (type === "wrong" ? 0.85 : 1.0);
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.log("speech error", e); }
    }

    // ------------------------------------------------------------------
    // 200 UNIQUE QUESTIONS about "Ushirikiano Nyumbani" (Cooperation at Home)
    // Topics: Kusikiliza, Kuzungumza, Kusoma, Kuandika
    // Focus on family members working together, helping each other, sharing responsibilities
    // ------------------------------------------------------------------
    
    // Rich pool of family cooperation scenarios
    const cooperationScenarios = [
        { nar: "Mama anapika chakula jikoni. Binti anamsaidia kukata mboga.", q: "Binti anamfanyia mama nini?", correct: "Anamsaidia kukata mboga", wrongs: ["Anacheza", "Analala", "Anasoma", "Anaogelea"] },
        { nar: "Baba anafagia nyumba. Mtoto anamchukulia maji ya kunywa.", q: "Mtoto anamletea baba nini?", correct: "Maji ya kunywa", wrongs: ["Chakula", "Kitabu", "Kalamu", "Mpira"] },
        { nar: "Kusikiliza: Kaka anamfundisha mdogo wake kusoma herufi. Wanafanya kazi pamoja.", q: "Kaka anamfundisha nani?", correct: "Mdogo wake", wrongs: ["Mama", "Baba", "Rafiki", "Mwalimu"] },
        { nar: "Soma: 'Familia ya Mwema inasaidiana kazi za nyumbani kila siku.'", q: "Familia ya Mwema inafanya nini kila siku?", correct: "Kusaidiwana kazi za nyumbani", wrongs: ["Kugombana", "Kucheza tu", "Kulala tu", "Kutazama TV"] },
        { nar: "Kuandika: Taja herufi ya kwanza ya neno 'ushirikiano'.", q: "Herufi ya mwanzo ya 'ushirikiano' ni?", correct: "U", wrongs: ["S", "H", "R", "K"] },
        { nar: "Kaka na dada wanapanga vyombo baada ya chakula. Wanafurahia kazi hiyo.", q: "Kaka na dada wanapanga nini?", correct: "Vyombo", wrongs: ["Vitabu", "Viatu", "Nguo", "Michezo"] },
        { nar: "Baba anamfundisha mtoto jinsi ya kufunga viatu. Mtoto anajifunza kwa bidii.", q: "Baba anamfundisha mtoto nini?", correct: "Kufunga viatu", wrongs: ["Kupika", "Kusoma", "Kuogelea", "Kukimbia"] },
        { nar: "Kusikiliza: Mama anasema 'Tusaidiane ili nyumba yetu iwe safi na nadhifu.'", q: "Mama anataka nini?", correct: "Nyumba iwe safi", wrongs: ["Nyumba iwe na kelele", "Nyumba iwe giza", "Nyumba iwe na wageni", "Nyumba iwe na wadudu"] },
        { nar: "Soma: 'Ushirikiano hufanya kazi kuwa nyepesi na haraka.'", q: "Ushirikiano hufanya kazi kuwa nini?", correct: "Nyepesi na haraka", wrongs: ["Nzito", "Ngumu", "Tatanishi", "Bure"] },
        { nar: "Kuandika: Neno 'nyumbani' lina herufi ngapi?", q: "Neno 'nyumbani' lina herufi ngapi?", correct: "Saba", wrongs: ["Sita", "Nane", "Tano", "Nne"] },
        { nar: "Watoto wanamwagiwa maji ya kunywa na mama. Wanamshukuru kwa pamoja.", q: "Watoto wanamshukuru nani?", correct: "Mama", wrongs: ["Baba", "Kaka", "Dada", "Rafiki"] },
        { nar: "Baba anamwaga taka. Mtoto anamfungulia mlango wa nje.", q: "Mtoto anamfungulia baba nini?", correct: "Mlango", wrongs: ["Dirisha", "Lango", "Kabati", "Fumbatio"] },
        { nar: "Kusikiliza: Familia inanywesha maua bustanini. Kila mmoja anabeba ndoo ya maji.", q: "Familia inanywesha nini?", correct: "Maua", wrongs: ["Nyasi", "Miti", "Mboga", "Matunda"] },
        { nar: "Soma: 'Kaka alianguka akicheza. Dada alimsaidia kuamka na kumpa maji.'", q: "Dada alimsaidia nani?", correct: "Kaka", wrongs: ["Mama", "Baba", "Mdogo", "Rafiki"] },
        { nar: "Kuandika: Taja herufi ya mwisho ya neno 'ushirikiano'.", q: "Herufi ya mwisho ya 'ushirikiano' ni?", correct: "O", wrongs: ["U", "S", "H", "N"] },
        { nar: "Mama anamfunulia mtoto zawadi ya siku ya kuzaliwa. Mtoto anaruka kwa furaha.", q: "Mama anamfunulia mtoto nini?", correct: "Zawadi", wrongs: ["Kitabu", "Mpira", "Maji", "Chakula"] },
        { nar: "Baba na mtoto wanapanda mboga bustanini. Wanafanya kazi kwa upendo.", q: "Baba na mtoto wanapanda nini?", correct: "Mboga", wrongs: ["Maua", "Miti", "Matunda", "Nyasi"] },
        { nar: "Kusikiliza: Kengele ya mlango inalia. Kaka anakwenda kufungua kwa haraka.", q: "Kaka anafungua nini?", correct: "Mlango", wrongs: ["Dirisha", "Lango", "Kabati", "Fumbatio"] },
        { nar: "Soma: 'Ushirikiano nyumbani hufanya familia kuwa na amani na furaha.'", q: "Ushirikiano hufanya familia kuwa na nini?", correct: "Amani na furaha", wrongs: ["Hasira na wivu", "Ugumu na shida", "Kelele na fitina", "Uchovu na uzembe"] },
        { nar: "Kuandika: Andika sentensi 'Tunasaidiana nyumbani.' Herufi ya kwanza ni?", q: "Herufi ya kwanza ya 'Tunasaidiana' ni?", correct: "T", wrongs: ["U", "N", "S", "A"] }
    ];
    
    // Shuffle array randomly
    function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
    
    // Generate distinct question for each level and index
    function generateDistinctQuestion(level, qIndex) {
        const scenarioIndex = (level * 31 + qIndex * 41) % cooperationScenarios.length;
        const base = cooperationScenarios[scenarioIndex];
        
        const levelNames = ["Mwanzo", "Kuelimika", "Ustadi", "Upeo", "Bingwa"];
        const levelName = levelNames[level - 1];
        
        const topicType = qIndex % 4;
        let topicPrefix = "";
        if (topicType === 0) topicPrefix = "🎧 Kusikiliza: ";
        else if (topicType === 1) topicPrefix = "💬 Kuzungumza: ";
        else if (topicType === 2) topicPrefix = "📖 Kusoma: ";
        else topicPrefix = "✍️ Kuandika: ";
        
        let narrative = `${topicPrefix}${base.nar} [L${level}Q${qIndex}] - Ngazi ${levelName} ya Ushirikiano Nyumbani.`;
        let question = base.q;
        let correctAnswer = base.correct;
        
        // Add variation for uniqueness
        if (qIndex % 5 === 2) {
            question = `Kuhusu ushirikiano nyumbani, ${question.toLowerCase()}`;
        }
        if (qIndex % 7 === 3) {
            narrative = `🏡 ${narrative} Familia inasaidiana kwa upendo!`;
        }
        if (qIndex % 9 === 4) {
            narrative = `🤝 ${narrative} Ushirikiano huleta baraka!`;
        }
        
        // Build 4 options
        let allOptions = [correctAnswer];
        for (let w of base.wrongs) {
            if (!allOptions.includes(w) && allOptions.length < 4) {
                allOptions.push(w);
            }
        }
        const fallbacks = ["Sijui", "Labda", "Pengine", "Hapana", "Ndiyo", "Asante", "Nyumbani", "Ushirikiano"];
        for (let f of fallbacks) {
            if (!allOptions.includes(f) && allOptions.length < 4) {
                allOptions.push(f);
            }
        }
        
        // Randomly shuffle answers to A, B, C, D
        const shuffledOptions = shuffleArray(allOptions);
        
        return { narrative, question, options: shuffledOptions, correctAnswer };
    }
    
    // Build 200 unique questions (5 levels x 40)
    let questionBank = [];
    const usedQuestions = new Set();
    
    for (let lvl = 1; lvl <= 5; lvl++) {
        let levelQuestions = [];
        for (let i = 0; i < 40; i++) {
            let q = generateDistinctQuestion(lvl, i);
            let key = `${q.narrative}|${q.question}`;
            let attempts = 0;
            while (usedQuestions.has(key) && attempts < 30) {
                q = generateDistinctQuestion(lvl, i + attempts * 53);
                key = `${q.narrative}|${q.question}`;
                attempts++;
            }
            usedQuestions.add(key);
            levelQuestions.push(q);
        }
        questionBank.push(levelQuestions);
    }
    
    console.log(`✅ Maswali ${usedQuestions.size} tofauti kabisa kuhusu Ushirikiano Nyumbani!`);
    
    // Game state
    let currentLevel = 1;
    let currentQIndex = 0;
    let scoreInLevel = 0;
    const totalQuestionsInLevel = 40;
    const requiredToPass = 32;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let gameActive = true;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const timerSecondsSpan = document.getElementById('timerSeconds');
    const storyNarrativeDiv = document.getElementById('storyNarrative');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const feedbackSpan = document.getElementById('feedbackMsg');
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!gameActive || waitingForNext || answered) return;
        timeLeft = 40;
        timerSecondsSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext || answered) return;
            if (timeLeft <= 1) {
                if (!answered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                } else {
                    stopTimer();
                }
            } else {
                timeLeft--;
                timerSecondsSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        gameActive = false;
        speakKiswahili("Wakati umekwisha! Jibu sahihi lilikuwa: " + currentQuestionObj.correctAnswer + ". Kumbuka ushirikiano unasaidia!", "timeout");
        feedbackSpan.innerHTML = `⏰ Muda umekwisha! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
        highlightCorrectAnswer();
        disableOptions(true);
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) autoNextAfterTimeout();
        }, 2200);
    }
    
    function autoNextAfterTimeout() {
        if (!waitingForNext) return;
        waitingForNext = false;
        gameActive = true;
        moveToNextQuestion();
    }
    
    function highlightCorrectAnswer() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('data-value') === currentQuestionObj.correctAnswer) {
                btn.style.backgroundColor = "#A5D6A7";
                btn.style.borderColor = "#2E7D32";
            }
        });
    }
    
    function disableOptions(disabled) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (disabled) {
                btn.classList.add('disabled-opt');
            } else {
                btn.classList.remove('disabled-opt');
            }
        });
    }
    
    function handleAnswer(selectedValue, btnElement) {
        if (!gameActive || answered || waitingForNext) return;
        stopTimer();
        answered = true;
        const isCorrect = (selectedValue === currentQuestionObj.correctAnswer);
        if (isCorrect) {
            scoreInLevel++;
            speakKiswahili("Jibu sahihi! Hongera! Wewe ni mstadi wa ushirikiano nyumbani!", "correct");
            feedbackSpan.innerHTML = "✅ Sahihi! Umepata alama! 🏠";
            btnElement.classList.add('correct-fx');
            // Add heart glow effect for correct answer
            const heart = document.createElement('span');
            heart.innerHTML = '❤️';
            heart.className = 'heart-glow';
            feedbackSpan.appendChild(heart);
            setTimeout(() => heart.remove(), 500);
        } else {
            speakKiswahili("Pole! Jibu sahihi ni: " + currentQuestionObj.correctAnswer + ". Soma tena kuhusu ushirikiano!", "wrong");
            feedbackSpan.innerHTML = `❌ Si sahihi! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
            btnElement.classList.add('wrong-fx');
            highlightCorrectAnswer();
        }
        disableOptions(true);
        updateUIStats();
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) moveToNextQuestion();
        }, 2000);
    }
    
    function moveToNextQuestion() {
        waitingForNext = false;
        if (currentQIndex + 1 >= totalQuestionsInLevel) {
            let percentage = (scoreInLevel / totalQuestionsInLevel) * 100;
            if (percentage >= 80) {
                if (currentLevel === 5) {
                    feedbackSpan.innerHTML = "🏆🏆 HONGERA SANA! UMEMALIZA USHIRIKIANO NYUMBANI! WEWE NI BINGWA WA FAMILIA! 🏆🏆";
                    speakKiswahili("Hongera sana! Umemaliza ngazi zote tano za Ushirikiano Nyumbani! Endelea kusaidiana na familia yako kwa upendo!", "correct");
                    gameActive = false;
                    disableOptions(true);
                    nextButton.disabled = true;
                    stopTimer();
                    return;
                } else {
                    currentLevel++;
                    currentQIndex = 0;
                    scoreInLevel = 0;
                    resetLevelUI();
                    loadQuestion();
                    speakKiswahili(`Hongera! Umefika Ngazi ya ${currentLevel} ya Ushirikiano Nyumbani! Endelea kujifunza kuhusu kusaidiwana!`, "correct");
                    feedbackSpan.innerHTML = `🎉🎉 Umepitisha ngazi! Sasa Ngazi ${currentLevel} ya Ushirikiano! 🎉🎉`;
                    return;
                }
            } else {
                feedbackSpan.innerHTML = `😭 Hujapata asilimia 80. Unarudia Ngazi ${currentLevel} ya Ushirikiano Nyumbani. Kumbuka kusaidiwana familia yako! Jaribu tena! 😭`;
                speakKiswahili("Samahani, hujapata alama za kutosha. Rudia ngazi hii ya Ushirikiano Nyumbani tena. Kusaidiwana ni muhimu!", "wrong");
                scoreInLevel = 0;
                currentQIndex = 0;
                resetLevelUI();
                loadQuestion();
                return;
            }
        } else {
            currentQIndex++;
            loadQuestion();
        }
    }
    
    function resetLevelUI() {
        updateUIStats();
        if (timerInterval) stopTimer();
        answered = false;
        waitingForNext = false;
        gameActive = true;
        if (nextButton) nextButton.disabled = false;
    }
    
    function updateUIStats() {
        if (levelDisplay) levelDisplay.innerText = `Ngazi ya ${currentLevel}`;
        if (scoreDisplay) scoreDisplay.innerText = `Alama: ${scoreInLevel} / ${totalQuestionsInLevel}`;
        if (progressDisplay) progressDisplay.innerText = `Swali: ${currentQIndex+1} / ${totalQuestionsInLevel}`;
    }
    
    let currentQuestionObj = null;
    
    function loadQuestion() {
        if (!questionBank[currentLevel-1] || !questionBank[currentLevel-1][currentQIndex]) {
            console.error("Swali halipo");
            return;
        }
        currentQuestionObj = questionBank[currentLevel-1][currentQIndex];
        if (storyNarrativeDiv) storyNarrativeDiv.innerHTML = `🏠 ${currentQuestionObj.narrative}`;
        if (questionTextDiv) questionTextDiv.innerHTML = `❓ ${currentQuestionObj.question}`;
        
        if (optionsContainer) {
            optionsContainer.innerHTML = "";
            const prefixes = ['A', 'B', 'C', 'D'];
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-value', opt);
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'option-prefix';
                prefixSpan.innerText = prefixes[idx];
                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = opt;
                btn.appendChild(prefixSpan);
                btn.appendChild(textSpan);
                btn.addEventListener('click', (e) => {
                    if (!answered && gameActive && !waitingForNext) {
                        handleAnswer(opt, btn);
                    }
                });
                optionsContainer.appendChild(btn);
            });
        }
        
        updateUIStats();
        answered = false;
        gameActive = true;
        waitingForNext = false;
        disableOptions(false);
        stopTimer();
        startTimer();
        if (feedbackSpan) feedbackSpan.innerHTML = "🎤 Chagua jibu (A, B, C, D) - Ushirikiano unasaidia familia! 🎤";
    }
    
    function initGame() {
        currentLevel = 1;
        currentQIndex = 0;
        scoreInLevel = 0;
        answered = false;
        waitingForNext = false;
        gameActive = true;
        loadQuestion();
        playIntroSong();
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo 'Ushirikiano Nyumbani'! Jifunze kuhusu umuhimu wa kusaidiwana na familia yako. Jibu maswali 40 kwa kila ngazi. Pata angalau asilimia 80 kupanda ngazi. Ushirikiano ni nguvu!", "info");
        }, 800);
        
        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (!answered && gameActive && !waitingForNext) {
                    speakKiswahili("Tafadhali jibu swali kwanza!", "info");
                    if (feedbackSpan) feedbackSpan.innerHTML = "⚠️ Jibu swali kabla ya kuendelea! ⚠️";
                    return;
                }
                if (waitingForNext) {
                    if (timerInterval) stopTimer();
                    moveToNextQuestion();
                }
            });
        }
    }
    
    window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
