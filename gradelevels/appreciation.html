<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade 1 CBC: Musical Sounds & Water Safety | Creative Arts</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1b7b8f 0%, #0a4e5e 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffaa4a;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #e07c2c;
        }

        .level-badge {
            background: #2e7d64;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1e5a48, 0 4px 10px rgba(0,0,0,0.1);
        }

        .score-box {
            background: #f9a825;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #2c2c2c;
        }

        .timer-area {
            background: #1f2f3a;
            padding: 6px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: bold;
        }

        .timer-clock {
            font-size: 1.9rem;
            font-family: monospace;
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            letter-spacing: 2px;
        }

        .question-card {
            padding: 30px 35px 20px;
            text-align: center;
        }

        .question-text {
            font-size: 1.8rem;
            background: #fff2df;
            padding: 25px 20px;
            border-radius: 70px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 12px 20px rgba(0,0,0,0.1);
            font-weight: bold;
            margin-bottom: 30px;
            border: 3px solid #ffcf9a;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .voice-btn, .next-btn {
            background: #ffe0b5;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #b97f3a;
            color: #3b2a1f;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .next-btn {
            background: #66bb6a;
            box-shadow: 0 4px 0 #2e6b2f;
            color: white;
        }

        .voice-btn:active, .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b97f3a;
        }

        .next-btn:active {
            box-shadow: 0 1px 0 #2e6b2f;
        }

        .hint-area {
            background: #ffcd94;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #3b2a1f;
            box-shadow: none;
        }

        .answer-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 20px;
        }

        #studentAnswer {
            flex: 2;
            min-width: 200px;
            font-size: 1.5rem;
            padding: 18px 24px;
            border-radius: 60px;
            border: 3px solid #ffb465;
            font-family: inherit;
            text-align: center;
            background: white;
            outline: none;
        }

        .submit-btn {
            background: #4caf50;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e6b2f;
            transition: 0.05s linear;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2e6b2f;
        }

        .feedback {
            margin: 15px 20px 25px;
            padding: 12px;
            font-size: 1.3rem;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
        }

        .progress-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #7b5a3b;
        }

        @media (max-width: 650px) {
            .game-header {
                flex-direction: column;
                text-align: center;
            }
            .question-text {
                font-size: 1.3rem;
            }
            #studentAnswer {
                font-size: 1.2rem;
                padding: 14px 18px;
            }
            .submit-btn {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🎵 LEVEL 1</div>
        <div class="score-box" id="scoreDisplay">✅ SCORE: 0 / 0</div>
        <div class="timer-area">
            ⏱️ TIME LEFT
            <span class="timer-clock" id="timerCountdown">40</span>
        </div>
    </div>

    <div class="question-card">
        <div class="question-text" id="questionText">Loading fun challenge...</div>
        <div class="action-buttons">
            <button class="voice-btn" id="readAloudBtn">🔊 READ QUESTION</button>
            <button class="next-btn" id="nextQuestionBtn">⏩ NEXT QUESTION</button>
        </div>
        <div class="hint-area" id="hintBox">💡 Hint will appear here as time goes</div>
        <div class="answer-area">
            <input type="text" id="studentAnswer" placeholder="Type your answer here..." autocomplete="off">
            <button class="submit-btn" id="submitAnswer">✔️ CHECK ANSWER</button>
        </div>
        <div class="feedback" id="feedbackMsg">🎶 Answer each question! 80% needed to level up.</div>
        <div class="progress-info" id="progressInfo">Question 1 / 30</div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // CBC GRADE 1 GAME: Musical Sounds + Water Safety Awareness
    // Creative Arts Appreciation | 5 levels x 30 unique questions
    // Timer 40s | Voice Output | Hints | No multiple choice
    // --------------------------------------------------------------
    
    // Speech helper
    function speakText(text, isTimeUp = false) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        if (isTimeUp) utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    }
    
    // ---------- LARGE UNIQUE QUESTION BANK (2 topics: Musical Sounds & Water Safety) ----------
    const allQuestions = [];
    
    // TOPIC 1: MUSICAL SOUNDS (pitch, dynamics, timbre, instruments, listening)
    const musicSoundsBank = [
        { text: "What do we call how high or low a sound is?", correct: "pitch", alt: "high low", topic: "Musical Sounds" },
        { text: "Loud and soft in music is called ___", correct: "dynamics", alt: "volume", topic: "Musical Sounds" },
        { text: "Which instrument makes a sound when you blow into it?", correct: "flute", alt: "recorder", topic: "Musical Sounds" },
        { text: "Name a percussion instrument you shake.", correct: "maraca", alt: "shaker", topic: "Musical Sounds" },
        { text: "What do you call a repeated pattern of sound?", correct: "rhythm", alt: "beat", topic: "Musical Sounds" },
        { text: "A guitar makes sound when you ___ the strings.", correct: "pluck", alt: "strum", topic: "Musical Sounds" },
        { text: "The quality of a sound (like bright or dark) is called ___", correct: "timbre", alt: "tone color", topic: "Musical Sounds" },
        { text: "What word means very loud in music?", correct: "forte", alt: "loud", topic: "Musical Sounds" },
        { text: "What word means very soft in music?", correct: "piano", alt: "soft", topic: "Musical Sounds" },
        { text: "Name a brass instrument that you blow into.", correct: "trumpet", alt: "horn", topic: "Musical Sounds" },
        { text: "The speed of the music is called ___", correct: "tempo", alt: "speed", topic: "Musical Sounds" },
        { text: "Which instrument has black and white keys?", correct: "piano", alt: "keyboard", topic: "Musical Sounds" },
        { text: "What do you call a person who makes music?", correct: "musician", alt: "singer", topic: "Musical Sounds" },
        { text: "A drum makes sound when you ___ it.", correct: "hit", alt: "strike", topic: "Musical Sounds" },
        { text: "What do you call the leader of an orchestra?", correct: "conductor", alt: "director", topic: "Musical Sounds" },
        { text: "Which string instrument is played with a bow?", correct: "violin", alt: "cello", topic: "Musical Sounds" },
        { text: "Sound travels through the ___", correct: "air", alt: "waves", topic: "Musical Sounds" },
        { text: "What do we call silence in music?", correct: "rest", alt: "pause", topic: "Musical Sounds" },
        { text: "Name a woodwind instrument.", correct: "clarinet", alt: "saxophone", topic: "Musical Sounds" },
        { text: "High pitched sounds are called ___ sounds.", correct: "high", alt: "treble", topic: "Musical Sounds" },
        { text: "Low pitched sounds are called ___ sounds.", correct: "low", alt: "bass", topic: "Musical Sounds" },
        { text: "What do you call a group of singers?", correct: "choir", alt: "chorus", topic: "Musical Sounds" },
        { text: "A song that tells a story is called a ___", correct: "ballad", alt: "story song", topic: "Musical Sounds" },
        { text: "What instrument uses a reed to make sound?", correct: "saxophone", alt: "clarinet", topic: "Musical Sounds" },
        { text: "The pattern of long and short sounds is ___", correct: "rhythm", alt: "beat pattern", topic: "Musical Sounds" }
    ];
    
    // TOPIC 2: WATER SAFETY AWARENESS (pools, beaches, life jackets, rules)
    const waterSafetyBank = [
        { text: "What should you wear when swimming in deep water?", correct: "life jacket", alt: "life vest", topic: "Water Safety" },
        { text: "True or false: You should run near a swimming pool.", correct: "false", alt: "no", topic: "Water Safety" },
        { text: "Who should watch you when you are swimming?", correct: "adult", alt: "grown up", topic: "Water Safety" },
        { text: "What do you call a person who saves people from drowning?", correct: "lifeguard", alt: "guard", topic: "Water Safety" },
        { text: "Before swimming in a pool, you should ___ first.", correct: "shower", alt: "rinse", topic: "Water Safety" },
        { text: "If you can't swim, you should stay in the ___ end.", correct: "shallow", alt: "shallow", topic: "Water Safety" },
        { text: "What should you do if you see someone struggling in water?", correct: "call for help", alt: "get adult", topic: "Water Safety" },
        { text: "Name a safe place to swim.", correct: "pool", alt: "beach with lifeguard", topic: "Water Safety" },
        { text: "What floating toy can help you learn to swim?", correct: "kickboard", alt: "floaties", topic: "Water Safety" },
        { text: "True or false: You can swim alone without anyone watching.", correct: "false", alt: "no", topic: "Water Safety" },
        { text: "What color flag means the beach is safe to swim?", correct: "green", alt: "green flag", topic: "Water Safety" },
        { text: "What should you learn to be safe in water?", correct: "swimming", alt: "swim", topic: "Water Safety" },
        { text: "Name a rule at the water park.", correct: "no running", alt: "walk", topic: "Water Safety" },
        { text: "What do you wear on your feet at the pool?", correct: "sandals", alt: "flip flops", topic: "Water Safety" },
        { text: "Deep water is dangerous for ___ swimmers.", correct: "beginner", alt: "new", topic: "Water Safety" },
        { text: "What should you check before jumping into water?", correct: "depth", alt: "how deep", topic: "Water Safety" },
        { text: "If you feel tired while swimming, you should ___", correct: "rest", alt: "float", topic: "Water Safety" },
        { text: "What do you call a rope that saves a drowning person?", correct: "rescue line", alt: "throw rope", topic: "Water Safety" },
        { text: "Never push others into the ___", correct: "water", alt: "pool", topic: "Water Safety" },
        { text: "What should you do before going on a boat?", correct: "wear life jacket", alt: "life vest", topic: "Water Safety" },
        { text: "What does 'splash' mean?", correct: "water flying", alt: "splashing", topic: "Water Safety" },
        { text: "At the beach, always swim between the red and ___ flags.", correct: "yellow", alt: "yellow flags", topic: "Water Safety" },
        { text: "What is a dangerous ocean current called?", correct: "rip current", alt: "rip", topic: "Water Safety" },
        { text: "What do you call a floatation device for your arms?", correct: "water wings", alt: "arm floaties", topic: "Water Safety" },
        { text: "If you are cold in the water, you should get ___", correct: "out", alt: "exit", topic: "Water Safety" }
    ];
    
    // Combine both topics (50 unique base questions, 25 each)
    [...musicSoundsBank, ...waterSafetyBank].forEach(q => allQuestions.push({...q}));
    
    // Generate 30 UNIQUE questions per level with balanced topics (15 each)
    function generateLevelQuestions(levelNum) {
        // Shuffle master bank
        const shuffled = [...allQuestions];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        // Group by topic
        const musicQs = shuffled.filter(q => q.topic === "Musical Sounds");
        const waterQs = shuffled.filter(q => q.topic === "Water Safety");
        
        // Take 15 from each to make 30
        let selected = [];
        selected.push(...musicQs.slice(0, 15));
        selected.push(...waterQs.slice(0, 15));
        
        // If less than 30 (should not happen, we have 25+ each), fill more
        while (selected.length < 30) {
            selected.push(shuffled[selected.length % shuffled.length]);
        }
        if (selected.length > 30) selected = selected.slice(0, 30);
        
        // Shuffle the final set
        for (let i = selected.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [selected[i], selected[j]] = [selected[j], selected[i]];
        }
        
        // Ensure uniqueness by text (no repeats within level)
        const unique = [];
        const seen = new Set();
        for (let q of selected) {
            if (!seen.has(q.text)) {
                seen.add(q.text);
                unique.push(q);
            }
        }
        // If after dedup we have less than 30, fill with fallback
        while (unique.length < 30) {
            unique.push(allQuestions[unique.length % allQuestions.length]);
        }
        return unique.slice(0, 30);
    }
    
    // Pre-generate 5 levels (each with fresh unique questions, different each time)
    // We'll generate on level load so questions are always fresh and no repetition across levels
    // But we need to ensure no repetition WITHIN a level (already done)
    
    // GAME STATE
    let currentLevel = 0;
    let currentQIndex = 0;
    let currentQuestions = [];
    let correctCount = 0;
    let answeredCount = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForAnswer = true;
    let answerSubmitted = false;
    let currentQuestion = null;
    let gameActive = true;
    let levelLocked = false;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerSpan = document.getElementById('timerCountdown');
    const questionDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('studentAnswer');
    const submitBtn = document.getElementById('submitAnswer');
    const readBtn = document.getElementById('readAloudBtn');
    const nextBtn = document.getElementById('nextQuestionBtn');
    const hintBoxDiv = document.getElementById('hintBox');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const progressSpan = document.getElementById('progressInfo');
    
    function updateUI() {
        scoreDisplay.innerText = `✅ SCORE: ${correctCount} / ${answeredCount}`;
        progressSpan.innerText = `Question ${answeredCount + 1} / ${currentQuestions.length}`;
    }
    
    function updateHint(seconds, q) {
        if (!q) return;
        const topicEmoji = q.topic === "Musical Sounds" ? "🎵" : "💧";
        if (seconds > 28) {
            hintBoxDiv.innerHTML = `${topicEmoji} Topic: ${q.topic}. Think about your lessons!`;
        } else if (seconds > 18) {
            hintBoxDiv.innerHTML = `🔎 Hint: The answer starts with "${q.correct[0]}"... Try your best!`;
        } else if (seconds > 8) {
            hintBoxDiv.innerHTML = `✨ Strong hint: The answer is "${q.correct}". Type it now!`;
        } else if (seconds > 2) {
            hintBoxDiv.innerHTML = `🚀 Last ${seconds} seconds! Answer: "${q.correct}" . Quickly!`;
        } else {
            hintBoxDiv.innerHTML = "⏰ Almost out of time! Type the answer!";
        }
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        if (timerInterval) stopTimer();
        timeLeft = 40;
        timerSpan.innerText = timeLeft;
        updateHint(timeLeft, currentQuestion);
        timerInterval = setInterval(() => {
            if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (waitingForAnswer && !answerSubmitted) {
                    speakText("Time is up!", true);
                    waitingForAnswer = false;
                    answerSubmitted = true;
                    feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                    feedbackDiv.style.background = "#ffccbb";
                    setTimeout(() => {
                        if (!levelLocked) moveToNext();
                    }, 1500);
                }
            } else {
                timeLeft--;
                timerSpan.innerText = timeLeft;
                updateHint(timeLeft, currentQuestion);
            }
        }, 1000);
    }
    
    function checkAnswer() {
        if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) {
            feedbackDiv.innerHTML = "⚠️ Wait! Already answered or question finished.";
            return;
        }
        const userAnswer = answerInput.value.trim().toLowerCase();
        if (userAnswer === "") {
            speakText("Please type an answer.");
            feedbackDiv.innerHTML = "✏️ Type your answer before checking!";
            return;
        }
        
        const correctAns = currentQuestion.correct.toLowerCase();
        const altAns = currentQuestion.alt ? currentQuestion.alt.toLowerCase() : "";
        const isCorrect = (userAnswer === correctAns) || (altAns !== "" && userAnswer === altAns);
        
        answerSubmitted = true;
        waitingForAnswer = false;
        stopTimer();
        
        if (isCorrect) {
            correctCount++;
            speakText("Correct! Great job!");
            feedbackDiv.innerHTML = "🎉 CORRECT! +1 point 🎉";
            feedbackDiv.style.background = "#c8e6c9";
        } else {
            speakText(`Incorrect. The correct answer is ${currentQuestion.correct}.`);
            feedbackDiv.innerHTML = `❌ INCORRECT! The right answer: "${currentQuestion.correct}". Keep trying!`;
            feedbackDiv.style.background = "#ffcdd2";
        }
        answeredCount++;
        updateUI();
        submitBtn.disabled = true;
        answerInput.disabled = true;
    }
    
    function moveToNext() {
        if (levelLocked) return;
        if (answeredCount >= currentQuestions.length) {
            finishLevel();
            return;
        }
        currentQIndex++;
        loadQuestion(currentQIndex);
    }
    
    function finishLevel() {
        let percent = (correctCount / currentQuestions.length) * 100;
        if (percent >= 80) {
            if (currentLevel + 1 < 5) {
                speakText(`Excellent! You passed level ${currentLevel+1} with ${Math.floor(percent)} percent. Get ready for level ${currentLevel+2}.`);
                feedbackDiv.innerHTML = `🎊 LEVEL UP! 🎊 You scored ${correctCount}/${currentQuestions.length} (${Math.floor(percent)}%) → Next Level!`;
                feedbackDiv.style.background = "#ffecb3";
                currentLevel++;
                loadLevel(currentLevel);
            } else {
                gameActive = false;
                stopTimer();
                levelLocked = true;
                feedbackDiv.innerHTML = `🏆🏆🏆 GRAND CHAMPION! You completed all 5 levels! Final score: ${correctCount}/${currentQuestions.length} 🏆🏆🏆`;
                speakText("Congratulations! You finished the CBC Grade 1 challenge! You are a superstar!");
                submitBtn.disabled = true;
                readBtn.disabled = true;
                nextBtn.disabled = true;
                answerInput.disabled = true;
                timerSpan.innerText = "🎉";
                return;
            }
        } else {
            speakText(`Oh no! You got ${correctCount} out of ${currentQuestions.length}. Need 80% to pass. Restarting level ${currentLevel+1} with new questions.`);
            feedbackDiv.innerHTML = `⚠️ ${Math.floor(percent)}% only. Need 80% to pass. Same level restarts with fresh questions! ⚠️`;
            feedbackDiv.style.background = "#ffb3ba";
            loadLevel(currentLevel);
        }
    }
    
    function loadQuestion(index) {
        if (index >= currentQuestions.length) {
            finishLevel();
            return;
        }
        currentQuestion = currentQuestions[index];
        questionDiv.innerText = currentQuestion.text;
        waitingForAnswer = true;
        answerSubmitted = false;
        submitBtn.disabled = false;
        answerInput.disabled = false;
        answerInput.value = "";
        answerInput.focus();
        feedbackDiv.style.background = "#fff3e0";
        feedbackDiv.innerHTML = "🎤 Type your answer and click CHECK!";
        updateUI();
        if (timerInterval) stopTimer();
        startTimer();
    }
    
    function loadLevel(levelIdx) {
        levelLocked = false;
        gameActive = true;
        currentLevel = levelIdx;
        currentQIndex = 0;
        correctCount = 0;
        answeredCount = 0;
        // Generate fresh unique questions for this level (balanced: 15 music, 15 water safety)
        currentQuestions = generateLevelQuestions(levelIdx);
        levelDisplay.innerText = `🎵 LEVEL ${currentLevel+1} 🎵`;
        updateUI();
        loadQuestion(0);
    }
    
    function readQuestion() {
        if (currentQuestion && gameActive && !levelLocked) {
            speakText(currentQuestion.text);
        } else if (!currentQuestion) {
            speakText("No question loaded");
        }
    }
    
    function manualNext() {
        if (levelLocked || !gameActive) {
            feedbackDiv.innerHTML = "⚠️ Level transition or game finished!";
            return;
        }
        if (waitingForAnswer && !answerSubmitted) {
            feedbackDiv.innerHTML = "⚠️ You haven't answered yet! Please check your answer first.";
            speakText("Please check your answer before moving.");
            return;
        }
        if (answerSubmitted && !waitingForAnswer) {
            stopTimer();
            moveToNext();
        }
    }
    
    // Event listeners
    submitBtn.addEventListener('click', checkAnswer);
    readBtn.addEventListener('click', readQuestion);
    nextBtn.addEventListener('click', manualNext);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !answerSubmitted && waitingForAnswer) {
            checkAnswer();
        }
    });
    
    // Start game at level 1
    loadLevel(0);
</script>
</body>
</html>
