<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Population Mapper | Grade 4 Social Studies | Distribution Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a3f2c 0%, #0c2416 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #4a7c5e, #2a5c42);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #0e3a1a;
            color: white;
            text-shadow: 2px 2px 0 #0a3a1a;
        }

        .level-badge {
            background: #0a2e1a;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #2e7a4a, 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #071a0e;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 0 3px #c9f2c7, 0 6px 0 #0a2a12;
        }

        .timer-number {
            background: #000000;
            padding: 6px 20px;
            border-radius: 50px;
            color: #7eff9e;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e8ddc5;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #2c5a2a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-card {
            padding: 30px 28px 20px;
            background: #fffaf0;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            background: #eef5e5;
            padding: 24px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 18px rgba(0,0,0,0.1);
            color: #1e3a1e;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa8e6c;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #3c7e5a;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #1c4a2a;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.correct-highlight .option-prefix {
            background: #1b5e20;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn.wrong-highlight .option-prefix {
            background: #8b2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #f4a261;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 45px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #c45c1a;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #2c4a2a;
            color: #e8f5e0;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px solid #f5bc70;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 0.95rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
            .timer-number { font-size: 1.5rem; min-width: 75px; letter-spacing: 2px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-critical {
            background: #8b0000 !important;
            color: #ffcc44 !important;
            text-shadow: 0 0 4px red;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.85; transform: scale(1.03);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .distribution-icon {
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">📍 LEVEL <span id="levelNum">1</span> 🗺️</div>
        <div class="timer-area">⏱️ TIME LEFT <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 80% TO PASS → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading population distribution map...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">📍 POPULATION DISTRIBUTION MASTER! Learn where people live and why. Timer is RUNNING — become a demography expert!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC SOCIAL STUDIES: POPULATION DISTRIBUTION
    // Topics: Sparse vs Dense population, Factors affecting distribution (climate, water, jobs, land, etc.)
    // Population patterns in Kenya, Rural vs Urban distribution, Maps and population density
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- BANK 1: POPULATION DISTRIBUTION BASICS ----------
    const basicsBank = [
        { q: "What does 'population distribution' mean?", correct: "How people are spread across an area", options: ["Total number of people", "How people are spread across an area", "Number of births per year", "Number of houses"] },
        { q: "An area with many people living close together has:", correct: "Dense population", options: ["Sparse population", "Dense population", "No population", "Average population"] },
        { q: "An area with very few people living far apart has:", correct: "Sparse population", options: ["Dense population", "Sparse population", "Crowded population", "Urban population"] },
        { q: "Which Kenyan county has the most dense population?", correct: "Nairobi", options: ["Turkana", "Nairobi", "Marsabit", "Samburu"] },
        { q: "Which Kenyan county has very sparse population due to arid climate?", correct: "Turkana", options: ["Kiambu", "Turkana", "Kisumu", "Nakuru"] },
        { q: "A population density map uses colors to show:", correct: "Where people live (light/dark for few/many)", options: ["Weather patterns", "Where people live", "Animal habitats", "Road networks"] },
        { q: "Population distribution is NOT the same as:", correct: "Total population count", options: ["Where people live", "How crowded an area is", "Total population count", "Settlement patterns"] }
    ];

    // ---------- BANK 2: FACTORS AFFECTING POPULATION DISTRIBUTION ----------
    const factorsBank = [
        { q: "People prefer to live in areas with:", correct: "Reliable water supply", options: ["Deserts", "Reliable water supply", "High mountains", "Swamps"] },
        { q: "Why do few people live in very dry areas (deserts)?", correct: "Lack of water and pasture", options: ["Too many schools", "Lack of water and pasture", "Too much rain", "Many jobs"] },
        { q: "Good soil for farming attracts:", correct: "More people (dense population)", options: ["Fewer people", "More people (dense population)", "Only animals", "No effect"] },
        { q: "Areas with many job opportunities have:", correct: "High population density", options: ["Low population density", "High population density", "No population", "Seasonal population"] },
        { q: "Steep mountains and dense forests usually have:", correct: "Sparse population", options: ["Sparse population", "Dense population", "Very dense population", "Same as cities"] },
        { q: "Near a large lake like Lake Victoria, population tends to be:", correct: "Dense (fishing and farming)", options: ["Sparse", "Dense", "No people", "Only tourists"] },
        { q: "Poor transport and remote location lead to:", correct: "Sparse population", options: ["Dense population", "Sparse population", "Urban growth", "More industries"] },
        { q: "Areas with minerals (gold, soda ash) attract:", correct: "Workers and dense settlements", options: ["No one", "Workers and dense settlements", "Only wild animals", "Desert conditions"] }
    ];

    // ---------- BANK 3: URBAN VS RURAL DISTRIBUTION ----------
    const urbanRuralBank = [
        { q: "Urban areas (cities) have ________ population distribution.", correct: "Dense", options: ["Sparse", "Dense", "Even", "Scattered"] },
        { q: "Rural areas (villages) usually have:", correct: "More spread out (less dense) population", options: ["Very crowded", "More spread out population", "Skyscrapers", "No farms"] },
        { q: "Which is an example of an urban area in Kenya with dense population?", correct: "Nairobi", options: ["Lamu Island", "Nairobi", "Marsabit town", "Tana River"] },
        { q: "Why do people move from rural to urban areas?", correct: "To look for jobs and better services", options: ["To farm more", "To look for jobs and better services", "To avoid schools", "To find wild animals"] },
        { q: "Movement of people from villages to cities affects distribution by:", correct: "Making cities denser and villages sparser", options: ["Making cities empty", "Making cities denser and villages sparser", "No change", "Equalizing everything"] },
        { q: "Which county has both dense urban core (city) and sparse rural areas?", correct: "Nairobi/Kiambu", options: ["Turkana", "Nairobi/Kiambu", "Wajir", "Mandera"] },
        { q: "In rural areas, houses are usually:", correct: "Far apart (sparse settlement)", options: ["Far apart (sparse settlement)", "Stacked on top of each other", "Very tall", "In skyscrapers"] }
    ];

    // ---------- BANK 4: KENYA'S POPULATION DISTRIBUTION PATTERNS ----------
    const kenyaPatternsBank = [
        { q: "The central highlands (around Mt. Kenya) have dense population because:", correct: "Good climate and fertile volcanic soil", options: ["Desert conditions", "Good climate and fertile volcanic soil", "Swamps", "Lack of water"] },
        { q: "Northern Kenya (Turkana, Marsabit) has sparse population due to:", correct: "Arid climate and scarce water", options: ["Many lakes", "Arid climate and scarce water", "Thick forests", "Many cities"] },
        { q: "The Lake Victoria basin (Kisumu, Homa Bay) has:", correct: "Moderate to dense population (fishing, farming)", options: ["Very sparse", "Moderate to dense population", "No population", "Only tourists"] },
        { q: "The coastal strip (Mombasa, Kilifi) has:", correct: "Dense population near towns, sparser inland", options: ["Uniformly dense", "Dense near towns, sparser inland", "No people", "Only forests"] },
        { q: "Which region of Kenya has the highest overall population density?", correct: "Central & Nairobi region", options: ["North Eastern", "Central & Nairobi region", "Rift Valley north", "Coast hinterland"] },
        { q: "Why is the North Eastern region (Garissa, Wajir) sparsely populated?", correct: "Low rainfall, high temperatures, scarce water", options: ["Too many rivers", "Low rainfall, high temperatures, scarce water", "Too many cities", "Overcrowding"] },
        { q: "The Rift Valley floor around Nakuru has:", correct: "Dense population (good land, jobs, tourism)", options: ["Sparse population", "Dense population", "No settlements", "Only wild animals"] },
        { q: "Which physical feature attracts dense population in Kenya?", correct: "Highlands with fertile soil", options: ["Deserts", "Highlands with fertile soil", "Swamps", "Lava fields"] }
    ];

    // ---------- BANK 5: POPULATION DISTRIBUTION CHALLENGES & EFFECTS ----------
    const challengesBank = [
        { q: "A challenge of dense population in cities is:", correct: "Overcrowding and strain on services", options: ["More farmland", "Overcrowding and strain on services", "Cleaner environment", "Less traffic"] },
        { q: "A challenge of sparse population is:", correct: "Few schools and health facilities", options: ["Many schools", "Few schools and health facilities", "Too much traffic", "High pollution"] },
        { q: "Government can influence distribution by:", correct: "Building industries in less populated areas", options: ["Closing schools everywhere", "Building industries in less populated areas", "Forcing everyone to cities", "Stopping migration"] },
        { q: "Uneven population distribution can cause:", correct: "Some areas overcrowded, others empty", options: ["Perfect balance everywhere", "Some areas overcrowded, others empty", "No problems", "Equal wealth"] },
        { q: "To reduce overcrowding in Nairobi, government can:", correct: "Develop other towns (e.g., Konza, Nakuru)", options: ["Build more houses only", "Develop other towns", "Stop all movement", "Remove schools"] },
        { q: "Sparse population makes it expensive to provide:", correct: "Roads, electricity and water", options: ["Roads, electricity and water", "Toys", "Entertainment only", "Clothes only"] }
    ];

    // Combine all banks into categories
    const categories = [basicsBank, factorsBank, urbanRuralBank, kenyaPatternsBank, challengesBank];
    
    // Build 5 levels (30 Q each, each category contributes 6 per level)
    let levelsData = [];

    function buildGame() {
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            for (let cat of categories) {
                // each category gives 6 questions (total 30 per level)
                for (let i = 0; i < 6; i++) {
                    let source = cat[i % cat.length];
                    let newQ = {
                        text: source.q,
                        options: [...source.options],
                        correct: source.correct
                    };
                    // Add challenge flavor based on level
                    if (lvl >= 3 && i % 2 === 0) newQ.text = "📍 " + newQ.text;
                    if (lvl >= 4) newQ.text = "⭐ " + newQ.text + " ⭐";
                    if (lvl === 5 && i % 3 === 0) newQ.text = "🗺️ DISTRIBUTION MASTER: " + newQ.text;
                    levelQs.push(newQ);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsData.push(levelQs);
        }
    }
    buildGame();

    // ---------- GAME ENGINE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100); // 24

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    // DOM elements
    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const optionsDiv = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Challenging timer: Level1=88s, L2=78s, L3=68s, L4=58s, L5=48s
        const timeMap = {1: 88, 2: 78, 3: 68, 4: 58, 5: 48};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                // TIME'S UP - Level failure
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableAllOptions();
                nextBtn.disabled = true;
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to master population distribution! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ONLY ${levelTimerSec} SECONDS! Where do people live? Answer fast! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.disabled = true);
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '🗺️ RESTART DISTRIBUTION CHALLENGE 🗺️';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    function highlightCorrectAnswer(correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (rawText === correctText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    function handleAnswer(selected, correctAnswer, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) return;
        answerLocked = true;
        const isCorrect = (selected === correctAnswer);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            messageDiv.innerHTML = `✅ CORRECT! Population expert! +1 point! (${levelScore}/${TOTAL_QS}) | Time left: ${levelTimerSec}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            // Show correct answer by highlighting it among all options
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswer) {
                    btn.classList.add('correct-highlight');
                }
            });
            messageDiv.innerHTML = `❌ NOT QUITE! Correct: "${correctAnswer}". Learn where people live! Score: ${levelScore}/${TOTAL_QS}`;
        }
        disableAllOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const levelData = levelsData[currentLevel - 1];
        const q = levelData[currentQIndex];
        questionDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        
        const shuffledOps = shuffleArray([...q.options]);
        const prefixes = ['A', 'B', 'C', 'D'];
        shuffledOps.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsDiv.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        messageDiv.innerHTML = `📍 Level ${currentLevel} • Question ${currentQIndex+1}/30 • Population Distribution! The map is counting on you! ⏱️`;
    }

    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                // GRAND VICTORY
                messageDiv.innerHTML = `🏆🗺️📍✨ AMAZING! You've mastered how people are distributed across Kenya and the world! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). You are a true Population Geography Champion! ✨📍🗺️🏆`;
                disableAllOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉🎊 LEVEL ${currentLevel} COMPLETE! 🎊🎉 ${levelScore}/${TOTAL_QS} PASS (${Math.round(levelScore/TOTAL_QS*100)}%). Moving to LEVEL ${currentLevel+1}... 🗺️📍`;
                disableAllOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadCurrentQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableAllOptions();
            nextBtn.disabled = true;
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect} correct). Press RESTART to become a distribution expert! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadCurrentQuestion();
        nextBtn.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
