<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>📐 GeoMaster Arena | Grade 6 CBC Geometry Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* smoother tap on mobile */
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0b2b26, #041a1f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Quicksand', system-ui, sans-serif;
            padding: 20px;
        }

        /* main game card */
        .game-card {
            max-width: 900px;
            width: 100%;
            background: #fef9e6;
            border-radius: 70px 50px 70px 50px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255,255,200,0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* glowing header */
        .game-header {
            background: linear-gradient(135deg, #ffb347, #ff7e05);
            padding: 20px 20px 15px;
            text-align: center;
            border-bottom: 5px solid #d45a1a;
        }

        .game-header h1 {
            font-size: 2rem;
            letter-spacing: -1px;
            background: #1e2f2a;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: none;
            font-weight: 800;
            display: inline-block;
            padding: 0 12px;
        }

        .badge-strip {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            background: #2c4238;
            padding: 10px 18px;
            border-radius: 60px;
        }

        .topic-tag, .level-tag, .score-tag {
            background: #0f2c24;
            padding: 6px 20px;
            border-radius: 40px;
            color: #ffeaac;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: inset 0 -1px 0 #1f4d3a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .topic-tag { background: #1e5f6b; color: white; }
        .level-tag { background: #b86f2c; }
        .score-tag { background: #1f8a4e; font-size: 1.3rem; letter-spacing: 1px; }

        /* progress arc */
        .progress-section {
            padding: 18px 25px 5px;
        }
        .progress-bar-bg {
            background: #d6cfab;
            border-radius: 30px;
            height: 16px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px #8b7a5a;
        }
        .progress-fill {
            background: linear-gradient(90deg, #f5b042, #e67e22);
            width: 0%;
            height: 100%;
            transition: width 0.25s ease;
            border-radius: 30px;
        }
        .counter-text {
            text-align: right;
            font-weight: 600;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #2d3e2b;
        }

        /* question arena */
        .question-zone {
            padding: 20px 25px 10px;
        }
        .question-panel {
            background: #fff9ed;
            border-radius: 48px;
            padding: 20px 16px;
            border: 2px solid #ffd966;
            box-shadow: 0 8px 0 #d9b34c;
        }
        .question-text {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            color: #1e3b2f;
            line-height: 1.4;
            word-break: break-word;
            background: #faf2de;
            padding: 15px 10px;
            border-radius: 40px;
        }

        /* options grid: fully responsive */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin: 28px 0 20px;
        }
        .geo-option {
            background: #efe2c6;
            border: 2px solid #c2a15b;
            border-radius: 60px;
            padding: 14px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.08s linear;
            color: #2a421f;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .geo-option:active { transform: scale(0.97); }
        .correct-highlight {
            background: #9de0ad;
            border-color: #2c7840;
            color: #144d21;
            box-shadow: 0 0 0 2px #c8ffc3;
        }
        .wrong-highlight {
            background: #f3bcb0;
            border-color: #bc3f2e;
            color: #6b1f10;
            text-decoration: line-through;
        }
        .disabled-opt {
            pointer-events: none;
            opacity: 0.8;
        }

        /* feedback & next */
        .feedback-area {
            padding: 5px 25px 10px;
            font-size: 1.05rem;
            font-weight: 500;
            text-align: center;
            min-height: 70px;
        }
        .next-button {
            background: #f39c12;
            border: none;
            width: 80%;
            margin: 0 auto 20px;
            display: block;
            padding: 14px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            text-shadow: 0 1px 2px black;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #b45f1b;
        }
        .next-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b45f1b; }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            padding: 5px 20px 25px;
        }
        .action-btn {
            background: #5f7a6b;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .action-btn:active { transform: scale(0.96); background: #3e5a4b; }
        footer {
            background: #eadabc;
            text-align: center;
            padding: 12px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2c4433;
        }
        @media (max-width: 550px) {
            .question-text { font-size: 1.2rem; }
            .geo-option { padding: 12px 6px; font-size: 0.85rem; }
            .badge-strip { flex-direction: column; align-items: stretch; text-align: center; }
            .game-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
<div class="game-card" id="geometryGame">
    <div class="game-header">
        <h1>📐 GEO⚡MASTER ARENA 🧊</h1>
        <div class="badge-strip">
            <span class="topic-tag" id="topicDisplay">Lines</span>
            <span class="level-tag" id="levelDisplay">Level 1</span>
            <span class="score-tag" id="scoreDisplay">🏆 0</span>
        </div>
    </div>
    <div class="progress-section">
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
        <div class="counter-text" id="qCounter">Question 0 / 30</div>
    </div>
    <div class="question-zone">
        <div class="question-panel">
            <div class="question-text" id="questionText">Loading Geometry Challenge...</div>
            <div class="options-grid" id="optionsContainer"></div>
        </div>
    </div>
    <div class="feedback-area" id="feedbackMsg"></div>
    <button class="next-button" id="nextBtn">➡ NEXT CHALLENGE</button>
    <div class="action-buttons">
        <button class="action-btn" id="switchTopicBtn">🔄 Change Topic</button>
        <button class="action-btn" id="fullResetBtn">⚡ Full Reset</button>
    </div>
    <footer>🏅 GRADE 6 CBC | Lines · Angles · 3-D Objects | 4 Levels, 30 Q each | Master Geometry!</footer>
</div>

<script>
    // ------------------- GEOMETRY QUESTION GENERATOR (Lines, Angles, 3-D Objects) -----------------
    // Each topic has 4 levels with 30 UNIQUE questions per level. Difficulty scales with level.
    const TOPICS = ["Lines", "Angles", "3-D Objects"];
    let currentTopicIdx = 0;      // 0 Lines,1 Angles,2 3D
    let currentLevel = 1;         // 1..4
    let currentQuestions = [];     // array of 30 q objects {text, options, correct}
    let currentQIndex = 0;
    let totalScore = 0;
    let answered = false;
    let nextLockFlag = false;
    
    // DOM elements
    const topicDisplay = document.getElementById("topicDisplay");
    const levelDisplay = document.getElementById("levelDisplay");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const progressFill = document.getElementById("progressFill");
    const qCounterSpan = document.getElementById("qCounter");
    const questionTextDiv = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedbackMsgDiv = document.getElementById("feedbackMsg");
    const nextBtn = document.getElementById("nextBtn");
    const switchTopicBtn = document.getElementById("switchTopicBtn");
    const fullResetBtn = document.getElementById("fullResetBtn");
    
    // Helper: shuffle for options
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    // Random integer
    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    
    // Generate 30 questions for (topic, level)
    function generateGeometryQuestions(topic, level) {
        const questions = [];
        const qCount = 30;
        // level multiplier: harder numbers / more complex properties
        const diff = level; // 1=easy, 4=hard
        
        for (let i = 0; i < qCount; i++) {
            let qText = "";
            let options = [];
            let correct = "";
            const seed = i * 7 + level * 13;
            
            // ----- LINES TOPIC -----
            if (topic === "Lines") {
                const lineTypes = [
                    { name: "Parallel lines", desc: "lines that never meet and are always the same distance apart." },
                    { name: "Perpendicular lines", desc: "lines that intersect at a right angle (90°)." },
                    { name: "Intersecting lines", desc: "lines that cross at a point." },
                    { name: "Horizontal line", desc: "a line that goes left to right, flat." },
                    { name: "Vertical line", desc: "a line that goes up and down." }
                ];
                const lineQType = (seed % 6);
                if (lineQType === 0) {
                    qText = `Which type of lines NEVER meet and stay the same distance apart?`;
                    correct = "Parallel lines";
                    options = ["Parallel lines", "Perpendicular lines", "Intersecting lines", "Curved lines"];
                } else if (lineQType === 1) {
                    qText = `Lines that intersect at exactly 90° are called?`;
                    correct = "Perpendicular lines";
                    options = ["Parallel lines", "Perpendicular lines", "Oblique lines", "Transversal lines"];
                } else if (lineQType === 2) {
                    qText = `What do we call lines that cross each other at any angle?`;
                    correct = "Intersecting lines";
                    options = ["Parallel lines", "Intersecting lines", "Perpendicular lines", "Collinear lines"];
                } else if (lineQType === 3) {
                    qText = `A line that goes from left to right (flat) is called _____ line.`;
                    correct = "Horizontal";
                    options = ["Vertical", "Horizontal", "Diagonal", "Curved"];
                } else if (lineQType === 4) {
                    qText = `A line that goes straight up and down is called _____ line.`;
                    correct = "Vertical";
                    options = ["Horizontal", "Vertical", "Slant", "Perpendicular"];
                } else {
                    qText = `Which of these is an example of PERPENDICULAR lines?`;
                    correct = "Letter 'L' shape";
                    options = ["Letter 'L' shape", "Railway tracks", "Equals sign (=)", "Zigzag"];
                }
                shuffleArray(options);
            }
            // ----- ANGLES TOPIC -----
            else if (topic === "Angles") {
                const angleTypes = [
                    { name: "Acute angle", range: "less than 90°", value: rand(10, 89) },
                    { name: "Right angle", range: "exactly 90°", value: 90 },
                    { name: "Obtuse angle", range: "between 90° and 180°", value: rand(95, 175) },
                    { name: "Straight angle", range: "exactly 180°", value: 180 },
                    { name: "Reflex angle", range: "greater than 180°", value: rand(190, 350) }
                ];
                const qVariant = (seed % 7);
                if (qVariant === 0) {
                    let ang = rand(25, 85);
                    qText = `What type of angle measures ${ang}°?`;
                    correct = "Acute angle";
                    options = ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"];
                } else if (qVariant === 1) {
                    qText = `An angle that measures exactly 90° is called?`;
                    correct = "Right angle";
                    options = ["Acute", "Obtuse", "Right angle", "Reflex"];
                } else if (qVariant === 2) {
                    let obt = rand(100, 170);
                    qText = `${obt}° is an example of which angle?`;
                    correct = "Obtuse angle";
                    options = ["Acute", "Obtuse angle", "Right angle", "Reflex angle"];
                } else if (qVariant === 3) {
                    qText = `What is the name of an angle that measures exactly 180°?`;
                    correct = "Straight angle";
                    options = ["Full rotation", "Straight angle", "Obtuse angle", "Reflex angle"];
                } else if (qVariant === 4) {
                    qText = `An angle that measures 220° is called?`;
                    correct = "Reflex angle";
                    options = ["Obtuse", "Acute", "Reflex angle", "Straight angle"];
                } else if (qVariant === 5) {
                    qText = `Which angle is greater than 90° but less than 180°?`;
                    correct = "Obtuse angle";
                    options = ["Acute", "Right", "Obtuse angle", "Reflex"];
                } else {
                    qText = `If an angle is 45°, it is an _____ angle.`;
                    correct = "Acute";
                    options = ["Obtuse", "Acute", "Right", "Reflex"];
                }
                shuffleArray(options);
            }
            // ----- 3-D OBJECTS TOPIC -----
            else if (topic === "3-D Objects") {
                const solids = [
                    { name: "Cube", properties: "6 square faces, 12 edges, 8 vertices", faces: 6, vertices: 8, edges: 12 },
                    { name: "Cuboid", properties: "6 rectangular faces, 12 edges, 8 vertices", faces: 6, vertices: 8, edges: 12 },
                    { name: "Sphere", properties: "curved surface, no edges, no vertices", faces: 1, vertices: 0, edges: 0 },
                    { name: "Cylinder", properties: "2 circular faces, 1 curved surface, 2 edges", faces: 3, vertices: 0, edges: 2 },
                    { name: "Cone", properties: "1 circular face, 1 vertex, 1 curved edge", faces: 2, vertices: 1, edges: 1 },
                    { name: "Pyramid (square)", properties: "5 faces, 5 vertices, 8 edges", faces: 5, vertices: 5, edges: 8 }
                ];
                const qStyle = (seed % 8);
                if (qStyle === 0) {
                    qText = `Which 3-D shape has 6 square faces, 12 edges and 8 vertices?`;
                    correct = "Cube";
                    options = ["Cuboid", "Cube", "Pyramid", "Cylinder"];
                } else if (qStyle === 1) {
                    qText = `How many faces does a CUBOID have?`;
                    correct = "6";
                    options = ["4", "5", "6", "8"];
                } else if (qStyle === 2) {
                    qText = `A sphere has how many vertices?`;
                    correct = "0";
                    options = ["0", "1", "2", "4"];
                } else if (qStyle === 3) {
                    qText = `Which shape has 2 circular faces and 1 curved surface?`;
                    correct = "Cylinder";
                    options = ["Cone", "Cylinder", "Sphere", "Cube"];
                } else if (qStyle === 4) {
                    qText = `How many edges does a cone have?`;
                    correct = "1 curved edge";
                    options = ["0", "1 curved edge", "2 edges", "3 edges"];
                } else if (qStyle === 5) {
                    qText = `A square-based pyramid has how many vertices?`;
                    correct = "5";
                    options = ["4", "5", "6", "8"];
                } else if (qStyle === 6) {
                    qText = `Identify the 3D object that has NO edges and NO vertices.`;
                    correct = "Sphere";
                    options = ["Cylinder", "Cone", "Sphere", "Cube"];
                } else {
                    qText = `A cube and a cuboid both have _____ vertices.`;
                    correct = "8";
                    options = ["6", "8", "10", "12"];
                }
                // adjust level difficulty for 3D: Level 3-4 can ask more edge/face counts
                if (level >= 3 && (seed % 3 === 0)) {
                    qText = `How many edges does a triangular prism have? (Level ${level} challenge)`;
                    correct = "9";
                    options = ["6", "8", "9", "12"];
                    shuffleArray(options);
                }
                if (level >= 4 && (seed % 4 === 1)) {
                    qText = `A cylinder has how many flat faces?`;
                    correct = "2";
                    options = ["1", "2", "3", "0"];
                    shuffleArray(options);
                }
                shuffleArray(options);
            }
            
            // fallback safe
            if (!qText) qText = `Geometry puzzle ${i+1}`;
            questions.push({ text: qText, options: [...options], correct: correct });
        }
        return questions.slice(0, 30);
    }
    
    // load current topic+level questions
    function loadCurrentQuestions() {
        const topic = TOPICS[currentTopicIdx];
        currentQuestions = generateGeometryQuestions(topic, currentLevel);
        currentQIndex = 0;
        answered = false;
        nextLockFlag = false;
        renderCurrentQuestion();
        updateUIProgress();
        enableOptionsInteraction(true);
        feedbackMsgDiv.innerHTML = "🔺 Select the right answer! Conquer Geometry! 🔻";
        nextBtn.disabled = false;
        nextBtn.style.opacity = "1";
    }
    
    function renderCurrentQuestion() {
        if (!currentQuestions.length || currentQIndex >= currentQuestions.length) {
            if (currentQIndex >= 30) handleLevelCompletion();
            return;
        }
        const q = currentQuestions[currentQIndex];
        questionTextDiv.innerText = q.text;
        optionsContainer.innerHTML = "";
        q.options.forEach(opt => {
            const btn = document.createElement("div");
            btn.classList.add("geo-option");
            btn.innerText = opt;
            btn.addEventListener("click", () => handleAnswerSelect(opt, btn));
            optionsContainer.appendChild(btn);
        });
        updateUIProgress();
    }
    
    function handleAnswerSelect(selected, btnElem) {
        if (answered || nextLockFlag) {
            feedbackMsgDiv.innerHTML = "⏳ Already answered! Click NEXT for next challenge.";
            return;
        }
        const currentQ = currentQuestions[currentQIndex];
        const isCorrect = (selected === currentQ.correct);
        // highlight all options: mark correct green, user wrong red
        const allOpts = document.querySelectorAll(".geo-option");
        allOpts.forEach(opt => {
            opt.classList.add("disabled-opt");
            if (opt.innerText === currentQ.correct) {
                opt.classList.add("correct-highlight");
            }
            if (opt.innerText === selected && !isCorrect) {
                opt.classList.add("wrong-highlight");
            }
        });
        if (isCorrect) {
            let points = 10 + (currentLevel * 2); // bonus for higher level: 12,14,16,18
            totalScore += points;
            feedbackMsgDiv.innerHTML = `🎉 CORRECT! +${points} points! 🎉 (Level ${currentLevel} bonus)`;
            scoreDisplay.innerText = `🏆 ${totalScore}`;
        } else {
            feedbackMsgDiv.innerHTML = `❌ INCORRECT! Correct answer: ${currentQ.correct}. Keep practicing! +0 points.`;
            scoreDisplay.innerText = `🏆 ${totalScore}`;
        }
        answered = true;
        nextBtn.disabled = false;
    }
    
    function nextQuestionStep() {
        if (!answered) {
            feedbackMsgDiv.innerHTML = "❗ Please answer the current question before moving on!";
            return;
        }
        if (currentQIndex + 1 < currentQuestions.length) {
            currentQIndex++;
            answered = false;
            renderCurrentQuestion();
            enableOptionsInteraction(true);
            feedbackMsgDiv.innerHTML = "✨ Next challenge! Show your geometry power! ✨";
        } else {
            // completed current level (30 questions finished)
            handleLevelCompletion();
        }
    }
    
    function handleLevelCompletion() {
        if (currentLevel < 4) {
            feedbackMsgDiv.innerHTML = `🏅 LEVEL ${currentLevel} MASTERED! 🏅 Advancing to Level ${currentLevel+1} 🚀`;
            currentLevel++;
            levelDisplay.innerText = `Level ${currentLevel}`;
            loadCurrentQuestions();
        } else {
            // Level 4 complete for current topic
            let nextTopic = currentTopicIdx + 1;
            if (nextTopic < TOPICS.length) {
                feedbackMsgDiv.innerHTML = `🏆🏆 YOU ROCK! Completed ${TOPICS[currentTopicIdx]} Level 4! Moving to ${TOPICS[nextTopic]} Level 1 🎉🎉`;
                currentTopicIdx = nextTopic;
                currentLevel = 1;
                topicDisplay.innerText = TOPICS[currentTopicIdx];
                levelDisplay.innerText = `Level ${currentLevel}`;
                loadCurrentQuestions();
            } else {
                // GRAND SLAM: finished all topics up to level 4
                feedbackMsgDiv.innerHTML = "🏆🌟 GRAND GEOMETRY LEGEND! 🌟🏆 You mastered Lines, Angles & 3-D Objects! Press FULL RESET for another victory run!";
                nextBtn.disabled = true;
                disableAllPermanently();
                return;
            }
        }
        updateUIProgress();
    }
    
    function disableAllPermanently() {
        const btns = document.querySelectorAll(".geo-option");
        btns.forEach(btn => btn.style.pointerEvents = "none");
        nextBtn.disabled = true;
    }
    
    function enableOptionsInteraction(enable) {
        const btns = document.querySelectorAll(".geo-option");
        btns.forEach(btn => {
            if (enable) {
                btn.classList.remove("disabled-opt", "correct-highlight", "wrong-highlight");
                btn.style.pointerEvents = "auto";
            } else {
                btn.classList.add("disabled-opt");
            }
        });
    }
    
    function updateUIProgress() {
        const progressPercent = ((currentQIndex) / 30) * 100;
        progressFill.style.width = `${progressPercent}%`;
        qCounterSpan.innerText = `Question ${currentQIndex+1} / 30`;
        scoreDisplay.innerText = `🏆 ${totalScore}`;
    }
    
    // ---- Reset & Switch topic features ----
    function fullGameReset() {
        currentTopicIdx = 0;
        currentLevel = 1;
        totalScore = 0;
        answered = false;
        nextLockFlag = false;
        topicDisplay.innerText = TOPICS[0];
        levelDisplay.innerText = `Level 1`;
        scoreDisplay.innerText = `🏆 0`;
        loadCurrentQuestions();
        feedbackMsgDiv.innerHTML = "🔄 FULL RESTART! New geometry journey begins. Stay sharp!";
        nextBtn.disabled = false;
        nextBtn.style.pointerEvents = "auto";
    }
    
    function switchTopic() {
        let newIdx = (currentTopicIdx + 1) % TOPICS.length;
        currentTopicIdx = newIdx;
        currentLevel = 1;
        totalScore = Math.max(0, totalScore - 8); // small penalty but fun to keep engagement
        if(totalScore < 0) totalScore = 0;
        topicDisplay.innerText = TOPICS[currentTopicIdx];
        levelDisplay.innerText = `Level ${currentLevel}`;
        scoreDisplay.innerText = `🏆 ${totalScore}`;
        loadCurrentQuestions();
        feedbackMsgDiv.innerHTML = `🔄 Switched to ${TOPICS[currentTopicIdx]} | Level 1. Prove your skills!`;
    }
    
    // event binding
    nextBtn.addEventListener("click", nextQuestionStep);
    switchTopicBtn.addEventListener("click", switchTopic);
    fullResetBtn.addEventListener("click", fullGameReset);
    
    // initialize game
    loadCurrentQuestions();
</script>
</body>
</html>
