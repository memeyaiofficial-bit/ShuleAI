<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Heat Explorer | Grade 4 Science | Heat in Nature & Sources</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #b84c1a 0%, #8a3510 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #e67e22, #d35400);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #a04000;
            color: white;
            text-shadow: 2px 2px 0 #a04000;
        }

        .level-badge {
            background: #5c2600;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #e67e22, 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #3a1a08;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 0 3px #fad7a0, 0 6px 0 #5c2600;
        }

        .timer-number {
            background: #000000;
            padding: 6px 20px;
            border-radius: 50px;
            color: #f5b041;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e8ddc5;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #d35400;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-card {
            padding: 30px 28px 20px;
            background: #fffaf0;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            background: #fdebd0;
            padding: 24px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 18px rgba(0,0,0,0.1);
            color: #7b3a1a;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa8e6c;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #e67e22;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #a04000;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.correct-highlight .option-prefix {
            background: #1b5e20;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn.wrong-highlight .option-prefix {
            background: #8b2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #f4a261;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 45px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #c45c1a;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #d35400;
            color: #fdebd0;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px solid #f5bc70;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 0.95rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
            .timer-number { font-size: 1.5rem; min-width: 75px; letter-spacing: 2px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-critical {
            background: #8b0000 !important;
            color: #ffcc44 !important;
            text-shadow: 0 0 4px red;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.85; transform: scale(1.03);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .heat-icon {
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">🔥 LEVEL <span id="levelNum">1</span> 🌞</div>
        <div class="timer-area">⏱️ TIME LEFT <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 80% TO PASS → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading heat challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">🔥 HEAT EXPLORER! Learn what heat is and discover its natural sources. Timer is RUNNING — feel the heat!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC SCIENCE AND TECHNOLOGY: HEAT IN NATURE & SOURCES
    // Topics: Meaning of heat in nature (energy that makes things hot, transfers from hot to cold)
    // Sources of heat in nature (sun, geothermal, lightning, friction, chemical reactions, biological)
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- BANK 1: MEANING OF HEAT IN NATURE ----------
    const meaningBank = [
        { q: "What is heat in nature?", correct: "A form of energy that makes things warm or hot", options: ["A type of liquid", "A form of energy that makes things warm or hot", "A solid material", "A sound wave"] },
        { q: "Heat always flows from:", correct: "Hotter objects to colder objects", options: ["Colder objects to hotter objects", "Hotter objects to colder objects", "Same temperature objects", "It doesn't flow"] },
        { q: "Which of these best describes heat?", correct: "Energy that transfers due to temperature difference", options: ["Energy that transfers due to temperature difference", "Only visible light", "Only sound", "Only electricity"] },
        { q: "When you touch a hot cup, heat transfers to your hand by:", correct: "Conduction", options: ["Convection", "Radiation", "Conduction", "Evaporation"] },
        { q: "Heat from the sun reaches Earth by:", correct: "Radiation", options: ["Conduction", "Convection", "Radiation", "Reflection"] },
        { q: "The feeling of warmth on your skin from a fire is due to:", correct: "Heat radiation", options: ["Heat conduction", "Heat radiation", "Heat convection", "Heat freezing"] },
        { q: "What happens when an object gains heat?", correct: "Its temperature increases (gets hotter)", options: ["Its temperature decreases", "Its temperature increases", "It becomes heavier", "It becomes lighter"] },
        { q: "Temperature is a measure of:", correct: "How hot or cold something is", options: ["How hot or cold something is", "The color of an object", "The weight of an object", "The size of an object"] },
        { q: "Heat is measured in units called:", correct: "Joules or calories", options: ["Meters", "Joules or calories", "Kilograms", "Liters"] }
    ];

    // ---------- BANK 2: THE SUN AS A SOURCE OF HEAT ----------
    const sunBank = [
        { q: "The main natural source of heat for Earth is:", correct: "The Sun", options: ["The Moon", "The Sun", "Stars", "Volcanoes"] },
        { q: "The sun's heat is produced by:", correct: "Nuclear fusion (hydrogen turning into helium)", options: ["Burning coal", "Nuclear fusion", "Friction", "Electricity"] },
        { q: "Without the sun's heat, Earth would be:", correct: "A frozen, lifeless planet", options: ["A frozen, lifeless planet", "A boiling planet", "Exactly the same", "Covered in lava"] },
        { q: "Solar energy from the sun can be used to:", correct: "Generate electricity using solar panels", options: ["Generate electricity using solar panels", "Create ice", "Make sound", "Stop wind"] },
        { q: "The sun's heat causes:", correct: "Weather patterns, wind, and ocean currents", options: ["Only day and night", "Weather patterns, wind, and ocean currents", "Only earthquakes", "Only volcanoes"] },
        { q: "Plants need the sun's heat for:", correct: "Photosynthesis (making food)", options: ["Photosynthesis (making food)", "Sleeping", "Moving", "Drinking water"] },
        { q: "The sun is a:", correct: "Star (giant ball of hot gases)", options: ["Planet", "Star (giant ball of hot gases)", "Moon", "Asteroid"] }
    ];

    // ---------- BANK 3: GEOTHERMAL HEAT (Earth's Internal Heat) ----------
    const geothermalBank = [
        { q: "What is geothermal heat?", correct: "Heat from inside the Earth", options: ["Heat from the sun", "Heat from inside the Earth", "Heat from burning wood", "Heat from friction"] },
        { q: "Which natural feature is caused by geothermal heat?", correct: "Hot springs and geysers", options: ["Hot springs and geysers", "Ice caps", "Deserts", "Rain clouds"] },
        { q: "Volcanoes produce heat from:", correct: "Molten rock (magma) inside the Earth", options: ["The sun", "Molten rock (magma) inside the Earth", "The moon", "Wind"] },
        { q: "Geothermal energy can be used to:", correct: "Generate electricity and heat buildings", options: ["Generate electricity and heat buildings", "Cool buildings", "Create ice", "Stop volcanoes"] },
        { q: "Where is geothermal heat strongest?", correct: "Near tectonic plate boundaries and volcanic areas", options: ["Near tectonic plate boundaries and volcanic areas", "In deserts", "In oceans only", "At the North Pole"] },
        { q: "The word 'geothermal' comes from 'geo' meaning Earth and 'thermal' meaning:", correct: "Heat", options: ["Cold", "Heat", "Water", "Rock"] }
    ];

    // ---------- BANK 4: OTHER NATURAL SOURCES OF HEAT (Lightning, Friction, Chemical/Biological) ----------
    const otherSourcesBank = [
        { q: "Lightning produces intense heat because:", correct: "Air friction and electrical discharge", options: ["Air friction and electrical discharge", "It is cold electricity", "It comes from the moon", "It is made of ice"] },
        { q: "The temperature of a lightning bolt can be:", correct: "Up to 30,000°C (hotter than sun's surface)", options: ["Up to 30,000°C", "100°C", "0°C", "-100°C"] },
        { q: "Rubbing your hands together produces heat due to:", correct: "Friction", options: ["Magnetism", "Friction", "Radiation", "Conduction"] },
        { q: "When wood burns, heat is released from:", correct: "Chemical reaction (combustion)", options: ["Physical reaction", "Chemical reaction (combustion)", "Magnetic reaction", "Electrical reaction"] },
        { q: "Animals, including humans, produce body heat from:", correct: "Metabolism (chemical reactions in cells)", options: ["Metabolism (chemical reactions in cells)", "Eating ice", "Breathing cold air", "Sleeping"] },
        { q: "Compost piles generate heat because:", correct: "Decomposing bacteria release chemical energy", options: ["Decomposing bacteria release chemical energy", "They are in the sun", "They contain ice", "They are wet only"] },
        { q: "A meteor burning up in the atmosphere produces heat due to:", correct: "Friction with air molecules", options: ["Friction with air molecules", "Magnetism", "Solar radiation", "Gravity"] },
        { q: "Rocks rubbing against each other during an earthquake can produce:", correct: "Frictional heat", options: ["Lightning", "Frictional heat", "Magnetic fields", "Sound only"] }
    ];

    // ---------- BANK 5: HEAT TRANSFER AND EFFECTS IN NATURE ----------
    const effectsBank = [
        { q: "Heat causes water to evaporate. This is part of:", correct: "The water cycle", options: ["The rock cycle", "The water cycle", "The carbon cycle", "The nitrogen cycle"] },
        { q: "Heat from the sun causes air to rise, creating:", correct: "Wind and weather patterns", options: ["Wind and weather patterns", "Earthquakes", "Volcanoes", "Tsunamis"] },
        { q: "The equator receives more heat from the sun because:", correct: "Sun rays hit directly (less spread out)", options: ["Sun rays hit directly (less spread out)", "It is closer to the moon", "It has more volcanoes", "It has more oceans"] },
        { q: "Heat causes materials to expand. This is why:", correct: "Railroad tracks have gaps", options: ["Railroad tracks have gaps", "Bridges are made of rubber", "Ice floats", "Water boils"] },
        { q: "Natural heat helps in:", correct: "Growth of plants and survival of animals", options: ["Growth of plants and survival of animals", "Only melting ice", "Only making shadows", "Only creating noise"] },
        { q: "If Earth had no natural heat sources, what would happen?", correct: "All water would freeze and life would end", options: ["All water would freeze and life would end", "Life would be better", "Oceans would boil", "Plants would grow faster"] },
        { q: "Heat from the sun drives the:", correct: "Greenhouse effect (natural warming)", options: ["Greenhouse effect (natural warming)", "Ice age", "Magnetic field", "Tidal waves"] },
        { q: "Natural heat sources are important because:", correct: "They make Earth habitable for living things", options: ["They make Earth habitable for living things", "They cause destruction only", "They cool the planet", "They have no effect"] }
    ];

    // Combine all banks into categories
    const categories = [meaningBank, sunBank, geothermalBank, otherSourcesBank, effectsBank];
    
    // Build 5 levels (30 Q each, each category contributes 6 per level)
    let levelsData = [];

    function buildGame() {
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            for (let cat of categories) {
                for (let i = 0; i < 6; i++) {
                    let source = cat[i % cat.length];
                    let newQ = {
                        text: source.q,
                        options: [...source.options],
                        correct: source.correct
                    };
                    if (lvl >= 3 && i % 2 === 0) newQ.text = "🔥 " + newQ.text;
                    if (lvl >= 4) newQ.text = "⭐ " + newQ.text + " ⭐";
                    if (lvl === 5 && i % 3 === 0) newQ.text = "🏆 HEAT MASTER: " + newQ.text;
                    levelQs.push(newQ);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsData.push(levelQs);
        }
    }
    buildGame();

    // ---------- GAME ENGINE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const optionsDiv = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        const timeMap = {1: 90, 2: 80, 3: 70, 4: 60, 5: 50};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableAllOptions();
                nextBtn.disabled = true;
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to become a Heat Explorer! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ONLY ${levelTimerSec} SECONDS! Heat is energy — answer fast! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '🔥 RESTART HEAT CHALLENGE 🔥';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    function highlightCorrectAnswer(correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (rawText === correctText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    function handleAnswer(selected, correctAnswer, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) return;
        answerLocked = true;
        const isCorrect = (selected === correctAnswer);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            messageDiv.innerHTML = `✅ HEAT EXPLORER! +1 point! (${levelScore}/${TOTAL_QS}) | Time left: ${levelTimerSec}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswer) {
                    btn.classList.add('correct-highlight');
                }
            });
            messageDiv.innerHTML = `❌ NOT QUITE! Correct: "${correctAnswer}". Keep learning about the amazing world of heat! Score: ${levelScore}/${TOTAL_QS}`;
        }
        disableAllOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const levelData = levelsData[currentLevel - 1];
        const q = levelData[currentQIndex];
        questionDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        
        const shuffledOps = shuffleArray([...q.options]);
        const prefixes = ['A', 'B', 'C', 'D'];
        shuffledOps.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsDiv.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        messageDiv.innerHTML = `🌞 Level ${currentLevel} • Question ${currentQIndex+1}/30 • Heat in Nature! Sources and meaning! ⏱️`;
    }

    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                messageDiv.innerHTML = `🏆🔥🌞✨ INCREDIBLE! You've mastered the meaning of heat and all its natural sources — from the sun to geothermal, lightning to friction! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). You are a true Heat Explorer! ✨🌞🔥🏆`;
                disableAllOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉🎊 LEVEL ${currentLevel} COMPLETE! 🎊🎉 ${levelScore}/${TOTAL_QS} PASS (${Math.round(levelScore/TOTAL_QS*100)}%). Moving to LEVEL ${currentLevel+1}... 🔥🌞`;
                disableAllOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadCurrentQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableAllOptions();
            nextBtn.disabled = true;
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect} correct). Press RESTART to become a Heat Explorer! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadCurrentQuestion();
        nextBtn.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
