<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 7: Animal Hygiene & Laundry Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #2c5e6e, #1a3a44);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef0;
            border-radius: 70px 70px 60px 60px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255, 245, 180, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1e88e5, #0d5c9e);
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 5px solid #ffd966;
            color: white;
            text-shadow: 2px 2px 0 #0a3b5e;
        }

        .level-badge {
            background: #2c5e2c;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1f4a1f;
        }

        .score-card {
            background: #1f3f2a;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-area {
            background: #0c1e15;
            padding: 5px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-clock {
            background: #f9e5c1;
            color: #c0392b;
            padding: 5px 15px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.9rem;
            font-weight: 800;
            min-width: 85px;
            text-align: center;
        }

        .progress-wrapper {
            background: #ddce9f;
            padding: 6px 20px;
        }
        .progress-fill {
            height: 18px;
            background: #f5a623;
            width: 0%;
            border-radius: 30px;
            transition: width 0.2s ease;
        }

        .quiz-area {
            padding: 30px 30px 35px;
        }

        .question-panel {
            background: #fff1df;
            border-radius: 55px;
            padding: 25px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2d543a;
            line-height: 1.4;
            word-break: break-word;
        }

        .speaker-button {
            background: #ffdd99;
            border: none;
            font-size: 1.4rem;
            padding: 10px 24px;
            margin-top: 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: 0.08s linear;
            box-shadow: 0 5px 0 #b97f3a;
        }

        .speaker-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f3a;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
            margin: 30px 0 25px;
        }

        .option {
            background: #e8ddc4;
            border-radius: 100px;
            padding: 15px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.08s linear;
            border: 2px solid #cbad7a;
            text-align: center;
            box-shadow: 0 6px 0 #a67c48;
            color: #2a2b1f;
        }

        .option:hover {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option.correct-feedback {
            background: #3c9e3c;
            border-color: #1b6b1b;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .option.wrong-feedback {
            background: #d94a2b;
            border-color: #962b12;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .next-btn {
            background: #2c7a2d;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 60px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.08s;
            box-shadow: 0 7px 0 #164d17;
            margin-top: 15px;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #164d17;
        }

        .info-message {
            text-align: center;
            font-size: 1.3rem;
            background: #fff1bf;
            padding: 14px;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .question-text { font-size: 1.3rem; }
            .option { font-size: 1rem; padding: 12px 10px; }
            .game-header { flex-direction: column; align-items: stretch; text-align: center; }
            .timer-area { justify-content: center; }
        }

        footer {
            background: #e1cf9b;
            text-align: center;
            padding: 14px;
            font-weight: 500;
            color: #2c2b1a;
            font-size: 0.85rem;
        }

        button { font-family: inherit; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-card">🧼 SCORE: <span id="currentScore">0</span> / <span id="maxLevelScore">0</span></div>
        <div class="timer-area">
            ⏱️ TIME
            <div class="timer-clock" id="timerNumber">20</div>
        </div>
    </div>
    <div class="progress-wrapper">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="quiz-area" id="quizArea"></div>
    <footer>🐄 Hygiene in Rearing Domestic Animals | 👕 Laundry: Loose & Colored Items | CBC Grade 7</footer>
</div>

<script>
    // --------------------------------------------------------------
    // TOPICS: Hygiene practices in rearing domestic animals
    //         Laundry: loose-colored items (washing colored clothes, sorting, preventing color run)
    // 5 levels x 40 questions, shuffled answers (A,B,C,D)
    // Pass 80% (32/40), Timer 20s, Voice Output, Fully Responsive
    // ADAPTED FOR GRADE 7 (all content and mechanics remain the same)
    // --------------------------------------------------------------

    function shuffleAnswers(questionObj) {
        const originalOptions = [...questionObj.options];
        let items = originalOptions.map((text, idx) => ({ text, isCorrect: idx === questionObj.correctIndex }));
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        return {
            ...questionObj,
            options: items.map(item => item.text),
            correctIndex: items.findIndex(item => item.isCorrect === true)
        };
    }

    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        const topics = ["animal_hygiene", "laundry_colored"];
        
        for (let i = 0; i < 40; i++) {
            let topic = topics[i % 2];
            let qText = "", opts = [], correct = 0;
            const seed = (level * 337 + i * 19) % 61;
            
            // ----- ANIMAL HYGIENE (rearing domestic animals) -----
            if (topic === "animal_hygiene") {
                const hygienePool = [
                    { q: "Why should you clean an animal's shelter regularly?", opts: ["To prevent diseases", "To make it smell nice only", "To save water", "To feed animals"], correct: 0 },
                    { q: "What is the best way to provide clean water for cows?", opts: ["Fresh water in clean trough daily", "Stagnant pond water", "Dirty bucket", "Rainwater only"], correct: 0 },
                    { q: "How often should you groom a horse or cow?", opts: ["Regularly to remove dirt and pests", "Once a year", "Never", "Only when sick"], correct: 0 },
                    { q: "What does 'vaccination' do for domestic animals?", opts: ["Prevents infectious diseases", "Makes them fat", "Changes their colour", "Increases milk only"], correct: 0 },
                    { q: "Which practice helps control flies in a cowshed?", opts: ["Proper manure disposal", "Leaving food open", "Wet floors", "Overcrowding"], correct: 0 },
                    { q: "Why should you wash your hands after handling animals?", opts: ["To avoid zoonotic diseases", "To keep hands soft", "To save time", "To feed them"], correct: 0 },
                    { q: "What is deworming in animals?", opts: ["Removing internal parasites", "Washing fur", "Clipping nails", "Giving vitamins"], correct: 0 },
                    { q: "Which of these is a sign of a healthy animal?", opts: ["Bright eyes and clean coat", "Lethargy and discharge", "Loss of appetite", "Coughing"], correct: 0 },
                    { q: "How should you dispose of animal waste safely?", opts: ["Compost or bury away from water", "Throw in river", "Leave near house", "Burn plastic"], correct: 0 },
                    { q: "What is the purpose of footbath for cattle?", opts: ["Prevent hoof infections", "Cool feet", "Make them run", "Wash tail"], correct: 0 },
                ];
                let pick = hygienePool[(seed + i) % hygienePool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            // ----- LAUNDRY: LOOSE & COLORED ITEMS (sorting, washing, preventing color bleed) -----
            else {
                const laundryPool = [
                    { q: "Why should you sort laundry before washing?", opts: ["Separate whites from colored", "To save water", "To use less soap", "To dry faster"], correct: 0 },
                    { q: "What happens if you wash a new red shirt with white clothes?", opts: ["White clothes turn pink", "Nothing", "Clothes shrink", "Colors become brighter"], correct: 0 },
                    { q: "Which water temperature is best for washing delicate colored items?", opts: ["Cold or lukewarm", "Boiling hot", "Very hot", "Ice cold only"], correct: 0 },
                    { q: "What does 'colorfast' mean?", opts: ["Fabric does not lose dye", "Fabric loses color quickly", "Fabric is heavy", "Fabric is rough"], correct: 0 },
                    { q: "How can you test if a colored item will bleed?", opts: ["Dab a wet cloth on hidden area", "Wash with bleach", "Soak in hot water", "Iron it"], correct: 0 },
                    { q: "What should you do with heavily soiled loose clothes?", opts: ["Pre-treat stains before washing", "Wash with everything", "Soak for a week", "Dry clean only"], correct: 0 },
                    { q: "Why use salt when washing some colored fabrics?", opts: ["Helps set the dye", "Makes it softer", "Removes oil", "Kills germs"], correct: 0 },
                    { q: "What is the correct order of laundry steps?", opts: ["Sort -> Pre-treat -> Wash -> Rinse -> Dry", "Wash -> Sort -> Dry", "Dry -> Wash -> Sort", "Rinse -> Soap -> Wash"], correct: 0 },
                    { q: "Which detergent is best for colored clothes?", opts: ["Mild detergent without bleach", "Strong bleach powder", "Acidic cleaner", "Soap with chlorine"], correct: 0 },
                    { q: "How can you prevent color transfer when hand washing?", opts: ["Wash similar colors together", "Mix all colors", "Use boiling water", "Rub harshly"], correct: 0 },
                ];
                let pick = laundryPool[(seed + i) % laundryPool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            
            if (opts.length !== 4) opts = ["Option A", "Option B", "Option C", "Option D"];
            let qObj = { questionText: qText, options: opts, correctIndex: correct };
            qObj = shuffleAnswers(qObj);
            const key = qObj.questionText;
            if (usedKeys.has(key) && i < 38) qObj.questionText = qObj.questionText + " ?";
            usedKeys.add(qObj.questionText);
            questions.push(qObj);
        }
        // Ensure exactly 40
        while(questions.length < 40) questions.push(shuffleAnswers({
            questionText: "What is a basic hygiene rule when keeping goats?",
            options: ["Clean shelter regularly", "Feed once a week", "Never give water", "Keep them indoors always"],
            correctIndex: 0
        }));
        return questions.slice(0,40);
    }
    
    // Generate 5 levels with increasing subtle difficulty
    const levelsBank = [];
    for (let lvl = 1; lvl <= 5; lvl++) {
        levelsBank.push(generateQuestionsForLevel(lvl));
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1, currentQuestions = [], currentIndex = 0, levelScore = 0;
    const questionsPerLevel = 40;
    let timerInterval = null, timeLeft = 20, answered = false, waitingForNext = false;
    
    const quizArea = document.getElementById("quizArea");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const currentScoreSpan = document.getElementById("currentScore");
    const maxScoreSpan = document.getElementById("maxLevelScore");
    const progressFillDiv = document.getElementById("progressFill");
    const timerNumberSpan = document.getElementById("timerNumber");
    
    // Voice output
    function speakText(message) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 0.92;
        utterance.pitch = 1.08;
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
    }
    
    function updateStatsUI() {
        currentScoreSpan.innerText = levelScore;
        maxScoreSpan.innerText = questionsPerLevel;
        let percent = (levelScore / questionsPerLevel) * 100;
        progressFillDiv.style.width = `${percent}%`;
    }
    
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    
    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!answered && !waitingForNext && timeLeft > 0) {
                timeLeft--;
                timerNumberSpan.innerText = timeLeft;
                if (timeLeft <= 3) timerNumberSpan.style.background = "#ff8a7a";
                if (timeLeft === 0) { stopTimer(); if (!answered && !waitingForNext) handleTimeout(); }
            }
        }, 1000);
    }
    
    function resetTimer() { timeLeft = 20; timerNumberSpan.innerText = "20"; timerNumberSpan.style.background = "#f9e5c1"; stopTimer(); startTimer(); }
    
    function handleTimeout() {
        if (answered) return;
        answered = true; waitingForNext = true;
        const q = currentQuestions[currentIndex];
        const correctAns = q.options[q.correctIndex];
        const msgDiv = document.getElementById("infoMsg");
        if (msgDiv) msgDiv.innerHTML = `⏰ TIME'S UP! Correct: ${escapeHtml(correctAns)}. No points. Keep learning!`;
        speakText(`Time is up! The correct answer is ${correctAns}.`);
        highlightOptions(q.correctIndex, -1);
        updateStatsUI();
    }
    
    function handleAnswer(clickedIdx) {
        if (answered || waitingForNext) return;
        answered = true; stopTimer();
        const q = currentQuestions[currentIndex];
        const isCorrect = (clickedIdx === q.correctIndex);
        if (isCorrect) { levelScore++; updateStatsUI(); }
        highlightOptions(q.correctIndex, clickedIdx);
        const msgDiv = document.getElementById("infoMsg");
        if (isCorrect) {
            msgDiv.innerHTML = `✅ CORRECT! +1 point! 🧼 Great care for animals and laundry! 🌟`;
            speakText(`Correct! Excellent work!`);
        } else {
            msgDiv.innerHTML = `❌ WRONG! Correct: ${escapeHtml(q.options[q.correctIndex])}. Keep practicing hygiene and laundry skills!`;
            speakText(`Wrong answer. The correct answer is ${q.options[q.correctIndex]}.`);
        }
        waitingForNext = true;
    }
    
    function highlightOptions(correctIdx, chosenIdx) {
        document.querySelectorAll('.option').forEach((opt, idx) => {
            opt.classList.remove('correct-feedback', 'wrong-feedback');
            if (idx === correctIdx) opt.classList.add('correct-feedback');
            if (idx === chosenIdx && idx !== correctIdx) opt.classList.add('wrong-feedback');
        });
    }
    
    function loadNextQuestionOrLevel() {
        if (!waitingForNext) return;
        if (currentIndex + 1 >= questionsPerLevel) {
            let percent = (levelScore / questionsPerLevel) * 100;
            if (percent >= 80) {
                if (currentLevel === 5) { showCompletion(); return; }
                else { showTransition(true, percent); currentLevel++; loadLevel(currentLevel); return; }
            } else { showTransition(false, percent); loadLevel(currentLevel); return; }
        } else {
            currentIndex++; answered = false; waitingForNext = false;
            renderCurrentQuestion();
        }
    }
    
    function showTransition(passed, percent) {
        let msg = passed ? `🎉✨ You passed Level ${currentLevel} with ${Math.floor(percent)}%! Moving to Level ${currentLevel+1}. 🧺🐄✨` : `😓 Oops! ${Math.floor(percent)}% (need 80%). Repeating Level ${currentLevel}. Keep practicing! 💪`;
        speakText(passed ? `Great! You passed level ${currentLevel}. Proceeding to next level.` : `You need 80 percent to pass. Repeating level.`);
        alert(msg);
    }
    
    function showCompletion() {
        stopTimer();
        quizArea.innerHTML = `<div class="question-panel" style="text-align:center"><div class="question-text">🏆🧼 LAUNDRY & ANIMAL HYGIENE CHAMPION (GRADE 7)! 🐄👕<br>You mastered all 5 levels!<br>Clean animals, bright colored clothes – you're a Grade 7 star! 🌟</div><button class="next-btn" id="restartGameBtn">🌟 PLAY AGAIN 🌟</button></div>`;
        speakText(`Congratulations, champion! You have mastered hygiene practices for domestic animals and laundry for loose colored items. Amazing work for Grade 7!`);
        document.getElementById("restartGameBtn")?.addEventListener('click', () => { currentLevel = 1; loadLevel(1); });
    }
    
    function renderCurrentQuestion() {
        const q = currentQuestions[currentIndex];
        const letters = ['A', 'B', 'C', 'D'];
        const html = `
            <div class="question-panel">
                <div class="question-text">${escapeHtml(q.questionText)}</div>
                <button class="speaker-button" id="readQuestionBtn">🔊 Read Question Aloud</button>
            </div>
            <div class="options-grid" id="optionsGrid">
                ${q.options.map((opt, idx) => `<div class="option" data-opt-index="${idx}">${letters[idx]}. ${escapeHtml(opt)}</div>`).join('')}
            </div>
            <button class="next-btn" id="nextQuestionBtn">➡ NEXT QUESTION</button>
            <div id="infoMsg" class="info-message"></div>
        `;
        quizArea.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', (e) => { if (!answered && !waitingForNext) handleAnswer(parseInt(opt.dataset.optIndex)); });
        });
        document.getElementById("nextQuestionBtn").addEventListener('click', () => {
            if (!answered && !waitingForNext) handleTimeout();
            else if (waitingForNext) loadNextQuestionOrLevel();
        });
        document.getElementById("readQuestionBtn").addEventListener('click', () => speakText(q.questionText));
        answered = false; waitingForNext = false;
        resetTimer();
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = levelsBank[level-1];
        currentIndex = 0;
        levelScore = 0;
        answered = false; waitingForNext = false;
        stopTimer(); timeLeft = 20;
        timerNumberSpan.innerText = "20"; timerNumberSpan.style.background = "#f9e5c1";
        levelDisplaySpan.innerText = `LEVEL ${currentLevel}`;
        updateStatsUI();
        renderCurrentQuestion();
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m)); }
    
    // Start the game
    loadLevel(1);
</script>
</body>
</html>
