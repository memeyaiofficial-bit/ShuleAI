<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎓 Shule AI Plus+ | Complete English Master | CBC Grade 6</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #e6f0ff 0%, #b8d4ff 100%);
    font-family: 'Nunito', 'Poppins', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 1rem;
}

.game-container {
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 2rem;
    box-shadow: 0 30px 40px -18px rgba(0, 20, 70, 0.45);
    overflow: hidden;
    border: 1px solid rgba(59,130,246,0.3);
}

/* Tabs */
.mode-tabs {
    display: flex;
    background: #0f3b6f;
    border-bottom: 3px solid #ffcd3c;
    gap: 2px;
    flex-wrap: wrap;
}
.tab-btn {
    flex: 1;
    background: #1e5a9e;
    color: #fef9e0;
    border: none;
    padding: 14px 8px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    text-align: center;
}
.tab-btn.active {
    background: linear-gradient(135deg, #ffcd3c, #f9a826);
    color: #0a2f5a;
}
.tab-btn:active { transform: scale(0.98); }

.game-header {
    background: #0f3b6f;
    padding: 1rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    border-bottom: 5px solid #ffcd3c;
}
.title-section h1 {
    font-size: 1.5rem;
    color: white;
    text-shadow: 0 2px 0 #0a2f5a;
}
.title-section p {
    font-size: 0.7rem;
    background: #ffcd3c20;
    display: inline-block;
    padding: 0.2rem 0.8rem;
    border-radius: 30px;
    color: #ffe6a3;
}
.score-board {
    background: #ffcd3c;
    padding: 0.3rem 1rem;
    border-radius: 50px;
    color: #0a2f5a;
    font-weight: bold;
    font-size: 1.5rem;
    box-shadow: 0 4px 0 #b27f1a;
    display: flex;
    align-items: center;
    gap: 8px;
}
.score-board span { font-size: 0.9rem; font-weight: 700; }

.level-zone {
    background: #f0f7fe;
    padding: 0.7rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #7fb4ff;
    gap: 10px;
}
.level-buttons {
    display: flex;
    gap: 0.7rem;
    flex-wrap: wrap;
}
.level-btn {
    background: white;
    border: none;
    font-weight: bold;
    padding: 0.5rem 1rem;
    border-radius: 40px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
    color: #06558a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border: 1px solid #ffcd3c;
}
.level-btn.active {
    background: #ffcd3c;
    color: #0a2f5a;
    transform: scale(1.02);
}
.level-btn.locked {
    opacity: 0.6;
    cursor: not-allowed;
    background: #e2e8f0;
    color: #3a5a7a;
}
.kenyan-fact {
    background: #fff3cf;
    padding: 0.3rem 1rem;
    border-radius: 60px;
    font-size: 0.75rem;
    font-weight: 600;
    color: #035c8f;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.quiz-main {
    padding: 1.5rem;
    background: #ffffff;
    min-height: 450px;
}
.progress-area {
    display: flex;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 8px;
}
.q-counter {
    background: #eef3fc;
    padding: 0.3rem 1rem;
    border-radius: 40px;
    font-weight: 700;
    color: #115e8c;
    font-size: 0.85rem;
}
.hint-box {
    background: #fef6df;
    border-left: 6px solid #ffcd3c;
    padding: 0.5rem 1rem;
    border-radius: 28px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #4a2f00;
}
.question-text {
    font-size: 1.3rem;
    font-weight: 700;
    color: #0a2f44;
    margin: 1rem 0;
    background: #fafdff;
    padding: 0.7rem;
    border-radius: 40px;
    border: 1px solid #d4e6ff;
    line-height: 1.4;
}
.answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.8rem;
    margin: 1.5rem 0;
}
.answer-card {
    background: #f9fbfe;
    border: 2px solid #cde0ff;
    border-radius: 80px;
    padding: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    text-align: center;
    color: #1a4972;
    font-size: 0.9rem;
}
.answer-card:hover:not(.disabled-answer) {
    background: #ffebbb;
    border-color: #ffcd3c;
    transform: scale(0.97);
}
.correct-feedback {
    background: #c8f0d1;
    border-color: #15803d;
    color: #14532d;
}
.wrong-feedback {
    background: #ffe0db;
    border-color: #dc2626;
    color: #991b1b;
    text-decoration: line-through;
}
.disabled-answer { pointer-events: none; opacity: 0.8; }

.next-btn {
    background: #ffcd3c;
    border: none;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 0.7rem 2rem;
    border-radius: 80px;
    color: #02457a;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 0.5rem;
    width: 100%;
    max-width: 220px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 0 #b27f1a;
}
.next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b27f1a; }
.next-btn:disabled { background: #bcbcbc; cursor: not-allowed; box-shadow: none; }

.level-complete {
    text-align: center;
    background: #eef2ff;
    padding: 1rem;
    border-radius: 2rem;
    font-weight: bold;
    color: #156f9c;
    border: 2px solid #ffcd3c;
}

/* Voice specific */
.voice-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
    margin: 1rem 0;
}
.listen-btn, .microphone-btn {
    background: #2b7a4b;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 1rem;
    padding: 0.7rem 1.5rem;
    border-radius: 60px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 3px 0 #1a4a2e;
}
.microphone-btn { background: #0284c7; box-shadow: 0 3px 0 #0369a1; }
.microphone-btn.listening { background: #dc2626; animation: pulse 1s infinite; }
@keyframes pulse {
    0%,100% { opacity: 1; background: #dc2626; }
    50% { opacity: 0.8; background: #b91c1c; }
}
.status { padding: 0.7rem; border-radius: 60px; font-weight: 600; font-size: 0.9rem; text-align: center; margin-top: 0.5rem; }
.good-status { background: #c8f0d1; color: #14532d; }
.bad-status { background: #ffe0db; color: #991b1b; }
.warning-status { background: #fff3cd; color: #856404; }
.success-message {
    background: #c8f0d1;
    color: #14532d;
    padding: 0.7rem;
    border-radius: 60px;
    font-weight: bold;
    margin: 0.5rem 0;
    animation: fadeInScale 0.4s ease-out;
}
@keyframes fadeInScale {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}

footer {
    background: #eef3fc;
    padding: 0.8rem;
    font-size: 0.65rem;
    text-align: center;
    color: #3282a7;
    border-top: 2px dotted #ffcd3c;
}

@media (max-width: 680px) {
    .tab-btn { font-size: 0.65rem; padding: 10px 4px; }
    .question-text { font-size: 1rem; }
    .answers-grid { grid-template-columns: 1fr; }
    .voice-controls { flex-direction: column; align-items: center; }
    .level-zone { flex-direction: column; align-items: stretch; }
    .game-header { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>
<div class="game-container" id="app">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabReading">📖 Intensive Reading</button>
        <button class="tab-btn" id="tabListening">🎤 Listen & Speak</button>
        <button class="tab-btn" id="TabNouns">📚 Nouns Mastery</button>
    </div>
    <div class="game-header">
        <div class="title-section">
            <h1>🎓 Shule AI Plus+ 🌟</h1>
            <p>CBC Grade 6 English • Reading, Listening, Grammar</p>
        </div>
        <div class="score-board">🏆 <span id="totalScoreDisplay">0</span> pts</div>
    </div>
    <div class="level-zone">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="kenyan-fact" id="kenyanFactArea">🇰🇪 Kenya: English is an official language — master it!</div>
    </div>
    <div class="quiz-main" id="quizMain"></div>
    <footer>📖 Read carefully • 🎤 Speak clearly • 📚 Learn nouns — become an English champion!</footer>
</div>

<script>
    // ==============================================================
    // MERGED GAME: 3 MODES - Intensive Reading, Listen & Speak, Nouns
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: 12/15 (80%) to unlock next level
    // ==============================================================

    // ---------- MODE 1: INTENSIVE READING (Comprehension) ----------
    const readingQuestions = [
        { text: "What does a baobab tree store in its trunk?", options: ["Water", "Food", "Seeds", "Leaves"], correct: 0, hint: "It helps during dry seasons" },
        { text: "Which city is Kenya's oldest city?", options: ["Mombasa", "Nairobi", "Kisumu", "Nakuru"], correct: 0, hint: "A coastal city with Fort Jesus" },
        { text: "Who built Fort Jesus?", options: ["Portuguese", "British", "Arabs", "Germans"], correct: 0, hint: "European explorers" },
        { text: "What is the Great Rift Valley known for?", options: ["Tectonic plate movements", "Volcanic eruptions", "River erosion", "Glaciers"], correct: 0, hint: "Formed by earth movements" },
        { text: "Which lake in Kenya is famous for flamingos?", options: ["Lake Nakuru", "Lake Victoria", "Lake Turkana", "Lake Naivasha"], correct: 0, hint: "Pink birds" },
        { text: "What did Wangari Maathai found?", options: ["Green Belt Movement", "Red Cross", "UNEP", "WWF"], correct: 0, hint: "Tree planting organization" },
        { text: "What prize did Wangari Maathai win in 2004?", options: ["Nobel Peace Prize", "Booker Prize", "Oscar", "Grammy"], correct: 0, hint: "Peace prize" },
        { text: "What does 'deforestation' mean?", options: ["Cutting down trees", "Planting trees", "Protecting forests", "Studying trees"], correct: 0, hint: "Removal of forests" },
        { text: "What is the main idea of a text?", options: ["What the text is mostly about", "The first sentence", "The title", "The conclusion"], correct: 0, hint: "Central point" },
        { text: "What does 'infer' mean?", options: ["Make an educated guess", "State directly", "Ignore", "Copy"], correct: 0, hint: "Read between the lines" },
        { text: "What is the author's purpose to inform?", options: ["Give facts", "Entertain", "Persuade", "Describe"], correct: 0, hint: "To teach or explain" },
        { text: "What text structure shows cause and effect?", options: ["Why something happens and result", "Order of events", "Similarities and differences", "Description"], correct: 0, hint: "Cause → effect" },
        { text: "What is a supporting detail?", options: ["Specific fact that explains main idea", "The title", "The conclusion", "The first sentence"], correct: 0, hint: "Evidence" },
        { text: "What does 'summarize' mean?", options: ["Briefly state main points", "Write every word", "Memorize", "Copy"], correct: 0, hint: "Short version" },
        { text: "What is a fact?", options: ["Something that can be proven", "An opinion", "A belief", "A feeling"], correct: 0, hint: "True information" }
    ];
    const readingDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) {
        for(let i=0;i<15;i++) {
            readingDB[l].push({...readingQuestions[i % readingQuestions.length]});
        }
    }

    // ---------- MODE 2: LISTEN & SPEAK (Voice Recognition) ----------
    const listenQuestions = [
        { prompt: "Say the word that means 'the opposite of wrong' and sounds like 'write'.", expected: "right", hint: "Starts with R, ends with T" },
        { prompt: "Say the word that means 'not strong'. It sounds like 'week'.", expected: "weak", hint: "Spelled W-E-A-K" },
        { prompt: "Say the past tense of 'eat'.", expected: "ate", hint: "A-T-E" },
        { prompt: "Say a word that means 'very tired'.", expected: "exhausted", hint: "E-X-H-A-U-S-T-E-D" },
        { prompt: "Say a word that means 'very large'.", expected: "enormous", hint: "E-N-O-R-M-O-U-S" },
        { prompt: "Say a word with a silent 'k' at the beginning.", expected: "knee", hint: "K-N-E-E" },
        { prompt: "How many syllables in 'beautiful'? Say the number.", expected: "three", hint: "Beau-ti-ful = 3" },
        { prompt: "What does 'It's raining cats and dogs' mean? Say the meaning.", expected: "heavy rain", hint: "Very heavy rain" },
        { prompt: "What does 'break a leg' mean? Say the meaning.", expected: "good luck", hint: "Wishing someone good luck" },
        { prompt: "If someone says 'I'm feeling blue', what do they mean?", expected: "sad", hint: "Feeling sad or down" },
        { prompt: "What is a 'summary'? Say the definition.", expected: "short version", hint: "Main points only" },
        { prompt: "What does 'literally' mean? Say the definition.", expected: "exactly", hint: "Exactly as stated" },
        { prompt: "What is an 'idiom'? Say the definition.", expected: "figurative phrase", hint: "A phrase with non-literal meaning" },
        { prompt: "What does 'hold your horses' mean? Say the meaning.", expected: "be patient", hint: "Wait or slow down" },
        { prompt: "Say a word that rhymes with 'enough'.", expected: "rough", hint: "R-O-U-G-H" }
    ];
    const listenDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) {
        for(let i=0;i<15;i++) {
            listenDB[l].push({...listenQuestions[i % listenQuestions.length]});
        }
    }

    // ---------- MODE 3: NOUNS MASTERY ----------
    const nounsQuestions = [
        { text: "What type of noun is 'teacher'?", options: ["Common noun", "Proper noun", "Abstract noun", "Collective noun"], correct: 0, hint: "General name for a person" },
        { text: "Which word is a proper noun?", options: ["Kenya", "country", "city", "river"], correct: 0, hint: "Specific name" },
        { text: "What type of noun is 'happiness'?", options: ["Abstract noun", "Concrete noun", "Proper noun", "Collective noun"], correct: 0, hint: "Emotion/idea" },
        { text: "Which is a collective noun?", options: ["family", "teacher", "apple", "river"], correct: 0, hint: "Group" },
        { text: "What is the plural of 'child'?", options: ["children", "childs", "childes", "childern"], correct: 0, hint: "Irregular plural" },
        { text: "What is the collective noun for a group of lions?", options: ["pride", "pack", "herd", "flock"], correct: 0, hint: "Pride" },
        { text: "What is an abstract noun?", options: ["An idea, feeling, or quality", "A physical object", "A specific name", "A group of things"], correct: 0, hint: "Cannot be touched" },
        { text: "Which noun is concrete?", options: ["apple", "love", "courage", "kindness"], correct: 0, hint: "Physical object" },
        { text: "What is the plural of 'goose'?", options: ["geese", "gooses", "goosies", "goos"], correct: 0, hint: "Geese" },
        { text: "A 'school of fish' — 'school' is a ____ noun.", options: ["collective", "proper", "abstract", "common"], correct: 0, hint: "Group name" },
        { text: "Identify the proper noun in: 'We visited Lake Victoria.'", options: ["Lake Victoria", "visited", "we", "lake"], correct: 0, hint: "Specific lake name" },
        { text: "What type of noun is 'wisdom'?", options: ["abstract", "concrete", "proper", "collective"], correct: 0, hint: "Quality" },
        { text: "The plural of 'foot' is ____.", options: ["feet", "foots", "footes", "footies"], correct: 0, hint: "Feet" },
        { text: "What is the collective noun for a group of cattle?", options: ["herd", "flock", "pride", "school"], correct: 0, hint: "Herd" },
        { text: "What is the plural of 'man'?", options: ["men", "mans", "manes", "mens"], correct: 0, hint: "Men" }
    ];
    const nounsDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) {
        for(let i=0;i<15;i++) {
            nounsDB[l].push({...nounsQuestions[i % nounsQuestions.length]});
        }
    }

    const modeBuilders = {
        reading: (lvl) => readingDB[lvl],
        listening: (lvl) => listenDB[lvl],
        nouns: (lvl) => nounsDB[lvl]
    };
    const modeNames = { reading:"📖 Intensive Reading", listening:"🎤 Listen & Speak", nouns:"📚 Nouns Mastery" };

    let currentMode = "reading";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = Math.ceil(totalQuestions * 0.8);
    let answeringLock = false;
    let levelFinished = false;
    let gameActive = true;
    let levelScores = {1:0,2:0,3:0,4:0};
    let levelUnlocked = {1:true,2:false,3:false,4:false};
    let totalPoints = 0;
    
    // Voice recognition for listening mode
    let recognition = null;
    let isListening = false;

    const dynamicDiv = document.getElementById('quizMain');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const totalScoreSpan = document.getElementById('totalScoreDisplay');
    const kenyanFactArea = document.getElementById('kenyanFactArea');
    const facts = [
        "Kenya has over 40 ethnic communities — each with unique traditions!",
        "The word 'safari' means 'journey' in Swahili — now used worldwide!",
        "Kenya's first Nobel Prize winner was Wangari Maathai in 2004!",
        "Mount Kenya is the second-highest mountain in Africa!"
    ];

    function updateTotalScore() {
        totalPoints = Object.values(levelScores).reduce((a,b)=>a+b,0);
        totalScoreSpan.innerText = totalPoints;
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''} ${!levelUnlocked[i] ? 'locked' : ''}`;
            btn.innerText = `Level ${i}`;
            btn.onclick = () => { if(levelUnlocked[i] && i !== currentLevel) switchLevel(i); };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchLevel(level) {
        if(!levelUnlocked[level]) return;
        if(recognition) recognition.abort();
        currentLevel = level;
        currentQIndex = 0;
        levelScore = levelScores[level] || 0;
        levelFinished = false;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[(level-1)%facts.length]}`;
    }

    function checkLevelCompletion() {
        if(levelScore >= requiredCorrect && currentQIndex >= totalQuestions) {
            if(currentLevel === 4) {
                dynamicDiv.innerHTML = `<div class="level-complete">🏆 HONGERA! You mastered ${modeNames[currentMode]}! 🏆</div>`;
                gameActive = false;
            } else if(!levelUnlocked[currentLevel+1]) {
                levelUnlocked[currentLevel+1] = true;
                updateLevelButtons();
                dynamicDiv.innerHTML = `<div class="level-complete">🎉 UNLOCKED: Level ${currentLevel+1}! 🎉<br>Click Next Level to continue</div>
                    <button id="nextLevelBtn" class="next-btn" style="margin-top:1rem;">🚀 Next Level</button>`;
                document.getElementById('nextLevelBtn')?.addEventListener('click', () => {
                    currentLevel++;
                    currentQIndex = 0;
                    levelScore = 0;
                    levelFinished = false;
                    gameActive = true;
                    answeringLock = false;
                    levelQuestions = modeBuilders[currentMode](currentLevel);
                    loadCurrentQuestion();
                    updateLevelButtons();
                    dynamicDiv.innerHTML = '';
                });
            }
        } else if(currentQIndex >= totalQuestions) {
            dynamicDiv.innerHTML = `<div class="level-complete">📘 You scored ${levelScore}/${totalQuestions}. Need ${requiredCorrect} to unlock next level.<br><button onclick="location.reload()" class="next-btn" style="margin-top:1rem;">🔄 Try Again</button></div>`;
            gameActive = false;
        }
    }

    function shuffleAnswers(q) {
        const opts = q.options.map((opt,i) => ({text:opt, isCorrect: i===q.correct}));
        for(let i=opts.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
        const newOpts = opts.map(o=>o.text);
        const newCorrect = opts.findIndex(o=>o.isCorrect);
        return { text:q.text, hint:q.hint, options:newOpts, correct:newCorrect };
    }

    // ---------- READING & NOUNS MODE (Multiple Choice) ----------
    function handleMCAnswer(selectedIdx, correctIdx, currentItem) {
        if(answeringLock || !gameActive) return;
        answeringLock = true;
        const isCorrect = (selectedIdx === correctIdx);
        if(isCorrect) {
            levelScore++;
            levelScores[currentLevel] = levelScore;
            updateTotalScore();
        }
        renderMCQuestion(currentItem, isCorrect, correctIdx, selectedIdx);
        if(isCorrect && currentQIndex+1 >= totalQuestions) checkLevelCompletion();
    }

    function renderMCQuestion(currentItem, wasCorrect, correctIdx, selectedIdx) {
        const hint = currentItem.hint;
        let answersHtml = '';
        currentItem.options.forEach((opt, idx) => {
            let cls = '';
            if(wasCorrect !== undefined && idx === correctIdx) cls = 'correct-feedback';
            else if(wasCorrect !== undefined && idx === selectedIdx && idx !== correctIdx) cls = 'wrong-feedback';
            answersHtml += `<div class="answer-card ${cls}">${String.fromCharCode(65+idx)}. ${opt}</div>`;
        });
        const feedbackMsg = wasCorrect === true ? '✅ Correct! +1 point ✅' : (wasCorrect === false ? `❌ Oops! Correct: ${currentItem.options[correctIdx]} ❌` : '');
        dynamicDiv.innerHTML = `
            <div class="progress-area">
                <div class="q-counter">📖 Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Level ${currentLevel}</div>
                <div class="hint-box">💡 Hint: ${hint}</div>
            </div>
            <div class="question-text">❓ ${currentItem.text}</div>
            <div class="answers-grid" id="answersGrid">
                ${answersHtml}
            </div>
            ${feedbackMsg ? `<div style="text-align:center; font-weight:600;">${feedbackMsg}</div>` : ''}
            ${wasCorrect !== undefined ? `<button id="nextBtnAction" class="next-btn">➡ Next Question ⬅</button>` : ''}
        `;
        if(wasCorrect !== undefined) {
            document.getElementById('nextBtnAction')?.addEventListener('click', () => {
                currentQIndex++;
                if(currentQIndex < totalQuestions) {
                    answeringLock = false;
                    loadCurrentQuestion();
                } else {
                    checkLevelCompletion();
                }
            });
        } else {
            document.querySelectorAll('.answer-card').forEach((card, idx) => {
                card.addEventListener('click', () => handleMCAnswer(idx, currentItem.correct, currentItem));
            });
        }
    }

    // ---------- LISTENING MODE (Voice Only) ----------
    function speakText(text) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function startListening(currentItem) {
        if(answeringLock || !gameActive) return;
        if(!window.SpeechRecognition && !window.webkitSpeechRecognition) {
            dynamicDiv.innerHTML += `<div class="status bad-status">Voice not supported. Use Chrome.</div>`;
            return;
        }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(recognition) recognition.abort();
        recognition = new SpeechRec();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.onstart = () => { isListening = true; const mb = document.getElementById('micBtn'); if(mb) mb.classList.add('listening'); };
        recognition.onend = () => { isListening = false; const mb = document.getElementById('micBtn'); if(mb) mb.classList.remove('listening'); };
        recognition.onresult = (event) => {
            const spoken = event.results[0][0].transcript.toLowerCase().trim();
            const expected = currentItem.expected.toLowerCase();
            const isMatch = spoken === expected || (spoken.includes(expected) && Math.abs(spoken.length-expected.length)<=3);
            answeringLock = true;
            if(isMatch) {
                levelScore++;
                levelScores[currentLevel] = levelScore;
                updateTotalScore();
                renderVoiceFeedback(true, currentItem.expected);
                if(currentQIndex+1 >= totalQuestions) checkLevelCompletion();
            } else {
                renderVoiceFeedback(false, currentItem.expected);
            }
            recognition = null;
        };
        recognition.onerror = () => { recognition = null; };
        recognition.start();
    }

    function renderVoiceFeedback(isCorrect, correctAnswer) {
        if(isCorrect) {
            dynamicDiv.innerHTML += `<div class="success-message">🎉✨ CORRECT! +1 point! ✨🎉</div>
                <button id="nextBtnAction" class="next-btn">➡ Next Question ⬅</button>`;
            document.getElementById('nextBtnAction')?.addEventListener('click', () => {
                currentQIndex++;
                if(currentQIndex < totalQuestions) {
                    answeringLock = false;
                    loadCurrentQuestion();
                } else {
                    checkLevelCompletion();
                }
            });
        } else {
            dynamicDiv.innerHTML += `<div class="status bad-status">❌ Incorrect. The correct answer is: "${correctAnswer}".</div>
                <button id="retryBtn" class="listen-btn" style="margin-top:0.5rem;">🔄 Try Again</button>`;
            document.getElementById('retryBtn')?.addEventListener('click', () => {
                answeringLock = false;
                loadCurrentQuestion();
            });
        }
    }

    function loadCurrentQuestion() {
        if(!gameActive) return;
        if(currentQIndex >= totalQuestions) {
            checkLevelCompletion();
            return;
        }
        const q = levelQuestions[currentQIndex];
        if(!q) { checkLevelCompletion(); return; }
        
        if(currentMode === 'listening') {
            dynamicDiv.innerHTML = `
                <div class="progress-area">
                    <div class="q-counter">🎧 Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Level ${currentLevel}</div>
                </div>
                <div class="question-card" style="text-align:center; padding:1rem;">
                    <div class="hint-text" style="background:#fef6df; display:inline-block; padding:0.3rem 1rem; border-radius:40px; margin-bottom:1rem;">💡 Hint: ${q.hint}</div>
                    <div class="question-text" style="margin-top:0.5rem;">🎤 ${q.prompt}</div>
                    <div class="voice-controls">
                        <button id="listenBtn" class="listen-btn">🔊 LISTEN TO PROMPT</button>
                        <button id="micBtn" class="microphone-btn">🎙️ SPEAK ANSWER</button>
                    </div>
                    <div id="dynamicStatus" class="status warning-status">Click microphone and speak your answer clearly</div>
                </div>
            `;
            document.getElementById('listenBtn')?.addEventListener('click', () => speakText(q.prompt));
            document.getElementById('micBtn')?.addEventListener('click', () => startListening(q));
        } else {
            const shuffled = shuffleAnswers(q);
            renderMCQuestion(shuffled, undefined, undefined, undefined);
        }
    }

    function initMode(mode) {
        if(recognition) recognition.abort();
        if(mode === currentMode && gameActive && levelQuestions.length > 0) return;
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        requiredCorrect = Math.ceil(totalQuestions * 0.8);
        levelFinished = false;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        updateTotalScore();
        updateLevelButtons();
        loadCurrentQuestion();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[0]}`;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    // Event Listeners
    document.getElementById('tabReading').addEventListener('click', () => initMode('reading'));
    document.getElementById('tabListening').addEventListener('click', () => initMode('listening'));
    document.getElementById('TabNouns').addEventListener('click', () => initMode('nouns'));

    // Initialize
    for(let i=1;i<=4;i++) levelScores[i]=0;
    initMode('reading');
</script>
</body>
</html>
