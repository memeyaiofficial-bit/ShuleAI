<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Creative Arts Quest | Grade 3 | Push & Pull, Drawing, Rhythm, Skipping, Collage, Melody, Weaving</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #6B3FA0 0%, #9B59B6 50%, #E67E22 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #FFF9F0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .stats-bar {
            background: #FF8C42;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            border-bottom: 5px solid #D35400;
            color: #2d2b1f;
            font-weight: bold;
        }

        .stat {
            background: #2C3E50;
            padding: 6px 14px;
            border-radius: 100px;
            color: #FFEAA7;
            font-size: 0.9rem;
            box-shadow: inset 0 -1px 0 #1A252F;
        }

        .stat span:first-child {
            color: #FFB347;
            margin-right: 6px;
        }

        .level-badge {
            background: #C0392B;
            color: gold;
        }

        .question-area {
            padding: 25px 25px 15px 25px;
            text-align: center;
        }

        .question-text {
            background: #FDEBD0;
            padding: 25px 15px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #4A235A;
            box-shadow: inset 0 0 0 3px white, 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            word-break: break-word;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-btn {
            background: #F39C12;
            border: none;
            font-size: 1.3rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.05s linear;
            box-shadow: 0 4px 0 #B86F0F;
            font-weight: bold;
            color: #2C1A0A;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #B86F0F;
        }

        .answer-section {
            margin: 15px 0;
        }

        .answer-input {
            width: 85%;
            padding: 16px 20px;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 60px;
            border: 3px solid #F5B041;
            background: white;
            font-weight: bold;
            outline: none;
        }

        .answer-input:focus {
            border-color: #E67E22;
            box-shadow: 0 0 0 3px rgba(230,126,34,0.4);
        }

        .hint-area {
            background: #FFE5B4;
            margin-top: 12px;
            padding: 10px;
            border-radius: 60px;
            font-size: 0.9rem;
            color: #A04000;
            font-weight: bold;
            min-height: 60px;
        }

        .timer-box {
            background: #1B2B3E;
            padding: 10px 20px;
            margin: 10px 25px;
            border-radius: 50px;
            color: #F0F0F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .timer-clock {
            background: black;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.7rem;
            letter-spacing: 2px;
            color: #2ECC71;
            font-weight: bold;
        }

        .submit-btn {
            background: #27AE60;
            border: none;
            font-size: 1.4rem;
            padding: 14px 20px;
            width: 80%;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 6px 0 #1E8449;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1E8449;
        }

        .feedback {
            font-size: 1.1rem;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 50px;
            margin: 10px 25px 20px;
            background: #F0E6D2;
        }

        .next-level-info {
            background: linear-gradient(90deg, #F1C40F, #F39C12);
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            margin: 5px 20px 20px;
            font-weight: bold;
            color: #2C2B1F;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1.1rem; }
            .answer-input { font-size: 1rem; width: 90%; }
            .timer-clock { font-size: 1.3rem; }
            .stat { font-size: 0.7rem; }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat level-badge"><span>🎨 LEVEL</span> <span id="levelNum">1</span></div>
        <div class="stat"><span>⭐ SCORE</span> <span id="scoreDisplay">0</span></div>
        <div class="stat"><span>📊 PROGRESS</span> <span id="qCounter">0</span>/<span id="totalQLevel">30</span></div>
        <div class="stat"><span>🎯 NEED</span> 80%</div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading your creative adventure...</div>
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <div class="hint-area" id="hintMsg">🎧 Click the speaker to hear the question. Type short answers (1-3 words or numbers).</div>
    </div>
    <div class="timer-box">
        <span>⏳ TIME LEFT</span>
        <span class="timer-clock" id="timerDisplay">40</span>
    </div>
    <button class="submit-btn" id="submitAnswer">✅ CHECK ANSWER</button>
    <div class="feedback" id="feedbackMsg">🌟 Answer each question! Get 80% correct to level up.</div>
    <div id="levelInfoMsg" class="next-level-info"></div>
</div>

<script>
    // CBC GRADE 3 CREATIVE ARTS & EXPLORATION GAME
    // Topics: Pushing & Pulling, Drawing & Painting, Rhythm Pattern Making, Skipping, Collage, Melody, Weaving
    // 5 Levels x 30 UNIQUE questions each, 40 sec timer, voice output, hints as time decreases
    
    (function() {
        // ------------------------ TOPIC-BASED QUESTION GENERATOR ------------------------
        // Each level gets 30 unique questions covering all 7 topics equally
        
        const TOPICS = [
            "Pushing & Pulling", "Drawing & Painting", "Rhythm Pattern", 
            "Skipping", "Collage", "Melody", "Weaving"
        ];
        
        function generateQuestionsForLevel(level) {
            const questions = [];
            const usedTexts = new Set();
            
            function addQuestion(text, expectedAnswer, topic) {
                if (usedTexts.has(text)) return;
                usedTexts.add(text);
                let expectedStr = String(expectedAnswer).trim().toLowerCase();
                questions.push({
                    text: text,
                    expected: expectedAnswer,
                    expectedStr: expectedStr,
                    topic: topic,
                    checkAnswer: function(userInput) {
                        let userStr = String(userInput).trim().toLowerCase().replace(/\s/g, '');
                        return userStr === this.expectedStr;
                    },
                    getHint: function(secondsLeft) {
                        if (secondsLeft <= 8) return `💡 HINT: The answer is "${this.expected}"`;
                        if (secondsLeft <= 18) return `⏰ Think about ${topic.toLowerCase()}!`;
                        return `🎨 Type your answer. ${secondsLeft} seconds left.`;
                    }
                });
            }
            
            // ----- PUSHING & PULLING (Force, motion) -----
            const pushPullQA = [
                {q: "When you move a toy car away from you, you are doing what? (push or pull)", ans: "push"},
                {q: "When you bring a door towards you to close it, you are doing what? (push or pull)", ans: "pull"},
                {q: "Which force makes a ball roll down a hill? (push or pull)", ans: "pull"},
                {q: "Kicking a ball is an example of what force?", ans: "push"},
                {q: "Opening a drawer uses which force?", ans: "pull"},
                {q: "Closing a drawer uses which force?", ans: "push"},
                {q: "Tug of war is an example of which force?", ans: "pull"},
                {q: "Pressing a doorbell uses which force?", ans: "push"}
            ];
            for (let i = 0; i < 5; i++) {
                let item = pushPullQA[(level + i) % pushPullQA.length];
                addQuestion(item.q, item.ans, "Pushing & Pulling");
            }
            
            // ----- DRAWING & PAINTING -----
            const drawPaintQA = [
                {q: "What tool do you use to paint with watercolors? (brush or pencil)", ans: "brush"},
                {q: "What do you mix with dry paint to make it wet? (water or oil)", ans: "water"},
                {q: "The surface you paint on is called a? (canvas or paper)", ans: "canvas"},
                {q: "A drawing of a person's face is called a? (portrait or landscape)", ans: "portrait"},
                {q: "What colorful stick do you use for drawing? (crayon or marker)", ans: "crayon"},
                {q: "What is the main color of a school bus? (yellow or red)", ans: "yellow"},
                {q: "Mixing blue and yellow gives what color?", ans: "green"},
                {q: "Mixing red and yellow gives what color?", ans: "orange"},
                {q: "What do you call a drawing of outdoor scenery? (landscape or still life)", ans: "landscape"}
            ];
            for (let i = 0; i < 5; i++) {
                let item = drawPaintQA[(level * 2 + i) % drawPaintQA.length];
                addQuestion(item.q, item.ans, "Drawing & Painting");
            }
            
            // ----- RHYTHM PATTERN MAKING -----
            const rhythmQA = [
                {q: "A repeated sound pattern in music is called? (rhythm or melody)", ans: "rhythm"},
                {q: "What do you use to tap a rhythm? (drum stick or brush)", ans: "drum stick"},
                {q: "Clapping hands creates what? (sound or picture)", ans: "sound"},
                {q: "A pattern of strong and weak beats is called? (tempo or rhythm)", ans: "rhythm"},
                {q: "What word means how fast or slow the rhythm is? (tempo or pitch)", ans: "tempo"},
                {q: "Stamping your feet is a way to make? (rhythm or melody)", ans: "rhythm"},
                {q: "A group of beats is called a? (measure or note)", ans: "measure"},
                {q: "One two three four repeated is a? (pattern or noise)", ans: "pattern"}
            ];
            for (let i = 0; i < 4; i++) {
                let item = rhythmQA[(level + i) % rhythmQA.length];
                addQuestion(item.q, item.ans, "Rhythm Pattern");
            }
            
            // ----- SKIPPING -----
            const skippingQA = [
                {q: "What rope do you jump over when playing? (skipping rope or string)", ans: "skipping rope"},
                {q: "Skipping is a form of what activity? (exercise or sleeping)", ans: "exercise"},
                {q: "How many feet do you use for basic skipping? (one or two)", ans: "two"},
                {q: "Skipping helps improve what? (balance or eating)", ans: "balance"},
                {q: "What word means jumping over a rope repeatedly? (skipping or hopping)", ans: "skipping"},
                {q: "Skipping is also good for your what? (heart or eyes)", ans: "heart"},
                {q: "When you skip, you move your arms in a? (circle or straight line)", ans: "circle"},
                {q: "Skipping rope can be done alone or in a? (group or forest)", ans: "group"}
            ];
            for (let i = 0; i < 4; i++) {
                let item = skippingQA[(level * 2 + i) % skippingQA.length];
                addQuestion(item.q, item.ans, "Skipping");
            }
            
            // ----- COLLAGE -----
            const collageQA = [
                {q: "What art form uses cut paper and glue? (collage or painting)", ans: "collage"},
                {q: "What do you use to stick pieces in a collage? (glue or tape)", ans: "glue"},
                {q: "Collage often uses what kind of paper? (magazine or plain)", ans: "magazine"},
                {q: "What tool cuts paper for collage? (scissors or brush)", ans: "scissors"},
                {q: "Collage can also use what kind of fabric? (cloth or metal)", ans: "cloth"},
                {q: "What material from nature can be used in collage? (leaves or rocks)", ans: "leaves"},
                {q: "The base where you stick collage pieces is called? (background or frame)", ans: "background"},
                {q: "Which artist is famous for collage? (Picasso or Mozart)", ans: "picasso"}
            ];
            for (let i = 0; i < 4; i++) {
                let item = collageQA[(level + i) % collageQA.length];
                addQuestion(item.q, item.ans, "Collage");
            }
            
            // ----- MELODY -----
            const melodyQA = [
                {q: "A sequence of musical notes that sounds good is a? (melody or noise)", ans: "melody"},
                {q: "What part of a song do you hum? (melody or beat)", ans: "melody"},
                {q: "High and low sounds are called? (pitch or volume)", ans: "pitch"},
                {q: "What musical instrument has black and white keys? (piano or guitar)", ans: "piano"},
                {q: "A melody that is easy to remember is called? (catchy or loud)", ans: "catchy"},
                {q: "Singing uses your what? (voice or hands)", ans: "voice"},
                {q: "What word means the tune of a song? (melody or rhythm)", ans: "melody"},
                {q: "A flute produces sound by blowing? (air or water)", ans: "air"}
            ];
            for (let i = 0; i < 4; i++) {
                let item = melodyQA[(level * 3 + i) % melodyQA.length];
                addQuestion(item.q, item.ans, "Melody");
            }
            
            // ----- WEAVING -----
            const weavingQA = [
                {q: "Crossing threads over and under is called? (weaving or knitting)", ans: "weaving"},
                {q: "What tool is used for weaving? (loom or brush)", ans: "loom"},
                {q: "Vertical threads on a loom are called? (warp or weft)", ans: "warp"},
                {q: "Horizontal threads on a loom are called? (weft or warp)", ans: "weft"},
                {q: "Weaving creates what kind of material? (fabric or metal)", ans: "fabric"},
                {q: "What natural fiber is used for weaving? (cotton or plastic)", ans: "cotton"},
                {q: "A woven mat is often made from? (grass or paper)", ans: "grass"},
                {q: "What African country is famous for kente cloth weaving? (Ghana or Kenya)", ans: "ghana"}
            ];
            for (let i = 0; i < 4; i++) {
                let item = weavingQA[(level + i) % weavingQA.length];
                addQuestion(item.q, item.ans, "Weaving");
            }
            
            // Ensure exactly 30 questions (add fillers if needed)
            while (questions.length < 30) {
                addQuestion(`What do you call moving a toy car towards you? (push or pull)`, "pull", "Pushing & Pulling");
            }
            if (questions.length > 30) questions.length = 30;
            
            // Shuffle for variety
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            return questions;
        }
        
        // ------------------------ GAME STATE ------------------------
        let currentLevel = 1;
        let currentQuestions = [];
        let currentQIndex = 0;
        let levelCorrectCount = 0;
        let totalPerLevel = 30;
        let timerInterval = null;
        let timeLeft = 40;
        let isWaiting = false;
        let currentQuestion = null;
        
        // DOM elements
        const levelNumSpan = document.getElementById("levelNum");
        const scoreDisplaySpan = document.getElementById("scoreDisplay");
        const qCounterSpan = document.getElementById("qCounter");
        const totalQLevelSpan = document.getElementById("totalQLevel");
        const questionTextDiv = document.getElementById("questionText");
        const answerInput = document.getElementById("answerInput");
        const hintMsgDiv = document.getElementById("hintMsg");
        const timerDisplaySpan = document.getElementById("timerDisplay");
        const submitBtn = document.getElementById("submitAnswer");
        const feedbackMsgDiv = document.getElementById("feedbackMsg");
        const levelInfoMsgDiv = document.getElementById("levelInfoMsg");
        const speakBtn = document.getElementById("speakBtn");
        
        totalQLevelSpan.innerText = "30";
        
        // Speech synthesis
        let speechSynth = window.speechSynthesis;
        
        function speakText(message) {
            if (!message) return;
            try {
                if (speechSynth.speaking) speechSynth.cancel();
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.lang = "en-US";
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    speechSynth.speak(utterance);
                }, 50);
            } catch(e) { console.warn("Speech error:", e); }
        }
        
        // Timer functions
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function updateTimerDisplay() {
            timerDisplaySpan.innerText = timeLeft;
            if (timeLeft <= 8) timerDisplaySpan.style.color = "#FF6666";
            else if (timeLeft <= 20) timerDisplaySpan.style.color = "#FFAA44";
            else timerDisplaySpan.style.color = "#2ECC71";
        }
        
        function startTimer() {
            stopTimer();
            timeLeft = 40;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (isWaiting) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (!isWaiting) {
                        speakText("Time is up, moving to the next question");
                        handleTimeExpired();
                    }
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                    if (currentQuestion && !isWaiting) {
                        if (timeLeft <= 12) {
                            hintMsgDiv.innerHTML = currentQuestion.getHint(timeLeft);
                        } else if (timeLeft <= 25) {
                            hintMsgDiv.innerHTML = `⏰ ${timeLeft} seconds left. Think about ${currentQuestion.topic}!`;
                        } else {
                            hintMsgDiv.innerHTML = `✨ ${timeLeft} seconds left. Click speaker to hear question again.`;
                        }
                    }
                }
            }, 1000);
        }
        
        let isTimeoutMove = false;
        
        function handleTimeExpired() {
            if (isWaiting) return;
            isWaiting = true;
            isTimeoutMove = true;
            feedbackMsgDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
            setTimeout(() => {
                moveToNextQuestion(false);
            }, 1600);
        }
        
        function moveToNextQuestion(isCorrect) {
            stopTimer();
            
            if (isCorrect) {
                levelCorrectCount++;
                scoreDisplaySpan.innerText = levelCorrectCount;
                feedbackMsgDiv.innerHTML = "✅ CORRECT! Great job! +1 point";
                speakText("Correct answer! Well done.");
            } else {
                if (!isTimeoutMove) {
                    let correctAns = currentQuestion ? currentQuestion.expected : "?";
                    feedbackMsgDiv.innerHTML = `❌ INCORRECT! The correct answer is: ${correctAns}`;
                    speakText(`Wrong answer. The correct answer is ${correctAns}.`);
                } else {
                    feedbackMsgDiv.innerHTML = `⏰ TIME IS UP! Moving to next question.`;
                }
            }
            
            isTimeoutMove = false;
            currentQIndex++;
            qCounterSpan.innerText = currentQIndex;
            
            // Level completion check
            if (currentQIndex >= totalPerLevel) {
                let percentage = (levelCorrectCount / totalPerLevel) * 100;
                if (percentage >= 80) {
                    if (currentLevel < 5) {
                        levelInfoMsgDiv.innerHTML = `🎉 LEVEL ${currentLevel} PASSED! ${Math.floor(percentage)}% → Moving to LEVEL ${currentLevel + 1}`;
                        speakText(`Congratulations! You passed level ${currentLevel}. Moving to next level.`);
                        currentLevel++;
                        currentQIndex = 0;
                        levelCorrectCount = 0;
                        isWaiting = false;
                        initializeLevel(currentLevel);
                    } else {
                        feedbackMsgDiv.innerHTML = "🏆🏆🏆 AMAZING! You completed ALL 5 LEVELS! YOU ARE A CREATIVE CHAMPION! 🏆🏆🏆";
                        levelInfoMsgDiv.innerHTML = "🎉🎉 GAME COMPLETE! Refresh page to play again. 🎉🎉";
                        speakText("Congratulations! You completed all five levels. You are a creative champion!");
                        submitBtn.disabled = true;
                        answerInput.disabled = true;
                        stopTimer();
                        isWaiting = true;
                        return;
                    }
                } else {
                    levelInfoMsgDiv.innerHTML = `❌ LEVEL ${currentLevel} FAILED! ${Math.floor(percentage)}% (Need 80%). Restarting level... Keep trying!`;
                    speakText(`You scored ${Math.floor(percentage)} percent. Need 80 to pass. Restarting level ${currentLevel}.`);
                    currentQIndex = 0;
                    levelCorrectCount = 0;
                    isWaiting = false;
                    initializeLevel(currentLevel);
                }
                return;
            }
            
            isWaiting = false;
            loadQuestion();
        }
        
        function loadQuestion() {
            if (currentQIndex >= currentQuestions.length) return;
            currentQuestion = currentQuestions[currentQIndex];
            questionTextDiv.innerText = currentQuestion.text;
            answerInput.value = "";
            answerInput.disabled = false;
            submitBtn.disabled = false;
            feedbackMsgDiv.innerHTML = "⏳ Type your answer & click CHECK. Timer: 40 seconds.";
            hintMsgDiv.innerHTML = `🎨 Topic: ${currentQuestion.topic} | Type short answer.`;
            scoreDisplaySpan.innerText = levelCorrectCount;
            levelNumSpan.innerText = currentLevel;
            qCounterSpan.innerText = currentQIndex;
            isWaiting = false;
            stopTimer();
            startTimer();
            answerInput.focus();
        }
        
        function submitAnswer() {
            if (isWaiting) {
                feedbackMsgDiv.innerHTML = "⏳ Please wait, loading next question...";
                return;
            }
            if (!currentQuestion) {
                feedbackMsgDiv.innerHTML = "⚠️ No active question. Please wait.";
                return;
            }
            let userAnswer = answerInput.value.trim();
            if (userAnswer === "") {
                feedbackMsgDiv.innerHTML = "📝 Please type an answer before submitting!";
                speakText("Type your answer first.");
                return;
            }
            stopTimer();
            let correct = currentQuestion.checkAnswer(userAnswer);
            isWaiting = true;
            isTimeoutMove = false;
            moveToNextQuestion(correct);
        }
        
        function speakCurrentQuestion() {
            if (!currentQuestion || isWaiting) {
                speakText("Please wait, the next question is loading.");
                return;
            }
            speakText(currentQuestion.text);
        }
        
        function initializeLevel(level) {
            currentLevel = level;
            currentQuestions = generateQuestionsForLevel(level);
            totalPerLevel = currentQuestions.length;
            currentQIndex = 0;
            levelCorrectCount = 0;
            isWaiting = false;
            isTimeoutMove = false;
            
            levelNumSpan.innerText = level;
            scoreDisplaySpan.innerText = "0";
            qCounterSpan.innerText = "0";
            totalQLevelSpan.innerText = totalPerLevel;
            feedbackMsgDiv.innerHTML = `🎨 LEVEL ${level} START! Answer ${totalPerLevel} questions, need 80% to advance. 🎨`;
            levelInfoMsgDiv.innerHTML = `🌟 Topics: Pushing & Pulling, Drawing & Painting, Rhythm, Skipping, Collage, Melody, Weaving. You can do it! 🌟`;
            
            submitBtn.disabled = false;
            answerInput.disabled = false;
            loadQuestion();
        }
        
        // Event listeners
        submitBtn.addEventListener("click", submitAnswer);
        speakBtn.addEventListener("click", speakCurrentQuestion);
        answerInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !isWaiting && currentQuestion) {
                submitAnswer();
            }
        });
        
        // Start game
        initializeLevel(1);
    })();
</script>
</body>
</html>
