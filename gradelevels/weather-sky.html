<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo and the Sky - Grade 1 CBC | Day Sky, Night Sky, Weather & Recording Weather</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e6091 0%, #0f3b5c 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #1e6091;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        ☀️🌙🌦️ Bobo and the Sky! Learn about the Day Sky, Night Sky, Weather & Recording Weather.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Day Sky, Night Sky, Weather, Recording Weather ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // DAY SKY
        const daySky = [
            { q: "During the day, the sky has a bright, shining object. It is the ______.", a: "sun" },
            { q: "The sun gives us ______ and heat.", a: "light" },
            { q: "A white fluffy cloud in the sky is called a ______.", a: "cloud" },
            { q: "The daytime sky is usually ______ in color.", a: "blue" },
            { q: "During the day, birds fly in the sky using their ______.", a: "wings" },
            { q: "The sun rises in the ______.", a: "east" },
            { q: "The sun sets in the ______.", a: "west" },
            { q: "When there are no clouds, the sun is very ______.", a: "bright" },
            { q: "A big gray cloud can bring ______.", a: "rain" },
            { q: "A rainbow has ______ colors.", a: "seven" }
        ];
        
        // NIGHT SKY
        const nightSky = [
            { q: "At night, the sky has the ______ and stars.", a: "moon" },
            { q: "The moon gives off a soft ______ at night.", a: "light" },
            { q: "Many small shining objects in the night sky are called ______.", a: "stars" },
            { q: "A group of stars that looks like a bear is called the Big ______.", a: "dipper" },
            { q: "The brightest planet we see at night is ______.", a: "venus" },
            { q: "The night sky is ______ in color.", a: "black" },
            { q: "The first star seen in the evening is called the evening ______.", a: "star" },
            { q: "A full moon is shaped like a ______.", a: "circle" },
            { q: "When the moon is not visible, the night is very ______.", a: "dark" },
            { q: "The Milky Way is a band of many ______ in the sky.", a: "stars" }
        ];
        
        // WEATHER
        const weather = [
            { q: "When the sun is shining and there are no clouds, the weather is ______.", a: "sunny" },
            { q: "When water falls from the sky, it is ______.", a: "rainy" },
            { q: "When the wind blows strongly, the weather is ______.", a: "windy" },
            { q: "When there are many clouds but no rain, it is ______.", a: "cloudy" },
            { q: "When it is very cold and snow falls, it is ______.", a: "snowy" },
            { q: "When there is thunder and lightning, it is a ______.", a: "storm" },
            { q: "When fog makes it hard to see far, it is ______.", a: "foggy" },
            { q: "The measure of how hot or cold it is, is called ______.", a: "temperature" },
            { q: "When rain falls with strong wind, it is a ______.", a: "hurricane" },
            { q: "When there is sun and a few clouds, the weather is ______.", a: "partly cloudy" }
        ];
        
        // RECORDING WEATHER
        const recording = [
            { q: "An instrument that measures temperature is called a ______.", a: "thermometer" },
            { q: "An instrument that measures rainfall is called a ______.", a: "rain gauge" },
            { q: "An instrument that shows wind direction is called a ______.", a: "weather vane" },
            { q: "A book where you write down the weather is called a ______.", a: "weather journal" },
            { q: "A person who predicts the weather is called a ______.", a: "meteorologist" },
            { q: "We record the weather every ______ to see changes.", a: "day" },
            { q: "A sun symbol in a weather journal means ______.", a: "sunny" },
            { q: "A cloud with raindrops symbol means ______.", a: "rainy" },
            { q: "An instrument that measures wind speed is called an ______.", a: "anemometer" },
            { q: "Recording weather helps us know the ______ forecast.", a: "future" }
        ];
        
        const allTopics = [...daySky, ...nightSky, ...weather, ...recording];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo looks at the sky during the day. He sees a bright, shiny object. It is the ______.";
                correctAnswer = "sun";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "At night, Bobo counts the shining objects in the sky. He sees many ______.";
                correctAnswer = "stars";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Today there is a lot of rain. Bobo uses a ______ to measure how much rain fell.";
                correctAnswer = "rain gauge";
            }
            if (i % 8 === 0) {
                qText = "When the sun is shining, Bobo feels the ______ in the air.";
                correctAnswer = "heat";
            }
            if (i % 9 === 0) {
                qText = "At night, the dark sky has the moon and many twinkling ______.";
                correctAnswer = "stars";
            }
            if (i % 11 === 0) {
                qText = "Bobo writes in his weather journal: 'Today is very ______, I can play outside.'";
                correctAnswer = "sunny";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: The Day Sky and the Sun! What shines during the day?";
        else if (currentLevel === 2) levelDesc = "Level 2: The Night Sky and Stars! What can you see in the sky at night?";
        else if (currentLevel === 3) levelDesc = "Level 3: Weather! Sunny, rainy, windy, cloudy - do you know them?";
        else if (currentLevel === 4) levelDesc = "Level 4: Recording Weather! Use tools like thermometers and rain gauges.";
        else levelDesc = "Level 5: Final Level! Become a Grade 1 Champion of the Sky and Weather!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Sky and Weather Champion Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of the Day Sky, Night Sky, Weather, and Recording Weather!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know about the sun, moon, stars, rain, and weather tools! ☀️🌙🌦️📝";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about the sky and weather!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for English answers
        if (!isCorrect) {
            const forgiving = {
                "sun": ["the sun", "sunshine"],
                "light": ["sunlight", "brightness"],
                "cloud": ["clouds", "white cloud"],
                "blue": ["light blue", "sky blue"],
                "wings": ["wing"],
                "east": ["the east", "eastern"],
                "west": ["the west", "western"],
                "bright": ["very bright", "shiny"],
                "rain": ["raindrops", "rainfall"],
                "seven": ["7"],
                "moon": ["the moon", "full moon"],
                "stars": ["star", "twinkling stars"],
                "dipper": ["big dipper"],
                "venus": ["planet venus"],
                "black": ["dark", "midnight"],
                "star": ["evening star", "morning star"],
                "circle": ["round", "full circle"],
                "dark": ["very dark", "pitch black"],
                "sunny": ["bright sun", "sunshine"],
                "rainy": ["raining", "wet"],
                "windy": ["breezy", "strong wind"],
                "cloudy": ["overcast", "gray sky"],
                "snowy": ["snowing", "white snow"],
                "storm": ["thunderstorm", "lightning storm"],
                "foggy": ["fog", "misty"],
                "temperature": ["heat level", "hotness"],
                "hurricane": ["typhoon", "cyclone"],
                "partly cloudy": ["sun and clouds", "mixed clouds"],
                "thermometer": ["temperature gauge", "heat meter"],
                "rain gauge": ["rain collector", "pluviometer"],
                "weather vane": ["wind vane", "wind direction indicator"],
                "weather journal": ["weather diary", "log book"],
                "meteorologist": ["weather forecaster", "weather scientist"],
                "day": ["each day", "every day"],
                "anemometer": ["wind speed meter", "wind gauge"],
                "future": ["tomorrow's weather", "coming weather"],
                "heat": ["warmth", "hotness"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // Accept plural/singular
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep learning about the sky! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo and the Sky game! Learn about the Day Sky, Night Sky, Weather, and Recording Weather. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's explore the sky together!");
        }, 500);
    });
</script>
</body>
</html>
