<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Young Entrepreneur | Grade 4 Social Studies | Economic Activities & Industries</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a4d5f 0%, #0e2e3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #2a9d8f, #1e6b60);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #0e4a40;
            color: white;
            text-shadow: 2px 2px 0 #0e4a40;
        }

        .level-badge {
            background: #0a2e2a;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #2e7a6a, 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #071a16;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 0 3px #c9f2e0, 0 6px 0 #0a2a22;
        }

        .timer-number {
            background: #000000;
            padding: 6px 20px;
            border-radius: 50px;
            color: #7effc4;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e8ddc5;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #1e6b60;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-card {
            padding: 30px 28px 20px;
            background: #fffaf0;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            background: #eef5f0;
            padding: 24px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 18px rgba(0,0,0,0.1);
            color: #1e4a40;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa8e6c;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #2a9d8f;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #1a6b60;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.correct-highlight .option-prefix {
            background: #1b5e20;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn.wrong-highlight .option-prefix {
            background: #8b2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #f4a261;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 45px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #c45c1a;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #1e6b60;
            color: #e8f5f0;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px solid #f5bc70;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 0.95rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
            .timer-number { font-size: 1.5rem; min-width: 75px; letter-spacing: 2px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-critical {
            background: #8b0000 !important;
            color: #ffcc44 !important;
            text-shadow: 0 0 4px red;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.85; transform: scale(1.03);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .economy-icon {
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">💰 LEVEL <span id="levelNum">1</span> 🏭</div>
        <div class="timer-area">⏱️ TIME LEFT <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 80% TO PASS → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading economic challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">💼 YOUNG ENTREPRENEUR! Learn about jobs, industries, and school projects. Timer is RUNNING — build your economic knowledge!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC SOCIAL STUDIES: ECONOMIC ACTIVITIES IN THE COUNTY, INDUSTRIES, ENTERPRISE PROJECT AT SCHOOL
    // Topics: Farming, fishing, mining, trade, manufacturing, service industries, school enterprise projects (selling, saving)
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- BANK 1: ECONOMIC ACTIVITIES IN THE COUNTY (Farming, Fishing, Mining, Tourism, Trade) ----------
    const economicActivitiesBank = [
        { q: "Which economic activity involves growing crops and keeping animals?", correct: "Farming / Agriculture", options: ["Mining", "Farming / Agriculture", "Fishing", "Tourism"] },
        { q: "Fishing is a major economic activity around which lake in Kenya?", correct: "Lake Victoria", options: ["Lake Turkana", "Lake Victoria", "Lake Naivasha", "Lake Baringo"] },
        { q: "Mining of soda ash is done in which county?", correct: "Kajiado (Lake Magadi)", options: ["Nairobi", "Kajiado", "Kisumu", "Mombasa"] },
        { q: "Tourism as an economic activity involves:", correct: "Visiting parks, beaches and cultural sites", options: ["Building roads", "Visiting parks, beaches and cultural sites", "Growing maize", "Mining gold"] },
        { q: "Trade (buying and selling) happens mainly in:", correct: "Markets and shops", options: ["Schools", "Markets and shops", "Hospitals", "Churches"] },
        { q: "A person who makes furniture (tables, chairs) is engaging in:", correct: "Carpentry (craft/industry)", options: ["Farming", "Carpentry", "Teaching", "Nursing"] },
        { q: "Livestock keeping (rearing cows, goats) is an economic activity in counties like:", correct: "Narok, Kajiado, Laikipia", options: ["Mombasa", "Narok, Kajiado, Laikipia", "Kisumu", "Machakos"] }
    ];

    // ---------- BANK 2: INDUSTRIES IN THE COUNTY (Manufacturing, Processing, Service Industries) ----------
    const industriesBank = [
        { q: "An industry that changes raw materials into finished goods is called:", correct: "Manufacturing industry", options: ["Farming industry", "Manufacturing industry", "Mining industry", "Service industry"] },
        { q: "Which industry processes sugar cane into sugar in Western Kenya?", correct: "Sugar processing industry", options: ["Textile industry", "Sugar processing industry", "Cement industry", "Oil refinery"] },
        { q: "The cement industry is found in which Kenyan county?", correct: "Bamburi (Mombasa) / Athi River (Machakos)", options: ["Kisumu", "Mombasa / Machakos", "Nakuru", "Turkana"] },
        { q: "A textile industry produces:", correct: "Clothes and fabrics", options: ["Cars", "Clothes and fabrics", "Computers", "Food"] },
        { q: "The service industry includes jobs like:", correct: "Banking, teaching, tourism, healthcare", options: ["Farming only", "Banking, teaching, tourism, healthcare", "Mining only", "Fishing only"] },
        { q: "A dairy industry processes milk into:", correct: "Butter, cheese, yoghurt, and packaged milk", options: ["Bread", "Butter, cheese, yoghurt", "Clothes", "Cement"] },
        { q: "An oil refinery is an industry that processes:", correct: "Crude oil into fuel and other products", options: ["Maize", "Crude oil into fuel", "Sugar cane", "Cotton"] }
    ];

    // ---------- BANK 3: ENTERPRISE PROJECTS AT SCHOOL ----------
    const schoolEnterpriseBank = [
        { q: "A school enterprise project is an activity where students:", correct: "Start small businesses to learn entrepreneurship", options: ["Only play games", "Start small businesses to learn entrepreneurship", "Skip classes", "Sleep"] },
        { q: "Which is an example of a school enterprise project?", correct: "Selling snacks during break time", options: ["Fighting", "Selling snacks during break time", "Breaking windows", "Running away"] },
        { q: "A school gardening project produces vegetables which can be:", correct: "Sold to raise funds for the school", options: ["Thrown away", "Sold to raise funds for the school", "Given only to teachers", "Left to rot"] },
        { q: "What is the main purpose of a school enterprise project?", correct: "To teach students business skills and raise money", options: ["To waste time", "To teach students business skills and raise money", "To punish students", "To avoid lessons"] },
        { q: "A school 'table banking' club helps students to:", correct: "Save money and learn financial discipline", options: ["Spend all money", "Save money and learn financial discipline", "Borrow without paying", "Gamble"] },
        { q: "Making and selling liquid soap as a school project teaches:", correct: "Production, costing, and marketing skills", options: ["Only chemistry", "Production, costing, and marketing skills", "How to waste resources", "No useful skill"] },
        { q: "Profits from a school enterprise project can be used to:", correct: "Buy learning materials or support needy students", options: ["Buy video games", "Buy learning materials or support needy students", "Pay teachers extra", "Build a swimming pool"] }
    ];

    // ---------- BANK 4: TYPES OF ECONOMIC ACTIVITIES (Primary, Secondary, Tertiary) ----------
    const typesBank = [
        { q: "Farming, fishing and mining are examples of:", correct: "Primary economic activities", options: ["Secondary activities", "Primary economic activities", "Tertiary activities", "Service activities"] },
        { q: "Processing raw materials (e.g., milling maize into flour) is a:", correct: "Secondary economic activity", options: ["Primary activity", "Secondary economic activity", "Tertiary activity", "None"] },
        { q: "Teaching, banking, and tourism are examples of:", correct: "Tertiary (service) economic activities", options: ["Primary activities", "Secondary activities", "Tertiary (service) activities", "Mining activities"] },
        { q: "A baker who makes bread from flour is in which sector?", correct: "Secondary (manufacturing)", options: ["Primary", "Secondary", "Tertiary", "All"] }
    ];

    // ---------- BANK 5: ENTREPRENEURSHIP AND TRADE IN THE COUNTY & SCHOOL ----------
    const entrepreneurshipBank = [
        { q: "What is an entrepreneur?", correct: "A person who starts and runs a business", options: ["A teacher", "A person who starts and runs a business", "A doctor", "A farmer only"] },
        { q: "A market in a county allows people to:", correct: "Buy and sell goods, creating income", options: ["Fight", "Buy and sell goods, creating income", "Sleep", "Farm"] },
        { q: "A school 'market day' project helps students to:", correct: "Practice selling products they made", options: ["Run away", "Practice selling products they made", "Skip homework", "Watch movies"] },
        { q: "Saving money from a school enterprise teaches:", correct: "Financial planning and future investment", options: ["Wasting", "Financial planning and future investment", "Stealing", "Hiding money"] },
        { q: "A co-operative society in a county helps farmers by:", correct: "Marketing their products together and getting better prices", options: ["Taking their land", "Marketing their products together and getting better prices", "Destroying crops", "Increasing taxes"] },
        { q: "What is one benefit of industries in a county?", correct: "They create jobs for local people", options: ["They cause pollution only", "They create jobs for local people", "They close schools", "They reduce farming"] },
        { q: "A 'boda boda' transport business is an example of:", correct: "Service economic activity (transport)", options: ["Farming", "Mining", "Service activity", "Manufacturing"] }
    ];

    // Combine all banks into categories (6 categories, each contributes 5 per level = 30)
    const categories = [economicActivitiesBank, industriesBank, schoolEnterpriseBank, typesBank, entrepreneurshipBank];
    
    // Build 5 levels (30 Q each, each category contributes 6 per level)
    let levelsData = [];

    function buildGame() {
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            for (let cat of categories) {
                // each category gives 6 questions (total 30 per level)
                for (let i = 0; i < 6; i++) {
                    let source = cat[i % cat.length];
                    let newQ = {
                        text: source.q,
                        options: [...source.options],
                        correct: source.correct
                    };
                    // Add challenge flavor based on level
                    if (lvl >= 3 && i % 2 === 0) newQ.text = "💼 " + newQ.text;
                    if (lvl >= 4) newQ.text = "⭐ " + newQ.text + " ⭐";
                    if (lvl === 5 && i % 3 === 0) newQ.text = "🏆 ECONOMY MASTER: " + newQ.text;
                    levelQs.push(newQ);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsData.push(levelQs);
        }
    }
    buildGame();

    // ---------- GAME ENGINE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100); // 24

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    // DOM elements
    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const optionsDiv = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Challenging timer: Level1=90s, L2=80s, L3=70s, L4=60s, L5=50s
        const timeMap = {1: 90, 2: 80, 3: 70, 4: 60, 5: 50};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                // TIME'S UP - Level failure
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableAllOptions();
                nextBtn.disabled = true;
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to become an economic expert! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ONLY ${levelTimerSec} SECONDS! Build your business knowledge fast! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.disabled = true);
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '💼 RESTART ECONOMY CHALLENGE 💼';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    function highlightCorrectAnswer(correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (rawText === correctText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    function handleAnswer(selected, correctAnswer, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) return;
        answerLocked = true;
        const isCorrect = (selected === correctAnswer);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            messageDiv.innerHTML = `✅ ECONOMIC WISDOM! +1 point! (${levelScore}/${TOTAL_QS}) | Time left: ${levelTimerSec}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            // Show correct answer by highlighting it among all options
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswer) {
                    btn.classList.add('correct-highlight');
                }
            });
            messageDiv.innerHTML = `❌ NOT QUITE! Correct: "${correctAnswer}". Learn how the economy works! Score: ${levelScore}/${TOTAL_QS}`;
        }
        disableAllOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const levelData = levelsData[currentLevel - 1];
        const q = levelData[currentQIndex];
        questionDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        
        const shuffledOps = shuffleArray([...q.options]);
        const prefixes = ['A', 'B', 'C', 'D'];
        shuffledOps.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsDiv.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        messageDiv.innerHTML = `💰 Level ${currentLevel} • Question ${currentQIndex+1}/30 • Economic Activities & Enterprise! Build your future! ⏱️`;
    }

    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                // GRAND VICTORY
                messageDiv.innerHTML = `🏆💰🏭✨ INCREDIBLE! You've mastered economic activities, industries and school enterprise projects! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). You are a true Young Entrepreneur! ✨🏭💰🏆`;
                disableAllOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉🎊 LEVEL ${currentLevel} COMPLETE! 🎊🎉 ${levelScore}/${TOTAL_QS} PASS (${Math.round(levelScore/TOTAL_QS*100)}%). Moving to LEVEL ${currentLevel+1}... 💼💰`;
                disableAllOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadCurrentQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableAllOptions();
            nextBtn.disabled = true;
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect} correct). Press RESTART to become an economic champion! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadCurrentQuestion();
        nextBtn.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
