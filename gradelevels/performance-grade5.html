<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎭 Creative Arts & Sports Challenge | Grade 5 CBC Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0b2b26 0%, #1a4a3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 20px;
        }

        /* main game card */
        .game-container {
            max-width: 850px;
            width: 100%;
            background: #fef7e6;
            border-radius: 68px 68px 60px 60px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4), inset 0 1px 3px rgba(255, 255, 200, 0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* header */
        .game-header {
            background: #e67e22;
            background: linear-gradient(115deg, #f39c12, #e67e22);
            padding: 20px 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            color: white;
            text-shadow: 2px 2px 0 #b45f1b;
            border-bottom: 5px solid #c0392b;
        }

        .level-badge {
            background: #2c3e2f;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.25rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -1px 0 #5a7c5e;
        }

        .score-area, .timer-area {
            background: #2d2b1f;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #1e3b3a;
            font-family: monospace;
            font-size: 1.3rem;
        }

        /* progress */
        .progress-section {
            background: #f3e3c9;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #5a3e1b;
            border-bottom: 2px solid #e2c7a3;
        }

        /* question */
        .question-card {
            padding: 30px 28px 25px;
        }

        .question-text {
            background: #fff4e4;
            padding: 24px 18px;
            border-radius: 65px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            color: #1e4a2f;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.03), 0 12px 18px rgba(0,0,0,0.1);
            margin-bottom: 22px;
            word-break: break-word;
            line-height: 1.4;
        }

        /* actions */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .voice-btn {
            background: #2c6e4f;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 0 #144d35;
            transition: 0.05s linear;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #144d35;
        }

        .hint-area {
            background: #ffdead;
            border-radius: 60px;
            padding: 10px 22px;
            font-weight: bold;
            color: #b64926;
            flex: 1;
            text-align: center;
            font-size: 0.95rem;
        }

        /* answer input */
        .answer-area {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 20px;
        }

        .answer-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.25rem;
            border-radius: 70px;
            border: 3px solid #f0b27a;
            background: white;
            font-family: inherit;
            text-align: center;
            outline: none;
            transition: 0.1s;
        }

        .answer-input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230,126,34,0.3);
        }

        .submit-btn {
            background: #2ecc71;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 70px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 5px 0 #1f8f4b;
            transition: 0.05s linear;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1f8f4b;
        }

        .feedback {
            background: #f1e2c9;
            padding: 14px;
            text-align: center;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 12px;
            font-size: 1rem;
        }

        /* modal overlay */
        .overlay-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #fff9ef;
            max-width: 90%;
            width: 460px;
            padding: 30px;
            border-radius: 65px;
            text-align: center;
            border: 4px solid #ffb347;
            box-shadow: 0 20px 30px black;
        }

        .modal-content h2 {
            color: #c4450c;
            margin-bottom: 15px;
        }

        .modal-content button {
            background: #f39c12;
            border: none;
            padding: 12px 32px;
            font-size: 1.2rem;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.1rem;
            }
            .game-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .voice-btn {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ---------- 5 LEVELS x 30 QUESTIONS on: Athletics, Fabric Decoration, Kenyan Folk Dance, Puppetry, Descant Recorder, Swimming ----------
    // Each question expects a typed answer (case-insensitive, trimmed). 
    // Hints are provided, and timer reduces to give urgency.
    // 40 seconds timer, 80% requirement, 30 questions per level.
    
    function q(text, correctVariants, hintMsg) {
        return { text, correctAnswers: correctVariants.map(v => v.toLowerCase().trim()), hint: hintMsg };
    }

    // ========================= LEVEL 1 : Fundamentals (blend of all topics) =========================
    const level1 = [
        q("What is the name of the running event that covers 100 metres?", ["100 metres", "100m", "hundred metres"], "Short sprint event on the track."),
        q("In fabric decoration, what technique uses melted wax and dye to create patterns?", ["batik", "wax resist"], "Popular in Africa and Indonesia."),
        q("Which traditional Kenyan dance involves fast hip movements and is performed by the Luhya community?", ["isikuti", "isukuti"], "Energetic drumming dance."),
        q("A puppet that is controlled by strings from above is called a ___ puppet.", ["marionette", "string puppet"], "Puppet on strings."),
        q("How many holes does a standard descant recorder have?", ["8", "eight"], "Seven finger holes + thumb hole."),
        q("Which swimming stroke is known as the 'butterfly'?", ["butterfly", "butterfly stroke"], "Dolphin kick and both arms over water."),
        q("In Kenya, which athlete is famous for the 800m world record?", ["david rudisha", "rudisha"], "From Kenya, broke world record 2012."),
        q("What tool is used to apply dye in tie-dye fabric decoration?", ["squeeze bottle", "syringe", "dye applicator"], "Used to drizzle colour on tied fabric."),
        q("Name a Kenyan folk dance performed by the Maasai involving jumping high.", ["adumu", "maasai jumping dance"], "The famous jumping dance."),
        q("What type of puppet uses a rod to control the head and arms?", ["rod puppet", "rod puppet"], "Controlled with rods from below."),
        q("What note is produced when you cover all holes on a descant recorder?", ["low d", "d", "d note"], "The lowest pitch on descant."),
        q("What swimming stroke is best for beginners and involves a frog-like kick?", ["breaststroke", "breast stroke"], "Frog kick and glide."),
        q("What event combines running, jumping and throwing?", ["heptathlon", "decathlon", "combined events"], "Multi-discipline athletics."),
        q("The process of stitching and pulling fabric to create textured designs is called?", ["shibori", "tie dye stitching"], "Japanese resist technique."),
        q("Which Kenyan coastal dance is performed by the Giriama community?", ["mwanzele", "mwanzale"], "Upbeat coastal rhythm."),
        q("A puppet show where the puppeteer is hidden behind a screen is called a ___ theatre.", ["shadow puppet", "wayang", "shadow play"], "Silhouettes on illuminated screen."),
        q("What is the proper way to blow into a descant recorder?", ["gentle breath", "soft air", "tongued articulation"], "Use 'tu' syllable."),
        q("Freestyle swimming is also known as ___ stroke.", ["front crawl", "crawl"], "Fastest swimming style."),
        q("Which Kenyan athlete won Olympic gold in marathon 2008?", ["samuel wanjiru", "wanjiru"], "Youngest Olympic marathon champion."),
        q("What is the art of decorating cloth using a needle and thread called?", ["embroidery", "needlework"], "Decorative stitching."),
        q("Name a dance from the Kamba community performed during harvest.", ["kilumi", "kilume"], "Traditional Kamba ritual dance."),
        q("What is the wooden crosspiece used to control a marionette called?", ["control bar", "crutch", "puppet cross"], "Holds the strings."),
        q("How do you clean a descant recorder after use?", ["wipe with cloth", "dry inside", "use brush"], "Moisture causes damage."),
        q("In swimming, what does 'treading water' mean?", ["stay afloat vertically", "moving legs to keep head up"], "No forward movement."),
        q("What throwing event uses a heavy metal ball?", ["shot put", "shotput"], "Push, not throw."),
        q("Name a dye obtained from plants used in fabric decoration.", ["indigo", "henna", "turmeric"], "Natural blue dye."),
        q("Which Luo dance is known for rhythmic stomping and orutu fiddle?", ["ohangla", "benga dance"], "Popular in western Kenya."),
        q("What are glove puppets also called?", ["hand puppets", "sock puppets"], "Fit over the hand."),
        q("The musical note 'B' on descant recorder uses which finger?", ["left thumb and left hand index", "second finger", "thumb and finger 2"], "Check fingering chart."),
        q("What should you do before entering a swimming pool for safety?", ["warm up", "shower", "check depth"], "Prevents muscle cramps.")
    ];
    while(level1.length < 30) level1.push(q("Name a safety rule in swimming", ["no running by pool", "no pushing", "ask permission"], "Walk carefully."));

    // ========================= LEVEL 2 : More challenging & analytical =========================
    const level2 = [];
    for(let i=0;i<30;i++) {
        if(i%4===0) level2.push(q("What is a false start in athletics?", ["starting before gun", "early start", "false start"], "Leads to disqualification."));
        else if(i%4===1) level2.push(q("In fabric decoration, what does 'discharge printing' remove?", ["color from fabric", "dye removal"], "Bleaches out designs."));
        else if(i%4===2) level2.push(q("Which Kenyan folk dance is performed by the Mijikenda to celebrate rain?", ["mwambu", "mwaka"], "Rainmaking ritual."));
        else level2.push(q("What is the name of the puppeteer in traditional Kenyan storytelling?", ["mwigizaji", "puppet master"], "Storyteller with puppets."));
    }
    // fix ensure 30
    const extraL2 = [
        q("What breathing technique is important in front crawl swimming?", ["bilateral breathing", "side breathing", "rhythmic breath"], "Turn head every 3 strokes."),
        q("Which part of the descant recorder produces sound?", ["fipple", "mouthpiece", "windway"], "The edge splits air."),
        q("Name a traditional fabric decoration from Uganda.", ["bark cloth", "olubugo"], "Made from fig tree."),
        q("What is the highest jump event in athletics?", ["high jump", "high jump"], "Fosbury flop technique."),
        q("A dance that imitates animals: name one example.", ["crane dance", "eagle dance", "antelope dance"], "Common in folk traditions."),
        q("Describe how to create a simple hand puppet.", ["fold paper or fabric", "glue on eyes", "use sock"], "Use old sock and buttons."),
        q("How many beats does a minim (half note) get on descant recorder music?", ["2 beats", "two"], "White note with stem."),
        q("What is a 'relay race' in athletics?", ["team race with baton", "4x100m", "4x400m"], "Passing a baton."),
        q("Name a modern method of fabric decoration using heat.", ["heat transfer", "sublimation", "iron-on"], "Prints with pressure and heat."),
    ];
    while(level2.length<30) level2.push(extraL2[level2.length % extraL2.length]);
    
    // ========================= LEVEL 3 : Expert Mix (performance, display, creative arts integration) =========================
    const level3 = [
        q("What does 'pacing' mean in long-distance athletics?", ["controlling speed", "even pace", "race strategy"], "Saving energy for finish."),
        q("Which tool is used to create designs with hot wax in batik?", ["tjanting", "canting", "wax pen"], "Small copper spouted tool."),
        q("Name a Kenyan folk dance that tells a story of warriors.", ["odhiambo", "lukeme", "simba dance"], "Performed by Luo or Gusii."),
        q("What is the stage for a puppet performance called?", ["puppet stage", "booth", "theatre"], "Often covered with fabric."),
        q("What is the correct left-hand thumb position on descant recorder?", ["top hole", "covering thumb hole", "thumb rests underneath"], "Covers the single thumbhole."),
        q("Which swimming event combines butterfly, backstroke, breaststroke and freestyle?", ["individual medley", "medley", "IM"], "All four strokes."),
        q("What is a 'hurdles' race?", ["running over barriers", "hurdle event"], "30-42 inches barriers."),
        q("What type of fabric dye is known for bright, colourfast results?", ["fiber reactive dye", "procion"], "Common for tie-dye."),
        q("The Isikuti dance is accompanied by which drum?", ["isikuti drum", "big drum", "engoma"], "Large bass drum."),
        q("In shadow puppetry, what material is used for making puppets?", ["leather", "cardboard", "parchment"], "Thin, translucent material."),
        q("How to produce a high C on descant recorder?", ["half thumb hole", "pinch technique"], "Open thumb hole halfway."),
        q("What is the main kick in butterfly stroke?", ["dolphin kick", "dolphin kick"], "Legs together undulating."),
        q("Name a Kenyan world champion in 3000m steeplechase.", ["conseslus kipruto", "ezekiel kemboi", "brimin kipruto"], "Water jump event."),
        q("What is the process of drawing on fabric with melted wax before dyeing?", ["batik waxing", "wax resist drawing"], "Hot wax application."),
        q("Which folk dance from the Kisii community features whistling and stomping?", ["chamwada", "chamwada dance"], "Performed at celebrations."),
        q("A puppet operated with a hand inside the head is called?", ["hand puppet", "glove puppet"], "Muppet style."),
        q("What does 'articulation' mean on recorder?", ["tonguing notes", "clear start of note", "ta or du syllables"], "Using tongue to begin sound."),
        q("In swimming, what is the purpose of a 'flip turn'?", ["fast turn", "continuous motion", "push off wall"], "Used in freestyle and backstroke."),
        q("What event uses a metal spear in athletics?", ["javelin", "javelin throw"], "Throwing spear."),
        q("Name an African print fabric commonly used for clothing.", ["kitenge", "ankara", "dutch wax"], "Vibrant patterned cloth."),
        q("The famous Benga rhythm is from which Kenyan community?", ["luo", "kenyan luo"], "Associated with orutu fiddle."),
        q("What is the difference between marionette and rod puppet?", ["strings vs rods", "marionette from above, rod from below"], "Control method differs."),
        q("Name a note that requires forked fingering on descant recorder.", ["f sharp", "f#", "b flat"], "To avoid tuning issues."),
        q("Which Kenyan swimmer represented Kenya at Olympics?", ["jason dunford", "hamza anuar"], "Famous Kenyan swimmer."),
        q("How many laps in 800m athletics track event?", ["2 laps", "two laps", "800m = 2 laps"], "Standard 400m track."),
        q("What is 'kanga' writing?", ["proverb on fabric", "swahili saying"], "Kanga has a message."),
        q("Name a folk dance performed by the Turkana community.", ["alibal", "emurut", "ng'ikarisio"], "Celebratory dance."),
        q("What is a 'punch and judy' show?", ["traditional puppet show", "puppet comedy"], "Famous glove puppet show."),
        q("What is breath support in recorder playing?", ["controlled exhale", "steady airflow"], "Using diaphragm."),
        q("What is the 'backstroke flag' used for?", ["indicate 5m from wall", "warning for turn"], "Colored flags above pool.")
    ];
    while(level3.length<30) level3.push(q("Name an element of performance display in swimming.", ["dive entry", "streamline position", "finish touch"], "Graceful start."));
    
    // ========================= LEVEL 4 : Advanced creative arts performance =========================
    const level4 = [];
    for(let i=0;i<30;i++) {
        if(i<6) level4.push(q("What is a 'photo finish' in athletics?", ["determining winner by camera", "close race decision"], "Uses high-speed images."));
        else if(i<12) level4.push(q("What is screen printing on fabric?", ["stencil method", "mesh screen technique"], "Push ink through screen."));
        else if(i<18) level4.push(q("Describe a key movement in the Mwomboko dance.", ["turning and side steps", "shoulder shake", "graceful twist"], "Popular in central Kenya."));
        else if(i<24) level4.push(q("What is a Bunraku puppet?", ["traditional Japanese puppet", "large rod puppet"], "Operated by three puppeteers."));
        else level4.push(q("What is the standard material of a descant recorder?", ["plastic", "wooden", "abs resin"], "Student recorders often plastic."));
    }
    while(level4.length<30) level4.push(q("What does 'streamline glide' in swimming improve?", ["reduce drag", "speed", "efficiency"], "Arms stretched, body straight."));
    
    // ========================= LEVEL 5 : Master level: analysis and performance critique =========================
    const level5 = [
        q("How do you analyse a sprint race performance?", ["reaction time", "stride length", "technique"], "Start, acceleration, finish."),
        q("What makes batik a unique artistic expression?", ["wax resist layers", "hand-drawn designs", "crackle effect"], "No two same."),
        q("Name a value of Kenyan folk dance for community bonding.", ["unity", "storytelling", "celebrate harvest"], "Preserves culture."),
        q("How can puppetry be used to teach moral lessons?", ["character actions", "dialogue with consequences", "folk tales"], "Stories with messages."),
        q("Why is proper breath control vital on descant recorder?", ["tone quality", "pitch stability", "dynamics"], "Steady air supports notes."),
        q("What is the role of display in competitive swimming?", ["technique showcase", "sleek form", "efficiency"], "Judged in artistic swimming."),
        q("Explain what a 'doping test' is in athletics.", ["check for banned substances", "anti-doping control"], "Fair play rule."),
        q("What is the cultural importance of kanga fabric decoration?", ["identity", "communication through proverbs", "womenswear"], "Worn in East Africa."),
        q("How does 'call and response' appear in Kenyan folk dances?", ["soloist vs group reply", "drum and dancer", "song leader"], "Interactive rhythm."),
        q("What skill does puppetry develop in performers?", ["storytelling", "fine motor control", "voice modulation"], "Manipulation skills."),
        q("What is the difference between treble and descant recorder?", ["size and pitch", "descant higher in pitch"], "Treble is larger."),
        q("Name a drill to improve freestyle arm technique.", ["catch-up drill", "fist drill", "single arm"], "Focus on stroke."),
        q("What is 'tape resist' in fabric decoration?", ["masking tape pattern", "tape resists dye"], "Geometric designs."),
        q("Which Kenyan dance uses long sticks to create rhythm?", ["mugithi", "gitari", "rural stick dance"], "Men's competitive dance."),
        q("A puppet that uses light and shadows is called ___ theatre.", ["shadow", "wayang kulit"], "Indonesian origin."),
        q("What does 'legato' mean on recorder?", ["smooth connected notes", "no tongue separation"], "Flowing sound."),
        q("In swimming, what is the 'IM order'?", ["fly, back, breast, free", "medley sequence"], "Butterfly first."),
        q("How do you evaluate a creative arts performance?", ["critique strengths", "audience response", "technical precision"], "Use rubrics."),
        q("Name a traditional fabric decoration tool used by the Kikuyu.", ["njugu dye", "clay stamps", "natural brush"], "Stamping with seeds."),
        q("What rhythm pattern is common in Isikuti dance?", ["4/4 fast tempo", "syncopated drums"], "Energetic beat."),
        q("What is a 'puppetry festival' celebrating?", ["global puppet art", "puppeteer gathering", "performances"], "Showcase puppetry."),
        q("How to play a B-flat on descant recorder?", ["forked fingering", "half hole", "special fingering"], "Cover hole 4 and 5 partially."),
        q("What's an 'anchor leg' in swimming relay?", ["final swimmer", "last leg"], "Closes the race."),
        q("Which Kenyan athlete is known as 'Kipchoge' for marathon?", ["eliud kipchoge", "kipchoge"], "2-hour marathon pioneer."),
        q("List one safety in fabric decoration using chemicals.", ["wear gloves", "work in ventilated area", "apron"], "Protect skin."),
        q("What is the energy of Kenyan folk dance often expressed through?", ["drumming", "foot stamping", "ululations"], "Joy and celebration."),
        q("What puppet style uses the whole body as a puppet?", ["body puppet", "giant puppet", "costume puppet"], "Human-sized puppets."),
        q("The left hand generally covers which holes on descant recorder?", ["top three holes", "thumb and 1,2,3"], "Upper hand."),
        q("What is 'display' in creative arts context?", ["presentation to audience", "exhibition of skills", "performance showcasing"], "Shows talent."),
        q("Name one way to appreciate a puppetry show.", ["applause", "positive feedback", "watch attentively"], "Clap and enjoy.")
    ];
    while(level5.length<30) level5.push(q("How can you improve at descant recorder?", ["practice daily", "long tones", "listen to pieces"], "Consistency matters."));
    
    const levelSets = [level1, level2, level3, level4, level5];
    
    // Game state
    let currentLevel = 0;
    let currentQIndex = 0;
    let scoreForLevel = 0;
    let timeLeft = 40;
    let timerInterval = null;
    let answeringActive = true;
    let waitingTransition = false;
    
    const QUESTIONS_PER_LEVEL = 30;
    const REQUIRED_PERCENT = 80;
    
    function getRequiredCorrect() {
        return Math.ceil(QUESTIONS_PER_LEVEL * REQUIRED_PERCENT / 100);
    }
    
    const root = document.getElementById('root');
    
    function escapeHTML(str) {
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            updateFeedback("🔊 Voice not supported", "warning");
        }
    }
    
    function updateFeedback(msg, type) {
        const fb = document.getElementById('feedbackMsg');
        if (fb) {
            fb.innerHTML = msg;
            fb.style.background = type === 'correct' ? '#c8f0d1' : (type === 'error' ? '#ffddd6' : '#f7e5c2');
            setTimeout(() => { if(fb) fb.style.background = '#f1e2c9'; }, 1200);
        }
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        answeringActive = true;
        timerInterval = setInterval(() => {
            if (!answeringActive || waitingTransition) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (answeringActive) {
                    answeringActive = false;
                    updateFeedback("⌛ TIME IS UP! Moving to next question.", "error");
                    waitingTransition = true;
                    setTimeout(() => moveToNextQuestion(), 1500);
                }
            } else {
                timeLeft--;
                const timerDiv = document.querySelector('.timer-area');
                if (timerDiv) timerDiv.innerHTML = `⏱️ ${timeLeft}s`;
                // Urgent hint when < 12 secs
                if (timeLeft === 12) {
                    const hintDiv = document.getElementById('hintMessage');
                    if (hintDiv) {
                        const qData = levelSets[currentLevel][currentQIndex];
                        hintDiv.innerHTML = `🔥 QUICK HINT: ${qData.hint}`;
                    }
                }
            }
        }, 1000);
    }
    
    function handleAnswer() {
        if (!answeringActive || waitingTransition) {
            updateFeedback("Please wait, question loading...", "warning");
            return;
        }
        const inputField = document.getElementById('answerInput');
        let answer = inputField ? inputField.value.trim() : "";
        if (answer === "") {
            updateFeedback("📝 Please type an answer before submitting!", "error");
            return;
        }
        stopTimer();
        answeringActive = false;
        const currentQ = levelSets[currentLevel][currentQIndex];
        const isCorrect = currentQ.correctAnswers.some(c => answer.toLowerCase() === c);
        
        if (isCorrect) {
            scoreForLevel++;
            updateFeedback(`✅ PERFECT! +1 point (${scoreForLevel}/${QUESTIONS_PER_LEVEL})`, "correct");
        } else {
            const correctExample = currentQ.correctAnswers[0];
            updateFeedback(`❌ Oops! Correct answer: "${correctExample}". You wrote "${answer}". Keep learning!`, "error");
        }
        waitingTransition = true;
        setTimeout(() => moveToNextQuestion(), 1500);
    }
    
    function moveToNextQuestion() {
        const isLast = (currentQIndex + 1) === QUESTIONS_PER_LEVEL;
        if (!isLast) {
            currentQIndex++;
            timeLeft = 40;
            answeringActive = true;
            waitingTransition = false;
            renderGame();
        } else {
            // Level finished, check pass/fail
            const required = getRequiredCorrect();
            const passed = (scoreForLevel >= required);
            if (passed) {
                if (currentLevel + 1 === 5) {
                    showModal(`🏆 GRAND CHAMPION! 🏆\nYou completed ALL 5 LEVELS!\nScore: ${scoreForLevel}/${QUESTIONS_PER_LEVEL}\nCreative Arts + Sports MASTER!`, true);
                } else {
                    showModal(`✨ LEVEL UP! ✨\nYou got ${scoreForLevel}/${QUESTIONS_PER_LEVEL} (${Math.round(scoreForLevel/QUESTIONS_PER_LEVEL*100)}%)\nRequired 80% ➜ Proceed to Level ${currentLevel+2}`, false);
                }
            } else {
                showModal(`⚠️ LEVEL FAILED ⚠️\nScore: ${scoreForLevel}/${QUESTIONS_PER_LEVEL} (Need ${required})\nRestarting same level. Try again!`, true);
            }
        }
    }
    
    function showModal(message, isResetOrComplete) {
        stopTimer();
        answeringActive = false;
        waitingTransition = true;
        const modalDiv = document.createElement('div');
        modalDiv.className = 'overlay-modal';
        modalDiv.innerHTML = `
            <div class="modal-content">
                <h2>🎭 ${message.includes('GRAND') ? '🏅 VICTORY 🏅' : (message.includes('LEVEL UP') ? '🚀 PROGRESS 🚀' : '🔄 TRY AGAIN')}</h2>
                <p style="font-size:1.2rem;">${message}</p>
                <button id="modalConfirmBtn">Continue</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = document.getElementById('modalConfirmBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            const passedLevel = (scoreForLevel >= getRequiredCorrect());
            if (passedLevel && currentLevel + 1 === 5 && message.includes('GRAND')) {
                fullReset();
            }
            else if (passedLevel && currentLevel < 4) {
                currentLevel++;
                currentQIndex = 0;
                scoreForLevel = 0;
                timeLeft = 40;
                answeringActive = true;
                waitingTransition = false;
                renderGame();
            }
            else if (!passedLevel) {
                // restart same level
                currentQIndex = 0;
                scoreForLevel = 0;
                timeLeft = 40;
                answeringActive = true;
                waitingTransition = false;
                renderGame();
            } else {
                fullReset();
            }
        });
    }
    
    function fullReset() {
        currentLevel = 0;
        currentQIndex = 0;
        scoreForLevel = 0;
        timeLeft = 40;
        answeringActive = true;
        waitingTransition = false;
        stopTimer();
        renderGame();
    }
    
    function renderGame() {
        const levelData = levelSets[currentLevel];
        const questionObj = levelData[currentQIndex];
        const levelNumber = currentLevel + 1;
        const required = getRequiredCorrect();
        const percentDone = Math.round((scoreForLevel/QUESTIONS_PER_LEVEL)*100);
        const html = `
            <div class="game-container">
                <div class="game-header">
                    <div class="level-badge">🏅 LEVEL ${levelNumber} / 5</div>
                    <div class="score-area">🌟 SCORE: ${scoreForLevel} / ${QUESTIONS_PER_LEVEL}</div>
                    <div class="timer-area">⏱️ ${timeLeft}s</div>
                </div>
                <div class="progress-section">
                    <span>📌 Question ${currentQIndex+1} of ${QUESTIONS_PER_LEVEL}</span>
                    <span>🎯 Need ${required} correct to advance (${percentDone}%)</span>
                </div>
                <div class="question-card">
                    <div class="question-text">${escapeHTML(questionObj.text)}</div>
                    <div class="action-row">
                        <button class="voice-btn" id="speakQBtn">🔊 Read Question Aloud</button>
                        <div class="hint-area" id="hintMessage">💡 ${escapeHTML(questionObj.hint)}</div>
                    </div>
                    <div class="answer-area">
                        <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
                        <button id="submitAnswerBtn" class="submit-btn">🎯 SUBMIT ANSWER</button>
                    </div>
                    <div class="feedback" id="feedbackMsg">✨ Listen, think, type, and submit! Be specific.</div>
                </div>
            </div>
        `;
        root.innerHTML = html;
        document.getElementById('speakQBtn')?.addEventListener('click', () => speakText(questionObj.text));
        document.getElementById('submitAnswerBtn')?.addEventListener('click', handleAnswer);
        const inp = document.getElementById('answerInput');
        if (inp) {
            inp.focus();
            inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAnswer(); });
        }
        startTimer();
    }
    
    renderGame();
</script>
</body>
</html>
