<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Life of Jesus - Grade 1 CRE | Birth, Temple, Baptism, Wedding, Healing</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2c5f8a 0%, #1a3f5c 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #2c5f8a;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        👶🕊️🍷🩺 Bobo's Life of Jesus! Learn about Birth, Temple, Baptism, Wedding & Healing.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Birth of Jesus, Jesus in Temple, Baptism, Wedding at Cana, Healing of Simon's Mother-in-law ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // THE BIRTH OF JESUS CHRIST (Luke 2, Matthew 1-2)
        const birth = [
            { q: "The mother of Jesus was named ______.", a: "mary" },
            { q: "The earthly father of Jesus was named ______.", a: "joseph" },
            { q: "Jesus was born in the town of ______.", a: "bethlehem" },
            { q: "Mary and Joseph traveled to Bethlehem because of a ______ count.", a: "census" },
            { q: "Jesus was laid in a ______ because there was no room in the inn.", a: "manger" },
            { q: "Angels appeared to ______ in the fields to tell them about Jesus' birth.", a: "shepherds" },
            { q: "The shepherds went to Bethlehem to see the baby ______.", a: "jesus" },
            { q: "Wise men from the East followed a ______ to find Jesus.", a: "star" },
            { q: "The wise men brought gifts of gold, frankincense, and ______.", a: "myrrh" },
            { q: "King ______ tried to harm baby Jesus.", a: "herod" }
        ];
        
        // JESUS IN THE TEMPLE (Luke 2:41-52)
        const temple = [
            { q: "When Jesus was 12 years old, He went to the ______ in Jerusalem.", a: "temple" },
            { q: "Mary and Joseph traveled to Jerusalem for the feast of ______.", a: "passover" },
            { q: "After the feast, Mary and Joseph realized Jesus was ______.", a: "missing" },
            { q: "They found Jesus in the temple, sitting among the ______.", a: "teachers" },
            { q: "Jesus was listening to the teachers and asking them ______.", a: "questions" },
            { q: "Everyone was amazed at Jesus' ______ and answers.", a: "understanding" },
            { q: "Mary asked Jesus, 'Son, why have you ______ us?'", a: "treated" },
            { q: "Jesus said, 'I must be in my ______ house.'", a: "father's" },
            { q: "Jesus went back to Nazareth and was ______ to Mary and Joseph.", a: "obedient" },
            { q: "Jesus grew in wisdom, stature, and in favor with God and ______.", a: "people" }
        ];
        
        // BAPTISM OF JESUS CHRIST (Matthew 3, Mark 1, Luke 3)
        const baptism = [
            { q: "Jesus was baptized by John the ______.", a: "baptist" },
            { q: "John baptized people in the River ______.", a: "jordan" },
            { q: "When Jesus came up from the water, the ______ opened.", a: "heavens" },
            { q: "The Holy Spirit descended on Jesus like a ______.", a: "dove" },
            { q: "A voice from heaven said, 'This is my beloved ______.'", a: "son" },
            { q: "John said, 'I am not worthy to untie Jesus' ______.'", a: "sandals" },
            { q: "John called Jesus the 'Lamb of God who takes away the sin of the ______.'", a: "world" },
            { q: "Jesus was about ______ years old when He was baptized.", a: "thirty" },
            { q: "John wore clothes made of camel's hair and ate ______ and wild honey.", a: "locusts" },
            { q: "Baptism shows that we want to follow ______.", a: "jesus" }
        ];
        
        // WEDDING AT CANA OF GALILEE (John 2:1-12)
        const wedding = [
            { q: "Jesus turned ______ into wine at a wedding in Cana.", a: "water" },
            { q: "The wedding took place in the town of ______ in Galilee.", a: "cana" },
            { q: "Jesus' mother, Mary, was also at the ______.", a: "wedding" },
            { q: "The wine ran out, so Mary told Jesus about the ______.", a: "problem" },
            { q: "Jesus said, 'My hour has not yet ______.'", a: "come" },
            { q: "Jesus told the servants to fill six stone ______ with water.", a: "jars" },
            { q: "The master of the banquet tasted the water that had become ______.", a: "wine" },
            { q: "This was the first miracle (sign) that Jesus performed in ______.", a: "cana" },
            { q: "Jesus' disciples believed in Him after seeing this ______.", a: "miracle" },
            { q: "The water jars were used for Jewish ______ ceremonies.", a: "purification" }
        ];
        
        // HEALING OF SIMON'S MOTHER-IN-LAW (Matthew 8, Mark 1, Luke 4)
        const healing = [
            { q: "Simon's mother-in-law was sick with a high ______.", a: "fever" },
            { q: "Simon is also known as ______.", a: "peter" },
            { q: "Jesus went to Simon's ______ after leaving the synagogue.", a: "house" },
            { q: "Jesus ______ the fever, and it left her.", a: "rebuked" },
            { q: "After she was healed, she got up and began to ______ them.", a: "serve" },
            { q: "That evening, people brought all who were sick to Jesus to be ______.", a: "healed" },
            { q: "Jesus healed many people who had ______ spirits.", a: "evil" },
            { q: "Simon was a ______ before becoming a disciple of Jesus.", a: "fisherman" },
            { q: "Jesus showed His power over ______ and disease.", a: "sickness" },
            { q: "The healing of Simon's mother-in-law showed Jesus' ______ and compassion.", a: "love" }
        ];
        
        const allTopics = [...birth, ...temple, ...baptism, ...wedding, ...healing];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Mary and Joseph traveled to Bethlehem, and baby Jesus was born there. He was laid in a ______.";
                correctAnswer = "manger";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "When Jesus was 12 years old, He stayed behind in the temple talking to the ______.";
                correctAnswer = "teachers";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "John the Baptist baptized Jesus in the River ______.";
                correctAnswer = "jordan";
            }
            if (i % 8 === 0) {
                qText = "Jesus performed His first miracle at a wedding in Cana. He turned water into ______.";
                correctAnswer = "wine";
            }
            if (i % 9 === 0) {
                qText = "Simon's mother-in-law was sick with a fever. Jesus ______ her and she got up to serve.";
                correctAnswer = "healed";
            }
            if (i % 11 === 0) {
                qText = "The wise men followed a star to find baby Jesus and brought gifts of gold, frankincense, and ______.";
                correctAnswer = "myrrh";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: The Birth of Jesus! Angels, shepherds, wise men, and a star!";
        else if (currentLevel === 2) levelDesc = "Level 2: Jesus in the Temple! Young Jesus listens and asks questions!";
        else if (currentLevel === 3) levelDesc = "Level 3: The Baptism of Jesus! John baptizes Jesus, the Holy Spirit descends like a dove!";
        else if (currentLevel === 4) levelDesc = "Level 4: The Wedding at Cana! Jesus turns water into wine, His first miracle!";
        else levelDesc = "Level 5: Final challenge! Healing of Simon's mother-in-law and more miracles!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Life of Jesus Champion Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of the early life of Jesus: His birth, visit to the temple, baptism, first miracle at Cana, and healing! Keep learning about Jesus!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know about Jesus' birth, the temple, baptism, the wedding miracle, and healing! 👶🕊️🍷🩺✨";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about the life of Jesus!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for English answers
        if (!isCorrect) {
            const forgiving = {
                "mary": ["virgin mary", "mother mary", "mary"],
                "joseph": ["st joseph", "joseph"],
                "bethlehem": ["bethlehem", "bethlehem"],
                "census": ["population count", "registration"],
                "manger": ["feeding trough", "stable", "hay"],
                "shepherds": ["shepherd", "sheep herders"],
                "jesus": ["christ", "lord", "savior"],
                "star": ["bright star", "christmas star"],
                "myrrh": ["myrrh", "fragrance"],
                "herod": ["king herod", "herod"],
                "temple": ["jerusalem temple", "temple"],
                "passover": ["passover feast", "pesach"],
                "missing": ["lost", "not there"],
                "teachers": ["rabbis", "scholars", "religious leaders"],
                "questions": ["queries", "things"],
                "understanding": ["wisdom", "knowledge"],
                "treated": ["treated", "done to"],
                "father's": ["fathers", "my father's"],
                "obedient": ["obedient", "submissive"],
                "people": ["men", "humanity"],
                "baptist": ["the baptist", "john the baptist"],
                "jordan": ["river jordan", "jordan"],
                "heavens": ["sky", "heaven"],
                "dove": ["bird", "holy spirit"],
                "son": ["son", "my son"],
                "sandals": ["shoes", "footwear"],
                "world": ["earth", "mankind"],
                "thirty": ["30", "thirty years"],
                "locusts": ["grasshoppers", "insects"],
                "jesus": ["jesus christ", "lord"],
                "water": ["water", "h2o"],
                "cana": ["cana", "cana of galilee"],
                "wedding": ["marriage", "wedding feast"],
                "problem": ["issue", "situation"],
                "come": ["come", "arrived"],
                "jars": ["pitchers", "containers"],
                "wine": ["grape wine", "drink"],
                "cana": ["cana", "galilee"],
                "miracle": ["sign", "wonder"],
                "purification": ["cleansing", "ceremony"],
                "fever": ["high fever", "sickness"],
                "peter": ["simon peter", "apostle peter"],
                "house": ["home", "dwelling"],
                "rebuked": ["commanded", "ordered"],
                "serve": ["minister", "help", "wait on"],
                "healed": ["cured", "restored"],
                "evil": ["unclean", "demonic"],
                "fisherman": ["fisher", "fisher of men"],
                "sickness": ["disease", "illness"],
                "love": ["compassion", "mercy", "care"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep learning about Jesus! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Life of Jesus! Learn about the birth of Jesus, Jesus in the temple, His baptism, the wedding at Cana where He turned water into wine, and the healing of Simon's mother-in-law. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's follow Jesus together!");
        }, 500);
    });
</script>
</body>
