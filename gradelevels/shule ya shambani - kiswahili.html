<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Shule ya Shambani - Darasa la 2 CBC | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2d6a4f 0%, #1b4d3a 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #2d6a4f;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🏫🌾 Shule ya Shambani! Jifunze kusikiliza, kuzungumza, kusoma na kuandika.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Shule ya Shambani! Andika jibu sahihi. Bonyeza kitufe cha sauti kusikia swali.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- SAUTI KWA KISWAHILI ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa. Swali linalofuata linakuja.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakKiswahili(qData.text);
        else speakKiswahili("Hakuna swali kwa sasa.");
    }

    // ---------- MASWALI: Shule ya Shambani (Kusikiliza, Kuzungumza, Kusoma, Kuandika) ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // KUSIKILIZA - Kusikiliza kuhusu Shule ya Shambani
        const kusikiliza = [
            { q: "Shule ya shambani iko katika eneo la ______.", a: "vijijini" },
            { q: "Wanafunzi wa shule ya shambani hukaa kwenye ______ za mbao.", a: "madawati" },
            { q: "Tunaposikiliza hadithi kuhusu shule ya shambani, tunapaswa kuwa ______.", a: "makini" },
            { q: "Shule ya shambani ina uwanja mkubwa wa ______.", a: "mchezo" },
            { q: "Wanafunzi hupenda kusoma chini ya ______.", a: "mti" },
            { q: "Kusikiliza kwa makini kunatusaidia kuelewa ______ ya wanafunzi wa shambani.", a: "maisha" },
            { q: "Shule ya shambani ina walimu ______ na wakarimu.", a: "wema" },
            { q: "Bobo alisikiliza hadithi ya shule iliyoko ______.", a: "shambani" },
            { q: "Wanafunzi wa shule ya shambani husaidia wazazi wao ______.", a: "shambani" },
            { q: "Kusikiliza hadithi za shule za vijijini ni jambo la ______.", a: "kufurahisha" }
        ];
        
        // KUZUNGUMZA - Kuzungumza kuhusu Shule ya Shambani
        const kuzungumza = [
            { q: "Tunapozungumza kuhusu shule ya shambani, tunapaswa kutumia lugha ya ______.", a: "heshima" },
            { q: "Talia alimwuliza rafiki yake, 'Je, wewe unasoma shule ya ______?'", a: "shambani" },
            { q: "Kuzungumza kwa ______ ni alama ya adabu.", a: "upole" },
            { q: "Wanafunzi wa shule ya shambani huzungumza kuhusu ______ zao.", a: "malengo" },
            { q: "Bobo alisema, 'Shule ya shambani ina ______ safi na hewa safi.'", a: "mazingira" },
            { q: "Kuzungumza kwa ukweli kunajenga ______ miongoni mwa wanafunzi.", a: "uaminifu" },
            { q: "Mwalimu aliuliza, 'Nani anataka kusoma shule ya ______?'", a: "shambani" },
            { q: "Talia alimweleza mama yake kuhusu matembezi ya shule ______.", a: "shambani" },
            { q: "Kuzungumza kwa ______ kunasaidia kuepuka migogoro.", a: "heshima" },
            { q: "Wanafunzi wa shule ya shambani hujivunia ______ yao.", a: "shule" }
        ];
        
        // KUSOMA - Kusoma kuhusu Shule ya Shambani
        const kusoma = [
            { q: "Bobo alisoma kitabu cha 'Maisha katika Shule ya ______'.", a: "Shambani" },
            { q: "Kusoma kunatusaidia kujua jinsi wanafunzi wa shambani wanavyojifunza ______.", a: "kwa bidii" },
            { q: "Shule ya shambani ina maktaba ndogo yenye ______ nyingi.", a: "vitabu" },
            { q: "Talia alisoma kwamba wanafunzi wa shambani hupanda ______ shuleni.", a: "miti" },
            { q: "Kusoma kwa ______ kunasaidia kuelewa maisha ya vijijini.", a: "umakini" },
            { q: "Bobo alisoma hadithi ya mtoto wa ______ aliyeenda shule shambani.", a: "mkulima" },
            { q: "Shule za shambani zina darasa la ______ iliyo wazi.", a: "nje" },
            { q: "Kusoma kunatuwezesha kujua ______ za wanafunzi wa vijijini.", a: "changamoto" },
            { q: "Talia alisoma kwamba wanafunzi wa shambani hucheza ______ wakati wa mapumziko.", a: "mpira" },
            { q: "Kusoma hadithi za shule za vijijini ni jambo la ______.", a: "kuvutia" }
        ];
        
        // KUANDIKA - Kuandika kuhusu Shule ya Shambani
        const kuandika = [
            { q: "Bobo aliandika sentensi: 'Shule ya shambani ipo ______.'", a: "vijijini" },
            { q: "Kuandika kwa ______ kunasaidia kuwasilisha ujumbe vizuri.", a: "maridadi" },
            { q: "Talia aliandika insha kuhusu safari yake ya ______ shuleni.", a: "shambani" },
            { q: "Kuandika kwa usafi ni alama ya mwanafunzi ______.", a: "mwema" },
            { q: "Bobo aliandika orodha ya vitu vya shule ya shambani: madawati, ubao na ______.", a: "vitabu" },
            { q: "Talia aliandika barua kwa rafiki yake akimweleza juu ya shule yake ______.", a: "shambani" },
            { q: "Kuandika kunatusaidia kukumbuka ______ tulizojifunza.", a: "somo" },
            { q: "Bobo aliandika ubaoni: 'Shule ya shambani ni ______.'", a: "nzuri" },
            { q: "Talia aliandika muhtasari wa hadithi ya 'Siku ya Kwanza ______'.", a: "Shuleni" },
            { q: "Kuandika kwa bidii kunasaidia kuboresha ______ yetu.", a: "ujuzi" }
        ];
        
        const allTopics = [...kusikiliza, ...kuzungumza, ...kusoma, ...kuandika];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo anamsikiliza mwalimu akifundisha kuhusu shule iliyoko ______.";
                correctAnswer = "vijijini";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "Talia alimwuliza rafiki yake, 'Je, shule yako iko ______ au mjini?'";
                correctAnswer = "shambani";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Bobo anasoma kitabu kinachoelezea maisha ya wanafunzi wa shule ya ______.";
                correctAnswer = "shambani";
            }
            if (i % 8 === 0) {
                qText = "Talia anaandika katika shajara yake: 'Leo nimejifunza kuhusu shule ya ______.'";
                correctAnswer = "shambani";
            }
            if (i % 9 === 0) {
                qText = "Wanafunzi wa shule za vijijini hufanya kazi za ______ baada ya masomo.";
                correctAnswer = "shambani";
            }
            if (i % 11 === 0) {
                qText = "Kusikiliza hadithi za shule za shambani ni jambo la ______ na kuelimisha.";
                correctAnswer = "kufurahisha";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}. Shule ya shambani inaendelea kufundisha!`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Tunasonga kwenye swali linalofuata.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako! Bonyeza kitufe cha sauti kusikia swali tena. Shule ya Shambani inakungoja!";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Kusikiliza kuhusu Shule ya Shambani! Jifunze kusikiliza kwa makini.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Kuzungumza kuhusu Shule ya Shambani! Zungumza kwa heshima kuhusu maisha vijijini.";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Kusoma kuhusu Shule ya Shambani! Soma na uelewe maisha ya wanafunzi wa vijijini.";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Kuandika kuhusu Shule ya Shambani! Andika insha na muhtasari kwa maridadi.";
        else levelDesc = "Ngazi 5: Ngazi ya mwisho! Kuwa Bingwa wa Shule ya Shambani Darasa la 2!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele. ⏱️ 40s/swali. Shule ya Shambani - elimu kwa wote! 🏫🌾`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5! Wewe ni Bingwa wa Shule ya Shambani Darasa la 2! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza ngazi zote tano. Wewe ni bingwa wa Shule ya Shambani! Endelea kusikiliza, kuzungumza, kusoma na kuandika kuhusu maisha vijijini!");
                storyAreaDiv.innerHTML = "🏁 MCHEZO UMEMALIZIKA! Sasa unajua mengi kuhusu Shule ya Shambani na maisha ya wanafunzi wa vijijini! Endelea kusoma hadithi za Kiswahili! 🏫🌾📖✨";
                nextLevelMsgDiv.innerHTML = "✨ UMESHINDA! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel}. Sasa unaenda ngazi ${currentLevel+1}. Endelea kujifunza kuhusu Shule ya Shambani!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukufika 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu Ngazi ${currentLevel} tena.`;
            speakKiswahili(`Pole! Unahitaji angalau asilimia themanini kupita. Una alama ${scoreCorrect} kati ya ${totalQuestionsInLevel}. Tafadhali jaribu ngazi ${currentLevel} tena. Kumbuka shule ya shambani ina mengi ya kufundisha!`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Shule ya Shambani! Andika jibu lako. Bonyeza kitufe cha sauti kusikia swali.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu! Shule ya Shambani inakungoja.";
            speakKiswahili("Tafadhali andika jibu.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for Kiswahili answers
        if (!isCorrect) {
            const forgiving = {
                "vijijini": ["shambani", "mashambani", "vijijini"],
                "madawati": ["madawati ya mbao", "meza", "viti"],
                "makini": ["kwa makini", "umakini", "mwangalifu"],
                "mchezo": ["uwanja wa michezo", "michezo", "kucheza"],
                "mti": ["mti mkubwa", "mti wa mango", "mti wa mbuyu"],
                "maisha": ["mambo", "siku za maisha", "mwenendo"],
                "wema": ["wema", "wazuri", "wenye adabu"],
                "shambani": ["mashambani", "vijijini", "kwa shamba"],
                "kufurahisha": ["furahisha", "kuvutia", "kupendeza"],
                "heshima": ["adabu", "staha", "taadhima"],
                "upole": ["laini", "taratibu", "utulivu"],
                "malengo": ["ndoto", "maarifa", "mipango"],
                "mazingira": ["eneo", "nchi", "mahali"],
                "uaminifu": ["aminifu", "kweli", "ukweli"],
                "shule": ["shule yao", "shule hii"],
                "kwa bidii": ["bidii", "kwa nguvu", "kwa juhudi"],
                "vitabu": ["vijitabu", "vya kusoma", "maktaba"],
                "miti": ["miti ya matunda", "mimea", "shamba"],
                "umakini": ["makini", "uzingatiaji", "tahadhari"],
                "mkulima": ["baba wa shamba", "mwenye shamba"],
                "nje": ["anga la wazi", "kwenye uwanja"],
                "changamoto": ["matatizo", "ugumu", "majukumu"],
                "mpira": ["soka", "mchezo wa mpira", "kupiga mpira"],
                "kuvutia": ["nzuri", "kupendeza", "rafiki"],
                "maridadi": ["uzuri", "nzuri", "safi"],
                "mwema": ["mwema", "mzuri", "mtukufu"],
                "somo": ["funzo", "mafunzo", "elimu"],
                "nzuri": ["mzuri", "safi", "nadhifu"],
                "ujuzi": ["maarifa", "stadi", "uwezo"],
                "kufurahisha": ["furahisha", "kuchekesha", "kuvutia"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama! Endelea kujifunza kuhusu Shule ya Shambani!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi ni: "${currentQ.answer}". Endelea kujifunza kuhusu Shule ya Shambani na maisha ya vijijini! ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Usikate tamaa! Soma hadithi za Kiswahili kila siku!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa Shule ya Shambani! Jifunze kusikiliza, kuzungumza, kusoma na kuandika kwa Kiswahili. Una sekunde arobaini kwa kila swali. Bonyeza kitufe cha sauti kusikia swali. Andika jibu lako. Hebu tujifunze kuhusu maisha ya wanafunzi wa shule za vijijini!");
        }, 500);
    });
</script>

</html>
