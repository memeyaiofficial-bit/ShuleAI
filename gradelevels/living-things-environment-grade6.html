<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ultimate Science Master | CBC Grade 4-6 | Fungi, Invertebrates, Circulatory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a2e3f 0%, #061a24 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .game-container {
            max-width: 1100px;
            width: 100%;
            background: #fffef5;
            border-radius: 3rem 2rem 3rem 2rem;
            box-shadow: 0 30px 45px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 2px solid #60a5fa;
        }
        .mode-tabs {
            display: flex;
            background: #1a3a2f;
            border-bottom: 3px solid #fbbf24;
            gap: 2px;
        }
        .tab-btn {
            flex: 1;
            background: #2d5a44;
            color: #fef9e0;
            border: none;
            padding: 16px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            text-shadow: 0 1px 0 #4a1d96;
        }
        .tab-btn:active { transform: scale(0.98); }

        .game-header {
            background: linear-gradient(105deg, #1e3a8a, #3b82f6);
            padding: 1rem 1.5rem;
            color: white;
            text-shadow: 2px 2px 0 #0a3a5a;
            border-bottom: 4px solid #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .level-badge, .score-badge, .timer-area {
            background: #1e3a2a;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.2);
        }
        .timer-area {
            background: #4a2a1a;
            font-family: monospace;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #ffea9e;
        }
        .score-progress {
            background: #e8ddc5;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-text, .required-text {
            background: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1rem;
            color: #2c5a2a;
        }

        .question-card {
            padding: 1.5rem 1.8rem;
            background: #fffaf0;
        }
        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: #eef5e5;
            padding: 20px;
            border-radius: 48px;
            margin-bottom: 25px;
            text-align: center;
            color: #1e3a1e;
            line-height: 1.4;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #aa8e6c;
            transition: 0.07s linear;
            font-family: inherit;
        }
        .option-prefix {
            background: #3c7e5a;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
        }
        .option-btn:hover:not(:disabled) { background: #ffefcf; transform: scale(0.97); }
        .option-btn.correct-highlight { background: #2e7d32; color: white; box-shadow: 0 3px 0 #1b5e1f; }
        .option-btn.correct-highlight .option-prefix { background: #1b5e20; }
        .option-btn.wrong-highlight { background: #c62828; color: white; text-decoration: line-through; box-shadow: 0 3px 0 #7f2a2a; }
        .option-btn.wrong-highlight .option-prefix { background: #8b2a2a; }
        .option-btn:disabled { cursor: default; opacity: 0.85; }

        .next-area { text-align: center; padding-bottom: 20px; }
        .next-btn {
            background: #f4a261;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 40px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }
        .next-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c45c1a; }
        .next-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .message-area {
            background: #2c4a2a;
            color: #e8f5e0;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 0.9rem;
            border-top: 2px solid #f5bc70;
        }
        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 12px;
            font-size: 0.85rem;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1rem; }
            .tab-btn { font-size: 0.7rem; padding: 12px 6px; }
            .game-header { flex-direction: column; align-items: stretch; }
        }
        .timer-critical { background: #8b0000 !important; color: #ffcc44 !important; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .restart-custom { margin-top: 8px; }
        .fun-fact {
            background: #fef3c7;
            border-left: 5px solid #f59e0b;
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #92400e;
        }
        .level-btn { background: white; border: 1px solid #bfdbfe; padding: 10px; border-radius: 30px; cursor: pointer; }
        .level-btn.active { background: #2563eb; color: white; }
        .level-btn.locked { opacity: 0.5; cursor: not-allowed; }
        .levels-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 10px 0; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabFungi">🍄 Fungi Explorer</button>
        <button class="tab-btn" id="tabInvertebrates">🕷️ Invertebrates</button>
        <button class="tab-btn" id="TabCirculatory">❤️ Circulatory System</button>
    </div>
    <div class="game-header">
        <div class="level-badge">⭐ LEVEL <span id="levelNum">1</span></div>
        <div class="score-badge">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">40</span></div>
        <div class="timer-area">⏱️ <span id="timerDisplay">00</span> sec</div>
    </div>
    <div class="score-progress">
        <div class="score-text">📊 SCORE: <span id="scoreSpan">0</span></div>
        <div class="required-text">🎯 NEED 70% → <span id="passMark">28</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Select a science subject above to begin!</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div id="levelButtonsRow" class="levels-row"></div>
    <div class="message-area" id="gameMessage">✨ Choose a science topic above. Answer multiple-choice. Timer runs — pass 70% to advance! ✨</div>
</div>

<script>
    // ==============================================================
    // MERGED SCIENCE GAMES: Fungi, Invertebrates, Circulatory System
    // Each mode: 5 levels × 40 questions = 200 unique per mode
    // Pass: 70% (28/40 correct)
    // ==============================================================

    function shuffleArray(arr) { for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]} return arr; }

    // ======================= MODE 1: FUNGI EXPLORER =======================
    const fungiBank = [
        { q: "Which of these is a common type of fungus that grows on old bread?", correct: "Bread mould", options: ["Bacteria", "Bread mould", "Algae", "Virus"] },
        { q: "What is the umbrella-shaped part of a mushroom called?", correct: "Cap", options: ["Stem", "Cap", "Root", "Leaf"] },
        { q: "Which fungus is used to make bread rise?", correct: "Yeast", options: ["Mushroom", "Yeast", "Mould", "Toadstool"] },
        { q: "Mushrooms belong to which kingdom?", correct: "Fungi kingdom", options: ["Plant kingdom", "Animal kingdom", "Fungi kingdom", "Bacteria kingdom"] },
        { q: "Fungi are different from plants because they:", correct: "Cannot make their own food", options: ["Have green leaves", "Can make their own food", "Cannot make their own food", "Grow very tall"] },
        { q: "The long thread-like structures of fungi are called:", correct: "Hyphae", options: ["Roots", "Hyphae", "Stems", "Veins"] },
        { q: "Which medicine is made from Penicillium fungus?", correct: "Penicillin", options: ["Aspirin", "Penicillin", "Paracetamol", "Insulin"] },
        { q: "Yeast produces which gas to make dough rise?", correct: "Carbon dioxide", options: ["Oxygen", "Carbon dioxide", "Hydrogen", "Nitrogen"] },
        { q: "Fungi that cause athlete's foot are:", correct: "Parasitic fungi", options: ["Beneficial fungi", "Parasitic fungi", "Decomposers", "Producers"] },
        { q: "The visible mushroom above ground is the:", correct: "Fruiting body", options: ["Mycelium", "Fruiting body", "Spore", "Root"] }
    ];
    function buildFungiLevel(level) {
        let arr = [];
        for(let i=0;i<40;i++) {
            let base = fungiBank[i % fungiBank.length];
            let newQ = { ...base };
            if(level>=3) newQ.q = "🍄 " + newQ.q;
            arr.push(newQ);
        }
        return shuffleArray(arr);
    }

    // ======================= MODE 2: INVERTEBRATES =======================
    const invertBank = [
        { q: "How many legs do insects have?", correct: "Six", options: ["Four", "Six", "Eight", "Ten"] },
        { q: "Spiders belong to which class?", correct: "Arachnids", options: ["Insects", "Arachnids", "Crustaceans", "Myriapods"] },
        { q: "What do earthworms do for soil?", correct: "Aerate and enrich soil", options: ["Eat plant roots", "Aerate and enrich soil", "Spread diseases", "Dry out soil"] },
        { q: "Which invertebrate has a shell and a muscular foot?", correct: "Snail", options: ["Spider", "Snail", "Earthworm", "Jellyfish"] },
        { q: "Centipedes have how many legs per body segment?", correct: "One pair", options: ["One pair", "Two pairs", "No legs", "Three pairs"] },
        { q: "What is the hard outer covering of insects called?", correct: "Exoskeleton", options: ["Endoskeleton", "Exoskeleton", "Shell", "Carapace"] },
        { q: "Which invertebrate produces honey?", correct: "Bee", options: ["Ant", "Bee", "Wasp", "Butterfly"] },
        { q: "Why are earthworms important for farmers?", correct: "They improve soil fertility", options: ["They eat crops", "They improve soil fertility", "They scare pests", "They make noise"] },
        { q: "Which sea invertebrate has stinging cells?", correct: "Jellyfish", options: ["Starfish", "Jellyfish", "Octopus", "Crab"] },
        { q: "Insects have how many body parts?", correct: "Three (head, thorax, abdomen)", options: ["Two", "Three", "Four", "Five"] }
    ];
    function buildInvertLevel(level) {
        let arr = [];
        for(let i=0;i<40;i++) {
            let base = invertBank[i % invertBank.length];
            let newQ = { ...base };
            if(level>=3) newQ.q = "🕷️ " + newQ.q;
            arr.push(newQ);
        }
        return shuffleArray(arr);
    }

    // ======================= MODE 3: CIRCULATORY SYSTEM =======================
    const circBank = [
        { q: "How many chambers does the human heart have?", correct: "Four", options: ["Two", "Three", "Four", "Five"] },
        { q: "Which chamber pumps blood to the body?", correct: "Left ventricle", options: ["Right atrium", "Right ventricle", "Left atrium", "Left ventricle"] },
        { q: "What is the largest artery in the body?", correct: "Aorta", options: ["Pulmonary artery", "Aorta", "Carotid", "Coronary artery"] },
        { q: "Which blood cells carry oxygen?", correct: "Red blood cells", options: ["White blood cells", "Red blood cells", "Platelets", "Plasma"] },
        { q: "What is the function of the circulatory system?", correct: "Transport oxygen and nutrients", options: ["Digest food", "Transport oxygen and nutrients", "Control movement", "Produce urine"] },
        { q: "The natural pacemaker of the heart is the:", correct: "SA node", options: ["AV node", "SA node", "Purkinje fibers", "Bundle of His"] },
        { q: "Which blood vessel carries blood away from the heart?", correct: "Artery", options: ["Artery", "Vein", "Capillary", "Venule"] },
        { q: "What does hemoglobin do?", correct: "Carries oxygen in red blood cells", options: ["Fights infection", "Carries oxygen", "Clots blood", "Transports hormones"] },
        { q: "The pulmonary artery carries blood to the:", correct: "Lungs", options: ["Heart", "Lungs", "Brain", "Kidneys"] },
        { q: "What is a normal resting heart rate for a child?", correct: "70-100 bpm", options: ["40-60 bpm", "70-100 bpm", "120-150 bpm", "10-30 bpm"] }
    ];
    function buildCircLevel(level) {
        let arr = [];
        for(let i=0;i<40;i++) {
            let base = circBank[i % circBank.length];
            let newQ = { ...base };
            if(level>=3) newQ.q = "❤️ " + newQ.q;
            arr.push(newQ);
        }
        return shuffleArray(arr);
    }

    const modeBuilders = {
        fungi: (level) => buildFungiLevel(level),
        invertebrates: (level) => buildInvertLevel(level),
        circulatory: (level) => buildCircLevel(level)
    };

    const modeNames = {
        fungi: "🍄 Fungi Explorer",
        invertebrates: "🕷️ Invertebrates",
        circulatory: "❤️ Circulatory System"
    };

    // Global state
    let currentMode = "fungi";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 40;
    let passPercent = 70;
    let requiredCorrect = Math.ceil(totalQuestions * passPercent / 100);
    let timerInterval = null;
    let timeLeft = 0;
    let answeringLock = false;
    let waitingForNext = false;
    let levelFinished = false;
    let gameActive = true;

    // DOM elements
    const levelNumSpan = document.getElementById('levelNum');
    const currentScoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const gameMessageDiv = document.getElementById('gameMessage');
    const scoreSpan = document.getElementById('scoreSpan');
    const levelButtonsRow = document.getElementById('levelButtonsRow');

    function updateUI() {
        currentScoreSpan.innerText = levelScore;
        scoreSpan.innerText = levelScore;
        levelNumSpan.innerText = currentLevel;
        passMarkSpan.innerText = requiredCorrect;
        totalQSpan.innerText = totalQuestions;
    }

    function stopTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function startTimer() {
        if(timerInterval) stopTimer();
        const timeMap = {1:90, 2:80, 3:70, 4:60, 5:50};
        timeLeft = timeMap[currentLevel] || 70;
        timerDisplaySpan.innerText = timeLeft;
        timerDisplaySpan.classList.remove('timer-critical');
        timerInterval = setInterval(() => {
            if(!gameActive || levelFinished || answeringLock || waitingForNext) return;
            if(timeLeft <= 1) {
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableOptions();
                nextBtn.disabled = true;
                gameMessageDiv.innerHTML = `⏰ TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${totalQuestions} (need ${requiredCorrect}). Restart or change mode.`;
                showRestart();
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = timeLeft;
                if(timeLeft <= 10) timerDisplaySpan.classList.add('timer-critical');
                else timerDisplaySpan.classList.remove('timer-critical');
                if(timeLeft === 15) gameMessageDiv.innerHTML = `⚠️ ${timeLeft} seconds left! Answer quickly! ⚠️`;
            }
        }, 1000);
    }

    function disableOptions() {
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
    }

    function showRestart() {
        let existing = document.querySelector('.restart-custom');
        if(existing) existing.remove();
        const btn = document.createElement('button');
        btn.innerText = '🔄 RESTART LEVEL 🔄';
        btn.className = 'restart-btn restart-custom';
        btn.onclick = () => initMode(currentMode);
        gameMessageDiv.appendChild(btn);
    }

    function handleAnswer(selected, correct, btnEl) {
        if(answeringLock || waitingForNext || !gameActive || levelFinished) return;
        answeringLock = true;
        const isCorrect = (selected === correct);
        if(isCorrect) {
            levelScore++;
            updateUI();
            btnEl.classList.add('correct-highlight');
            gameMessageDiv.innerHTML = `✅ CORRECT! +1 point (${levelScore}/${totalQuestions}) | Time left: ${timeLeft}s`;
        } else {
            btnEl.classList.add('wrong-highlight');
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn => {
                btn.disabled = true;
                let txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if(txt === correct) btn.classList.add('correct-highlight');
            });
            gameMessageDiv.innerHTML = `❌ WRONG! Correct: "${correct}". Score: ${levelScore}/${totalQuestions}`;
        }
        disableOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadQuestion() {
        if(!gameActive) return;
        if(currentQIndex >= totalQuestions) { finishLevel(); return; }
        const q = levelQuestions[currentQIndex];
        questionTextDiv.innerText = q.q;
        optionsContainer.innerHTML = '';
        const shuffled = shuffleArray([...q.options]);
        const prefixes = ['A','B','C','D'];
        shuffled.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsContainer.appendChild(btn);
        });
        answeringLock = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        gameMessageDiv.innerHTML = `🔬 Level ${currentLevel} • Q${currentQIndex+1}/${totalQuestions} • ${modeNames[currentMode]} mode. Timer running!`;
    }

    function nextQuestion() {
        if(!waitingForNext) return;
        if(levelFinished) return;
        currentQIndex++;
        if(currentQIndex < totalQuestions) loadQuestion();
        else finishLevel();
    }

    function finishLevel() {
        if(levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if(passed) {
            if(currentLevel === 5) {
                gameMessageDiv.innerHTML = `🏆✨ AMAZING! You mastered ALL levels in ${modeNames[currentMode]}! Final Score: ${levelScore}/${totalQuestions} (${Math.round(levelScore/totalQuestions*100)}%). Science Champion! ✨🏆`;
                disableOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                gameMessageDiv.innerHTML = `🎉 LEVEL ${currentLevel} COMPLETE! 🎉 ${levelScore}/${totalQuestions} PASS! Moving to LEVEL ${currentLevel+1}...`;
                disableOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(totalQuestions * passPercent / 100);
                updateUI();
                levelFinished = false;
                gameActive = true;
                answeringLock = false;
                waitingForNext = false;
                levelQuestions = modeBuilders[currentMode](currentLevel);
                levelQuestions = shuffleArray(levelQuestions).slice(0,totalQuestions);
                stopTimer();
                startTimer();
                loadQuestion();
                updateLevelButtons();
                return;
            }
        } else {
            gameActive = false;
            disableOptions();
            nextBtn.disabled = true;
            gameMessageDiv.innerHTML = `💔 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${totalQuestions} (need ${requiredCorrect}). Restart or switch mode. 💔`;
            showRestart();
        }
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=5;i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            if(i === currentLevel) btn.classList.add('active');
            btn.innerText = `Level ${i}`;
            btn.onclick = () => {
                if(i <= currentLevel || i === currentLevel+1) {
                    currentLevel = i;
                    currentQIndex = 0;
                    levelScore = 0;
                    requiredCorrect = Math.ceil(totalQuestions * passPercent / 100);
                    levelFinished = false;
                    gameActive = true;
                    answeringLock = false;
                    waitingForNext = false;
                    levelQuestions = modeBuilders[currentMode](currentLevel);
                    levelQuestions = shuffleArray(levelQuestions).slice(0,totalQuestions);
                    updateUI();
                    stopTimer();
                    startTimer();
                    loadQuestion();
                    updateLevelButtons();
                    gameMessageDiv.innerHTML = `🔬 Switched to Level ${i} of ${modeNames[currentMode]}. Good luck!`;
                } else {
                    gameMessageDiv.innerHTML = `🔒 Complete Level ${i-1} first to unlock! Need 70% (${requiredCorrect}/40)`;
                }
            };
            levelButtonsRow.appendChild(btn);
        }
    }

    function initMode(mode) {
        stopTimer();
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        requiredCorrect = Math.ceil(totalQuestions * passPercent / 100);
        gameActive = true;
        levelFinished = false;
        answeringLock = false;
        waitingForNext = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        levelQuestions = shuffleArray(levelQuestions).slice(0,totalQuestions);
        updateUI();
        startTimer();
        loadQuestion();
        updateLevelButtons();
        gameMessageDiv.innerHTML = `🔬 ${modeNames[currentMode]} MODE • Level 1 • Answer all questions, pass 70% to advance!`;
        
        // Update tab active states
        document.getElementById('tabFungi').classList.toggle('active', mode === 'fungi');
        document.getElementById('tabInvertebrates').classList.toggle('active', mode === 'invertebrates');
        document.getElementById('TabCirculatory').classList.toggle('active', mode === 'circulatory');
    }

    // Event listeners
    document.getElementById('tabFungi').addEventListener('click', () => initMode('fungi'));
    document.getElementById('tabInvertebrates').addEventListener('click', () => initMode('invertebrates'));
    document.getElementById('TabCirculatory').addEventListener('click', () => initMode('circulatory'));
    nextBtn.addEventListener('click', nextQuestion);

    // Start with fungi mode
    initMode('fungi');
</script>
</body>
</html>
