<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 3 | English | Safety, Domestic Animals & Wild Animals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 30%, #F9A825 70%, #E65100 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #FFFDF5;
            border-radius: 60px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .stats-bar {
            background: #2E7D32;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 4px solid #1B5E20;
        }

        .stat {
            background: #E65100;
            padding: 6px 14px;
            border-radius: 50px;
            color: #FFF9C4;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat span:first-child {
            color: #FFB74D;
            margin-right: 5px;
        }

        .level-badge {
            background: #F9A825;
            color: #1B5E20;
        }

        .question-area {
            padding: 25px;
            text-align: center;
        }

        .question-text {
            background: #E8F5E9;
            padding: 25px 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1B5E20;
            box-shadow: inset 0 0 0 3px white, 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            word-break: break-word;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .voice-btn {
            background: #F9A825;
            border: none;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            color: #1B5E20;
            box-shadow: 0 3px 0 #C47D0A;
            transition: 0.05s linear;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #C47D0A;
        }

        .answer-input {
            width: 85%;
            padding: 14px 20px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 50px;
            border: 3px solid #F9A825;
            background: white;
            font-weight: bold;
            outline: none;
        }

        .answer-input:focus {
            border-color: #2E7D32;
        }

        .hint-area {
            background: #FFF8E1;
            margin-top: 12px;
            padding: 10px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #E65100;
            font-weight: bold;
            min-height: 50px;
        }

        .timer-box {
            background: #1B5E20;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .timer-clock {
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.5rem;
            color: #F9A825;
        }

        .submit-btn {
            background: #E65100;
            border: none;
            font-size: 1.2rem;
            padding: 12px 20px;
            width: 80%;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 4px 0 #BF360C;
        }

        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #BF360C;
        }

        .feedback {
            font-size: 0.95rem;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 50px;
            margin: 10px 20px;
            background: #F0E6D2;
        }

        .next-level-info {
            background: linear-gradient(90deg, #F9A825, #FFB74D);
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            margin: 5px 20px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #1B5E20;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1rem; padding: 18px 12px; }
            .answer-input { font-size: 0.9rem; width: 90%; }
            .timer-clock { font-size: 1.2rem; }
            .stat { font-size: 0.7rem; padding: 4px 10px; }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat level-badge"><span>📚 LEVEL</span> <span id="levelNum">1</span></div>
        <div class="stat"><span>⭐ SCORE</span> <span id="scoreDisplay">0</span></div>
        <div class="stat"><span>📊 PROGRESS</span> <span id="qCounter">0</span>/<span id="totalQLevel">30</span></div>
        <div class="stat"><span>🎯 NEED</span> 80%</div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading your English adventure...</div>
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION</button>
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <div class="hint-area" id="hintMsg">🎧 Click the speaker to hear the question. Type your answer (1-3 words).</div>
    </div>
    <div class="timer-box">
        <span>⏳ TIME REMAINING</span>
        <span class="timer-clock" id="timerDisplay">40</span>
    </div>
    <button class="submit-btn" id="submitAnswer">✅ SUBMIT ANSWER</button>
    <div class="feedback" id="feedbackMsg">🌟 Answer 30 questions per level. Get 80% to advance!</div>
    <div id="levelInfoMsg" class="next-level-info">🛡️ Safety | 🐕 Domestic Animals | 🦁 Wild Animals | English</div>
</div>

<script>
    // ============================================================
    // CBC GRADE 3 - ENGLISH
    // Topics: Safety, Domestic Animals, Wild Animals
    // 5 Levels x 30 Questions | 40 Second Timer | Voice Output
    // ============================================================
    
    // ----- SAFETY QUESTIONS (15+ unique) -----
    const SAFETY_QUESTIONS = [
        { text: "What should you do before crossing the road?", answer: "look both ways" },
        { text: "What color is the traffic light that means stop?", answer: "red" },
        { text: "What color is the traffic light that means go?", answer: "green" },
        { text: "What should you wear when riding a bicycle for safety?", answer: "helmet" },
        { text: "What number do you call for emergency in Kenya?", answer: "999" },
        { text: "What should you do if you see fire?", answer: "call for help" },
        { text: "What should you use to cross the road safely?", answer: "zebra crossing" },
        { text: "What should you never play with at home?", answer: "matches" },
        { text: "What should you wear on your feet when playing outside?", answer: "shoes" },
        { text: "What should you do if a stranger offers you candy?", answer: "say no" },
        { text: "What should you always tell your parents before going out?", answer: "where you are going" },
        { text: "What should you do when you hear a fire alarm?", answer: "go outside" },
        { text: "What should you never touch that has electricity?", answer: "wires" },
        { text: "What should you do when cooking with an adult?", answer: "be careful" },
        { text: "What should you wear to protect your eyes when swimming?", answer: "goggles" },
        { text: "What should you do if you get lost?", answer: "find a policeman" },
        { text: "What should you do before eating food?", answer: "wash hands" }
    ];
    
    // ----- DOMESTIC ANIMALS (15+ unique) -----
    const DOMESTIC_ANIMALS = [
        { text: "What animal gives us milk?", answer: "cow" },
        { text: "What animal says 'meow'?", answer: "cat" },
        { text: "What animal says 'woof'?", answer: "dog" },
        { text: "What animal gives us eggs?", answer: "chicken" },
        { text: "What animal carries heavy loads and brays?", answer: "donkey" },
        { text: "What animal gives us wool?", answer: "sheep" },
        { text: "What animal is called the 'ship of the desert'?", answer: "camel" },
        { text: "What animal provides us with meat and bacon?", answer: "pig" },
        { text: "What animal guards our home?", answer: "dog" },
        { text: "What animal do we ride on its back?", answer: "horse" },
        { text: "What animal has long ears and hops?", answer: "rabbit" },
        { text: "What animal is kept for its feathers and eggs?", answer: "duck" },
        { text: "What animal gives us honey?", answer: "bee" },
        { text: "What animal is a small rodent often kept as a pet?", answer: "hamster" },
        { text: "What animal is known as man's best friend?", answer: "dog" }
    ];
    
    // ----- WILD ANIMALS (15+ unique) -----
    const WILD_ANIMALS = [
        { text: "What is the king of the jungle?", answer: "lion" },
        { text: "What animal has a very long neck?", answer: "giraffe" },
        { text: "What animal has a trunk and big ears?", answer: "elephant" },
        { text: "What animal has black and white stripes?", answer: "zebra" },
        { text: "What is the fastest land animal?", answer: "cheetah" },
        { text: "What animal has a hump and lives in the desert?", answer: "camel" },
        { text: "What animal lives in rivers and has sharp teeth?", answer: "crocodile" },
        { text: "What animal has spots and is a good climber?", answer: "leopard" },
        { text: "What animal is called the king of the savanna?", answer: "lion" },
        { text: "What animal has a horn on its nose?", answer: "rhinoceros" },
        { text: "What animal is very large and lives in water?", answer: "hippopotamus" },
        { text: "What animal is known for its laughing sound?", answer: "hyena" },
        { text: "What animal has a long tail and swings on trees?", answer: "monkey" },
        { text: "What animal is a large wild cat with orange fur and black stripes?", answer: "tiger" },
        { text: "What animal has big ears and lives in the savanna?", answer: "elephant" }
    ];
    
    // Generate 30 unique questions for a specific level (covers all 3 topics)
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedTexts = new Set();
        
        function addQuestion(text, answer, topic) {
            if (usedTexts.has(text)) return false;
            usedTexts.add(text);
            questions.push({
                text: text,
                expected: answer,
                topic: topic,
                expectedLower: String(answer).trim().toLowerCase(),
                checkAnswer: function(userInput) {
                    let inputNorm = String(userInput).trim().toLowerCase().replace(/\s+/g, ' ');
                    return inputNorm === this.expectedLower;
                },
                getHint: function(seconds) {
                    if (seconds <= 8) return `💡 HINT: The answer is "${this.expected}"`;
                    if (seconds <= 18) return `⏰ Think about ${this.topic}!`;
                    return `✨ Type your answer. ${seconds} seconds left.`;
                }
            });
            return true;
        }
        
        // Add 10 Safety Questions (varied by level)
        for (let i = 0; i < 10; i++) {
            let idx = (level * 3 + i * 2) % SAFETY_QUESTIONS.length;
            let q = SAFETY_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Safety 🛡️");
        }
        
        // Add 10 Domestic Animals Questions (varied by level)
        for (let i = 0; i < 10; i++) {
            let idx = (level * 5 + i * 3) % DOMESTIC_ANIMALS.length;
            let q = DOMESTIC_ANIMALS[idx];
            addQuestion(q.text, q.answer, "Domestic Animals 🐕");
        }
        
        // Add 10 Wild Animals Questions (varied by level)
        for (let i = 0; i < 10; i++) {
            let idx = (level * 7 + i * 4) % WILD_ANIMALS.length;
            let q = WILD_ANIMALS[idx];
            addQuestion(q.text, q.answer, "Wild Animals 🦁");
        }
        
        // Ensure we have exactly 30 (fill if needed from all sources)
        let allSources = [...SAFETY_QUESTIONS, ...DOMESTIC_ANIMALS, ...WILD_ANIMALS];
        let fillIndex = 0;
        while (questions.length < 30 && fillIndex < allSources.length) {
            let q = allSources[fillIndex];
            let topic = "English";
            if (fillIndex < SAFETY_QUESTIONS.length) topic = "Safety 🛡️";
            else if (fillIndex < SAFETY_QUESTIONS.length + DOMESTIC_ANIMALS.length) topic = "Domestic Animals 🐕";
            else topic = "Wild Animals 🦁";
            addQuestion(q.text, q.answer, topic);
            fillIndex++;
        }
        
        // Shuffle questions for variety
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        
        return questions;
    }
    
    // ========== GAME STATE ==========
    let currentLevel = 1;
    let currentQuestionsList = [];
    let currentQuestionIndex = 0;
    let currentLevelScore = 0;
    let timerInterval = null;
    let secondsRemaining = 40;
    let isTransitioning = false;
    let activeQuestion = null;
    let isTimeoutFlag = false;
    
    // DOM Elements
    const levelSpan = document.getElementById("levelNum");
    const scoreSpan = document.getElementById("scoreDisplay");
    const progressSpan = document.getElementById("qCounter");
    const totalSpan = document.getElementById("totalQLevel");
    const questionDiv = document.getElementById("questionText");
    const answerInput = document.getElementById("answerInput");
    const hintDiv = document.getElementById("hintMsg");
    const timerDisplay = document.getElementById("timerDisplay");
    const submitButton = document.getElementById("submitAnswer");
    const feedbackDiv = document.getElementById("feedbackMsg");
    const levelInfoDiv = document.getElementById("levelInfoMsg");
    const speakButton = document.getElementById("speakBtn");
    
    totalSpan.textContent = "30";
    
    // Speech Function
    const speechSynth = window.speechSynthesis;
    function speakMessage(message) {
        if (!message) return;
        try {
            if (speechSynth.speaking) speechSynth.cancel();
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = "en-US";
                utterance.rate = 0.9;
                speechSynth.speak(utterance);
            }, 50);
        } catch(e) {
            console.log("Speech error");
        }
    }
    
    // Timer Functions
    function stopGameTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function updateTimerView() {
        timerDisplay.textContent = secondsRemaining;
        if (secondsRemaining <= 8) timerDisplay.style.color = "#ff8888";
        else if (secondsRemaining <= 20) timerDisplay.style.color = "#ffaa44";
        else timerDisplay.style.color = "#F9A825";
    }
    
    function startGameTimer() {
        stopGameTimer();
        secondsRemaining = 40;
        updateTimerView();
        timerInterval = setInterval(() => {
            if (isTransitioning) return;
            if (secondsRemaining <= 1) {
                stopGameTimer();
                if (!isTransitioning) {
                    // Voice says "Time is up, moving to the next question" (NOT incorrect)
                    speakMessage("Time is up, moving to the next question");
                    isTransitioning = true;
                    isTimeoutFlag = true;
                    feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                    setTimeout(() => {
                        moveToNextQuestion(false);
                    }, 1500);
                }
            } else {
                secondsRemaining--;
                updateTimerView();
                if (activeQuestion && !isTransitioning) {
                    if (secondsRemaining <= 12) {
                        hintDiv.innerHTML = activeQuestion.getHint(secondsRemaining);
                    } else if (secondsRemaining <= 25) {
                        hintDiv.innerHTML = `⏰ ${secondsRemaining} sec left. Think about ${activeQuestion.topic}!`;
                    } else {
                        hintDiv.innerHTML = `✨ ${secondsRemaining} sec left. Click speaker to hear question.`;
                    }
                }
            }
        }, 1000);
    }
    
    function moveToNextQuestion(isAnswerCorrect) {
        stopGameTimer();
        
        if (isAnswerCorrect) {
            currentLevelScore++;
            scoreSpan.textContent = currentLevelScore;
            feedbackDiv.innerHTML = "✅ CORRECT! Great job! +1 point";
            speakMessage("Correct answer! Well done.");
        } else if (!isTimeoutFlag) {
            let correctAns = activeQuestion ? activeQuestion.expected : "?";
            feedbackDiv.innerHTML = `❌ INCORRECT! The correct answer is: ${correctAns}`;
            speakMessage(`Wrong answer. The correct answer is ${correctAns}.`);
        } else {
            // Timeout case - already spoke "Time is up"
            feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
        }
        
        isTimeoutFlag = false;
        currentQuestionIndex++;
        progressSpan.textContent = currentQuestionIndex;
        
        // Check if level is complete (30 questions)
        if (currentQuestionIndex >= 30) {
            let percentage = (currentLevelScore / 30) * 100;
            if (percentage >= 80) {
                if (currentLevel < 5) {
                    levelInfoDiv.innerHTML = `🎉 LEVEL ${currentLevel} PASSED! ${Math.floor(percentage)}% → Moving to LEVEL ${currentLevel + 1}`;
                    speakMessage(`Congratulations! You passed level ${currentLevel}. Moving to next level.`);
                    currentLevel++;
                    currentQuestionIndex = 0;
                    currentLevelScore = 0;
                    isTransitioning = false;
                    initializeLevel(currentLevel);
                } else {
                    feedbackDiv.innerHTML = "🏆🏆🏆 AMAZING! You completed ALL 5 LEVELS! YOU ARE AN ENGLISH STAR! 🏆🏆🏆";
                    levelInfoDiv.innerHTML = "🦁🐕🛡️ GAME COMPLETE! Refresh to play again. Keep learning English! 🦁🐕🛡️";
                    speakMessage("Congratulations! You completed all five levels. You are an English star!");
                    submitButton.disabled = true;
                    answerInput.disabled = true;
                    return;
                }
            } else {
                levelInfoDiv.innerHTML = `❌ LEVEL ${currentLevel} FAILED! ${Math.floor(percentage)}% (Need 80%). Restarting level... Keep learning!`;
                speakMessage(`You scored ${Math.floor(percentage)} percent. Need 80 to pass. Restarting level ${currentLevel}.`);
                currentQuestionIndex = 0;
                currentLevelScore = 0;
                isTransitioning = false;
                initializeLevel(currentLevel);
            }
            return;
        }
        
        isTransitioning = false;
        loadCurrentQuestion();
    }
    
    function loadCurrentQuestion() {
        activeQuestion = currentQuestionsList[currentQuestionIndex];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        answerInput.disabled = false;
        submitButton.disabled = false;
        feedbackDiv.innerHTML = "⏳ Type your answer & click SUBMIT. Timer: 40 seconds.";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        scoreSpan.textContent = currentLevelScore;
        levelSpan.textContent = currentLevel;
        progressSpan.textContent = currentQuestionIndex;
        isTransitioning = false;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    function handleAnswerSubmit() {
        if (isTransitioning) {
            feedbackDiv.innerHTML = "⏳ Please wait...";
            return;
        }
        if (!activeQuestion) return;
        
        let userAnswer = answerInput.value.trim();
        if (userAnswer === "") {
            feedbackDiv.innerHTML = "📝 Please type an answer!";
            speakMessage("Type your answer first.");
            return;
        }
        
        stopGameTimer();
        let isCorrect = activeQuestion.checkAnswer(userAnswer);
        isTransitioning = true;
        isTimeoutFlag = false;
        moveToNextQuestion(isCorrect);
    }
    
    function speakActiveQuestion() {
        if (!activeQuestion || isTransitioning) {
            speakMessage("Please wait, the next question is loading.");
            return;
        }
        speakMessage(activeQuestion.text);
    }
    
    function initializeLevel(level) {
        currentLevel = level;
        currentQuestionsList = generateQuestionsForLevel(level);
        currentQuestionIndex = 0;
        currentLevelScore = 0;
        isTransitioning = false;
        isTimeoutFlag = false;
        
        levelSpan.textContent = level;
        scoreSpan.textContent = "0";
        progressSpan.textContent = "0";
        totalSpan.textContent = "30";
        feedbackDiv.innerHTML = `📚 LEVEL ${level} START! Answer 30 questions, need 80% to advance. 🛡️🐕🦁`;
        levelInfoDiv.innerHTML = `🛡️ Safety | 🐕 Domestic Animals | 🦁 Wild Animals | Level ${level} of 5 | You can do it!`;
        
        submitButton.disabled = false;
        answerInput.disabled = false;
        
        // Load first question
        activeQuestion = currentQuestionsList[0];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    // Event Listeners
    submitButton.addEventListener("click", handleAnswerSubmit);
    speakButton.addEventListener("click", speakActiveQuestion);
    answerInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter" && !isTransitioning && activeQuestion) {
            handleAnswerSubmit();
        }
    });
    
    // Start the game
    initializeLevel(1);
</script>
</body>
</html>
