<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Bible Heroes - Grade 1 CRE | Word of God, Joseph & The Chariot of Fire</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #5d3a1a 0%, #3e2a10 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #5d3a1a;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        📖🔥👑 Bobo's Bible Heroes! Learn about God's Word, Joseph & His Brothers, and the Chariot of Fire.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Word of God, Joseph & His Brothers, The Chariot of Fire ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // THE WORD OF GOD (Bible, verses, teachings, importance)
        const wordOfGod = [
            { q: "The holy book of Christians is called the ______.", a: "bible" },
            { q: "The Bible has two parts: the Old Testament and the ______ Testament.", a: "new" },
            { q: "The first book of the Bible is ______.", a: "genesis" },
            { q: "The last book of the Bible is ______.", a: "revelation" },
            { q: "The Bible is God's ______ to us.", a: "word" },
            { q: "We learn how to be good people by reading the ______.", a: "bible" },
            { q: "The Bible teaches us to love God and love our ______.", a: "neighbor" },
            { q: "The Ten Commandments are found in the book of ______.", a: "exodus" },
            { q: "Jesus taught people using stories called ______.", a: "parables" },
            { q: "The Psalms are songs and prayers found in the ______.", a: "bible" }
        ];
        
        // JOSEPH AND HIS BROTHERS (Genesis 37-50)
        const joseph = [
            { q: "Joseph was the favorite son of his father ______.", a: "jacob" },
            { q: "Joseph's father gave him a beautiful ______ of many colors.", a: "coat" },
            { q: "Joseph's brothers were ______ of him.", a: "jealous" },
            { q: "Joseph's brothers sold him into ______.", a: "slavery" },
            { q: "Joseph was taken to the land of ______.", a: "egypt" },
            { q: "In Egypt, Joseph worked for a man named ______.", a: "potiphar" },
            { q: "Joseph was put in ______ because of a false accusation.", a: "prison" },
            { q: "Joseph interpreted dreams for Pharaoh, the king of ______.", a: "egypt" },
            { q: "Pharaoh made Joseph the second most powerful man in ______.", a: "egypt" },
            { q: "During a famine, Joseph's brothers came to Egypt to buy ______.", a: "grain" },
            { q: "Joseph forgave his brothers because he trusted ______.", a: "god" },
            { q: "Joseph said, 'You meant evil against me, but God meant it for ______.'", a: "good" },
            { q: "Joseph's younger brother was named ______.", a: "benjamin" },
            { q: "Joseph had a dream about sheaves of ______ bowing to his sheaf.", a: "wheat" },
            { q: "Joseph's father Jacob also had the name ______.", a: "israel" }
        ];
        
        // THE CHARIOT OF FIRE (2 Kings 2:1-12 - Elijah and Elisha)
        const chariot = [
            { q: "The prophet who was taken to heaven in a chariot of fire was ______.", a: "elijah" },
            { q: "The prophet who stayed with Elijah and received a double portion of his spirit was ______.", a: "elisha" },
            { q: "Elijah and Elisha were walking near the River ______.", a: "jordan" },
            { q: "Elijah struck the water with his ______, and the water divided.", a: "cloak" },
            { q: "Suddenly, a chariot of ______ appeared and separated them.", a: "fire" },
            { q: "Elijah went up to heaven in a ______.", a: "whirlwind" },
            { q: "Elisha picked up Elijah's ______ that had fallen.", a: "cloak" },
            { q: "Elisha then struck the water and it ______, just as it had for Elijah.", a: "divided" },
            { q: "The chariot of fire was pulled by horses of ______.", a: "fire" },
            { q: "The sons of the prophets watched from a distance as Elijah was taken ______.", a: "up" }
        ];
        
        // ADDITIONAL BIBLE STORIES & VALUES
        const moreStories = [
            { q: "God gave His only ______ to save the world.", a: "son" },
            { q: "Jesus is the Son of ______.", a: "god" },
            { q: "The Bible says, 'Love your neighbor as ______.'", a: "yourself" },
            { q: "Joseph showed ______ to his brothers even though they hurt him.", a: "forgiveness" },
            { q: "The chariot of fire showed that God has power over ______.", a: "heaven" }
        ];
        
        const allTopics = [...wordOfGod, ...joseph, ...chariot, ...moreStories];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo reads the holy book that tells us about God's love. This book is the ______.";
                correctAnswer = "bible";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "Joseph's brothers were angry because their father gave Joseph a special ______ of many colors.";
                correctAnswer = "coat";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "The prophet Elijah went up to heaven in a chariot of ______ and a whirlwind.";
                correctAnswer = "fire";
            }
            if (i % 8 === 0) {
                qText = "Joseph forgave his brothers even though they sold him into ______.";
                correctAnswer = "slavery";
            }
            if (i % 9 === 0) {
                qText = "The first book of the Bible is called ______.";
                correctAnswer = "genesis";
            }
            if (i % 11 === 0) {
                qText = "After Elijah was taken to heaven, Elisha picked up his ______ and struck the water.";
                correctAnswer = "cloak";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: The Word of God! Learn about the Bible, God's holy book.";
        else if (currentLevel === 2) levelDesc = "Level 2: Joseph and His Brothers! A story of jealousy, slavery, and forgiveness.";
        else if (currentLevel === 3) levelDesc = "Level 3: The Chariot of Fire! Elijah is taken to heaven in a fiery chariot.";
        else if (currentLevel === 4) levelDesc = "Level 4: More about Joseph! Dreams, prison, and becoming a ruler in Egypt.";
        else levelDesc = "Level 5: Final challenge! Become a Grade 1 Bible Hero Champion!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Bible Hero Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of God's Word, the story of Joseph and his brothers, and the Chariot of Fire! Keep reading your Bible!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know about the Bible, Joseph's forgiveness, and Elijah's fiery chariot! 📖🔥👑✨";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about the Bible!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for English answers
        if (!isCorrect) {
            const forgiving = {
                "bible": ["the bible", "holy bible", "scripture"],
                "new": ["new testament"],
                "genesis": ["book of genesis", "genesis"],
                "revelation": ["book of revelation", "revelation"],
                "word": ["message", "teaching"],
                "neighbor": ["others", "people", "everyone"],
                "exodus": ["book of exodus"],
                "parables": ["stories", "illustrations"],
                "jacob": ["israel", "jacob"],
                "coat": ["robe", "tunic", "garment"],
                "jealous": ["envious", "green with envy"],
                "slavery": ["captivity", "bondage"],
                "egypt": ["land of egypt"],
                "potiphar": ["potiphar"],
                "prison": ["jail", "dungeon"],
                "grain": ["food", "corn", "wheat"],
                "god": ["the lord", "almighty"],
                "good": ["well", "for good"],
                "benjamin": ["benjamin"],
                "wheat": ["grain", "corn"],
                "israel": ["jacob", "israel"],
                "elijah": ["elijah the prophet"],
                "elisha": ["elisha the prophet"],
                "jordan": ["river jordan", "jordan river"],
                "cloak": ["mantle", "robe"],
                "fire": ["fiery", "flames"],
                "whirlwind": ["storm", "wind"],
                "divided": ["split", "parted"],
                "up": ["to heaven", "upward"],
                "son": ["jesus", "son of god"],
                "yourself": ["you", "yourself"],
                "forgiveness": ["pardon", "mercy"],
                "heaven": ["sky", "paradise"],
                "elijah": ["elijah"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // Accept plural/singular
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep reading your Bible! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Bible Heroes! Learn about the Word of God, the story of Joseph and his brothers, and the amazing Chariot of Fire. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's explore the Bible together!");
        }, 500);
    });
</script>
</body>
</html>
