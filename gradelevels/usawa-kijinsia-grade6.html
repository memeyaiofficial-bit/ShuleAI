<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🇰🇪 Mabingwa wa Kiswahili | Gredi 6 | Usawa, Sarufi, Ushairi na Kusoma</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(145deg, #eef2ff 0%, #ffffff 100%);
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
    }

    .game-container {
        max-width: 1100px;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 3rem 2rem 3rem 2rem;
        box-shadow: 0 25px 45px -12px rgba(0, 65, 115, 0.4);
        overflow: hidden;
        border: 2px solid #7abff7;
    }

    .mode-tabs {
        display: flex;
        background: #0b3b5f;
        border-bottom: 3px solid #ffcd7e;
        gap: 2px;
        flex-wrap: wrap;
    }
    .tab-btn {
        flex: 1;
        background: #1e6faf;
        color: #fef9e0;
        border: none;
        padding: 14px 8px;
        font-size: 0.8rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: inherit;
        text-align: center;
    }
    .tab-btn.active {
        background: linear-gradient(135deg, #f4a261, #e76f51);
        color: white;
    }
    .tab-btn:active { transform: scale(0.98); }

    .game-header {
        background: #0b3b5f;
        padding: 1rem 1.5rem;
        color: white;
        text-align: center;
        border-bottom: 4px solid #ffcd7e;
    }
    .game-header h1 {
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .kenyan-flag-badge {
        background: #f5f5f5;
        padding: 5px 15px;
        border-radius: 60px;
        font-size: 0.65rem;
        font-weight: 700;
        color: #0b3b5f;
    }

    .levels-row {
        display: flex;
        justify-content: space-between;
        background: #f0f9ff;
        padding: 12px 20px;
        gap: 10px;
        flex-wrap: wrap;
        border-bottom: 2px dashed #b9dcf5;
    }
    .level-btn {
        background: white;
        border: none;
        padding: 10px 0;
        flex: 1;
        font-weight: bold;
        font-size: 0.85rem;
        border-radius: 60px;
        cursor: pointer;
        font-family: inherit;
        color: #15607a;
        border: 1px solid #cae3f5;
        transition: 0.2s;
    }
    .level-btn.active {
        background: #1e6faf;
        color: white;
        transform: scale(0.97);
    }
    .level-btn:hover:not(.active) { background: #d4ebff; transform: translateY(-2px); }

    .info-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        padding: 10px 24px;
        border-bottom: 1px solid #d0e6f7;
        flex-wrap: wrap;
        gap: 10px;
    }
    .score-box, .q-counter {
        background: #eef2fc;
        padding: 5px 18px;
        border-radius: 40px;
        font-weight: bold;
        color: #0f5080;
    }
    .score-box span, .q-counter span {
        font-size: 1.4rem;
        font-weight: 800;
        margin-left: 6px;
        color: #033b61;
    }

    .quiz-area {
        padding: 1.5rem 1.5rem 0.8rem;
        text-align: center;
    }
    .question-card {
        background: linear-gradient(145deg, #fefefe, #f2f9ff);
        padding: 22px 16px;
        border-radius: 48px;
        margin-bottom: 18px;
        border: 2px solid #b3defa;
    }
    .topic-badge {
        font-size: 0.85rem;
        font-weight: bold;
        background: #cde6fe;
        display: inline-block;
        padding: 4px 18px;
        border-radius: 40px;
        margin-bottom: 12px;
        color: #043753;
    }
    .question-text {
        font-size: 1.25rem;
        font-weight: 800;
        color: #00263b;
        line-height: 1.4;
        margin-top: 8px;
    }
    .passage-text, .letter-text, .poem-text, .sentence-display {
        background: #e6f2ff;
        padding: 16px;
        border-radius: 28px;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 16px;
        text-align: left;
        color: #003366;
    }
    .options-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 16px 0;
    }
    .option-btn {
        background: #d9ecff;
        border: none;
        padding: 12px 14px;
        border-radius: 60px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        text-align: left;
        font-family: inherit;
    }
    .option-btn:hover:not(:disabled) { background: #80bfff; transform: translateX(5px); }
    .option-btn.correct { background: #66ff99; color: #004d1a; }
    .option-btn.wrong { background: #ff6666; color: #660000; text-decoration: line-through; }
    .option-btn:disabled { cursor: default; opacity: 0.7; }

    .hint-box {
        background: #fff6e0;
        border-left: 10px solid #ffb347;
        padding: 10px 16px;
        margin: 10px 0 0;
        border-radius: 30px;
        font-size: 0.85rem;
        color: #0a537c;
        text-align: left;
    }
    .next-level-msg {
        background: #00713b;
        color: white;
        text-align: center;
        padding: 12px;
        border-radius: 60px;
        margin: 10px 20px;
        cursor: pointer;
        font-weight: bold;
    }
    .footer-note {
        text-align: center;
        font-size: 0.65rem;
        padding: 12px;
        color: #346f95;
    }
    @media (max-width: 680px) {
        .question-text { font-size: 1rem; }
        .tab-btn { font-size: 0.6rem; padding: 10px 4px; }
        .option-btn { padding: 10px; font-size: 0.85rem; }
        .passage-text { font-size: 0.85rem; }
    }
</style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabWasifu">📖 Wasifu & Usawa</button>
        <button class="tab-btn" id="TabSarufiI">🔤 Ngeli YA-YA & I-I</button>
        <button class="tab-btn" id="TabUshairi">📜 Ushairi & Matamshi</button>
        <button class="tab-btn" id="TabKusoma">🌍 Kusoma kwa Mapana</button>
    </div>
    <div class="game-header">
        <h1>🇰🇪 MABINGWA WA KISWAHILI 🏆
            <span class="kenyan-flag-badge">GREDI 6 • USAWA, SARUFI NA KUSOMA</span>
        </h1>
    </div>
    <div class="levels-row" id="levelButtonsContainer"></div>
    <div class="info-panel">
        <div class="score-box">⭐ ALAMA: <span id="scoreValue">0</span></div>
        <div class="q-counter">📌 SWALI: <span id="currentQNumber">1</span> / <span id="totalQperLevel">15</span></div>
    </div>
    <div class="quiz-area" id="dynamicContent"></div>
    <div id="levelCompleteMsg"></div>
    <div class="footer-note">🎯 Jibu kwa kubonyeza chaguo sahihi. Pata pointi 10 kwa jibu sahihi. Pita ngazi kwa 80% (12/15)!</div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: 4 MODES - Wasifu/Usawa, Ngeli YA-YA/I-I, Ushairi, Kusoma kwa Mapana
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: 80% (12/15 correct per level)
    // ==============================================================

    // ---------- MODE 1: WASIFU NA USAWA ----------
    const wasifuData = [
        {t:"Nilizaliwa katika kijiji kinachoheshimu usawa wa kijinsia. Wasichana na wavulana hupewa nafasi sawa shuleni.", q:"Ni nini ujumbe mkuu wa wasifu huu?", o:["Usawa wa kijinsia","Safari ya mbali","Mchezo wa mpira","Kazi za shambani"], a:"Usawa wa kijinsia", h:"Angalia shule na nafasi sawa"},
        {t:"Nilijifunza kwamba kila mtoto ana haki sawa bila kujali jinsia.", q:"Ni nini kinahimizwa?", o:["Haki sawa","Ubaguzi","Uvivu","Vita"], a:"Haki sawa", h:"Angalia neno 'kila mtoto'"},
        {t:"Katika maisha yangu, nimeona wasichana wakiongoza mikutano ya shule.", q:"Ni nini kinatokea?", o:["Uongozi wa wasichana","Kucheza","Kulala","Kukimbia"], a:"Uongozi wa wasichana", h:"Angalia 'wakiongoza'"},
        {t:"Wavulana na wasichana hufanya kazi pamoja bila ubaguzi.", q:"Ni nini kinahimizwa?", o:["Ushirikiano","Ubaguzi","Uvivu","Hasira"], a:"Ushirikiano", h:"Angalia 'pamoja'"},
        {t:"Ninajivunia jamii yangu inayoheshimu usawa wa kijinsia.", q:"Ni nini kinathaminiwa?", o:["Usawa","Vita","Kucheza","Kulala"], a:"Usawa", h:"Angalia neno mwisho"}
    ];
    while(wasifuData.length<15) wasifuData.push(wasifuData[0]);
    const wasifuDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) wasifuDB[l].push(wasifuData[(i+l)%wasifuData.length]);

    // ---------- MODE 2: NGELI YA-YA na I-I ----------
    const sarufiData = [
        {q:"Umoja wa neno 'yaya' ni upi?", o:["yaya","mayaya","yayi","maye"], a:"yaya", h:"Angalia neno la msingi"},
        {q:"Wingi wa 'yaya' ni upi?", o:["mayaya","yaya","waya","yayi"], a:"mayaya", h:"Badilisha nomino"},
        {q:"Sentensi: 'Yaya analinda mtoto.' Wingi wake ni upi?", o:["Mayaya wanamlinda mtoto","Yaya analinda watoto","Mtoto analinda yaya","Yaya analinda mtoto"], a:"Mayaya wanamlinda mtoto", h:"Badilisha nomino na kitenzi"},
        {q:"Ngeli YA-YA ina mfano upi?", o:["yaya - mayaya","mtoto - watoto","kitabu - vitabu","nyumba - nyumba"], a:"yaya - mayaya", h:"Angalia kundi la maneno"},
        {q:"Sentensi: 'Nyuki anafanya kazi.' Wingi ni?", o:["Nyuki wanafanya kazi","Nyuki anafanya kazi","Nyuki wana kazi","Nyuki anafanya"], a:"Nyuki wanafanya kazi", h:"Ngeli I-I"}
    ];
    while(sarufiData.length<15) sarufiData.push(sarufiData[0]);
    const sarufiDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) sarufiDB[l].push(sarufiData[(i+l)%sarufiData.length]);

    // ---------- MODE 3: USHAIRI NA MATAMSHI ----------
    const ushairiData = [
        {p:"Wasichana na wavulana wote ni sawa,\nElimu ni haki ya kila mmoja.", q:"Ni nini ujumbe wa shairi hili?", o:["Usawa wa kijinsia","Vita","Safari","Mchezo"], a:"Usawa wa kijinsia", h:"Angalia neno 'sawa'"},
        {p:"Tushirikiane bila ubaguzi wowote,\nKila mtoto ana thamani sawa.", q:"Ni nini kinahimizwa?", o:["Ubaguzi","Umoja na usawa","Hasira","Uvivu"], a:"Umoja na usawa", h:"Angalia 'bila ubaguzi'"},
        {p:"Sauti ya msichana na mvulana ni muhimu,\nKila mmoja asikilizwe kwa heshima.", q:"Ni nini kinahitajika?", o:["Kusikilizwa","Kupiga kelele","Kukimbia","Kucheza"], a:"Kusikilizwa", h:"Angalia 'asikilizwe'"},
        {p:"Matamshi bora hujenga mawasiliano mazuri,\nTuzungumze kwa heshima kila wakati.", q:"Matokeo ya matamshi bora ni nini?", o:["Mawasiliano mazuri","Vita","Kelele","Kulala"], a:"Mawasiliano mazuri", h:"Angalia mstari wa kwanza"},
        {p:"Wasichana wanaweza kuwa viongozi bora,\nKama wavulana wanavyoweza pia.", q:"Ni nini kinahimizwa?", o:["Uongozi kwa wote","Ubaguzi","Kucheza","Kulala"], a:"Uongozi kwa wote", h:"Angalia 'pia'"}
    ];
    while(ushairiData.length<15) ushairiData.push(ushairiData[0]);
    const ushairiDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) ushairiDB[l].push(ushairiData[(i+l)%ushairiData.length]);

    // ---------- MODE 4: KUSOMA KWA MAPANA (USAWA) ----------
    const kusomaData = [
        {p:"Usawa wa kijinsia unahakikisha kwamba wasichana na wavulana wana nafasi sawa za kwenda shule.", q:"Kwa nini usawa wa kijinsia ni muhimu shuleni?", o:["kila mtoto anapata elimu bila kubaguliwa","wavulana pekee","wasichana pekee","walimu tu"], a:"kila mtoto anapata elimu bila kubaguliwa", h:"Wavulana na wasichana wote wanastahili kusoma."},
        {p:"Katika familia nyingi, wanawake wanafanya kazi za nyumbani na wanaume wanatafuta riziki. Hata hivyo, usawa unapendekeza kugawana majukumu.", q:"Usawa wa kijinsia unapendekeza nini kuhusu kazi za nyumbani?", o:["kuwasaidiana wanaume na wanawake","wanawake pekee","wanaume pekee","watoto pekee"], a:"kuwasaidiana wanaume na wanawake", h:"Wazazi na watoto wanaweza kufanya kazi pamoja."},
        {p:"Msichana anayesoma sayansi na mvulana anayejifunza ufundi ni mfano wa usawa wa kijinsia.", q:"Mfano huu unaonyesha nini?", o:["kukomesha ubaguzi wa kazi za kijinsia","wavulana pekee","wasichana pekee","walimu pekee"], a:"kukomesha ubaguzi wa kazi za kijinsia", h:"Kila mtu anaweza kuchagua taaluma yoyote."},
        {p:"Wavulana na wasichana wanapaswa kuheshimiana na kushirikiana kwa usawa.", q:"Mtazamo gani unasaidia usawa kijinsia darasani?", o:["kuheshimiana na kushirikiana","kugombana","kutengana","kucheza"], a:"kuheshimiana na kushirikiana", h:"Heshima na ushirikiano."},
        {p:"Tamaduni zingine zinaamini kwamba wanawake hawapasi kuchukua majukumu makubwa. Lakini usawa unapinga imani hiyo.", q:"Je, usawa wa kijinsia unasema nini kuhusu tamaduni zenye ubaguzi?", o:["inapaswa kubadilika kwa usawa wa haki","kuendelea","kuimarika","kukubaliwa"], a:"inapaswa kubadilika kwa usawa wa haki", h:"Kila utamaduni unaweza kuwa sawa."}
    ];
    while(kusomaData.length<15) kusomaData.push(kusomaData[0]);
    const kusomaDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) kusomaDB[l].push(kusomaData[(i+l)%kusomaData.length]);

    const modeBuilders = {
        wasifu: (lvl) => wasifuDB[lvl],
        sarufi: (lvl) => sarufiDB[lvl],
        ushairi: (lvl) => ushairiDB[lvl],
        kusoma: (lvl) => kusomaDB[lvl]
    };
    const modeNames = { wasifu:"Wasifu na Usawa wa Kijinsia", sarufi:"Sarufi - Ngeli YA-YA na I-I", ushairi:"Ushairi na Matamshi Bora", kusoma:"Kusoma kwa Mapana (Usawa)" };

    let currentMode = "wasifu";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = Math.ceil(totalQuestions * 0.8);
    let answeringLock = false;
    let levelFinished = false;
    let gameActive = true;

    const dynamicDiv = document.getElementById('dynamicContent');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const scoreSpan = document.getElementById('scoreValue');
    const qNumSpan = document.getElementById('currentQNumber');
    const totalQSpan = document.getElementById('totalQperLevel');
    const levelCompleteDiv = document.getElementById('levelCompleteMsg');
    totalQSpan.innerText = totalQuestions;

    function updateUI() {
        scoreSpan.innerText = levelScore;
        qNumSpan.innerText = currentQIndex+1;
    }

    function checkIfLevelComplete() {
        if(levelScore >= requiredCorrect) {
            if(currentLevel === 4) {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#ffb347;">🏆 HONGERA! Umemaliza ngazi zote! Bingwa wa Kiswahili! 🏆</div>`;
                gameActive = false;
            } else {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" id="nextLevelTrigger">🎉 HONGERA! Umepita NGEAZI ${currentLevel}! Bonyeza hapa kuendelea 🎉</div>`;
                const trigger = document.getElementById('nextLevelTrigger');
                if(trigger) trigger.onclick = () => {
                    currentLevel++;
                    currentQIndex = 0;
                    levelScore = 0;
                    levelFinished = false;
                    gameActive = true;
                    levelCompleteDiv.innerHTML = "";
                    loadLevelQuestions();
                    updateUI();
                    updateLevelButtons();
                    loadCurrentQuestion();
                };
            }
        } else {
            levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#c73d23;">😔 HUKUFAULU! ${levelScore}/${requiredCorrect} sahihi. Bonyeza hapa kujaribu tena.</div>`;
            const trigger = document.getElementById('nextLevelTrigger');
            if(trigger) trigger.onclick = () => { currentQIndex=0; levelScore=0; loadLevelQuestions(); loadCurrentQuestion(); updateUI(); levelCompleteDiv.innerHTML=""; };
        }
    }

    function handleAnswer(selectedValue) {
        if(answeringLock || !gameActive || levelFinished) return;
        answeringLock = true;
        const currentItem = levelQuestions[currentQIndex];
        const isCorrect = (selectedValue === currentItem.a);
        if(isCorrect) levelScore++;
        updateUI();
        if(currentQIndex + 1 >= totalQuestions) {
            levelFinished = true;
            checkIfLevelComplete();
        } else {
            currentQIndex++;
            loadCurrentQuestion();
        }
        answeringLock = false;
    }

    function loadCurrentQuestion() {
        if(!gameActive && levelFinished) return;
        const q = levelQuestions[currentQIndex];
        let html = `<div class="question-card">`;
        html += `<div class="topic-badge">${modeNames[currentMode]}</div>`;
        if(currentMode === 'wasifu') {
            html += `<div class="passage-text">📖 ${q.t}</div>`;
        } else if(currentMode === 'ushairi') {
            html += `<div class="poem-text">📜 ${q.p}</div>`;
        } else if(currentMode === 'kusoma') {
            html += `<div class="passage-text">📖 ${q.p}</div>`;
        } else if(currentMode === 'sarufi') {
            html += `<div class="sentence-display">📝 ${q.q}</div>`;
        }
        if(currentMode !== 'sarufi') html += `<div class="question-text">❓ ${q.q}</div>`;
        else html += `<div class="question-text" style="margin-top:10px;">❓ ${q.q}</div>`;
        html += `<div class="options-grid">`;
        (q.o || []).forEach((opt, idx) => {
            html += `<button class="option-btn" data-value="${opt}">${String.fromCharCode(65+idx)}. ${opt}</button>`;
        });
        html += `</div><div class="hint-box">💡 Dokezo: ${q.h}</div>`;
        html += `</div>`;
        dynamicDiv.innerHTML = html;
        updateUI();
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => handleAnswer(btn.getAttribute('data-value')));
        });
    }

    function loadLevelQuestions() {
        levelQuestions = modeBuilders[currentMode](currentLevel);
        requiredCorrect = Math.ceil(totalQuestions * 0.8);
        levelScore = 0;
        currentQIndex = 0;
        updateUI();
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn' + (i===currentLevel ? ' active' : '');
            btn.innerText = `Ngazi ${i}`;
            btn.onclick = () => {
                if(i === currentLevel) return;
                currentLevel = i;
                currentQIndex = 0;
                levelScore = 0;
                levelFinished = false;
                gameActive = true;
                levelCompleteDiv.innerHTML = "";
                loadLevelQuestions();
                loadCurrentQuestion();
                updateLevelButtons();
            };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchMode(mode) {
        if(mode === currentMode) return;
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        levelFinished = false;
        gameActive = true;
        levelCompleteDiv.innerHTML = "";
        loadLevelQuestions();
        updateLevelButtons();
        loadCurrentQuestion();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabWasifu').addEventListener('click', () => switchMode('wasifu'));
    document.getElementById('TabSarufiI').addEventListener('click', () => switchMode('sarufi'));
    document.getElementById('TabUshairi').addEventListener('click', () => switchMode('ushairi'));
    document.getElementById('TabKusoma').addEventListener('click', () => switchMode('kusoma'));

    loadLevelQuestions();
    updateLevelButtons();
    loadCurrentQuestion();
</script>
</body>
</html>
