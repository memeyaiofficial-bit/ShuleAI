<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>CBC Grade 7 Social Studies: Governance, Rights & Citizenship</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a2e2c 0%, #1e4a3a 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        /* Main container - fully responsive fluid width */
        .game-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: #fef7e8;
            background-image: radial-gradient(circle at 10% 30%, rgba(255,235,200,0.4) 2%, transparent 2.5%);
            background-size: 25px 25px;
            border-radius: 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,220,0.9);
            overflow: hidden;
        }

        /* Header - responsive padding */
        .game-header {
            background: #c0392b;
            padding: 18px 16px;
            border-bottom: 4px solid #8b2a1f;
            text-align: center;
        }

        .level-badge {
            background: #1e3c2c;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffe6a3;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            box-shadow: inset 0 -1px 0 #3a6b4a, 0 3px 6px rgba(0,0,0,0.2);
        }

        /* Stats row - responsive flex wrap */
        .stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 12px;
            gap: 10px;
        }

        .score-box, .timer-box, .progress-box {
            background: #2c2b26;
            padding: 8px 12px;
            border-radius: 40px;
            color: #ffefbf;
            font-weight: bold;
            font-size: 0.85rem;
            backdrop-filter: blur(2px);
            flex: 1;
            min-width: 90px;
            text-align: center;
            white-space: nowrap;
        }

        .timer-box {
            background: #b3413a;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 800;
        }

        /* Question area - responsive padding */
        .question-area {
            padding: 20px 18px 22px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e2a1c;
            line-height: 1.45;
            background: #fff9ef;
            padding: 18px 16px;
            border-radius: 32px;
            box-shadow: inset 0 0 0 2px #fff2df, 0 6px 10px rgba(0,0,0,0.06);
            margin-bottom: 16px;
            word-break: break-word;
        }

        /* Voice button - touch friendly */
        .voice-btn {
            background: #2c7a6e;
            border: none;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
            font-weight: bold;
            box-shadow: 0 4px 0 #1e554b;
            transition: 0.05s linear;
            width: 100%;
            max-width: 220px;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1e554b;
        }

        /* Options grid - responsive stacked */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 18px 0;
        }

        .option {
            background: #f2e5d2;
            border: 2px solid #cfbc9a;
            border-radius: 60px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2a241c;
            touch-action: manipulation;
            width: 100%;
        }

        .option-letter {
            background: #c0392b;
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .option span:last-child {
            flex: 1;
            text-align: left;
        }

        .option:active {
            background: #ffe2b5;
            transform: scale(0.98);
            border-color: #c0392b;
        }

        .option.disabled-true, .option.disabled-true:active {
            opacity: 0.6;
            pointer-events: none;
            background: #ddd0bd;
            transform: none;
        }

        /* Feedback messages */
        .correct-feedback, .wrong-feedback {
            padding: 12px 16px;
            border-radius: 40px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .correct-feedback {
            background: #2b7a3e;
            color: white;
        }

        .wrong-feedback {
            background: #c0392b;
            color: white;
        }

        /* Next button */
        .next-btn {
            background: #e67e22;
            border: none;
            width: 100%;
            padding: 14px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            margin-top: 18px;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 5px 0 #b45a2b;
            touch-action: manipulation;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b45a2b;
        }

        .feedback-message {
            margin-top: 14px;
        }

        .small-note {
            font-size: 0.7rem;
            text-align: center;
            padding: 10px 8px;
            background: #eeddbb;
            color: #5a3e28;
            border-radius: 30px;
            margin-top: 12px;
        }

        /* Intro Modal - fully responsive */
        .intro-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .intro-card {
            background: linear-gradient(145deg, #fff7e8, #ffefd6);
            max-width: 550px;
            width: 100%;
            padding: 24px 18px 32px;
            border-radius: 48px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            border: 2px solid #ffc857;
            animation: floatGlow 0.5s ease-out;
            margin: auto;
        }

        @keyframes floatGlow {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .intro-card h1 {
            font-size: 1.8rem;
            color: #c0392b;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #ffdd99;
            word-break: break-word;
        }

        .subject-badge {
            background: #2c6e4f;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffefb9;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 10px 0;
        }

        .intro-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #2e3b2c;
            background: #fff6ea;
            padding: 14px;
            border-radius: 32px;
            margin: 15px 0;
        }

        .highlight {
            background: #ffd966;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .topics-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .topic-chip {
            background: #ffb569;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #2d2b1f;
        }

        .enter-btn {
            background: #e67e22;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 60px;
            color: white;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a04000;
            transition: 0.05s linear;
            width: 85%;
            max-width: 280px;
        }

        .enter-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #a04000;
        }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #fff3e0;
            max-width: 360px;
            width: 90%;
            padding: 28px 20px;
            border-radius: 48px;
            text-align: center;
            box-shadow: 0 20px 35px black;
            border: 2px solid #ffcd7e;
        }

        .modal-card p {
            font-size: 0.95rem;
            margin: 12px 0;
            line-height: 1.5;
        }

        .modal-card button {
            background: #2c6e4f;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 60px;
            color: white;
            margin-top: 16px;
            cursor: pointer;
            width: 90%;
            font-weight: bold;
        }

        /* Timer warning animation */
        .timer-warning {
            animation: timerPulse 0.4s ease-in-out;
        }
        @keyframes timerPulse {
            0% { transform: scale(1); background-color: #b3413a; }
            50% { transform: scale(1.05); background-color: #e67e22; }
            100% { transform: scale(1); background-color: #b3413a; }
        }

        /* Tablet and mobile specific adjustments */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }
            
            .game-container {
                border-radius: 28px;
            }
            
            .game-header {
                padding: 14px 12px;
            }
            
            .stats {
                gap: 6px;
            }
            
            .score-box, .timer-box, .progress-box {
                padding: 5px 8px;
                font-size: 0.75rem;
                white-space: normal;
                word-break: keep-all;
            }
            
            .timer-box {
                font-size: 1rem;
            }
            
            .question-area {
                padding: 14px 14px 18px;
            }
            
            .question-text {
                font-size: 1rem;
                padding: 14px 12px;
                border-radius: 24px;
            }
            
            .voice-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
                max-width: 190px;
            }
            
            .option {
                padding: 12px 14px;
                gap: 10px;
            }
            
            .option-letter {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 1rem;
            }
            
            .option span:last-child {
                font-size: 0.88rem;
            }
            
            .next-btn {
                padding: 12px 12px;
                font-size: 1rem;
            }
            
            .small-note {
                font-size: 0.65rem;
            }
            
            .intro-card h1 {
                font-size: 1.5rem;
            }
            
            .intro-text {
                font-size: 0.85rem;
                padding: 12px;
            }
            
            .enter-btn {
                font-size: 1rem;
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .stats {
                flex-direction: column;
                gap: 6px;
            }
            
            .score-box, .timer-box, .progress-box {
                width: 100%;
                text-align: center;
            }
            
            .level-badge {
                font-size: 0.8rem;
            }
            
            .voice-btn {
                width: 100%;
                max-width: 100%;
            }
        }

        @media (min-width: 1200px) {
            .game-container {
                max-width: 950px;
            }
            
            .question-text {
                font-size: 1.35rem;
            }
            
            .option span:last-child {
                font-size: 1rem;
            }
        }

        /* Landscape orientation fix for mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 8px;
            }
            .game-container {
                max-height: 95vh;
                overflow-y: auto;
            }
            .question-area {
                padding: 10px 14px;
            }
            .options-grid {
                gap: 8px;
                max-height: 40vh;
                overflow-y: auto;
            }
            .option {
                padding: 8px 12px;
            }
        }

        button, .option, .next-btn, .enter-btn {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot" style="display: none;">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🏛️ LEVEL 1 / 5</div>
        <div class="stats">
            <div class="score-box">⭐ SCORE: <span id="scoreValue">0</span> / <span id="totalQInLevel">30</span></div>
            <div class="timer-box">⏱️ <span id="timerSeconds">15</span> s</div>
            <div class="progress-box">📊 PROGRESS: <span id="progressCount">0</span>/<span id="totalQCountSpan">30</span></div>
        </div>
    </div>
    <div class="question-area">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION</button>
        <div class="question-text" id="questionText">Loading challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <button class="next-btn" id="nextBtn">➡️ NEXT QUESTION</button>
        <div class="feedback-message" id="feedbackMsg"></div>
        <div class="small-note">⭐ 80% to pass (24/30) | 15 sec timer | Answers randomized</div>
    </div>
</div>

<script>
    // =============== CBC GRADE 7 SOCIAL STUDIES ===============
    // Topics: Political Development in Africa, Constitution of Kenya, Human Rights, African Diasporas, Citizenship
    
    function buildQuestionBank() {
        const bank = [];
        
        function addQ(text, optA, optB, optC, optD, correctText) {
            bank.push({
                text: text,
                originalOptions: [optA, optB, optC, optD],
                correctValue: correctText
            });
        }
        
        // Political Development in Africa
        addQ("Which African country was the first to gain independence from colonial rule?", "Ghana (1957)", "Kenya (1963)", "South Africa (1910)", "Nigeria (1960)", "Ghana (1957)");
        addQ("Who was the first President of Ghana and a leading Pan-Africanist?", "Kwame Nkrumah", "Jomo Kenyatta", "Julius Nyerere", "Haile Selassie", "Kwame Nkrumah");
        addQ("The Organisation of African Unity (OAU) was founded in which year?", "1963", "1957", "1975", "1990", "1963");
        addQ("Apartheid was a system of racial segregation enforced in which country?", "South Africa", "Kenya", "Zimbabwe", "Namibia", "South Africa");
        addQ("Who was the famous anti-apartheid leader who became South Africa's first black president?", "Nelson Mandela", "Desmond Tutu", "Steve Biko", "Thabo Mbeki", "Nelson Mandela");
        addQ("The Pan-African movement encouraged:", "Unity and solidarity among African people worldwide", "Colonial expansion", "Isolation of Africa", "Tribal conflicts", "Unity and solidarity among African people worldwide");
        addQ("Which Kenyan leader was the first President after independence?", "Jomo Kenyatta", "Daniel arap Moi", "Mwai Kibaki", "Uhuru Kenyatta", "Jomo Kenyatta");
        addQ("The African Union (AU) replaced the OAU in which year?", "2002", "1999", "2010", "1994", "2002");
        addQ("Which African leader promoted 'Ujamaa' (African socialism) in Tanzania?", "Julius Nyerere", "Jomo Kenyatta", "Kenneth Kaunda", "Samora Machel", "Julius Nyerere");
        addQ("The Mau Mau uprising in Kenya was mainly against:", "British colonial rule", "French rule", "German rule", "Italian rule", "British colonial rule");
        
        // Constitution of Kenya
        addQ("The current Constitution of Kenya was promulgated in which year?", "2010", "1963", "2005", "2017", "2010");
        addQ("The Constitution of Kenya is the:", "Supreme law of the land", "Secondary law", "Only for parliament", "Temporary document", "Supreme law of the land");
        addQ("Chapter Four of Kenya's Constitution deals with:", "The Bill of Rights", "The Executive", "The Legislature", "The Judiciary", "The Bill of Rights");
        addQ("The Kenyan Parliament consists of:", "National Assembly and Senate", "Only National Assembly", "Only Senate", "President and Cabinet", "National Assembly and Senate");
        addQ("The principle of 'devolution' in Kenya's Constitution means:", "Power shared between national and county governments", "One central government", "Abolishing counties", "Military rule", "Power shared between national and county governments");
        addQ("The Judicial arm of government is headed by:", "Chief Justice", "President", "Attorney General", "Speaker", "Chief Justice");
        addQ("The Constitution guarantees freedom of:", "Expression, assembly, and movement", "Only education", "Only health", "Only voting", "Expression, assembly, and movement");
        addQ("Who is the head of state and government in Kenya according to the Constitution?", "The President", "The Prime Minister", "The Chief Justice", "The Speaker", "The President");
        addQ("How many chapters does the Constitution of Kenya have?", "18", "10", "15", "20", "18");
        addQ("The Constitution can be amended by:", "Parliament with public participation", "President alone", "Military", "Judiciary alone", "Parliament with public participation");
        
        // Human Rights
        addQ("The Universal Declaration of Human Rights was adopted by the UN in:", "1948", "1945", "1950", "1960", "1948");
        addQ("Which right is considered a basic human right?", "Right to education", "Right to own a car", "Right to be famous", "Right to free internet", "Right to education");
        addQ("What is the right to life?", "Protection from arbitrary killing", "Right to have children", "Right to live anywhere", "Right to own property", "Protection from arbitrary killing");
        addQ("Which Kenyan body investigates human rights violations?", "Kenya National Commission on Human Rights (KNCHR)", "Police", "Parliament", "Judiciary", "Kenya National Commission on Human Rights (KNCHR)");
        addQ("Child labour violates which right?", "Right to protection and education", "Right to vote", "Right to marry", "Right to work", "Right to protection and education");
        addQ("Freedom from torture is a:", "Non-derogable right", "Privilege", "Economic right", "Cultural right", "Non-derogable right");
        addQ("Right to peaceful assembly means:", "People can gather and protest peacefully", "People must stay indoors", "Only police can meet", "No meetings allowed", "People can gather and protest peacefully");
        addQ("Who is responsible for protecting human rights?", "Government, citizens, and all institutions", "Only the president", "Only the police", "Only the courts", "Government, citizens, and all institutions");
        addQ("Human rights are:", "Universal, inalienable, and indivisible", "Only for adults", "Only for citizens", "Only for rich people", "Universal, inalienable, and indivisible");
        addQ("What does 'equality before the law' mean?", "Everyone is treated equally by the law", "Rich people get special treatment", "Only citizens have rights", "Only adults matter", "Everyone is treated equally by the law");
        
        // African Diasporas
        addQ("The African Diaspora refers to:", "People of African descent living outside Africa", "Africans living in Africa", "African tourists", "African politicians", "People of African descent living outside Africa");
        addQ("The transatlantic slave trade forcibly moved millions of Africans to:", "The Americas and Caribbean", "Asia", "Europe", "Australia", "The Americas and Caribbean");
        addQ("Which country has the largest population of African descent outside Africa?", "Brazil", "United States", "United Kingdom", "France", "Brazil");
        addQ("The term 'Maafa' refers to:", "The African Holocaust of slavery", "African independence", "African art", "African music", "The African Holocaust of slavery");
        addQ("Harlem Renaissance was a cultural movement by African Americans in which city?", "New York (Harlem)", "Chicago", "Atlanta", "Washington DC", "New York (Harlem)");
        addQ("Which famous leader was of African descent and fought for civil rights in the USA?", "Martin Luther King Jr.", "Nelson Mandela", "Kwame Nkrumah", "Jomo Kenyatta", "Martin Luther King Jr.");
        addQ("The African Union recognizes the African Diaspora as the:", "Sixth Region of Africa", "First Region", "Economic Zone", "Cultural Sector", "Sixth Region of Africa");
        addQ("Marcus Garvey promoted:", "Back-to-Africa movement and black pride", "Colonialism", "Segregation", "Abolition of African culture", "Back-to-Africa movement and black pride");
        addQ("The Great Migration refers to:", "Movement of African Americans from South to North USA", "African migration to Europe", "Slave trade", "Colonial expansion", "Movement of African Americans from South to North USA");
        addQ("Kwanzaa is a holiday celebrating:", "African-American heritage and culture", "Independence", "Christmas", "Harvest only", "African-American heritage and culture");
        
        // Citizenship
        addQ("A citizen is a person who:", "Has full rights and responsibilities in a country", "Lives in a country without documents", "Only pays taxes", "Only votes", "Has full rights and responsibilities in a country");
        addQ("In Kenya, citizenship by birth is granted to:", "Anyone born in Kenya with at least one Kenyan parent", "Anyone born anywhere", "Only foreigners", "Only the wealthy", "Anyone born in Kenya with at least one Kenyan parent");
        addQ("What is dual citizenship?", "Being a citizen of two countries", "Having two passports from same country", "Losing citizenship", "Temporary citizenship", "Being a citizen of two countries");
        addQ("Which of these is a responsibility of a Kenyan citizen?", "Paying taxes", "Ignoring laws", "Avoiding elections", "Refusing national service", "Paying taxes");
        addQ("The process of becoming a citizen of a country where you were not born is called:", "Naturalization", "Birthright", "Migration", "Assimilation", "Naturalization");
        addQ("Voting in national elections is both a right and a:", "Civic responsibility", "Optional activity", "Privilege for the rich", "Punishment", "Civic responsibility");
        addQ("Which document proves Kenyan citizenship?", "National ID card or passport", "Birth certificate only", "Driving license", "School ID", "National ID card or passport");
        addQ("Children born outside Kenya to Kenyan parents are:", "Kenyan citizens by birth", "Not citizens", "Only foreign citizens", "Stateless", "Kenyan citizens by birth");
        addQ("Good citizenship includes:", "Obeying laws, protecting environment, and helping community", "Breaking rules", "Ignoring others", "Littering", "Obeying laws, protecting environment, and helping community");
        addQ("A Kenyan citizen aged 18 years has the right to:", "Vote", "Drive", "Drink alcohol", "Be president", "Vote");
        
        // Fill to 150
        while(bank.length < 150) {
            addQ("Which value promotes good citizenship?", "Responsibility and patriotism", "Selfishness", "Corruption", "Laziness", "Responsibility and patriotism");
        }
        
        return bank.slice(0, 150);
    }
    
    const masterQuestions = buildQuestionBank();
    
    for (let i = masterQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [masterQuestions[i], masterQuestions[j]] = [masterQuestions[j], masterQuestions[i]];
    }
    
    const questionsPerLevel = [];
    for (let lvl = 0; lvl < 5; lvl++) {
        questionsPerLevel.push(masterQuestions.slice(lvl * 30, lvl * 30 + 30));
    }
    
    function getRandomizedQuestion(baseQ) {
        const options = [...baseQ.originalOptions];
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        const correctIndex = options.findIndex(opt => opt === baseQ.correctValue);
        return { text: baseQ.text, options: options, correctIndex: correctIndex };
    }
    
    let currentLevel = 0, currentQIndex = 0, score = 0;
    const requiredToPass = 24;
    let answered = false, waitingForNext = false, timerInterval = null, timeLeft = 15;
    let currentQuestionObj = null;
    
    const gameContainer = document.getElementById("gameRoot");
    const levelDisplay = document.getElementById("levelDisplay");
    const scoreSpan = document.getElementById("scoreValue");
    const totalQInLevelSpan = document.getElementById("totalQInLevel");
    const timerSecondsSpan = document.getElementById("timerSeconds");
    const progressCountSpan = document.getElementById("progressCount");
    const totalQCountSpan = document.getElementById("totalQCountSpan");
    const questionTextDiv = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const nextBtn = document.getElementById("nextBtn");
    const feedbackMsgDiv = document.getElementById("feedbackMsg");
    const speakBtn = document.getElementById("speakBtn");
    
    function speakText(msg, rate = 0.9) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = 'en-US';
            utterance.rate = rate;
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function speakQuestion() { if (currentQuestionObj) speakText(currentQuestionObj.text, 0.85); }
    function playCorrectVoice() { speakText("Excellent! That is correct!", 0.95); }
    function playWrongVoice() { speakText("Not quite right. Keep learning!", 0.95); }
    function playTimeUpVoice() { speakText("Time is up! Moving to next question.", 0.9); }
    
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    
    function startTimer() {
        if (timerInterval) stopTimer();
        timeLeft = 15;
        timerSecondsSpan.innerText = timeLeft;
        timerSecondsSpan.style.color = "#ffefbf";
        timerInterval = setInterval(() => {
            if (!waitingForNext && !answered) {
                if (timeLeft <= 1) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerSecondsSpan.innerText = "0";
                    if (!answered) handleTimeout();
                } else {
                    timeLeft--;
                    timerSecondsSpan.innerText = timeLeft;
                    if (timeLeft <= 3) {
                        timerSecondsSpan.style.color = "#ffaa66";
                        timerSecondsSpan.classList.add("timer-warning");
                        setTimeout(() => timerSecondsSpan.classList.remove("timer-warning"), 300);
                    } else {
                        timerSecondsSpan.style.color = "#ffefbf";
                    }
                }
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true; waitingForNext = true;
        document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled-true'));
        const correctAns = currentQuestionObj.options[currentQuestionObj.correctIndex];
        feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">⏰ TIME'S UP! Correct: ${correctAns}</div>`;
        playTimeUpVoice();
        stopTimer();
    }
    
    function loadQuestion() {
        answered = false; waitingForNext = false; stopTimer();
        const levelQs = questionsPerLevel[currentLevel];
        if (currentQIndex >= levelQs.length) { checkLevelCompletion(); return; }
        currentQuestionObj = getRandomizedQuestion(levelQs[currentQIndex]);
        questionTextDiv.innerText = currentQuestionObj.text;
        optionsContainer.innerHTML = "";
        const letters = ["A", "B", "C", "D"];
        currentQuestionObj.options.forEach((opt, idx) => {
            const optDiv = document.createElement("div");
            optDiv.className = "option";
            optDiv.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
            optDiv.addEventListener("click", () => { if (!answered && !waitingForNext) evaluateAnswer(idx); });
            optionsContainer.appendChild(optDiv);
        });
        feedbackMsgDiv.innerHTML = "";
        nextBtn.innerText = "➡️ NEXT QUESTION";
        updateUI();
        startTimer();
    }
    
    function evaluateAnswer(selectedIdx) {
        if (answered) return;
        answered = true; waitingForNext = true; stopTimer();
        const isCorrect = (selectedIdx === currentQuestionObj.correctIndex);
        if (isCorrect) { score++; feedbackMsgDiv.innerHTML = `<div class="correct-feedback">✅ CORRECT! +1</div>`; playCorrectVoice(); }
        else { feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">❌ WRONG! Correct: ${currentQuestionObj.options[currentQuestionObj.correctIndex]}</div>`; playWrongVoice(); }
        document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled-true'));
        scoreSpan.innerText = score;
    }
    
    function nextQuestion() {
        if (!waitingForNext && !answered) { feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">⚠️ Answer first!</div>`; return; }
        currentQIndex++;
        if (currentQIndex < questionsPerLevel[currentLevel].length) loadQuestion();
        else checkLevelCompletion();
    }
    
    function updateUI() {
        const total = questionsPerLevel[currentLevel].length;
        totalQInLevelSpan.innerText = total;
        totalQCountSpan.innerText = total;
        scoreSpan.innerText = score;
        progressCountSpan.innerText = currentQIndex;
        levelDisplay.innerText = `🏛️ LEVEL ${currentLevel+1}/5 | Need 80% (${requiredToPass}/30)`;
    }
    
    function checkLevelCompletion() {
        const percent = (score / 30) * 100;
        if (score >= requiredToPass) {
            if (currentLevel + 1 < 5) showModal(`✨ LEVEL ${currentLevel+1} COMPLETE!<br>Score: ${score}/30 (${Math.floor(percent)}%)<br>🔓 UNLOCKED LEVEL ${currentLevel+2}!`, true);
            else showModal(`🏆 AMAZING! You mastered all 5 levels!<br>Final: ${score}/30<br>YOU ARE A CHAMPION!`, false);
        } else {
            showModal(`❌ LEVEL FAILED<br>You got ${score}/30 (${Math.floor(percent)}%)<br>Need 80% (${requiredToPass} correct).<br>Restarting level...`, false);
        }
    }
    
    function showModal(msg, advance) {
        stopTimer(); waitingForNext = true;
        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = `<div class="modal-card"><p>${msg}</p><button id="modalBtn">${advance ? "🚀 NEXT LEVEL" : "🔄 TRY AGAIN"}</button></div>`;
        document.body.appendChild(modal);
        document.getElementById("modalBtn").addEventListener("click", () => {
            modal.remove();
            if (advance && currentLevel + 1 < 5) { currentLevel++; resetLevel(); }
            else if (!advance) resetLevel();
            else { currentLevel = 0; resetLevel(); }
        });
    }
    
    function resetLevel() { score = 0; currentQIndex = 0; answered = false; waitingForNext = false; stopTimer(); updateUI(); loadQuestion(); }
    
    speakBtn.addEventListener("click", speakQuestion);
    nextBtn.addEventListener("click", nextQuestion);
    
    function showIntro() {
        const introDiv = document.createElement("div");
        introDiv.className = "intro-modal";
        introDiv.innerHTML = `
            <div class="intro-card">
                <h1>📚 SOCIAL STUDIES</h1>
                <div class="subject-badge">⭐ GRADE 7: GOVERNANCE, RIGHTS & CITIZENSHIP</div>
                <div class="intro-text">
                    🧭 <strong>Welcome, Future Leader!</strong><br><br>
                    <span class="highlight">🏛️ Political Development in Africa</span><br>
                    <span class="highlight">📜 Constitution of Kenya</span><br>
                    <span class="highlight">⚖️ Human Rights</span><br>
                    <span class="highlight">🌍 African Diasporas</span><br>
                    <span class="highlight">🪪 Citizenship</span><br><br>
                    🔥 <strong>5 Levels · 30 Questions each</strong><br>
                    🎯 Need <strong>80% correct (24/30)</strong> to advance!<br>
                    🔊 Tap speaker to <strong>hear each question</strong><br>
                    ⏱️ <strong>15-second timer</strong><br>
                    🎲 <strong>Answers randomized</strong> — no fixed patterns!
                </div>
                <div class="topics-row">
                    <span class="topic-chip">🏛️ Political Dev</span>
                    <span class="topic-chip">📜 Constitution</span>
                    <span class="topic-chip">⚖️ Human Rights</span>
                    <span class="topic-chip">🌍 Diasporas</span>
                    <span class="topic-chip">🪪 Citizenship</span>
                </div>
                <button class="enter-btn" id="startGameBtn">🚀 START JOURNEY</button>
            </div>
        `;
        document.body.appendChild(introDiv);
        document.getElementById("startGameBtn").addEventListener("click", () => { introDiv.remove(); gameContainer.style.display = "block"; initGame(); });
    }
    
    function initGame() { currentLevel = 0; score = 0; currentQIndex = 0; answered = false; waitingForNext = false; stopTimer(); updateUI(); loadQuestion(); }
    
    showIntro();
</script>
</body>
</html>
