<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 3 | English | Festivals, Sports, Food & Diseases</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #C62828 0%, #E65100 30%, #F9A825 70%, #2E7D32 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #FFFDF5;
            border-radius: 60px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .stats-bar {
            background: #C62828;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 4px solid #8E0000;
        }

        .stat {
            background: #2E7D32;
            padding: 6px 14px;
            border-radius: 50px;
            color: #FFF9C4;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat span:first-child {
            color: #FFB74D;
            margin-right: 5px;
        }

        .level-badge {
            background: #F9A825;
            color: #8E0000;
        }

        .question-area {
            padding: 25px;
            text-align: center;
        }

        .question-text {
            background: #FFF3E0;
            padding: 25px 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #BF360C;
            box-shadow: inset 0 0 0 3px white, 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            word-break: break-word;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .voice-btn {
            background: #F9A825;
            border: none;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            color: #4A0072;
            box-shadow: 0 3px 0 #C47D0A;
            transition: 0.05s linear;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #C47D0A;
        }

        .answer-input {
            width: 85%;
            padding: 14px 20px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 50px;
            border: 3px solid #F9A825;
            background: white;
            font-weight: bold;
            outline: none;
        }

        .answer-input:focus {
            border-color: #C62828;
        }

        .hint-area {
            background: #FFF8E1;
            margin-top: 12px;
            padding: 10px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #E65100;
            font-weight: bold;
            min-height: 50px;
        }

        .timer-box {
            background: #8E0000;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .timer-clock {
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.5rem;
            color: #F9A825;
        }

        .submit-btn {
            background: #2E7D32;
            border: none;
            font-size: 1.2rem;
            padding: 12px 20px;
            width: 80%;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 4px 0 #1B5E20;
        }

        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1B5E20;
        }

        .feedback {
            font-size: 0.95rem;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 50px;
            margin: 10px 20px;
            background: #F0E6D2;
        }

        .next-level-info {
            background: linear-gradient(90deg, #F9A825, #FFB74D);
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            margin: 5px 20px 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #8E0000;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1rem; padding: 18px 12px; }
            .answer-input { font-size: 0.9rem; width: 90%; }
            .timer-clock { font-size: 1.2rem; }
            .stat { font-size: 0.7rem; padding: 4px 10px; }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat level-badge"><span>📚 LEVEL</span> <span id="levelNum">1</span></div>
        <div class="stat"><span>⭐ SCORE</span> <span id="scoreDisplay">0</span></div>
        <div class="stat"><span>📊 PROGRESS</span> <span id="qCounter">0</span>/<span id="totalQLevel">30</span></div>
        <div class="stat"><span>🎯 NEED</span> 80%</div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading your English adventure...</div>
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION</button>
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <div class="hint-area" id="hintMsg">🎧 Click the speaker to hear the question. Type your answer (1-3 words).</div>
    </div>
    <div class="timer-box">
        <span>⏳ TIME REMAINING</span>
        <span class="timer-clock" id="timerDisplay">40</span>
    </div>
    <button class="submit-btn" id="submitAnswer">✅ SUBMIT ANSWER</button>
    <div class="feedback" id="feedbackMsg">🌟 Answer 30 questions per level. Get 80% to advance!</div>
    <div id="levelInfoMsg" class="next-level-info">🎉 Festival | 🎮 Playtime & Sports | 🍎 Food We Eat | 🩺 Diseases | English</div>
</div>

<script>
    // ============================================================
    // CBC GRADE 3 - ENGLISH
    // Topics: Festival, Playtime & Sports, Food We Eat, Diseases
    // 5 Levels x 30 Questions | 40 Second Timer | Voice Output
    // ============================================================
    
    // ----- FESTIVAL QUESTIONS (10+ unique) -----
    const FESTIVAL_QUESTIONS = [
        { text: "What is the celebration of Jesus's birth called?", answer: "christmas" },
        { text: "What festival is celebrated with colored powders and water in India?", answer: "holi" },
        { text: "What is the festival of lights called?", answer: "diwali" },
        { text: "What do we celebrate on 12th December in Kenya?", answer: "jamhuri day" },
        { text: "What do we celebrate on 1st June in Kenya?", answer: "madaraka day" },
        { text: "What festival marks the end of Ramadan?", answer: "eid" },
        { text: "What do we call the celebration of a new year?", answer: "new year" },
        { text: "What do people dress up in during Halloween?", answer: "costumes" },
        { text: "What do children hunt for during Easter?", answer: "easter eggs" },
        { text: "What festival celebrates workers?", answer: "labour day" },
        { text: "What is the celebration of African unity called?", answer: "africa day" },
        { text: "What holiday is celebrated with turkey in America?", answer: "thanksgiving" }
    ];
    
    // ----- PLAYTIME & SPORTS QUESTIONS (12+ unique) -----
    const PLAY_SPORTS_QUESTIONS = [
        { text: "What sport uses a round ball and goals?", answer: "football" },
        { text: "What sport uses a bat and ball?", answer: "cricket" },
        { text: "What sport is played on a court with a net and a small ball?", answer: "tennis" },
        { text: "What sport involves running and jumping?", answer: "athletics" },
        { text: "What do children do on a swing?", answer: "play" },
        { text: "What game involves hiding and finding?", answer: "hide and seek" },
        { text: "What sport uses a hoop and a ball?", answer: "basketball" },
        { text: "What sport is played on ice with a puck?", answer: "hockey" },
        { text: "What activity involves skipping rope?", answer: "skipping" },
        { text: "What game uses a king and queen pieces?", answer: "draughts" },
        { text: "What sport uses a shuttlecock?", answer: "badminton" },
        { text: "What do you call running slowly for exercise?", answer: "jogging" },
        { text: "What game uses a board with 64 squares?", answer: "chess" },
        { text: "What sport uses a racquet and a ball against a wall?", answer: "squash" }
    ];
    
    // ----- FOOD WE EAT QUESTIONS (12+ unique) -----
    const FOOD_QUESTIONS = [
        { text: "What is the main food made from maize flour in Kenya?", answer: "ugali" },
        { text: "What is a common breakfast food made from grains?", answer: "porridge" },
        { text: "What is a yellow fruit that monkeys love?", answer: "banana" },
        { text: "What is a red fruit that is round and juicy?", answer: "tomato" },
        { text: "What do we call the meal eaten in the morning?", answer: "breakfast" },
        { text: "What is the main meal eaten in the middle of the day?", answer: "lunch" },
        { text: "What is the evening meal called?", answer: "dinner" },
        { text: "What vegetable is orange and good for eyes?", answer: "carrot" },
        { text: "What green vegetable looks like a small tree?", answer: "broccoli" },
        { text: "What drink is made from cows?", answer: "milk" },
        { text: "What do we call food made from wheat that we use for sandwiches?", answer: "bread" },
        { text: "What sweet food is made by bees?", answer: "honey" },
        { text: "What fruit is green on the outside and red inside with seeds?", answer: "watermelon" }
    ];
    
    // ----- DISEASES QUESTIONS (10+ unique) -----
    const DISEASE_QUESTIONS = [
        { text: "What is the disease that causes fever and cough and spreads easily?", answer: "flu" },
        { text: "What disease is caused by not having enough food?", answer: "malnutrition" },
        { text: "What disease is spread by mosquitoes?", answer: "malaria" },
        { text: "What do you have when your body temperature is high?", answer: "fever" },
        { text: "What do you call a pain in your head?", answer: "headache" },
        { text: "What do you call a pain in your stomach?", answer: "stomach ache" },
        { text: "What disease affects teeth from eating too much sugar?", answer: "cavities" },
        { text: "What should you wash to prevent diseases?", answer: "hands" },
        { text: "What vaccine helps prevent measles?", answer: "vaccine" },
        { text: "What do you call a person who treats sick people?", answer: "doctor" },
        { text: "What is the best way to avoid getting sick?", answer: "prevention" },
        { text: "What do you take when you are sick to get better?", answer: "medicine" },
        { text: "What disease causes you to cough and sneeze?", answer: "cold" }
    ];
    
    // Generate 30 unique questions for a specific level (covers all 4 topics)
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedTexts = new Set();
        
        function addQuestion(text, answer, topic) {
            if (usedTexts.has(text)) return false;
            usedTexts.add(text);
            questions.push({
                text: text,
                expected: answer,
                topic: topic,
                expectedLower: String(answer).trim().toLowerCase(),
                checkAnswer: function(userInput) {
                    let inputNorm = String(userInput).trim().toLowerCase().replace(/\s+/g, ' ');
                    return inputNorm === this.expectedLower;
                },
                getHint: function(seconds) {
                    if (seconds <= 8) return `💡 HINT: The answer is "${this.expected}"`;
                    if (seconds <= 18) return `⏰ Think about ${this.topic}!`;
                    return `✨ Type your answer. ${seconds} seconds left.`;
                }
            });
            return true;
        }
        
        // Add 8 Festival Questions (varied by level)
        for (let i = 0; i < 8; i++) {
            let idx = (level * 3 + i * 2) % FESTIVAL_QUESTIONS.length;
            let q = FESTIVAL_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Festival 🎉");
        }
        
        // Add 8 Playtime & Sports Questions (varied by level)
        for (let i = 0; i < 8; i++) {
            let idx = (level * 5 + i * 3) % PLAY_SPORTS_QUESTIONS.length;
            let q = PLAY_SPORTS_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Playtime & Sports 🎮");
        }
        
        // Add 7 Food Questions (varied by level)
        for (let i = 0; i < 7; i++) {
            let idx = (level * 7 + i * 4) % FOOD_QUESTIONS.length;
            let q = FOOD_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Food We Eat 🍎");
        }
        
        // Add 7 Disease Questions (varied by level)
        for (let i = 0; i < 7; i++) {
            let idx = (level * 2 + i * 5) % DISEASE_QUESTIONS.length;
            let q = DISEASE_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Diseases 🩺");
        }
        
        // Ensure we have exactly 30 (fill if needed from all sources)
        let allSources = [...FESTIVAL_QUESTIONS, ...PLAY_SPORTS_QUESTIONS, ...FOOD_QUESTIONS, ...DISEASE_QUESTIONS];
        let fillIndex = 0;
        while (questions.length < 30 && fillIndex < allSources.length) {
            let q = allSources[fillIndex];
            let topic = "English";
            if (fillIndex < FESTIVAL_QUESTIONS.length) topic = "Festival 🎉";
            else if (fillIndex < FESTIVAL_QUESTIONS.length + PLAY_SPORTS_QUESTIONS.length) topic = "Playtime & Sports 🎮";
            else if (fillIndex < FESTIVAL_QUESTIONS.length + PLAY_SPORTS_QUESTIONS.length + FOOD_QUESTIONS.length) topic = "Food We Eat 🍎";
            else topic = "Diseases 🩺";
            addQuestion(q.text, q.answer, topic);
            fillIndex++;
        }
        
        // Shuffle questions for variety
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        
        return questions;
    }
    
    // ========== GAME STATE ==========
    let currentLevel = 1;
    let currentQuestionsList = [];
    let currentQuestionIndex = 0;
    let currentLevelScore = 0;
    let timerInterval = null;
    let secondsRemaining = 40;
    let isTransitioning = false;
    let activeQuestion = null;
    let isTimeoutFlag = false;
    
    // DOM Elements
    const levelSpan = document.getElementById("levelNum");
    const scoreSpan = document.getElementById("scoreDisplay");
    const progressSpan = document.getElementById("qCounter");
    const totalSpan = document.getElementById("totalQLevel");
    const questionDiv = document.getElementById("questionText");
    const answerInput = document.getElementById("answerInput");
    const hintDiv = document.getElementById("hintMsg");
    const timerDisplay = document.getElementById("timerDisplay");
    const submitButton = document.getElementById("submitAnswer");
    const feedbackDiv = document.getElementById("feedbackMsg");
    const levelInfoDiv = document.getElementById("levelInfoMsg");
    const speakButton = document.getElementById("speakBtn");
    
    totalSpan.textContent = "30";
    
    // Speech Function
    const speechSynth = window.speechSynthesis;
    function speakMessage(message) {
        if (!message) return;
        try {
            if (speechSynth.speaking) speechSynth.cancel();
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = "en-US";
                utterance.rate = 0.9;
                speechSynth.speak(utterance);
            }, 50);
        } catch(e) {
            console.log("Speech error");
        }
    }
    
    // Timer Functions
    function stopGameTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function updateTimerView() {
        timerDisplay.textContent = secondsRemaining;
        if (secondsRemaining <= 8) timerDisplay.style.color = "#ff8888";
        else if (secondsRemaining <= 20) timerDisplay.style.color = "#ffaa44";
        else timerDisplay.style.color = "#F9A825";
    }
    
    function startGameTimer() {
        stopGameTimer();
        secondsRemaining = 40;
        updateTimerView();
        timerInterval = setInterval(() => {
            if (isTransitioning) return;
            if (secondsRemaining <= 1) {
                stopGameTimer();
                if (!isTransitioning) {
                    // Voice says "Time is up, moving to the next question" (NOT incorrect)
                    speakMessage("Time is up, moving to the next question");
                    isTransitioning = true;
                    isTimeoutFlag = true;
                    feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                    setTimeout(() => {
                        moveToNextQuestion(false);
                    }, 1500);
                }
            } else {
                secondsRemaining--;
                updateTimerView();
                if (activeQuestion && !isTransitioning) {
                    if (secondsRemaining <= 12) {
                        hintDiv.innerHTML = activeQuestion.getHint(secondsRemaining);
                    } else if (secondsRemaining <= 25) {
                        hintDiv.innerHTML = `⏰ ${secondsRemaining} sec left. Think about ${activeQuestion.topic}!`;
                    } else {
                        hintDiv.innerHTML = `✨ ${secondsRemaining} sec left. Click speaker to hear question.`;
                    }
                }
            }
        }, 1000);
    }
    
    function moveToNextQuestion(isAnswerCorrect) {
        stopGameTimer();
        
        if (isAnswerCorrect) {
            currentLevelScore++;
            scoreSpan.textContent = currentLevelScore;
            feedbackDiv.innerHTML = "✅ CORRECT! Great job! +1 point";
            speakMessage("Correct answer! Well done.");
        } else if (!isTimeoutFlag) {
            let correctAns = activeQuestion ? activeQuestion.expected : "?";
            feedbackDiv.innerHTML = `❌ INCORRECT! The correct answer is: ${correctAns}`;
            speakMessage(`Wrong answer. The correct answer is ${correctAns}.`);
        } else {
            // Timeout case - already spoke "Time is up"
            feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
        }
        
        isTimeoutFlag = false;
        currentQuestionIndex++;
        progressSpan.textContent = currentQuestionIndex;
        
        // Check if level is complete (30 questions)
        if (currentQuestionIndex >= 30) {
            let percentage = (currentLevelScore / 30) * 100;
            if (percentage >= 80) {
                if (currentLevel < 5) {
                    levelInfoDiv.innerHTML = `🎉 LEVEL ${currentLevel} PASSED! ${Math.floor(percentage)}% → Moving to LEVEL ${currentLevel + 1}`;
                    speakMessage(`Congratulations! You passed level ${currentLevel}. Moving to next level.`);
                    currentLevel++;
                    currentQuestionIndex = 0;
                    currentLevelScore = 0;
                    isTransitioning = false;
                    initializeLevel(currentLevel);
                } else {
                    feedbackDiv.innerHTML = "🏆🏆🏆 AMAZING! You completed ALL 5 LEVELS! YOU ARE AN ENGLISH STAR! 🏆🏆🏆";
                    levelInfoDiv.innerHTML = "🎉🎮🍎🩺 GAME COMPLETE! Refresh to play again. Keep learning English! 🎉🎮🍎🩺";
                    speakMessage("Congratulations! You completed all five levels. You are an English star!");
                    submitButton.disabled = true;
                    answerInput.disabled = true;
                    return;
                }
            } else {
                levelInfoDiv.innerHTML = `❌ LEVEL ${currentLevel} FAILED! ${Math.floor(percentage)}% (Need 80%). Restarting level... Keep learning!`;
                speakMessage(`You scored ${Math.floor(percentage)} percent. Need 80 to pass. Restarting level ${currentLevel}.`);
                currentQuestionIndex = 0;
                currentLevelScore = 0;
                isTransitioning = false;
                initializeLevel(currentLevel);
            }
            return;
        }
        
        isTransitioning = false;
        loadCurrentQuestion();
    }
    
    function loadCurrentQuestion() {
        activeQuestion = currentQuestionsList[currentQuestionIndex];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        answerInput.disabled = false;
        submitButton.disabled = false;
        feedbackDiv.innerHTML = "⏳ Type your answer & click SUBMIT. Timer: 40 seconds.";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        scoreSpan.textContent = currentLevelScore;
        levelSpan.textContent = currentLevel;
        progressSpan.textContent = currentQuestionIndex;
        isTransitioning = false;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    function handleAnswerSubmit() {
        if (isTransitioning) {
            feedbackDiv.innerHTML = "⏳ Please wait...";
            return;
        }
        if (!activeQuestion) return;
        
        let userAnswer = answerInput.value.trim();
        if (userAnswer === "") {
            feedbackDiv.innerHTML = "📝 Please type an answer!";
            speakMessage("Type your answer first.");
            return;
        }
        
        stopGameTimer();
        let isCorrect = activeQuestion.checkAnswer(userAnswer);
        isTransitioning = true;
        isTimeoutFlag = false;
        moveToNextQuestion(isCorrect);
    }
    
    function speakActiveQuestion() {
        if (!activeQuestion || isTransitioning) {
            speakMessage("Please wait, the next question is loading.");
            return;
        }
        speakMessage(activeQuestion.text);
    }
    
    function initializeLevel(level) {
        currentLevel = level;
        currentQuestionsList = generateQuestionsForLevel(level);
        currentQuestionIndex = 0;
        currentLevelScore = 0;
        isTransitioning = false;
        isTimeoutFlag = false;
        
        levelSpan.textContent = level;
        scoreSpan.textContent = "0";
        progressSpan.textContent = "0";
        totalSpan.textContent = "30";
        feedbackDiv.innerHTML = `📚 LEVEL ${level} START! Answer 30 questions, need 80% to advance. 🎉🎮🍎🩺`;
        levelInfoDiv.innerHTML = `🎉 Festival | 🎮 Playtime & Sports | 🍎 Food We Eat | 🩺 Diseases | Level ${level} of 5 | You can do it!`;
        
        submitButton.disabled = false;
        answerInput.disabled = false;
        
        // Load first question
        activeQuestion = currentQuestionsList[0];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    // Event Listeners
    submitButton.addEventListener("click", handleAnswerSubmit);
    speakButton.addEventListener("click", speakActiveQuestion);
    answerInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter" && !isTransitioning && activeQuestion) {
            handleAnswerSubmit();
        }
    });
    
    // Start the game
    initializeLevel(1);
</script>
</body>
</html>
