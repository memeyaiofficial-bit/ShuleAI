<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Healthy Family - Grade 1 CBC | Family Needs, Food Groups & Healthy Body</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #e67e22 0%, #d35400 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #c0392b;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🏠🥗💪 Bobo's Healthy Family! Learn about Family Needs, Food Groups & Healthy Body.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct word. Click speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Family Needs, Groups of Food, Food for Healthy Body ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // FAMILY NEEDS (shelter, clothing, love, care, water, education, safety)
        const familyNeeds = [
            { q: "Every family needs a ______ to live in.", a: "house" },
            { q: "We need clean ______ to drink every day.", a: "water" },
            { q: "We wear ______ to protect our bodies.", a: "clothes" },
            { q: "Family members give each other ______ and care.", a: "love" },
            { q: "Children need to go to ______ to learn.", a: "school" },
            { q: "A family needs ______ to buy food and clothes.", a: "money" },
            { q: "We need ______ to keep our bodies strong and healthy.", a: "food" },
            { q: "A safe place to sleep is called a ______.", a: "bed" },
            { q: "Families need ______ to stay healthy when sick.", a: "medicine" },
            { q: "Feeling safe and protected is a family ______.", a: "need" }
        ];
        
        // GROUPS OF FOOD (fruits, vegetables, grains, proteins, dairy)
        const foodGroups = [
            { q: "Apples, bananas and oranges belong to the ______ group.", a: "fruits" },
            { q: "Carrots, spinach and broccoli are ______.", a: "vegetables" },
            { q: "Bread, rice and maize meal are ______.", a: "grains" },
            { q: "Beans, eggs, fish and meat give us ______.", a: "protein" },
            { q: "Milk, cheese and yogurt are ______ products.", a: "dairy" },
            { q: "Oranges and lemons are rich in vitamin ______.", a: "c" },
            { q: "Sweet potatoes and cassava are types of ______.", a: "tubers" },
            { q: "Maize and wheat are used to make ______.", a: "flour" },
            { q: "Groundnuts and peas belong to the ______ group.", a: "legumes" },
            { q: "A balanced meal has foods from all ______ groups.", a: "food" }
        ];
        
        // FOOD FOR A HEALTHY BODY (nutrients, benefits, healthy eating)
        const healthyFood = [
            { q: "Eating healthy food gives you ______ to play and learn.", a: "energy" },
            { q: "Milk and yogurt make your ______ strong.", a: "bones" },
            { q: "Fruits and vegetables help you fight ______.", a: "sickness" },
            { q: "Drinking water keeps your body ______.", a: "hydrated" },
            { q: "You should eat ______ meals every day.", a: "three" },
            { q: "A healthy breakfast gives you a good ______ to the day.", a: "start" },
            { q: "Junk food has too much sugar and ______.", a: "fat" },
            { q: "Your body needs ______ to grow big and strong.", a: "vitamins" },
            { q: "Eating too many sweets can hurt your ______.", a: "teeth" },
            { q: "A person who eats well stays ______.", a: "healthy" }
        ];
        
        // Combine all topics
        const allTopics = [...familyNeeds, ...foodGroups, ...healthyFood];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 3) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Add narrative variety based on level
            if (level >= 2 && i % 6 === 0) {
                qText = "Bobo's family needs a place to sleep. They need a comfortable ______.";
                correctAnswer = "bed";
            }
            if (level >= 3 && i % 7 === 0) {
                qText = "To grow strong, Bobo eats foods from the ______ group like beans and eggs.";
                correctAnswer = "protein";
            }
            if (level >= 4 && i % 8 === 0) {
                qText = "Every morning, Bobo's mom gives him milk. Milk makes his ______ strong.";
                correctAnswer = "bones";
            }
            if (i % 10 === 0) {
                qText = "A healthy body needs food, water, and ______.";
                correctAnswer = "exercise";
            }
            if (i % 12 === 0) {
                qText = "Fruits like mangoes and pineapples give the body ______ to fight sickness.";
                correctAnswer = "vitamins";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: What does a family need? Learn about basic needs!";
        else if (currentLevel === 2) levelDesc = "Level 2: Discover different food groups - fruits, veggies, grains, protein, dairy!";
        else if (currentLevel === 3) levelDesc = "Level 3: Bobo needs your help! Which foods give energy and make you strong?";
        else if (currentLevel === 4) levelDesc = "Level 4: Almost an expert! Learn about healthy eating for a strong body.";
        else levelDesc = "Level 5: Final challenge! Become a Grade 1 Champion of Family Needs & Healthy Food!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you a Healthy Family Champion Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of Family Needs, Food Groups, and Healthy Body! Keep eating well and caring for your family!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo's family is proud of you! You know about family needs, food groups, and healthy eating! 🏠🥗💪";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about family needs and healthy food!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to proceed. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Kid-friendly forgiving variations
        if (!isCorrect) {
            const forgiving = {
                "house": ["home", "shelter"],
                "water": ["clean water", "drinking water"],
                "clothes": ["clothing", "dress", "shirt"],
                "love": ["affection", "care"],
                "school": ["education", "learning"],
                "money": ["cash", "coins"],
                "food": ["meal", "eat"],
                "bed": ["mattress", "sleeping place"],
                "medicine": ["drugs", "treatment"],
                "need": ["necessity", "requirement"],
                "fruits": ["fruit", "apple", "banana"],
                "vegetables": ["veggies", "greens"],
                "grains": ["cereals", "rice", "wheat"],
                "protein": ["proteins", "meat", "beans"],
                "dairy": ["milk", "cheese", "yogurt"],
                "c": ["vitamin c"],
                "flour": ["meal", "powder"],
                "energy": ["strength", "power"],
                "bones": ["bone", "skeleton"],
                "sickness": ["disease", "illness"],
                "hydrated": ["watered", "moist"],
                "three": ["3"],
                "start": ["beginning"],
                "fat": ["oil", "grease"],
                "vitamins": ["vitamin", "nutrients"],
                "teeth": ["tooth"],
                "healthy": ["fit", "strong", "well"],
                "exercise": ["play", "sports", "running"],
                "tubers": ["root vegetables", "potatoes"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // accept plural/singular flexibility
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The right answer is: "${currentQ.answer}". Keep learning about family and food! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Healthy Family game! Learn about what families need, the different groups of food, and how to eat for a healthy body. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's keep our families healthy and strong!");
        }, 500);
    });
</script>
</body>
</html>
