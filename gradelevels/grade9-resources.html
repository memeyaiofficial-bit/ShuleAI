<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎓 Grade 9 Star Scholar | CBC High School Quiz</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0f2b3d 0%, #1a4a6f 50%, #2c6e9e 100%);
    font-family: 'Segoe UI', 'Poppins', 'Nunito', sans-serif;
    min-height: 100vh;
    padding: 16px;
}

.game-container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.96);
    border-radius: 48px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    overflow: hidden;
    border: 3px solid #ffd700;
}

.header {
    background: linear-gradient(135deg, #c2410c, #f97316);
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #fff;
}

.header h1 {
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 2px 2px 0 #9a3412;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.header p {
    color: #fff3e0;
    font-size: 0.9rem;
    margin-top: 8px;
}

.subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    padding: 20px;
    background: #f0f4ff;
}

.subject-card {
    background: white;
    border-radius: 28px;
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border: 2px solid transparent;
}

.subject-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
}

.subject-card.selected {
    border-color: #f97316;
    background: #fff7ed;
}

.subject-emoji {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 8px;
}

.subject-name {
    font-weight: bold;
    font-size: 0.9rem;
    color: #333;
}

.play-area {
    padding: 20px;
    background: white;
}

.question-box {
    background: linear-gradient(135deg, #f8f9ff, #eef2ff);
    border-radius: 32px;
    padding: 24px;
    margin-bottom: 20px;
    border: 2px solid #c7d2fe;
}

.subject-badge {
    display: inline-block;
    background: #f97316;
    color: white;
    padding: 5px 15px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: bold;
    margin-bottom: 15px;
}

.question-text {
    font-size: 1.3rem;
    font-weight: 600;
    color: #1e3a72;
    line-height: 1.4;
    margin-bottom: 20px;
}

.answer-input {
    width: 100%;
    padding: 15px;
    font-size: 1.1rem;
    border: 3px solid #c7d2fe;
    border-radius: 60px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
    text-align: center;
}

.answer-input:focus {
    border-color: #f97316;
    box-shadow: 0 0 0 3px rgba(249,115,22,0.3);
}

.answer-input.correct {
    border-color: #22c55e;
    background: #f0fdf4;
}

.answer-input.incorrect {
    border-color: #ef4444;
    background: #fef2f2;
}

.btn {
    background: linear-gradient(135deg, #f97316, #fdba74);
    border: none;
    padding: 14px 28px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 60px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    margin-top: 12px;
    width: 100%;
    color: white;
    text-shadow: 0 1px 0 #9a3412;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(249,115,22,0.4);
}

.btn:active {
    transform: translateY(1px);
}

.feedback {
    padding: 12px;
    margin-top: 15px;
    border-radius: 30px;
    text-align: center;
    font-weight: bold;
    display: none;
}

.feedback.correct {
    background: #dcfce7;
    color: #166534;
    display: block;
    border-left: 6px solid #22c55e;
}

.feedback.wrong {
    background: #fee2e2;
    color: #991b1b;
    display: block;
    border-left: 6px solid #ef4444;
}

.stats-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #f0f4ff;
    border-bottom: 2px solid #e2e8f0;
    flex-wrap: wrap;
    gap: 10px;
}

.score-box, .question-counter, .streak-box {
    background: white;
    padding: 6px 16px;
    border-radius: 40px;
    font-weight: bold;
    font-size: 0.85rem;
    color: #1e3a72;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.score-box span, .question-counter span, .streak-box span {
    font-size: 1.2rem;
    font-weight: 800;
    margin-left: 5px;
    color: #f97316;
}

.progress-bar {
    height: 6px;
    background: #e2e8f0;
    margin: 0 20px 10px;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f97316, #fdba74);
    width: 0%;
    transition: width 0.3s;
}

.result-screen {
    padding: 30px 20px;
    text-align: center;
}

.result-trophy {
    font-size: 5rem;
    margin-bottom: 15px;
}

.result-score {
    font-size: 2.5rem;
    font-weight: 800;
    color: #f97316;
    margin: 15px 0;
}

.result-message {
    font-size: 1.1rem;
    color: #4a5568;
    margin-bottom: 20px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.badge {
    background: #fef3c7;
    padding: 6px 15px;
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: bold;
    color: #d97706;
}

.btn-home {
    background: linear-gradient(135deg, #64748b, #475569);
}

.hint-text {
    font-size: 0.8rem;
    color: #6c757d;
    margin-top: 8px;
    text-align: center;
}

@media (max-width: 550px) {
    .subject-grid { gap: 8px; padding: 15px; }
    .subject-card { padding: 12px 4px; }
    .subject-emoji { font-size: 1.8rem; }
    .subject-name { font-size: 0.7rem; }
    .question-text { font-size: 1rem; }
    .answer-input { padding: 12px; font-size: 1rem; }
    .btn { padding: 12px 20px; }
}
</style>
</head>

<div class="game-container" id="app">

        <div class="streak-box">🔥 STREAK: <span id="streakDisplay">0</span></div>
    </div>

    <div class="progress-bar" id="progressBar" style="display: none;">

    </div>

    <div class="play-area" id="playArea">
        <div class="question-box" id="questionBox">

    <div id="resultScreen" style="display: none;" class="result-screen"></div>
</div>

            { q: "What is the name of Kenya's national animal?", a: "lion", hint: "King of the jungle" },
            { q: "Which lake is known for flamingos in Kenya?", a: "lake nakuru", hint: "Soda lake" },

            { q: "Which country borders Kenya to the north?", a: "ethiopia", hint: "Horn of Africa" }
        ],
        cre: [
            { q: "Who led the Israelites out of Egypt?", a: "moses", hint: "Parted the Red Sea" },
            { q: "What are the first five books of the Bible called?", a: "torah", hint: "Pentateuch" },

            { q: "What is the shortest verse in the Bible?", a: "jesus wept", hint: "John 11:35" },
            { q: "Who was swallowed by a great fish?", a: "jonah", hint: "Prophet" },
            { q: "What are the Beatitudes?", a: "blessings", hint: "Sermon on the Mount" },
            { q: "Who was the mother of Jesus?", a: "mary", hint: "Virgin" },
            { q: "What day is known as the resurrection day?", a: "easter", hint: "Jesus rose from the dead" },
            { q: "Who built the ark?", a: "noah", hint: "Flood" },
            { q: "What is the first book of the New Testament?", a: "matthew", hint: "Gospel" },
            { q: "Who was the disciple who denied Jesus three times?", a: "peter", hint: "Rock" },
            { q: "What is the fruit of the Spirit?", a: "love joy peace", hint: "Galatians 5:22-23" },
            { q: "Who was the strongest man in the Bible?", a: "samson", hint: "Lost his strength through his hair" },
            { q: "What is the day of Pentecost?", a: "holy spirit came", hint: "50 days after Easter" },
            { q: "Who wrote the book of Revelation?", a: "john", hint: "On Patmos" },
            { q: "What is the name of the first man?", a: "adam", hint: "Created by God" },
            { q: "What is the name of the first woman?", a: "eve", hint: "Mother of all living" },
            { q: "Who was thrown into the lions' den?", a: "daniel", hint: "Prayed faithfully" },
            { q: "What is the city where Jesus was born?", a: "bethlehem", hint: "House of bread" },
            { q: "Who baptized Jesus?", a: "john the baptist", hint: "In the Jordan River" },
            { q: "What is the Lord's Prayer?", a: "our father", hint: "Prayer Jesus taught" },
            { q: "How many disciples did Jesus have?", a: "12", hint: "Apostles" },
            { q: "What is the symbol of the Holy Spirit?", a: "dove", hint: "At Jesus' baptism" },

            { q: "What is the last book of the Bible?", a: "revelation", hint: "Apocalypse" }
        ],
        arts: [
            { q: "What are the three primary colors?", a: "red yellow blue", hint: "Cannot be mixed" },
            { q: "What is the technique of painting on wet plaster called?", a: "fresco", hint: "Italian" },
            { q: "Who painted the Mona Lisa?", a: "leonardo da vinci", hint: "Italian Renaissance" },
            { q: "What is a still life painting?", a: "inanimate objects", hint: "Fruit, flowers, vases" },
            { q: "What is the element of art that describes surface quality?", a: "texture", hint: "Rough or smooth" },
            { q: "What is the color scheme using one color?", a: "monochromatic", hint: "One hue" },
            { q: "What is the opposite of a portrait?", a: "landscape", hint: "Scenery" },
            { q: "What is a sculpture that stands alone called?", a: "freestanding", hint: "Not attached" },
            { q: "What is the most famous painting in the world?", a: "mona lisa", hint: "Louvre Museum" },
            { q: "What is the art of beautiful handwriting called?", a: "calligraphy", hint: "Decorative writing" },
            { q: "What are warm colors?", a: "red orange yellow", hint: "Fire colors" },
            { q: "What is the principle of art that creates a focal point?", a: "emphasis", hint: "Center of interest" },
            { q: "What is a self-portrait?", a: "painting of oneself", hint: "Artist's own face" },
            { q: "What is the art of arranging type?", a: "typography", hint: "Fonts and letters" },
            { q: "What are cool colors?", a: "blue green purple", hint: "Water colors" },
            { q: "What is a mural?", a: "wall painting", hint: "Large artwork" },
            { q: "What is the term for a rough draft in drawing?", a: "sketch", hint: "Quick drawing" },
            { q: "What is a collage?", a: "pasted paper art", hint: "Mixed media" },
            { q: "Who painted The Starry Night?", a: "van gogh", hint: "Dutch painter" },
            { q: "What is the element of art related to light and dark?", a: "value", hint: "Shading" },
            { q: "What is a printmaking technique?", a: "linocut", hint: "Carving" },
            { q: "What is an easel used for?", a: "holding canvas", hint: "Painting stand" },
            { q: "What is the art of pottery called?", a: "ceramics", hint: "Clay" },
            { q: "What is a palette used for?", a: "mixing paints", hint: "Artist's tool" },
            { q: "What is a vanishing point in perspective?", a: "where lines converge", hint: "Depth illusion" },
            { q: "What is the term for a three-dimensional artwork?", a: "sculpture", hint: "Carved or molded" },
            { q: "Who painted the Sistine Chapel ceiling?", a: "michelangelo", hint: "Italian sculptor" },
            { q: "What is the art of folding paper called?", a: "origami", hint: "Japanese" },
            { q: "What is a comic strip?", a: "sequential art", hint: "Cartoon panels" },
            { q: "What is a kiln used for?", a: "firing pottery", hint: "High heat oven" }
        ]
    };

    // Game State
    let subjects = ["maths", "english", "kiswahili", "science", "social", "cre", "arts"];
    let subjectNames = {
        maths: "Mathematics", english: "English", kiswahili: "Kiswahili",
        science: "Science", social: "Social Studies", cre: "C.R.E.", arts: "Creative Arts"
    };
    let subjectIcons = {
        maths: "📐", english: "📚", kiswahili: "🗣️", science: "🔬",
        social: "🌍", cre: "⛪", arts: "🎨"
    };

    let currentSubject = null;
    let currentIndex = 0;
    let score = 0;
    let streak = 0;
    let questionsList = [];
    let totalQuestions = 30;
    let gameActive = false;
    let answered = false;
    let subjectProgress = {};

    // Load saved progress
    try {
        let saved = localStorage.getItem("grade9_star_learner");
        if(saved) subjectProgress = JSON.parse(saved);
    } catch(e) {}

    function saveProgress() {
        localStorage.setItem("grade9_star_learner", JSON.stringify(subjectProgress));
    }

    function renderSubjects() {
        let grid = document.getElementById("subjectGrid");
        grid.innerHTML = "";
        subjects.forEach(sub => {
            let prog = subjectProgress[sub] || { completed: false, score: 0, total: 30 };
            let card = document.createElement("div");
            card.className = "subject-card";
            if(sub === currentSubject) card.classList.add("selected");
            card.innerHTML = `
                <span class="subject-emoji">${subjectIcons[sub]}</span>
                <span class="subject-name">${subjectNames[sub]}</span>
                <div style="font-size:0.7rem; margin-top:5px; color:#888;">${prog.completed ? "✅ " + Math.round((prog.score/prog.total)*100)+"%" : "⭐ " + (prog.score||0) + "/" + prog.total}</div>
            `;
            card.onclick = () => selectSubject(sub);
            grid.appendChild(card);
        });
    }

    function selectSubject(sub) {
        if(gameActive && currentSubject === sub) return;
        currentSubject = sub;
        currentIndex = 0;
        score = subjectProgress[sub]?.score || 0;
        streak = 0;
        questionsList = [...QUESTIONS[sub]];
        totalQuestions = questionsList.length;
        gameActive = true;
        answered = false;
        document.getElementById("statsBar").style.display = "flex";
        document.getElementById("progressBar").style.display = "block";
        document.getElementById("answerInput").disabled = false;
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("resultScreen").style.display = "none";
        document.getElementById("playArea").style.display = "block";
        document.getElementById("qTotalDisplay").innerText = totalQuestions;
        
        document.getElementById("submitBtn").innerHTML = "✨ Check Answer ✨";
        document.getElementById("submitBtn").onclick = checkAnswer;
        
        loadQuestion();
        renderSubjects();
    }

    function loadQuestion() {
        if(currentIndex >= totalQuestions) {
            finishSubject();
            return;
        }
        answered = false;
        let q = questionsList[currentIndex];
        document.getElementById("subjectBadge").innerHTML = `${subjectIcons[currentSubject]} ${subjectNames[currentSubject]}`;
        document.getElementById("questionText").innerHTML = q.q;
        document.getElementById("hintText").innerHTML = `💡 Hint: ${q.hint}`;
        document.getElementById("answerInput").value = "";
        document.getElementById("answerInput").classList.remove("correct", "incorrect");
        document.getElementById("feedback").className = "feedback";
        document.getElementById("feedback").innerHTML = "";
        document.getElementById("feedback").style.display = "none";
        document.getElementById("submitBtn").innerHTML = "✨ Check Answer ✨";
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("scoreDisplay").innerText = score;
        document.getElementById("qNumDisplay").innerText = currentIndex + 1;
        document.getElementById("streakDisplay").innerText = streak;
        let progressPercent = (currentIndex / totalQuestions) * 100;
        document.getElementById("progressFill").style.width = progressPercent + "%";
        document.getElementById("answerInput").focus();
    }

    function normalizeAnswer(str) {
        return str.trim().toLowerCase().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ').trim();
    }

    function checkAnswer() {
        if(answered) return;
        let userAnswer = document.getElementById("answerInput").value;
        if(!userAnswer.trim()) {
            document.getElementById("feedback").innerHTML = "⚠️ Please type your answer!";
            document.getElementById("feedback").className = "feedback wrong";
            document.getElementById("feedback").style.display = "block";
            return;
        }
        let normalizedUser = normalizeAnswer(userAnswer);
        let correctAns = questionsList[currentIndex].a;
        let normalizedCorrect = normalizeAnswer(correctAns);
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        answered = true;
        
        if(isCorrect) {
            score += 10;
            streak++;
            document.getElementById("answerInput").classList.add("correct");
            document.getElementById("feedback").innerHTML = "✅ CORRECT! +10 points! 🎉";
            document.getElementById("feedback").className = "feedback correct";
            document.getElementById("feedback").style.display = "block";
        } else {
            streak = 0;
            document.getElementById("answerInput").classList.add("incorrect");
            document.getElementById("feedback").innerHTML = `❌ INCORRECT! The correct answer is: "${correctAns}". Keep learning!`;
            document.getElementById("feedback").className = "feedback wrong";
            document.getElementById("feedback").style.display = "block";
        }
        document.getElementById("scoreDisplay").innerText = score;
        document.getElementById("streakDisplay").innerText = streak;
        document.getElementById("submitBtn").innerHTML = "➡️ Next Question";
        document.getElementById("submitBtn").onclick = () => {
            currentIndex++;
            if(currentIndex < totalQuestions) {
                loadQuestion();
                document.getElementById("submitBtn").innerHTML = "✨ Check Answer ✨";
                document.getElementById("submitBtn").onclick = checkAnswer;
            } else {
                finishSubject();
            }
        };
    }

    function finishSubject() {
        gameActive = false;
        let maxScore = totalQuestions * 10;
        let percent = (score / maxScore) * 100;
        let passed = percent >= 70;
        let correctCount = score / 10;
        subjectProgress[currentSubject] = {
            completed: passed,
            score: score,
            total: totalQuestions,
            correct: correctCount,
            percent: Math.round(percent)
        };
        saveProgress();
        
        document.getElementById("statsBar").style.display = "none";
        document.getElementById("progressBar").style.display = "none";
        document.getElementById("playArea").style.display = "none";
        document.getElementById("answerInput").disabled = true;
        document.getElementById("submitBtn").disabled = true;
        
        let trophy = passed ? "🏆🎓✨" : "📚💪📖";
        let message = passed ? `Congratulations! You passed Grade 9 ${subjectNames[currentSubject]} with ${Math.round(percent)}% (${correctCount}/${totalQuestions} correct)!` 
                              : `Good effort! You scored ${Math.round(percent)}% (${correctCount}/${totalQuestions} correct). Aim for 70% to master this subject!`;
        
        document.getElementById("resultScreen").innerHTML = `
            <div class="result-trophy">${trophy}</div>
            <div class="result-score">${score} / ${maxScore} points</div>
            <div class="result-message">${message}</div>
            <div class="badges">${passed ? '<span class="badge">🏅 Grade 9 Scholar</span><span class="badge">📖 High School Ready</span>' : '<span class="badge">📚 Keep Studying</span><span class="badge">💪 Try Again</span>'}</div>
            <button class="btn" onclick="backToSubjects()">📚 Back to Subjects</button>
            <button class="btn btn-home" onclick="resetAndPlayAgain()" style="margin-top:10px;">🔄 Play This Subject Again</button>
        `;
        document.getElementById("resultScreen").style.display = "block";
        renderSubjects();
    }

    function backToSubjects() {
        document.getElementById("resultScreen").style.display = "none";
        document.getElementById("playArea").style.display = "block";
        gameActive = false;
        currentSubject = null;
        document.getElementById("subjectBadge").innerHTML = "📚 Select a Subject";
        document.getElementById("questionText").innerHTML = "Tap on a subject above to start learning!";
        document.getElementById("answerInput").disabled = true;
        document.getElementById("submitBtn").disabled = true;
        document.getElementById("answerInput").value = "";
        document.getElementById("statsBar").style.display = "none";
        document.getElementById("progressBar").style.display = "none";
        renderSubjects();
    }

    function resetAndPlayAgain() {
        if(currentSubject) {
            score = 0;
            currentIndex = 0;
            streak = 0;
            document.getElementById("resultScreen").style.display = "none";
            document.getElementById("playArea").style.display = "block";
            gameActive = true;
            answered = false;
            document.getElementById("answerInput").disabled = false;
            document.getElementById("submitBtn").disabled = false;
            document.getElementById("statsBar").style.display = "flex";
            document.getElementById("progressBar").style.display = "block";
            document.getElementById("submitBtn").innerHTML = "✨ Check Answer ✨";
            document.getElementById("submitBtn").onclick = checkAnswer;
            loadQuestion();
        }
    }

    // Initialize
    renderSubjects();
    document.getElementById("answerInput").addEventListener("keypress", (e) => {
        if(e.key === "Enter" && gameActive && !answered) {
            checkAnswer();
        }
    });
</script>
