<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade 2 CBC Creative & PE Quiz | Singing Games · Kicking · Ornaments · Egg Roll · Swan Balance · Wind Instruments · Coiling · Songs</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* cleaner for kids */
        }

        body {
            background: linear-gradient(135deg, #1b4d3e 0%, #0e6b5e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 850px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 60px 60px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3), inset 0 1px 4px rgba(255, 245, 200, 0.9);
            overflow: hidden;
            transition: all 0.2s;
        }

        .game-header {
            background: #ffaa44;
            padding: 18px 20px 14px;
            text-align: center;
            border-bottom: 5px solid #e67e22;
        }

        .level-badge {
            background: #2c2b26;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 50px;
            color: #ffdd99;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .stars {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .star {
            font-size: 26px;
            color: #ffc107;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-progress {
            background: #fee3b8;
            margin: 12px 16px 0;
            border-radius: 40px;
            padding: 6px 18px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.95rem;
            color: #4a2e1a;
        }

        .quiz-card {
            padding: 22px 24px 24px;
        }

        .question-text {
            background: #fef3e0;
            padding: 20px 18px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            box-shadow: inset 0 0 0 3px white, 0 8px 14px rgba(0,0,0,0.05);
            border: 1px solid #ffd58c;
            word-break: break-word;
            color: #2d4a2c;
            margin-bottom: 20px;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        .timer-circle {
            background: #2c5a2e;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: white;
            font-family: monospace;
            box-shadow: 0 5px 0 #1a3a1c;
            transition: 0.1s;
        }

        .warning {
            background: #c0392b;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); background-color: #c0392b; }
            100% { transform: scale(1.05); background-color: #e67e22; }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin: 20px 0 18px;
        }

        .option-btn {
            background: #efe0ca;
            border: 3px solid #ffbb5c;
            border-radius: 50px;
            padding: 12px 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.08s linear;
            text-align: center;
            color: #2c4b1e;
            font-family: inherit;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .voice-actions {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin: 12px 0 12px;
        }

        .voice-btn {
            background: #4c9faf;
            border: none;
            padding: 10px 12px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.95rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
            font-family: inherit;
        }

        .voice-btn.mic {
            background: #2e7d64;
        }

        .voice-btn.speaker {
            background: #e67e22;
        }

        .voice-btn:active {
            transform: scale(0.96);
        }

        .status-msg {
            background: #e8e0cf;
            border-radius: 36px;
            padding: 8px 12px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
            margin-top: 12px;
        }

        .next-btn {
            background: #f3a638;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2e2c1f;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.1s;
            font-family: inherit;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-area {
            text-align: center;
            margin: 14px 20px 18px;
        }

        .reset-btn {
            background: #b4813c;
            border: none;
            padding: 7px 24px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1.2rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 4px; }
            .voice-btn { font-size: 0.75rem; }
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            background: #ebd5b3;
            padding: 8px;
            color: #4a3720;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🎵 LEVEL 1 / 5</div>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <div class="score-progress">
            <span>🎯 SCORE: <span id="currentScore">0</span></span>
            <span>✅ NEED 80% ➡️ <span id="requiredInfo">0/24</span></span>
        </div>
    </div>
    <div class="quiz-card">
        <div class="question-text" id="questionText">🌟 Get ready for fun! 🌟</div>
        <div class="timer-area"><div class="timer-circle" id="timerCircle">40</div></div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="voice-actions">
            <button class="voice-btn speaker" id="speakBtn">🔊 READ QUESTION</button>
            <button class="voice-btn mic" id="micBtn">🎤 VOICE ANSWER</button>
        </div>
        <div class="status-msg" id="statusMsg">✨ Tap or speak! 40 seconds each. ✨</div>
        <button class="next-btn" id="nextBtn" disabled>➡️ NEXT QUESTION</button>
        <div class="reset-area"><button class="reset-btn" id="resetGameBtn">🔄 RESTART GAME</button></div>
    </div>
    <footer>🎶 Singing Games · Kicking · Plaited Ornament (Single Strand) · Egg Roll · Swan Balance · Wind Instruments · Coiling Technique · Songs for Display 🎨</footer>
</div>

<script>
    // ---------- TOPICS (8 core topics) ----------
    const topicsList = [
        "Singing Games (Western Style)", "Kicking", "Plaited Ornament (Single Strand)", 
        "Egg Roll", "Swan Balance", "Wind Musical Instruments", 
        "Modelling (Coiling Technique)", "Songs on Performing & Display"
    ];
    
    // Generate dynamic questions for each level (30 questions per level covering all topics evenly)
    function generateQuestionByTopic(topic, id, level) {
        // each topic gets unique question pool
        if (topic === "Singing Games (Western Style)") {
            const bank = [
                { q: "In western singing games, what do children often do while singing?", opts: ["Circle dance", "Sit still", "Write notes", "Draw pictures"], ans: "Circle dance" },
                { q: "'Ring a Ring o' Roses' is a famous western singing game. What happens at the end?", opts: ["All fall down", "Jump high", "Clap hands", "Run away"], ans: "All fall down" },
                { q: "Which song is often used in a 'musical chairs' game?", opts: ["Any upbeat song", "National anthem", "Sad song", "Lullaby"], ans: "Any upbeat song" },
                { q: "In a singing game, what should you follow?", opts: ["Rhythm and words", "Only the beat", "Teacher's clap", "Silence"], ans: "Rhythm and words" },
                { q: "A western singing game like 'London Bridge' ends with:", opts: ["Catching a player", "Singing faster", "Stop music", "Swap places"], ans: "Catching a player" },
                { q: "Which is an example of a singing game movement?", opts: ["Turning around", "Drawing", "Reading", "Jumping only"], ans: "Turning around" }
            ];
            let pick = bank[(id + level) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Kicking") {
            const bank = [
                { q: "When kicking a ball, which part of the foot is best?", opts: ["Inside or laces", "Toe only", "Heel", "Knee"], ans: "Inside or laces" },
                { q: "Kicking helps improve which skill?", opts: ["Balance and strength", "Singing", "Drawing", "Reading"], ans: "Balance and strength" },
                { q: "In a kicking game, you should always look at the _____ before kicking.", opts: ["Ball", "Friend", "Goalpost only", "Sky"], ans: "Ball" },
                { q: "Which sport uses kicking most?", opts: ["Football (Soccer)", "Swimming", "Tennis", "Basketball"], ans: "Football (Soccer)" },
                { q: "What is a safe surface for kicking practice?", opts: ["Grass field", "Concrete road", "Gravel", "Stairs"], ans: "Grass field" },
                { q: "Kicking with power requires you to:", opts: ["Swing your leg", "Close your eyes", "Stand still", "Hop"], ans: "Swing your leg" }
            ];
            let pick = bank[(id + level*2) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Plaited Ornament (Single Strand)") {
            const bank = [
                { q: "What material is good for a single-strand plaited ornament?", opts: ["Yarn or string", "Paper", "Metal wire", "Leaves"], ans: "Yarn or string" },
                { q: "A single-strand plait is also called a:", opts: ["Braid", "Knot", "Twist only", "Loop"], ans: "Braid" },
                { q: "To start a single strand plait, you need:", opts: ["Three sections", "One section", "Two sections", "Four sections"], ans: "Three sections" },
                { q: "A plaited ornament can be used as a:", opts: ["Bracelet", "Football", "Plate", "Cup"], ans: "Bracelet" },
                { q: "Which is a finishing technique for a plait?", opts: ["Knot the end", "Glue", "Cut loose", "Burn"], ans: "Knot the end" },
                { q: "Plaited ornaments can be decorated with:", opts: ["Beads", "Sand", "Water", "Leaves only"], ans: "Beads" }
            ];
            let pick = bank[(id + level*3) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Egg Roll") {
            const bank = [
                { q: "In egg roll activity, how do you move the egg?", opts: ["Roll gently with a stick", "Throw it", "Kick hard", "Hide it"], ans: "Roll gently with a stick" },
                { q: "Egg roll improves:", opts: ["Hand-eye coordination", "Singing voice", "Memory", "Spelling"], ans: "Hand-eye coordination" },
                { q: "What should you use for a safe egg roll game?", opts: ["Plastic or wooden egg", "Real egg", "Glass egg", "Rock"], ans: "Plastic or wooden egg" },
                { q: "The goal in egg roll is to:", opts: ["Reach finish line without breaking", "Break the egg", "Fastest kick", "Bounce high"], ans: "Reach finish line without breaking" },
                { q: "Which body part controls the egg roll stick?", opts: ["Hands", "Feet", "Head", "Elbow"], ans: "Hands" },
                { q: "Egg roll is similar to which game?", opts: ["Spoon race", "Soccer", "Basketball", "Hopscotch"], ans: "Spoon race" }
            ];
            let pick = bank[(id + level*4) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Swan Balance") {
            const bank = [
                { q: "Swan balance pose requires standing on:", opts: ["One leg", "Two legs", "Hands", "Knees"], ans: "One leg" },
                { q: "What does swan balance improve?", opts: ["Concentration & posture", "Running speed", "Drawing", "Clapping"], ans: "Concentration & posture" },
                { q: "In swan balance, your arms should be:", opts: ["Out like wings", "Crossed", "Behind back", "On head"], ans: "Out like wings" },
                { q: "To hold swan balance longer, you should look:", opts: ["At a fixed point", "At the floor", "Up at sky", "Close eyes"], ans: "At a fixed point" },
                { q: "Which is a safety tip for balance activities?", opts: ["Use a soft mat", "Hard floor", "Slippery socks", "Eyes closed"], ans: "Use a soft mat" },
                { q: "Swan balance is a type of:", opts: ["Gymnastics movement", "Singing game", "Kicking drill", "Weaving"], ans: "Gymnastics movement" }
            ];
            let pick = bank[(id + level*5) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Wind Musical Instruments") {
            const bank = [
                { q: "Which is a wind instrument?", opts: ["Recorder", "Drum", "Guitar", "Xylophone"], ans: "Recorder" },
                { q: "To make sound in a wind instrument, you:", opts: ["Blow air", "Shake it", "Strike it", "Pluck strings"], ans: "Blow air" },
                { q: "A trumpet belongs to which family?", opts: ["Wind/brass", "String", "Percussion", "Keyboard"], ans: "Wind/brass" },
                { q: "Which is a simple wind instrument for kids?", opts: ["Harmonica", "Tambourine", "Maracas", "Bongo"], ans: "Harmonica" },
                { q: "The pitch of a wind instrument changes by:", opts: ["Covering holes", "Hitting harder", "Shaking faster", "Swinging"], ans: "Covering holes" },
                { q: "A whistle is an example of a:", opts: ["Wind instrument", "String instrument", "Drum", "Shaker"], ans: "Wind instrument" }
            ];
            let pick = bank[(id + level*6) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else if (topic === "Modelling (Coiling Technique)") {
            const bank = [
                { q: "In coiling technique, you roll clay into:", opts: ["Long ropes", "Flat circles", "Balls", "Cubes"], ans: "Long ropes" },
                { q: "What do you use to stick coils together?", opts: ["Slip (watery clay)", "Glue", "Tape", "String"], ans: "Slip (watery clay)" },
                { q: "Coiling is used to make:", opts: ["Pots and bowls", "Flat tiles", "Beads only", "Sculptures without coils"], ans: "Pots and bowls" },
                { q: "Which tool helps smooth coils?", opts: ["Wooden tool or finger", "Hammer", "Scissors", "Needle"], ans: "Wooden tool or finger" },
                { q: "After coiling, you should let your pot:", opts: ["Dry slowly", "Freeze", "Boil", "Bake immediately"], ans: "Dry slowly" },
                { q: "Coiling technique builds:", opts: ["Vessel walls", "Straight lines only", "Faces", "Flat plates only"], ans: "Vessel walls" }
            ];
            let pick = bank[(id + level*7) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
        else { // Songs on performing & display
            const bank = [
                { q: "When performing a song, you should:", opts: ["Use expression and voice", "Stand still and whisper", "Turn away", "Cover face"], ans: "Use expression and voice" },
                { q: "A song about 'creative activities' can include:", opts: ["Actions and dance", "Only clapping", "Silence", "Reading books"], ans: "Actions and dance" },
                { q: "What does 'display' mean in creative arts?", opts: ["Show your work to others", "Hide it", "Throw away", "Color only"], ans: "Show your work to others" },
                { q: "Which is a good performing skill?", opts: ["Eye contact", "Looking down", "Mumbling", "Standing still only"], ans: "Eye contact" },
                { q: "A call-and-response song is:", opts: ["Leader sings, group answers", "Everyone silent", "Instrument only", "Whispering"], ans: "Leader sings, group answers" },
                { q: "When displaying a plaited ornament, you should:", opts: ["Arrange neatly with label", "Hide in a box", "Toss on floor", "No name"], ans: "Arrange neatly with label" }
            ];
            let pick = bank[(id + level*8) % bank.length];
            return { text: pick.q, options: shuffleArray([...pick.opts]), correct: pick.ans, topic: topic };
        }
    }
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function buildQuestionsForLevel(level) {
        let qs = [];
        for (let i = 1; i <= 30; i++) {
            let topicIdx = (i + level) % topicsList.length;
            let topic = topicsList[topicIdx];
            qs.push(generateQuestionByTopic(topic, i, level));
        }
        return qs;
    }
    
    // ---------- GLOBAL STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let lockAnswer = false;
    let currentQuestionObj = null;
    
    // Speech synthesis
    let speechUtterance = null;
    function speakNow(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        speechUtterance = new SpeechSynthesisUtterance(text);
        speechUtterance.lang = "en-US";
        speechUtterance.rate = 0.9;
        speechUtterance.pitch = 1.0;
        window.speechSynthesis.speak(speechUtterance);
    }
    
    function readQuestionOutLoud() {
        if (currentQuestionObj) {
            speakNow(`Question: ${currentQuestionObj.text}`);
            statusMsg.innerText = "🔊 Reading question...";
            setTimeout(() => {
                if (statusMsg.innerText.includes("Reading")) statusMsg.innerText = "✅ Now answer with voice or tap!";
            }, 1500);
        }
    }
    
    // Voice recognition setup
    let recognition = null;
    function initSpeechRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            micBtn.disabled = true;
            micBtn.style.opacity = 0.5;
            statusMsg.innerText = "⚠️ Voice input not supported here. Use click.";
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = (event) => {
            let spoken = event.results[0][0].transcript.trim().toLowerCase();
            statusMsg.innerText = `🎙️ You said: "${spoken}" - checking...`;
            checkVoiceMatch(spoken);
        };
        recognition.onerror = (ev) => {
            statusMsg.innerText = `Voice error: ${ev.error}. Tap an answer instead.`;
        };
    }
    
    function checkVoiceMatch(spoken) {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "Wait, question already finished!";
            return;
        }
        if (!currentQuestionObj) return;
        const correctAns = currentQuestionObj.correct.toLowerCase();
        let matched = false;
        if (spoken === correctAns) matched = true;
        else if (correctAns.includes(spoken) && spoken.length > 3) matched = true;
        else if (spoken.includes(correctAns)) matched = true;
        else {
            for (let opt of currentQuestionObj.options) {
                if (opt.toLowerCase() === spoken && opt === currentQuestionObj.correct) {
                    matched = true;
                    break;
                }
            }
        }
        if (matched) handleCorrect();
        else handleWrong();
    }
    
    // Answer handlers with voice feedback
    function handleCorrect() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        score++;
        updateUI();
        speakNow(`Great! Correct! ${currentQuestionObj.correct} is right. +1 point.`);
        statusMsg.innerText = "🎉 CORRECT! 🎉 +1 point!";
        highlightCorrectOption();
        disableOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }
    
    function handleWrong() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        speakNow(`Oops! The correct answer is ${currentQuestionObj.correct}. Keep trying!`);
        statusMsg.innerText = `😓 WRONG! Correct: "${currentQuestionObj.correct}".`;
        highlightCorrectOption();
        disableOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }
    
    function handleTimeout() {
        if (lockAnswer || waitingForNext) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        speakNow(`Time is up! The correct answer was ${currentQuestionObj.correct}. Next question.`);
        statusMsg.innerText = `⏰ TIME'S UP! Answer: ${currentQuestionObj.correct}`;
        highlightCorrectOption();
        disableOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }
    
    function highlightCorrectOption() {
        const btns = document.querySelectorAll('.option-btn');
        for (let btn of btns) {
            if (btn.innerText === currentQuestionObj.correct) {
                btn.style.background = "#b9f6ca";
                btn.style.border = "3px solid #2e7d32";
            } else {
                btn.style.background = "#ffe0b0";
            }
        }
    }
    
    function disableOptions() {
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
    }
    
    function enableNewOptions() { /* just reset styles*/ }
    
    function updateUI() {
        document.getElementById("currentScore").innerText = score;
        let needed = Math.ceil(questions.length * 0.8);
        document.getElementById("requiredInfo").innerText = `${score}/${needed}`;
        let percent = (score / questions.length) * 100;
        let starCount = Math.min(5, Math.floor(percent / 20));
        let starHtml = "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
        document.getElementById("starRating").innerHTML = starHtml;
    }
    
    function startTimerForQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 40;
        timerCircle.innerText = timeLeft;
        timerCircle.classList.remove("warning");
        timerInterval = setInterval(() => {
            if (lockAnswer || waitingForNext) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                timeLeft--;
                timerCircle.innerText = timeLeft;
                if (timeLeft <= 10) timerCircle.classList.add("warning");
            }
        }, 1000);
    }
    
    function loadQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        lockAnswer = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        
        if (currentQuestionIndex >= questions.length) {
            let requiredPass = Math.ceil(questions.length * 0.8);
            if (score >= requiredPass) {
                if (currentLevel === 5) {
                    statusMsg.innerText = "🏆🏆 YOU MASTERED ALL LEVELS! CHAMPION! 🏆🏆";
                    speakNow("Congratulations! You completed all 5 levels! Amazing work!");
                    questionTextEl.innerText = "🎉 GRAND VICTORY! 🎉 You're a Creative Arts & PE Star!";
                    optionsContainer.innerHTML = "";
                    nextBtn.disabled = true;
                    return;
                } else {
                    currentLevel++;
                    currentQuestionIndex = 0;
                    score = 0;
                    loadLevel();
                    updateLevelDisplay();
                    updateUI();
                    loadQuestion();
                    return;
                }
            } else {
                statusMsg.innerText = `❌ You got ${score}/${questions.length} (need ${requiredPass}%). Restarting level ${currentLevel}.`;
                speakNow(`You need more practice. Restarting level ${currentLevel}.`);
                resetCurrentLevel();
                return;
            }
        }
        
        currentQuestionObj = questions[currentQuestionIndex];
        questionTextEl.innerText = currentQuestionObj.text;
        optionsContainer.innerHTML = "";
        currentQuestionObj.options.forEach(opt => {
            let btn = document.createElement("button");
            btn.innerText = opt;
            btn.classList.add("option-btn");
            btn.addEventListener("click", () => {
                if (lockAnswer || waitingForNext) return;
                if (opt === currentQuestionObj.correct) handleCorrect();
                else handleWrong();
            });
            optionsContainer.appendChild(btn);
        });
        startTimerForQuestion();
        updateUI();
        statusMsg.innerText = "🎤 Listen or read. Use voice or tap answer!";
        // Auto-read each new question (voice output)
        speakNow(currentQuestionObj.text);
    }
    
    function loadLevel() {
        questions = buildQuestionsForLevel(currentLevel);
        score = 0;
        currentQuestionIndex = 0;
    }
    
    function updateLevelDisplay() {
        document.getElementById("levelDisplay").innerHTML = `🎨 LEVEL ${currentLevel} / 5 🎨`;
        let need = Math.ceil(30 * 0.8);
        document.getElementById("requiredInfo").innerText = `0/${need}`;
    }
    
    function resetCurrentLevel() {
        if (timerInterval) clearInterval(timerInterval);
        loadLevel();
        currentQuestionIndex = 0;
        score = 0;
        lockAnswer = false;
        waitingForNext = false;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = 1;
        loadLevel();
        currentQuestionIndex = 0;
        score = 0;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    // DOM elements
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetGameBtn");
    const speakBtn = document.getElementById("speakBtn");
    const micBtn = document.getElementById("micBtn");
    const timerCircle = document.getElementById("timerCircle");
    const questionTextEl = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const statusMsg = document.getElementById("statusMsg");
    
    nextBtn.addEventListener("click", () => {
        if (!waitingForNext && !lockAnswer) {
            statusMsg.innerText = "👉 Answer the question first!";
            speakNow("Please answer the question before moving on.");
            return;
        }
        if (waitingForNext) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });
    
    resetBtn.addEventListener("click", () => fullReset());
    speakBtn.addEventListener("click", () => readQuestionOutLoud());
    micBtn.addEventListener("click", () => {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "Finish current question first!";
            speakNow("Complete this question first.");
            return;
        }
        if (recognition) {
            try {
                recognition.start();
                statusMsg.innerText = "🎤 Listening... say your answer!";
            } catch(e) { statusMsg.innerText = "Voice start failed. Tap answer."; }
        } else statusMsg.innerText = "Voice not ready.";
    });
    
    // initialize
    initSpeechRecognition();
    loadLevel();
    updateLevelDisplay();
    updateUI();
    loadQuestion();
</script>
</body>
</html>
