<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Grade 5: Teachings of Jesus - Recovery, Responsibility, Empowerment & Prayer | CBC Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #2c5f2d 0%, #1a3b1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .game-container {
      max-width: 800px;
      width: 100%;
      background: #fffef7;
      border-radius: 70px 70px 60px 60px;
      box-shadow: 0 30px 35px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255,255,210,0.9);
      overflow: hidden;
      transition: all 0.2s;
    }

    .game-header {
      background: #d4a373;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 6px solid #b5835a;
    }

    .level-badge {
      background: #2f3e2e;
      color: #ffefb9;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .score-area {
      background: #6b4c3b;
      padding: 6px 16px;
      border-radius: 40px;
      color: #f9e0a0;
      font-weight: bold;
      font-size: 1rem;
    }

    .progress {
      background: #f7e3af;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #4a2e1a;
    }

    .timer-section {
      background: #fff0cf;
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px dashed #e6b064;
    }

    .timer-clock {
      background: #1e2a2e;
      color: #f9c74f;
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: bold;
      padding: 5px 22px;
      border-radius: 60px;
      letter-spacing: 3px;
      box-shadow: inset 0 0 3px gold, 0 4px 0 #4a3512;
    }

    .hint-area {
      background: #f7b05e;
      padding: 8px 20px;
      border-radius: 36px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c2b1f;
      max-width: 280px;
      transition: 0.2s;
    }

    .voice-btn {
      background: #8b5a2b;
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 0 #5a3a1a;
      transition: 0.05s linear;
    }

    .voice-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5a3a1a;
    }

    .question-panel {
      padding: 30px 25px 25px;
    }

    .question-text {
      font-size: 1.7rem;
      line-height: 1.35;
      font-weight: bold;
      color: #3b2a1f;
      background: #ffffff;
      padding: 18px 20px;
      border-radius: 55px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: inset 0 0 0 3px #f0e0c0, 0 10px 15px rgba(0,0,0,0.05);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .answer-input {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.2rem;
      border-radius: 60px;
      border: 3px solid #d4a373;
      background: white;
      font-family: inherit;
      outline: none;
      text-align: center;
      font-weight: 500;
    }

    .answer-input:focus {
      border-color: #e67e22;
      box-shadow: 0 0 0 4px rgba(230,126,34,0.3);
    }

    .submit-btn {
      background: #b5835a;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 14px;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      transition: 0.08s linear;
      box-shadow: 0 6px 0 #6b3e1a;
    }

    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #6b3e1a;
    }

    .feedback {
      text-align: center;
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 50px;
      background: #f3ebd2;
      margin-top: 15px;
      font-weight: bold;
    }

    .modal-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-card {
      background: #fff3df;
      max-width: 360px;
      width: 85%;
      padding: 30px 20px;
      text-align: center;
      border-radius: 65px;
      font-size: 1.3rem;
      font-weight: bold;
      box-shadow: 0 20px 30px black;
    }

    .modal-card button {
      background: #b5835a;
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 10px 28px;
      margin-top: 20px;
      border-radius: 40px;
      cursor: pointer;
    }

    @media (max-width: 580px) {
      .question-text {
        font-size: 1.3rem;
      }
      .timer-clock {
        font-size: 1.6rem;
        padding: 4px 15px;
      }
      .voice-btn {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
      .hint-area {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
<div id="gameRoot"></div>

<script>
  // --------------------------------------------------------------
  // GRADE 5 CBC - TEACHINGS OF JESUS CHRIST
  // Topics: Recovery of lost human beings, Responsible living,
  // Empowering the needy, Persistence in prayer
  // 5 Levels x 30 Questions = 150. Open-ended. Timer 40s. Voice output.
  // Pass mark: 80% (24/30 per level)
  // --------------------------------------------------------------

  function generateTeachingsBank() {
    const questions = [];
    let id = 1;

    function addQ(text, correct) {
      questions.push({ id: id++, text: text, correct: correct.trim().toLowerCase() });
    }

    // ========== TOPIC 1: RECOVERY OF LOST HUMAN BEINGS (35 questions) ==========
    addQ("In which parable does a shepherd leave 99 sheep to find one lost sheep?", "lost sheep");
    addQ("What did the woman in the parable of the lost coin light to find the coin?", "lamp");
    addQ("How many coins did the woman lose in the parable of the lost coin?", "one");
    addQ("In the parable of the prodigal son, what did the younger son ask his father for?", "inheritance");
    addQ("Where did the prodigal son go after leaving home?", "far country");
    addQ("What did the prodigal son feed to the pigs when he was hungry?", "pods");
    addQ("What did the prodigal son say to his father when he returned?", "i have sinned");
    addQ("How did the father react when he saw his prodigal son returning?", "ran and embraced him");
    addQ("What did the father put on the prodigal son's finger?", "ring");
    addQ("What did the father kill to celebrate his son's return?", "fatted calf");
    addQ("Who was angry that the prodigal son was welcomed back?", "elder brother");
    addQ("What did Jesus say there is joy over? (one lost sinner who repents)", "repentance");
    addQ("Which tax collector was 'lost' but was found by Jesus?", "zacchaeus");
    addQ("What tree did Zacchaeus climb to see Jesus?", "sycamore");
    addQ("What did Zacchaeus promise to do after meeting Jesus?", "give half to poor");
    addQ("Which woman was caught in adultery and Jesus forgave her?", "woman caught in adultery");
    addQ("What did Jesus write on the ground when the woman was accused?", "nothing recorded");
    addQ("What did Jesus tell the woman caught in adultery to do?", "sin no more");
    addQ("Which disciple denied Jesus three times but was restored?", "peter");
    addQ("After his restoration, what did Jesus tell Peter to do?", "feed my sheep");
    addQ("Jesus came to seek and to save the ______.", "lost");
    addQ("The parable of the lost sheep shows God's ________ for each person.", "love");
    addQ("The prodigal son 'came to his _______' before returning home.", "senses");
    addQ("The elder brother represents those who are self-________.", "righteous");
    addQ("The father in the prodigal son parable represents God the _______.", "father");
    addQ("Jesus said, 'I am the good shepherd. The good shepherd gives his life for the _______.'", "sheep");
    addQ("What did the shepherd do when he found the lost sheep?", "rejoiced");
    addQ("Jesus told the parable of the lost sheep to show that God cares for every _______ person.", "individual");
    addQ("The Pharisees complained that Jesus ate with ______ and sinners.", "tax collectors");
    addQ("Jesus said, 'It is not the healthy who need a doctor, but the _______.'", "sick");
    addQ("Who was the Samaritan woman at the well that Jesus forgave?", "samaritan woman");
    addQ("How many husbands had the Samaritan woman had?", "five");
    addQ("Jesus told the woman at the well that he could give her living _______.", "water");
    addQ("The woman at the well went and told her whole ______ about Jesus.", "town");
    addQ("Matthew (Levi) was a tax collector whom Jesus called to be a _______.", "disciple");

    // ========== TOPIC 2: RESPONSIBLE LIVING (25 questions) ==========
    addQ("In the parable of the talents, what did the master give his servants?", "talents");
    addQ("How many talents did the first servant receive?", "five");
    addQ("What did the servant with five talents do with them?", "invested");
    addQ("What did the lazy servant do with his one talent?", "buried");
    addQ("What was the lazy servant called for being irresponsible?", "wicked lazy servant");
    addQ("What happened to the lazy servant's talent?", "taken away");
    addQ("The parable of the rich fool says a man stored up treasures for himself but was not _____ toward God.", "rich");
    addQ("What did God call the rich fool who stored up his crops?", "fool");
    addQ("Jesus said, 'Give to Caesar what is Caesar's and to God what is _______'", "gods");
    addQ("The parable of the faithful and wise manager shows that we must be _______ with what God gives.", "faithful");
    addQ("Jesus said, 'Let your light shine before others, that they may see your good ______.'", "deeds");
    addQ("You are the _______ of the earth and the light of the world.", "salt");
    addQ("Who built his house on the rock? The one who ______ Jesus' words.", "obeys");
    addQ("What happened to the house built on sand?", "fell");
    addQ("Jesus said, 'No one can serve two masters. You cannot serve both God and _______.'", "money");
    addQ("The parable of the workers in the vineyard teaches about God's ______ and responsibility.", "generosity");
    addQ("The wise virgins took extra _______ for their lamps.", "oil");
    addQ("What happened to the foolish virgins who had no oil?", "shut out");
    addQ("Jesus said, 'Watch and ______ because you do not know the day or the hour.'", "pray");
    addQ("The parable of the sower shows that good soil produces a ______ crop.", "good");
    addQ("What choked the seed that fell among thorns?", "worries and wealth");
    addQ("Responsible living means using our gifts to ______ God.", "honor");
    addQ("The wise steward uses his master's resources ______.", "wisely");
    addQ("Jesus praised the poor widow who gave two small ______.", "coins");
    addQ("The widow gave all she had to ______.", "live on");

    // ========== TOPIC 3: EMPOWERING THE NEEDY (20 questions) ==========
    addQ("Jesus said, 'The poor you will always have with you, and you can help them ______.'", "anytime");
    addQ("The Good Samaritan helped a man who was ______.", "robbed");
    addQ("What did the Good Samaritan pour on the man's wounds?", "oil and wine");
    addQ("Where did the Good Samaritan take the injured man?", "inn");
    addQ("How much money did the Good Samaritan give the innkeeper?", "two denarii");
    addQ("Jesus said, 'Whatever you did for the least of these, you did for ______.'", "me");
    addQ("Who fed the hungry crowd of 5000?", "jesus");
    addQ("How many loaves and fish did the boy share to feed the 5000?", "five loaves two fish");
    addQ("After feeding the 4000, how many baskets were left over?", "seven");
    addQ("Jesus said, 'It is more blessed to give than to ______.'", "receive");
    addQ("The early church shared everything so that no one was in ______.", "need");
    addQ("Dorcas (Tabitha) made _______ for the widows.", "clothes");
    addQ("Jesus told the rich young ruler to sell his possessions and give to the ______.", "poor");
    addQ("The poor widow gave two mites – all she had – as an ______.", "offering");
    addQ("Jesus said, 'Give to the one who asks you, and do not turn away from the one who wants to ______ from you.'", "borrow");
    addQ("The parable of the great banquet invited the poor, the crippled, the blind and the ______.", "lame");
    addQ("Jesus healed the man at the pool of Bethesda who had been an invalid for ___ years.", "38");
    addQ("Jesus gave sight to Bartimaeus, a blind ______.", "beggar");
    addQ("Jesus touched the leper and made him ______.", "clean");
    addQ("What did Jesus say about the widow's offering? She gave more than all the ______.", "rich");

    // ========== TOPIC 4: PERSISTENCE IN PRAYER (20 questions) ==========
    addQ("In the parable of the persistent widow, what did the widow keep asking the judge for?", "justice");
    addQ("The unjust judge granted the widow's request because she kept ______ him.", "bothering");
    addQ("Jesus said we should always pray and not give ______.", "up");
    addQ("In the parable of the friend at midnight, what did the man ask for?", "bread");
    addQ("The friend at midnight kept ______ until his neighbor gave him bread.", "knocking");
    addQ("Jesus said, 'Ask and it will be given to you; seek and you will ______; knock and the door will be opened.'", "find");
    addQ("Jesus taught his disciples to pray: 'Our Father in heaven, hallowed be your ______.'", "name");
    addQ("In the Lord's Prayer, what do we ask God to give us daily?", "bread");
    addQ("In the Lord's Prayer, we ask to forgive our debts as we forgive our ______.", "debtors");
    addQ("Jesus prayed all night before choosing his twelve ______.", "apostles");
    addQ("In the Garden of Gethsemane, Jesus prayed, 'Not my will, but ______ be done.'", "yours");
    addQ("Jesus told a parable about a Pharisee and a tax collector ______.", "praying");
    addQ("Which one went home justified? The tax collector who said 'God have mercy on me, a ______.'", "sinner");
    addQ("The Pharisee prayed about himself, thanking God he was not like other ______.", "men");
    addQ("Jesus said, 'When you pray, go into your room, close the door and pray to your Father in ______.'", "secret");
    addQ("How many times did Jesus say we should forgive someone who sins against us?", "seventy seven");
    addQ("Jesus often withdrew to lonely places to ______.", "pray");
    addQ("In the parable of the persistent friend, what was the man's friend's request at midnight?", "three loaves");
    addQ("Jesus said, 'Your Father knows what you need before you ______ him.'", "ask");
    addQ("Prayer is a conversation with ______.", "god");

    // ========== ADDITIONAL MIXED QUESTIONS to reach 150 (20 more) ==========
    addQ("Jesus said, 'Come to me, all you who are weary and burdened, and I will give you ______.'", "rest");
    addQ("Which parable teaches that God's kingdom grows from a small seed into a large tree?", "mustard seed");
    addQ("What does the leaven (yeast) represent in Jesus' parable?", "kingdom of god");
    addQ("The pearl of great price represents the ______ of God's kingdom.", "value");
    addQ("The hidden treasure in the field shows that God's kingdom is worth ______ everything.", "selling");
    addQ("Jesus said, 'The greatest among you will be your ______.'", "servant");
    addQ("Jesus washed his disciples' ______ to teach them humility and service.", "feet");
    addQ("The parable of the unforgiving servant teaches that we must forgive from the ______.", "heart");
    addQ("How much did the unforgiving servant owe his master?", "ten thousand bags gold");
    addQ("How much did the fellow servant owe the unforgiving servant?", "denarius");
    addQ("The master threw the unforgiving servant into prison until he could pay his ______ debt.", "whole");
    addQ("Jesus said, 'Love your enemies and pray for those who ______ you.'", "persecute");
    addQ("Jesus said, 'If someone slaps you on the right cheek, turn to them the other ______ also.'", "cheek");
    addQ("Jesus taught the Golden Rule: 'Do to others what you would have them do to ______.'", "you");
    addQ("Blessed are the merciful, for they will be shown ______.", "mercy");
    addQ("Blessed are the peacemakers, for they will be called ______ of God.", "children");
    addQ("Blessed are those who hunger and thirst for ______, for they will be filled.", "righteousness");
    addQ("Jesus said, 'You cannot serve both God and ______.'", "money");
    addQ("Jesus taught that we should not worry about tomorrow, for tomorrow will worry about ______.", "itself");
    addQ("Seek first his kingdom and his ______, and all these things will be given to you.", "righteousness");

    // Fill exactly 150
    while (questions.length < 150) {
      addQ("What did Jesus say we should do for those who cannot repay us?", "invite the poor");
    }
    return questions.slice(0, 150);
  }

  const masterBank = generateTeachingsBank();

  // Game state
  let currentLevel = 1;
  let currentQIndex = 0;
  let levelQuestions = [];
  let levelScore = 0;
  let totalAttempted = 0;
  let timerInterval = null;
  let timeLeft = 40;
  let isActive = true;
  let waitingTransition = false;
  let answerLock = false;

  const root = document.getElementById("gameRoot");

  function renderGame() {
    if (!levelQuestions.length) return;
    const currentQ = levelQuestions[currentQIndex];
    const neededPass = 24;
    const remaining = 30 - totalAttempted;
    const hintMsg = getDynamicHint();

    root.innerHTML = `
      <div class="game-container">
        <div class="game-header">
          <div class="level-badge">🕯️ Level ${currentLevel} / 5</div>
          <div class="score-area">✝️ Score: ${levelScore} / ${totalAttempted}</div>
          <div class="progress">🎯 Need ${neededPass} to pass | Left: ${remaining}</div>
        </div>
        <div class="timer-section">
          <div class="timer-clock" id="timerDisplay">${timeLeft}s</div>
          <div class="hint-area" id="hintMessage">💡 ${hintMsg}</div>
          <button class="voice-btn" id="readBtn">🔊 Read Question</button>
        </div>
        <div class="question-panel">
          <div class="question-text">${escapeHtml(currentQ.text)}</div>
          <div class="answer-area">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer (one word or short phrase)..." autocomplete="off">
            <button id="submitAnswerBtn" class="submit-btn">✔ Submit Answer</button>
          </div>
          <div class="feedback" id="feedbackMsg">🙏 Jesus' teachings on recovery, responsibility, helping needy & prayer! 40 seconds. Press 🔊.</div>
        </div>
      </div>
    `;

    document.getElementById("readBtn").addEventListener("click", () => speakText(currentQ.text));
    document.getElementById("submitAnswerBtn").addEventListener("click", () => submitAnswer());
    const inputField = document.getElementById("answerInput");
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") submitAnswer(); });
    inputField.focus();
    startTimer();
  }

  function getDynamicHint() {
    if (timeLeft <= 10) return "⏰ Last seconds! Think: Prodigal son, talents, Good Samaritan, persistent prayer!";
    if (timeLeft <= 20) return "💡 Hint: Lost sheep/coin, responsible steward, helping poor, knocking in prayer!";
    if (timeLeft <= 30) return "📢 Clue: Parables: lost & found, faithful servant, neighbour love, keep praying!";
    return "🙏 Jesus teaches: Seek the lost, be responsible, help the needy, pray always!";
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.05;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Your browser does not support voice reading.");
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if (!isActive || waitingTransition) return;
      if (timeLeft <= 1) {
        clearInterval(timerInterval);
        timerInterval = null;
        if (isActive && !answerLock) handleTimeout();
      } else {
        timeLeft--;
        updateTimerDisplay();
        const hintDiv = document.getElementById("hintMessage");
        if (hintDiv) hintDiv.innerText = getDynamicHint();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const timerSpan = document.getElementById("timerDisplay");
    if (timerSpan) timerSpan.innerText = `${timeLeft}s`;
  }

  function handleTimeout() {
    if (!isActive || waitingTransition) return;
    isActive = false;
    answerLock = true;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    const fb = document.getElementById("feedbackMsg");
    if (fb) fb.innerHTML = "⏰ TIME'S UP! No answer given. Moving to next question.";
    totalAttempted++;
    scheduleNextAfterDelay();
  }

  function submitAnswer() {
    if (!isActive || waitingTransition) {
      speakText("Please wait, next question loading.");
      return;
    }
    const inputEl = document.getElementById("answerInput");
    let userAnswer = inputEl.value.trim().toLowerCase();
    if (userAnswer === "") {
      document.getElementById("feedbackMsg").innerHTML = "❗ Please type an answer!";
      speakText("Please write your answer.");
      return;
    }

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    isActive = false;
    answerLock = true;

    const currentQ = levelQuestions[currentQIndex];
    const correctAns = currentQ.correct;
    let isCorrect = false;

    let normalizedUser = userAnswer.replace(/[^a-z0-9]/g, '');
    let normalizedCorrect = correctAns.replace(/[^a-z0-9]/g, '');

    if (normalizedUser === normalizedCorrect) {
      isCorrect = true;
    } else {
      const synonyms = {
        "lost sheep": ["parable lost sheep", "sheep"],
        "prodigal son": ["lost son", "wasteful son"],
        "good samaritan": ["samaritan"],
        "talents": ["bags of gold", "five talents", "one talent"],
        "buried": ["buried talent", "hid"],
        "persistent widow": ["unjust judge", "widow"],
        "knocking": ["knock", "keep knocking"],
        "forgive": ["forgiveness"],
        "poor": ["needy", "impoverished"],
        "sick": ["ill", "unwell"],
        "pray": ["prayer", "praying"],
        "oil": ["olive oil"],
        "sinner": ["tax collector"],
        "faithful": ["responsible", "wise"],
        "mercy": ["compassion"],
        "heart": ["heartfelt"],
        "god": ["father", "lord"]
      };
      for (let [key, vals] of Object.entries(synonyms)) {
        if (normalizedCorrect === key && vals.some(v => normalizedUser.includes(v))) {
          isCorrect = true;
          break;
        }
      }
      if (!isCorrect && normalizedUser.includes(normalizedCorrect) && normalizedCorrect.length > 2) isCorrect = true;
      if (correctAns === "two denarii" && (userAnswer.includes("two") || userAnswer === "2 denarii")) isCorrect = true;
      if (correctAns === "five loaves two fish" && (userAnswer.includes("5 loaves") || userAnswer.includes("five loaves"))) isCorrect = true;
    }

    const feedbackDiv = document.getElementById("feedbackMsg");
    if (isCorrect) {
      levelScore++;
      totalAttempted++;
      feedbackDiv.innerHTML = "✅ CORRECT! ✝️ +1 point! Excellent understanding of Jesus' teachings!";
      speakText("Correct! Well done!");
    } else {
      totalAttempted++;
      feedbackDiv.innerHTML = `❌ Oops. Correct answer: "${capitalizeFirst(correctAns)}". Keep learning Jesus' teachings!`;
      speakText(`Wrong. The correct answer is ${correctAns}.`);
    }
    scheduleNextAfterDelay();
  }

  function scheduleNextAfterDelay() {
    waitingTransition = true;
    setTimeout(() => {
      if (currentQIndex + 1 >= levelQuestions.length || totalAttempted >= 30) {
        finishLevel();
      } else {
        currentQIndex++;
        resetForNextQuestion();
      }
    }, 1600);
  }

  function finishLevel() {
    const percent = (levelScore / 30) * 100;
    const passed = percent >= 80;
    if (passed && currentLevel < 5) {
      showModal(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉<br>Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>🕯️ You pass! Advancing to Level ${currentLevel+1}.`, true);
    } else if (passed && currentLevel === 5) {
      showModal(`🏆🙌 TEACHINGS OF JESUS MASTER! 🙌🏆<br>You completed all 5 levels!<br>Final Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>You know how to seek the lost, live responsibly, help the needy, and pray persistently!`, false);
    } else {
      showModal(`💔 Level ${currentLevel} FAILED!<br>${levelScore}/30 (${Math.floor(percent)}%)<br>Need 80% to proceed. Restarting Level ${currentLevel}...`, false);
    }
  }

  function showModal(message, advanceToNext) {
    if (timerInterval) clearInterval(timerInterval);
    const modalDiv = document.createElement("div");
    modalDiv.className = "modal-message";
    modalDiv.innerHTML = `
      <div class="modal-card">
        <div>${message}</div>
        <button id="modalConfirmBtn">CONTINUE</button>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById("modalConfirmBtn").onclick = () => {
      modalDiv.remove();
      if (advanceToNext && currentLevel < 5) {
        currentLevel++;
        loadLevel(currentLevel);
      } else if (!advanceToNext && currentLevel === 5 && message.includes("TEACHINGS OF JESUS MASTER")) {
        currentLevel = 1;
        loadLevel(1);
      } else if (!advanceToNext) {
        loadLevel(currentLevel);
      } else {
        loadLevel(currentLevel);
      }
    };
  }

  function loadLevel(level) {
    const startIdx = (level - 1) * 30;
    levelQuestions = masterBank.slice(startIdx, startIdx + 30);
    if (levelQuestions.length < 30) console.warn("Bank issue");
    currentQIndex = 0;
    levelScore = 0;
    totalAttempted = 0;
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    renderGame();
  }

  function resetForNextQuestion() {
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    timeLeft = 40;
    renderGame();
  }

  function capitalizeFirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  loadLevel(1);
</script>
</body>
</html>
