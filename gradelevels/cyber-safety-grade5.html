<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Technology Tells It All | CBC Grade 5 English – Future Tech & Grammar Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #f8fafc;
            background-image: radial-gradient(circle at 10% 20%, rgba(0, 200, 255, 0.05) 2%, transparent 2.5%);
            background-size: 30px 30px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,255,255,0.8);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #38bdf8;
        }

        .game-header {
            background: linear-gradient(98deg, #0f766e, #14b8a6);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #facc15;
        }

        .level-badge {
            background: #facc15;
            color: #0f766e;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #b45309, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #134e4a;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #fef08a;
            margin-right: 6px;
        }

        .progress-area {
            background: #e2e8f0;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #475569;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #14b8a6;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #334155;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #cbd5e1;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #0f172a;
            border: 1px solid #bae6fd;
        }

        .voice-btn {
            background: #14b8a6;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #0f766e;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f766e;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #0f766e;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #bae6fd;
            border-radius: 60px;
            background: #ffffff;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250,204,21,0.3);
        }

        .hint-message {
            background: #f1f5f9;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #334155;
            font-style: italic;
            border-left: 7px solid #facc15;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #0f766e;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #0f3b36;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f3b36;
        }

        .submit-btn {
            background: #facc15;
            color: #0f172a;
            box-shadow: 0 4px 0 #b45309;
            flex: 2;
        }

        .next-btn {
            background: #2c6e5c;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #e6f7f5;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #facc15;
        }

        .timer.warning {
            color: #fef08a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>💻 SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">Tech loading... future awaits!</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word/phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). Tech tells all!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // TECHNOLOGY TELLS IT ALL – CBC Grade 5 English
    // Topics: Listening, Speaking, Reading (Extensive),
    // Grammar: Future time using "will" and "shall"
    // Punctuation: Use of comma
    // Learning through technology
    // 5 levels × 30 questions. Timer 40s. Pass 80% to advance.
    // Voice output, fully responsive, open-ended. Hints when time ≤12s.
    // --------------------------------------------------------------

    // Generate rich, varied question bank (150 questions)
    function generateBankForLevel(level) {
        const bank = [];
        // 5 strands: 0:Future (will/shall)  1:Comma (punctuation)  2:Tech & Learning  3:Reading Extensive  4:Listening/Speaking
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            let category = (i + level * 2) % 5;
            if (level === 1) category = i % 5;
            if (level === 2) category = (i + 3) % 5;
            if (level === 3) category = (i + 1) % 5;
            if (level === 4) category = (i + 4) % 5;
            if (level === 5) category = (i + 2) % 5;

            if (category === 0) { // Future time: will / shall
                const futureBank = [
                    { q: "I ______ (shall/will) help you with the computer tomorrow.", ans: "will", hint: "most common future" },
                    { q: "We ______ (shall/will) learn about AI in class next week.", ans: "shall", hint: "often with I/we for suggestions" },
                    { q: "She ______ (will/shall) become a programmer one day.", ans: "will", hint: "prediction" },
                    { q: "______ we start the online lesson? (will/shall)", ans: "shall", hint: "question with I/we" },
                    { q: "The robot ______ (will/shall) clean the floor every morning.", ans: "will", hint: "certain future action" },
                    { q: "I promise I ______ (will/shall) finish my e-learning course.", ans: "will", hint: "promise" }
                ];
                const pick = futureBank[i % futureBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Punctuation: Comma usage
                const commaBank = [
                    { q: "In the sentence 'I like coding math and science' where does the comma go after 'coding'? Add the word ______ (comma).", ans: "comma", hint: "punctuation mark ," },
                    { q: "Use a comma before ______ (and/but) when joining two sentences.", ans: "and", hint: "coordinating conjunction" },
                    { q: "In dates: 'Monday May 5 2025' – put a comma after ______ (May 5).", ans: "may 5", hint: "between day and year" },
                    { q: "After 'Yes' or 'No' in a sentence, add a ______.", ans: "comma", hint: "punctuation for pause" },
                    { q: "In 'We will use tablets laptops and phones' – comma goes before ______ (and).", ans: "and", hint: "Oxford comma optional" },
                    { q: "A comma is used to separate ______ in a list.", ans: "items", hint: "words in a series" }
                ];
                const pick = commaBank[i % commaBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Learning through technology
                const techBank = [
                    { q: "An online learning platform is called an ______ (LMS).", ans: "lms", hint: "Learning Management System" },
                    { q: "You ______ (will/shall) use a keyboard to type.", ans: "will", hint: "future necessity" },
                    { q: "We ______ (shall/will) research using the internet.", ans: "will", hint: "future action" },
                    { q: "A ______ is a device that displays information.", ans: "screen", hint: "monitor" },
                    { q: "To save a file, click the ______ icon.", ans: "save", hint: "floppy disk symbol" },
                    { q: "Video calls help us ______ (learn) remotely.", ans: "learn", hint: "acquire knowledge" }
                ];
                const pick = techBank[i % techBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Reading (Extensive) – passages about tech future
                const readingBank = [
                    { q: "The article said: 'By 2030, robots ______ (will/shall) teach in classrooms.'", ans: "will", hint: "future prediction" },
                    { q: "One comma rule: 'Before we start, ______ (pause/run) we check the Wi-Fi.'", ans: "pause", hint: "comma creates a pause" },
                    { q: "Extensive reading helps build ______ (vocabulary).", ans: "vocabulary", hint: "words knowledge" },
                    { q: "The story 'Tech Future' said: 'I think we ______ (will/shall) have smart glasses.'", ans: "will", hint: "belief" },
                    { q: "In the dialogue, the teacher said: '______ we explore coding?' (Will/Shall)", ans: "shall", hint: "suggestion" }
                ];
                const pick = readingBank[i % readingBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Listening & Speaking (tech conversations, pronunciation)
                const lsBank = [
                    { q: "When listening to a tech podcast, you should take ______ (notes).", ans: "notes", hint: "written key points" },
                    { q: "Speak ______ (clearly/slowly) when explaining how to use an app.", ans: "clearly", hint: "enunciate" },
                    { q: "The word 'technology' has ______ syllables.", ans: "four", hint: "tech-nol-o-gy" },
                    { q: "A good speaker uses ______ (commas/pauses) when listing ideas.", ans: "pauses", hint: "brief stops" },
                    { q: "After a presentation, ask ______ questions.", ans: "polite", hint: "respectful" }
                ];
                const pick = lsBank[i % lsBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech synthesis
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 Hint appears when ≤12s remain. Future tech is yours!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ TIME'S UP! Correct answer: "${currentCorrectAnswer.toUpperCase()}". Press NEXT for next tech mission.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "🤖 Type your answer. The future of tech starts now! 🤖";
        hintArea.innerHTML = "💡 Hint appears when time runs low. Use 'will' and 'shall' wisely!";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT to continue learning tech.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        const correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible matching for grade 5
        if (userAns === correct) isCorrect = true;
        else if (correct === "will" && (userAns === "shall" && !currentQuestions[currentIndex].text.includes("Shall"))) isCorrect = false;
        else if (correct === "shall" && userAns === "will" && currentQuestions[currentIndex].text.includes("Shall we start")) isCorrect = true;
        else if (correct === "comma" && (userAns === "comma punctuation" || userAns === ",")) isCorrect = true;
        else if (correct === "and" && (userAns === "and then")) isCorrect = true;
        else if (correct === "may 5" && (userAns === "may five")) isCorrect = true;
        else if (correct === "items" && (userAns === "words" || userAns === "elements")) isCorrect = true;
        else if (correct === "lms" && (userAns === "learning management system")) isCorrect = true;
        else if (correct === "screen" && (userAns === "monitor" || userAns === "display")) isCorrect = true;
        else if (correct === "save" && (userAns === "save button")) isCorrect = true;
        else if (correct === "learn" && (userAns === "study")) isCorrect = true;
        else if (correct === "vocabulary" && (userAns === "words")) isCorrect = true;
        else if (correct === "notes" && (userAns === "note")) isCorrect = true;
        else if (correct === "clearly" && (userAns === "clear")) isCorrect = true;
        else if (correct === "four" && (userAns === "4")) isCorrect = true;
        else if (correct === "pauses" && (userAns === "pause")) isCorrect = true;
        else if (correct === "polite" && (userAns === "kind")) isCorrect = true;
        else if (userAns.includes(correct) && correct.length > 3 && !correct.includes(" ")) isCorrect = true;
        else if (correct.includes(userAns) && userAns.length > 2) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! Technology is your superpower.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ TECH GLITCH! Correct answer: "${correct.toUpperCase()}". You typed "${userAns}". Keep exploring the future!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first or let the timer finish.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 TECH MASTER! 🏆", `You conquered all levels with ${percent.toFixed(0)}%! You've mastered 'will', 'shall', commas, and tech learning. Mission accomplished!`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉`, `Score: ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}? The future is bright!`, false);
            }
        } else {
            showLevelTransition(`⚠️ TECH UPGRADE NEEDED`, `You scored ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to master future tense and commas.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">💻 PLAY AGAIN 💻</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the adventure
    initLevel();
</script>
</body>
</html>
