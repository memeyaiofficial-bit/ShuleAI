<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade 1 CBC Maths: Capacity | Comparing & Measuring</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffaa4a;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #e07c2c;
        }

        .level-badge {
            background: #2e7d64;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1e5a48, 0 4px 10px rgba(0,0,0,0.1);
        }

        .score-box {
            background: #f9a825;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #2c2c2c;
        }

        .timer-area {
            background: #1f2f3a;
            padding: 6px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: bold;
        }

        .timer-clock {
            font-size: 1.9rem;
            font-family: monospace;
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            letter-spacing: 2px;
        }

        .question-card {
            padding: 30px 35px 20px;
            text-align: center;
        }

        .question-text {
            font-size: 1.8rem;
            background: #fff2df;
            padding: 25px 20px;
            border-radius: 70px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 12px 20px rgba(0,0,0,0.1);
            font-weight: bold;
            margin-bottom: 30px;
            border: 3px solid #ffcf9a;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .voice-btn, .next-btn {
            background: #ffe0b5;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #b97f3a;
            color: #3b2a1f;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .next-btn {
            background: #66bb6a;
            box-shadow: 0 4px 0 #2e6b2f;
            color: white;
        }

        .voice-btn:active, .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b97f3a;
        }

        .next-btn:active {
            box-shadow: 0 1px 0 #2e6b2f;
        }

        .hint-area {
            background: #ffcd94;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #3b2a1f;
            box-shadow: none;
            min-height: 70px;
        }

        .answer-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 20px;
        }

        #studentAnswer {
            flex: 2;
            min-width: 200px;
            font-size: 1.5rem;
            padding: 18px 24px;
            border-radius: 60px;
            border: 3px solid #ffb465;
            font-family: inherit;
            text-align: center;
            background: white;
            outline: none;
        }

        .submit-btn {
            background: #4caf50;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e6b2f;
            transition: 0.05s linear;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2e6b2f;
        }

        .feedback {
            margin: 15px 20px 25px;
            padding: 12px;
            font-size: 1.3rem;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
        }

        .progress-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #7b5a3b;
        }

        @media (max-width: 650px) {
            .game-header {
                flex-direction: column;
                text-align: center;
            }
            .question-text {
                font-size: 1.3rem;
            }
            #studentAnswer {
                font-size: 1.2rem;
                padding: 14px 18px;
            }
            .submit-btn {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🧴 LEVEL 1</div>
        <div class="score-box" id="scoreDisplay">✅ SCORE: 0 / 0</div>
        <div class="timer-area">
            ⏱️ TIME LEFT
            <span class="timer-clock" id="timerCountdown">40</span>
        </div>
    </div>

    <div class="question-card">
        <div class="question-text" id="questionText">Loading fun challenge...</div>
        <div class="action-buttons">
            <button class="voice-btn" id="readAloudBtn">🔊 READ QUESTION</button>
            <button class="next-btn" id="nextQuestionBtn">⏩ NEXT QUESTION</button>
        </div>
        <div class="hint-area" id="hintBox">💡 Hint will appear here as time goes</div>
        <div class="answer-area">
            <input type="text" id="studentAnswer" placeholder="Type your answer..." autocomplete="off">
            <button class="submit-btn" id="submitAnswer">✔️ CHECK ANSWER</button>
        </div>
        <div class="feedback" id="feedbackMsg">🧴 Answer each question! 80% needed to level up.</div>
        <div class="progress-info" id="progressInfo">Question 1 / 30</div>
    </div>
</div>

<script>
    (function() {
        // Speech helper
        function speakText(text, isTimeUp = false) {
            try {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                if (isTimeUp) utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch(e) {
                console.log("Speech error:", e);
            }
        }
        
        // ---------- QUESTION BANK (2 main topics with variations) ----------
        // Topics: 
        // 1. Comparing capacity (which holds more/less, more than/less than)
        // 2. Measuring capacity (using units like litres, millilitres, cups)
        
        const allQuestions = [];
        
        // Helper function to add questions
        function addQuestions(arr) {
            for (let i = 0; i < arr.length; i++) {
                allQuestions.push(arr[i]);
            }
        }
        
        // TOPIC 1: Comparing capacity (which holds more, which holds less, more than, less than)
        const compareCapacityBank = [
            { text: "Which holds more water: a bucket or a cup?", correct: "bucket", alt: "bucket", topic: "Compare Capacity" },
            { text: "Which holds less: a bathtub or a spoon?", correct: "spoon", alt: "spoon", topic: "Compare Capacity" },
            { text: "A swimming pool holds ______ water than a glass.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "A teaspoon holds ______ liquid than a jug.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "Which has greater capacity: a water tank or a watering can?", correct: "water tank", alt: "tank", topic: "Compare Capacity" },
            { text: "Which has smaller capacity: a fish bowl or an ocean?", correct: "fish bowl", alt: "bowl", topic: "Compare Capacity" },
            { text: "A milk carton holds ______ milk than a cup.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "A test tube holds ______ liquid than a bucket.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "Which holds more: a barrel or a bottle?", correct: "barrel", alt: "barrel", topic: "Compare Capacity" },
            { text: "Which holds less: a soda can or a water cooler?", correct: "soda can", alt: "can", topic: "Compare Capacity" },
            { text: "A bathtub can hold ______ water than a sink.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "A cup holds ______ juice than a jug.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "Which has more capacity: a lake or a puddle?", correct: "lake", alt: "lake", topic: "Compare Capacity" },
            { text: "A baby bottle holds ______ milk than a large bottle.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "A large pot holds ______ soup than a small bowl.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "Which holds more: a laundry basket or a cup?", correct: "laundry basket", alt: "basket", topic: "Compare Capacity" },
            { text: "A thimble holds ______ water than a fish tank.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "A water cooler holds ______ water than a glass.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "Which holds less: a bucket or a swimming pool?", correct: "bucket", alt: "bucket", topic: "Compare Capacity" },
            { text: "A small jar holds ______ cookies than a big jar.", correct: "less", alt: "less", topic: "Compare Capacity" }
        ];
        
        // TOPIC 2: Measuring capacity (using units, tools, estimating)
        const measureCapacityBank = [
            { text: "What tool is used to measure capacity?", correct: "measuring cup", alt: "measuring jug", topic: "Measure Capacity" },
            { text: "What unit is used to measure liquid capacity?", correct: "litre", alt: "liter", topic: "Measure Capacity" },
            { text: "How many millilitres are in one litre?", correct: "1000", alt: "one thousand", topic: "Measure Capacity" },
            { text: "A small bottle of water usually contains ___ millilitres.", correct: "500", alt: "five hundred", topic: "Measure Capacity" },
            { text: "A large soda bottle holds about 2 ___ of liquid.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "A teaspoon holds about 5 ___ of liquid.", correct: "millilitres", alt: "ml", topic: "Measure Capacity" },
            { text: "A cup holds about 250 ___ of water.", correct: "millilitres", alt: "ml", topic: "Measure Capacity" },
            { text: "A bathtub can hold about 100 ___ of water.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "A swimming pool holds thousands of ___ of water.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "What does 'ml' stand for?", correct: "millilitres", alt: "milliliters", topic: "Measure Capacity" },
            { text: "A medicine spoon holds about 5 ___", correct: "millilitres", alt: "ml", topic: "Measure Capacity" },
            { text: "A bucket can hold about 10 ___ of water.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "A small juice box contains 200 ___", correct: "millilitres", alt: "ml", topic: "Measure Capacity" },
            { text: "Half a litre is the same as ___ millilitres.", correct: "500", alt: "five hundred", topic: "Measure Capacity" },
            { text: "A large cooking pot can hold 5 ___ of soup.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "A standard drinking glass holds about ___ ml.", correct: "250", alt: "two hundred fifty", topic: "Measure Capacity" },
            { text: "A baby's bottle holds about 200 ___ of milk.", correct: "millilitres", alt: "ml", topic: "Measure Capacity" },
            { text: "A watering can holds about 5 ___ of water.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "A fish tank might hold 50 ___ of water.", correct: "litres", alt: "liters", topic: "Measure Capacity" },
            { text: "One litre is equal to ___ millilitres.", correct: "1000", alt: "one thousand", topic: "Measure Capacity" }
        ];
        
        // Additional mixed questions for more variety
        const mixedCapacityBank = [
            { text: "If you pour water from a small cup into a large jug, does the jug have more or less capacity?", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "Can a teaspoon hold more water than a bucket?", correct: "no", alt: "false", topic: "Compare Capacity" },
            { text: "A rain barrel holds ______ water than a rain gauge.", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "A test tube holds ______ water than a beaker.", correct: "less", alt: "less", topic: "Compare Capacity" },
            { text: "Which container would you use to measure medicine: a teaspoon or a bucket?", correct: "teaspoon", alt: "spoon", topic: "Measure Capacity" },
            { text: "What do we call the amount a container can hold?", correct: "capacity", alt: "volume", topic: "Measure Capacity" },
            { text: "If two bottles both hold 1 litre, their capacity is the ______.", correct: "same", alt: "equal", topic: "Compare Capacity" },
            { text: "A mug holds ______ than a teacup (more/less).", correct: "more", alt: "more", topic: "Compare Capacity" },
            { text: "A measuring jug usually has marks for ___ and ___.", correct: "millilitres litres", alt: "ml l", topic: "Measure Capacity" },
            { text: "A large fish tank holds more water than a small ______.", correct: "bowl", alt: "fishbowl", topic: "Compare Capacity" }
        ];
        
        // Add all questions to master bank
        addQuestions(compareCapacityBank);
        addQuestions(measureCapacityBank);
        addQuestions(mixedCapacityBank);
        
        console.log("Total questions in bank:", allQuestions.length);
        
        // Fisher-Yates shuffle
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        // Generate 30 UNIQUE questions per level with balanced topics (15 from each main topic)
        function generateLevelQuestions() {
            // Shuffle master bank
            let shuffled = shuffleArray([...allQuestions]);
            
            // Group by topic
            const compareCap = shuffled.filter(q => q.topic === "Compare Capacity");
            const measureCap = shuffled.filter(q => q.topic === "Measure Capacity");
            
            // Take 15 from each topic to make 30
            let selected = [];
            selected = selected.concat(compareCap.slice(0, 15));
            selected = selected.concat(measureCap.slice(0, 15));
            
            // Ensure we have 30 questions
            while (selected.length < 30) {
                selected.push(allQuestions[selected.length % allQuestions.length]);
            }
            if (selected.length > 30) selected = selected.slice(0, 30);
            
            // Shuffle and ensure uniqueness
            selected = shuffleArray(selected);
            const unique = [];
            const seen = new Set();
            for (let i = 0; i < selected.length; i++) {
                if (!seen.has(selected[i].text)) {
                    seen.add(selected[i].text);
                    unique.push(selected[i]);
                }
            }
            while (unique.length < 30) {
                unique.push(allQuestions[unique.length % allQuestions.length]);
            }
            return unique.slice(0, 30);
        }
        
        // DOM elements
        const levelDisplay = document.getElementById('levelDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerSpan = document.getElementById('timerCountdown');
        const questionDiv = document.getElementById('questionText');
        const answerInput = document.getElementById('studentAnswer');
        const submitBtn = document.getElementById('submitAnswer');
        const readBtn = document.getElementById('readAloudBtn');
        const nextBtn = document.getElementById('nextQuestionBtn');
        const hintBoxDiv = document.getElementById('hintBox');
        const feedbackDiv = document.getElementById('feedbackMsg');
        const progressSpan = document.getElementById('progressInfo');
        
        // Game state
        let currentLevel = 0;
        let currentQIndex = 0;
        let currentQuestions = [];
        let correctCount = 0;
        let answeredCount = 0;
        let timerInterval = null;
        let timeLeft = 40;
        let waitingForAnswer = true;
        let answerSubmitted = false;
        let currentQuestion = null;
        let gameActive = true;
        let levelLocked = false;
        
        function updateUI() {
            scoreDisplay.innerText = "✅ SCORE: " + correctCount + " / " + answeredCount;
            progressSpan.innerText = "Question " + (answeredCount + 1) + " / " + currentQuestions.length;
        }
        
        function getTopicEmoji(topic) {
            if (topic === "Compare Capacity") return "🧴⚖️";
            if (topic === "Measure Capacity") return "📏🧴";
            return "💧";
        }
        
        function updateHint(seconds, q) {
            if (!q) return;
            const emoji = getTopicEmoji(q.topic);
            if (seconds > 28) {
                hintBoxDiv.innerHTML = emoji + " Topic: " + q.topic + ". Think about how much liquid a container can hold!";
            } else if (seconds > 18) {
                hintBoxDiv.innerHTML = "🔎 Hint: Imagine filling the container with water. Which one would fill up faster?";
            } else if (seconds > 8) {
                let answerHint = q.correct;
                hintBoxDiv.innerHTML = "✨ Strong hint: The answer is \"" + answerHint + "\". Type it now!";
            } else if (seconds > 2) {
                hintBoxDiv.innerHTML = "🚀 Last " + seconds + " seconds! Answer: " + q.correct + " . Quickly!";
            } else {
                hintBoxDiv.innerHTML = "⏰ Almost out of time! Type 'more', 'less', or the container name!";
            }
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function startTimer() {
            if (timerInterval) stopTimer();
            timeLeft = 40;
            timerSpan.innerText = timeLeft;
            updateHint(timeLeft, currentQuestion);
            timerInterval = setInterval(function() {
                if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (waitingForAnswer && !answerSubmitted) {
                        speakText("Time is up!", true);
                        waitingForAnswer = false;
                        answerSubmitted = true;
                        feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                        feedbackDiv.style.background = "#ffccbb";
                        setTimeout(function() {
                            if (!levelLocked) moveToNext();
                        }, 1500);
                    }
                } else {
                    timeLeft--;
                    timerSpan.innerText = timeLeft;
                    updateHint(timeLeft, currentQuestion);
                }
            }, 1000);
        }
        
        function checkAnswer() {
            if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ Wait! Already answered or question finished.";
                return;
            }
            let userAnswer = answerInput.value.trim().toLowerCase();
            if (userAnswer === "") {
                speakText("Please type an answer.");
                feedbackDiv.innerHTML = "✏️ Type your answer before checking!";
                return;
            }
            
            // Normalize common variations
            const normalizedMap = {
                // Comparisons
                "more": "more", "less": "less", "same": "same", "equal": "same",
                "bucket": "bucket", "cup": "cup", "bathtub": "bathtub", "spoon": "spoon",
                "swimming pool": "swimming pool", "pool": "swimming pool", "glass": "glass",
                "teaspoon": "teaspoon", "jug": "jug", "water tank": "water tank", "tank": "water tank",
                "watering can": "watering can", "fish bowl": "fish bowl", "bowl": "fish bowl",
                "ocean": "ocean", "milk carton": "milk carton", "test tube": "test tube", "tube": "test tube",
                "barrel": "barrel", "bottle": "bottle", "soda can": "soda can", "can": "soda can",
                "water cooler": "water cooler", "sink": "sink", "lake": "lake", "puddle": "puddle",
                "baby bottle": "baby bottle", "large bottle": "large bottle", "pot": "pot",
                "laundry basket": "laundry basket", "basket": "laundry basket", "thimble": "thimble",
                "fish tank": "fish tank", "bucket": "bucket", "small jar": "small jar", "big jar": "big jar",
                "yes": "yes", "no": "no", "true": "yes", "false": "no",
                // Measurement
                "measuring cup": "measuring cup", "measuring jug": "measuring cup",
                "litre": "litre", "liter": "litre", "litres": "litre", "liters": "litre",
                "millilitre": "millilitre", "milliliter": "millilitre", "millilitres": "millilitre", "ml": "millilitre",
                "1000": "1000", "one thousand": "1000", "thousand": "1000",
                "500": "500", "five hundred": "500", "200": "200", "250": "250", "5": "5",
                "2": "2", "10": "10", "50": "50", "100": "100",
                "capacity": "capacity", "volume": "capacity",
                "measuring jug": "measuring cup",
                "millilitres litres": "millilitres litres", "ml l": "millilitres litres"
            };
            
            let normalizedAnswer = normalizedMap[userAnswer] || userAnswer;
            const correctAns = currentQuestion.correct.toLowerCase();
            const altAns = currentQuestion.alt ? currentQuestion.alt.toLowerCase() : "";
            
            // Handle numeric comparisons
            let isCorrect = false;
            if (normalizedAnswer === correctAns) {
                isCorrect = true;
            } else if (altAns !== "" && normalizedAnswer === altAns) {
                isCorrect = true;
            } else if (!isNaN(parseFloat(normalizedAnswer)) && !isNaN(parseFloat(correctAns))) {
                if (parseFloat(normalizedAnswer) === parseFloat(correctAns)) isCorrect = true;
                else if (altAns !== "" && parseFloat(normalizedAnswer) === parseFloat(altAns)) isCorrect = true;
            }
            
            answerSubmitted = true;
            waitingForAnswer = false;
            stopTimer();
            
            if (isCorrect) {
                correctCount++;
                speakText("Correct! Great job!");
                feedbackDiv.innerHTML = "🎉 CORRECT! +1 point 🎉";
                feedbackDiv.style.background = "#c8e6c9";
            } else {
                speakText("Incorrect. The correct answer is " + currentQuestion.correct + ".");
                feedbackDiv.innerHTML = "❌ INCORRECT! The right answer: \"" + currentQuestion.correct + "\". Keep trying!";
                feedbackDiv.style.background = "#ffcdd2";
            }
            answeredCount++;
            updateUI();
            submitBtn.disabled = true;
            answerInput.disabled = true;
        }
        
        function moveToNext() {
            if (levelLocked) return;
            if (answeredCount >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQIndex++;
            loadQuestion(currentQIndex);
        }
        
        function finishLevel() {
            const percent = (correctCount / currentQuestions.length) * 100;
            if (percent >= 80) {
                if (currentLevel + 1 < 5) {
                    speakText("Excellent! You passed level " + (currentLevel+1) + " with " + Math.floor(percent) + " percent. Get ready for level " + (currentLevel+2) + ".");
                    feedbackDiv.innerHTML = "🎊 LEVEL UP! 🎊 You scored " + correctCount + "/" + currentQuestions.length + " (" + Math.floor(percent) + "%) → Next Level!";
                    feedbackDiv.style.background = "#ffecb3";
                    currentLevel++;
                    loadLevel(currentLevel);
                } else {
                    gameActive = false;
                    stopTimer();
                    levelLocked = true;
                    feedbackDiv.innerHTML = "🏆🏆🏆 GRAND CHAMPION! You completed all 5 levels! Final score: " + correctCount + "/" + currentQuestions.length + " 🏆🏆🏆";
                    speakText("Congratulations! You finished the CBC Grade 1 Capacity challenge! You are a maths superstar!");
                    submitBtn.disabled = true;
                    readBtn.disabled = true;
                    nextBtn.disabled = true;
                    answerInput.disabled = true;
                    timerSpan.innerText = "🎉";
                    return;
                }
            } else {
                speakText("Oh no! You got " + correctCount + " out of " + currentQuestions.length + ". Need 80 percent to pass. Restarting level " + (currentLevel+1) + " with new questions.");
                feedbackDiv.innerHTML = "⚠️ " + Math.floor(percent) + "% only. Need 80% to pass. Same level restarts with fresh questions! ⚠️";
                feedbackDiv.style.background = "#ffb3ba";
                loadLevel(currentLevel);
            }
        }
        
        function loadQuestion(index) {
            if (index >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQuestion = currentQuestions[index];
            questionDiv.innerText = currentQuestion.text;
            waitingForAnswer = true;
            answerSubmitted = false;
            submitBtn.disabled = false;
            answerInput.disabled = false;
            answerInput.value = "";
            answerInput.focus();
            feedbackDiv.style.background = "#fff3e0";
            feedbackDiv.innerHTML = "🧴 Type your answer and click CHECK!";
            updateUI();
            if (timerInterval) stopTimer();
            startTimer();
        }
        
        function loadLevel(levelIdx) {
            levelLocked = false;
            gameActive = true;
            currentLevel = levelIdx;
            currentQIndex = 0;
            correctCount = 0;
            answeredCount = 0;
            currentQuestions = generateLevelQuestions();
            levelDisplay.innerText = "🧴 LEVEL " + (currentLevel+1) + " 💧";
            updateUI();
            loadQuestion(0);
        }
        
        function readQuestion() {
            if (currentQuestion && gameActive && !levelLocked) {
                speakText(currentQuestion.text);
            } else if (!currentQuestion) {
                speakText("No question loaded");
            }
        }
        
        function manualNext() {
            if (levelLocked || !gameActive) {
                feedbackDiv.innerHTML = "⚠️ Level transition or game finished!";
                return;
            }
            if (waitingForAnswer && !answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ You haven't answered yet! Please check your answer first.";
                speakText("Please check your answer before moving.");
                return;
            }
            if (answerSubmitted && !waitingForAnswer) {
                stopTimer();
                moveToNext();
            }
        }
        
        // Event listeners
        submitBtn.addEventListener('click', checkAnswer);
        readBtn.addEventListener('click', readQuestion);
        nextBtn.addEventListener('click', manualNext);
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !answerSubmitted && waitingForAnswer) {
                checkAnswer();
            }
        });
        
        // Start game
        loadLevel(0);
    })();
</script>
</body>
</html>
