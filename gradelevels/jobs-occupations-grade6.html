<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎓 Shule AI Plus+ | Complete Career English | CBC Grade 6</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #e6f0ff 0%, #b8d4ff 100%);
    font-family: 'Nunito', 'Poppins', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 1rem;
}
.game-container {
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 2rem;
    box-shadow: 0 30px 40px -18px rgba(0, 20, 70, 0.45);
    overflow: hidden;
    border: 1px solid rgba(59,130,246,0.3);
}
.mode-tabs {
    display: flex;
    background: #0f3b6f;
    border-bottom: 3px solid #ffcd3c;
    gap: 2px;
    flex-wrap: wrap;
}
.tab-btn {
    flex: 1;
    background: #1e5a9e;
    color: #fef9e0;
    border: none;
    padding: 12px 5px;
    font-size: 0.7rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    text-align: center;
}
.tab-btn.active {
    background: linear-gradient(135deg, #ffcd3c, #f9a826);
    color: #0a2f5a;
}
.game-header {
    background: #0f3b6f;
    padding: 0.7rem 1rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    border-bottom: 4px solid #ffcd3c;
}
.title-section h1 {
    font-size: 1rem;
    color: white;
    text-shadow: 0 2px 0 #0a2f5a;
}
.title-section p {
    font-size: 0.55rem;
    background: #ffcd3c20;
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 30px;
    color: #ffe6a3;
}
.score-board {
    background: #ffcd3c;
    padding: 0.2rem 0.6rem;
    border-radius: 50px;
    color: #0a2f5a;
    font-weight: bold;
    font-size: 1rem;
    box-shadow: 0 3px 0 #b27f1a;
    display: flex;
    align-items: center;
    gap: 4px;
}
.score-board span { font-size: 0.65rem; font-weight: 700; }
.level-zone {
    background: #f0f7fe;
    padding: 0.4rem 0.8rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #7fb4ff;
    gap: 6px;
}
.level-buttons { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.level-btn {
    background: white;
    border: none;
    font-weight: bold;
    padding: 0.3rem 0.6rem;
    border-radius: 40px;
    font-size: 0.65rem;
    cursor: pointer;
    transition: 0.2s;
    color: #06558a;
    border: 1px solid #ffcd3c;
}
.level-btn.active { background: #ffcd3c; color: #0a2f5a; transform: scale(1.02); }
.level-btn.locked { opacity: 0.6; cursor: not-allowed; background: #e2e8f0; color: #3a5a7a; }
.kenyan-fact {
    background: #fff3cf;
    padding: 0.2rem 0.6rem;
    border-radius: 60px;
    font-size: 0.6rem;
    font-weight: 600;
    color: #035c8f;
}
.quiz-main { padding: 0.8rem; background: #ffffff; min-height: 350px; }
.progress-area {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
    gap: 5px;
}
.q-counter {
    background: #eef3fc;
    padding: 0.2rem 0.6rem;
    border-radius: 40px;
    font-weight: 700;
    color: #115e8c;
    font-size: 0.7rem;
}
.hint-box {
    background: #fef6df;
    border-left: 4px solid #ffcd3c;
    padding: 0.3rem 0.6rem;
    border-radius: 28px;
    font-size: 0.65rem;
    font-weight: 600;
    color: #4a2f00;
}
.reading-passage {
    background: #fafdff;
    border-radius: 1rem;
    padding: 0.6rem;
    margin: 0.5rem 0;
    border: 1px solid #d4e6ff;
    font-size: 0.75rem;
    line-height: 1.4;
    color: #2c4e6e;
}
.visual-card {
    background: #f0f7ff;
    border-radius: 1rem;
    padding: 0.6rem;
    margin: 0.5rem 0;
    text-align: center;
    border: 2px solid #cde0ff;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.visual-icon { font-size: 2rem; background: white; padding: 0.2rem; border-radius: 1rem; min-width: 55px; }
.visual-text { flex: 1; font-size: 0.7rem; color: #2c4e6e; text-align: left; }
.question-text {
    font-size: 0.9rem;
    font-weight: 700;
    color: #0a2f44;
    margin: 0.6rem 0;
    background: #fafdff;
    padding: 0.4rem;
    border-radius: 30px;
    border: 1px solid #d4e6ff;
}
.answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.5rem;
    margin: 0.8rem 0;
}
.answer-card {
    background: #f9fbfe;
    border: 2px solid #cde0ff;
    border-radius: 60px;
    padding: 0.4rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    text-align: center;
    color: #1a4972;
    font-size: 0.7rem;
}
.answer-card:hover:not(.disabled-answer) { background: #ffebbb; border-color: #ffcd3c; transform: scale(0.97); }
.correct-feedback { background: #c8f0d1; border-color: #15803d; color: #14532d; }
.wrong-feedback { background: #ffe0db; border-color: #dc2626; color: #991b1b; text-decoration: line-through; }
.disabled-answer { pointer-events: none; opacity: 0.8; }
.next-btn {
    background: #ffcd3c;
    border: none;
    font-weight: bold;
    font-size: 0.8rem;
    padding: 0.4rem 1rem;
    border-radius: 80px;
    color: #02457a;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 0.5rem;
    width: 100%;
    max-width: 140px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 3px 0 #b27f1a;
}
.next-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b27f1a; }
.next-btn:disabled { background: #bcbcbc; cursor: not-allowed; box-shadow: none; }
.level-complete { text-align: center; background: #eef2ff; padding: 0.8rem; border-radius: 1.5rem; font-weight: bold; color: #156f9c; border: 2px solid #ffcd3c; font-size: 0.7rem; }
footer { background: #eef3fc; padding: 0.4rem; font-size: 0.55rem; text-align: center; color: #3282a7; border-top: 2px dotted #ffcd3c; }

/* Voice specific */
.voice-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin: 0.6rem 0; }
.listen-btn, .microphone-btn {
    background: #2b7a4b;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 0.4rem 1rem;
    border-radius: 60px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 0 #1a4a2e;
}
.microphone-btn { background: #0284c7; box-shadow: 0 2px 0 #0369a1; }
.microphone-btn.listening { background: #dc2626; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
.status { padding: 0.4rem; border-radius: 60px; font-weight: 600; font-size: 0.65rem; text-align: center; margin-top: 0.4rem; }
.good-status { background: #c8f0d1; color: #14532d; }
.bad-status { background: #ffe0db; color: #991b1b; }
.warning-status { background: #fff3cd; color: #856404; }
.success-message { background: #c8f0d1; color: #14532d; padding: 0.4rem; border-radius: 60px; font-weight: bold; margin: 0.4rem 0; animation: fadeInScale 0.4s ease-out; font-size: 0.7rem; }
@keyframes fadeInScale { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

@media (max-width: 680px) {
    .tab-btn { font-size: 0.55rem; padding: 8px 3px; }
    .question-text { font-size: 0.8rem; }
    .answers-grid { grid-template-columns: 1fr; }
    .voice-controls { flex-direction: column; align-items: center; }
    .visual-card { flex-direction: column; text-align: center; }
    .visual-text { text-align: center; }
}
</style>
</head>
<body>
<div class="game-container" id="app">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabReading">📖 Career Reading</button>
        <button class="tab-btn" id="TabQuantifiers">📊 Quantifiers</button>
        <button class="tab-btn" id="TabPictures">🖼️ Picture Jobs</button>
        <button class="tab-btn" id="TabVoice">🎤 Career Voice</button>
    </div>
    <div class="game-header">
        <div class="title-section"><h1>🎓 Shule AI Plus+ 🌟</h1><p>CBC Grade 6 Career English</p></div>
        <div class="score-board">🏆 <span id="totalScoreDisplay">0</span> pts</div>
    </div>
    <div class="level-zone">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="kenyan-fact" id="kenyanFactArea">🇰🇪 Kenya: Career skills open doors to the future!</div>
    </div>
    <div class="quiz-main" id="quizMain"></div>
    <footer>📖 Read • 📊 Quantifiers • 🖼️ Pictures • 🎤 Speak — Master Career English!</footer>
</div>

<script>
    // ==============================================================
    // MERGED: 4 Modes - Career Reading, Quantifiers, Picture Jobs, Career Voice
    // Each mode: 4 levels × 15 questions
    // Pass: 12/15 (80%) to unlock next level
    // ==============================================================

    // ---------- MODE 1: CAREER READING (Passages about Jobs) ----------
    const passages = [
        "Doctors diagnose and treat illnesses. They work in hospitals and clinics. A good doctor is compassionate and patient.",
        "Teachers prepare lessons and help students learn. They work in schools. Good teachers are patient and creative.",
        "Construction workers build houses and roads. They work on building sites. Safety is very important for them.",
        "Farmers grow crops and raise animals. They work on farms. Hard work and patience are key values for farmers."
    ];
    const readingQuestions = [
        { text: "What does a doctor do?", options: ["Diagnose and treat illnesses", "Teach students", "Build houses", "Drive trucks"], correct: 0, hint: "Medical professional" },
        { text: "Where do teachers work?", options: ["Schools", "Hospitals", "Farms", "Construction sites"], correct: 0, hint: "Learning place" },
        { text: "What is important for construction workers?", options: ["Safety", "Creativity", "Speed", "Art"], correct: 0, hint: "Protection" },
        { text: "What do farmers do?", options: ["Grow crops and raise animals", "Treat patients", "Teach students", "Build houses"], correct: 0, hint: "Agriculture" },
        { text: "What quality makes a good doctor?", options: ["Compassion", "Speed", "Strength", "Creativity"], correct: 0, hint: "Caring" }
    ];
    for(let i=0;i<15;i++) readingQuestions.push({...readingQuestions[i%readingQuestions.length]});
    const readingDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) readingDB[l].push({...readingQuestions[i%readingQuestions.length], passageIdx:l-1});

    // ---------- MODE 2: QUANTIFIERS ----------
    const quantQuestions = [
        { text: "A doctor needs ____ patience.", options: ["a great deal of", "many", "a few", "several"], correct: 0, hint: "Uncountable" },
        { text: "There are ____ job openings.", options: ["a number of", "a great deal of", "a little", "a bit of"], correct: 0, hint: "Countable plural" },
        { text: "She has ____ experience.", options: ["a lot of", "many", "a few", "several"], correct: 0, hint: "Uncountable" },
        { text: "____ employees arrived late.", options: ["A few", "A little", "Much", "A great deal of"], correct: 0, hint: "Countable small number" },
        { text: "He put ____ effort into the job.", options: ["a great deal of", "many", "a few", "several"], correct: 0, hint: "Large amount" }
    ];
    for(let i=0;i<15;i++) quantQuestions.push({...quantQuestions[i%quantQuestions.length]});
    const quantDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) quantDB[l].push({...quantQuestions[i%quantQuestions.length]});

    // ---------- MODE 3: PICTURE JOBS (Visual Icons) ----------
    const pictureVisuals = [
        { icon: "🩺🚑", text: "Medical professionals: doctors, nurses, paramedics" },
        { icon: "📚👩‍🏫", text: "Education: teachers, librarians, professors" },
        { icon: "🔨👷‍♂️", text: "Construction: builders, carpenters, electricians" },
        { icon: "🤝⏰", text: "Work ethics: teamwork, punctuality, integrity" }
    ];
    const pictureQuestions = [
        { text: "🩺 + 🚑 represents which job?", options: ["Doctor/Paramedic", "Teacher", "Farmer", "Pilot"], correct: 0, hint: "Medical" },
        { text: "📚 + 👩‍🏫 represents which profession?", options: ["Teacher", "Doctor", "Mechanic", "Driver"], correct: 0, hint: "Education" },
        { text: "🔨 + 👷‍♂️ represents which worker?", options: ["Construction worker", "Nurse", "Chef", "Pilot"], correct: 0, hint: "Building" },
        { text: "🤝 + ⏰ represents which work ethic?", options: ["Teamwork & punctuality", "Laziness", "Dishonesty", "Greed"], correct: 0, hint: "Working together & on time" },
        { text: "💼 + 📊 represents which office job?", options: ["Accountant/Manager", "Doctor", "Teacher", "Farmer"], correct: 0, hint: "Business" }
    ];
    for(let i=0;i<15;i++) pictureQuestions.push({...pictureQuestions[i%pictureQuestions.length]});
    const pictureDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) pictureDB[l].push({...pictureQuestions[i%pictureQuestions.length], visualIdx:l-1});

    // ---------- MODE 4: CAREER VOICE (Speech Recognition) ----------
    const voiceQuestions = [
        { prompt: "Say the job of a person who treats sick people.", expected: "doctor", hint: "DOC-tor" },
        { prompt: "Say the job of a person who teaches students.", expected: "teacher", hint: "TEE-cher" },
        { prompt: "Say the job of a person who builds houses.", expected: "construction worker", hint: "Builder" },
        { prompt: "Say the job of a person who grows crops.", expected: "farmer", hint: "Grows food" },
        { prompt: "What does 'integrity' mean at work? Say it.", expected: "honesty", hint: "Truthfulness" },
        { prompt: "What is 'punctuality'? Say it.", expected: "being on time", hint: "Not late" },
        { prompt: "What is a 'resume'? Say it.", expected: "job application document", hint: "CV" },
        { prompt: "Say the job of a person who flies planes.", expected: "pilot", hint: "Flies" },
        { prompt: "Say the job of a person who fixes cars.", expected: "mechanic", hint: "Repairs vehicles" },
        { prompt: "Say the job of a person who represents clients in court.", expected: "lawyer", hint: "Legal" },
        { prompt: "What does 'teamwork' mean? Say it.", expected: "working together", hint: "Collaboration" },
        { prompt: "What is a 'salary'? Say it.", expected: "money paid for work", hint: "Pay" },
        { prompt: "Say the job of a person who designs buildings.", expected: "architect", hint: "Designs" },
        { prompt: "What does 'punctuality' mean? Say it.", expected: "being on time", hint: "Timely" },
        { prompt: "What is 'integrity'? Say it.", expected: "honesty", hint: "Truthfulness" }
    ];
    for(let i=0;i<15;i++) voiceQuestions.push({...voiceQuestions[i%voiceQuestions.length]});
    const voiceDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) voiceDB[l].push({...voiceQuestions[i%voiceQuestions.length]});

    const modeBuilders = { reading: (lvl) => readingDB[lvl], quantifiers: (lvl) => quantDB[lvl], pictures: (lvl) => pictureDB[lvl], voice: (lvl) => voiceDB[lvl] };
    const modeNames = { reading:"📖 Career Reading", quantifiers:"📊 Phrasal Quantifiers", pictures:"🖼️ Picture Jobs", voice:"🎤 Career Voice" };
    const modeHasVisuals = { reading: true, quantifiers: false, pictures: true, voice: false };

    let currentMode = "reading";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = 12;
    let answeringLock = false;
    let gameActive = true;
    let levelScores = {1:0,2:0,3:0,4:0};
    let levelUnlocked = {1:true,2:false,3:false,4:false};
    let totalPoints = 0;
    let recognition = null;
    let isListening = false;

    const dynamicDiv = document.getElementById('quizMain');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const totalScoreSpan = document.getElementById('totalScoreDisplay');
    const kenyanFactArea = document.getElementById('kenyanFactArea');
    const facts = ["Career skills open doors to the future!", "Quantifiers help describe amounts at work!", "Pictures help identify jobs quickly!", "Speaking clearly about careers builds confidence!"];

    function updateTotalScore() { totalPoints = Object.values(levelScores).reduce((a,b)=>a+b,0); totalScoreSpan.innerText = totalPoints; }
    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''} ${!levelUnlocked[i] ? 'locked' : ''}`;
            btn.innerText = `Lvl ${i}`;
            btn.onclick = () => { if(levelUnlocked[i] && i !== currentLevel) switchLevel(i); };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchLevel(level) {
        if(!levelUnlocked[level]) return;
        if(recognition) recognition.abort();
        currentLevel = level;
        currentQIndex = 0;
        levelScore = levelScores[level] || 0;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[(level-1)%facts.length]}`;
    }

    function checkLevelCompletion() {
        if(levelScore >= requiredCorrect && currentQIndex >= totalQuestions) {
            if(currentLevel === 4) {
                dynamicDiv.innerHTML = `<div class="level-complete">🏆 You mastered ${modeNames[currentMode]}! 🏆</div>`;
                gameActive = false;
            } else if(!levelUnlocked[currentLevel+1]) {
                levelUnlocked[currentLevel+1] = true;
                updateLevelButtons();
                dynamicDiv.innerHTML = `<div class="level-complete">🎉 UNLOCKED: Level ${currentLevel+1}! 🎉<br><button id="nextLevelBtn" class="next-btn" style="margin-top:0.3rem;">🚀 Next Level</button></div>`;
                document.getElementById('nextLevelBtn')?.addEventListener('click', () => {
                    currentLevel++; currentQIndex=0; levelScore=0; gameActive=true; answeringLock=false;
                    levelQuestions = modeBuilders[currentMode](currentLevel);
                    loadCurrentQuestion(); updateLevelButtons();
                });
            }
        } else if(currentQIndex >= totalQuestions) {
            dynamicDiv.innerHTML = `<div class="level-complete">📘 Score: ${levelScore}/${totalQuestions}. Need ${requiredCorrect} to unlock.<br><button onclick="location.reload()" class="next-btn" style="margin-top:0.3rem;">🔄 Try Again</button></div>`;
            gameActive = false;
        }
    }

    function shuffleAnswers(q) {
        const opts = q.options.map((opt,i) => ({text:opt, isCorrect: i===q.correct}));
        for(let i=opts.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
        return { text:q.text, hint:q.hint, options:opts.map(o=>o.text), correct:opts.findIndex(o=>o.isCorrect), passageIdx:q.passageIdx, visualIdx:q.visualIdx };
    }

    function handleMCAnswer(selectedIdx, correctIdx, item) {
        if(answeringLock || !gameActive) return;
        answeringLock = true;
        const isCorrect = (selectedIdx === correctIdx);
        if(isCorrect) { levelScore++; levelScores[currentLevel] = levelScore; updateTotalScore(); }
        renderMCQuestion(item, isCorrect, correctIdx, selectedIdx);
        if(isCorrect && currentQIndex+1 >= totalQuestions) checkLevelCompletion();
    }

    function renderMCQuestion(item, wasCorrect, correctIdx, selectedIdx) {
        let visualHtml = '';
        if(modeHasVisuals[currentMode] && currentMode === 'reading' && item.passageIdx !== undefined) {
            visualHtml = `<div class="reading-passage">📖 ${passages[item.passageIdx]}</div>`;
        } else if(modeHasVisuals[currentMode] && currentMode === 'pictures' && item.visualIdx !== undefined) {
            const vis = pictureVisuals[item.visualIdx];
            visualHtml = `<div class="visual-card"><div class="visual-icon">${vis.icon}</div><div class="visual-text">${vis.text}</div></div>`;
        }
        let answersHtml = '';
        item.options.forEach((opt, idx) => {
            let cls = '';
            if(wasCorrect !== undefined && idx === correctIdx) cls = 'correct-feedback';
            else if(wasCorrect !== undefined && idx === selectedIdx && idx !== correctIdx) cls = 'wrong-feedback';
            answersHtml += `<div class="answer-card ${cls}">${String.fromCharCode(65+idx)}. ${opt}</div>`;
        });
        const feedback = wasCorrect === true ? '✅ Correct! +1 point' : (wasCorrect === false ? `❌ Correct: ${item.options[correctIdx]}` : '');
        dynamicDiv.innerHTML = `
            <div class="progress-area"><div class="q-counter">Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Lvl ${currentLevel}</div><div class="hint-box">💡 ${item.hint}</div></div>
            ${visualHtml}<div class="question-text">❓ ${item.text}</div><div class="answers-grid" id="answersGrid">${answersHtml}</div>
            ${feedback ? `<div style="text-align:center; font-weight:600; font-size:0.7rem;">${feedback}</div>` : ''}
            ${wasCorrect !== undefined ? `<button id="nextBtnAction" class="next-btn">➡ Next</button>` : ''}
        `;
        if(wasCorrect !== undefined) {
            document.getElementById('nextBtnAction')?.addEventListener('click', () => { currentQIndex++; if(currentQIndex < totalQuestions) { answeringLock = false; loadCurrentQuestion(); } else checkLevelCompletion(); });
        } else {
            document.querySelectorAll('.answer-card').forEach((card, idx) => { card.addEventListener('click', () => handleMCAnswer(idx, item.correct, item)); });
        }
    }

    // Voice Mode
    function speakText(text) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u); }
    function startListening(item) {
        if(answeringLock || !gameActive) return;
        if(!window.SpeechRecognition && !window.webkitSpeechRecognition) { dynamicDiv.innerHTML += `<div class="status bad-status">Voice not supported. Use Chrome.</div>`; return; }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(recognition) recognition.abort();
        recognition = new SpeechRec(); recognition.lang = 'en-US'; recognition.interimResults = false;
        recognition.onstart = () => { isListening = true; const mb = document.getElementById('micBtn'); if(mb) mb.classList.add('listening'); };
        recognition.onend = () => { isListening = false; const mb = document.getElementById('micBtn'); if(mb) mb.classList.remove('listening'); };
        recognition.onresult = (e) => {
            const spoken = e.results[0][0].transcript.toLowerCase().trim();
            const expected = item.expected.toLowerCase();
            const isMatch = spoken === expected || (spoken.includes(expected) && Math.abs(spoken.length-expected.length)<=4);
            answeringLock = true;
            if(isMatch) { levelScore++; levelScores[currentLevel] = levelScore; updateTotalScore(); renderVoiceFeedback(true, item.expected); if(currentQIndex+1 >= totalQuestions) checkLevelCompletion(); }
            else renderVoiceFeedback(false, item.expected);
            recognition = null;
        };
        recognition.onerror = () => { recognition = null; };
        recognition.start();
    }
    function renderVoiceFeedback(isCorrect, correctAnswer) {
        if(isCorrect) {
            dynamicDiv.innerHTML += `<div class="success-message">🎉 CORRECT! +1 point! 🎉</div><button id="nextBtnAction" class="next-btn">➡ Next</button>`;
            document.getElementById('nextBtnAction')?.addEventListener('click', () => { currentQIndex++; if(currentQIndex < totalQuestions) { answeringLock = false; loadCurrentQuestion(); } else checkLevelCompletion(); });
        } else {
            dynamicDiv.innerHTML += `<div class="status bad-status">❌ Incorrect. Answer: "${correctAnswer}". <button id="retryBtn" class="listen-btn" style="margin-top:0.3rem;">🔄 Try Again</button></div>`;
            document.getElementById('retryBtn')?.addEventListener('click', () => { answeringLock = false; loadCurrentQuestion(); });
        }
    }

    function loadCurrentQuestion() {
        if(!gameActive) return;
        if(currentQIndex >= totalQuestions) { checkLevelCompletion(); return; }
        const q = levelQuestions[currentQIndex];
        if(!q) { checkLevelCompletion(); return; }
        if(currentMode === 'voice') {
            dynamicDiv.innerHTML = `
                <div class="progress-area"><div class="q-counter">🎤 Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Lvl ${currentLevel}</div></div>
                <div class="question-card" style="text-align:center; padding:0.8rem;"><div class="hint-text" style="background:#fef6df; display:inline-block; padding:0.2rem 0.6rem; border-radius:40px;">💡 ${q.hint}</div>
                <div class="question-text">🎤 ${q.prompt}</div><div class="voice-controls"><button id="listenBtn" class="listen-btn">🔊 LISTEN</button><button id="micBtn" class="microphone-btn">🎙️ SPEAK</button></div>
                <div id="dynamicStatus" class="status warning-status">Click microphone and speak</div></div>
            `;
            document.getElementById('listenBtn')?.addEventListener('click', () => speakText(q.prompt));
            document.getElementById('micBtn')?.addEventListener('click', () => startListening(q));
        } else {
            const shuffled = shuffleAnswers(q);
            renderMCQuestion(shuffled, undefined, undefined, undefined);
        }
    }

    function initMode(mode) {
        if(recognition) recognition.abort();
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        updateTotalScore();
        updateLevelButtons();
        loadCurrentQuestion();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[0]}`;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabReading').addEventListener('click', () => initMode('reading'));
    document.getElementById('TabQuantifiers').addEventListener('click', () => initMode('quantifiers'));
    document.getElementById('TabPictures').addEventListener('click', () => initMode('pictures'));
    document.getElementById('TabVoice').addEventListener('click', () => initMode('voice'));

    for(let i=1;i<=4;i++) levelScores[i]=0;
    initMode('reading');
</script>
</body>
</html>
