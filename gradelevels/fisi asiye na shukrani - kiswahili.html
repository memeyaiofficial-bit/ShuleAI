<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fisi Asiye na Shukrani - Mchezo wa CBC Darasa la 2 | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #2c2c2c 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #FFF8F0;
            background-image: radial-gradient(circle at 10% 30%, rgba(200,180,140,0.2) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 70px 70px 70px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,255,200,0.6);
            overflow: hidden;
        }

        .game-header {
            background: #5D4037;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #3E2723;
        }

        .level-badge, .score-badge, .progress-badge {
            background: #2c2b28;
            color: #FFD54F;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 -2px 0 #4b3a1e, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #1f2c0e;
            padding: 5px 15px;
            border-radius: 50px;
            color: #FFD54F;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
        }

        .story-card {
            background: #FFF3E0;
            margin: 20px 25px;
            padding: 20px 25px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
        }

        .narrative-text {
            font-size: 1.4rem;
            line-height: 1.4;
            font-weight: 600;
            color: #4E342E;
            text-shadow: 1px 1px 0 #FFE0B3;
            background: #FFEFD5;
            padding: 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: #FFE0B2;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            color: #5D4037;
            margin: 15px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .option-btn {
            background: #D7CCC8;
            border: 4px solid #8D6E63;
            font-size: 1.2rem;
            padding: 15px 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #3E2723;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s;
            text-align: left;
            font-family: inherit;
            box-shadow: 0 5px 0 #5D4037;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            background: #8D6E63;
            color: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-left: 8px;
            box-shadow: inset 0 -1px 0 #5D4037;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #5D4037;
        }

        .option-btn:hover {
            background: #BCAAA4;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .next-area {
            text-align: center;
            margin: 20px 0 10px;
        }

        .next-btn {
            background: #8D6E63;
            border: none;
            font-size: 1.5rem;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #5D4037;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5D4037;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-message {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px;
            font-weight: bold;
            background: #FFE0B2;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            border-radius: 30px;
        }

        footer {
            background: #BCAAA4;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #3E2723;
        }

        @media (max-width: 650px) {
            .narrative-text { font-size: 1.1rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 5px; }
            .option-prefix { width: 32px; height: 32px; font-size: 1rem; }
            .level-badge, .score-badge { font-size: 0.8rem; }
        }

        .correct-fx {
            background: #A5D6A7 !important;
            border-color: #2E7D32 !important;
        }

        .wrong-fx {
            background: #EF9A9A !important;
            border-color: #C62828 !important;
        }
        
        .hyena-growl {
            display: inline-block;
            animation: shake 0.3s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 0</div>
        <div class="progress-badge" id="progressDisplay">Swali: 1 / 40</div>
        <div class="timer-area">⏱️ <span id="timerSeconds">40</span> s</div>
    </div>
    <div class="story-card">
        <div class="narrative-text" id="storyNarrative">🦁 Fisi Asiye na Shukrani! Jiunge na hadithi ya kusisimua na ujifunze maana ya shukrani! 🐾</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ Swali linalofuata</button>
        </div>
        <div style="text-align: center; margin-top: 8px;"><span id="feedbackMsg" class="info-message">✨ Chagua jibu (A, B, C, au D)</span></div>
    </div>
    <footer>🎵 "Fisi Asiye na Shukrani" - Kusikiliza, Kuzungumza, Kusoma na Kuandika 🎵</footer>
</div>

<script>
    // ------------------- INTRO SONG (Theme for Fisi Asiye na Shukrani) ------------------
    function playIntroSong() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration, vol = 0.3) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            // Dramatic but playful melody for hyena story
            playNote(392.00, now, 0.3);
            playNote(440.00, now + 0.35, 0.3);
            playNote(523.25, now + 0.7, 0.35);
            playNote(392.00, now + 1.1, 0.3);
            playNote(349.23, now + 1.45, 0.3);
            playNote(440.00, now + 1.8, 0.35);
            playNote(523.25, now + 2.2, 0.4);
            playNote(587.33, now + 2.6, 0.45);
            playNote(392.00, now + 3.1, 0.5);
        } catch(e) { console.log("audio context error", e); }
    }

    // Voice synthesis in Kiswahili
    function speakKiswahili(text, type = "info") {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "sw-KE";
            utterance.rate = 0.9;
            utterance.pitch = (type === "correct") ? 1.2 : (type === "wrong" ? 0.8 : 1.0);
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.log("speech error", e); }
    }

    // ------------------------------------------------------------------
    // 200 UNIQUE QUESTIONS about "Fisi Asiye na Shukrani" (The Ungrateful Hyena)
    // Topics: Kusikiliza, Kuzungumza, Kusoma, Kuandika
    // Each question has unique narrative, answers randomly placed in A,B,C,D
    // ------------------------------------------------------------------
    
    // Rich pool of story scenarios about the ungrateful hyena
    const hyenaScenarios = [
        { nar: "Fisi alimsaidiwa na Sungura kuvuka mto. Baada ya kuvuka, Fisi alitaka kumla Sungura!", q: "Fisi alitaka kumfanya nini Sungura baada ya kusaidiwa?", correct: "Kumla", wrongs: ["Kumshukuru", "Kumpa zawadi", "Kumkumbatia", "Kumualika"] },
        { nar: "Sungura alimwambia Fisi, 'Nimekusaidiwa, lakini wewe huna shukrani!' Fisi hakujali.", q: "Sungura alimwambia Fisi nini?", correct: "Huna shukrani", wrongs: ["Wewe ni mzuri", "Nakupenda", "Tusaidiane", "Asante"] },
        { nar: "Kusikiliza: Fisi anacheka kwa sauti ya 'hehehe' baada ya kumdanganya Simba.", q: "Fisi anachekaje?", correct: "Hehehe", wrongs: ["Hahaha", "Hihihi", "Huhuhu", "Hohoho"] },
        { nar: "Soma: 'Fisi alimwiba chakula cha Sungura na kukimbia bila kusema asante.'", q: "Fisi alifanya nini baada ya kuiba?", correct: "Alikimbia", wrongs: ["Alisema asante", "Alirudi", "Alilia", "Alilala"] },
        { nar: "Kuandika: Taja herufi ya kwanza ya neno 'shukrani'.", q: "Herufi ya mwanzo ya 'shukrani' ni?", correct: "S", wrongs: ["H", "U", "K", "R"] },
        { nar: "Fisi alikutana na Simba msituni. Simba alimuuliza, 'Mbona huna shukrani?'", q: "Simba alimuuliza Fisi nini?", correct: "Mbona huna shukrani", wrongs: ["Unataka nini", "Nakupenda", "Twende pamoja", "Usiogope"] },
        { nar: "Kobe alimsaidia Fisi alipojikwaa. Badala ya kumshukuru, Fisi alimlaani.", q: "Fisi alimfanyia nini Kobe?", correct: "Alimlaani", wrongs: ["Alimshukuru", "Alimpenda", "Alimpa chakula", "Alimbeba"] },
        { nar: "Kusikiliza: Mwalimu anasema 'Mtu mwenye shukrani huwa anapendwa na wote.'", q: "Mtu mwenye shukrani huwa anapendwa na nani?", correct: "Wote", wrongs: ["Hakuna", "Wachache", "Mara nyingi", "Wanyama"] },
        { nar: "Soma: 'Fisi hakujua maana ya 'asante'. Alidhani ni laana.'", q: "Fisi alidhani 'asante' ni nini?", correct: "Laana", wrongs: ["Baraka", "Salamu", "Zawadi", "Kiburi"] },
        { nar: "Kuandika: Neno 'shukrani' lina herufi ngapi?", q: "Neno 'shukrani' lina herufi ngapi?", correct: "Saba", wrongs: ["Sita", "Nane", "Tano", "Nne"] },
        { nar: "Fisi alimwambia Nyani, 'Sihitaji msaada wako.' Nyani aliomba radhi.", q: "Fisi alimwambia Nyani nini?", correct: "Sihitaji msaada wako", wrongs: ["Asante", "Nakushukuru", "Tafadhali", "Samahani"] },
        { nar: "Mama alimfundisha mtoto wake kusema 'asante' kila wakati anapopewa kitu.", q: "Mama alimfundisha mtoto nini?", correct: "Kusema asante", wrongs: ["Kulala", "Kukimbia", "Kucheza", "Kulia"] },
        { nar: "Kusikiliza: Fisi anasikia mwito wa msaada. Anaamua kukimbia badala ya kusaidia.", q: "Fisi alifanya nini aliposikia mwito?", correct: "Alikimbia", wrongs: ["Alisaidia", "Alilia", "Alicheka", "Alilala"] },
        { nar: "Soma: 'Wanyama wote walimkataa Fisi kwa sababu hana shukrani.'", q: "Kwa nini wanyama walimkataa Fisi?", correct: "Hana shukrani", wrongs: ["Ana nguvu", "Ana akili", "Ana macho", "Ana miguu"] },
        { nar: "Kuandika: Taja herufi ya mwisho ya neno 'shukrani'.", q: "Herufi ya mwisho ya 'shukrani' ni?", correct: "I", wrongs: ["N", "A", "R", "K"] },
        { nar: "Fisi alikutana na Sungura tena. Sungura alimkumbusha juu ya shukrani.", q: "Sungura alimkumbusha Fisi nini?", correct: "Shukrani", wrongs: ["Nguvu", "Urembo", "Uhodari", "Uwezo"] },
        { nar: "Nyani alitoa chakula kwa Fisi. Fisi alikula na kuondoka bila kusema chochote.", q: "Fisi aliondoka bila kufanya nini?", correct: "Kusema asante", wrongs: ["Kula", "Kunywa", "Kucheza", "Kukimbia"] },
        { nar: "Kusikiliza: Hadithi inafundisha kuwa shukrani ni muhimu katika maisha.", q: "Hadithi inafundisha nini?", correct: "Shukrani ni muhimu", wrongs: ["Kiburi ni chema", "Uzembe ni bora", "Uvivu unasaidia", "Ujinga ni mzuri"] },
        { nar: "Soma: 'Fisi alipojifunza maana ya shukrani, alianza kuwa na marafiki wengi.'", q: "Fisi alianza kuwa na nini baada ya kujifunza?", correct: "Marafiki wengi", wrongs: ["Maadui wengi", "Shida nyingi", "Magumu mengi", "Hasira nyingi"] }
    ];
    
    // Shuffle array randomly
    function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
    
    // Generate distinct question for each level and index
    function generateDistinctQuestion(level, qIndex) {
        const scenarioIndex = (level * 23 + qIndex * 31) % hyenaScenarios.length;
        const base = hyenaScenarios[scenarioIndex];
        
        const levelNames = ["Kujifunza", "Kuelewa", "Changamoto", "Ustadi", "Ubingwa"];
        const levelName = levelNames[level - 1];
        
        const topicType = qIndex % 4;
        let topicPrefix = "";
        if (topicType === 0) topicPrefix = "🎧 Kusikiliza: ";
        else if (topicType === 1) topicPrefix = "💬 Kuzungumza: ";
        else if (topicType === 2) topicPrefix = "📖 Kusoma: ";
        else topicPrefix = "✍️ Kuandika: ";
        
        let narrative = `${topicPrefix}${base.nar} [L${level}Q${qIndex}] - Ngazi ${levelName} ya hadithi ya Fisi.`;
        let question = base.q;
        let correctAnswer = base.correct;
        
        // Add variation for uniqueness
        if (qIndex % 5 === 2) {
            question = `Kuhusu Fisi asiye na shukrani, ${question.toLowerCase()}`;
        }
        if (qIndex % 7 === 3) {
            narrative = `🦁 ${narrative} Kumbuka tabia ya Fisi!`;
        }
        
        // Build 4 options
        let allOptions = [correctAnswer];
        for (let w of base.wrongs) {
            if (!allOptions.includes(w) && allOptions.length < 4) {
                allOptions.push(w);
            }
        }
        const fallbacks = ["Sijui", "Labda", "Pengine", "Hapana", "Ndiyo", "Asante", "Samahani"];
        for (let f of fallbacks) {
            if (!allOptions.includes(f) && allOptions.length < 4) {
                allOptions.push(f);
            }
        }
        
        // Randomly shuffle answers to A, B, C, D
        const shuffledOptions = shuffleArray(allOptions);
        
        return { narrative, question, options: shuffledOptions, correctAnswer };
    }
    
    // Build 200 unique questions (5 levels x 40)
    let questionBank = [];
    const usedQuestions = new Set();
    
    for (let lvl = 1; lvl <= 5; lvl++) {
        let levelQuestions = [];
        for (let i = 0; i < 40; i++) {
            let q = generateDistinctQuestion(lvl, i);
            let key = `${q.narrative}|${q.question}`;
            let attempts = 0;
            while (usedQuestions.has(key) && attempts < 30) {
                q = generateDistinctQuestion(lvl, i + attempts * 41);
                key = `${q.narrative}|${q.question}`;
                attempts++;
            }
            usedQuestions.add(key);
            levelQuestions.push(q);
        }
        questionBank.push(levelQuestions);
    }
    
    console.log(`✅ Maswali ${usedQuestions.size} tofauti kabisa kuhusu Fisi Asiye na Shukrani!`);
    
    // Game state
    let currentLevel = 1;
    let currentQIndex = 0;
    let scoreInLevel = 0;
    const totalQuestionsInLevel = 40;
    const requiredToPass = 32;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let gameActive = true;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const timerSecondsSpan = document.getElementById('timerSeconds');
    const storyNarrativeDiv = document.getElementById('storyNarrative');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const feedbackSpan = document.getElementById('feedbackMsg');
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!gameActive || waitingForNext || answered) return;
        timeLeft = 40;
        timerSecondsSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext || answered) return;
            if (timeLeft <= 1) {
                if (!answered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                } else {
                    stopTimer();
                }
            } else {
                timeLeft--;
                timerSecondsSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        gameActive = false;
        speakKiswahili("Wakati umekwisha! Jibu sahihi lilikuwa: " + currentQuestionObj.correctAnswer, "timeout");
        feedbackSpan.innerHTML = `⏰ Muda umekwisha! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
        highlightCorrectAnswer();
        disableOptions(true);
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) autoNextAfterTimeout();
        }, 2200);
    }
    
    function autoNextAfterTimeout() {
        if (!waitingForNext) return;
        waitingForNext = false;
        gameActive = true;
        moveToNextQuestion();
    }
    
    function highlightCorrectAnswer() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('data-value') === currentQuestionObj.correctAnswer) {
                btn.style.backgroundColor = "#A5D6A7";
                btn.style.borderColor = "#2E7D32";
            }
        });
    }
    
    function disableOptions(disabled) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (disabled) {
                btn.classList.add('disabled-opt');
            } else {
                btn.classList.remove('disabled-opt');
            }
        });
    }
    
    function handleAnswer(selectedValue, btnElement) {
        if (!gameActive || answered || waitingForNext) return;
        stopTimer();
        answered = true;
        const isCorrect = (selectedValue === currentQuestionObj.correctAnswer);
        if (isCorrect) {
            scoreInLevel++;
            speakKiswahili("Jibu sahihi! Hongera! Umefahamu tabia ya Fisi!", "correct");
            feedbackSpan.innerHTML = "✅ Sahihi! Umepata alama! 🦁";
            btnElement.classList.add('correct-fx');
        } else {
            speakKiswahili("Pole! Jibu sahihi ni: " + currentQuestionObj.correctAnswer + ". Kumbuka kuwa na shukrani!", "wrong");
            feedbackSpan.innerHTML = `❌ Si sahihi! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
            btnElement.classList.add('wrong-fx');
            highlightCorrectAnswer();
            // Add hyena growl effect for wrong answer
            const growl = document.createElement('span');
            growl.innerHTML = '😠';
            growl.className = 'hyena-growl';
            feedbackSpan.appendChild(growl);
            setTimeout(() => growl.remove(), 500);
        }
        disableOptions(true);
        updateUIStats();
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) moveToNextQuestion();
        }, 2000);
    }
    
    function moveToNextQuestion() {
        waitingForNext = false;
        if (currentQIndex + 1 >= totalQuestionsInLevel) {
            let percentage = (scoreInLevel / totalQuestionsInLevel) * 100;
            if (percentage >= 80) {
                if (currentLevel === 5) {
                    feedbackSpan.innerHTML = "🏆🏆 HONGERA SANA! UMEMALIZA HADITHI YA FISI ASIYE NA SHUKRANI! WEWE NI SHUJAA WA SHUKRANI! 🏆🏆";
                    speakKiswahili("Hongera sana! Umemaliza ngazi zote tano za Fisi Asiye na Shukrani! Kumbuka kuwa na shukrani kila siku!", "correct");
                    gameActive = false;
                    disableOptions(true);
                    nextButton.disabled = true;
                    stopTimer();
                    return;
                } else {
                    currentLevel++;
                    currentQIndex = 0;
                    scoreInLevel = 0;
                    resetLevelUI();
                    loadQuestion();
                    speakKiswahili(`Hongera! Umefika Ngazi ya ${currentLevel} ya hadithi ya Fisi! Endelea kujifunza shukrani!`, "correct");
                    feedbackSpan.innerHTML = `🎉🎉 Umepitisha ngazi! Sasa Ngazi ${currentLevel} ya Hadithi! 🎉🎉`;
                    return;
                }
            } else {
                feedbackSpan.innerHTML = `😭 Hujapata asilimia 80. Unarudia Ngazi ${currentLevel} ya Fisi. Jaribu kuwa na shukrani na ujifunze! 😭`;
                speakKiswahili("Samahani, hujapata alama za kutosha. Rudia ngazi hii ya Fisi tena. Kumbuka kuwa na shukrani.", "wrong");
                scoreInLevel = 0;
                currentQIndex = 0;
                resetLevelUI();
                loadQuestion();
                return;
            }
        } else {
            currentQIndex++;
            loadQuestion();
        }
    }
    
    function resetLevelUI() {
        updateUIStats();
        if (timerInterval) stopTimer();
        answered = false;
        waitingForNext = false;
        gameActive = true;
        if (nextButton) nextButton.disabled = false;
    }
    
    function updateUIStats() {
        if (levelDisplay) levelDisplay.innerText = `Ngazi ya ${currentLevel}`;
        if (scoreDisplay) scoreDisplay.innerText = `Alama: ${scoreInLevel} / ${totalQuestionsInLevel}`;
        if (progressDisplay) progressDisplay.innerText = `Swali: ${currentQIndex+1} / ${totalQuestionsInLevel}`;
    }
    
    let currentQuestionObj = null;
    
    function loadQuestion() {
        if (!questionBank[currentLevel-1] || !questionBank[currentLevel-1][currentQIndex]) {
            console.error("Swali halipo");
            return;
        }
        currentQuestionObj = questionBank[currentLevel-1][currentQIndex];
        if (storyNarrativeDiv) storyNarrativeDiv.innerHTML = `🦊 ${currentQuestionObj.narrative}`;
        if (questionTextDiv) questionTextDiv.innerHTML = `❓ ${currentQuestionObj.question}`;
        
        if (optionsContainer) {
            optionsContainer.innerHTML = "";
            const prefixes = ['A', 'B', 'C', 'D'];
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-value', opt);
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'option-prefix';
                prefixSpan.innerText = prefixes[idx];
                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = opt;
                btn.appendChild(prefixSpan);
                btn.appendChild(textSpan);
                btn.addEventListener('click', (e) => {
                    if (!answered && gameActive && !waitingForNext) {
                        handleAnswer(opt, btn);
                    }
                });
                optionsContainer.appendChild(btn);
            });
        }
        
        updateUIStats();
        answered = false;
        gameActive = true;
        waitingForNext = false;
        disableOptions(false);
        stopTimer();
        startTimer();
        if (feedbackSpan) feedbackSpan.innerHTML = "🎤 Chagua jibu (A, B, C, D) - Jifunze shukrani kutoka kwa Fisi! 🎤";
    }
    
    function initGame() {
        currentLevel = 1;
        currentQIndex = 0;
        scoreInLevel = 0;
        answered = false;
        waitingForNext = false;
        gameActive = true;
        loadQuestion();
        playIntroSong();
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo 'Fisi Asiye na Shukrani'! Jifunze kuhusu umuhimu wa shukrani kupitia hadithi hii. Jibu maswali 40 kwa kila ngazi. Pata angalau asilimia 80 kupanda ngazi. Kumbuka kuwa na shukrani kila siku!", "info");
        }, 800);
        
        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (!answered && gameActive && !waitingForNext) {
                    speakKiswahili("Tafadhali jibu swali kwanza!", "info");
                    if (feedbackSpan) feedbackSpan.innerHTML = "⚠️ Jibu swali kabla ya kuendelea! ⚠️";
                    return;
                }
                if (waitingForNext) {
                    if (timerInterval) stopTimer();
                    moveToNextQuestion();
                }
            });
        }
    }
    
    window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
