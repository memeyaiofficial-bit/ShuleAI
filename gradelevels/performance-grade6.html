<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate CBC Challenge | Grade 4 Active Arts & Games</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0f2f1f 0%, #091b0e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Main game card */
        .game-container {
            max-width: 950px;
            width: 100%;
            background: #fff8ec;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255, 245, 180, 0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* header */
        .game-header {
            background: linear-gradient(135deg, #ff8c42, #e65c1e);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #a13300;
            color: white;
            text-shadow: 2px 2px 0 #b14200;
        }

        .level-badge {
            background: #2c1a0c;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #6b4a2a, 0 6px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #0a1f13;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.8rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 0 0 3px #ffdd99, 0 6px 0 #031a0c;
        }

        .timer-number {
            background: black;
            padding: 6px 18px;
            border-radius: 50px;
            color: #2effb0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            min-width: 100px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e9dccd;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #c0a16b;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #2c4727;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* question card */
        .question-card {
            padding: 30px 28px 20px;
            background: #fff6e8;
        }

        .question-text {
            font-size: 1.65rem;
            font-weight: 700;
            background: #ffefcf;
            padding: 22px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 15px rgba(0,0,0,0.1);
            color: #2b2b1f;
        }

        /* options grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f3dcb2;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #9c7a4d;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #ab6f3a;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #59381c;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffecb3;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #ff7b2c;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 40px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #a23e0c;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #a23e0c;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #1f3d2c;
            color: #ffefb9;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1.05rem;
            border-top: 2px solid #ffc857;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: #ffda99;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 1rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.3rem; }
            .timer-number { font-size: 1.6rem; min-width: 70px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-warning {
            text-shadow: 0 0 5px red;
            background-color: #5a1e1e;
            transition: 0.2s;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameApp">
    <div class="game-header">
        <div class="level-badge">🏆 LEVEL <span id="levelNum">1</span> 🏆</div>
        <div class="timer-area">⏱️ TIME REMAINING <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">⭐ SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 NEED 80% → <span id="passMark">24</span> correct to ADVANCE</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading epic challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">💪 RACE THE CLOCK! Answer fast. Every second counts. Reach 80% to unlock next level!</div>
</div>

<script>
    // --------------------------------------------------------------
    // 150 UNIQUE QUESTIONS: ATHLETICS, GYMNASTICS, SWIMMING, INDIGENOUS KENYAN GAMES, CREATIVE ARTS
    // 5 LEVELS x 30 QUESTIONS
    // --------------------------------------------------------------
    const levelsStore = [];

    // helper shuffle
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // TOPICS
    const topicPool = {
        ATH: [
            { q: "Which event is known as the 'queen of athletics'?", correct: "Heptathlon", options: ["Sprint", "Heptathlon", "Long jump", "Marathon"] },
            { q: "In a 4x100m relay, what is the most important skill for smooth baton exchange?", correct: "Timing and coordination", options: ["Speed only", "Timing and coordination", "Loud shouting", "Looking back"] },
            { q: "What is the name of the throwing event where athletes throw a heavy metal ball?", correct: "Shot put", options: ["Discus", "Shot put", "Hammer throw", "Javelin"] },
            { q: "The standard length of an outdoor running track is...", correct: "400 meters", options: ["200 meters", "400 meters", "300 meters", "500 meters"] },
            { q: "Which Kenyan athlete is famous for breaking marathon world records?", correct: "Eliud Kipchoge", options: ["David Rudisha", "Eliud Kipchoge", "Kipchoge Keino", "Faith Kipyegon"] }
        ],
        GYM: [
            { q: "Which gymnastics event uses a springboard and a table?", correct: "Vault", options: ["Floor", "Vault", "Beam", "Rings"] },
            { q: "A back handspring is a move in which direction?", correct: "Backward", options: ["Forward", "Backward", "Sideways", "Twisting"] },
            { q: "What do gymnasts spread on their hands to improve grip on bars?", correct: "Chalk (magnesium carbonate)", options: ["Talcum powder", "Chalk (magnesium carbonate)", "Resin", "Glue"] },
            { q: "Which apparatus is only used by female gymnasts in Olympic competition?", correct: "Balance beam", options: ["Pommel horse", "Balance beam", "Parallel bars", "Rings"] },
            { q: "A 'split leap' is a common move in which gymnastics routine?", correct: "Floor exercise", options: ["Vault", "Floor exercise", "Uneven bars", "Pommel horse"] }
        ],
        SWIM: [
            { q: "Which swimming stroke is also known as 'dolphin kick'?", correct: "Butterfly", options: ["Breaststroke", "Butterfly", "Backstroke", "Freestyle"] },
            { q: "In swimming, what is a 'turnover' in medley relay?", correct: "Changing strokes", options: ["Changing strokes", "Touching the wall", "Flip turn", "Exchanging swimmers"] },
            { q: "What is the main breathing technique in front crawl?", correct: "Rotating head sideways", options: ["Lifting head forward", "Rotating head sideways", "Holding breath", "Blowing bubbles only"] },
            { q: "Which pool length is used for Olympic swimming events?", correct: "50 meters", options: ["25 meters", "33 meters", "50 meters", "100 meters"] },
            { q: "The individual medley consists of four strokes in which order?", correct: "Butterfly, backstroke, breaststroke, freestyle", options: ["Freestyle, backstroke, breaststroke, butterfly", "Butterfly, backstroke, breaststroke, freestyle", "Breaststroke, butterfly, backstroke, freestyle", "Backstroke, butterfly, breaststroke, freestyle"] }
        ],
        KEN: [
            { q: "Bao is a traditional strategy game popular among which Kenyan community?", correct: "Swahili", options: ["Maasai", "Kikuyu", "Swahili", "Luo"] },
            { q: "'Rungu' throwing was traditionally used for?", correct: "Hunting and warrior training", options: ["Entertainment only", "Hunting and warrior training", "Religious rituals", "Farming celebrations"] },
            { q: "Which indigenous Kenyan game involves two players hitting a ball with curved sticks?", correct: "Kiboko (similar to hockey)", options: ["Mùrátho", "Kiboko", "Ajua", "Lidho"] },
            { q: "The Maasai jumping dance 'Adumu' is often performed during?", correct: "Eunoto ceremony (warrior passage)", options: ["Harvest festival", "Weddings", "Eunoto ceremony", "Rain dance"] },
            { q: "What is 'Kati'? (traditional Kenyan game)", correct: "Ball game with hitting and running", options: ["Board game", "Wrestling", "Ball game with hitting and running", "Stone lifting"] }
        ],
        ART: [
            { q: "When performing an indigenous dance, what is the most important element of display?", correct: "Expression and energy", options: ["Expensive costumes", "Expression and energy", "Perfect acrobatics", "Loud music"] },
            { q: "The 'Isukuti' dance is performed by which community in Kenya?", correct: "Luhya (Bunyore)", options: ["Kalenjin", "Luhya", "Mijikenda", "Kisii"] },
            { q: "In creative arts performance, 'stage presence' means...", correct: "Confident engagement with audience", options: ["Standing still", "Confident engagement with audience", "Very loud voice", "Wearing shiny clothes"] },
            { q: "What is the name of the Kenyan folk dance from the coastal region?", correct: "Chakacha", options: ["Mwanzele", "Chakacha", "Benga dance", "Odhiambo"] },
            { q: "When displaying an indigenous Kenyan game, why is narration important?", correct: "To preserve history and rules", options: ["To waste time", "To preserve history and rules", "To confuse opponents", "For music"] }
        ]
    };

    // Build master levels (5 levels, 30 Q each, mix topics)
    function buildGameBank() {
        const categories = ['ATH', 'GYM', 'SWIM', 'KEN', 'ART'];
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            // 6 questions from each category => 30 total
            for (let cat of categories) {
                let catArray = topicPool[cat];
                for (let i = 0; i < 6; i++) {
                    let base = catArray[i % catArray.length];
                    let questionCopy = {
                        text: base.q,
                        options: [...base.options],
                        correct: base.correct
                    };
                    // Slight variety per level to keep fresh
                    if (lvl > 2 && i % 2 === 0) {
                        questionCopy.text = questionCopy.text + " (🔥 expert twist)";
                    }
                    levelQs.push(questionCopy);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsStore.push(levelQs.slice(0, 30));
        }
    }
    buildGameBank();

    // ------------------- GAME STATE -------------------
    let currentLevel = 1;               // 1..5
    let currentQuestionIndex = 0;
    let levelScore = 0;                 // correct answers this level
    const TOTAL_PER_LEVEL = 30;
    const PASS_PERCENT = 80;
    let requiredToPass = Math.ceil(TOTAL_PER_LEVEL * PASS_PERCENT / 100); // 24

    // TIMER CRITICAL FIX: level total countdown (visible ticking)
    let levelTimerSeconds = 0;           // will be set per level
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;            // prevent double answering
    let waitingForNext = false;          // after answer, waiting next click
    let levelFinishedFlag = false;

    // DOM elements
    const levelNumSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const currentScoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const gameMessageDiv = document.getElementById('gameMessage');

    // helper UI updates
    function updateScoreUI() {
        currentScoreSpan.innerText = `${levelScore}`;
    }

    // STOP GLOBAL TIMER
    function stopLevelTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    // start countdown timer for the whole level (major fix: visible decreasing seconds)
    function startLevelCountdown() {
        if (timerInterval) stopLevelTimer();
        // Challenging timer per level : L1=92s, L2=82s, L3=72s, L4=62s, L5=52s (fast & addictive)
        const timeMap = { 1: 92, 2: 82, 3: 72, 4: 62, 5: 52 };
        levelTimerSeconds = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSeconds;
        timerDisplaySpan.classList.remove('timer-warning');
        
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            if (levelFinishedFlag) return;
            if (levelTimerSeconds <= 0) {
                // TIME'S UP FOR THE WHOLE LEVEL
                stopLevelTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinishedFlag = true;
                // Disable all interaction
                answerLocked = true;
                waitingForNext = true;
                disableAllOptions();
                nextButton.disabled = true;
                gameMessageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED. You needed ${requiredToPass} correct, got ${levelScore}. Refresh to try again! 💀⏰`;
                showRestartButtonInMessage();
            } else {
                levelTimerSeconds--;
                timerDisplaySpan.innerText = levelTimerSeconds;
                // Visual warning when less than 10 sec
                if (levelTimerSeconds <= 10) {
                    timerDisplaySpan.classList.add('timer-warning');
                    timerDisplaySpan.style.background = "#8b0000";
                    timerDisplaySpan.style.color = "#ffcc00";
                    timerDisplaySpan.style.transform = "scale(1.02)";
                } else {
                    timerDisplaySpan.classList.remove('timer-warning');
                    timerDisplaySpan.style.background = "black";
                    timerDisplaySpan.style.color = "#2effb0";
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.disabled = true);
    }

    function showRestartButtonInMessage() {
        let existing = document.querySelector('.restart-btn-msg');
        if(existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '🔄 RESTART GAME 🔄';
        restartBtn.className = 'restart-btn restart-btn-msg';
        restartBtn.onclick = () => location.reload();
        gameMessageDiv.appendChild(restartBtn);
    }

    // highlight correct answer when user selects wrong or timeout
    function highlightCorrectAnswer(correctAnswerText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const btnText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (btnText === correctAnswerText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    // handle answer click
    function handleAnswer(selectedOptionText, correctAnswerText, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinishedFlag) return;
        answerLocked = true;
        const isCorrect = (selectedOptionText === correctAnswerText);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            gameMessageDiv.innerHTML = `✅ AWESOME! +1 point! (${levelScore}/${TOTAL_PER_LEVEL}) | Time left: ${levelTimerSeconds}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            // show correct answer by highlighting it
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswerText) {
                    btn.classList.add('correct-highlight');
                }
            });
            gameMessageDiv.innerHTML = `❌ OOPS! Correct: "${correctAnswerText}". No point added. Keep going! Time left: ${levelTimerSeconds}s`;
        }
        // disable all options after answer
        disableAllOptions();
        waitingForNext = true;
        nextButton.disabled = false;
    }

    // Load current question
    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQuestionIndex >= TOTAL_PER_LEVEL) {
            finishLevel();
            return;
        }
        const levelData = levelsStore[currentLevel - 1];
        const q = levelData[currentQuestionIndex];
        questionTextDiv.innerText = q.text;
        optionsContainer.innerHTML = '';
        
        const shuffled = shuffleArray([...q.options]);
        const letters = ['A', 'B', 'C', 'D'];
        shuffled.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${letters[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsContainer.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextButton.disabled = true;
        gameMessageDiv.innerHTML = `⚡ LEVEL ${currentLevel} - Timer is RUNNING! Answer before time ends! ⚡`;
    }

    // Next question action
    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinishedFlag) return;
        if (!gameActive) return;
        
        currentQuestionIndex++;
        if (currentQuestionIndex < TOTAL_PER_LEVEL) {
            waitingForNext = false;
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    // Level completion & progression or failure
    function finishLevel() {
        if (levelFinishedFlag) return;
        levelFinishedFlag = true;
        stopLevelTimer();
        
        const passed = (levelScore >= requiredToPass);
        if (passed) {
            if (currentLevel === 5) {
                // VICTORY all levels complete!
                gameMessageDiv.innerHTML = `🏆✨🏅 LEGENDARY! You conquered all 5 levels! Score: ${levelScore}/${TOTAL_PER_LEVEL} (${Math.round(levelScore/TOTAL_PER_LEVEL*100)}%) . YOU ARE A TRUE CBC CHAMPION! 🏅✨🏆`;
                disableAllOptions();
                nextButton.disabled = true;
                gameActive = false;
                return;
            } else {
                // advance to next level
                gameMessageDiv.innerHTML = `🎉 LEVEL ${currentLevel} CLEARED! 🎉 ${levelScore}/${TOTAL_PER_LEVEL} (${Math.round(levelScore/TOTAL_PER_LEVEL*100)}%) PASS! Moving to LEVEL ${currentLevel+1} in 2 seconds...`;
                disableAllOptions();
                nextButton.disabled = true;
                currentLevel++;
                currentQuestionIndex = 0;
                levelScore = 0;
                requiredToPass = Math.ceil(TOTAL_PER_LEVEL * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredToPass;
                levelNumSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinishedFlag = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                // restart timer for new level
                stopLevelTimer();
                startLevelCountdown();
                loadCurrentQuestion();
                // enable next button after load? load sets next disabled until answer
                return;
            }
        } else {
            // FAILED level
            gameActive = false;
            disableAllOptions();
            nextButton.disabled = true;
            gameMessageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_PER_LEVEL} (need ${requiredToPass} correct). Timer ran out or low score. Press RESTART to try again! 😭`;
            showRestartButtonInMessage();
        }
    }

    // manual timeout due to timer => when timer hits zero, we call failure if not already answered
    // The interval already checks levelTimerSeconds <= 0 and ends level. But we also need to prevent answering after timeout.
    // The timer triggers gameActive = false + levelFinished. Already covered.

    // start game
    function initGame() {
        totalQSpan.innerText = TOTAL_PER_LEVEL;
        requiredToPass = Math.ceil(TOTAL_PER_LEVEL * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredToPass;
        levelScore = 0;
        currentQuestionIndex = 0;
        updateScoreUI();
        gameActive = true;
        levelFinishedFlag = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelCountdown();
        loadCurrentQuestion();
        nextButton.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
