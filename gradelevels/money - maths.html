<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Grade 1 CBC Maths | Money: Coins & Notes | Count Money | Voice Quiz Game</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #2e7d32 0%, #1b5e20 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fffef7;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), inset 0 1px 3px rgba(255, 250, 210, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffd966;
            padding: 16px 18px 12px;
            text-align: center;
            border-bottom: 4px solid #f9a825;
        }

        .level-badge {
            background: #2e7d32;
            display: inline-block;
            padding: 5px 22px;
            border-radius: 50px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
        }

        .stars {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .star {
            font-size: 24px;
            color: #ffc107;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-progress {
            background: #fff3e0;
            margin: 10px 12px 0;
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
            color: #5a3a1a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-card {
            padding: 18px 18px 20px;
        }

        .question-area {
            background: #ffffff;
            padding: 22px 14px;
            border-radius: 48px;
            box-shadow: inset 0 0 0 3px #ffe0a3, 0 6px 12px rgba(0,0,0,0.05);
            border: 1px solid #ffcd94;
            margin-bottom: 18px;
            text-align: center;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 12px;
            word-break: break-word;
            line-height: 1.3;
        }

        .math-visual {
            font-size: 1.8rem;
            background: #fef9e6;
            padding: 12px;
            border-radius: 40px;
            margin-top: 8px;
            color: #b45f1b;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .money-icons {
            font-size: 1.8rem;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .timer-circle {
            background: #f9a825;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            font-family: monospace;
            box-shadow: 0 4px 0 #e65100;
            transition: 0.1s;
        }

        .warning {
            background: #c0392b;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); background-color: #c0392b; }
            100% { transform: scale(1.05); background-color: #e67e22; }
        }

        .hint-box {
            background: #ffe0b5;
            border-radius: 35px;
            padding: 8px 14px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #b45f1b;
        }

        .answer-input-area {
            margin: 16px 0;
        }

        .answer-input {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            text-align: center;
            border-radius: 55px;
            border: 3px solid #ffd966;
            background: white;
            font-family: monospace;
            font-weight: bold;
            color: #2d5a2c;
            outline: none;
            -webkit-appearance: none;
        }

        .answer-input:focus {
            border-color: #f9a825;
            box-shadow: 0 0 0 3px rgba(249,168,37,0.2);
        }

        .submit-btn {
            background: #52b788;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .voice-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .voice-btn {
            background: #2a9d8f;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .voice-btn.speaker {
            background: #e76f51;
        }

        .status-msg {
            background: #efe0c9;
            border-radius: 35px;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        .next-btn {
            background: #ffd966;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: #2e7d32;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-area {
            text-align: center;
            margin: 12px 15px 15px;
        }

        .reset-btn {
            background: #b4813c;
            border: none;
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            body { padding: 12px; }
            .question-text { font-size: 1.2rem; }
            .math-visual { font-size: 1.3rem; }
            .answer-input { font-size: 1.2rem; padding: 14px; }
            .timer-circle { width: 60px; height: 60px; font-size: 1.7rem; }
            .submit-btn, .next-btn { padding: 12px; font-size: 1rem; }
            .money-icons { font-size: 1.3rem; }
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            background: #ebd5b3;
            padding: 8px;
            color: #4a3720;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">💰 LEVEL 1 / 5</div>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <div class="score-progress">
            <span>🏆 SCORE: <span id="currentScore">0</span></span>
            <span>✅ NEED 80% ➡️ <span id="requiredInfo">0/24</span></span>
        </div>
    </div>
    <div class="quiz-card">
        <div class="question-area">
            <div class="question-text" id="questionText">🌟 Count the money! 🌟</div>
            <div class="math-visual" id="mathVisual"></div>
        </div>
        <div class="timer-area"><div class="timer-circle" id="timerCircle">40</div></div>
        <div class="hint-box" id="hintBox">💡 Hint will appear here when time is low 💡</div>
        
        <div class="answer-input-area">
            <input type="number" id="answerInput" class="answer-input" placeholder="Type total amount (shillings)..." inputmode="numeric" autocomplete="off">
        </div>
        <button class="submit-btn" id="submitBtn">✅ SUBMIT ANSWER</button>
        
        <div class="voice-actions">
            <button class="voice-btn speaker" id="speakBtn">🔊 READ QUESTION</button>
        </div>
        
        <div class="status-msg" id="statusMsg">✨ Add the coins/notes. Type total in shillings. 40 seconds. ✨</div>
        <button class="next-btn" id="nextBtn" disabled>➡️ NEXT QUESTION</button>
        <div class="reset-area"><button class="reset-btn" id="resetGameBtn">🔄 RESTART GAME</button></div>
    </div>
    <footer>💰 Kenyan Money: Coins (1, 5, 10, 20) and Notes (50, 100, 200, 500) | Grade 1 CBC Maths</footer>
</div>

<script>
    // ======================= QUESTION BANK: Coins, Notes, Counting Money =======================
    // Topics: Coin recognition, Note recognition, Counting total value
    
    // Define Kenyan coins and notes suitable for Grade 1
    const coins = [
        { value: 1, name: "1 shilling", icon: "🪙", symbol: "KSh1" },
        { value: 5, name: "5 shillings", icon: "🪙", symbol: "KSh5" },
        { value: 10, name: "10 shillings", icon: "🪙", symbol: "KSh10" },
        { value: 20, name: "20 shillings", icon: "🪙", symbol: "KSh20" }
    ];
    
    const notes = [
        { value: 50, name: "50 shillings", icon: "💵", symbol: "KSh50" },
        { value: 100, name: "100 shillings", icon: "💵", symbol: "KSh100" },
        { value: 200, name: "200 shillings", icon: "💵", symbol: "KSh200" },
        { value: 500, name: "500 shillings", icon: "💵", symbol: "KSh500" }
    ];
    
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        
        // Helper to create unique key
        function addKey(prefix, value) {
            const key = `${prefix}_${value}`;
            if (usedKeys.has(key)) return false;
            usedKeys.add(key);
            return true;
        }
        
        // Question Type 1: Count coins only (1-4 coins)
        const coinCombinations = [
            { coins: [1,1], total: 2, visual: "🪙🪙 (1+1=2)", text: "Count the coins: 1 shilling + 1 shilling = ?" },
            { coins: [1,5], total: 6, visual: "🪙🪙 (1 + 5)", text: "Count: 1 shilling and 5 shillings = ?" },
            { coins: [5,5], total: 10, visual: "🪙🪙 (5+5)", text: "Two 5 shilling coins = ?" },
            { coins: [10,10], total: 20, visual: "🪙🪙 (10+10)", text: "Two 10 shilling coins = ?" },
            { coins: [20,20], total: 40, visual: "🪙🪙 (20+20)", text: "Two 20 shilling coins = ?" },
            { coins: [1,5,10], total: 16, visual: "🪙🪙🪙 (1+5+10)", text: "Add: 1 + 5 + 10 shillings = ?" },
            { coins: [5,10,20], total: 35, visual: "🪙🪙🪙 (5+10+20)", text: "5 + 10 + 20 shillings = ?" },
            { coins: [1,1,5,5], total: 12, visual: "🪙🪙🪙🪙 (1+1+5+5)", text: "Two 1-shilling and two 5-shilling coins = ?" },
            { coins: [10,10,5], total: 25, visual: "🪙🪙🪙 (10+10+5)", text: "10 + 10 + 5 shillings = ?" },
            { coins: [20,10,5,1], total: 36, visual: "🪙🪙🪙🪙 (20+10+5+1)", text: "20 + 10 + 5 + 1 shillings = ?" }
        ];
        
        // Question Type 2: Notes only (1-3 notes)
        const noteCombinations = [
            { notes: [50,50], total: 100, visual: "💵💵 (50+50)", text: "Two 50 shilling notes = ?" },
            { notes: [100,100], total: 200, visual: "💵💵 (100+100)", text: "Two 100 shilling notes = ?" },
            { notes: [50,100], total: 150, visual: "💵💵 (50+100)", text: "50 + 100 shillings = ?" },
            { notes: [100,200], total: 300, visual: "💵💵 (100+200)", text: "100 + 200 shillings = ?" },
            { notes: [200,200], total: 400, visual: "💵💵 (200+200)", text: "Two 200 shilling notes = ?" },
            { notes: [50,50,50], total: 150, visual: "💵💵💵 (50+50+50)", text: "Three 50 shilling notes = ?" },
            { notes: [100,50,50], total: 200, visual: "💵💵💵 (100+50+50)", text: "100 + 50 + 50 shillings = ?" },
            { notes: [200,100], total: 300, visual: "💵💵 (200+100)", text: "200 + 100 shillings = ?" }
        ];
        
        // Question Type 3: Mixed coins and notes
        const mixedCombinations = [
            { items: [{type:"coin",v:50},{type:"coin",v:10}], total: 60, visual: "💵(50) + 🪙(10)", text: "50 shilling note + 10 shilling coin = ?" },
            { items: [{type:"note",v:100},{type:"coin",v:20}], total: 120, visual: "💵100 + 🪙20", text: "100 shilling note + 20 shilling coin = ?" },
            { items: [{type:"note",v:50},{type:"coin",v:5}], total: 55, visual: "💵50 + 🪙5", text: "50 shilling note + 5 shilling coin = ?" },
            { items: [{type:"note",v:200},{type:"coin",v:10},{type:"coin",v:5}], total: 215, visual: "💵200 + 🪙10 + 🪙5", text: "200 + 10 + 5 shillings = ?" },
            { items: [{type:"note",v:100},{type:"note",v:50},{type:"coin",v:20}], total: 170, visual: "💵100 + 💵50 + 🪙20", text: "100 + 50 + 20 shillings = ?" }
        ];
        
        // Question Type 4: Identify coin/note value (recognition)
        const recognitionQuestions = [
            { visual: "🪙 (1 shilling coin)", text: "What is the value of this coin? 🪙", answer: 1, hint: "This is a 1 shilling coin." },
            { visual: "🪙 (5 shilling coin)", text: "What is the value of this coin? 🪙 (5)", answer: 5, hint: "This is a 5 shilling coin." },
            { visual: "🪙 (10 shilling coin)", text: "What is the value of this coin? 🪙 (10)", answer: 10, hint: "This is a 10 shilling coin." },
            { visual: "🪙 (20 shilling coin)", text: "What is the value of this coin? 🪙 (20)", answer: 20, hint: "This is a 20 shilling coin." },
            { visual: "💵 (50 shilling note)", text: "What is the value of this note? 💵 50", answer: 50, hint: "This is a 50 shilling note." },
            { visual: "💵 (100 shilling note)", text: "What is the value of this note? 💵 100", answer: 100, hint: "This is a 100 shilling note." },
            { visual: "💵 (200 shilling note)", text: "What is the value of this note? 💵 200", answer: 200, hint: "This is a 200 shilling note." },
            { visual: "💵 (500 shilling note)", text: "What is the value of this note? 💵 500", answer: 500, hint: "This is a 500 shilling note." }
        ];
        
        // Combine all question types
        const allPotentialQuestions = [];
        
        // Add coin combinations
        for (let c of coinCombinations) {
            allPotentialQuestions.push({
                text: c.text,
                visual: c.visual,
                answer: c.total,
                hint: `Add all coins: ${c.text.replace("= ?", `= ${c.total}`)}`
            });
        }
        
        // Add note combinations
        for (let n of noteCombinations) {
            allPotentialQuestions.push({
                text: n.text,
                visual: n.visual,
                answer: n.total,
                hint: `Add the notes: ${n.text.replace("= ?", `= ${n.total}`)}`
            });
        }
        
        // Add mixed combinations
        for (let m of mixedCombinations) {
            allPotentialQuestions.push({
                text: m.text,
                visual: m.visual,
                answer: m.total,
                hint: `Total = ${m.total} shillings`
            });
        }
        
        // Add recognition questions
        for (let r of recognitionQuestions) {
            allPotentialQuestions.push({
                text: r.text,
                visual: r.visual,
                answer: r.answer,
                hint: r.hint
            });
        }
        
        // Shuffle and select 30 unique ones per level
        let shuffled = [...allPotentialQuestions];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        let added = 0;
        for (let item of shuffled) {
            if (added >= 30) break;
            const key = `${item.text}_${item.answer}`;
            if (!usedKeys.has(key)) {
                usedKeys.add(key);
                questions.push({
                    type: "money",
                    text: item.text,
                    visual: item.visual,
                    answer: item.answer,
                    hint: item.hint
                });
                added++;
            }
        }
        
        // Ensure we have exactly 30 questions
        while (questions.length < 30) {
            const fallback = { text: "Count: 10 + 10 shillings = ?", visual: "🪙🪙 (10+10)", answer: 20, hint: "10 + 10 = 20" };
            questions.push(fallback);
        }
        
        return questions;
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let lockAnswer = false;
    let currentQuestionObj = null;
    
    // DOM elements
    const questionTextEl = document.getElementById("questionText");
    const mathVisualEl = document.getElementById("mathVisual");
    const timerCircle = document.getElementById("timerCircle");
    const hintBox = document.getElementById("hintBox");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetGameBtn");
    const speakBtn = document.getElementById("speakBtn");
    const statusMsg = document.getElementById("statusMsg");
    const currentScoreSpan = document.getElementById("currentScore");
    const requiredInfoSpan = document.getElementById("requiredInfo");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const starRatingSpan = document.getElementById("starRating");
    
    // Speech synthesis with pause between "Time is up" and "moving to the next question"
    function speakWithPause(phrases, pauseMs = 900) {
        if (!window.speechSynthesis) return;
        const items = Array.isArray(phrases) ? phrases : [phrases];
        window.speechSynthesis.cancel();
        function speakNext(index) {
            if (index >= items.length) return;
            const utterance = new SpeechSynthesisUtterance(items[index]);
            utterance.lang = "en-US";
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.onend = () => {
                setTimeout(() => speakNext(index + 1), pauseMs);
            };
            window.speechSynthesis.speak(utterance);
        }
        speakNext(0);
    }
    
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
    
    function announceTimeUp() {
        speakWithPause(["Time is up", "moving to the next question"], 900);
        statusMsg.innerText = "⏰ TIME IS UP! Moving to next question... ⏰";
    }
    
    function readQuestionAloud() {
        if (currentQuestionObj) {
            speakText(`Question: ${currentQuestionObj.text}`);
            statusMsg.innerText = "🔊 Reading question...";
            setTimeout(() => statusMsg.innerText = "✅ Type your answer (total shillings) and click submit!", 2000);
        }
    }
    
    function announceCorrect() {
        const praises = ["Excellent!", "Great job!", "You're a money star!", "Correct!", "Wonderful counting!"];
        const rand = praises[Math.floor(Math.random() * praises.length)];
        speakText(rand);
    }
    
    function announceWrong(correctAnswer) {
        speakText(`Oops! The correct answer is ${correctAnswer} shillings. Keep practicing money!`);
    }
    
    function updateHint() {
        if (currentQuestionObj && !lockAnswer && !waitingForNext) {
            if (timeLeft <= 15 && timeLeft > 5) {
                hintBox.innerHTML = `⏰ ${timeLeft} seconds left! 💡 Hint: ${currentQuestionObj.hint}`;
            } else if (timeLeft <= 5) {
                hintBox.innerHTML = `🚨 LAST ${timeLeft} SECONDS! 🚨 ${currentQuestionObj.hint}`;
            } else {
                hintBox.innerHTML = `💡 Hint will appear at 15 seconds. Add all coins/notes carefully! 💡`;
            }
        }
    }
    
    function checkAnswer() {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "⚠️ Question already answered! Press NEXT.";
            return;
        }
        const userAnswer = parseInt(answerInput.value.trim());
        if (isNaN(userAnswer)) {
            statusMsg.innerText = "🔢 Please type a number (total shillings)!";
            speakText("Please type a number.");
            return;
        }
        if (userAnswer === currentQuestionObj.answer) {
            handleCorrect();
        } else {
            handleWrong();
        }
    }
    
    function handleCorrect() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        score++;
        updateUI();
        announceCorrect();
        statusMsg.innerText = "🎉 CORRECT! +1 POINT! 🎉";
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#d4f0d4";
        answerInput.style.border = "3px solid #2e7d32";
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleWrong() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceWrong(currentQuestionObj.answer);
        statusMsg.innerText = `😓 WRONG! Correct answer: ${currentQuestionObj.answer} shillings`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleTimeout() {
        if (lockAnswer || waitingForNext) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceTimeUp();
        statusMsg.innerText = `⏰ TIME UP! Answer: ${currentQuestionObj.answer} shillings`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function resetInputStyle() {
        answerInput.style.background = "white";
        answerInput.style.border = "3px solid #ffd966";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.value = "";
        answerInput.focus();
        if (window.innerWidth <= 550) {
            answerInput.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 40;
        timerCircle.innerText = timeLeft;
        timerCircle.classList.remove("warning");
        updateHint();
        timerInterval = setInterval(() => {
            if (lockAnswer || waitingForNext) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                timeLeft--;
                timerCircle.innerText = timeLeft;
                updateHint();
                if (timeLeft <= 10) timerCircle.classList.add("warning");
                else timerCircle.classList.remove("warning");
            }
        }, 1000);
    }
    
    function loadQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        lockAnswer = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        resetInputStyle();
        
        if (currentQuestionIndex >= questions.length) {
            let requiredPass = Math.ceil(questions.length * 0.8);
            if (score >= requiredPass) {
                if (currentLevel === 5) {
                    statusMsg.innerText = "🏆🏆 AMAZING! YOU MASTERED MONEY! GRADE 1 MATH CHAMPION! 🏆🏆";
                    speakText("Congratulations! You completed all 5 levels! You are a money counting champion!");
                    questionTextEl.innerText = "🎉 GRAND VICTORY! 🎉 Money Expert!";
                    mathVisualEl.innerHTML = "💰🏆💰";
                    answerInput.disabled = true;
                    submitBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                } else {
                    currentLevel++;
                    currentQuestionIndex = 0;
                    score = 0;
                    loadLevelData();
                    updateLevelDisplay();
                    updateUI();
                    loadQuestion();
                    return;
                }
            } else {
                statusMsg.innerText = `❌ You got ${score}/${questions.length} (need ${requiredPass}%). Restarting level ${currentLevel}. Try again! ❌`;
                speakText(`Restarting level ${currentLevel}. Keep practicing money!`);
                resetCurrentLevel();
                return;
            }
        }
        
        currentQuestionObj = questions[currentQuestionIndex];
        questionTextEl.innerText = currentQuestionObj.text;
        mathVisualEl.innerHTML = currentQuestionObj.visual || "💰";
        hintBox.innerHTML = "💡 Hint will appear at 15 seconds. Add all values carefully! 💡";
        startTimer();
        updateUI();
        statusMsg.innerText = "💰 Listen or read, count the money, then type total shillings!";
        speakText(`Question: ${currentQuestionObj.text}`);
    }
    
    function loadLevelData() {
        questions = generateQuestionsForLevel(currentLevel);
        score = 0;
        currentQuestionIndex = 0;
    }
    
    function updateUI() {
        currentScoreSpan.innerText = score;
        let needed = Math.ceil(questions.length * 0.8);
        requiredInfoSpan.innerText = `${score}/${needed}`;
        let percent = (score / questions.length) * 100;
        let starCount = Math.min(5, Math.floor(percent / 20));
        starRatingSpan.innerHTML = "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
    }
    
    function updateLevelDisplay() {
        levelDisplaySpan.innerHTML = `💰 LEVEL ${currentLevel} / 5 💰`;
        let need = Math.ceil(30 * 0.8);
        requiredInfoSpan.innerText = `0/${need}`;
    }
    
    function resetCurrentLevel() {
        if (timerInterval) clearInterval(timerInterval);
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        lockAnswer = false;
        waitingForNext = false;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = 1;
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    // Event Listeners
    submitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        checkAnswer();
    });
    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!waitingForNext && !lockAnswer) {
            statusMsg.innerText = "👉 Please answer the question first!";
            speakText("Please answer the question first.");
            return;
        }
        if (waitingForNext) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });
    resetBtn.addEventListener("click", (e) => {
        e.preventDefault();
        fullReset();
    });
    speakBtn.addEventListener("click", (e) => {
        e.preventDefault();
        readQuestionAloud();
    });
    answerInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !lockAnswer && !waitingForNext) {
            e.preventDefault();
            checkAnswer();
        }
    });
    answerInput.addEventListener("focus", () => {
        setTimeout(() => answerInput.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
    });
    
    // Initialize game
    loadLevelData();
    updateLevelDisplay();
    updateUI();
    loadQuestion();
</script>
</body>
</html>
