<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Nidhamu Mezani | CBC Darasa la 4 | Kiswahili</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #2c5a2e 0%, #1e3a1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', 'Roboto', 'Noto Sans', system-ui, sans-serif;
            padding: 16px;
        }

        .master-container {
            max-width: 850px;
            width: 100%;
            background: #fff8ed;
            background-image: radial-gradient(circle at 5% 20%, rgba(244, 162, 97, 0.1) 2%, transparent 2.5%);
            background-size: 30px 30px;
            border-radius: 70px 50px 70px 50px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4), inset 0 1px 3px rgba(255, 245, 200, 0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* header with level, score, timer */
        .game-header {
            background: #bc6c25;
            padding: 18px 25px;
            color: #fff3e0;
            text-shadow: 2px 2px 0 #6b3e1c;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #f4a261;
        }

        .level-badge {
            background: #2c2b28;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: inset 0 -1px 0 #ffb347, 0 5px 10px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 20px;
            background: #00000055;
            backdrop-filter: blur(4px);
            padding: 6px 20px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* main content */
        .game-main {
            padding: 25px;
        }

        /* question card */
        .question-card {
            background: #fffaf2;
            border-radius: 45px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
            border-left: 12px solid #e76f51;
        }

        .question-text {
            font-size: 1.3rem;
            line-height: 1.5;
            font-weight: 600;
            color: #2d3e2b;
            word-break: break-word;
        }

        .story-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        .prompt-text {
            font-size: 1.1rem;
            color: #7b3f00;
            margin-top: 12px;
            font-weight: 500;
            background: #fef5e6;
            padding: 12px;
            border-radius: 25px;
        }

        /* answer area */
        .answer-area {
            margin: 20px 0 18px;
        }

        .answer-label {
            font-size: 1rem;
            font-weight: bold;
            color: #7b3f00;
            display: block;
            margin-bottom: 10px;
        }

        .answer-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            border: 3px solid #e9c46a;
            border-radius: 60px;
            background: #fffef7;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            color: #2c3e2b;
        }

        .answer-input:focus {
            border-color: #e76f51;
            box-shadow: 0 0 0 3px rgba(231,111,81,0.2);
        }

        /* button group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .check-btn, .next-btn {
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex: 1;
            min-width: 130px;
        }

        .check-btn {
            background: #2a9d8f;
            color: white;
            box-shadow: 0 4px 0 #1e6b5e;
        }

        .check-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e6b5e; }
        .next-btn {
            background: #e9c46a;
            color: #2c3e2b;
            box-shadow: 0 4px 0 #b88b2e;
        }
        .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b88b2e; }
        .check-btn:disabled, .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* feedback */
        .feedback {
            margin-top: 18px;
            padding: 12px;
            border-radius: 35px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            background: #e9ecef;
        }
        .feedback.correct { background: #cfe8cf; color: #1f5437; border-left: 6px solid #2d6a4f; }
        .feedback.wrong { background: #ffe0db; color: #bc3900; border-left: 6px solid #e76f51; }

        /* progress bar */
        .progress-container {
            background: #e2cfb3;
            border-radius: 30px;
            margin: 25px 0 15px;
            height: 14px;
            overflow: hidden;
        }
        .progress-fill {
            background: #f4a261;
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 30px;
        }

        /* level selector */
        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .level-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .level-card:hover:not(.locked) { border-color: #f4a261; transform: translateY(-2px); }
        .level-card.locked { opacity: 0.6; cursor: not-allowed; background: #f1f3f5; }
        .level-card.completed { border-color: #2a9d8f; background: #d1e7dd; }

        /* stats bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #fef5e6;
            padding: 10px 15px;
            border-radius: 40px;
        }
        .badge { background: #dbeafe; color: #0d47a1; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; }
        .streak { display: flex; gap: 4px; }
        .streak-dot { width: 10px; height: 10px; border-radius: 50%; background: #e9ecef; }
        .streak-dot.filled { background: #2a9d8f; }

        /* timer bar */
        .timer-bar { height: 6px; background: #e9ecef; border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .timer-fill { height: 100%; background: #ffc107; width: 100%; transition: width 1s linear; }
        .timer-fill.critical { background: #dc3545; }

        /* result screen */
        .result-screen, .welcome-screen, .level-intro, .game-screen {
            display: none;
            animation: fadeSlide 0.4s ease;
        }
        .active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
        .shake { animation: shake 0.4s ease; }
        @keyframes pop { 0%{transform:scale(0.95);} 50%{transform:scale(1.02);} 100%{transform:scale(1);} }
        .pop { animation: pop 0.3s ease; }

        .btn { background: #f4a261; color: white; border: none; padding: 12px 20px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #e76f51; transform: translateY(-2px); }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }

        .hidden { display: none; }
        .confetti { position: fixed; width: 8px; height: 8px; background: gold; border-radius: 50%; animation: fall 1.5s linear forwards; pointer-events: none; z-index: 1000; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

        @media (max-width: 580px) {
            .game-header { flex-direction: column; align-items: center; text-align: center; }
            .question-text { font-size: 1.1rem; }
            .game-main { padding: 18px; }
            .answer-input { font-size: 0.9rem; }
            .button-group { flex-direction: column; }
            .level-selector { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="master-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-timer">
            <div class="score">🍽️ Alama: <span id="scoreSpan">0</span>/<span id="qTotalSpan">40</span></div>
            <div class="timer">⏱️ Sekunde: <span id="timerSpan">25</span>s</div>
        </div>
    </div>
    <div class="game-main" id="gameMain">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="welcome-screen active">
            <h1 style="color:#bc6c25; margin-bottom:15px;">🍚 Nidhamu Mezani</h1>
            <p>Mchezo wa CBC Darasa la 4. Soma hadithi fupi za nidhamu mezani, andika jibu sahihi. Lenga kupata angalau 80% (32/40) ili kufungua kiwango kijacho!</p>
            <div class="stats-bar"><span>🎯 Lengo: 32/40 (80%)</span><span>⏱️ Sekunde 25 kwa swali</span></div>
            <div class="level-selector" id="levelMenu"></div>
            <button class="btn" id="startBtn">🚀 Anza Sasa</button>
        </div>

        <!-- Level Intro Screen -->
        <div id="level-intro" class="level-intro">
            <h2 id="levelTitle"></h2>
            <p id="levelDesc"></p>
            <div class="progress-container"><div class="progress-fill" id="introProgress"></div></div>
            <button class="btn" id="beginLevelBtn">Anza Kiwango</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="game-screen">
            <div class="stats-bar">
                <span class="badge" id="gameLevelBadge">Kiwango 1</span>
                <span id="gameScoreDisplay">0 / 40</span>
                <div class="streak" id="streakDots"></div>
            </div>
            <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
            <div class="question-card">
                <div class="story-icon">🍲✨</div>
                <div class="question-text" id="questionText">Hadithi inaandaliwa...</div>
                <div class="prompt-text" id="promptText"></div>
            </div>
            <div class="answer-area">
                <label class="answer-label">✏️ Andika jibu lako hapa (Kiswahili sanifu):</label>
                <input type="text" id="answerInput" class="answer-input" placeholder="mfano: kusema asante, kuosha mikono, sahani ..." autocomplete="off">
                <div class="button-group">
                    <button id="checkBtn" class="check-btn">🔎 Angalia Jibu</button>
                    <button id="nextBtn" class="next-btn" disabled>➡️ Swali Linalofuata</button>
                </div>
            </div>
            <div id="feedbackArea" class="feedback"></div>
            <div class="progress-container"><div class="progress-fill" id="gameProgressFill"></div></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="result-screen">
            <h2 id="resultTitle"></h2>
            <p id="resultMsg"></p>
            <div class="progress-container"><div class="progress-fill" id="resultBar"></div></div>
            <div style="text-align:center; font-size:2rem; margin:15px 0; font-weight:700;" id="resultPercent"></div>
            <button id="nextLevelBtn" class="btn" style="display:none;">➡️ Kiwango Kijacho</button>
            <button id="retryBtn" class="btn btn-secondary" style="display:none;">🔄 Jaribu Tena</button>
            <button id="homeBtn" class="btn btn-secondary">🏠 Rudi Nyumbani</button>
        </div>
    </div>
</div>

<script>

    const nextLevelBtn = document.getElementById('nextLevelBtn');
    const retryBtn = document.getElementById('retryBtn');
    const homeBtn = document.getElementById('homeBtn');

    function showScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[screenName].classList.add('active');
    }

    function loadProgress() { const saved = localStorage.getItem('nidhamu_progress'); if(saved) unlockedLevels = JSON.parse(saved).unlockedLevels || 1; }
    function saveProgress() { localStorage.setItem('nidhamu_progress', JSON.stringify({ unlockedLevels })); }

    function renderLevelMenu() {
        levelMenu.innerHTML = '';
        const icons = ['🎒','🪑','📝','⏱️','🤝'];
        levelsData.forEach((lvl, i) => {
            const card = document.createElement('div');
            card.className = `level-card ${i+1 <= unlockedLevels ? '' : 'locked'} ${i+1 < unlockedLevels ? 'completed' : ''}`;
            card.innerHTML = `<div style="font-size:1.5rem;">${icons[i]}</div><div style="font-weight:600;">${lvl.title}</div><div style="font-size:0.75rem;">${i+1 < unlockedLevels ? '✅ Imekamilika' : (i+1 === unlockedLevels ? '🔓 Imefunguliwa' : '🔒 Imefungwa')}</div>`;
            if (i+1 <= unlockedLevels) card.onclick = () => startLevel(i);
            levelMenu.appendChild(card);
        });
    }

    function startLevel(levelIdx) {
        currentLevel = levelIdx;
        currentQIndex = 0;
        levelScore = 0;
        streak = 0;
        answeredCurrent = false;
        gameActive = true;
        levelTitle.textContent = `Kiwango ${levelsData[currentLevel].id}: ${levelsData[currentLevel].title}`;
        levelDesc.textContent = levelsData[currentLevel].desc;
        introProgress.style.width = '0%';
        showScreen('levelIntro');
    }

    function beginLevel() {
        currentQIndex = 0;
        levelScore = 0;
        streak = 0;
        answeredCurrent = false;
        gameActive = true;
        loadQuestion();
        showScreen('game');
    }

    function updateUI() {
        levelDisplay.textContent = `Ngazi ya ${currentLevel+1}`;
        scoreSpan.textContent = levelScore;
        qTotalSpan.textContent = 40;
        gameLevelBadge.textContent = `Kiwango ${currentLevel+1}`;
        gameScoreDisplay.textContent = `${levelScore} / 40`;
        const percent = (levelScore / 40) * 100;
        gameProgressFill.style.width = `${percent}%`;
        timerSpan.textContent = `${timerSec}s`;
        
        // streak dots
        streakDots.innerHTML = '';
        for (let i=0; i<10; i++) streakDots.innerHTML += `<div class="streak-dot ${i < streak ? 'filled' : ''}"></div>`;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerSec = 25;
        timerFill.style.width = '100%';
        timerFill.classList.remove('critical');
        timerSpan.textContent = '25s';
        timerInterval = setInterval(() => {
            if (!gameActive || answeredCurrent) return;
            timerSec--;
            timerSpan.textContent = `${timerSec}s`;
            timerFill.style.width = `${(timerSec/25)*100}%`;
            if (timerSec <= 5) timerFill.classList.add('critical');
            if (timerSec <= 0) {
                clearInterval(timerInterval);
                if (!answeredCurrent) handleAnswer(false, "Muda umeisha! ⏰");
            }
        }, 1000);
    }

    function loadQuestion() {
        if (currentQIndex >= 40) { finishLevel(); return; }
        const q = levelsData[currentLevel].questions[currentQIndex];
        questionText.innerHTML = `<span class="story-icon">🍚📖</span> ${q.n}`;
        promptText.textContent = q.p;
        answerInput.value = '';
        answerInput.disabled = false;
        checkBtn.disabled = false;
        nextBtn.disabled = true;
        answeredCurrent = false;
        feedbackArea.innerHTML = '';
        feedbackArea.className = 'feedback';
        updateUI();
        startTimer();
        answerInput.focus();
    }

    function normalizeAnswer(str) { return str.toLowerCase().trim().replace(/[^\w\s]/g, '').replace(/\s+/g, ' '); }

    function checkAnswer() {
        if (!gameActive || answeredCurrent) return;
        const userAns = answerInput.value.trim();
        if (userAns === "") { feedbackArea.innerHTML = "Tafadhali andika jibu lako!"; feedbackArea.classList.add('wrong'); return; }
        const correct = levelsData[currentLevel].questions[currentQIndex].a;
        const isCorrect = normalizeAnswer(userAns) === normalizeAnswer(correct);
        if (timerInterval) clearInterval(timerInterval);
        handleAnswer(isCorrect, null);
    }

    function handleAnswer(isCorrect, customMsg) {
        answeredCurrent = true;
        gameActive = false;
        answerInput.disabled = true;
        checkBtn.disabled = true;
        
        if (isCorrect) {
            levelScore++;
            streak++;
            feedbackArea.innerHTML = customMsg || "✅ Sahihi! Vizuri sana!";
            feedbackArea.className = 'feedback correct pop';
            spawnConfetti();
        } else {
            streak = 0;
            const correct = levelsData[currentLevel].questions[currentQIndex].a;
            feedbackArea.innerHTML = customMsg || `❌ Jibu sahihi: "${correct}"`;
            feedbackArea.className = 'feedback wrong shake';
        }
        updateUI();
        nextBtn.disabled = false;
        
        setTimeout(() => {
            currentQIndex++;
            if (currentQIndex >= 40) finishLevel();
            else { gameActive = true; loadQuestion(); }
        }, 1500);
    }

    function finishLevel() {
        if (timerInterval) clearInterval(timerInterval);
        const percent = Math.round((levelScore / 40) * 100);
        const passed = percent >= 80;
        resultTitle.textContent = passed ? "🎉 Hongera! Umepita!" : "📚 Jaribu Tena!";
        resultMsg.textContent = passed ? `Umefanya vizuri sana! Alama yako: ${levelScore}/40 (${percent}%)` : `Umepata ${levelScore}/40 (${percent}%). Unahitaji angalau 32/40 (80%) kupita.`;
        resultPercent.textContent = `${percent}%`;
        resultBar.style.width = `${percent}%`;
        resultBar.style.background = percent >= 80 ? '#198754' : (percent >= 50 ? '#ffc107' : '#dc3545');
        
        nextLevelBtn.style.display = (passed && currentLevel + 1 < 5) ? 'block' : 'none';
        retryBtn.style.display = !passed ? 'block' : 'none';
        
        if (passed && currentLevel + 1 >= unlockedLevels) {
            unlockedLevels = currentLevel + 2;
            saveProgress();
        }
        renderLevelMenu();
        showScreen('result');
    }

    function nextLevel() { if (currentLevel + 1 < 5) startLevel(currentLevel + 1); }
    function retryLevel() { startLevel(currentLevel); }
    function goHome() { renderLevelMenu(); showScreen('welcome'); }

    function spawnConfetti() {
        const container = document.body;
        for (let i=0; i<15; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti';
            piece.style.left = `${Math.random() * 100}%`;
            piece.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
            piece.style.animationDuration = `${0.8 + Math.random()}s`;
            container.appendChild(piece);
            setTimeout(() => piece.remove(), 1500);
        }
    }

    // Event Listeners
    startBtn.onclick = () => { loadProgress(); renderLevelMenu(); showScreen('welcome'); };
    beginLevelBtn.onclick = beginLevel;
    checkBtn.onclick = checkAnswer;
    nextBtn.onclick = () => { if (!nextBtn.disabled && answeredCurrent) { gameActive = true; loadQuestion(); } };
    nextLevelBtn.onclick = nextLevel;
    retryBtn.onclick = retryLevel;
    homeBtn.onclick = goHome;
    answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !answeredCurrent && gameActive) checkAnswer(); });

    loadProgress();
    renderLevelMenu();
    showScreen('welcome');
</script>
</body>
</html>
