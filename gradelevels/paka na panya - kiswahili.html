<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Paka na Panya - Darasa la 2 CBC | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #8B5A2B 0%, #5D3A1A 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #8B5A2B;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🐱🐭 Hadithi ya Paka na Panya! Jifunze kusikiliza, kuzungumza, kusoma na kuandika.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Hadithi ya Paka na Panya! Andika jibu sahihi. Bonyeza kitufe cha sauti kusikia swali.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- SAUTI KWA KISWAHILI ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa. Swali linalofuata linakuja.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakKiswahili(qData.text);
        else speakKiswahili("Hakuna swali kwa sasa.");
    }

    // ---------- MASWALI: Paka na Panya (Kusikiliza, Kuzungumza, Kusoma, Kuandika) ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // KUSIKILIZA - Kusikiliza hadithi ya Paka na Panya
        const kusikiliza = [
            { q: "Katika hadithi, paka anamwinda ______.", a: "panya" },
            { q: "Panya ni mwenye ______ na mwerevu.", a: "akili" },
            { q: "Paka alijaribu kumkamata panya lakini panya alikimbia ______.", a: "haraka" },
            { q: "Tunaposikiliza hadithi ya paka na panya, tunapaswa kuwa ______.", a: "makini" },
            { q: "Panya alijificha kwenye ______.", a: "tundu" },
            { q: "Paka alikuwa na njaa na alitaka kumla ______.", a: "panya" },
            { q: "Kusikiliza kwa makini kunatusaidia kuelewa ______ ya hadithi.", a: "maana" },
            { q: "Panya alimwambia paka, 'Usinile, mimi ni ______ wako.'", a: "rafiki" },
            { q: "Paka hakumsikiliza panya na akaendelea kum______.", a: "fukuza" },
            { q: "Mwishowe, panya alitoroka na kuwa ______.", a: "huru" }
        ];
        
        // KUZUNGUMZA - Kuzungumza kuhusu hadithi ya Paka na Panya
        const kuzungumza = [
            { q: "Tunapozungumza kuhusu hadithi, tunapaswa kutumia lugha ya ______.", a: "heshima" },
            { q: "Panya alimwambia paka, 'Tafadhali ______ nibaki hai.'", a: "niacha" },
            { q: "Paka alijibu kwa ______, 'Sitakuacha!'", a: "hasira" },
            { q: "Kuzungumza kwa upole ni alama ya ______.", a: "adabu" },
            { q: "Panya aliomba ______ kutoka kwa paka.", a: "msamaha" },
            { q: "Tunapaswa kuzungumza kwa ______ tunaposimulia hadithi.", a: "sauti" },
            { q: "Paka alisema, 'Nataka ______ sasa hivi!'", a: "kula" },
            { q: "Kuzungumza kwa ukweli kunajenga ______.", a: "uaminifu" },
            { q: "Panya alimwomba paka amsamehe kwa ______ yake yote.", a: "makosa" },
            { q: "Hadithi ya paka na panya inatufundisha kuhusu ______ na wivu.", a: "chuki" }
        ];
        
        // KUSOMA - Kusoma hadithi ya Paka na Panya
        const kusoma = [
            { q: "Talia alisoma kitabu cha 'Paka na ______'.", a: "Panya" },
            { q: "Kusoma kunatusaidia kujua ______ za wanyama.", a: "tabia" },
            { q: "Paka ana rangi ya ______ na nyeupe.", a: "machungwa" },
            { q: "Panya ana ______ ndefu na masikio makubwa.", a: "mkia" },
            { q: "Bobo alisoma kwamba paka ni mwindaji na panya ni ______.", a: "mwathirika" },
            { q: "Kusoma kwa ______ kunasaidia kuelewa hadithi vizuri.", a: "umakini" },
            { q: "Katika hadithi, panya alimwomba paka ______.", a: "msamaha" },
            { q: "Paka alikataa kumsamehe panya kwa sababu alikuwa na ______.", a: "hasira" },
            { q: "Kusoma hadithi za wanyama kunatufundisha ______ muhimu.", a: "somo" },
            { q: "Mwisho wa hadithi, panya alikimbia na paka aka ______.", a: "kukosa" }
        ];
        
        // KUANDIKA - Kuandika kuhusu hadithi ya Paka na Panya
        const kuandika = [
            { q: "Bobo aliandika sentensi: 'Paka anamwinda ______.'", a: "panya" },
            { q: "Kuandika kwa ______ kunasaidia kueleweka vizuri.", a: "maridadi" },
            { q: "Talia aliandika, 'Panya ni mnyama ______.'", a: "mwerevu" },
            { q: "Kuandika hadithi kunatusaidia kukumbuka ______.", a: "matukio" },
            { q: "Bobo aliandika orodha ya wanyama: paka, panya na ______.", a: "mbwa" },
            { q: "Talia aliandika ubaoni: 'Paka alimfukuza panya ______.'", a: "kwa hasira" },
            { q: "Kuandika kwa usafi ni alama ya mwanafunzi ______.", a: "mwema" },
            { q: "Bobo aliandika maoni yake: 'Ninaipenda hadithi ya ______.'", a: "paka na panya" },
            { q: "Talia aliandika muhtasari mfupi kuhusu ______ kati ya paka na panya.", a: "ugomvi" },
            { q: "Kuandika kunatusaidia kuwasilisha ______ zetu kwa wengine.", a: "mawazo" }
        ];
        
        const allTopics = [...kusikiliza, ...kuzungumza, ...kusoma, ...kuandika];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo anamsikiliza mwalimu akisoma hadithi ya paka anayemwinda ______.";
                correctAnswer = "panya";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "Panya alimwomba paka, 'Tafadhali ______! Mimi si chakula chako.'";
                correctAnswer = "niacha";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Talia anasoma kitabu cha 'Paka na Panya' na anajifunza kwamba panya ni ______ sana.";
                correctAnswer = "mwerevu";
            }
            if (i % 8 === 0) {
                qText = "Bobo anaandika katika shajara yake: 'Paka alimfukuza panya kwa ______.'";
                correctAnswer = "hasira";
            }
            if (i % 9 === 0) {
                qText = "Kusikiliza hadithi kwa makini kunatusaidia kuelewa ______ muhimu ya maisha.";
                correctAnswer = "somo";
            }
            if (i % 11 === 0) {
                qText = "Panya alimwomba paka amsamehe kwa ______ zake.";
                correctAnswer = "makosa";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}. Hadithi ya paka na panya inaendelea!`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Tunasonga kwenye swali linalofuata.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako! Bonyeza kitufe cha sauti kusikia swali tena. Hadithi ya Paka na Panya inakungoja!";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Kusikiliza hadithi ya Paka na Panya! Jifunze kusikiliza kwa makini.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Kuzungumza kuhusu Paka na Panya! Zungumza kwa heshima kuhusu wanyama.";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Kusoma hadithi ya Paka na Panya! Soma na uelewe maana ya hadithi.";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Kuandika kuhusu Paka na Panya! Andika muhtasari wa hadithi kwa maridadi.";
        else levelDesc = "Ngazi 5: Ngazi ya mwisho! Kuwa Bingwa wa Hadithi ya Paka na Panya Darasa la 2!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele. ⏱️ 40s/swali. Paka anamwinda panya! 🐱🐭`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5! Wewe ni Bingwa wa Hadithi ya Paka na Panya Darasa la 2! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza ngazi zote tano. Wewe ni bingwa wa hadithi ya Paka na Panya! Endelea kusikiliza, kuzungumza, kusoma na kuandika hadithi za kiswahili!");
                storyAreaDiv.innerHTML = "🏁 MCHEZO UMEMALIZIKA! Sasa unajua hadithi ya Paka na Panya vizuri! Endelea kusoma hadithi nyingi za Kiswahili! 🐱🐭📖✨";
                nextLevelMsgDiv.innerHTML = "✨ UMESHINDA! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel}. Sasa unaenda ngazi ${currentLevel+1}. Endelea kujifunza hadithi za Kiswahili!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukufika 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu Ngazi ${currentLevel} tena.`;
            speakKiswahili(`Pole! Unahitaji angalau asilimia themanini kupita. Una alama ${scoreCorrect} kati ya ${totalQuestionsInLevel}. Tafadhali jaribu ngazi ${currentLevel} tena. Kumbuka hadithi ya Paka na Panya!`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Hadithi ya Paka na Panya! Andika jibu lako. Bonyeza kitufe cha sauti kusikia swali.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu! Paka na Panya wanakungoja.";
            speakKiswahili("Tafadhali andika jibu.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for Kiswahili answers
        if (!isCorrect) {
            const forgiving = {
                "panya": ["panya mdogo", "panya wa nyumbani", "mnyama panya"],
                "akili": ["busara", "uwezo", "fikra"],
                "haraka": ["kasi", "upesi", "mwarabu"],
                "makini": ["kwa makini", "umakini", "mwangalifu"],
                "tundu": ["shimo", "pango", "kichuguu"],
                "maana": ["mantiki", "ujumbe", "fundisho"],
                "rafiki": ["marafiki", "mwenza", "sahibu"],
                "fukuza": ["kufukuza", "windo", "mwindo"],
                "huru": ["bure", "uhuru", "salama"],
                "heshima": ["adabu", "staha", "taadhima"],
                "niacha": ["niachie", "acha", "kuacha"],
                "hasira": ["ghadhabu", "machozi", "hamaki"],
                "adabu": ["heshima", "staha", "taadhima"],
                "msamaha": ["radhi", "samehe", "kusamehe"],
                "sauti": ["kwa sauti", "kwa uzito", "kwa nguvu"],
                "kula": ["la", "kula chakula", "kumeza"],
                "uaminifu": ["aminifu", "kweli", "ukweli"],
                "makosa": ["dosari", "hitilafu", "kosa"],
                "chuki": ["uadui", "hasira", "wivu"],
                "tabia": ["maadili", "mwenendo", "sifa"],
                "machungwa": ["nyekundu", "kahawia", "rangi ya machungwa"],
                "mkia": ["mikia", "kidole", "sehemu ya nyuma"],
                "mwathirika": ["mshindwa", "aliyeteseka", "aliyekandamizwa"],
                "umakini": ["makini", "uzingatiaji", "tahadhari"],
                "somo": ["fundisho", "mafunzo", "elimu"],
                "kukosa": ["kushindwa", "kukosa fursa", "kukosa mwindo"],
                "maridadi": ["uzuri", "nzuri", "safi"],
                "mwerevu": ["bora", "hodari", "stadi"],
                "matukio": ["tukio", "mambo", "hadithi"],
                "mbwa": ["mbwa kuwinda", "mnyama"],
                "kwa hasira": ["hasira", "kwa ghadhabu"],
                "mwema": ["mwema", "mzuri", "mtukufu"],
                "paka na panya": ["paka na panya", "hadithi ya paka"],
                "ugomvi": ["mzozo", "vita", "mapambano"],
                "mawazo": ["fikra", "wazo", "maoni"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama! Endelea kusoma hadithi za Kiswahili!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi ni: "${currentQ.answer}". Endelea kujifunza hadithi za Kiswahili na Paka na Panya! ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Usikate tamaa! Soma hadithi za Kiswahili kila siku!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa hadithi ya Paka na Panya! Jifunze kusikiliza, kuzungumza, kusoma na kuandika kwa Kiswahili. Una sekunde arobaini kwa kila swali. Bonyeza kitufe cha sauti kusikia swali. Andika jibu lako. Paka anamwinda panya - nani atashinda? Hebu tujue!");
        }, 500);
    });
</script>
