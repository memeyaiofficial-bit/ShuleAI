<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Wildlife Guardian: Conserving Small Wild Animals | CBC Grade 4 Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1d4d1f 0%, #0a2f0a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* main game panel - forest feel */
        .game-container {
            max-width: 950px;
            width: 100%;
            background: #fef3da;
            border-radius: 70px 70px 65px 65px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,245,190,0.9);
            overflow: hidden;
            transition: all 0.2s;
        }

        .game-header {
            background: #e8b45e;
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 5px solid #9b5e1a;
            font-weight: bold;
        }

        .level-badge, .score-badge, .accuracy-badge {
            background: #2c5727;
            color: #fff0ba;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            box-shadow: inset 0 -2px 0 #1b3a17, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #262421;
            color: #ffdf7e;
            padding: 8px 20px;
            border-radius: 60px;
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .question-box {
            background: #fff8ea;
            margin: 25px 30px 15px 30px;
            padding: 25px 20px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #2b5820;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .progress-info {
            font-size: 1rem;
            background: #e9dcac;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 60px;
            color: #4b3410;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin: 10px 30px 25px 30px;
        }

        .option-card {
            background: #f5ebce;
            border-radius: 50px;
            padding: 14px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: #2b491f;
            cursor: pointer;
            transition: all 0.12s linear;
            border: 2px solid #cfaa6b;
            box-shadow: 0 5px 0 #9c7a42;
        }

        .option-card:hover {
            background: #ffe3aa;
            transform: scale(0.97);
            border-color: #b87e2c;
        }

        .option-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 0 #9c7a42;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .feedback-area {
            background: #e9daba;
            margin: 5px 30px 20px 30px;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .feedback-message {
            font-size: 1rem;
            font-weight: bold;
            padding-left: 10px;
            color: #336b1f;
        }

        .next-btn {
            background: #f29423;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #b45f1b;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b45f1b;
        }

        .next-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-card {
            background: #fff5e2;
            max-width: 480px;
            width: 90%;
            border-radius: 70px;
            padding: 25px 20px 35px;
            text-align: center;
            box-shadow: 0 20px 35px black;
            border: 5px solid #ffc857;
        }

        .modal-card h2 {
            font-size: 2rem;
            margin: 0;
            color: #2b6e1c;
        }

        .modal-card button {
            background: #489c34;
            border: none;
            font-size: 1.2rem;
            padding: 10px 28px;
            margin-top: 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 8px;
        }

        .shake {
            animation: shakeAnim 0.25s ease-in-out 0s 2;
        }

        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 650px) {
            .question-text { font-size: 1.2rem; }
            .option-card { font-size: 0.85rem; padding: 10px; }
            .timer-area { font-size: 1.3rem; }
        }

        .wild-icon {
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="game-container" id="gameApp">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🦔 LEVEL 1</div>
        <div class="score-badge" id="scoreDisplay">🏆 SCORE: 0</div>
        <div class="accuracy-badge" id="requiredInfo">🐾 NEED 80%</div>
        <div class="timer-area" id="timerDisplay">⏱️ 00:00</div>
    </div>

    <div class="question-box">
        <div class="question-text" id="questionText">Protecting small wild animals helps the farm...</div>
        <div class="progress-info" id="progressInfo">Q1 / 30</div>
    </div>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-area">
        <div class="feedback-message" id="feedbackMsg">🐞 Choose the best answer to protect our tiny wild friends!</div>
        <button class="next-btn" id="nextButton">➡️ NEXT</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC GAME: CONSERVING SMALL WILD ANIMALS (agriculture context)
    // TOPICS: beneficial insects, birds, amphibians, rodents, reptiles in farms,
    // importance of biodiversity, ecological balance, threats, conservation methods
    // 5 levels x 30 questions = 150 UNIQUE, ENGAGING, ATTRACTIVE
    // Required 80% to advance. Timer gets tighter each level.
    // --------------------------------------------------------------

    const questionBank = [];

    // Helper to generate rich, curriculum-aligned Qs about small wild animal conservation
    const smallAnimalTopics = [
        "Beneficial insects (bees, ladybugs, butterflies)",
        "Insectivores (frogs, lizards, hedgehogs, bats)",
        "Birds that eat pests (owls, weaver birds, sunbirds)",
        "Soil animals (earthworms, beetles, ants)",
        "Reptiles & amphibians (skinks, toads, geckos)",
        "Small mammals (mongooses, shrews, squirrels)",
        "Pollinators & seed dispersers",
        "Threats: pesticides, deforestation, habitat loss",
        "Conservation methods: nest boxes, insect hotels, buffer zones"
    ];

    let qid = 1;
    // Create 150 questions across 5 levels
    for (let level = 1; level <= 5; level++) {
        for (let i = 0; i < 30; i++) {
            // mix themes based on index & level
            const themeIndex = (i + level * 3) % smallAnimalTopics.length;
            const theme = smallAnimalTopics[themeIndex];
            let questionText = "";
            let correctAnswer = "";
            let optionsArr = [];

            // generate interesting, varied, challenging questions for grade 4 (conservation on farms)
            if (theme.includes("Beneficial insects")) {
                if (i % 3 === 0) {
                    questionText = "Which small wild animal helps farmers by eating aphids and other crop pests?";
                    correctAnswer = "Ladybug (beetle)";
                    optionsArr = ["Grasshopper", "Ladybug (beetle)", "Caterpillar", "Ant"];
                } else if (i % 3 === 1) {
                    questionText = "Why should farmers protect bees on their farms?";
                    correctAnswer = "They pollinate crops and increase yield";
                    optionsArr = ["They produce honey only", "They scare away birds", "They eat weeds", "They make soil fertile"];
                } else {
                    questionText = "What can a farmer build to attract and shelter beneficial insects?";
                    correctAnswer = "Insect hotel";
                    optionsArr = ["Metal trap", "Concrete wall", "Insect hotel", "Plastic shed"];
                }
            } 
            else if (theme.includes("Insectivores")) {
                if (i % 3 === 0) {
                    questionText = "How do frogs and toads help in a vegetable garden?";
                    correctAnswer = "They eat insects like mosquitoes and beetles";
                    optionsArr = ["They eat the vegetables", "They dig up seeds", "They make loud noise", "They eat insects like mosquitoes and beetles"];
                } else if (i % 3 === 1) {
                    questionText = "Which small animal at night eats many crop pests and is a friend to farmers?";
                    correctAnswer = "Bat";
                    optionsArr = ["Snake", "Bat", "Rat", "Squirrel"];
                } else {
                    questionText = "Lizards and geckos on farm walls are helpful because they:";
                    correctAnswer = "Eat flies, mosquitoes and other insects";
                    optionsArr = ["Chase away birds", "Eat fruits", "Eat flies, mosquitoes and other insects", "Destroy the roof"];
                }
            }
            else if (theme.includes("Birds that eat pests")) {
                if (i % 3 === 0) {
                    questionText = "Which bird helps farmers by eating rats and mice in the field?";
                    correctAnswer = "Owl";
                    optionsArr = ["Parrot", "Owl", "Pigeon", "Dove"];
                } else if (i % 3 === 1) {
                    questionText = "Installing nest boxes for birds on farms encourages:";
                    correctAnswer = "Natural pest control";
                    optionsArr = ["More pesticides", "Weed growth", "Natural pest control", "Soil erosion"];
                } else {
                    questionText = "Weaverbirds and swallows eat large numbers of flying insects. This is important because:";
                    correctAnswer = "Reduces the need for chemical sprays";
                    optionsArr = ["Birds damage crops", "They compete with chickens", "Reduces the need for chemical sprays", "They steal seeds"];
                }
            }
            else if (theme.includes("Soil animals")) {
                if (i % 3 === 0) {
                    questionText = "Which small creature is called 'farmer's best friend' because it improves soil structure?";
                    correctAnswer = "Earthworm";
                    optionsArr = ["Millipede", "Earthworm", "Snail", "Termite"];
                } else if (i % 3 === 1) {
                    questionText = "How do dung beetles help farmers?";
                    correctAnswer = "They recycle animal waste and enrich soil";
                    optionsArr = ["They eat crops", "They make loud sounds", "They recycle animal waste and enrich soil", "They dig holes in trees"];
                } else {
                    questionText = "Ants help the farm ecosystem by:";
                    correctAnswer = "Aerating the soil and controlling some pests";
                    optionsArr = ["Eating all leaves", "Spreading diseases", "Aerating the soil and controlling some pests", "Stealing honey"];
                }
            }
            else if (theme.includes("Reptiles & amphibians")) {
                if (i % 3 === 0) {
                    questionText = "Small snakes like the house snake are useful because they:";
                    correctAnswer = "Control rats and mice populations";
                    optionsArr = ["Poison crops", "Control rats and mice populations", "Scare humans", "Eat fruits"];
                } else if (i % 3 === 1) {
                    questionText = "Why should a farmer not kill skinks (small lizards) in the garden?";
                    correctAnswer = "They eat insects and pests";
                    optionsArr = ["They bring rain", "They are sacred", "They eat insects and pests", "They produce milk"];
                } else {
                    questionText = "Creating a small pond on a farm can help conserve:";
                    correctAnswer = "Frogs, toads and dragonflies";
                    optionsArr = ["Lions only", "Frogs, toads and dragonflies", "Domestic ducks", "Camels"];
                }
            }
            else if (theme.includes("Small mammals")) {
                if (i % 3 === 0) {
                    questionText = "Mongooses are helpful on farms because they:";
                    correctAnswer = "Control snakes and rodents naturally";
                    optionsArr = ["Eat chicken eggs", "Control snakes and rodents naturally", "Dig up crops", "Spread weeds"];
                } else if (i % 3 === 1) {
                    questionText = "Hedgehogs are small wild animals that eat many pests. To protect them, farmers should:";
                    correctAnswer = "Avoid using harsh poisons and leave wild edges";
                    optionsArr = ["Catch them in cages", "Feed them sugar", "Avoid using harsh poisons and leave wild edges", "Cut down all bushes"];
                } else {
                    questionText = "Shrews look like mice but are different. They are beneficial because:";
                    correctAnswer = "They eat insects and pest larvae";
                    optionsArr = ["They destroy grains", "They eat insects and pest larvae", "They chase birds", "They make loud noises"];
                }
            }
            else if (theme.includes("Pollinators")) {
                if (i % 3 === 0) {
                    questionText = "Which small wild animal is the most important pollinator for fruits and vegetables?";
                    correctAnswer = "Honeybee";
                    optionsArr = ["Caterpillar", "Honeybee", "Cricket", "Spider"];
                } else if (i % 3 === 1) {
                    questionText = "Planting wildflowers around the farm helps conserve:";
                    correctAnswer = "Butterflies and bees";
                    optionsArr = ["Big herbivores", "Butterflies and bees", "Fish", "Eagles"];
                } else {
                    questionText = "What happens when farmers overuse pesticides that kill pollinators?";
                    correctAnswer = "Fewer fruits and vegetables are produced";
                    optionsArr = ["More honey", "Crops grow faster", "Fewer fruits and vegetables are produced", "The soil gets better"];
                }
            }
            else {
                // Threats & conservation methods
                if (i % 3 === 0) {
                    questionText = "Which human activity is a major threat to small wild animals on farms?";
                    correctAnswer = "Burning bushes and clearing all vegetation";
                    optionsArr = ["Planting trees", "Burning bushes and clearing all vegetation", "Making compost", "Collecting rainwater"];
                } else if (i % 3 === 1) {
                    questionText = "Leaving a strip of natural grass and bushes around a farm is called a buffer zone. It helps by:";
                    correctAnswer = "Providing shelter for small wildlife";
                    optionsArr = ["Destroying animal homes", "Providing shelter for small wildlife", "Blocking sunlight", "Making floods"];
                } else {
                    questionText = "How can a farmer reduce harm to small wild animals when controlling pests?";
                    correctAnswer = "Use natural predators and eco-friendly methods";
                    optionsArr = ["Spray more poisons", "Use natural predators and eco-friendly methods", "Drain all wetlands", "Cut all trees"];
                }
            }

            // ensure options are shuffled & contain correct unique distractors
            let allOptions = [correctAnswer, ...optionsArr.filter(opt => opt !== correctAnswer)];
            // remove possible duplicates and set exactly 4 options
            allOptions = [...new Set(allOptions)];
            while (allOptions.length < 4) {
                allOptions.push("Conserve wildlife");
            }
            // shuffle
            for (let s = allOptions.length - 1; s > 0; s--) {
                const rand = Math.floor(Math.random() * (s + 1));
                [allOptions[s], allOptions[rand]] = [allOptions[rand], allOptions[s]];
            }
            questionBank.push({
                id: qid++,
                level: level,
                text: questionText,
                options: allOptions.slice(0,4),
                correct: correctAnswer
            });
        }
    }

    // VERIFY 150 total
    console.log("Total small animals conservation questions: ", questionBank.length);

    // ----- GAME STATE ------
    let currentLevel = 1;
    let currentLevelQuestions = [];
    let currentQIndex = 0;
    let levelScore = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 0;
    let levelActive = true;
    let waitingForNext = false;

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const requiredInfo = document.getElementById('requiredInfo');
    const timerDisplay = document.getElementById('timerDisplay');
    const questionTextEl = document.getElementById('questionText');
    const progressInfo = document.getElementById('progressInfo');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextButton = document.getElementById('nextButton');

    function formatTime(sec) {
        let mins = Math.floor(sec / 60);
        let remainSec = sec % 60;
        return `${mins.toString().padStart(2,'0')}:${remainSec.toString().padStart(2,'0')}`;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Timer difficulty: Level1: 100s, Level2: 90s, Level3: 80s, Level4: 70s, Level5: 60s (very challenging)
        let baseSec = 105 - (currentLevel * 8);
        if (baseSec < 55) baseSec = 55;
        timeLeft = baseSec;
        timerDisplay.innerText = `⏱️ ${formatTime(timeLeft)}`;
        timerInterval = setInterval(() => {
            if (!levelActive || waitingForNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (levelActive) {
                    levelActive = false;
                    handleLevelFail("⏰ TIME'S UP! Small animals need fast thinking! You ran out of time.");
                }
            } else {
                timeLeft--;
                timerDisplay.innerText = `⏱️ ${formatTime(timeLeft)}`;
                if (timeLeft <= 10) timerDisplay.style.color = "#ff5e5e";
                else timerDisplay.style.color = "#ffdf7e";
            }
        }, 1000);
    }

    function loadQuestion() {
        if (!levelActive) return;
        if (currentQIndex >= currentLevelQuestions.length) {
            finishLevel();
            return;
        }
        answered = false;
        waitingForNext = false;
        nextButton.disabled = true;
        const q = currentLevelQuestions[currentQIndex];
        questionTextEl.innerText = q.text;
        progressInfo.innerText = `🐾 Q${currentQIndex+1} / ${currentLevelQuestions.length}`;
        optionsContainer.innerHTML = "";
        q.options.forEach(opt => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option-card';
            optDiv.innerText = opt;
            optDiv.addEventListener('click', () => {
                if (answered || !levelActive) return;
                handleAnswer(opt, q.correct);
            });
            optionsContainer.appendChild(optDiv);
        });
        feedbackMsg.innerHTML = "🐸 Pick an answer to help conserve wildlife!";
        nextButton.disabled = true;
    }

    function handleAnswer(selected, correct) {
        if (answered) return;
        answered = true;
        const isCorrect = (selected === correct);
        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = "✔️ CORRECT! You're helping small wild animals thrive! +1 point ✔️";
            const container = document.querySelector('.game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 250);
        } else {
            feedbackMsg.innerHTML = `❌ OOPS! The right answer is: "${correct}". Protect our little friends! ❌`;
        }
        const allOptions = document.querySelectorAll('.option-card');
        allOptions.forEach(opt => {
            opt.style.pointerEvents = 'none';
            if (opt.innerText === correct) {
                opt.style.backgroundColor = "#b9e6a3";
                opt.style.border = "2px solid #277c1e";
            } else if (opt.innerText === selected && !isCorrect) {
                opt.style.backgroundColor = "#f5aaaa";
            }
        });
        scoreDisplay.innerText = `🏆 SCORE: ${levelScore}`;
        nextButton.disabled = false;
        waitingForNext = true;
    }

    function nextQuestion() {
        if (!levelActive) return;
        if (!answered && currentQIndex < currentLevelQuestions.length) {
            feedbackMsg.innerHTML = "⚠️ Please select an answer before moving forward! ⚠️";
            return;
        }
        if (currentQIndex + 1 <= currentLevelQuestions.length) {
            currentQIndex++;
            if (currentQIndex < currentLevelQuestions.length) {
                loadQuestion();
            } else {
                finishLevel();
            }
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (!levelActive) return;
        stopTimer();
        levelActive = false;
        let total = currentLevelQuestions.length;
        let percent = (levelScore / total) * 100;
        let needed = 80;
        if (percent >= needed) {
            if (currentLevel === 5) {
                showGameWinModal(`🌟 WILDLIFE HERO! 🌟\nYou completed ALL 5 levels! Final score: ${levelScore}/${total} (${Math.floor(percent)}%)\nYou are a true Guardian of Small Animals!`);
            } else {
                showLevelUpModal(`🎉 LEVEL ${currentLevel} PASSED! 🎉\nScore: ${levelScore}/${total} (${Math.floor(percent)}%)\nMove to Level ${currentLevel+1} and save more creatures!`);
            }
        } else {
            handleLevelFail(`💔 LEVEL FAILED 💔\nYou scored ${levelScore}/${total} (${Math.floor(percent)}%). Need 80% to protect small wildlife. Try again!`);
        }
    }

    function handleLevelFail(message) {
        stopTimer();
        levelActive = false;
        showFailModal(message);
    }

    function advanceToNextLevel() {
        currentLevel++;
        if (currentLevel > 5) {
            showGameWinModal("🏅 ULTIMATE CONSERVATION CHAMPION! 🏅 You saved the small animals across all levels!");
            return;
        }
        initLevel();
    }

    function retryCurrentLevel() {
        initLevel();
    }

    function initLevel() {
        currentLevelQuestions = questionBank.filter(q => q.level === currentLevel);
        if (currentLevelQuestions.length !== 30) console.warn("missing level data");
        // shuffle questions for variety
        for (let i = currentLevelQuestions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentLevelQuestions[i], currentLevelQuestions[j]] = [currentLevelQuestions[j], currentLevelQuestions[i]];
        }
        currentQIndex = 0;
        levelScore = 0;
        answered = false;
        waitingForNext = false;
        levelActive = true;
        scoreDisplay.innerText = `🏆 SCORE: 0`;
        levelDisplay.innerText = `🦔 LEVEL ${currentLevel}`;
        requiredInfo.innerText = `🐾 NEED 80% (${Math.ceil(30*0.8)}/30)`;
        if (timerInterval) stopTimer();
        startLevelTimer();
        loadQuestion();
    }

    // MODAL UI
    function showLevelUpModal(msg) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>✨ LEVEL UP! ✨</h2>
                <p style="font-size:1.2rem; margin:15px 0;">${msg}</p>
                <button id="nextLevelBtn">➡️ CONTINUE ⬅️</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            modalDiv.remove();
            advanceToNextLevel();
        });
    }

    function showFailModal(msg) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card" style="border-color:#cc6f4a;">
                <h2>⚠️ LEVEL FAILED ⚠️</h2>
                <p style="font-size:1.1rem;">${msg}</p>
                <button id="retryBtn">🔄 TRY LEVEL AGAIN</button>
                <button id="resetGameBtn" style="background:#b87c2e;">🔁 RESTART GAME</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('retryBtn').addEventListener('click', () => {
            modalDiv.remove();
            retryCurrentLevel();
        });
        document.getElementById('resetGameBtn').addEventListener('click', () => {
            modalDiv.remove();
            fullGameReset();
        });
    }

    function showGameWinModal(msg) {
        stopTimer();
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card" style="background:#fff1cf;">
                <h2>🏆 VICTORY! 🏆</h2>
                <p style="font-size:1.3rem;">${msg}</p>
                <button id="playAgainBtn">🌿 PLAY AGAIN 🌿</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            modalDiv.remove();
            fullGameReset();
        });
    }

    function fullGameReset() {
        stopTimer();
        currentLevel = 1;
        initLevel();
    }

    nextButton.addEventListener('click', () => {
        if (!levelActive) return;
        if (answered || currentQIndex >= currentLevelQuestions.length) {
            nextQuestion();
        } else {
            feedbackMsg.innerHTML = "❗ Answer the current question first to help the animals! ❗";
        }
    });

    fullGameReset();
