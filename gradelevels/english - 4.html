<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Safe Community - Grade 1 CBC | Safety, Community Leaders & Living Together</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* input remains editable */
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e6091 0%, #1a4a6f 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #1e6091;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🚸👮‍♀️🤝 Bobo's Safe Community! Learn about Safety, Community Leaders & Living Together.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct word. Click speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT (all feedback in English) ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    // Read current question aloud
    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) {
            speakEnglish(qData.text);
        } else {
            speakEnglish("No question at the moment.");
        }
    }

    // ---------- QUESTION BANK: SAFETY, COMMUNITY LEADERS, LIVING TOGETHER ----------
    // Generate 40 unique narrative questions per level (5 levels, each with 40 questions)
    function generateQuestionsForLevel(level) {
        const questions = [];
        const topics = ['safety', 'leaders', 'together'];
        
        // SAFETY vocabulary bank (road safety, home safety, emergencies)
        const safetyBank = [
            { q: "You should cross the road at the ______ crossing.", a: "zebra" },
            { q: "The color of the traffic light that means STOP is ______.", a: "red" },
            { q: "The color of the traffic light that means GO is ______.", a: "green" },
            { q: "When you see a fire, you call the fire ______.", a: "department" },
            { q: "The emergency number to call for help is ______.", a: "911" },
            { q: "You should wear a ______ when riding a bicycle.", a: "helmet" },
            { q: "Never touch ______ things in the kitchen.", a: "hot" },
            { q: "If you get lost, look for a police ______.", a: "officer" },
            { q: "Always walk on the ______.", a: "sidewalk" },
            { q: "You should know your home ______ in case of emergency.", a: "address" }
        ];
        
        // COMMUNITY LEADERS vocabulary bank (helpers in the community)
        const leadersBank = [
            { q: "A person who puts out fires is a ______.", a: "firefighter" },
            { q: "A person who helps sick people is a ______.", a: "doctor" },
            { q: "A person who teaches children is a ______.", a: "teacher" },
            { q: "A person who keeps us safe and catches bad people is a ______.", a: "police officer" },
            { q: "The leader of a country is called the ______.", a: "president" },
            { q: "The leader of a city or town is the ______.", a: "mayor" },
            { q: "A person who drives an ambulance is a ______.", a: "paramedic" },
            { q: "A person who helps animals when they are sick is a ______.", a: "veterinarian" },
            { q: "A person who delivers letters is a ______.", a: "mail carrier" },
            { q: "A person who grows food for us is a ______.", a: "farmer" }
        ];
        
        // LIVING TOGETHER vocabulary bank (rules, respect, sharing, community)
        const togetherBank = [
            { q: "We should always wait for our ______ in line.", a: "turn" },
            { q: "When someone is speaking, we should ______.", a: "listen" },
            { q: "We show respect by saying '______' and 'please'.", a: "thank you" },
            { q: "Helping our neighbor is a way of showing ______.", a: "kindness" },
            { q: "We should ______ our toys with friends.", a: "share" },
            { q: "Following the ______ keeps everyone safe.", a: "rules" },
            { q: "We take care of our ______ by not littering.", a: "community" },
            { q: "When we work together, we are a ______.", a: "team" },
            { q: "We should treat others the way we want to be ______.", a: "treated" },
            { q: "Living together peacefully means no ______.", a: "fighting" }
        ];
        
        for (let i = 1; i <= 40; i++) {
            let topic = topics[(i + level) % 3];
            let qText = "";
            let correctAnswer = "";
            
            if (topic === 'safety') {
                let idx = (i * level) % safetyBank.length;
                let item = safetyBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                if (i % 7 === 0) qText = "You should always wear a ______ when you ride in a car.", correctAnswer = "seatbelt";
                if (i % 9 === 0) qText = "If a stranger offers you candy, you should say ______.", correctAnswer = "no";
                if (i % 11 === 0) qText = "The safe place to play is the ______.", correctAnswer = "playground";
            } 
            else if (topic === 'leaders') {
                let idx = (i * (level+1)) % leadersBank.length;
                let item = leadersBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                if (i % 6 === 0) qText = "The person who leads our school is the ______.", correctAnswer = "principal";
                if (i % 8 === 0) qText = "A person who fixes water pipes is a ______.", correctAnswer = "plumber";
                if (i % 10 === 0) qText = "A person who builds houses is a ______.", correctAnswer = "builder";
            } 
            else {
                let idx = (i * (level+2)) % togetherBank.length;
                let item = togetherBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                if (i % 5 === 0) qText = "We should keep our classroom ______.", correctAnswer = "clean";
                if (i % 12 === 0) qText = "When we take turns, we show ______.", correctAnswer = "patience";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0,40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;          // 40 seconds per question
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: Let's learn about staying safe, community helpers, and living together in harmony!";
        else if (currentLevel === 2) levelDesc = "Level 2: More safety tips, different leaders, and how to be a good neighbor!";
        else if (currentLevel === 3) levelDesc = "Level 3: Bobo needs your help! Answer about road safety, helpers, and sharing.";
        else if (currentLevel === 4) levelDesc = "Level 4: Almost an expert! Show what you know about emergencies, leaders, and teamwork.";
        else levelDesc = "Level 5: Final challenge! Become a Grade 1 champion of Safety, Community Leaders & Living Together!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you a Community Hero Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of Safety, Community Leaders, and Living Together! Keep our community safe and happy!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is so proud. You know how to stay safe, respect leaders, and live together peacefully! 🚸👮‍♀️🤝";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about safety, leaders, and living together!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to proceed. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Kid-friendly forgiving variations for common answers
        if (!isCorrect) {
            const forgiving = {
                "zebra": ["crosswalk", "pedestrian crossing"],
                "red": ["stop", "red light"],
                "green": ["go", "green light"],
                "911": ["nine one one", "emergency number"],
                "helmet": ["head protection"],
                "sidewalk": ["pavement", "footpath"],
                "address": ["home address", "house number"],
                "firefighter": ["fireman", "fire fighter"],
                "doctor": ["physician"],
                "teacher": ["instructor"],
                "police officer": ["policeman", "police", "cop"],
                "president": ["leader"],
                "mayor": ["city leader"],
                "mail carrier": ["postman", "mailman"],
                "farmer": ["agriculturist"],
                "turn": ["your turn"],
                "listen": ["pay attention"],
                "kindness": ["being kind", "niceness"],
                "share": ["share with others"],
                "rules": ["rule", "laws"],
                "team": ["group"],
                "seatbelt": ["seat belt"],
                "principal": ["head teacher"],
                "clean": ["tidy"],
                "patience": ["being patient"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // simple singular/plural tolerance
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The right answer is: "${currentQ.answer}". Keep learning! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    // Event listeners
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    // Initial load
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Safe Community! Learn about Safety, Community Leaders, and Living Together. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer in the box. Let's build a better community!");
        }, 500);
    });
</script>
</body>
</html>
