<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dear Digital Child | CBC Grade 5 English – Tech, Future & Quotation Marks</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f24 0%, #1a1f3a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fefce8;
            background-image: radial-gradient(circle at 15% 25%, rgba(100, 200, 255, 0.08) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,255,220,0.9);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #4ade80;
        }

        .game-header {
            background: linear-gradient(98deg, #0f3b3f, #10b981);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #fbbf24;
        }

        .level-badge {
            background: #fbbf24;
            color: #0f3b3f;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #b45309, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #115e59;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #fef08a;
            margin-right: 6px;
        }

        .progress-area {
            background: #e2e8f0;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #475569;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #10b981;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #334155;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #cbd5e1;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #0f172a;
            border: 1px solid #a7f3d0;
        }

        .voice-btn {
            background: #10b981;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #0f3b3f;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f3b3f;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #0f3b3f;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #cbd5e1;
            border-radius: 60px;
            background: #ffffff;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.3);
        }

        .hint-message {
            background: #f1f5f9;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #334155;
            font-style: italic;
            border-left: 7px solid #fbbf24;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #0f3b3f;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #0a2a2c;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a2a2c;
        }

        .submit-btn {
            background: #fbbf24;
            color: #0f172a;
            box-shadow: 0 4px 0 #b45309;
            flex: 2;
        }

        .next-btn {
            background: #2c6e5c;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #e6f7f5;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #fbbf24;
        }

        .timer.warning {
            color: #fef08a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>📱 SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">Dear Digital Child, your future awaits...</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word/phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). Use tech wisely!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // DEAR DIGITAL CHILD – CBC Grade 5 English
    // Topics: Listening, Speaking, Reading (Interactive listening),
    // Grammar: Future time using "will" and "shall"
    // Punctuation: Double quotation marks (" ")
    // Learning through technology
    // 5 levels × 30 questions. Timer 40s. Pass 80% to advance.
    // Voice output, fully responsive, open-ended. Hints when time ≤12s.
    // --------------------------------------------------------------

    // Generate rich, varied question bank (150 questions)
    function generateBankForLevel(level) {
        const bank = [];
        // 5 strands: 0:Future (will/shall)  1:Quotation marks  2:Tech & Interactive Listening  3:Reading (Interactive)  4:Speaking/Dialogue
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            let category = (i + level * 2) % 5;
            if (level === 1) category = i % 5;
            if (level === 2) category = (i + 3) % 5;
            if (level === 3) category = (i + 1) % 5;
            if (level === 4) category = (i + 4) % 5;
            if (level === 5) category = (i + 2) % 5;

            if (category === 0) { // Future time: will / shall
                const futureBank = [
                    { q: "Dear Digital Child, you ______ (shall/will) learn to code one day.", ans: "will", hint: "future prediction" },
                    { q: "We ______ (shall/will) protect our personal data online.", ans: "shall", hint: "obligation/promise with we" },
                    { q: "I ______ (will/shall) send you an email tomorrow.", ans: "will", hint: "simple future" },
                    { q: "______ (Will/Shall) we start the video call now?", ans: "shall", hint: "suggestion in question" },
                    { q: "The teacher said: 'You ______ (will/shall) complete your digital project.'", ans: "will", hint: "future instruction" },
                    { q: "I promise I ______ (will/shall) be kind online.", ans: "will", hint: "promise" }
                ];
                const pick = futureBank[i % futureBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Punctuation: Double Quotation Marks
                const quoteBank = [
                    { q: "In dialogue, put the speaker's exact words inside ______ marks.", ans: "quotation", hint: "double quotes \" \"" },
                    { q: "She said, ______ (\" / ') I love learning online.'", ans: "\"", hint: "double quote opening" },
                    { q: "The sentence: The boy shouted 'Help' needs ______ quotes.", ans: "double", hint: "double quotation marks" },
                    { q: "To quote a tech expert, use ______ quotation marks.", ans: "double", hint: "paired symbols" },
                    { q: "In writing, 'I will code' – the closing mark is a ______ (quote).", ans: "quote", hint: "quotation mark" },
                    { q: "A quotation begins with an opening ______ mark.", ans: "double", hint: "\" symbol" }
                ];
                const pick = quoteBank[i % quoteBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Learning through technology + interactive listening
                const techBank = [
                    { q: "An interactive listening activity uses ______ (audio/video).", ans: "audio", hint: "sound" },
                    { q: "You ______ (will/shall) use headphones for better listening.", ans: "will", hint: "future action" },
                    { q: "The digital child said, 'I ______ (will/shall) verify information online.'", ans: "will", hint: "future intention" },
                    { q: "A ______ is a device for typing.", ans: "keyboard", hint: "input device" },
                    { q: "To protect your privacy, create a strong ______.", ans: "password", hint: "secret code" },
                    { q: "Online safety rule: 'Never share your ______ with strangers.'", ans: "password", hint: "secret login" }
                ];
                const pick = techBank[i % techBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Reading (Interactive listening & dialogue)
                const readingBank = [
                    { q: "In the interactive story, the chatbot said, 'You ______ (will/shall) find the answer.'", ans: "will", hint: "future certainty" },
                    { q: "The digital quote: '______ (Learning/Playing) is power' – fill the word.", ans: "learning", hint: "gaining knowledge" },
                    { q: "While reading, we use ______ marks to show someone's speech.", ans: "quotation", hint: "double quotes" },
                    { q: "The message said: 'We ______ (shall/will) upgrade our skills!'", ans: "shall", hint: "strong intention" },
                    { q: "Interactive reading means you ______ (click/touch) to listen.", ans: "click", hint: "mouse action" }
                ];
                const pick = readingBank[i % readingBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Listening & Speaking (tech conversations)
                const lsBank = [
                    { q: "When listening to a digital story, pause and ______ notes.", ans: "take", hint: "write down" },
                    { q: "Speak ______ (clearly) when recording a voice message.", ans: "clearly", hint: "enunciate" },
                    { q: "The word 'quotation' has ______ syllables.", ans: "three", hint: "quo-ta-tion" },
                    { q: "In a conversation, use ______ to show you are listening.", ans: "feedback", hint: "nodding or short words" },
                    { q: "She said, '______ will you learn coding?' (When/What)", ans: "when", hint: "time question" }
                ];
                const pick = lsBank[i % lsBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech synthesis
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 Hint appears when ≤12s remain. Future digital skills!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ TIME'S UP! Correct answer: "${currentCorrectAnswer.toUpperCase()}". Press NEXT to continue.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "💌 Dear Digital Child, type your answer wisely! 💌";
        hintArea.innerHTML = "💡 Hint appears when timer is low. Use 'will', 'shall', and quotation marks!";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT for next digital mission.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        // special handling for quotation marks symbol
        let rawUser = userAnswerInput.value.trim();
        let correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible matching
        if (userAns === correct) isCorrect = true;
        else if (correct === "will" && (userAns === "shall" && !currentQuestions[currentIndex].text.includes("Shall we"))) isCorrect = false;
        else if (correct === "shall" && userAns === "will" && currentQuestions[currentIndex].text.includes("Shall we")) isCorrect = true;
        else if (correct === "quotation" && (userAns === "quote" || rawUser.includes("\""))) isCorrect = true;
        else if (correct === "\"" && (rawUser === "\"" || rawUser === "''" || userAns === "double quote")) isCorrect = true;
        else if (correct === "double" && (userAns === "double quotes" || userAns === "two")) isCorrect = true;
        else if (correct === "quote" && (userAns === "quotation" || rawUser === "\"")) isCorrect = true;
        else if (correct === "audio" && (userAns === "sound")) isCorrect = true;
        else if (correct === "keyboard" && (userAns === "keys" || userAns === "typing device")) isCorrect = true;
        else if (correct === "password" && (userAns === "secret word" || userAns === "passcode")) isCorrect = true;
        else if (correct === "learning" && (userAns === "education")) isCorrect = true;
        else if (correct === "click" && (userAns === "tap" || userAns === "press")) isCorrect = true;
        else if (correct === "take" && (userAns === "write")) isCorrect = true;
        else if (correct === "clearly" && (userAns === "loudly")) isCorrect = true;
        else if (correct === "three" && (userAns === "3")) isCorrect = true;
        else if (correct === "feedback" && (userAns === "response")) isCorrect = true;
        else if (correct === "when" && (userAns === "what time")) isCorrect = true;
        else if (userAns.includes(correct) && correct.length > 3 && !correct.includes(" ")) isCorrect = true;
        else if (correct.includes(userAns) && userAns.length > 2) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! You're a true digital child.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ DIGITAL HICCUP! Correct answer: "${correct.toUpperCase()}". You typed "${userAns}". Keep learning tech & grammar!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first or let the timer finish.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 DIGITAL CHAMPION! 🏆", `You conquered all levels with ${percent.toFixed(0)}%! You've mastered 'will', 'shall', double quotation marks, and tech learning. Dear Digital Child, mission accomplished!`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉`, `Score: ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}? The digital world expands!`, false);
            }
        } else {
            showLevelTransition(`⚠️ DIGITAL UPGRADE NEEDED`, `You scored ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to master future tense and quotation marks.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">📱 PLAY AGAIN 📱</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the adventure
    initLevel();
</script>
</body>
</html>
