<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Christian Values - Grade 1 CRE | Sharing, Obedience, Honesty & Thankfulness</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #4a7c59 0%, #2d5a3b 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #4a7c59;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🤝🙏✨ Bobo's Christian Values! Learn about Sharing, Obedience, Honesty & Thankfulness.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Sharing, Obedience, Honesty, Thankfulness ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // SHARING (giving, generosity, kindness)
        const sharing = [
            { q: "When you give some of your snack to a friend, you are ______.", a: "sharing" },
            { q: "Jesus wants us to ______ with those who have less.", a: "share" },
            { q: "Sharing shows that we are ______ and caring.", a: "kind" },
            { q: "You can share your ______ with your brother or sister.", a: "toys" },
            { q: "The Bible says it is better to give than to ______.", a: "receive" },
            { q: "When we share, we make others feel ______.", a: "happy" },
            { q: "Sharing our time with someone who is lonely is a good ______.", a: "deed" },
            { q: "God loves a ______ giver.", a: "cheerful" },
            { q: "You can share your ______ with a friend who forgot theirs.", a: "lunch" },
            { q: "Sharing helps us to be good ______.", a: "friends" }
        ];
        
        // OBEDIENCE (listening to parents, teachers, God)
        const obedience = [
            { q: "When you do what your parents ask, you are being ______.", a: "obedient" },
            { q: "Children should ______ their parents.", a: "obey" },
            { q: "Obeying your teacher shows ______.", a: "respect" },
            { q: "God wants us to ______ His commandments.", a: "follow" },
            { q: "When you obey, you keep yourself ______.", a: "safe" },
            { q: "The fifth commandment says 'Honor your father and your ______.'", a: "mother" },
            { q: "Obeying rules at home and school is a sign of good ______.", a: "character" },
            { q: "Jesus was ______ to Mary and Joseph.", a: "obedient" },
            { q: "When you obey quickly, you show you are ______.", a: "respectful" },
            { q: "Obeying God's word brings ______.", a: "blessings" }
        ];
        
        // HONESTY (truthfulness, not lying, integrity)
        const honesty = [
            { q: "Telling the truth is called ______.", a: "honesty" },
            { q: "A person who always tells the truth is ______.", a: "honest" },
            { q: "Lying is the opposite of being ______.", a: "honest" },
            { q: "When you make a mistake, you should honestly ______ it.", a: "admit" },
            { q: "God wants us to speak the ______.", a: "truth" },
            { q: "A person who steals is not being ______.", a: "honest" },
            { q: "If you find something that belongs to someone else, you should ______ it.", a: "return" },
            { q: "Honesty builds ______ with others.", a: "trust" },
            { q: "The ninth commandment says 'You shall not give false ______.'", a: "testimony" },
            { q: "Being honest makes you feel ______ inside.", a: "good" }
        ];
        
        // THANKFULNESS (gratitude, appreciation, thanksgiving)
        const thankfulness = [
            { q: "Saying 'thank you' shows ______.", a: "gratitude" },
            { q: "A person who is thankful is called ______.", a: "thankful" },
            { q: "We should thank God for the food we ______.", a: "eat" },
            { q: "Saying ______ to God for His blessings is important.", a: "thanks" },
            { q: "When someone helps you, you should say '______ you'.", a: "thank" },
            { q: "Being thankful makes us feel ______.", a: "joyful" },
            { q: "We should thank God for our family, friends, and ______.", a: "health" },
            { q: "A thankful heart is a ______ heart.", a: "happy" },
            { q: "Jesus gave thanks before ______ the bread and fish.", a: "breaking" },
            { q: "We should thank God every ______ for His love.", a: "day" }
        ];
        
        // ADDITIONAL VALUES & BIBLE VERSES
        const moreValues = [
            { q: "The Golden Rule says 'Do to others what you would have them do to ______.'", a: "you" },
            { q: "Love your neighbor as ______.", a: "yourself" },
            { q: "Be kind and ______ to one another.", a: "compassionate" },
            { q: "A gentle answer turns away ______.", a: "anger" },
            { q: "Let your light shine before ______.", a: "others" }
        ];
        
        const allTopics = [...sharing, ...obedience, ...honesty, ...thankfulness, ...moreValues];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo has two cookies. He gives one to his friend. Bobo is ______ his snack.";
                correctAnswer = "sharing";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "When Bobo's mother tells him to clean his room, he does it right away. Bobo is being ______.";
                correctAnswer = "obedient";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Bobo accidentally broke a cup. He told his mother the truth. Bobo is being ______.";
                correctAnswer = "honest";
            }
            if (i % 8 === 0) {
                qText = "After dinner, Bobo said 'Thank you' to his mother for the delicious meal. Bobo showed ______.";
                correctAnswer = "gratitude";
            }
            if (i % 9 === 0) {
                qText = "The Bible says we should ______ one another as God loves us.";
                correctAnswer = "love";
            }
            if (i % 11 === 0) {
                qText = "When you share your toys with a friend, you are showing ______.";
                correctAnswer = "kindness";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: Sharing! Learn how to share with friends and family.";
        else if (currentLevel === 2) levelDesc = "Level 2: Obedience! Listen to parents, teachers, and God.";
        else if (currentLevel === 3) levelDesc = "Level 3: Honesty! Always tell the truth, even when it's hard.";
        else if (currentLevel === 4) levelDesc = "Level 4: Thankfulness! Say thank you to God and others.";
        else levelDesc = "Level 5: Final challenge! Become a Grade 1 Christian Values Champion!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Christian Values Champion Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of Sharing, Obedience, Honesty, and Thankfulness! Let your light shine for Jesus!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know how to share, obey, tell the truth, and be thankful! 🤝🙏✨❤️";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep growing in Christian values!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for English answers
        if (!isCorrect) {
            const forgiving = {
                "sharing": ["share", "giving", "generosity"],
                "share": ["give", "offer", "donate"],
                "kind": ["nice", "caring", "loving"],
                "toys": ["toy", "games", "playthings"],
                "receive": ["take", "get", "accept"],
                "happy": ["joyful", "glad", "pleased"],
                "deed": ["action", "act", "good work"],
                "cheerful": ["joyful", "happy", "willing"],
                "lunch": ["food", "meal", "snack"],
                "friends": ["friend", "playmates"],
                "obedient": ["good", "listening", "well-behaved"],
                "obey": ["listen to", "follow", "do as told"],
                "respect": ["honor", "admiration", "good manners"],
                "follow": ["keep", "observe", "do"],
                "safe": ["protected", "secure", "out of danger"],
                "mother": ["mom", "mum", "mother"],
                "character": ["behavior", "nature", "personality"],
                "respectful": ["polite", "considerate", "mannerly"],
                "blessings": ["good things", "favors", "gifts"],
                "honesty": ["truthfulness", "integrity"],
                "honest": ["truthful", "sincere", "straightforward"],
                "admit": ["confess", "acknowledge", "own up"],
                "truth": ["fact", "reality", "what's right"],
                "return": ["give back", "send back"],
                "trust": ["faith", "confidence", "reliance"],
                "testimony": ["witness", "evidence"],
                "good": ["fine", "nice", "pleasant"],
                "gratitude": ["thankfulness", "appreciation", "thanks"],
                "thankful": ["grateful", "appreciative"],
                "eat": ["consume", "have a meal"],
                "thanks": ["thank you", "gratitude"],
                "thank": ["thank you", "give thanks"],
                "joyful": ["happy", "delighted", "glad"],
                "health": ["wellness", "well-being"],
                "breaking": ["sharing", "dividing", "tearing"],
                "day": ["each day", "every day"],
                "you": ["yourself", "themselves"],
                "yourself": ["you", "yourselves"],
                "compassionate": ["kind", "merciful", "gentle"],
                "anger": ["wrath", "fury", "rage"],
                "others": ["people", "everyone", "neighbors"],
                "love": ["care for", "cherish", "adore"],
                "kindness": ["niceness", "caring", "gentleness"],
                "receiving": ["getting", "taking"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // Accept plural/singular
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep learning Christian values! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Christian Values! Learn about Sharing, Obedience, Honesty, and Thankfulness. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's grow good values together!");
        }, 500);
    });
</script>
</body>
</html>
