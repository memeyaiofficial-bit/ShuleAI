<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade 1 CBC Maths: Mass | Heavier Than & Lighter Than</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffaa4a;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #e07c2c;
        }

        .level-badge {
            background: #2e7d64;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1e5a48, 0 4px 10px rgba(0,0,0,0.1);
        }

        .score-box {
            background: #f9a825;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #2c2c2c;
        }

        .timer-area {
            background: #1f2f3a;
            padding: 6px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: bold;
        }

        .timer-clock {
            font-size: 1.9rem;
            font-family: monospace;
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            letter-spacing: 2px;
        }

        .question-card {
            padding: 30px 35px 20px;
            text-align: center;
        }

        .question-text {
            font-size: 1.8rem;
            background: #fff2df;
            padding: 25px 20px;
            border-radius: 70px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 12px 20px rgba(0,0,0,0.1);
            font-weight: bold;
            margin-bottom: 30px;
            border: 3px solid #ffcf9a;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .voice-btn, .next-btn {
            background: #ffe0b5;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #b97f3a;
            color: #3b2a1f;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .next-btn {
            background: #66bb6a;
            box-shadow: 0 4px 0 #2e6b2f;
            color: white;
        }

        .voice-btn:active, .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b97f3a;
        }

        .next-btn:active {
            box-shadow: 0 1px 0 #2e6b2f;
        }

        .hint-area {
            background: #ffcd94;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #3b2a1f;
            box-shadow: none;
            min-height: 70px;
        }

        .answer-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 20px;
        }

        #studentAnswer {
            flex: 2;
            min-width: 200px;
            font-size: 1.5rem;
            padding: 18px 24px;
            border-radius: 60px;
            border: 3px solid #ffb465;
            font-family: inherit;
            text-align: center;
            background: white;
            outline: none;
        }

        .submit-btn {
            background: #4caf50;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e6b2f;
            transition: 0.05s linear;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2e6b2f;
        }

        .feedback {
            margin: 15px 20px 25px;
            padding: 12px;
            font-size: 1.3rem;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
        }

        .progress-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #7b5a3b;
        }

        @media (max-width: 650px) {
            .game-header {
                flex-direction: column;
                text-align: center;
            }
            .question-text {
                font-size: 1.3rem;
            }
            #studentAnswer {
                font-size: 1.2rem;
                padding: 14px 18px;
            }
            .submit-btn {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">⚖️ LEVEL 1</div>
        <div class="score-box" id="scoreDisplay">✅ SCORE: 0 / 0</div>
        <div class="timer-area">
            ⏱️ TIME LEFT
            <span class="timer-clock" id="timerCountdown">40</span>
        </div>
    </div>

    <div class="question-card">
        <div class="question-text" id="questionText">Loading fun challenge...</div>
        <div class="action-buttons">
            <button class="voice-btn" id="readAloudBtn">🔊 READ QUESTION</button>
            <button class="next-btn" id="nextQuestionBtn">⏩ NEXT QUESTION</button>
        </div>
        <div class="hint-area" id="hintBox">💡 Hint will appear here as time goes</div>
        <div class="answer-area">
            <input type="text" id="studentAnswer" placeholder="Type your answer..." autocomplete="off">
            <button class="submit-btn" id="submitAnswer">✔️ CHECK ANSWER</button>
        </div>
        <div class="feedback" id="feedbackMsg">⚖️ Answer each question! 80% needed to level up.</div>
        <div class="progress-info" id="progressInfo">Question 1 / 30</div>
    </div>
</div>

<script>
    (function() {
        // Speech helper
        function speakText(text, isTimeUp = false) {
            try {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                if (isTimeUp) utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch(e) {
                console.log("Speech error:", e);
            }
        }
        
        // ---------- QUESTION BANK (3 main topics with variations) ----------
        // Topics: 
        // 1. Identifying mass of different objects (which is heavier/lighter)
        // 2. Comparing mass using "heavier than"
        // 3. Comparing mass using "lighter than"
        
        const allQuestions = [];
        
        // Helper function to add questions
        function addQuestions(arr) {
            for (let i = 0; i < arr.length; i++) {
                allQuestions.push(arr[i]);
            }
        }
        
        // TOPIC 1: Identifying mass of different objects (real-world comparisons)
        const identifyMassBank = [
            { text: "Which is heavier: a feather or a brick?", correct: "brick", alt: "brick", topic: "Identifying Mass" },
            { text: "Which is lighter: a pencil or a book?", correct: "pencil", alt: "pencil", topic: "Identifying Mass" },
            { text: "Which has more mass: an elephant or a mouse?", correct: "elephant", alt: "elephant", topic: "Identifying Mass" },
            { text: "Which has less mass: a car or a bicycle?", correct: "bicycle", alt: "bike", topic: "Identifying Mass" },
            { text: "Which is heavier: a watermelon or a grape?", correct: "watermelon", alt: "melon", topic: "Identifying Mass" },
            { text: "Which is lighter: a pillow or a table?", correct: "pillow", alt: "pillow", topic: "Identifying Mass" },
            { text: "Which has more mass: a dog or a cat?", correct: "dog", alt: "dog", topic: "Identifying Mass" },
            { text: "Which has less mass: a spoon or a pot?", correct: "spoon", alt: "spoon", topic: "Identifying Mass" },
            { text: "Which is heavier: a rock or a leaf?", correct: "rock", alt: "rock", topic: "Identifying Mass" },
            { text: "Which is lighter: a chair or a paper clip?", correct: "paper clip", alt: "clip", topic: "Identifying Mass" },
            { text: "Which has more mass: a bus or a skateboard?", correct: "bus", alt: "bus", topic: "Identifying Mass" },
            { text: "Which has less mass: a teddy bear or a real bear?", correct: "teddy bear", alt: "teddy", topic: "Identifying Mass" },
            { text: "Which is heavier: a full water bottle or an empty one?", correct: "full water bottle", alt: "full bottle", topic: "Identifying Mass" },
            { text: "Which is lighter: a cotton ball or a marble?", correct: "cotton ball", alt: "cotton", topic: "Identifying Mass" },
            { text: "Which has more mass: a grown-up or a baby?", correct: "grown-up", alt: "adult", topic: "Identifying Mass" }
        ];
        
        // TOPIC 2: Comparing mass using "heavier than"
        const heavierThanBank = [
            { text: "Complete the sentence: An elephant is ______ than a mouse.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A brick is ______ than a feather.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A table is ______ than a chair.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A car is ______ than a bicycle.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A watermelon is ______ than an apple.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A book is ______ than a pencil.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A refrigerator is ______ than a toaster.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A full bucket of water is ______ than an empty bucket.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A school bag with books is ______ than an empty school bag.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A stone is ______ than a sponge.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A metal spoon is ______ than a plastic spoon.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A sofa is ______ than a cushion.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A television is ______ than a mobile phone.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A pineapple is ______ than a strawberry.", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A dictionary is ______ than a notebook.", correct: "heavier", alt: "heavier", topic: "Heavier Than" }
        ];
        
        // TOPIC 3: Comparing mass using "lighter than"
        const lighterThanBank = [
            { text: "Complete the sentence: A feather is ______ than a brick.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A mouse is ______ than an elephant.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A pencil is ______ than a book.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A bicycle is ______ than a car.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A grape is ______ than a watermelon.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A pillow is ______ than a table.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A cat is ______ than a dog.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A spoon is ______ than a pot.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A leaf is ______ than a rock.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A paper clip is ______ than a chair.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A skateboard is ______ than a bus.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A teddy bear is ______ than a real bear.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "An empty bottle is ______ than a full bottle.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A cotton ball is ______ than a marble.", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "A baby is ______ than a grown-up.", correct: "lighter", alt: "lighter", topic: "Lighter Than" }
        ];
        
        // Additional mixed questions for more variety
        const mixedMassBank = [
            { text: "Which is heavier: a bag of sugar or a bag of flour? (same size bag)", correct: "same", alt: "equal", topic: "Identifying Mass" },
            { text: "Does a kilogram of cotton or a kilogram of iron weigh more?", correct: "same", alt: "equal", topic: "Identifying Mass" },
            { text: "Which is lighter: a foam ball or a tennis ball?", correct: "foam ball", alt: "foam", topic: "Identifying Mass" },
            { text: "Which is heavier: a metal coin or a paper note?", correct: "metal coin", alt: "coin", topic: "Identifying Mass" },
            { text: "Which is lighter: a plastic cup or a glass cup?", correct: "plastic cup", alt: "plastic", topic: "Identifying Mass" },
            { text: "A pineapple is ______ than a banana (heavier/lighter).", correct: "heavier", alt: "heavier", topic: "Heavier Than" },
            { text: "A banana is ______ than a pineapple (heavier/lighter).", correct: "lighter", alt: "lighter", topic: "Lighter Than" },
            { text: "Which has more mass: a school bus or a car?", correct: "school bus", alt: "bus", topic: "Identifying Mass" },
            { text: "Which has less mass: a coin or a phone?", correct: "coin", alt: "coin", topic: "Identifying Mass" },
            { text: "A feather pillow is ______ than a wooden chair.", correct: "lighter", alt: "lighter", topic: "Lighter Than" }
        ];
        
        // Add all questions to master bank
        addQuestions(identifyMassBank);
        addQuestions(heavierThanBank);
        addQuestions(lighterThanBank);
        addQuestions(mixedMassBank);
        
        console.log("Total questions in bank:", allQuestions.length);
        
        // Fisher-Yates shuffle
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        // Generate 30 UNIQUE questions per level with balanced topics
        function generateLevelQuestions() {
            // Shuffle master bank
            let shuffled = shuffleArray([...allQuestions]);
            
            // Group by topic
            const identifyMass = shuffled.filter(q => q.topic === "Identifying Mass");
            const heavierThan = shuffled.filter(q => q.topic === "Heavier Than");
            const lighterThan = shuffled.filter(q => q.topic === "Lighter Than");
            
            // Take 10 from each topic to make 30
            let selected = [];
            selected = selected.concat(identifyMass.slice(0, 10));
            selected = selected.concat(heavierThan.slice(0, 10));
            selected = selected.concat(lighterThan.slice(0, 10));
            
            // Ensure we have 30 questions
            while (selected.length < 30) {
                selected.push(allQuestions[selected.length % allQuestions.length]);
            }
            if (selected.length > 30) selected = selected.slice(0, 30);
            
            // Shuffle and ensure uniqueness
            selected = shuffleArray(selected);
            const unique = [];
            const seen = new Set();
            for (let i = 0; i < selected.length; i++) {
                if (!seen.has(selected[i].text)) {
                    seen.add(selected[i].text);
                    unique.push(selected[i]);
                }
            }
            while (unique.length < 30) {
                unique.push(allQuestions[unique.length % allQuestions.length]);
            }
            return unique.slice(0, 30);
        }
        
        // DOM elements
        const levelDisplay = document.getElementById('levelDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerSpan = document.getElementById('timerCountdown');
        const questionDiv = document.getElementById('questionText');
        const answerInput = document.getElementById('studentAnswer');
        const submitBtn = document.getElementById('submitAnswer');
        const readBtn = document.getElementById('readAloudBtn');
        const nextBtn = document.getElementById('nextQuestionBtn');
        const hintBoxDiv = document.getElementById('hintBox');
        const feedbackDiv = document.getElementById('feedbackMsg');
        const progressSpan = document.getElementById('progressInfo');
        
        // Game state
        let currentLevel = 0;
        let currentQIndex = 0;
        let currentQuestions = [];
        let correctCount = 0;
        let answeredCount = 0;
        let timerInterval = null;
        let timeLeft = 40;
        let waitingForAnswer = true;
        let answerSubmitted = false;
        let currentQuestion = null;
        let gameActive = true;
        let levelLocked = false;
        
        function updateUI() {
            scoreDisplay.innerText = "✅ SCORE: " + correctCount + " / " + answeredCount;
            progressSpan.innerText = "Question " + (answeredCount + 1) + " / " + currentQuestions.length;
        }
        
        function getTopicEmoji(topic) {
            if (topic === "Identifying Mass") return "⚖️";
            if (topic === "Heavier Than") return "⬇️⚖️";
            if (topic === "Lighter Than") return "⬆️⚖️";
            return "🎯";
        }
        
        function updateHint(seconds, q) {
            if (!q) return;
            const emoji = getTopicEmoji(q.topic);
            if (seconds > 28) {
                hintBoxDiv.innerHTML = emoji + " Topic: " + q.topic + ". Think about which object has more mass!";
            } else if (seconds > 18) {
                hintBoxDiv.innerHTML = "🔎 Hint: Think about real life! Which one would be harder to lift?";
            } else if (seconds > 8) {
                let answerHint = q.correct;
                hintBoxDiv.innerHTML = "✨ Strong hint: The answer is \"" + answerHint + "\". Type it now!";
            } else if (seconds > 2) {
                hintBoxDiv.innerHTML = "🚀 Last " + seconds + " seconds! Answer: " + q.correct + " . Quickly!";
            } else {
                hintBoxDiv.innerHTML = "⏰ Almost out of time! Type 'heavier', 'lighter', or the object name!";
            }
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function startTimer() {
            if (timerInterval) stopTimer();
            timeLeft = 40;
            timerSpan.innerText = timeLeft;
            updateHint(timeLeft, currentQuestion);
            timerInterval = setInterval(function() {
                if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (waitingForAnswer && !answerSubmitted) {
                        speakText("Time is up!", true);
                        waitingForAnswer = false;
                        answerSubmitted = true;
                        feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                        feedbackDiv.style.background = "#ffccbb";
                        setTimeout(function() {
                            if (!levelLocked) moveToNext();
                        }, 1500);
                    }
                } else {
                    timeLeft--;
                    timerSpan.innerText = timeLeft;
                    updateHint(timeLeft, currentQuestion);
                }
            }, 1000);
        }
        
        function checkAnswer() {
            if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ Wait! Already answered or question finished.";
                return;
            }
            let userAnswer = answerInput.value.trim().toLowerCase();
            if (userAnswer === "") {
                speakText("Please type an answer.");
                feedbackDiv.innerHTML = "✏️ Type your answer before checking!";
                return;
            }
            
            // Normalize common variations
            const normalizedMap = {
                "heavier": "heavier",
                "heavier than": "heavier",
                "lighter": "lighter",
                "lighter than": "lighter",
                "brick": "brick",
                "feather": "feather",
                "elephant": "elephant",
                "mouse": "mouse",
                "car": "car",
                "bicycle": "bicycle",
                "bike": "bicycle",
                "watermelon": "watermelon",
                "melon": "watermelon",
                "grape": "grape",
                "pillow": "pillow",
                "table": "table",
                "dog": "dog",
                "cat": "cat",
                "spoon": "spoon",
                "pot": "pot",
                "rock": "rock",
                "leaf": "leaf",
                "paper clip": "paper clip",
                "clip": "paper clip",
                "bus": "bus",
                "skateboard": "skateboard",
                "teddy bear": "teddy bear",
                "teddy": "teddy bear",
                "full water bottle": "full water bottle",
                "full bottle": "full water bottle",
                "empty bottle": "empty bottle",
                "cotton ball": "cotton ball",
                "cotton": "cotton ball",
                "marble": "marble",
                "grown-up": "grown-up",
                "adult": "grown-up",
                "baby": "baby",
                "same": "same",
                "equal": "same",
                "pencil": "pencil",
                "book": "book",
                "chair": "chair",
                "feather pillow": "feather pillow",
                "foam ball": "foam ball",
                "tennis ball": "tennis ball",
                "metal coin": "metal coin",
                "coin": "coin",
                "paper note": "paper note",
                "plastic cup": "plastic cup",
                "glass cup": "glass cup"
            };
            
            let normalizedAnswer = normalizedMap[userAnswer] || userAnswer;
            const correctAns = currentQuestion.correct.toLowerCase();
            const altAns = currentQuestion.alt ? currentQuestion.alt.toLowerCase() : "";
            
            const isCorrect = (normalizedAnswer === correctAns) || (altAns !== "" && normalizedAnswer === altAns);
            
            answerSubmitted = true;
            waitingForAnswer = false;
            stopTimer();
            
            if (isCorrect) {
                correctCount++;
                speakText("Correct! Great job!");
                feedbackDiv.innerHTML = "🎉 CORRECT! +1 point 🎉";
                feedbackDiv.style.background = "#c8e6c9";
            } else {
                speakText("Incorrect. The correct answer is " + currentQuestion.correct + ".");
                feedbackDiv.innerHTML = "❌ INCORRECT! The right answer: \"" + currentQuestion.correct + "\". Keep trying!";
                feedbackDiv.style.background = "#ffcdd2";
            }
            answeredCount++;
            updateUI();
            submitBtn.disabled = true;
            answerInput.disabled = true;
        }
        
        function moveToNext() {
            if (levelLocked) return;
            if (answeredCount >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQIndex++;
            loadQuestion(currentQIndex);
        }
        
        function finishLevel() {
            const percent = (correctCount / currentQuestions.length) * 100;
            if (percent >= 80) {
                if (currentLevel + 1 < 5) {
                    speakText("Excellent! You passed level " + (currentLevel+1) + " with " + Math.floor(percent) + " percent. Get ready for level " + (currentLevel+2) + ".");
                    feedbackDiv.innerHTML = "🎊 LEVEL UP! 🎊 You scored " + correctCount + "/" + currentQuestions.length + " (" + Math.floor(percent) + "%) → Next Level!";
                    feedbackDiv.style.background = "#ffecb3";
                    currentLevel++;
                    loadLevel(currentLevel);
                } else {
                    gameActive = false;
                    stopTimer();
                    levelLocked = true;
                    feedbackDiv.innerHTML = "🏆🏆🏆 GRAND CHAMPION! You completed all 5 levels! Final score: " + correctCount + "/" + currentQuestions.length + " 🏆🏆🏆";
                    speakText("Congratulations! You finished the CBC Grade 1 Mass challenge! You are a maths superstar!");
                    submitBtn.disabled = true;
                    readBtn.disabled = true;
                    nextBtn.disabled = true;
                    answerInput.disabled = true;
                    timerSpan.innerText = "🎉";
                    return;
                }
            } else {
                speakText("Oh no! You got " + correctCount + " out of " + currentQuestions.length + ". Need 80 percent to pass. Restarting level " + (currentLevel+1) + " with new questions.");
                feedbackDiv.innerHTML = "⚠️ " + Math.floor(percent) + "% only. Need 80% to pass. Same level restarts with fresh questions! ⚠️";
                feedbackDiv.style.background = "#ffb3ba";
                loadLevel(currentLevel);
            }
        }
        
        function loadQuestion(index) {
            if (index >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQuestion = currentQuestions[index];
            questionDiv.innerText = currentQuestion.text;
            waitingForAnswer = true;
            answerSubmitted = false;
            submitBtn.disabled = false;
            answerInput.disabled = false;
            answerInput.value = "";
            answerInput.focus();
            feedbackDiv.style.background = "#fff3e0";
            feedbackDiv.innerHTML = "⚖️ Type your answer and click CHECK!";
            updateUI();
            if (timerInterval) stopTimer();
            startTimer();
        }
        
        function loadLevel(levelIdx) {
            levelLocked = false;
            gameActive = true;
            currentLevel = levelIdx;
            currentQIndex = 0;
            correctCount = 0;
            answeredCount = 0;
            currentQuestions = generateLevelQuestions();
            levelDisplay.innerText = "⚖️ LEVEL " + (currentLevel+1) + " ⚖️";
            updateUI();
            loadQuestion(0);
        }
        
        function readQuestion() {
            if (currentQuestion && gameActive && !levelLocked) {
                speakText(currentQuestion.text);
            } else if (!currentQuestion) {
                speakText("No question loaded");
            }
        }
        
        function manualNext() {
            if (levelLocked || !gameActive) {
                feedbackDiv.innerHTML = "⚠️ Level transition or game finished!";
                return;
            }
            if (waitingForAnswer && !answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ You haven't answered yet! Please check your answer first.";
                speakText("Please check your answer before moving.");
                return;
            }
            if (answerSubmitted && !waitingForAnswer) {
                stopTimer();
                moveToNext();
            }
        }
        
        // Event listeners
        submitBtn.addEventListener('click', checkAnswer);
        readBtn.addEventListener('click', readQuestion);
        nextBtn.addEventListener('click', manualNext);
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !answerSubmitted && waitingForAnswer) {
                checkAnswer();
            }
        });
        
        // Start game
        loadLevel(0);
    })();
</script>
</body>
</html>
