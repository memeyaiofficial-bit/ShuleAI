<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Harvest Hero: Food Production & Nutrition | CBC Grade 4 Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #f5a623 0%, #d47c1a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 950px;
            width: 100%;
            background: #fff7e8;
            border-radius: 70px 70px 60px 60px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 5px rgba(255,250,200,0.9);
            overflow: hidden;
        }

        .game-header {
            background: #ffb347;
            padding: 16px 25px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 5px solid #b4621a;
            font-weight: bold;
        }

        .level-badge, .score-badge, .accuracy-badge {
            background: #3c6e2f;
            color: #fff2c1;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1rem;
            box-shadow: inset 0 -2px 0 #23521a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #2c2b26;
            color: #ffdd88;
            padding: 8px 20px;
            border-radius: 60px;
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .question-box {
            background: #fff3df;
            margin: 25px 30px 15px 30px;
            padding: 25px 20px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #4a6e2c;
            margin: 0 0 15px 0;
            line-height: 1.3;
        }

        .progress-info {
            font-size: 1rem;
            background: #e9dbbd;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 60px;
            color: #5e3a0e;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin: 10px 30px 25px 30px;
        }

        .option-card {
            background: #feedcf;
            border-radius: 50px;
            padding: 14px 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            color: #3e5a24;
            cursor: pointer;
            transition: all 0.12s linear;
            border: 2px solid #dba451;
            box-shadow: 0 5px 0 #b2702c;
        }

        .option-card:hover {
            background: #ffe2b5;
            transform: scale(0.97);
            border-color: #c97e2e;
        }

        .option-card:active {
            transform: scale(0.96);
            box-shadow: 0 2px 0 #b2702c;
        }

        .feedback-area {
            background: #ecdfbe;
            margin: 5px 30px 20px 30px;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .feedback-message {
            font-size: 1rem;
            font-weight: bold;
            padding-left: 10px;
            color: #4c6b2b;
        }

        .next-btn {
            background: #f28c1e;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 32px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #b45a1a;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b45a1a;
        }

        .next-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-card {
            background: #fff5e6;
            max-width: 500px;
            width: 90%;
            border-radius: 70px;
            padding: 25px 20px 35px;
            text-align: center;
            box-shadow: 0 20px 35px black;
            border: 5px solid #ffb347;
        }

        .modal-card h2 {
            font-size: 2rem;
            margin: 0;
            color: #c96f1a;
        }

        .modal-card button {
            background: #e6831e;
            border: none;
            font-size: 1.2rem;
            padding: 10px 28px;
            margin-top: 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 8px;
        }

        .shake {
            animation: shakeAnim 0.25s ease-in-out 0s 2;
        }

        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        @media (max-width: 650px) {
            .question-text { font-size: 1.2rem; }
            .option-card { font-size: 0.85rem; padding: 10px; }
            .timer-area { font-size: 1.3rem; }
        }

        .icon-em {
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="game-container" id="gameApp">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🌾 LEVEL 1</div>
        <div class="score-badge" id="scoreDisplay">🍎 SCORE: 0</div>
        <div class="accuracy-badge" id="requiredInfo">⭐ NEED 80%</div>
        <div class="timer-area" id="timerDisplay">⏱️ 00:00</div>
    </div>

    <div class="question-box">
        <div class="question-text" id="questionText">Loading food production challenge...</div>
        <div class="progress-info" id="progressInfo">Q1 / 30</div>
    </div>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="feedback-area">
        <div class="feedback-message" id="feedbackMsg">🥕 Choose the best answer to become a Harvest Hero!</div>
        <button class="next-btn" id="nextButton">🍽️ NEXT</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC GAME: Food Production Processes on Agriculture
    // TOPICS: 
    // 1. Direct sowing of tiny seeds
    // 2. Growing fruits (tree & bush fruits, care, harvesting)
    // 3. Uses of domestic animals (milk, eggs, ploughing, manure, etc.)
    // 4. Balanced diet (food groups, nutrients, healthy eating)
    // 5. Boiling and shallow frying food (methods, safety, nutrition)
    // 5 levels × 30 questions = 150 unique, engaging, curriculum-based
    // Need 80% to advance. Timer gets progressively harder.
    // --------------------------------------------------------------

    const questionBank = [];

    let qid = 1;

    // Helper: create rich, varied, addictive questions
    const topics = [
        "Direct Sowing", "Growing Fruits", "Uses of Domestic Animals", 
        "Balanced Diet", "Boiling & Shallow Frying"
    ];

    // Generate 150 questions (30 per level)
    for (let level = 1; level <= 5; level++) {
        for (let i = 0; i < 30; i++) {
            // Distribute topics evenly across level
            let topicIndex = (i + level * 2) % topics.length;
            let topic = topics[topicIndex];
            let questionText = "";
            let correctAnswer = "";
            let options = [];

            // ----- DIRECT SOWING OF TINY SEEDS -----
            if (topic === "Direct Sowing") {
                if (i % 4 === 0) {
                    questionText = "What is direct sowing?";
                    correctAnswer = "Planting seeds directly into the garden soil";
                    options = ["Planting seeds in pots first", "Planting seeds directly into the garden soil", "Sowing seeds in water", "Using only machine planting"];
                } else if (i % 4 === 1) {
                    questionText = "Which tiny seeds are best sown directly in rows for better growth?";
                    correctAnswer = "Carrot and radish seeds";
                    options = ["Mango seeds", "Carrot and radish seeds", "Coconut seeds", "Avocado seeds"];
                } else if (i % 4 === 2) {
                    questionText = "When direct sowing tiny seeds, why do farmers mix them with sand?";
                    correctAnswer = "To spread them evenly without overcrowding";
                    options = ["To make them grow faster", "To change their color", "To spread them evenly without overcrowding", "To prevent birds from eating"];
                } else {
                    questionText = "After direct sowing tiny seeds, what is the most important step?";
                    correctAnswer = "Light watering to avoid washing seeds away";
                    options = ["Heavy flooding", "Light watering to avoid washing seeds away", "Covering with plastic", "Adding lots of fertilizer"];
                }
            }
            // ----- GROWING FRUITS -----
            else if (topic === "Growing Fruits") {
                if (i % 4 === 0) {
                    questionText = "Which of these is a proper way to care for fruit trees?";
                    correctAnswer = "Pruning and mulching regularly";
                    options = ["Burning leaves", "Pruning and mulching regularly", "Watering once a month", "Planting in shade only"];
                } else if (i % 4 === 1) {
                    questionText = "Why do farmers add manure around fruit trees?";
                    correctAnswer = "It provides nutrients for healthy fruits";
                    options = ["It makes fruits sour", "It provides nutrients for healthy fruits", "It keeps animals away", "It changes leaf color"];
                } else if (i % 4 === 2) {
                    questionText = "What does 'thinning fruits' mean in fruit growing?";
                    correctAnswer = "Removing some small fruits so the rest grow bigger";
                    options = ["Adding more seeds", "Removing some small fruits so the rest grow bigger", "Watering heavily", "Planting more trees"];
                } else {
                    questionText = "Which fruit grows best on a vine and needs support?";
                    correctAnswer = "Passion fruit";
                    options = ["Orange", "Passion fruit", "Mango", "Banana"];
                }
            }
            // ----- USES OF DOMESTIC ANIMALS -----
            else if (topic === "Uses of Domestic Animals") {
                if (i % 4 === 0) {
                    questionText = "How do cows and goats help in food production on a farm?";
                    correctAnswer = "They provide milk and manure for crops";
                    options = ["They eat all the crops", "They provide milk and manure for crops", "They guard the farm", "They plant seeds"];
                } else if (i % 4 === 1) {
                    questionText = "Which domestic animal is used for ploughing fields in many farms?";
                    correctAnswer = "Oxen (castrated bulls)";
                    options = ["Sheep", "Oxen (castrated bulls)", "Dogs", "Rabbits"];
                } else if (i % 4 === 2) {
                    questionText = "Chickens are useful in food production because they give us ______ and their droppings become _______.";
                    correctAnswer = "eggs, fertilizer";
                    options = ["wool, plastic", "eggs, fertilizer", "honey, wax", "leather, bags"];
                } else {
                    questionText = "Domestic animals like donkeys help farmers by:";
                    correctAnswer = "Carrying farm produce and water";
                    options = ["Eating all the grass", "Carrying farm produce and water", "Milking cows", "Harvesting fruits"];
                }
            }
            // ----- BALANCED DIET -----
            else if (topic === "Balanced Diet") {
                if (i % 4 === 0) {
                    questionText = "What is a balanced diet?";
                    correctAnswer = "A meal containing all food groups in the right amounts";
                    options = ["Eating only rice", "Eating only fruits", "A meal containing all food groups in the right amounts", "Drinking only water"];
                } else if (i % 4 === 1) {
                    questionText = "Which food group gives us energy for playing and working?";
                    correctAnswer = "Carbohydrates (ugali, rice, bread)";
                    options = ["Carbohydrates (ugali, rice, bread)", "Vitamins only", "Proteins only", "Fats and oils only"];
                } else if (i % 4 === 2) {
                    questionText = "Why do we need proteins like beans, eggs, and meat?";
                    correctAnswer = "For body growth and repair";
                    options = ["For energy only", "For body growth and repair", "To add color to food", "To make food sweet"];
                } else {
                    questionText = "Which meal shows a balanced plate for a Grade 4 learner?";
                    correctAnswer = "Rice, beans, vegetables, and an orange";
                    options = ["Soda and chips", "Rice, beans, vegetables, and an orange", "Only chapati", "Only sweets"];
                }
            }
            // ----- BOILING AND SHALLOW FRYING -----
            else if (topic === "Boiling & Shallow Frying") {
                if (i % 4 === 0) {
                    questionText = "What is one advantage of boiling food compared to frying?";
                    correctAnswer = "It uses less oil and is healthier";
                    options = ["It makes food crispy", "It uses less oil and is healthier", "It is faster always", "It removes all vitamins"];
                } else if (i % 4 === 1) {
                    questionText = "Which cooking method uses a small amount of oil in a pan?";
                    correctAnswer = "Shallow frying";
                    options = ["Deep frying", "Shallow frying", "Steaming", "Roasting"];
                } else if (i % 4 === 2) {
                    questionText = "When boiling vegetables, why should you not overboil them?";
                    correctAnswer = "They lose important vitamins and become mushy";
                    options = ["They become sweeter", "They lose important vitamins and become mushy", "They get too hard", "They change color to blue"];
                } else {
                    questionText = "What safety rule should you follow when shallow frying?";
                    correctAnswer = "Never leave hot oil unattended";
                    options = ["Use the largest flame possible", "Never leave hot oil unattended", "Pour water into hot oil", "Cover your face with plastic"];
                }
            }

            // Build final options array with correct and shuffle
            let allOptions = [correctAnswer, ...options.filter(opt => opt !== correctAnswer)];
            allOptions = [...new Set(allOptions)];
            while (allOptions.length < 4) {
                allOptions.push("Review your notes");
            }
            // Shuffle choices
            for (let s = allOptions.length - 1; s > 0; s--) {
                const rand = Math.floor(Math.random() * (s + 1));
                [allOptions[s], allOptions[rand]] = [allOptions[rand], allOptions[s]];
            }
            questionBank.push({
                id: qid++,
                level: level,
                text: questionText,
                options: allOptions.slice(0,4),
                correct: correctAnswer
            });
        }
    }

    console.log("Food production game loaded: ", questionBank.length, " questions");

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentLevelQuestions = [];
    let currentQIndex = 0;
    let levelScore = 0;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 0;
    let levelActive = true;
    let waitingForNext = false;

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const requiredInfo = document.getElementById('requiredInfo');
    const timerDisplay = document.getElementById('timerDisplay');
    const questionTextEl = document.getElementById('questionText');
    const progressInfo = document.getElementById('progressInfo');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const nextButton = document.getElementById('nextButton');

    function formatTime(sec) {
        let mins = Math.floor(sec / 60);
        let remainSec = sec % 60;
        return `${mins.toString().padStart(2, '0')}:${remainSec.toString().padStart(2, '0')}`;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Timer difficulty: Level1: 100s, Level2: 88s, Level3: 76s, Level4: 66s, Level5: 56s (VERY CHALLENGING)
        let baseSeconds = 105 - (currentLevel * 9);
        if (baseSeconds < 52) baseSeconds = 52;
        timeLeft = baseSeconds;
        timerDisplay.innerText = `⏱️ ${formatTime(timeLeft)}`;
        timerInterval = setInterval(() => {
            if (!levelActive || waitingForNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (levelActive) {
                    levelActive = false;
                    handleLevelFail("⌛ TIME'S UP! Food production needs quick thinking! You lost this level.");
                }
            } else {
                timeLeft--;
                timerDisplay.innerText = `⏱️ ${formatTime(timeLeft)}`;
                if (timeLeft <= 10) timerDisplay.style.color = "#ff5a5a";
                else timerDisplay.style.color = "#ffdd88";
            }
        }, 1000);
    }

    function loadQuestion() {
        if (!levelActive) return;
        if (currentQIndex >= currentLevelQuestions.length) {
            finishLevel();
            return;
        }
        answered = false;
        waitingForNext = false;
        nextButton.disabled = true;
        const q = currentLevelQuestions[currentQIndex];
        questionTextEl.innerText = q.text;
        progressInfo.innerText = `🍲 Q${currentQIndex+1} / ${currentLevelQuestions.length}`;
        optionsContainer.innerHTML = "";
        q.options.forEach(opt => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option-card';
            optDiv.innerText = opt;
            optDiv.addEventListener('click', () => {
                if (answered || !levelActive) return;
                handleAnswer(opt, q.correct);
            });
            optionsContainer.appendChild(optDiv);
        });
        feedbackMsg.innerHTML = "🥗 Select an answer to grow your knowledge!";
        nextButton.disabled = true;
    }

    function handleAnswer(selected, correct) {
        if (answered) return;
        answered = true;
        const isCorrect = (selected === correct);
        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = "✅ PERFECT! +1 point! You're a food production expert! ✅";
            const container = document.querySelector('.game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 250);
        } else {
            feedbackMsg.innerHTML = `❌ WRONG! The correct answer is: "${correct}". Keep learning to be a Harvest Hero! ❌`;
        }
        const allOptions = document.querySelectorAll('.option-card');
        allOptions.forEach(opt => {
            opt.style.pointerEvents = 'none';
            if (opt.innerText === correct) {
                opt.style.backgroundColor = "#b9e6a3";
                opt.style.border = "2px solid #2c8520";
            } else if (opt.innerText === selected && !isCorrect) {
                opt.style.backgroundColor = "#f5acac";
            }
        });
        scoreDisplay.innerText = `🍎 SCORE: ${levelScore}`;
        nextButton.disabled = false;
        waitingForNext = true;
    }

    function nextQuestion() {
        if (!levelActive) return;
        if (!answered && currentQIndex < currentLevelQuestions.length) {
            feedbackMsg.innerHTML = "⚠️ Please answer before moving to the next question! ⚠️";
            return;
        }
        if (currentQIndex + 1 <= currentLevelQuestions.length) {
            currentQIndex++;
            if (currentQIndex < currentLevelQuestions.length) {
                loadQuestion();
            } else {
                finishLevel();
            }
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (!levelActive) return;
        stopTimer();
        levelActive = false;
        let total = currentLevelQuestions.length;
        let percent = (levelScore / total) * 100;
        let required = 80;
        if (percent >= required) {
            if (currentLevel === 5) {
                showGameWinModal(`🏅 HARVEST HERO CHAMPION! 🏅\nYou completed ALL 5 levels! Final score: ${levelScore}/${total} (${Math.floor(percent)}%)\nYou master food production!`);
            } else {
                showLevelUpModal(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉\nScore: ${levelScore}/${total} (${Math.floor(percent)}%)\nMove to Level ${currentLevel+1} and become a food production master!`);
            }
        } else {
            handleLevelFail(`😔 LEVEL FAILED. You scored ${levelScore}/${total} (${Math.floor(percent)}%). Need 80% to advance. Try again and cook up success!`);
        }
    }

    function handleLevelFail(message) {
        stopTimer();
        levelActive = false;
        showFailModal(message);
    }

    function advanceToNextLevel() {
        currentLevel++;
        if (currentLevel > 5) {
            showGameWinModal("🌟 ULTIMATE FOOD PRODUCTION EXPERT! 🌟 You've mastered sowing, fruits, animals, diet & cooking!");
            return;
        }
        initLevel();
    }

    function retryCurrentLevel() {
        initLevel();
    }

    function initLevel() {
        currentLevelQuestions = questionBank.filter(q => q.level === currentLevel);
        if (currentLevelQuestions.length !== 30) console.warn("Level missing questions");
        // shuffle for replayability
        for (let i = currentLevelQuestions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentLevelQuestions[i], currentLevelQuestions[j]] = [currentLevelQuestions[j], currentLevelQuestions[i]];
        }
        currentQIndex = 0;
        levelScore = 0;
        answered = false;
        waitingForNext = false;
        levelActive = true;
        scoreDisplay.innerText = `🍎 SCORE: 0`;
        levelDisplay.innerText = `🌾 LEVEL ${currentLevel}`;
        requiredInfo.innerText = `⭐ NEED 80% (${Math.ceil(30*0.8)}/30)`;
        if (timerInterval) stopTimer();
        startLevelTimer();
        loadQuestion();
    }

    // ----- MODAL UI -----
    function showLevelUpModal(msg) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>✨ LEVEL UP! ✨</h2>
                <p style="font-size:1.2rem; margin:15px 0;">${msg}</p>
                <button id="nextLevelBtn">🚜 CONTINUE 🚜</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('nextLevelBtn').addEventListener('click', () => {
            modalDiv.remove();
            advanceToNextLevel();
        });
    }

    function showFailModal(msg) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card" style="border-color:#d97a2b;">
                <h2>⚠️ LEVEL FAILED ⚠️</h2>
                <p style="font-size:1.1rem;">${msg}</p>
                <button id="retryBtn">🍳 TRY LEVEL AGAIN</button>
                <button id="resetGameBtn" style="background:#b45f1a;">🍽️ RESTART GAME</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('retryBtn').addEventListener('click', () => {
            modalDiv.remove();
            retryCurrentLevel();
        });
        document.getElementById('resetGameBtn').addEventListener('click', () => {
            modalDiv.remove();
            fullGameReset();
        });
    }

    function showGameWinModal(msg) {
        stopTimer();
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card" style="background:#fff1df;">
                <h2>🏆 VICTORY CHEF! 🏆</h2>
                <p style="font-size:1.3rem;">${msg}</p>
                <button id="playAgainBtn">🌽 PLAY AGAIN 🌽</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            modalDiv.remove();
            fullGameReset();
        });
    }

    function fullGameReset() {
        stopTimer();
        currentLevel = 1;
        initLevel();
    }

    nextButton.addEventListener('click', () => {
        if (!levelActive) return;
        if (answered || currentQIndex >= currentLevelQuestions.length) {
            nextQuestion();
        } else {
            feedbackMsg.innerHTML = "❗ Answer the question to continue your food journey! ❗";
        }
    });

    fullGameReset();
</script>
</body>
</html>
