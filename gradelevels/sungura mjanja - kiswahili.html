<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sungura Mjanja - Mchezo wa CBC Darasa la 2 | Maswali Yanayobadilika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e5a2e 0%, #0a3b1a 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fef7e0;
            background-image: radial-gradient(circle at 10% 30%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 70px 70px 70px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffc164;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #b4621a;
        }

        .level-badge, .score-badge, .progress-badge {
            background: #2c2b28;
            color: #ffeaac;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 -2px 0 #4b3a1e, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #1f2c0e;
            padding: 5px 15px;
            border-radius: 50px;
            color: #f9d56e;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
        }

        .story-card {
            background: #fff6e5;
            margin: 20px 25px;
            padding: 20px 25px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
        }

        .narrative-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
            color: #2d3e1f;
            text-shadow: 1px 1px 0 #ffe0a3;
            background: #fff2dc;
            padding: 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: #e7f0c3;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            color: #2d5720;
            margin: 15px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .option-btn {
            background: #f5cf8e;
            border: 4px solid #bf832c;
            font-size: 1.2rem;
            padding: 15px 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #3b2a1f;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s;
            text-align: left;
            font-family: inherit;
            box-shadow: 0 5px 0 #a55313;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            background: #a55313;
            color: white;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-left: 8px;
            box-shadow: inset 0 -1px 0 #6b2e00;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a55313;
        }

        .option-btn:hover {
            background: #ffdd99;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .next-area {
            text-align: center;
            margin: 20px 0 10px;
        }

        .next-btn {
            background: #f57c2e;
            border: none;
            font-size: 1.5rem;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #943e00;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #943e00;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .info-message {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px;
            font-weight: bold;
            background: #c5e0b4;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            border-radius: 30px;
        }

        footer {
            background: #fad986;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        @media (max-width: 650px) {
            .narrative-text { font-size: 1.1rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 5px; }
            .option-prefix { width: 28px; height: 28px; font-size: 0.9rem; }
            .level-badge, .score-badge { font-size: 0.8rem; }
        }

        .correct-fx {
            background: #8bc34a !important;
            border-color: #2e7d32 !important;
        }

        .wrong-fx {
            background: #f4acb7 !important;
            border-color: #b0003a !important;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 0</div>
        <div class="progress-badge" id="progressDisplay">Swali: 1 / 40</div>
        <div class="timer-area">⏱️ <span id="timerSeconds">40</span> s</div>
    </div>
    <div class="story-card">
        <div class="narrative-text" id="storyNarrative">🐇 Sungura Mjanja anaanza safari yake ya ujanja! Jibu maswali kwa usahihi...</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ Swali linalofuata</button>
        </div>
        <div style="text-align: center; margin-top: 8px;"><span id="feedbackMsg" class="info-message">✨ Chagua jibu (A, B, C, au D)</span></div>
    </div>
    <footer>🎵 Sungura Mjanja - Kusikiliza, Kuzungumza, Kusoma na Kuandika 🎵</footer>
</div>

<script>
    // ------------------- INTRO SONG (Sungura Mjanja theme) ------------------
    function playIntroSong() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration, vol = 0.3) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            playNote(523.25, now, 0.3);
            playNote(587.33, now + 0.3, 0.3);
            playNote(659.25, now + 0.6, 0.4);
            playNote(523.25, now + 1.0, 0.3);
            playNote(783.99, now + 1.3, 0.5, 0.25);
            playNote(698.46, now + 1.8, 0.4);
            playNote(659.25, now + 2.2, 0.6);
            playNote(523.25, now + 2.9, 0.8);
        } catch(e) { console.log("audio context error", e); }
    }

    // voice synthesis in Kiswahili
    function speakKiswahili(text, type = "info") {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "sw-KE";
            utterance.rate = 0.9;
            utterance.pitch = (type === "correct") ? 1.2 : (type === "wrong" ? 0.8 : 1.0);
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.log("speech error", e); }
    }

    // ------------------------------------------------------------------
    // LARGE UNIQUE QUESTION POOL: 200 distinct questions (40 per level)
    // No repetition across levels
    // ------------------------------------------------------------------
    
    const storyTemplates = [
        { nar: "Sungura Mjanja alitembea msituni akamsikia Fisi akilia 'Nisaidie, nimefungwa mtego!' Sungura alifikiria kwa akili.", q: "Sungura alifanya nini alipomsikia Fisi?", correct: "Alimwokoa kwa ujanja", wrongs: ["Alimwacha", "Alimcheka", "Alimrudisha nyumbani", "Alimpa matope"] },
        { nar: "Kobe alimwomba Sungura amsaidie kubeba mzigo wa machungwa. Sungura alikubali lakini akafanya mjanja.", q: "Sungura alitenda ujanja gani?", correct: "Aliweka machungwa kadhaa kwa ajili yake", wrongs: ["Aliyapoteza", "Aliyapa tembo", "Aliyachoma moto", "Aliyakimbia"] },
        { nar: "Nyani alimwita Sungura 'mnyama mwepesi' lakini Sungura hakukasirika. Badala yake alimwalika shindano la kuruka.", q: "Sungura alionyesha tabia gani?", correct: "Uvumilivu na akili", wrongs: ["Hasira", "Wivu", "Uoga", "Ubinafsi"] },
        { nar: "Kusoma: Soma sentensi 'Sungura mjanja alipanda mlima kwa haraka.' Je, Sungura alifanya nini?", q: "Alipanda mlima kwa...", correct: "Haraka", wrongs: ["Polepole", "Kwa kukwama", "Kwa kuogopa", "Kwa kulala"] },
        { nar: "Kuandika: Taja herufi ya kwanza ya neno 'Sungura'", q: "Herufi ya mwanzo ni?", correct: "S", wrongs: ["U", "N", "G", "R"] },
        { nar: "Sungura aliwahi kumdanganya Mamba ili avuke mto. Alisema 'Kuna sherehe kubwa ng'ambo!'", q: "Mjanja alitumia neno gani kumdanganya?", correct: "Sherehe", wrongs: ["Msiba", "Vita", "Njaa", "Kiangazi"] },
        { nar: "Simba alitaka kumla Sungura, lakini Sungura alimwelekeza kwenye kisima akidai kuna sungura mwingine.", q: "Sungura alimwokoa nani?", correct: "Aliyejiokoa mwenyewe", wrongs: ["Simba", "Fisi", "Kiboko", "Tembo"] },
        { nar: "Kusikiliza: Mwalimu anasema: 'Sungura anaruka kwa kasi kwenye bustani.' Sungura anafanya nini?", q: "Kitendo cha Sungura ni?", correct: "Kuruka", wrongs: ["Kuogelea", "Kupanda", "Kukimbia chini", "Kulala"] },
        { nar: "Sungura Mjanja alipata karoti tatu. Aliamua kugawa mbili kwa marafiki zake. Hii inaonyesha nini?", q: "Sungura alionyesha...", correct: "Ukarimu", wrongs: ["Ubinafsi", "Uvivu", "Ujinga", "Uhasidi"] },
        { nar: "Kobe alimshindanisha Sungura mbio lakini Sungura alipoteza akili na kulala. Mwishowe Kobe alishinda.", q: "Kwa nini Sungura alishindwa?", correct: "Alilala usingizi", wrongs: ["Alikuwa mgonjwa", "Alikuwa mwepesi", "Alikuwa mjanja sana", "Hakujali"] },
        { nar: "Sungura alimpata Nyoka njiani. Nyoka alitaka kumuumiza, lakini Sungura akamwambia 'Nina zawadi kwako' akatoroka.", q: "Sungura alitumia nini kutoroka?", correct: "Ujanja", wrongs: ["Nguvu", "Uchawi", "Kuruka", "Kuogelea"] },
        { nar: "Kusoma na Kuandika: Andika neno 'busara'. Ni herufi ngapi?", q: "Neno 'busara' lina herufi ngapi?", correct: "Sita", wrongs: ["Tano", "Saba", "Nne", "Tatu"] }
    ];
    
    function generateUniqueQuestion(level, qIndex) {
        const seed = (level * 397) + (qIndex * 131);
        const templateIndex = seed % storyTemplates.length;
        const base = storyTemplates[templateIndex];
        
        let narrative = base.nar;
        let question = base.q;
        let correctAnswer = base.correct;
        let wrongAnswers = [...base.wrongs];
        
        // Add variety based on level and index to make each question unique
        if ((qIndex % 6) === 2 && level > 1) {
            narrative = "📖 " + narrative + " Sungura anaandika hadithi yake mwenyewe katika shule.";
            question = "Ni neno lipi linaloelezea ujanja wa Sungura?";
            correctAnswer = "Akili";
            wrongAnswers = ["Nguvu", "Uzito", "Urembo", "Uvivu"];
        }
        if ((qIndex % 8) === 3 && level > 2) {
            narrative = "🗣️ Kusikiliza na kuzungumza: Sungura anazungumza na Nyani. Anasema 'Mimi ni mwerevu zaidi.'";
            question = "Nyani anapaswa kusema nini kuonyesha adabu?";
            correctAnswer = "Hongera kwa akili zako";
            wrongAnswers = ["Wewe ni mjinga", "Nataka kukupiga", "Sikupendi", "Nenda zako"];
        }
        if ((qIndex % 10) === 5 && level >= 3) {
            narrative = "🖊️ Kuandika: Tunga sentensi kuhusu Sungura mjanja.";
            question = "Ni neno gani linaloanza na herufi kubwa katika sentensi?";
            correctAnswer = "Sungura";
            wrongAnswers = ["mjanja", "anaruka", "nyasi", "karibu"];
        }
        if ((qIndex % 7) === 4 && level >= 2) {
            narrative = "🎧 Kusikiliza: 'Sungura mjanja hakimuogopa Simba kwa sababu alikuwa na akili.'";
            question = "Simba alimwogopa nani?";
            correctAnswer = "Hakumuogopa mtu";
            wrongAnswers = ["Sungura", "Kobe", "Nyani", "Fisi"];
        }
        
        // Shuffle options with A, B, C, D
        let allOptions = [correctAnswer, ...wrongAnswers.slice(0,3)];
        for (let i = allOptions.length - 1; i > 0; i--) {
            const j = Math.floor((seed + i * 7) % (i + 1));
            [allOptions[i], allOptions[j]] = [allOptions[j], allOptions[i]];
        }
        
        return { narrative, question, options: allOptions, correctAnswer };
    }
    
    // Build complete question bank (5 levels, each 40 unique questions)
    let questionBank = [];
    for (let lvl = 1; lvl <= 5; lvl++) {
        let levelQuestions = [];
        const usedKeys = new Set();
        for (let i = 0; i < 40; i++) {
            let q = generateUniqueQuestion(lvl, i);
            let key = q.question + q.narrative;
            let attempts = 0;
            while (usedKeys.has(key) && attempts < 5) {
                q = generateUniqueQuestion(lvl, i + attempts * 100);
                key = q.question + q.narrative;
                attempts++;
            }
            usedKeys.add(key);
            levelQuestions.push(q);
        }
        questionBank.push(levelQuestions);
    }
    
    // Game state
    let currentLevel = 1;
    let currentQIndex = 0;
    let scoreInLevel = 0;
    const totalQuestionsInLevel = 40;
    const requiredToPass = 32;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let gameActive = true;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const timerSecondsSpan = document.getElementById('timerSeconds');
    const storyNarrativeDiv = document.getElementById('storyNarrative');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const feedbackSpan = document.getElementById('feedbackMsg');
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!gameActive || waitingForNext || answered) return;
        timeLeft = 40;
        timerSecondsSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext || answered) return;
            if (timeLeft <= 1) {
                if (!answered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                } else {
                    stopTimer();
                }
            } else {
                timeLeft--;
                timerSecondsSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        gameActive = false;
        speakKiswahili("Wakati umekwisha! Jibu sahihi lilikuwa: " + currentQuestionObj.correctAnswer, "timeout");
        feedbackSpan.innerHTML = `⏰ Muda umekwisha! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
        highlightCorrectAnswer();
        disableOptions(true);
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) autoNextAfterTimeout();
        }, 2000);
    }
    
    function autoNextAfterTimeout() {
        if (!waitingForNext) return;
        waitingForNext = false;
        gameActive = true;
        moveToNextQuestion();
    }
    
    function highlightCorrectAnswer() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('data-value') === currentQuestionObj.correctAnswer) {
                btn.style.backgroundColor = "#8bc34a";
                btn.style.borderColor = "#2e7d32";
            }
        });
    }
    
    function disableOptions(disabled) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (disabled) {
                btn.classList.add('disabled-opt');
            } else {
                btn.classList.remove('disabled-opt');
            }
        });
    }
    
    function handleAnswer(selectedValue, btnElement) {
        if (!gameActive || answered || waitingForNext) return;
        stopTimer();
        answered = true;
        const isCorrect = (selectedValue === currentQuestionObj.correctAnswer);
        if (isCorrect) {
            scoreInLevel++;
            speakKiswahili("Jibu sahihi! Hongera! Wewe ni mjanja kama Sungura!", "correct");
            feedbackSpan.innerHTML = "✅ Sahihi! Umepata alama! ✅";
            btnElement.classList.add('correct-fx');
        } else {
            speakKiswahili("Pole! Jibu sahihi ni: " + currentQuestionObj.correctAnswer, "wrong");
            feedbackSpan.innerHTML = `❌ Si sahihi! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
            btnElement.classList.add('wrong-fx');
            highlightCorrectAnswer();
        }
        disableOptions(true);
        updateUIStats();
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) moveToNextQuestion();
        }, 2000);
    }
    
    function moveToNextQuestion() {
        waitingForNext = false;
        if (currentQIndex + 1 >= totalQuestionsInLevel) {
            let percentage = (scoreInLevel / totalQuestionsInLevel) * 100;
            if (percentage >= 80) {
                if (currentLevel === 5) {
                    feedbackSpan.innerHTML = "🏆🏆 UMEMALIZA MHEZO WOTE! WEWE NI SHUJAA WA SUNGURA MJANJA! 🏆🏆";
                    speakKiswahili("Hongera sana! Umemaliza ngazi zote tano! Umeonyesha akili nzuri!", "correct");
                    gameActive = false;
                    disableOptions(true);
                    nextButton.disabled = true;
                    stopTimer();
                    return;
                } else {
                    currentLevel++;
                    currentQIndex = 0;
                    scoreInLevel = 0;
                    resetLevelUI();
                    loadQuestion();
                    speakKiswahili(`Hongera! Umefika Ngazi ya ${currentLevel}. Endelea kwa ujanja!`, "correct");
                    feedbackSpan.innerHTML = `🎉🎉 Umepitisha ngazi! Sasa Ngazi ${currentLevel} 🎉🎉`;
                    return;
                }
            } else {
                feedbackSpan.innerHTML = `😭 Hujapata asilimia 80. Unarudia Ngazi ${currentLevel} tena. Jaribu kwa bidii! 😭`;
                speakKiswahili("Samahani, hujapata alama za kutosha. Rudia ngazi hii tena.", "wrong");
                scoreInLevel = 0;
                currentQIndex = 0;
                resetLevelUI();
                loadQuestion();
                return;
            }
        } else {
            currentQIndex++;
            loadQuestion();
        }
    }
    
    function resetLevelUI() {
        updateUIStats();
        if (timerInterval) stopTimer();
        answered = false;
        waitingForNext = false;
        gameActive = true;
        if (nextButton) nextButton.disabled = false;
    }
    
    function updateUIStats() {
        if (levelDisplay) levelDisplay.innerText = `Ngazi ya ${currentLevel}`;
        if (scoreDisplay) scoreDisplay.innerText = `Alama: ${scoreInLevel} / ${totalQuestionsInLevel}`;
        if (progressDisplay) progressDisplay.innerText = `Swali: ${currentQIndex+1} / ${totalQuestionsInLevel}`;
    }
    
    let currentQuestionObj = null;
    
    function loadQuestion() {
        if (!questionBank[currentLevel-1] || !questionBank[currentLevel-1][currentQIndex]) {
            console.error("Question missing", currentLevel, currentQIndex);
            return;
        }
        currentQuestionObj = questionBank[currentLevel-1][currentQIndex];
        if (storyNarrativeDiv) storyNarrativeDiv.innerHTML = `📖 Hadithi: ${currentQuestionObj.narrative}`;
        if (questionTextDiv) questionTextDiv.innerHTML = `❓ ${currentQuestionObj.question}`;
        
        if (optionsContainer) {
            optionsContainer.innerHTML = "";
            const prefixes = ['A', 'B', 'C', 'D'];
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-value', opt);
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'option-prefix';
                prefixSpan.innerText = prefixes[idx];
                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = opt;
                btn.appendChild(prefixSpan);
                btn.appendChild(textSpan);
                btn.addEventListener('click', (e) => {
                    if (!answered && gameActive && !waitingForNext) {
                        handleAnswer(opt, btn);
                    }
                });
                optionsContainer.appendChild(btn);
            });
        }
        
        updateUIStats();
        answered = false;
        gameActive = true;
        waitingForNext = false;
        disableOptions(false);
        stopTimer();
        startTimer();
        if (feedbackSpan) feedbackSpan.innerHTML = "🎤 Chagua jibu (A, B, C, D) kabla ya muda kuisha! 🎤";
    }
    
    function initGame() {
        currentLevel = 1;
        currentQIndex = 0;
        scoreInLevel = 0;
        answered = false;
        waitingForNext = false;
        gameActive = true;
        loadQuestion();
        playIntroSong();
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa Sungura Mjanja! Jibu maswali 40 kwa kila ngazi. Pata angalau asilimia 80 ili kupanda ngazi.", "info");
        }, 600);
        
        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (!answered && gameActive && !waitingForNext) {
                    speakKiswahili("Tafadhali jibu swali kwanza!", "info");
                    if (feedbackSpan) feedbackSpan.innerHTML = "⚠️ Jibu swali kabla ya kuendelea! ⚠️";
                    return;
                }
                if (waitingForNext) {
                    if (timerInterval) stopTimer();
                    moveToNextQuestion();
                }
            });
        }
    }
    
    // Start the game when page is fully loaded
    window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
