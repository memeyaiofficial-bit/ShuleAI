<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Maths Measurement Quest | Grade 3 | Length, Mass, Capacity, Time, Money</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1e5a8a 0%, #0f3b5c 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fff9e8;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .stats-bar {
            background: #ffb347;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            border-bottom: 5px solid #e67e22;
            color: #2d2b1f;
            font-weight: bold;
        }

        .stat {
            background: #2e2c2a;
            padding: 6px 14px;
            border-radius: 100px;
            color: #ffdd99;
            font-size: 0.9rem;
            box-shadow: inset 0 -1px 0 #5a4a3a;
        }

        .stat span:first-child {
            color: #ffb347;
            margin-right: 6px;
        }

        .level-badge {
            background: #d62828;
            color: gold;
        }

        .question-area {
            padding: 25px 25px 15px 25px;
            text-align: center;
        }

        .question-text {
            background: #fef3d6;
            padding: 25px 15px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c3e2f;
            box-shadow: inset 0 0 0 3px white, 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            word-break: break-word;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-btn {
            background: #ec994b;
            border: none;
            font-size: 1.3rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.05s linear;
            box-shadow: 0 4px 0 #a85e1a;
            font-weight: bold;
            color: #2c1a0a;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a85e1a;
        }

        .answer-section {
            margin: 15px 0;
        }

        .answer-input {
            width: 85%;
            padding: 16px 20px;
            font-size: 1.3rem;
            text-align: center;
            border-radius: 60px;
            border: 3px solid #ffb882;
            background: white;
            font-weight: bold;
            outline: none;
        }

        .answer-input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243,156,18,0.4);
        }

        .hint-area {
            background: #ffe3b5;
            margin-top: 12px;
            padding: 10px;
            border-radius: 60px;
            font-size: 0.9rem;
            color: #b45f1b;
            font-weight: bold;
            min-height: 60px;
        }

        .timer-box {
            background: #1b2b3e;
            padding: 10px 20px;
            margin: 10px 25px;
            border-radius: 50px;
            color: #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .timer-clock {
            background: black;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.7rem;
            letter-spacing: 2px;
            color: #2ecc71;
            font-weight: bold;
        }

        .submit-btn {
            background: #2e7d64;
            border: none;
            font-size: 1.4rem;
            padding: 14px 20px;
            width: 80%;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 6px 0 #1b4e3f;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b4e3f;
        }

        .feedback {
            font-size: 1.1rem;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 50px;
            margin: 10px 25px 20px;
            background: #f0e6d2;
        }

        .next-level-info {
            background: gold;
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            margin: 5px 20px 20px;
            font-weight: bold;
            color: #2c2b1f;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1.1rem; }
            .answer-input { font-size: 1rem; width: 90%; }
            .timer-clock { font-size: 1.3rem; }
            .stat { font-size: 0.7rem; }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat level-badge"><span>⚔️ LEVEL</span> <span id="levelNum">1</span></div>
        <div class="stat"><span>⭐ SCORE</span> <span id="scoreDisplay">0</span></div>
        <div class="stat"><span>📊 PROGRESS</span> <span id="qCounter">0</span>/<span id="totalQLevel">30</span></div>
        <div class="stat"><span>🎯 NEED</span> 80%</div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading your math adventure...</div>
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <div class="hint-area" id="hintMsg">🎧 Click the speaker to hear the question. Type numbers (e.g., 5, 3:15, 120).</div>
    </div>
    <div class="timer-box">
        <span>⏳ TIME LEFT</span>
        <span class="timer-clock" id="timerDisplay">40</span>
    </div>
    <button class="submit-btn" id="submitAnswer">✅ CHECK ANSWER</button>
    <div class="feedback" id="feedbackMsg">🌟 Answer each question! Get 80% correct to level up.</div>
    <div id="levelInfoMsg" class="next-level-info"></div>
</div>

<script>
    // FULLY OPERATIONAL CBC GRADE 3 MEASUREMENT GAME
    // Topics: Length, Mass, Capacity, Time, Money
    // 5 Levels × 30 questions each, 80% to pass, 40 sec timer
    // FIXED: When time is up, voice says ONLY "Time is up, moving to the next question" (NO "wrong answer")
    // Voice for correct: "Correct answer! Well done."
    // Voice for wrong: "Wrong answer. The correct answer is X."
    
    (function() {
        // ------------------------ QUESTION GENERATOR ------------------------
        function generateQuestionsForLevel(level) {
            const questions = [];
            const usedTexts = new Set();
            
            function addQuestion(text, expectedAnswer, topic) {
                if (usedTexts.has(text)) return;
                usedTexts.add(text);
                let expectedStr = String(expectedAnswer).trim().toLowerCase();
                questions.push({
                    text: text,
                    expected: expectedAnswer,
                    expectedStr: expectedStr,
                    topic: topic,
                    checkAnswer: function(userInput) {
                        let userStr = String(userInput).trim().toLowerCase().replace(/\s/g, '');
                        return userStr === this.expectedStr;
                    },
                    getHint: function(secondsLeft) {
                        if (secondsLeft <= 8) return `💡 HINT: The answer is ${this.expected}`;
                        if (secondsLeft <= 18) return `⏰ Think about ${topic.toLowerCase()} measurement!`;
                        return `📐 Type your answer carefully. ${secondsLeft} seconds left.`;
                    }
                });
            }
            
            // ----- LENGTH (cm, m) -----
            const lengthValues = [8, 15, 22, 35, 48, 62, 75, 90, 105, 120];
            for (let i = 0; i < 6; i++) {
                let val = lengthValues[(level * 2 + i) % lengthValues.length] + (level * 2);
                if (val > 150) val = val % 100 + 20;
                addQuestion(`A pencil is ${val} centimeters long. How many cm? (write the number)`, val, "Length");
            }
            addQuestion(`A table is 1 meter 50 cm long. How many cm total? (write number)`, 150, "Length");
            addQuestion(`How many centimeters are in 2 meters?`, 200, "Length");
            addQuestion(`A rope is 3 meters long. How many meters? (write number)`, 3, "Length");
            
            // ----- MASS (grams, kg) -----
            const massValues = [100, 250, 500, 750, 1000, 1500, 2000, 2500];
            for (let i = 0; i < 6; i++) {
                let val = massValues[(level + i) % massValues.length];
                if (level >= 3 && val >= 1000) {
                    let kgVal = val / 1000;
                    addQuestion(`A bag of flour weighs ${kgVal} kg. What is the mass? (write the number)`, kgVal, "Mass");
                } else {
                    addQuestion(`A watermelon weighs ${val} grams. How many grams? (write number)`, val, "Mass");
                }
            }
            
            // ----- CAPACITY (mL, L) -----
            const capValues = [200, 350, 500, 750, 1000, 1500, 2000];
            for (let i = 0; i < 6; i++) {
                let val = capValues[(level * 2 + i) % capValues.length];
                if (level >= 3 && val >= 1000) {
                    let lVal = val / 1000;
                    addQuestion(`A jug contains ${lVal} liters of water. How many liters? (write number)`, lVal, "Capacity");
                } else {
                    addQuestion(`A cup holds ${val} milliliters of juice. How many mL? (write number)`, val, "Capacity");
                }
            }
            
            // ----- TIME -----
            const timeQuestions = [
                {q: "If the clock shows 2:00, what hour is it? (write the hour number)", ans: 2},
                {q: "Half past 3 is 3:? (write the minutes)", ans: 30},
                {q: "Quarter to 4 is 3:? (write the minutes)", ans: 45},
                {q: "How many minutes are in 1 hour? (write number)", ans: 60},
                {q: "A movie starts at 1:00 PM and ends at 3:00 PM. How many hours long? (write number)", ans: 2},
                {q: "Quarter past 5 is 5:? (write minutes)", ans: 15},
                {q: "How many seconds in 2 minutes? (write number)", ans: 120},
                {q: "School starts at 8:30. After 45 minutes it is? (write like 9:15)", ans: "9:15"},
                {q: "It is 7:45. How many minutes until 8:00? (write number)", ans: 15},
                {q: "What is half of an hour in minutes? (write number)", ans: 30}
            ];
            for (let i = 0; i < 6; i++) {
                let tq = timeQuestions[(level + i) % timeQuestions.length];
                addQuestion(tq.q, tq.ans, "Time");
            }
            
            // ----- MONEY (shillings) -----
            const moneyValues = [25, 50, 100, 200, 350, 500, 75, 150];
            for (let i = 0; i < 6; i++) {
                let val = moneyValues[(level * 3 + i) % moneyValues.length] * (level === 1 ? 1 : level === 2 ? 2 : level === 3 ? 2 : level === 4 ? 3 : 4);
                if (val > 800) val = val % 500 + 100;
                addQuestion(`A notebook costs ${val} shillings. How much does it cost? (write the number)`, val, "Money");
            }
            addQuestion(`You have 3 coins of 20 shillings each. Total shillings? (write number)`, 60, "Money");
            addQuestion(`A pencil costs 15 shillings. What is the price? (write number)`, 15, "Money");
            
            // Ensure exactly 30 questions
            while (questions.length < 30) {
                addQuestion(`How many centimeters in 1 meter? (write the number)`, 100, "Length");
            }
            if (questions.length > 30) {
                questions.length = 30;
            }
            
            // Shuffle for variety
            for (let i = questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
            
            return questions;
        }
        
        // ------------------------ GAME STATE ------------------------
        let currentLevel = 1;
        let currentQuestions = [];
        let currentQIndex = 0;
        let levelCorrectCount = 0;
        let totalPerLevel = 30;
        let timerInterval = null;
        let timeLeft = 40;
        let isWaiting = false;
        let currentQuestion = null;
        
        // DOM elements
        const levelNumSpan = document.getElementById("levelNum");
        const scoreDisplaySpan = document.getElementById("scoreDisplay");
        const qCounterSpan = document.getElementById("qCounter");
        const totalQLevelSpan = document.getElementById("totalQLevel");
        const questionTextDiv = document.getElementById("questionText");
        const answerInput = document.getElementById("answerInput");
        const hintMsgDiv = document.getElementById("hintMsg");
        const timerDisplaySpan = document.getElementById("timerDisplay");
        const submitBtn = document.getElementById("submitAnswer");
        const feedbackMsgDiv = document.getElementById("feedbackMsg");
        const levelInfoMsgDiv = document.getElementById("levelInfoMsg");
        const speakBtn = document.getElementById("speakBtn");
        
        totalQLevelSpan.innerText = "30";
        
        // Speech synthesis
        let speechSynth = window.speechSynthesis;
        
        function speakText(message) {
            if (!message) return;
            try {
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                }
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.lang = "en-US";
                    utterance.rate = 0.9;
                    utterance.pitch = 1.0;
                    utterance.volume = 1;
                    speechSynth.speak(utterance);
                }, 50);
            } catch(e) {
                console.warn("Speech error:", e);
            }
        }
        
        // Timer functions
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function updateTimerDisplay() {
            timerDisplaySpan.innerText = timeLeft;
            if (timeLeft <= 8) {
                timerDisplaySpan.style.color = "#ff6666";
            } else if (timeLeft <= 20) {
                timerDisplaySpan.style.color = "#ffaa44";
            } else {
                timerDisplaySpan.style.color = "#2ecc71";
            }
        }
        
        function startTimer() {
            stopTimer();
            timeLeft = 40;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (isWaiting) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (!isWaiting) {
                        // FIXED: Voice says ONLY "Time is up, moving to the next question" - NO "wrong answer"
                        speakText("Time is up, moving to the next question");
                        handleTimeExpired();
                    }
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                    if (currentQuestion && !isWaiting) {
                        if (timeLeft <= 12) {
                            hintMsgDiv.innerHTML = currentQuestion.getHint(timeLeft);
                        } else if (timeLeft <= 25) {
                            hintMsgDiv.innerHTML = `⏰ You have ${timeLeft} seconds left. Think about ${currentQuestion.topic}!`;
                        } else {
                            hintMsgDiv.innerHTML = `✨ ${timeLeft} seconds left. Click speaker to hear question again.`;
                        }
                    }
                }
            }, 1000);
        }
        
        function handleTimeExpired() {
            if (isWaiting) return;
            isWaiting = true;
            feedbackMsgDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
            // Do NOT speak again here to avoid double voice. Voice already said "Time is up, moving to the next question"
            setTimeout(() => {
                moveToNextQuestion(false);
            }, 1600);
        }
        
        function moveToNextQuestion(isCorrect) {
            stopTimer();
            
            if (isCorrect) {
                levelCorrectCount++;
                scoreDisplaySpan.innerText = levelCorrectCount;
                feedbackMsgDiv.innerHTML = "✅ CORRECT! Great job! +1 point";
                speakText("Correct answer! Well done.");
            } else {
                // Only speak "wrong answer" if this was a submitted incorrect answer (not a timeout)
                // But we need to distinguish: if isCorrect === false AND we are NOT coming from timeout?
                // Actually handleTimeExpired calls moveToNextQuestion(false) but we should NOT say "Wrong answer" for timeout.
                // We'll check if we have a pending timeout flag. Let's add a flag to know if it's timeout.
                // However, simpler: handleTimeExpired already spoke the timeout message, so we can skip speaking here for timeout.
                // But moveToNextQuestion is also called from submitAnswer. We need to differentiate.
                // We'll pass an extra parameter or check if the current move is from timeout.
                // Since handleTimeExpired sets isWaiting=true before calling, we can track a flag.
                // Let's implement properly:
                if (!window._isTimeoutMove) {
                    let correctAns = currentQuestion ? currentQuestion.expected : "?";
                    feedbackMsgDiv.innerHTML = `❌ INCORRECT! The correct answer is: ${correctAns}`;
                    speakText(`Wrong answer. The correct answer is ${correctAns}.`);
                } else {
                    // This is a timeout move - feedback already set, don't speak wrong answer
                    feedbackMsgDiv.innerHTML = `⏰ TIME IS UP! Moving to next question.`;
                    // Reset flag
                    window._isTimeoutMove = false;
                }
            }
            
            // Reset timeout flag if it was set
            if (window._isTimeoutMove) window._isTimeoutMove = false;
            
            currentQIndex++;
            qCounterSpan.innerText = currentQIndex;
            
            // Check if level completed
            if (currentQIndex >= totalPerLevel) {
                let percentage = (levelCorrectCount / totalPerLevel) * 100;
                if (percentage >= 80) {
                    if (currentLevel < 5) {
                        levelInfoMsgDiv.innerHTML = `🎉 LEVEL ${currentLevel} PASSED! ${Math.floor(percentage)}% → Moving to LEVEL ${currentLevel + 1}`;
                        speakText(`Congratulations! You passed level ${currentLevel}. Moving to next level.`);
                        currentLevel++;
                        currentQIndex = 0;
                        levelCorrectCount = 0;
                        isWaiting = false;
                        initializeLevel(currentLevel);
                    } else {
                        feedbackMsgDiv.innerHTML = "🏆🏆🏆 AMAZING! You completed ALL 5 LEVELS! YOU ARE A MATH CHAMPION! 🏆🏆🏆";
                        levelInfoMsgDiv.innerHTML = "🎉🎉 GAME COMPLETE! Refresh page to play again. 🎉🎉";
                        speakText("Congratulations! You completed all five levels. You are a math champion!");
                        submitBtn.disabled = true;
                        answerInput.disabled = true;
                        stopTimer();
                        isWaiting = true;
                        return;
                    }
                } else {
                    levelInfoMsgDiv.innerHTML = `❌ LEVEL ${currentLevel} FAILED! ${Math.floor(percentage)}% (Need 80%). Restarting level... Keep trying!`;
                    speakText(`You scored ${Math.floor(percentage)} percent. Need 80 to pass. Restarting level ${currentLevel}.`);
                    currentQIndex = 0;
                    levelCorrectCount = 0;
                    isWaiting = false;
                    initializeLevel(currentLevel);
                }
                return;
            }
            
            isWaiting = false;
            loadQuestion();
        }
        
        // Modified handleTimeExpired to set a flag
        function handleTimeExpired() {
            if (isWaiting) return;
            isWaiting = true;
            window._isTimeoutMove = true;  // Set flag to indicate this is a timeout move
            feedbackMsgDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
            setTimeout(() => {
                moveToNextQuestion(false);
            }, 1600);
        }
        
        function loadQuestion() {
            if (currentQIndex >= currentQuestions.length) return;
            currentQuestion = currentQuestions[currentQIndex];
            questionTextDiv.innerText = currentQuestion.text;
            answerInput.value = "";
            answerInput.disabled = false;
            submitBtn.disabled = false;
            feedbackMsgDiv.innerHTML = "⏳ Type your answer & click CHECK. Timer: 40 seconds.";
            hintMsgDiv.innerHTML = "🎧 Click speaker to hear question. Write number or time (e.g., 9:15).";
            scoreDisplaySpan.innerText = levelCorrectCount;
            levelNumSpan.innerText = currentLevel;
            qCounterSpan.innerText = currentQIndex;
            isWaiting = false;
            stopTimer();
            startTimer();
            answerInput.focus();
        }
        
        function submitAnswer() {
            if (isWaiting) {
                feedbackMsgDiv.innerHTML = "⏳ Please wait, loading next question...";
                return;
            }
            if (!currentQuestion) {
                feedbackMsgDiv.innerHTML = "⚠️ No active question. Please wait.";
                return;
            }
            let userAnswer = answerInput.value.trim();
            if (userAnswer === "") {
                feedbackMsgDiv.innerHTML = "📝 Please type an answer before submitting!";
                speakText("Type your answer first.");
                return;
            }
            stopTimer();
            let correct = currentQuestion.checkAnswer(userAnswer);
            isWaiting = true;
            window._isTimeoutMove = false; // Ensure timeout flag is false for manual submission
            moveToNextQuestion(correct);
        }
        
        function speakCurrentQuestion() {
            if (!currentQuestion || isWaiting) {
                speakText("Please wait, the next question is loading.");
                return;
            }
            speakText(currentQuestion.text);
        }
        
        function initializeLevel(level) {
            currentLevel = level;
            currentQuestions = generateQuestionsForLevel(level);
            totalPerLevel = currentQuestions.length;
            currentQIndex = 0;
            levelCorrectCount = 0;
            isWaiting = false;
            window._isTimeoutMove = false;
            
            levelNumSpan.innerText = level;
            scoreDisplaySpan.innerText = "0";
            qCounterSpan.innerText = "0";
            totalQLevelSpan.innerText = totalPerLevel;
            feedbackMsgDiv.innerHTML = `🌟 LEVEL ${level} START! Answer ${totalPerLevel} questions, need 80% to advance. 🌟`;
            levelInfoMsgDiv.innerHTML = `📏⚖️🧴⏰💰 Level ${level} · Topics: Length, Mass, Capacity, Time, Money. You can do it!`;
            
            submitBtn.disabled = false;
            answerInput.disabled = false;
            loadQuestion();
        }
        
        // Set up event listeners
        submitBtn.addEventListener("click", submitAnswer);
        speakBtn.addEventListener("click", speakCurrentQuestion);
        answerInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !isWaiting && currentQuestion) {
                submitAnswer();
            }
        });
        
        // Start the game!
        initializeLevel(1);
    })();
</script>
</body>
</html>
