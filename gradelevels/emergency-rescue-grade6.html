<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🎓 Shule AI Plus+ | Complete English Master | CBC Grade 6</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #e6f0ff 0%, #b8d4ff 100%);
    font-family: 'Nunito', 'Poppins', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 1rem;
}

.game-container {
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 2rem;
    box-shadow: 0 30px 40px -18px rgba(0, 20, 70, 0.45);
    overflow: hidden;
    border: 1px solid rgba(59,130,246,0.3);
}

/* Tabs */
.mode-tabs {
    display: flex;
    background: #0f3b6f;
    border-bottom: 3px solid #ffcd3c;
    gap: 2px;
    flex-wrap: wrap;
}
.tab-btn {
    flex: 1;
    background: #1e5a9e;
    color: #fef9e0;
    border: none;
    padding: 14px 6px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    text-align: center;
}
.tab-btn.active {
    background: linear-gradient(135deg, #ffcd3c, #f9a826);
    color: #0a2f5a;
}
.tab-btn:active { transform: scale(0.98); }

.game-header {
    background: #0f3b6f;
    padding: 0.8rem 1.2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 0.8rem;
    border-bottom: 4px solid #ffcd3c;
}
.title-section h1 {
    font-size: 1.2rem;
    color: white;
    text-shadow: 0 2px 0 #0a2f5a;
}
.title-section p {
    font-size: 0.6rem;
    background: #ffcd3c20;
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 30px;
    color: #ffe6a3;
}
.score-board {
    background: #ffcd3c;
    padding: 0.2rem 0.8rem;
    border-radius: 50px;
    color: #0a2f5a;
    font-weight: bold;
    font-size: 1.2rem;
    box-shadow: 0 3px 0 #b27f1a;
    display: flex;
    align-items: center;
    gap: 5px;
}
.score-board span { font-size: 0.7rem; font-weight: 700; }

.level-zone {
    background: #f0f7fe;
    padding: 0.5rem 1rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #7fb4ff;
    gap: 8px;
}
.level-buttons {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}
.level-btn {
    background: white;
    border: none;
    font-weight: bold;
    padding: 0.4rem 0.8rem;
    border-radius: 40px;
    font-size: 0.7rem;
    cursor: pointer;
    transition: 0.2s;
    color: #06558a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border: 1px solid #ffcd3c;
}
.level-btn.active {
    background: #ffcd3c;
    color: #0a2f5a;
    transform: scale(1.02);
}
.level-btn.locked {
    opacity: 0.6;
    cursor: not-allowed;
    background: #e2e8f0;
    color: #3a5a7a;
}
.kenyan-fact {
    background: #fff3cf;
    padding: 0.2rem 0.8rem;
    border-radius: 60px;
    font-size: 0.65rem;
    font-weight: 600;
    color: #035c8f;
}

.quiz-main {
    padding: 1rem;
    background: #ffffff;
    min-height: 380px;
}
.progress-area {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.8rem;
    flex-wrap: wrap;
    gap: 6px;
}
.q-counter {
    background: #eef3fc;
    padding: 0.2rem 0.8rem;
    border-radius: 40px;
    font-weight: 700;
    color: #115e8c;
    font-size: 0.75rem;
}
.hint-box {
    background: #fef6df;
    border-left: 5px solid #ffcd3c;
    padding: 0.4rem 0.8rem;
    border-radius: 28px;
    font-size: 0.7rem;
    font-weight: 600;
    color: #4a2f00;
}
.question-text {
    font-size: 1rem;
    font-weight: 700;
    color: #0a2f44;
    margin: 0.8rem 0;
    background: #fafdff;
    padding: 0.5rem;
    border-radius: 30px;
    border: 1px solid #d4e6ff;
    line-height: 1.4;
}
.answers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.6rem;
    margin: 1rem 0;
}
.answer-card {
    background: #f9fbfe;
    border: 2px solid #cde0ff;
    border-radius: 60px;
    padding: 0.5rem;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 700;
    text-align: center;
    color: #1a4972;
    font-size: 0.8rem;
}
.answer-card:hover:not(.disabled-answer) { background: #ffebbb; border-color: #ffcd3c; transform: scale(0.97); }
.correct-feedback { background: #c8f0d1; border-color: #15803d; color: #14532d; }
.wrong-feedback { background: #ffe0db; border-color: #dc2626; color: #991b1b; text-decoration: line-through; }
.disabled-answer { pointer-events: none; opacity: 0.8; }

/* Voice specific */
.voice-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin: 0.8rem 0; }
.listen-btn, .microphone-btn {
    background: #2b7a4b;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 0.9rem;
    padding: 0.5rem 1.2rem;
    border-radius: 60px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 0 #1a4a2e;
}
.microphone-btn { background: #0284c7; box-shadow: 0 3px 0 #0369a1; }
.microphone-btn.listening { background: #dc2626; animation: pulse 1s infinite; }
@keyframes pulse {
    0%,100% { opacity: 1; background: #dc2626; }
    50% { opacity: 0.8; background: #b91c1c; }
}
.status { padding: 0.5rem; border-radius: 60px; font-weight: 600; font-size: 0.8rem; text-align: center; margin-top: 0.5rem; }
.good-status { background: #c8f0d1; color: #14532d; }
.bad-status { background: #ffe0db; color: #991b1b; }
.warning-status { background: #fff3cd; color: #856404; }
.success-message {
    background: #c8f0d1;
    color: #14532d;
    padding: 0.5rem;
    border-radius: 60px;
    font-weight: bold;
    margin: 0.5rem 0;
    animation: fadeInScale 0.4s ease-out;
    font-size: 0.85rem;
}
@keyframes fadeInScale {
    0% { opacity: 0; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
}

.visual-card {
    background: #f0f7ff;
    border-radius: 1.5rem;
    padding: 0.8rem;
    margin: 0.5rem 0;
    text-align: center;
    border: 2px solid #cde0ff;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
}
.visual-icon { font-size: 2rem; background: white; padding: 0.3rem; border-radius: 1.5rem; min-width: 60px; }
.visual-text { flex: 1; font-size: 0.8rem; color: #2c4e6e; text-align: left; }

.next-btn {
    background: #ffcd3c;
    border: none;
    font-weight: bold;
    font-size: 1rem;
    padding: 0.5rem 1.5rem;
    border-radius: 80px;
    color: #02457a;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 0.5rem;
    width: 100%;
    max-width: 180px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 0 #b27f1a;
}
.next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b27f1a; }
.next-btn:disabled { background: #bcbcbc; cursor: not-allowed; box-shadow: none; }
.level-complete { text-align: center; background: #eef2ff; padding: 1rem; border-radius: 2rem; font-weight: bold; color: #156f9c; border: 2px solid #ffcd3c; font-size: 0.85rem; }
footer { background: #eef3fc; padding: 0.5rem; font-size: 0.6rem; text-align: center; color: #3282a7; border-top: 2px dotted #ffcd3c; }

@media (max-width: 680px) {
    .tab-btn { font-size: 0.6rem; padding: 8px 3px; }
    .question-text { font-size: 0.9rem; }
    .answers-grid { grid-template-columns: 1fr; }
    .voice-controls { flex-direction: column; align-items: center; }
    .level-zone { flex-direction: column; align-items: stretch; }
    .visual-card { flex-direction: column; text-align: center; }
    .visual-text { text-align: center; }
}
</style>
</head>
<body>
<div class="game-container" id="app">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabReading">📖 Rescue Reading</button>
        <button class="tab-btn" id="TabPronouns">🔗 Pronouns</button>
        <button class="tab-btn" id="TabVoice">🎤 Voice Rescue</button>
        <button class="tab-btn" id="TabNouns">📚 Nouns Safari</button>
    </div>
    <div class="game-header">
        <div class="title-section"><h1>🎓 Shule AI Plus+ 🌟</h1><p>CBC Grade 6 English Master</p></div>
        <div class="score-board">🏆 <span id="totalScoreDisplay">0</span> pts</div>
    </div>
    <div class="level-zone">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="kenyan-fact" id="kenyanFactArea">🇰🇪 Kenya: English opens doors worldwide!</div>
    </div>
    <div class="quiz-main" id="quizMain"></div>
    <footer>📖 Read • 🔗 Pronouns • 🎤 Speak • 📚 Nouns — Master English!</footer>
</div>

<script>
    // ==============================================================
    // MERGED: 4 Modes - Rescue Reading, Pronouns, Voice Rescue, Nouns
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: 12/15 (80%) to unlock next level
    // ==============================================================

    // ---------- MODE 1: RESCUE READING (Emergency Services) ----------
    const readingVisuals = [
        { icon: "🚑", text: "Ambulances rush sick or injured people to hospitals. Paramedics give first aid on the way." },
        { icon: "🚒", text: "Firefighters wear special suits and use hoses, axes, and ladders to rescue people and put out fires." },
        { icon: "🚔", text: "Police officers help in accidents, robberies, and missing persons cases. They work with search and rescue teams." },
        { icon: "🩺", text: "The Red Cross trains volunteers to give first aid, including CPR and wound care." }
    ];
    const readingQuestions = [
        { text: "What is the main purpose of an ambulance?", options: ["To rush sick/injured to hospital", "To fight fires", "To catch criminals", "To deliver mail"], correct: 0, hint: "Emergency medical transport" },
        { text: "What do firefighters use to spray water?", options: ["Hoses", "Axes", "Ladders", "Helmets"], correct: 0, hint: "Water hose" },
        { text: "What does SAR stand for?", options: ["Search and Rescue", "Safe and Ready", "Special Air Response", "South African Rescue"], correct: 0, hint: "Emergency teams" },
        { text: "What does CPR stand for?", options: ["Cardiopulmonary Resuscitation", "Cardiac Pressure Response", "Central Police Rescue", "Critical Patient Recovery"], correct: 0, hint: "Life-saving technique" },
        { text: "What should you do if someone is bleeding heavily?", options: ["Apply direct pressure", "Run away", "Give water", "Call a friend"], correct: 0, hint: "Stop the bleeding" },
        { text: "What number should you call for an emergency in Kenya?", options: ["999 or 112", "911", "100", "101"], correct: 0, hint: "Emergency number" },
        { text: "What does 'evacuate' mean?", options: ["Leave a dangerous place", "Enter a building", "Hide", "Call for help"], correct: 0, hint: "Get out safely" },
        { text: "Who works inside an ambulance?", options: ["Paramedics", "Firefighters", "Police", "Teachers"], correct: 0, hint: "Medical professionals" },
        { text: "What is a stretcher used for?", options: ["Carry injured patients", "Put out fires", "Arrest criminals", "Teach first aid"], correct: 0, hint: "Patient transport" },
        { text: "What does 'first aid' mean?", options: ["Immediate help to injured", "First person to arrive", "A type of ambulance", "Hospital department"], correct: 0, hint: "Initial medical care" },
        { text: "What do firefighters wear to stay safe?", options: ["Special suits and helmets", "T-shirts", "School uniforms", "Casual clothes"], correct: 0, hint: "Protective gear" },
        { text: "What should you do if your clothes catch fire?", options: ["Stop, drop, and roll", "Run fast", "Jump in water", "Wave arms"], correct: 0, hint: "Safety move" },
        { text: "What does 'rescue' mean?", options: ["Save from danger", "Fight", "Run away", "Hide"], correct: 0, hint: "Help someone" },
        { text: "What is a 'defibrillator' used for?", options: ["Restart heart", "Stop bleeding", "Check breathing", "Splint bone"], correct: 0, hint: "Heart device" },
        { text: "What should you do if someone is unconscious?", options: ["Check breathing and call 999", "Shake them", "Give water", "Walk away"], correct: 0, hint: "First check" }
    ];
    for(let i=0;i<15;i++) readingQuestions.push({...readingQuestions[i%readingQuestions.length]});
    const readingDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) readingDB[l].push({...readingQuestions[i%readingQuestions.length], visualIdx:l-1});

    // ---------- MODE 2: PRONOUNS ----------
    const pronounsQuestions = [
        { text: "Which pronoun replaces 'the paramedic'?", options: ["he/she", "it", "they", "we"], correct: 0, hint: "One person" },
        { text: "Choose: '____ is driving the ambulance.' (female)", options: ["She", "He", "It", "They"], correct: 0, hint: "Female pronoun" },
        { text: "What pronoun replaces 'the firefighters'?", options: ["They", "He", "She", "It"], correct: 0, hint: "Plural" },
        { text: "Which is a possessive pronoun?", options: ["his", "he", "him", "they"], correct: 0, hint: "Shows ownership" },
        { text: "Complete: 'The victim was breathing. ____ had a broken leg.'", options: ["He/She", "It", "They", "We"], correct: 0, hint: "Person" },
        { text: "Choose the object pronoun: 'Please call ____.' (dispatcher)", options: ["him/her", "they", "we", "you"], correct: 0, hint: "Receiver of action" },
        { text: "What pronoun replaces 'the fire truck'?", options: ["it", "they", "he", "she"], correct: 0, hint: "One thing" },
        { text: "Which is a reflexive pronoun?", options: ["himself", "his", "he", "him"], correct: 0, hint: "Refers back to subject" },
        { text: "Complete: 'The paramedic saved ____ from danger.'", options: ["himself/herself", "itself", "themselves", "ourselves"], correct: 0, hint: "Self" },
        { text: "What pronoun means 'belonging to me'?", options: ["my/mine", "your/yours", "his/her", "their/theirs"], correct: 0, hint: "Ownership" },
        { text: "Choose: 'That oxygen mask is ____.' (yours)", options: ["yours", "mine", "his", "hers"], correct: 0, hint: "Belongs to you" },
        { text: "Complete: 'The rescue team finished ____ mission.'", options: ["their", "its", "our", "your"], correct: 0, hint: "Plural possessive" },
        { text: "Which demonstrative pronoun refers to something near?", options: ["this/these", "that/those", "it/they", "here/there"], correct: 0, hint: "Close" },
        { text: "Complete: 'The defibrillator shocked ____ back.'", options: ["itself", "himself", "herself", "themselves"], correct: 0, hint: "Self" },
        { text: "What is the antecedent of 'they' in: 'Paramedics arrived. They started CPR.'", options: ["Paramedics", "CPR", "arrived", "started"], correct: 0, hint: "Who?" }
    ];
    const pronounsDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) pronounsDB[l].push({...pronounsQuestions[i%pronounsQuestions.length]});

    // ---------- MODE 3: VOICE RESCUE (Speech Recognition) ----------
    const voiceQuestions = [
        { prompt: "Say the word for a vehicle that takes sick people to hospital.", expected: "ambulance", hint: "Starts with A" },
        { prompt: "What does CPR stand for? Say the full words.", expected: "cardiopulmonary resuscitation", hint: "Cardio..." },
        { prompt: "Say the word that means 'to move people to safety'.", expected: "evacuate", hint: "E-V-A-C-U-A-T-E" },
        { prompt: "What is the emergency number in Kenya? Say the number.", expected: "nine nine nine", hint: "999" },
        { prompt: "Say the word for a person who gives emergency care.", expected: "paramedic", hint: "Para-medic" },
        { prompt: "What does 'first aid' mean? Say it.", expected: "immediate help", hint: "Initial medical help" },
        { prompt: "Say the word for a broken bone.", expected: "fracture", hint: "F-R-A-C-T-U-R-E" },
        { prompt: "What should you do for severe bleeding? Say action.", expected: "apply pressure", hint: "Push down" },
        { prompt: "Say the word for a person injured in an accident.", expected: "casualty", hint: "Casualty" },
        { prompt: "What does 'rescue' mean? Say it.", expected: "save from danger", hint: "Help" },
        { prompt: "Say the word for a serious situation needing help.", expected: "emergency", hint: "E-M-E-R-G-E-N-C-Y" },
        { prompt: "What should you do if someone stops breathing? Say action.", expected: "cpr", hint: "Chest compressions" },
        { prompt: "Say the word for wrapping a wound.", expected: "bandage", hint: "B-A-N-D-A-G-E" },
        { prompt: "What does 'unconscious' mean? Say it.", expected: "not awake", hint: "Knocked out" },
        { prompt: "Say the phrase: 'Please send an ____.'", expected: "ambulance", hint: "Emergency vehicle" }
    ];
    const voiceDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) voiceDB[l].push({...voiceQuestions[i%voiceQuestions.length]});

    // ---------- MODE 4: NOUNS SAFARI ----------
    const nounsQuestions = [
        { text: "What type of noun is 'teacher'?", options: ["Common noun", "Proper noun", "Abstract noun", "Collective noun"], correct: 0, hint: "General name" },
        { text: "Which word is a proper noun?", options: ["Kenya", "country", "city", "river"], correct: 0, hint: "Specific name" },
        { text: "What type of noun is 'happiness'?", options: ["Abstract noun", "Concrete noun", "Proper noun", "Collective noun"], correct: 0, hint: "Feeling" },
        { text: "Which is a collective noun?", options: ["family", "teacher", "apple", "river"], correct: 0, hint: "Group" },
        { text: "What is the plural of 'child'?", options: ["children", "childs", "childes", "childern"], correct: 0, hint: "Irregular" },
        { text: "What is the collective noun for lions?", options: ["pride", "pack", "herd", "flock"], correct: 0, hint: "Pride" },
        { text: "What is an abstract noun?", options: ["Idea/feeling you can't touch", "Physical object", "Specific name", "Group"], correct: 0, hint: "Intangible" },
        { text: "Which noun is concrete?", options: ["apple", "love", "courage", "kindness"], correct: 0, hint: "Can touch" },
        { text: "What is the plural of 'goose'?", options: ["geese", "gooses", "goosies", "goos"], correct: 0, hint: "Geese" },
        { text: "A 'school of fish' — 'school' is a ____ noun.", options: ["collective", "proper", "abstract", "common"], correct: 0, hint: "Group name" },
        { text: "What is the plural of 'foot'?", options: ["feet", "foots", "footes", "footies"], correct: 0, hint: "Feet" },
        { text: "What is the collective noun for cattle?", options: ["herd", "flock", "pride", "school"], correct: 0, hint: "Herd" },
        { text: "What is the plural of 'man'?", options: ["men", "mans", "manes", "mens"], correct: 0, hint: "Men" },
        { text: "What type of noun is 'wisdom'?", options: ["abstract", "concrete", "proper", "collective"], correct: 0, hint: "Quality" },
        { text: "What is the plural of 'tooth'?", options: ["teeth", "tooths", "toothes", "toothies"], correct: 0, hint: "Teeth" }
    ];
    const nounsDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) nounsDB[l].push({...nounsQuestions[i%nounsQuestions.length]});

    const modeBuilders = { reading: (lvl) => readingDB[lvl], pronouns: (lvl) => pronounsDB[lvl], voice: (lvl) => voiceDB[lvl], nouns: (lvl) => nounsDB[lvl] };
    const modeNames = { reading:"📖 Rescue Reading", pronouns:"🔗 Pronouns Mastery", voice:"🎤 Voice Rescue", nouns:"📚 Nouns Safari" };
    const modeVisuals = { reading: true, pronouns: false, voice: false, nouns: false };

    let currentMode = "reading";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = 12;
    let answeringLock = false;
    let gameActive = true;
    let levelScores = {1:0,2:0,3:0,4:0};
    let levelUnlocked = {1:true,2:false,3:false,4:false};
    let totalPoints = 0;
    let recognition = null;
    let isListening = false;

    const dynamicDiv = document.getElementById('quizMain');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const totalScoreSpan = document.getElementById('totalScoreDisplay');
    const kenyanFactArea = document.getElementById('kenyanFactArea');
    const facts = ["Kenya has over 40 ethnic communities!", "The word 'safari' means journey in Swahili!", "Kenya's first Nobel Prize winner was Wangari Maathai!", "Mount Kenya is second-highest in Africa!"];

    function updateTotalScore() {
        totalPoints = Object.values(levelScores).reduce((a,b)=>a+b,0);
        totalScoreSpan.innerText = totalPoints;
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''} ${!levelUnlocked[i] ? 'locked' : ''}`;
            btn.innerText = `Level ${i}`;
            btn.onclick = () => { if(levelUnlocked[i] && i !== currentLevel) switchLevel(i); };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchLevel(level) {
        if(!levelUnlocked[level]) return;
        if(recognition) recognition.abort();
        currentLevel = level;
        currentQIndex = 0;
        levelScore = levelScores[level] || 0;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[(level-1)%facts.length]}`;
    }

    function checkLevelCompletion() {
        if(levelScore >= requiredCorrect && currentQIndex >= totalQuestions) {
            if(currentLevel === 4) {
                dynamicDiv.innerHTML = `<div class="level-complete">🏆 You mastered ${modeNames[currentMode]}! 🏆</div>`;
                gameActive = false;
            } else if(!levelUnlocked[currentLevel+1]) {
                levelUnlocked[currentLevel+1] = true;
                updateLevelButtons();
                dynamicDiv.innerHTML = `<div class="level-complete">🎉 UNLOCKED: Level ${currentLevel+1}! 🎉<br><button id="nextLevelBtn" class="next-btn" style="margin-top:0.5rem;">🚀 Next Level</button></div>`;
                document.getElementById('nextLevelBtn')?.addEventListener('click', () => {
                    currentLevel++;
                    currentQIndex = 0;
                    levelScore = 0;
                    gameActive = true;
                    answeringLock = false;
                    levelQuestions = modeBuilders[currentMode](currentLevel);
                    loadCurrentQuestion();
                    updateLevelButtons();
                });
            }
        } else if(currentQIndex >= totalQuestions) {
            dynamicDiv.innerHTML = `<div class="level-complete">📘 Score: ${levelScore}/${totalQuestions}. Need ${requiredCorrect} to unlock.<br><button onclick="location.reload()" class="next-btn" style="margin-top:0.5rem;">🔄 Try Again</button></div>`;
            gameActive = false;
        }
    }

    function shuffleAnswers(q) {
        const opts = q.options.map((opt,i) => ({text:opt, isCorrect: i===q.correct}));
        for(let i=opts.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
        const newOpts = opts.map(o=>o.text);
        const newCorrect = opts.findIndex(o=>o.isCorrect);
        return { text:q.text, hint:q.hint, options:newOpts, correct:newCorrect, visualIdx:q.visualIdx };
    }

    function handleMCAnswer(selectedIdx, correctIdx, currentItem) {
        if(answeringLock || !gameActive) return;
        answeringLock = true;
        const isCorrect = (selectedIdx === correctIdx);
        if(isCorrect) { levelScore++; levelScores[currentLevel] = levelScore; updateTotalScore(); }
        renderMCQuestion(currentItem, isCorrect, correctIdx, selectedIdx);
        if(isCorrect && currentQIndex+1 >= totalQuestions) checkLevelCompletion();
    }

    function renderMCQuestion(item, wasCorrect, correctIdx, selectedIdx) {
        const visual = modeVisuals[currentMode] && readingVisuals[item.visualIdx||0];
        const visualHtml = visual ? `<div class="visual-card"><div class="visual-icon">${visual.icon}</div><div class="visual-text">📖 ${visual.text}</div></div>` : '';
        let answersHtml = '';
        item.options.forEach((opt, idx) => {
            let cls = '';
            if(wasCorrect !== undefined && idx === correctIdx) cls = 'correct-feedback';
            else if(wasCorrect !== undefined && idx === selectedIdx && idx !== correctIdx) cls = 'wrong-feedback';
            answersHtml += `<div class="answer-card ${cls}">${String.fromCharCode(65+idx)}. ${opt}</div>`;
        });
        const feedback = wasCorrect === true ? '✅ Correct! +1 point ✅' : (wasCorrect === false ? `❌ Correct: ${item.options[correctIdx]}` : '');
        dynamicDiv.innerHTML = `
            <div class="progress-area"><div class="q-counter">📖 Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Level ${currentLevel}</div><div class="hint-box">💡 ${item.hint}</div></div>
            ${visualHtml}<div class="question-text">❓ ${item.text}</div><div class="answers-grid" id="answersGrid">${answersHtml}</div>
            ${feedback ? `<div style="text-align:center; font-weight:600;">${feedback}</div>` : ''}
            ${wasCorrect !== undefined ? `<button id="nextBtnAction" class="next-btn">➡ Next Question</button>` : ''}
        `;
        if(wasCorrect !== undefined) {
            document.getElementById('nextBtnAction')?.addEventListener('click', () => { currentQIndex++; if(currentQIndex < totalQuestions) { answeringLock = false; loadCurrentQuestion(); } else checkLevelCompletion(); });
        } else {
            document.querySelectorAll('.answer-card').forEach((card, idx) => { card.addEventListener('click', () => handleMCAnswer(idx, item.correct, item)); });
        }
    }

    // Voice Mode
    function speakText(text) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9; window.speechSynthesis.speak(u); }
    function startListening(item) {
        if(answeringLock || !gameActive) return;
        if(!window.SpeechRecognition && !window.webkitSpeechRecognition) { dynamicDiv.innerHTML += `<div class="status bad-status">Voice not supported. Use Chrome.</div>`; return; }
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(recognition) recognition.abort();
        recognition = new SpeechRec(); recognition.lang = 'en-US'; recognition.interimResults = false;
        recognition.onstart = () => { isListening = true; const mb = document.getElementById('micBtn'); if(mb) mb.classList.add('listening'); };
        recognition.onend = () => { isListening = false; const mb = document.getElementById('micBtn'); if(mb) mb.classList.remove('listening'); };
        recognition.onresult = (e) => {
            const spoken = e.results[0][0].transcript.toLowerCase().trim();
            const expected = item.expected.toLowerCase();
            const isMatch = spoken === expected || (spoken.includes(expected) && Math.abs(spoken.length-expected.length)<=5);
            answeringLock = true;
            if(isMatch) { levelScore++; levelScores[currentLevel] = levelScore; updateTotalScore(); renderVoiceFeedback(true, item.expected); if(currentQIndex+1 >= totalQuestions) checkLevelCompletion(); }
            else renderVoiceFeedback(false, item.expected);
            recognition = null;
        };
        recognition.onerror = () => { recognition = null; };
        recognition.start();
    }
    function renderVoiceFeedback(isCorrect, correctAnswer) {
        if(isCorrect) {
            dynamicDiv.innerHTML += `<div class="success-message">🎉 CORRECT! +1 point! 🎉</div><button id="nextBtnAction" class="next-btn">➡ Next Question</button>`;
            document.getElementById('nextBtnAction')?.addEventListener('click', () => { currentQIndex++; if(currentQIndex < totalQuestions) { answeringLock = false; loadCurrentQuestion(); } else checkLevelCompletion(); });
        } else {
            dynamicDiv.innerHTML += `<div class="status bad-status">❌ Incorrect. Answer: "${correctAnswer}". <button id="retryBtn" class="listen-btn" style="margin-top:0.5rem;">🔄 Try Again</button></div>`;
            document.getElementById('retryBtn')?.addEventListener('click', () => { answeringLock = false; loadCurrentQuestion(); });
        }
    }

    function loadCurrentQuestion() {
        if(!gameActive) return;
        if(currentQIndex >= totalQuestions) { checkLevelCompletion(); return; }
        const q = levelQuestions[currentQIndex];
        if(!q) { checkLevelCompletion(); return; }
        if(currentMode === 'voice') {
            dynamicDiv.innerHTML = `
                <div class="progress-area"><div class="q-counter">🎤 Q${currentQIndex+1}/${totalQuestions} | ${modeNames[currentMode]} | Level ${currentLevel}</div></div>
                <div class="question-card" style="text-align:center; padding:1rem;"><div class="hint-text" style="background:#fef6df; display:inline-block; padding:0.2rem 0.8rem; border-radius:40px;">💡 ${q.hint}</div>
                <div class="question-text">🎤 ${q.prompt}</div><div class="voice-controls"><button id="listenBtn" class="listen-btn">🔊 LISTEN</button><button id="micBtn" class="microphone-btn">🎙️ SPEAK</button></div>
                <div id="dynamicStatus" class="status warning-status">Click microphone and speak your answer</div></div>
            `;
            document.getElementById('listenBtn')?.addEventListener('click', () => speakText(q.prompt));
            document.getElementById('micBtn')?.addEventListener('click', () => startListening(q));
        } else {
            const shuffled = shuffleAnswers(q);
            renderMCQuestion(shuffled, undefined, undefined, undefined);
        }
    }

    function initMode(mode) {
        if(recognition) recognition.abort();
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        gameActive = true;
        answeringLock = false;
        levelQuestions = modeBuilders[currentMode](currentLevel);
        updateTotalScore();
        updateLevelButtons();
        loadCurrentQuestion();
        kenyanFactArea.innerHTML = `🇰🇪 ${facts[0]}`;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabReading').addEventListener('click', () => initMode('reading'));
    document.getElementById('TabPronouns').addEventListener('click', () => initMode('pronouns'));
    document.getElementById('TabVoice').addEventListener('click', () => initMode('voice'));
    document.getElementById('TabNouns').addEventListener('click', () => initMode('nouns'));

    for(let i=1;i<=4;i++) levelScores[i]=0;
    initMode('reading');
</script>
</body>
</html>
