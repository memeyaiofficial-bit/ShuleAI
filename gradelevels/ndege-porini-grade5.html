<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Shujaa wa Kiswahili - CBC Darasa la 5 | Insha, Visawe, Ndege & Mchezo wa Kuigiza</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1f5e3a 0%, #0e3a22 100%);
      font-family: 'Segoe UI', 'Poppins', 'Roboto', system-ui, 'Noto Sans', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      max-width: 960px;
      width: 100%;
      background: #fffef5;
      background-image: radial-gradient(circle at 10% 20%, rgba(230, 255, 230, 0.7) 2%, #fafff0 90%);
      border-radius: 72px 56px 72px 56px;
      box-shadow: 0 30px 45px rgba(0,0,0,0.5), inset 0 1px 3px rgba(255,250,200,0.9);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .game-header {
      background: linear-gradient(105deg, #2c7a4d, #3e9e65);
      padding: 1.2rem 1.8rem;
      color: white;
      text-shadow: 2px 2px 0 #0a3a22;
      border-bottom: 5px solid #d8ffa8;
    }

    .level-badge {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .timer-area {
      background: #1e3a2f;
      padding: 6px 18px;
      border-radius: 60px;
      font-family: monospace;
      font-size: 1.8rem;
      font-weight: bold;
      color: #e1ffb0;
      box-shadow: inset 0 0 5px gold, 0 2px 6px black;
    }

    .score-progress {
      background: #2a5e44;
      padding: 6px 15px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .question-card {
      padding: 1.8rem 2rem;
      background: #fffffe;
      margin: 20px 25px;
      border-radius: 52px;
      box-shadow: 0 12px 20px rgba(0,0,0,0.08);
      border: 1px solid #e2daa0;
    }

    .story-narrative {
      font-size: 1.22rem;
      line-height: 1.5;
      background: #fefae0;
      padding: 20px 24px;
      border-radius: 40px;
      margin-bottom: 22px;
      color: #2d4a2a;
      font-weight: 500;
      border-left: 12px solid #2c7a4d;
      box-shadow: inset 0 0 0 1px #fff7e0, 0 4px 8px rgba(0,0,0,0.05);
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 20px 0 15px;
      color: #2d2b26;
      word-break: break-word;
    }

    .answer-area {
      margin: 20px 0 10px;
    }

    .answer-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.2rem;
      border: 3px solid #e2ba70;
      border-radius: 60px;
      background: #fffff5;
      font-family: inherit;
      transition: 0.2s;
      outline: none;
    }

    .answer-input:focus {
      border-color: #2c7a4d;
      box-shadow: 0 0 0 3px rgba(44,122,77,0.3);
    }

    button {
      background: #2c7a4d;
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 28px;
      font-size: 1.2rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 12px;
      box-shadow: 0 3px 0 #154e32;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #154e32;
    }

    button:disabled {
      background: #c2ad80;
      cursor: not-allowed;
      transform: none;
    }

    .feedback {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #f2ecd9;
      padding: 14px;
      border-radius: 36px;
      text-align: center;
    }

    .level-complete {
      text-align: center;
      background: #ffe0a3;
      padding: 24px;
      border-radius: 56px;
      margin: 20px;
      font-weight: bold;
    }

    .badge-correct {
      background: #2b7a3e;
      color: white;
    }
    .badge-wrong {
      background: #b34e3a;
      color: white;
    }

    @media (max-width: 560px) {
      .game-container {
        border-radius: 36px;
      }
      .question-card {
        padding: 1rem 1.2rem;
        margin: 12px;
      }
      .story-narrative {
        font-size: 0.98rem;
        padding: 14px;
      }
      .question-text {
        font-size: 1.2rem;
      }
      .timer-area {
        font-size: 1.3rem;
        padding: 4px 12px;
      }
      .level-badge {
        font-size: 1rem;
      }
      button {
        padding: 10px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="game-container" id="gameRoot">
  <div class="game-header">
    <div class="level-badge">
      <span>🦅📖 <strong id="levelName">Ngazi ya 1: Insha, Visawe na Ndege wa Porini</strong></span>
      <span class="timer-area">⏱️ <span id="timerDisplay">00:00</span></span>
      <span class="score-progress">⭐ <span id="scoreSpan">0</span> / <span id="totalQSpan">40</span></span>
    </div>
  </div>
  <div id="dynamicContent"></div>
</div>

<script>
  // --------------------------------------------------------------
  // CBC GAME - DARASA LA 5 - MERGED
  // MADA ZILIZOUNGUZWA:
  //   1. Insha ya Masimulizi (kusimulia tukio, mnyambuliko wa vitenzi)
  //   2. Visawe (maneno yenye maana sawa)
  //   3. Mchezo wa Kuigiza (diolojia, majigambo, tamthilia)
  //   4. Ndege wa Porini (aina, sifa, uhifadhi)
  // Vipengele: Timer (sek 35), Sauti (muda umekwisha, jibu sahihi/si sahihi)
  // Levels 5, maswali 40/level, 80% kupita. Jibu la maandishi.
  // --------------------------------------------------------------
  const QUESTIONS_PER_LEVEL = 40;
  const PASS_PERCENT = 80;
  const TIME_PER_QUESTION = 35;

  const synth = window.speechSynthesis;

  function speakKiswahili(text, onEnd = null) {
    if (!synth) return;
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'sw-TZ';
    utterance.rate = 0.9;
    utterance.pitch = 1.0;
    if (onEnd) utterance.onend = onEnd;
    synth.speak(utterance);
  }

  function speakTimeUp() {
    speakKiswahili("Muda umekwisha! Jibu sahihi limeonyeshwa. Endelea kujifunza insha, visawe na ndege.");
  }
  function speakCorrect() { speakKiswahili("Jibu sahihi! Hongera, unajua lugha vizuri."); }
  function speakWrong(correctAnswer) { speakKiswahili(`Jibu si sahihi. Jibu sahihi ni ${correctAnswer}. Soma zaidi.`); }

  // ---------- Jenereta ya maswali yenye mada zote ----------
  function buildQuestionsForLevel(level) {
    const qList = [];

    for (let i = 1; i <= QUESTIONS_PER_LEVEL; i++) {
      let narrative = "", question = "", correctAnswer = "";
      const mix = (i + level * 7) % 5; // 0:Insha, 1:Visawe, 2:Mchezo wa Kuigiza, 3:Ndege, 4:Mchanganyiko

      // LEVEL 1: Msingi wa Insha na Mnyambuliko
      if (level === 1) {
        if (mix === 0 || i % 3 === 0) {
          narrative = "Insha ya masimulizi huanza na utangulizi, kisha mwili na hatimaye hitimisho. Sehemu ya kwanza ya insha huitwaje?";
          question = "Sehemu ya kwanza ya insha ya masimulizi.";
          correctAnswer = "utangulizi";
        } else if (mix === 1) {
          narrative = "Neno 'kubwa' lina visawe 'kikubwa' au '-enye ukuu'. Taja kisawe cha neno 'kubwa'.";
          question = "Taja kisawe cha neno 'kubwa'.";
          correctAnswer = "kikubwa";
        } else {
          narrative = "Katika insha ya masimulizi, tunaweza kutumia vitenzi vya wakati uliopita. Kitenzi 'kula' kwa wakati uliopita ni 'alikula'. Badili kitenzi 'kimbia' kuwa wakati uliopita (yeye).";
          question = "Neno 'kimbia' kwa wakati uliopita (ngeli ya I - yeye) ni nini?";
          correctAnswer = "alikimbia";
        }
        if (i === 35) { correctAnswer = "tai"; narrative = "Ndege huyu mkubwa anaitwa mfalme wa anga. Hula wanyama wadogo."; question = "Ndege gani wa porini anayejulikana kwa macho makali?"; }
      }
      // LEVEL 2: Mnyambuliko wa Vitenzi + Visawe
      else if (level === 2) {
        if (mix === 0) {
          narrative = "Kitenzi 'penda' kwa wakati ujao (yeye) ni 'atapenda'. Taja kitenzi 'penda' kwa wakati ujao.";
          question = "Kitenzi 'penda' kwa wakati ujao (umoja) ni nini?";
          correctAnswer = "atapenda";
        } else if (mix === 1) {
          narrative = "Neno 'zuri' lina visawe 'nzuri', 'ema'. Taja kisawe cha 'zuri'.";
          question = "Kisawe cha neno 'zuri'.";
          correctAnswer = "ema";
        } else {
          narrative = "Katika mchezo wa kuigiza, watu huvaa mavazi na kuigiza wahusika. Sehemu ya mazungumzo kati ya wahusika inaitwaje?";
          question = "Jina la mazungumzo katika mchezo wa kuigiza.";
          correctAnswer = "diolojia";
        }
        if (i === 38) { correctAnswer = "kunguru"; narrative = "Ndege mweusi wa porini anayetamba na domo lake kubwa."; question = "Ndege gani mweusi wa porini?"; }
      }
      // LEVEL 3: Ndege wa Porini + Kusoma kwa mapana
      else if (level === 3) {
        if (mix === 0) {
          narrative = "Ndege mkubwa anayetamba kwa macho makali na kucha kali ni 'tai'. Tai hula nyama za wanyama waliokufa.";
          question = "Ndege huyu mwindaji anaitwaje?";
          correctAnswer = "tai";
        } else if (mix === 1) {
          narrative = "Korongo ana shingo ndefu, miguu mirefu, hupenda maeneo yenye maji. Taja jina lake.";
          question = "Ndege mwenye shingo ndefu, wa porini, karibu na maji.";
          correctAnswer = "korongo";
        } else {
          narrative = "Soma: 'Kipanga ni ndege mdogo wa porini anayekula wadudu. Anapatikana savana na misituni.'";
          question = "Ndege huyu mdogo anaitwa nani?";
          correctAnswer = "kipanga";
        }
        if (i === 39) { correctAnswer = "mbuni"; narrative = "Ndege mkubwa asiyeruka wa porini."; question = "Ndege mkubwa asiyeruka anaitwa nani?"; }
      }
      // LEVEL 4: Mchanganyiko (Insha, Visawe, Mchezo wa Kuigiza, Ndege)
      else if (level === 4) {
        if (mix === 0) {
          narrative = "Kitenzi 'karibia' kwa wakati ujao (yeye) ni 'atakaribia'. Taja kitenzi hiki.";
          question = "Kitenzi 'karibia' kwa wakati ujao (umoja).";
          correctAnswer = "atakaribia";
        } else if (mix === 1) {
          narrative = "Neno 'mwana' lina kisawe 'mtoto'. Katika igizo la ndege, 'mwana wa tai' anaitwa 'kifaranga'.";
          question = "Taja kisawe cha neno 'mwana'.";
          correctAnswer = "mtoto";
        } else if (mix === 2) {
          narrative = "Mchezo wa kuigiza uliohusisha ndege: 'Twiga na Ndege' wakiongea juu ya ushirikiano. Mazungumzo baina ya wahusika wawili huitwaje?";
          question = "Mazungumzo baina ya wahusika wawili huitwaje?";
          correctAnswer = "diolojia";
        } else {
          narrative = "Ndege mkubwa wa porini anayeruka juu sana, mwenye domo lililoinama ni 'kunguru'? Hapana ni 'tai' wa milima.";
          question = "Taja ndege mkubwa mwindaji mwenye macho makali.";
          correctAnswer = "tai";
        }
      }
      // LEVEL 5: Ubingwa - Mada zote kwa kina
      else {
        if (mix === 0) {
          narrative = "Katika insha ya masimulizi, mtindo wa kusimulia ni wa kuvutia. Kitenzi 'simulia' kwa wakati uliopo wingi (wahusika) ni 'wanasimulia'.";
          question = "Wingi wa 'anasimulia' (umoja) kwa wakati uliopo.";
          correctAnswer = "wanasimulia";
        } else if (mix === 1) {
          narrative = "Kisawe cha 'nyumba' ni 'makazi'. Katika igizo la 'Makazi ya Ndege', ndege waliishi katika viota.";
          question = "Taja kisawe cha neno 'nyumba'.";
          correctAnswer = "makazi";
        } else if (mix === 2) {
          narrative = "Mchezo wa kuigiza kuhusu ndege: 'Mwalime na Ndege'. Mhusika mkuu alikuwa 'Mwalime' (mkulima). Kisawe cha 'mkulima' ni nini?";
          question = "Kisawe cha 'mkulima' ni nini?";
          correctAnswer = "mwenye shamba";
        } else {
          narrative = "Ndege wa porini wanaoitwa 'horee' wana rangi nyeusi na nyeupe. Ndege mkubwa asiyeruka wa porini anaitwa 'mbuni'.";
          question = "Ndege mkubwa asiyeruka wa porini anaitwa nani?";
          correctAnswer = "mbuni";
        }
      }

      if (!narrative) narrative = "Jifunze insha ya masimulizi, visawe, mchezo wa kuigiza na ndege wa porini.";
      if (!question) question = "Taja kisawe cha neno 'kubwa'.";
      if (!correctAnswer) correctAnswer = "kikubwa";
      
      qList.push({
        id: level * 100 + i,
        narrative: narrative.trim(),
        question: question.trim(),
        correctAnswer: correctAnswer.trim().toLowerCase()
      });
    }
    while(qList.length < QUESTIONS_PER_LEVEL) {
      qList.push({ 
        narrative: "Visawe: 'nzuri' na 'ema'. Ndege mmoja wa porini anayewinda usiku anaitwa 'bundi'.", 
        question: "Taja kisawe cha 'nzuri'.", 
        correctAnswer: "ema" 
      });
    }
    return qList.slice(0, QUESTIONS_PER_LEVEL);
  }

  // ---------- GLOBAL STATE ----------
  let currentLevel = 1;
  let currentQIndex = 0;
  let levelQuestions = [];
  let levelScore = 0;
  let timerInterval = null;
  let timeLeft = TIME_PER_QUESTION;
  let answeringLock = false;
  let waitingForNext = false;

  const dynamicDiv = document.getElementById("dynamicContent");
  const levelNameSpan = document.getElementById("levelName");
  const timerDisplaySpan = document.getElementById("timerDisplay");
  const scoreSpan = document.getElementById("scoreSpan");
  const totalQSpan = document.getElementById("totalQSpan");

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function updateTimerDisplay() {
    let mins = Math.floor(timeLeft / 60);
    let secs = timeLeft % 60;
    timerDisplaySpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
  }

  function startTimer() {
    if (timerInterval) stopTimer();
    timeLeft = TIME_PER_QUESTION;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if (answeringLock || waitingForNext) return;
      if (timeLeft <= 1) {
        if (!waitingForNext && !answeringLock) {
          stopTimer();
          handleTimeout();
        }
      } else {
        timeLeft--;
        updateTimerDisplay();
      }
    }, 1000);
  }

  function handleTimeout() {
    if (waitingForNext) return;
    const currentQ = getCurrentQuestion();
    speakTimeUp();
    const feedbackDiv = document.getElementById("feedbackMsg");
    if (feedbackDiv) {
      feedbackDiv.innerHTML = `⏰ MUDA UMESHA! Jibu sahihi lilikuwa: "${currentQ.correctAnswer}". Endelea kujifunza.`;
      feedbackDiv.className = "feedback badge-wrong";
    }
    lockAndMoveAfterDelay(true);
  }

  function getCurrentQuestion() { return levelQuestions[currentQIndex]; }

  function checkAnswer() {
    if (waitingForNext || answeringLock) return;
    const inputElem = document.getElementById("answerInput");
    if (!inputElem) return;
    let userAnswer = inputElem.value.trim().toLowerCase();
    const currentQ = getCurrentQuestion();
    const isCorrect = (userAnswer === currentQ.correctAnswer);
    answeringLock = true;
    stopTimer();

    const feedbackDiv = document.getElementById("feedbackMsg");
    if (isCorrect) {
      levelScore++;
      scoreSpan.innerText = levelScore;
      feedbackDiv.innerHTML = `✅ Jibu zuri! "${inputElem.value}" ni sawa. Umeweza!`;
      feedbackDiv.className = "feedback badge-correct";
      speakCorrect();
    } else {
      feedbackDiv.innerHTML = `❌ Jibu lako "${inputElem.value}" si sahihi. Jibu sahihi: ${currentQ.correctAnswer}.`;
      feedbackDiv.className = "feedback badge-wrong";
      speakWrong(currentQ.correctAnswer);
    }
    const inputField = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    if (inputField) inputField.disabled = true;
    if (submitBtn) submitBtn.disabled = true;

    setTimeout(() => { goToNextQuestion(); }, 2100);
  }

  function lockAndMoveAfterDelay(isTimeout = false) {
    if (waitingForNext) return;
    const inputElem = document.getElementById("answerInput");
    if (inputElem) inputElem.disabled = true;
    const submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.disabled = true;
    setTimeout(() => { goToNextQuestion(); }, 1800);
  }

  function goToNextQuestion() {
    if (waitingForNext) return;
    waitingForNext = true;
    const isLast = (currentQIndex + 1 >= QUESTIONS_PER_LEVEL);
    if (isLast) {
      const required = Math.ceil(QUESTIONS_PER_LEVEL * PASS_PERCENT / 100);
      if (levelScore >= required) {
        if (currentLevel === 5) { showGameComplete(true); } 
        else { showLevelComplete(true); }
      } else { showLevelComplete(false); }
    } else {
      currentQIndex++;
      loadCurrentQuestion();
      waitingForNext = false;
    }
  }

  function showLevelComplete(passed) {
    stopTimer();
    const required = Math.ceil(QUESTIONS_PER_LEVEL * PASS_PERCENT / 100);
    if (passed) {
      synth.cancel();
      speakKiswahili("Hongera! Umefanikiwa ngazi hii. Sasa unaendelea ngazi inayofuata.");
      dynamicDiv.innerHTML = `
        <div class="level-complete">
          🎉🦅 HONGERA! Umehitimu Ngazi ya ${currentLevel} 🎭📖<br>
          Ulipata ${levelScore} kati ya ${QUESTIONS_PER_LEVEL} (inahitajika ${required}+).<br>
          <button id="nextLevelBtn">🔓 Nenda Ngazi ${currentLevel+1}</button>
        </div>
      `;
      const nextBtn = document.getElementById("nextLevelBtn");
      if (nextBtn) nextBtn.onclick = () => { currentLevel++; initLevel(currentLevel); };
    } else {
      speakKiswahili("Samahani, hukupata asilimia themanini. Jaribu tena ngazi hii.");
      dynamicDiv.innerHTML = `
        <div class="level-complete" style="background:#e6d4aa;">
          😔 Pole, haukufikia ${PASS_PERCENT}%. Ulipata ${levelScore}/${QUESTIONS_PER_LEVEL}.<br>
          Inahitajika angalau ${required} sahihi.<br>
          <button id="retryLevelBtn">🔄 Jaribu tena Ngazi ya ${currentLevel}</button>
        </div>
      `;
      const retry = document.getElementById("retryLevelBtn");
      if (retry) retry.onclick = () => initLevel(currentLevel);
    }
  }

  function showGameComplete(win) {
    stopTimer();
    synth.cancel();
    speakKiswahili("Hongera sana! Umekamilisha mchezo wote. Wewe ni bingwa wa Kiswahili!");
    dynamicDiv.innerHTML = `
      <div class="level-complete" style="background:#ffe0a3;">
        🏆🏆 🦜 UMESHINDA! BINGWA WA LUGHA 📖🎭🏆🏆<br>
        Umeweza insha ya masimulizi, visawe, mchezo wa kuigiza na ndege wa porini.<br>
        <button id="restartGameBtn">✨ Cheza Tena ✨</button>
      </div>
    `;
    const restart = document.getElementById("restartGameBtn");
    if (restart) restart.onclick = () => { currentLevel = 1; initLevel(1); };
  }

  function loadCurrentQuestion() {
    const q = getCurrentQuestion();
    dynamicDiv.innerHTML = `
      <div class="question-card">
        <div class="story-narrative">📖 ${q.narrative}</div>
        <div class="question-text">❓ ${q.question}</div>
        <div class="answer-area">
          <input type="text" id="answerInput" class="answer-input" placeholder="Andika jibu lako kwa Kiswahili..." autocomplete="off">
        </div>
        <button id="submitBtn">🔍 Jibu Swali</button>
        <div id="feedbackMsg" class="feedback">⏳ Sekunde ${TIME_PER_QUESTION} pekee. Jibu kwa usahihi.</div>
      </div>
    `;
    const inputField = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    if (inputField) {
      inputField.disabled = false;
      inputField.value = "";
      inputField.focus();
    }
    if (submitBtn) submitBtn.disabled = false;
    answeringLock = false;
    waitingForNext = false;
    if (submitBtn) submitBtn.onclick = () => checkAnswer();
    if (inputField) inputField.onkeypress = (e) => { if(e.key === 'Enter') checkAnswer(); };
    startTimer();
  }

  function initLevel(level) {
    stopTimer();
    if (synth) synth.cancel();
    currentLevel = level;
    currentQIndex = 0;
    levelScore = 0;
    answeringLock = false;
    waitingForNext = false;
    levelQuestions = buildQuestionsForLevel(level);
    scoreSpan.innerText = "0";
    totalQSpan.innerText = QUESTIONS_PER_LEVEL;
    let levelTitle = "";
    if(level===1) levelTitle = "Ngazi 1: Insha, Visawe, Ndege Msingi";
    else if(level===2) levelTitle = "Ngazi 2: Mnyambuliko, Visawe na Mchezo wa Kuigiza";
    else if(level===3) levelTitle = "Ngazi 3: Ndege wa Porini na Kusoma Kwa Mapana";
    else if(level===4) levelTitle = "Ngazi 4: Mchanganyiko - Insha, Visawe, Uigizaji, Ndege";
    else levelTitle = "Ngazi 5: Ubingwa - Mada Zote Kwa Kina";
    levelNameSpan.innerText = levelTitle;
    loadCurrentQuestion();
  }

  initLevel(1);
</script>
</body>
</html>
