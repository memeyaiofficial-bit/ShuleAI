<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo na Afya - Darasa la 1 | Kiswahili CBC Game | Usafi, Vyakula, Jikoni</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* smoother for kids, but input remains editable */
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2b7a4b 0%, #0e5e34 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        .game-header {
            background: #ffc857;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e3820;
            padding: 8px 16px;
            border-radius: 40px;
            color: #fff1c1;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a4a2a, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #2f5e3a;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #43aa8b;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #1f6e55;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1f6e55;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🧼 Hadithi ya Bobo: Jifunze usafi wa mwili, vyakula vyetu na jikoni!
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo atakusaidia! Andika jibu sahihi. Bonyeza sauti kusikia swali.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- KISWAHILI VOICE OUTPUT ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    // Read current question aloud
    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali limeshajibiwa. Subiri swali linalofuata.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) {
            speakKiswahili(`Swali: ${qData.text}`);
        } else {
            speakKiswahili("Hakuna swali kwa sasa.");
        }
    }

    // ---------- QUESTION BANK: USAFI WA MWILI, VYAKULA VYETU, JIKONI ----------
    // Generate 40 unique narrative questions per level (levels 1-5, slight variation but core topics)
    function generateQuestionsForLevel(level) {
        const questions = [];
        const topics = ['usafi', 'vyakula', 'jikoni'];
        
        // Rich vocabulary for each topic
        const usafiBank = [
            { q: "Bobo anaosha mikono kabla ya kula. Anatumia sabuni na _____.", a: "maji" },
            { q: "Kusafisha meno tunatumia mswaki na _____.", a: "dawa ya meno" },
            { q: "Kabla ya kulala, Bobo hujichubua kwa _____.", a: "maji" },
            { q: "Tunakata kucha tumia _____.", a: "mkasi" },
            { q: "Baada ya choo, ni vizuri kuosha _____.", a: "mikono" },
            { q: "Nguo chafu tunaosha kwa sabuni na _____.", a: "maji" },
            { q: "Ili kuwa safi, Bobo huoga kila _____.", a: "siku" },
            { q: "Kitu cha kukausha mikono baada ya kuosha ni _____.", a: "taulo" },
            { q: "Usafi wa mwili huzuia _____.", a: "magonjwa" },
            { q: "Bobo anachana nywele na _____.", a: "kichana" }
        ];
        
        const vyakulaBank = [
            { q: "Asubuhi tunakula _____. (chakula cha asubuhi)", a: "kiamsha kinywa" },
            { q: "Mchele uliopikwa hutoka kwa _____.", a: "wali" },
            { q: "Supa ya nyanya ina ladha ya _____.", a: "nyanya" },
            { q: "Tunda la manjano na tamu ni _____.", a: "ndizi" },
            { q: "Tunakunywa maji safi ili kuzuia _____.", a: "kiwewe" },
            { q: "Maharagwe ni chakula chenye _____.", a: "protini" },
            { q: "Ugali huliwa na _____.", a: "samaki" },
            { q: "Bobo anapenda kula yai. Yai ni chanzo cha _____.", a: "protini" },
            { q: "Chakula cha mchana huitwa _____.", a: "chakula cha mchana" },
            { q: "Tunda lenye rangi ya machungwa na vitamini C ni _____.", a: "chungwa" }
        ];
        
        const jikoniBank = [
            { q: "Mama anapika kwenye _____.", a: "jiko" },
            { q: "Tunapikia maji kwenye _____.", a: "sufuria" },
            { q: "Kisu kinatumika kukata _____.", a: "mboga" },
            { q: "Kijiko cha kucholea chakula kinaitwa _____.", a: "kijiko" },
            { q: "Jikoni tunaweka vyombo kwenye _____.", a: "kabati" },
            { q: "Bobo anaosha vyombo kwa sabuni na _____.", a: "sifongo" },
            { q: "Motokaa ya kupikia umeme ni _____.", a: "jiko la umeme" },
            { q: "Chupa ya kupimia maji ni _____.", a: "kopo" },
            { q: "Tunakunja vitambaa vya jikoni, huitwa _____.", a: "kitanzi" },
            { q: "Sahani ya kina kirefu ya supu ni _____.", a: "bakuli" }
        ];
        
        for (let i = 1; i <= 40; i++) {
            let topic = topics[(i + level) % 3];
            let qText = "";
            let correctAnswer = "";
            
            if (topic === 'usafi') {
                let idx = (i * level) % usafiBank.length;
                let item = usafiBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                // make some narrative variation
                if (i % 6 === 0) qText = "Bobo anataka kuwa msafi. Anachana nywele kwa _____.", correctAnswer = "kichana";
                if (i % 8 === 0) qText = "Usafi wa meno unahitaji mswaki na _____.", correctAnswer = "dawa ya meno";
            } 
            else if (topic === 'vyakula') {
                let idx = (i * (level+1)) % vyakulaBank.length;
                let item = vyakulaBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                if (i % 7 === 0) qText = "Bobo anakula tunda lenye rangi ya kijani na nyekundu ndani. Ni _____.", correctAnswer = "tikitimaji";
                if (i % 9 === 0) qText = "Chakula kitamu cha asubuhi ni _____.", correctAnswer = "uji";
            } 
            else { // jikoni
                let idx = (i * (level+2)) % jikoniBank.length;
                let item = jikoniBank[idx];
                qText = item.q;
                correctAnswer = item.a;
                if (i % 5 === 0) qText = "Jikoni, vyombo vya udongo ni _____.", correctAnswer = "vyungu";
            }
            
            // final touch: ensure answers are trimmed & lowercase
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0,40);
    }
    
    // Preload levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;          // 40 seconds per question
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    // Timer functions
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Jaribu tena swali lijalo.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako, Bobo anasubiri! Bonyeza sauti kusikia swali tena.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Bobo anajifunza usafi, vyakula vyetu na jikoni! Anawasaidia wazazi.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Safari ya usafi na vyakula inaendelea. Makini zaidi!";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Bobo anahitaji msaada wako. Kumbuka mambo ya jikoni!";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Changamoto kubwa! Unazidi kuwa bingwa wa afya.";
        else levelDesc = "Ngazi 5: Mwisho mzuri! Bobo atakupa tuzo baada ya kufaulu.";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5! Bobo anajivunia wewe! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza mchezo wa usafi, vyakula na jikoni! Wewe ni shujaa wa darasa la kwanza!");
                storyAreaDiv.innerHTML = "🏁 Mwisho wa Mchezo! Bobo anakupa kikombe cha usafi na lishe bora!";
                nextLevelMsgDiv.innerHTML = "✨ UMEMALIZA Mchezo Kikamilifu! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel}. Sasa ngazi ${currentLevel+1}. Endelea kujifunza!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukupata 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu tena Ngazi ${currentLevel}.`;
            speakKiswahili(`Pole, hukufaulu ngazi ${currentLevel}. Jaribu tena kwa makini.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo anasubiri jibu! Bonyeza sauti kusikia swali.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu! Bobo anakungoja.";
            speakKiswahili("Tafadhali andika jibu.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // simple forgiving for plurals or synonyms (grade 1 friendly)
        if (!isCorrect) {
            if ((normalizedCorrect === "maji" && normalizedUser === "maji safi") ||
                (normalizedCorrect === "sabuni" && normalizedUser === "sabuni ya mikono")) isCorrect = true;
            else if ((normalizedCorrect === "dawa ya meno" && normalizedUser === "dawa ya mswaki")) isCorrect = true;
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi: "${currentQ.answer}". Usikate tamaa, endelea! ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Endelea kujaribu!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    // Event listeners
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    // initial load
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa Bobo! Mada: Usafi wa mwili, Vyakula vyetu na Jikoni. Una sekunde arobaini kwa swali. Bonyeza sauti kusikia swali.");
        }, 500);
    });
</script>
</body>
</html>
