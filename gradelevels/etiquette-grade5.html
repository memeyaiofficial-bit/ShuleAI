<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>A Promise is a Promise | CBC Grade 5 English – Etiquette & Grammar Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e4a6e 0%, #0f2c42 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fffaf0;
            background-image: radial-gradient(circle at 15% 30%, rgba(210, 180, 140, 0.1) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,250,210,0.9);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #f4c542;
        }

        .game-header {
            background: linear-gradient(98deg, #2c6e5c, #1f8a6b);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #ffcf7a;
        }

        .level-badge {
            background: #ffd966;
            color: #1f5e4b;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #c58f2a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #175a48;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #ffe1a0;
            margin-right: 6px;
        }

        .progress-area {
            background: #ecd9b4;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #8b6946;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #f3b33d;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #4f3a22;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #ceaa76;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #1b4e3f;
            border: 1px solid #f3cf9a;
        }

        .voice-btn {
            background: #318267;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #1e4a3a;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e4a3a;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #2f6b58;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #cfb27c;
            border-radius: 60px;
            background: #fffff2;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #f3b33d;
            box-shadow: 0 0 0 3px rgba(243,179,61,0.3);
        }

        .hint-message {
            background: #f6ecdb;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #7b5a39;
            font-style: italic;
            border-left: 7px solid #f3b33d;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #2c6e5c;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #154f3f;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #154f3f;
        }

        .submit-btn {
            background: #f3b33d;
            color: #2c3a1f;
            box-shadow: 0 4px 0 #b8681a;
            flex: 2;
        }

        .next-btn {
            background: #4f8a72;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #fff0dd;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #f1c40f;
        }

        .timer.warning {
            color: #ffcf9a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>🤝 SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">Loading your promise quest...</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word / phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). Keep your promise!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // A PROMISE IS A PROMISE – Grade 5 CBC English
    // Topics: Listening, Speaking, Pronunciation, Reading (Narrative),
    // Grammar: Use of "too...to" and "too...for", Writing, Handwriting,
    // Etiquette - Table Manners.
    // 5 levels × 30 questions. Timer 40s, 80% to pass. Voice output.
    // All open-ended. Hints given when time ≤12 seconds.
    // --------------------------------------------------------------

    // ------ Create rich question bank for each level (150 unique) ------
    function generateBankForLevel(level) {
        const bank = [];
        // We will mix grammar (too...to / too...for), table manners, narrative promises, pronunciation, listening/speaking.
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            // Distribute 6 strands: 0:Grammar(too...to/for)  1:Table Manners  2:Narrative(Promise)  3:Pronunciation  4:Listening/Speaking  5:Writing/Handwriting
            let category = (i + level * 2) % 6;
            if (level === 1) category = i % 6;
            if (level === 2) category = (i + 3) % 6;
            if (level === 3) category = (i + 1) % 6;
            if (level === 4) category = (i + 4) % 6;
            if (level === 5) category = (i + 2) % 6;

            if (category === 0) { // Grammar: too...to / too...for
                const gramBank = [
                    { q: "Complete: The soup is ______ hot to eat. (too)", ans: "too", hint: "excessively / more than needed" },
                    { q: "This table is too low ______ me. (for / to)", ans: "for", hint: "preposition showing relation" },
                    { q: "The promise was ______ important to break. (too)", ans: "too", hint: "very / extremely" },
                    { q: "This dish is too spicy ______ my little brother. (for)", ans: "for", hint: "used with 'for' + person" },
                    { q: "He spoke ______ softly to hear. (too)", ans: "too", hint: "degree word" },
                    { q: "The chair is too high ______ the child. (for)", ans: "for", hint: "fits 'too + adj + for + noun'" }
                ];
                const pick = gramBank[i % gramBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Table Manners (Etiquette)
                const mannersBank = [
                    { q: "Always keep your ______ closed while chewing.", ans: "mouth", hint: "part of face" },
                    { q: "Place the ______ on your lap during a meal.", ans: "napkin", hint: "cloth for wiping" },
                    { q: "Say 'please' and '______' to show good manners.", ans: "thank you", hint: "polite expression" },
                    { q: "Do not ______ with your mouth full.", ans: "talk", hint: "speak" },
                    { q: "Use your ______, not your fingers, for soup.", ans: "spoon", hint: "utensil" },
                    { q: "Wait for everyone to be ______ before starting to eat.", ans: "served", hint: "food on plates" },
                    { q: "Elbows ______ the table are considered bad manners.", ans: "on", hint: "position word" }
                ];
                const pick = mannersBank[i % mannersBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Narrative (A Promise is a Promise) reading comprehension
                const storyBank = [
                    { q: "In the story, the child promised to ______ the table every evening.", ans: "set", hint: "arrange dishes" },
                    { q: "A promise means you must be ______ (truthful).", ans: "honest", hint: "not lying" },
                    { q: "The grandmother said: 'A promise is a ______.'", ans: "debt", hint: "something you owe" },
                    { q: "Keeping a promise builds ______ (trust).", ans: "trust", hint: "belief in someone" },
                    { q: "The main character felt ______ when she broke her promise.", ans: "guilty", hint: "remorseful feeling" }
                ];
                const pick = storyBank[i % storyBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Pronunciation (word stress, sounds)
                const pronBank = [
                    { q: "The word 'promise' has the stress on first syllable: ______ (pro-mise).", ans: "pro", hint: "first part" },
                    { q: "The 'th' sound in 'manners' is voiced or unvoiced? (voiced/unvoiced)", ans: "voiced", hint: "vibration in throat" },
                    { q: "Say 'etiquette' – the last syllable sounds like ______ (ket/kit).", ans: "ket", hint: "sounds like 'ket'" },
                    { q: "The word 'napkin' has ______ syllables.", ans: "two", hint: "nap-kin = 2" },
                    { q: "In 'table manners', the vowel sound in 'man' is /______/ (æ / a).", ans: "æ", hint: "short a" }
                ];
                const pick = pronBank[i % pronBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 4) { // Listening & Speaking (dialogue about promises and manners)
                const lsBank = [
                    { q: "When someone says 'I promise', you should ______ carefully.", ans: "listen", hint: "pay attention" },
                    { q: "To speak politely, use a ______ tone of voice.", ans: "calm", hint: "not loud or rude" },
                    { q: "Before eating, it's polite to say ______ (grace/thanks).", ans: "grace", hint: "short prayer" },
                    { q: "If you break a promise, you should ______ (apologize).", ans: "apologize", hint: "say sorry" },
                    { q: "Listening to table manners rules shows ______ (respect).", ans: "respect", hint: "honor for others" }
                ];
                const pick = lsBank[i % lsBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Writing & Handwriting (legibility & composition)
                const writeBank = [
                    { q: "Good handwriting means letters are ______ (clear/neat).", ans: "neat", hint: "orderly and tidy" },
                    { q: "When writing a promise, start with capital letter and end with a ______.", ans: "period", hint: "punctuation mark" },
                    { q: "In cursive writing, letters are ______ together.", ans: "joined", hint: "connected" },
                    { q: "The 'slant' in handwriting should be ______ (consistent).", ans: "consistent", hint: "same direction" },
                    { q: "To improve handwriting, practice on ______ paper.", ans: "lined", hint: "has horizontal lines" }
                ];
                const pick = writeBank[i % writeBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 A hint appears when timer ≤12 sec. Keep your promise to answer!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ TIME'S UP! The correct answer was: "${currentCorrectAnswer.toUpperCase()}". Press NEXT.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "✨ A promise keeper answers wisely. Type your answer! ✨";
        hintArea.innerHTML = "💡 Hint will show when time is low (≤12s).";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT to continue.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        const correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible matching (grade5 friendly)
        if (userAns === correct) isCorrect = true;
        else if (correct === "thank you" && (userAns === "thanks" || userAns === "thank")) isCorrect = true;
        else if (correct === "too" && (userAns === "to" && currentQuestions[currentIndex].text.includes("too"))) isCorrect = false; // prevent false
        else if (correct === "for" && userAns === "to") isCorrect = false;
        else if (correct === "mouth" && userAns === "lips") isCorrect = true;
        else if (correct === "napkin" && userAns === "serviette") isCorrect = true;
        else if (correct === "set" && userAns === "lay") isCorrect = true;
        else if (correct === "honest" && (userAns === "truthful" || userAns === "sincere")) isCorrect = true;
        else if (correct === "apologize" && userAns === "say sorry") isCorrect = true;
        else if (correct === "trust" && userAns === "faith") isCorrect = true;
        else if (correct === "neat" && (userAns === "clear" || userAns === "legible")) isCorrect = true;
        else if (correct.includes(userAns) && userAns.length > 2 && correct.length > 3) isCorrect = true;
        else if (userAns.includes(correct) && correct.length > 3) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! Good manners & promises matter.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ OOPS! The correct answer is "${correct.toUpperCase()}". You typed "${userAns}". Keep learning!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first or wait until timer ends.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 PROMISE KEEPER CHAMPION! 🏆", `You mastered all levels with ${percent.toFixed(0)}%! You showed great etiquette and grammar power.`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} PASSED! 🎉`, `You scored ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}?`, false);
            }
        } else {
            showLevelTransition(`⚠️ PROMISE NOT YET KEPT`, `You got ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to improve.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">🤝 PLAY AGAIN 🤝</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the adventure
    initLevel();
</script>
</body>
</html>
