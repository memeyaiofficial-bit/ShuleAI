<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🇰🇪 Mwanafunzi Stadi wa Kiswahili | Gredi 6 | Insha, Sarufi, Ngeli na Drama</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(145deg, #eef2ff 0%, #ffffff 100%);
        font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
    }

    .game-container {
        max-width: 1100px;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 3rem 2rem 3rem 2rem;
        box-shadow: 0 25px 45px -12px rgba(0, 65, 115, 0.4);
        overflow: hidden;
        border: 2px solid #7abff7;
    }

    .mode-tabs {
        display: flex;
        background: #0b3b5f;
        border-bottom: 3px solid #ffcd7e;
        gap: 2px;
        flex-wrap: wrap;
    }
    .tab-btn {
        flex: 1;
        background: #1e6faf;
        color: #fef9e0;
        border: none;
        padding: 12px 6px;
        font-size: 0.75rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-family: inherit;
        text-align: center;
    }
    .tab-btn.active {
        background: linear-gradient(135deg, #f4a261, #e76f51);
        color: white;
    }
    .tab-btn:active { transform: scale(0.98); }

    .game-header {
        background: #0b3b5f;
        padding: 0.8rem 1.2rem;
        color: white;
        text-align: center;
        border-bottom: 4px solid #ffcd7e;
    }
    .game-header h1 {
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .kenyan-flag-badge {
        background: #f5f5f5;
        padding: 4px 12px;
        border-radius: 60px;
        font-size: 0.6rem;
        font-weight: 700;
        color: #0b3b5f;
    }

    .levels-row {
        display: flex;
        justify-content: space-between;
        background: #f0f9ff;
        padding: 10px 16px;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 2px dashed #b9dcf5;
    }
    .level-btn {
        background: white;
        border: none;
        padding: 8px 0;
        flex: 1;
        font-weight: bold;
        font-size: 0.8rem;
        border-radius: 60px;
        cursor: pointer;
        font-family: inherit;
        color: #15607a;
        border: 1px solid #cae3f5;
        transition: 0.2s;
    }
    .level-btn.active {
        background: #1e6faf;
        color: white;
        transform: scale(0.97);
    }
    .level-btn:hover:not(.active) { background: #d4ebff; transform: translateY(-2px); }

    .info-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        padding: 8px 20px;
        border-bottom: 1px solid #d0e6f7;
        flex-wrap: wrap;
        gap: 8px;
    }
    .score-box, .q-counter {
        background: #eef2fc;
        padding: 4px 14px;
        border-radius: 40px;
        font-weight: bold;
        color: #0f5080;
        font-size: 0.85rem;
    }
    .score-box span, .q-counter span {
        font-size: 1.2rem;
        font-weight: 800;
        margin-left: 5px;
        color: #033b61;
    }

    .quiz-area {
        padding: 1rem 1rem 0.5rem;
        text-align: center;
    }
    .question-card {
        background: linear-gradient(145deg, #fefefe, #f2f9ff);
        padding: 16px 12px;
        border-radius: 40px;
        margin-bottom: 15px;
        border: 2px solid #b3defa;
    }
    .topic-badge {
        font-size: 0.75rem;
        font-weight: bold;
        background: #cde6fe;
        display: inline-block;
        padding: 3px 15px;
        border-radius: 40px;
        margin-bottom: 10px;
        color: #043753;
    }
    .question-text {
        font-size: 1.1rem;
        font-weight: 800;
        color: #00263b;
        line-height: 1.4;
        margin-top: 6px;
    }
    .story-begin, .verb-display, .sentence-display, .story {
        background: #e6f2ff;
        padding: 14px;
        border-radius: 28px;
        font-size: 1rem;
        line-height: 1.5;
        margin-bottom: 14px;
        text-align: left;
        color: #003366;
    }
    .options-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
    }
    .option-btn {
        background: #d9ecff;
        border: none;
        padding: 10px 12px;
        border-radius: 60px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        text-align: left;
        font-family: inherit;
    }
    .option-btn:hover:not(:disabled) { background: #80bfff; transform: translateX(5px); }
    .option-btn.correct { background: #66ff99; color: #004d1a; }
    .option-btn.wrong { background: #ff6666; color: #660000; text-decoration: line-through; }
    .option-btn:disabled { cursor: default; opacity: 0.7; }

    .voice-zone {
        background: #ffffff;
        border-radius: 56px;
        padding: 14px;
        margin: 6px 0 10px;
        border: 2px dashed #60a5fa;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }
    .mic-button {
        background: #2563eb;
        border: none;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        font-size: 2.2rem;
        cursor: pointer;
        color: white;
        transition: 0.08s linear;
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }
    .mic-button:active { transform: scale(0.92); background: #1e40af; }
    .mic-button.listening-active { animation: pulseMic 1s infinite; background: #0d9488; }
    @keyframes pulseMic {
        0% { transform: scale(1); box-shadow: 0 0 0 0 #3b82f6; }
        50% { transform: scale(1.03); background: #0d9488; box-shadow: 0 0 0 8px rgba(59,130,246,0.3);}
        100% { transform: scale(1); }
    }

    .answer-status { font-size: 0.85rem; font-weight: 600; padding: 6px; min-height: 50px; color: #0f4c5f; text-align: center; }
    .hint-box {
        background: #fff6e0;
        border-left: 8px solid #ffb347;
        padding: 8px 14px;
        margin: 8px 0 0;
        border-radius: 30px;
        font-size: 0.8rem;
        color: #0a537c;
        text-align: left;
    }
    .next-level-msg {
        background: #00713b;
        color: white;
        text-align: center;
        padding: 10px;
        border-radius: 60px;
        margin: 8px 16px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
    }
    .footer-note {
        text-align: center;
        font-size: 0.6rem;
        padding: 10px;
        color: #346f95;
    }
    @media (max-width: 680px) {
        .question-text { font-size: 0.95rem; }
        .tab-btn { font-size: 0.6rem; padding: 8px 3px; }
        .option-btn { padding: 8px 10px; font-size: 0.8rem; }
        .story-begin, .verb-display { font-size: 0.85rem; }
        .mic-button { width: 55px; height: 55px; font-size: 1.8rem; }
    }
</style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabInsha">✍️ Insha & Masimulizi</button>
        <button class="tab-btn" id="TabMnyambuliko">📚 Mnyambuliko wa Vitenzi</button>
        <button class="tab-btn" id="TabNgeli">🔤 Ngeli U-U</button>
        <button class="tab-btn" id="TabDrama">🎭 Drama & Kusoma</button>
    </div>
    <div class="game-header">
        <h1>🇰🇪 MWANAFUNZI STADI 🏆
            <span class="kenyan-flag-badge">GREDI 6 • INSHA, SARUFI NA DRAMA</span>
        </h1>
    </div>
    <div class="levels-row" id="levelButtonsContainer"></div>
    <div class="info-panel">
        <div class="score-box">⭐ ALAMA: <span id="scoreValue">0</span></div>
        <div class="q-counter">📌 SWALI: <span id="currentQNumber">1</span> / <span id="totalQperLevel">15</span></div>
    </div>
    <div class="quiz-area" id="dynamicContent"></div>
    <div id="levelCompleteMsg"></div>
    <div class="footer-note">🎤 Jibu kwa kubonyeza chaguo sahihi. Pata pointi 10 kwa jibu sahihi. Pita ngazi kwa 80% (12/15)!</div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: 4 MODES - Insha, Mnyambuliko, Ngeli U-U, Drama
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: 80% (12/15 correct per level)
    // ==============================================================

    // ---------- MODE 1: INSHA NA MASIMULIZI (Wanyama Majini) ----------
    const inshaData = [
        {p:"Siku moja kwenye ufuo wa bahari, nilimwona kasa akilia.", q:"Kwa nini kasa alikuwa akilia?", o:["Maji yalikuwa yamepunguka","Alikuwa na furaha","Alikuwa akicheza","Alikuwa anaimba"], a:"Maji yalikuwa yamepunguka", h:"Angalia ukame au uhaba wa maji"},
        {p:"Pweza aliamua kukutanisha samaki wote.", q:"Kwa nini pweza aliwakusanya samaki?", o:["Kuzuia uchafuzi","Kucheza","Kula","Kulala"], a:"Kuzuia uchafuzi", h:"Kuhusu uchafuzi wa bahari"},
        {p:"Kasa mzee alianza kuzungumza kwa sauti ya utulivu.", q:"Alisema nini kwa wanyama wengine?", o:["Tusaidiane kupanda mikoko","Tuachane","Tuende mbali","Tulale"], a:"Tusaidiane kupanda mikoko", h:"Maneno ya ushirikiano"},
        {p:"Samaki mdogo aitwaye Titi alipotea kwenye mwamba.", q:"Wenzake walimtafutaje?", o:["Kwa msaada wa jellyfish","Wakamwacha","Wakacheka","Wakaenda nyumbani"], a:"Kwa msaada wa jellyfish", h:"Msaada wa mwanga"}
    ];
    while(inshaData.length<15) inshaData.push(inshaData[0]);
    const inshaDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) inshaDB[l].push(inshaData[(i+l)%inshaData.length]);

    // ---------- MODE 2: MNYAMBULIKO WA VITENZI ----------
    const mnyambulikoData = [
        {q:"Mzizi '-piga' - tengeneza kitenzi cha kutendeana (reciprocal)", o:["pigana","pigisha","pigua","pigia"], a:"pigana", h:"Ongeza -an- baada ya mzizi"},
        {q:"Mzizi '-saidia' - tengeneza kitenzi cha kutendesha (causative)", o:["saidiana","saidisha","saidiwa","saidia"], a:"saidisha", h:"Badilisha -ia kuwa -ish-"},
        {q:"Mzizi '-funga' - tengeneza kitenzi cha kutendua (reverse)", o:["fungana","fungisha","fungua","fungika"], a:"fungua", h:"Badilisha 'a' ya mwisho kuwa 'u'"},
        {q:"Mzizi '-cheza' - tengeneza kitenzi cha kutendeana", o:["chezana","chezisha","chezea","chezua"], a:"chezana", h:"cheza + an + a = chezana"},
        {q:"Mzizi '-okoa' - tengeneza kitenzi cha kutendesha", o:["okoana","okoesha","okolea","okoka"], a:"okoesha", h:"okoa → okoesha"}
    ];
    while(mnyambulikoData.length<15) mnyambulikoData.push(mnyambulikoData[0]);
    const mnyambulikoDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) mnyambulikoDB[l].push(mnyambulikoData[(i+l)%mnyambulikoData.length]);

    // ---------- MODE 3: NGELI U-U ----------
    const ngeliData = [
        {q:"Umoja wa neno 'umoja' (ngeli U-U) ni upi?", o:["umoja","umojo","umoj","muo"], a:"umoja", h:"Angalia muundo wa neno"},
        {q:"Wingi wa 'umoja' ni upi?", o:["umoja","maumoja","umojo","umoji"], a:"maumoja", h:"Angalia wingi wa U-U"},
        {q:"Sentensi: 'Umoja unaimarisha taifa.' Wingi wake ni upi?", o:["Maumoja yanaimarisha taifa","Umoja unaimarisha taifa","Taifa linaimarisha umoja","Watu wanaimarisha taifa"], a:"Maumoja yanaimarisha taifa", h:"Badilisha nomino kuwa wingi"},
        {q:"Ni ipi ni mfano wa ngeli U-U?", o:["umoja - maumoja","mtoto - watoto","kitabu - vitabu","nyumba - nyumba"], a:"umoja - maumoja", h:"Angalia kundi la maneno"},
        {q:"Sentensi ipi iko katika wingi?", o:["Umoja unaleta amani","Maumoja yanaleta amani","Mtoto analia","Nyumba ni nzuri"], a:"Maumoja yanaleta amani", h:"Tafuta zaidi ya mmoja"}
    ];
    while(ngeliData.length<15) ngeliData.push(ngeliData[0]);
    const ngeliDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) ngeliDB[l].push(ngeliData[(i+l)%ngeliData.length]);

    // ---------- MODE 4: DRAMA NA KUSOMA ----------
    const dramaData = [
        {s:"Pweza alicheza nafasi ya mfalme wa bahari katika mchezo wa kuigiza.", q:"Ni nini jukumu la pweza?", o:["Mfalme wa bahari","Mnyama wa nchi kavu","Ndege","Mti"], a:"Mfalme wa bahari", h:"Angalia nafasi ya uigizaji"},
        {s:"Papa alionekana kama mlinzi wa bahari katika hadithi.", q:"Papa alifanya nini?", o:["Mlinzi wa bahari","Mcheza mpira","Mkulima","Mwimbaji"], a:"Mlinzi wa bahari", h:"Angalia 'ulinzi'"},
        {s:"Samaki walicheza kama watu wa kijiji cha chini ya maji.", q:"Samaki waliwakilisha nini?", o:["Watu wa kijiji","Ndege","Miti","Nyoka"], a:"Watu wa kijiji", h:"Angalia 'kijiji'"},
        {s:"Kasa alionyesha uvumilivu katika mchezo wa kuigiza.", q:"Kasa aliwakilisha nini?", o:["Uvumilivu","Kasi","Hasira","Kelele"], a:"Uvumilivu", h:"Angalia 'polepole'"}
    ];
    while(dramaData.length<15) dramaData.push(dramaData[0]);
    const dramaDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++) for(let i=0;i<15;i++) dramaDB[l].push(dramaData[(i+l)%dramaData.length]);

    const modeBuilders = {
        insha: (lvl) => inshaDB[lvl],
        mnyambuliko: (lvl) => mnyambulikoDB[lvl],
        ngeli: (lvl) => ngeliDB[lvl],
        drama: (lvl) => dramaDB[lvl]
    };
    const modeNames = { insha:"Insha na Masimulizi", mnyambuliko:"Mnyambuliko wa Vitenzi", ngeli:"Ngeli U-U", drama:"Drama na Kusoma kwa Ufahamu" };

    let currentMode = "insha";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = Math.ceil(totalQuestions * 0.8);
    let answeringLock = false;
    let levelFinished = false;
    let gameActive = true;

    const dynamicDiv = document.getElementById('dynamicContent');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const scoreSpan = document.getElementById('scoreValue');
    const qNumSpan = document.getElementById('currentQNumber');
    const totalQSpan = document.getElementById('totalQperLevel');
    const levelCompleteDiv = document.getElementById('levelCompleteMsg');
    totalQSpan.innerText = totalQuestions;

    function updateUI() {
        scoreSpan.innerText = levelScore;
        qNumSpan.innerText = currentQIndex+1;
    }

    function checkIfLevelComplete() {
        if(levelScore >= requiredCorrect) {
            if(currentLevel === 4) {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#ffb347;">🏆 HONGERA! Umemaliza ngazi zote! Bingwa wa Kiswahili! 🏆</div>`;
                gameActive = false;
            } else {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" id="nextLevelTrigger">🎉 HONGERA! Umepita NGEAZI ${currentLevel}! Bonyeza hapa kuendelea 🎉</div>`;
                const trigger = document.getElementById('nextLevelTrigger');
                if(trigger) trigger.onclick = () => {
                    currentLevel++;
                    currentQIndex = 0;
                    levelScore = 0;
                    levelFinished = false;
                    gameActive = true;
                    levelCompleteDiv.innerHTML = "";
                    loadLevelQuestions();
                    updateUI();
                    updateLevelButtons();
                    loadCurrentQuestion();
                };
            }
        } else {
            levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#c73d23;">😔 HUKUFAULU! ${levelScore}/${requiredCorrect} sahihi. Bonyeza hapa kujaribu tena.</div>`;
            const trigger = document.getElementById('nextLevelTrigger');
            if(trigger) trigger.onclick = () => { currentQIndex=0; levelScore=0; loadLevelQuestions(); loadCurrentQuestion(); updateUI(); levelCompleteDiv.innerHTML=""; };
        }
    }

    function handleAnswer(selectedValue) {
        if(answeringLock || !gameActive || levelFinished) return;
        answeringLock = true;
        const currentItem = levelQuestions[currentQIndex];
        const isCorrect = (selectedValue === currentItem.a);
        if(isCorrect) levelScore++;
        updateUI();
        if(currentQIndex + 1 >= totalQuestions) {
            levelFinished = true;
            checkIfLevelComplete();
        } else {
            currentQIndex++;
            loadCurrentQuestion();
        }
        answeringLock = false;
    }

    function loadCurrentQuestion() {
        if(!gameActive && levelFinished) return;
        const q = levelQuestions[currentQIndex];
        let html = `<div class="question-card">`;
        html += `<div class="topic-badge">${modeNames[currentMode]}</div>`;
        if(currentMode === 'insha') html += `<div class="story-begin">📖 ${q.p}</div>`;
        else if(currentMode === 'drama') html += `<div class="story">🎭 ${q.s}</div>`;
        else if(currentMode === 'mnyambuliko') html += `<div class="verb-display">${q.q}</div>`;
        else if(currentMode === 'ngeli') html += `<div class="sentence-display">📝 ${q.q}</div>`;
        if(currentMode !== 'mnyambuliko') html += `<div class="question-text">❓ ${q.q}</div>`;
        html += `<div class="options-grid">`;
        (q.o || []).forEach((opt, idx) => {
            html += `<button class="option-btn" data-value="${opt}">${String.fromCharCode(65+idx)}. ${opt}</button>`;
        });
        html += `</div><div class="hint-box">💡 Dokezo: ${q.h}</div>`;
        html += `</div>`;
        dynamicDiv.innerHTML = html;
        updateUI();
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => handleAnswer(btn.getAttribute('data-value')));
        });
    }

    function loadLevelQuestions() {
        levelQuestions = modeBuilders[currentMode](currentLevel);
        requiredCorrect = Math.ceil(totalQuestions * 0.8);
        levelScore = 0;
        currentQIndex = 0;
        updateUI();
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn' + (i===currentLevel ? ' active' : '');
            btn.innerText = `Ngazi ${i}`;
            btn.onclick = () => {
                if(i === currentLevel) return;
                currentLevel = i;
                currentQIndex = 0;
                levelScore = 0;
                levelFinished = false;
                gameActive = true;
                levelCompleteDiv.innerHTML = "";
                loadLevelQuestions();
                loadCurrentQuestion();
                updateLevelButtons();
            };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchMode(mode) {
        if(mode === currentMode) return;
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        levelFinished = false;
        gameActive = true;
        levelCompleteDiv.innerHTML = "";
        loadLevelQuestions();
        updateLevelButtons();
        loadCurrentQuestion();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabInsha').addEventListener('click', () => switchMode('insha'));
    document.getElementById('TabMnyambuliko').addEventListener('click', () => switchMode('mnyambuliko'));
    document.getElementById('TabNgeli').addEventListener('click', () => switchMode('ngeli'));
    document.getElementById('TabDrama').addEventListener('click', () => switchMode('drama'));

    loadLevelQuestions();
    updateLevelButtons();
    loadCurrentQuestion();
</script>
</body>
</html>
