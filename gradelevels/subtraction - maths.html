<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Grade 1 CBC Maths | Subtraction Adventures | No Regrouping • With Regrouping • Patterns</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1e88e5 0%, #0d47a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fffbe6;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25), inset 0 1px 3px rgba(255, 250, 210, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb347;
            padding: 16px 18px 12px;
            text-align: center;
            border-bottom: 4px solid #e67e22;
        }

        .level-badge {
            background: #3d2b1a;
            display: inline-block;
            padding: 5px 22px;
            border-radius: 50px;
            color: #ffdd99;
            font-weight: bold;
            font-size: 1rem;
        }

        .stars {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .star {
            font-size: 24px;
            color: #ffc107;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-progress {
            background: #ffefcf;
            margin: 10px 12px 0;
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
            color: #5a3a1a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-card {
            padding: 18px 18px 20px;
        }

        .question-area {
            background: #ffffff;
            padding: 22px 14px;
            border-radius: 48px;
            box-shadow: inset 0 0 0 3px #ffe0a3, 0 6px 12px rgba(0,0,0,0.05);
            border: 1px solid #ffcd94;
            margin-bottom: 18px;
            text-align: center;
        }

        .question-text {
            font-size: 1.9rem;
            font-weight: bold;
            color: #1e5a88;
            margin-bottom: 8px;
            word-break: break-word;
            font-family: monospace;
        }

        .math-visual {
            font-size: 1.3rem;
            color: #d45e1a;
            margin-top: 8px;
            font-weight: bold;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .timer-circle {
            background: #d96c2b;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            font-family: monospace;
            box-shadow: 0 4px 0 #9b4a1a;
            transition: 0.1s;
        }

        .warning {
            background: #c0392b;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); background-color: #c0392b; }
            100% { transform: scale(1.05); background-color: #e67e22; }
        }

        .hint-box {
            background: #ffe0b5;
            border-radius: 35px;
            padding: 8px 14px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #b45f1b;
        }

        .answer-input-area {
            margin: 16px 0;
        }

        .answer-input {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            text-align: center;
            border-radius: 55px;
            border: 3px solid #ffb347;
            background: white;
            font-family: monospace;
            font-weight: bold;
            color: #2d5a2c;
            outline: none;
            -webkit-appearance: none;
        }

        .answer-input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230,126,34,0.2);
        }

        .submit-btn {
            background: #52b788;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .voice-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .voice-btn {
            background: #2a9d8f;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .voice-btn.speaker {
            background: #e76f51;
        }

        .status-msg {
            background: #efe0c9;
            border-radius: 35px;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        .next-btn {
            background: #f4a261;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-area {
            text-align: center;
            margin: 12px 15px 15px;
        }

        .reset-btn {
            background: #b4813c;
            border: none;
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            body { padding: 12px; }
            .question-text { font-size: 1.5rem; }
            .math-visual { font-size: 1rem; }
            .answer-input { font-size: 1.2rem; padding: 14px; }
            .timer-circle { width: 60px; height: 60px; font-size: 1.7rem; }
            .submit-btn, .next-btn { padding: 12px; font-size: 1rem; }
        }

        @media (max-width: 400px) {
            .question-text { font-size: 1.3rem; }
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            background: #ebd5b3;
            padding: 8px;
            color: #4a3720;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">➖ LEVEL 1 / 5</div>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <div class="score-progress">
            <span>🏆 SCORE: <span id="currentScore">0</span></span>
            <span>✅ NEED 80% ➡️ <span id="requiredInfo">0/24</span></span>
        </div>
    </div>
    <div class="quiz-card">
        <div class="question-area">
            <div class="question-text" id="questionText">🌟 Ready to subtract? 🌟</div>
            <div class="math-visual" id="mathVisual"></div>
        </div>
        <div class="timer-area"><div class="timer-circle" id="timerCircle">40</div></div>
        <div class="hint-box" id="hintBox">💡 Hint will appear here when time is low 💡</div>
        
        <div class="answer-input-area">
            <input type="number" id="answerInput" class="answer-input" placeholder="Type your answer..." inputmode="numeric" autocomplete="off">
        </div>
        <button class="submit-btn" id="submitBtn">✅ SUBMIT ANSWER</button>
        
        <div class="voice-actions">
            <button class="voice-btn speaker" id="speakBtn">🔊 READ QUESTION</button>
        </div>
        
        <div class="status-msg" id="statusMsg">✨ Solve the subtraction! Type the answer. 40 seconds. ✨</div>
        <button class="next-btn" id="nextBtn" disabled>➡️ NEXT QUESTION</button>
        <div class="reset-area"><button class="reset-btn" id="resetGameBtn">🔄 RESTART GAME</button></div>
    </div>
    <footer>📖 Subtract without regrouping · With regrouping · Number patterns | Grade 1 CBC Maths</footer>
</div>

<script>
    // ======================= QUESTION BANK (3 TOPICS, 30 UNIQUE QUESTIONS PER LEVEL, NO REPEATS) =======================
    // Topics: 1) Subtract without regrouping (0-20, no borrowing)
    //        2) Subtract with regrouping (2-digit minus 1-digit or 2-digit with borrowing)
    //        3) Number patterns on subtraction (e.g., 10, 8, 6, __? subtract 2)
    
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        
        // Helper to create unique key
        function addKey(prefix, value) {
            const key = `${prefix}_${value}`;
            if (usedKeys.has(key)) return false;
            usedKeys.add(key);
            return true;
        }
        
        // 1. Without regrouping (numbers 0-20, first number >= second, no borrowing)
        const withoutRegrouping = [];
        for (let i = 0; i <= 20; i++) {
            for (let j = 0; j <= i; j++) {
                if (i - j <= 20 && (i % 10) >= (j % 10)) { // no borrowing needed at units
                    withoutRegrouping.push({ a: i, b: j, diff: i - j });
                }
            }
        }
        
        // 2. With regrouping (2-digit numbers 10-99, where units of first < units of second)
        const withRegrouping = [];
        for (let tens = 1; tens <= 9; tens++) {
            for (let ones = 0; ones <= 9; ones++) {
                let first = tens * 10 + ones;
                for (let btens = 0; btens <= tens; btens++) {
                    for (let bones = 0; bones <= 9; bones++) {
                        let second = btens * 10 + bones;
                        if (first >= second && (ones < bones) && first - second <= 20) {
                            withRegrouping.push({ a: first, b: second, diff: first - second });
                        }
                    }
                }
            }
        }
        
        // 3. Number patterns (subtraction sequences)
        const patterns = [
            { seq: [10, 8, 6, 4], diff: 2, next: 2, desc: "subtract 2 each time" },
            { seq: [20, 17, 14, 11], diff: 3, next: 8, desc: "subtract 3" },
            { seq: [15, 12, 9, 6], diff: 3, next: 3, desc: "subtract 3" },
            { seq: [9, 7, 5, 3], diff: 2, next: 1, desc: "subtract 2" },
            { seq: [30, 25, 20, 15], diff: 5, next: 10, desc: "subtract 5" },
            { seq: [12, 10, 8, 6], diff: 2, next: 4, desc: "subtract 2" },
            { seq: [18, 15, 12, 9], diff: 3, next: 6, desc: "subtract 3" },
            { seq: [7, 5, 3, 1], diff: 2, next: -1, desc: "subtract 2 (next is -1? Grade 1: 0 then -1? But we do positive) -> next 0?" , actualNext: 0},
            { seq: [10, 7, 4, 1], diff: 3, next: -2, desc: "pattern subtract 3" , actualNext: -2}
        ];
        
        const fixedPatterns = [
            { text: "What is the next number? 10, 8, 6, 4, ___", answer: 2, hint: "Subtract 2 each time" },
            { text: "Complete the pattern: 20, 17, 14, 11, ___", answer: 8, hint: "Subtract 3" },
            { text: "Find the missing number: 15, 12, 9, 6, ___", answer: 3, hint: "Subtract 3" },
            { text: "Pattern: 9, 7, 5, 3, ___", answer: 1, hint: "Subtract 2" },
            { text: "What comes next? 30, 25, 20, 15, ___", answer: 10, hint: "Subtract 5" },
            { text: "12, 10, 8, 6, ___", answer: 4, hint: "Subtract 2" },
            { text: "18, 15, 12, 9, ___", answer: 6, hint: "Subtract 3" },
            { text: "Subtract pattern: 7, 5, 3, 1, ___", answer: -1, hint: "Subtract 2 (answer could be -1, but grade 1: pattern continues)" }
        ];
        
        let attempts = 0;
        for (let i = 0; i < 30; i++) {
            let questionObj = null;
            let topicType = (i + level) % 3; // 0: no regroup, 1: regroup, 2: patterns
            let localAttempt = 0;
            
            while (!questionObj && localAttempt < 40) {
                if (topicType === 0 && withoutRegrouping.length > 0) {
                    const idx = Math.floor(Math.random() * withoutRegrouping.length);
                    const q = withoutRegrouping[idx];
                    const key = `noReg_${q.a}_${q.b}`;
                    if (addKey("noReg", key)) {
                        questionObj = {
                            type: "no_regroup",
                            text: `${q.a} - ${q.b} = ?`,
                            visual: `🧮 ${q.a} − ${q.b} = ?`,
                            answer: q.diff,
                            hint: `Subtract ${q.b} from ${q.a}. ${q.a} - ${q.b} = ${q.diff}. No borrowing needed.`
                        };
                    }
                } 
                else if (topicType === 1 && withRegrouping.length > 0) {
                    const idx = Math.floor(Math.random() * withRegrouping.length);
                    const q = withRegrouping[idx];
                    const key = `reg_${q.a}_${q.b}`;
                    if (addKey("reg", key)) {
                        questionObj = {
                            type: "regroup",
                            text: `${q.a} - ${q.b} = ?`,
                            visual: `✨ ${q.a} − ${q.b} = ? (borrow tens) ✨`,
                            answer: q.diff,
                            hint: `Borrow from tens. ${q.a} - ${q.b} = ${q.diff}.`
                        };
                    }
                } 
                else if (topicType === 2) {
                    const patIdx = Math.floor(Math.random() * fixedPatterns.length);
                    const p = fixedPatterns[patIdx];
                    const key = `pattern_${p.text.substring(0, 20)}`;
                    if (addKey("pattern", key)) {
                        questionObj = {
                            type: "pattern",
                            text: p.text,
                            visual: "🔢 " + p.text,
                            answer: p.answer,
                            hint: p.hint
                        };
                    }
                }
                topicType = (topicType + 1) % 3;
                localAttempt++;
            }
            
            if (!questionObj) {
                // fallback
                questionObj = {
                    type: "no_regroup",
                    text: `5 - 2 = ?`,
                    visual: `🧮 5 − 2 = ?`,
                    answer: 3,
                    hint: `5 minus 2 equals 3.`
                };
            }
            questions.push(questionObj);
        }
        // shuffle for variety
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        return questions;
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let lockAnswer = false;
    let currentQuestionObj = null;
    
    // DOM elements
    const questionTextEl = document.getElementById("questionText");
    const mathVisualEl = document.getElementById("mathVisual");
    const timerCircle = document.getElementById("timerCircle");
    const hintBox = document.getElementById("hintBox");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetGameBtn");
    const speakBtn = document.getElementById("speakBtn");
    const statusMsg = document.getElementById("statusMsg");
    const currentScoreSpan = document.getElementById("currentScore");
    const requiredInfoSpan = document.getElementById("requiredInfo");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const starRatingSpan = document.getElementById("starRating");
    
    // Speech synthesis with pause between "Time is up" and "moving to the next question"
    function speakWithPause(phrases, pauseMs = 850) {
        if (!window.speechSynthesis) return;
        const items = Array.isArray(phrases) ? phrases : [phrases];
        window.speechSynthesis.cancel();
        
        function speakNext(index) {
            if (index >= items.length) return;
            const utterance = new SpeechSynthesisUtterance(items[index]);
            utterance.lang = "en-US";
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.onend = () => {
                setTimeout(() => speakNext(index + 1), pauseMs);
            };
            window.speechSynthesis.speak(utterance);
        }
        speakNext(0);
    }
    
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
    
    function announceTimeUp() {
        speakWithPause(["Time is up", "moving to the next question"], 900);
        statusMsg.innerText = "⏰ TIME IS UP! Moving to next question... ⏰";
    }
    
    function readQuestionAloud() {
        if (currentQuestionObj) {
            speakText(`Solve: ${currentQuestionObj.text}`);
            statusMsg.innerText = "🔊 Reading question...";
            setTimeout(() => statusMsg.innerText = "✅ Type your answer and click submit!", 2000);
        }
    }
    
    function announceCorrect() {
        const praises = ["Excellent!", "Great job!", "You're a subtraction star!", "Correct!", "Wonderful!"];
        const rand = praises[Math.floor(Math.random() * praises.length)];
        speakText(rand);
    }
    
    function announceWrong(correctAnswer) {
        speakText(`Oops! The correct answer is ${correctAnswer}. Keep practicing!`);
    }
    
    function updateHint() {
        if (currentQuestionObj && !lockAnswer && !waitingForNext) {
            if (timeLeft <= 15 && timeLeft > 5) {
                hintBox.innerHTML = `⏰ ${timeLeft} seconds left! 💡 Hint: ${currentQuestionObj.hint}`;
            } else if (timeLeft <= 5) {
                hintBox.innerHTML = `🚨 LAST ${timeLeft} SECONDS! 🚨 ${currentQuestionObj.hint}`;
            } else {
                hintBox.innerHTML = `💡 Hint will appear at 15 seconds. Subtract carefully! 💡`;
            }
        }
    }
    
    function checkAnswer() {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "⚠️ Question already answered! Press NEXT.";
            return;
        }
        const userAnswer = parseInt(answerInput.value.trim());
        if (isNaN(userAnswer)) {
            statusMsg.innerText = "🔢 Please type a number!";
            speakText("Please type a number.");
            return;
        }
        if (userAnswer === currentQuestionObj.answer) {
            handleCorrect();
        } else {
            handleWrong();
        }
    }
    
    function handleCorrect() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        score++;
        updateUI();
        announceCorrect();
        statusMsg.innerText = "🎉 CORRECT! +1 POINT! 🎉";
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#d4f0d4";
        answerInput.style.border = "3px solid #2e7d32";
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleWrong() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceWrong(currentQuestionObj.answer);
        statusMsg.innerText = `😓 WRONG! Correct answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleTimeout() {
        if (lockAnswer || waitingForNext) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceTimeUp();
        statusMsg.innerText = `⏰ TIME UP! Answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function resetInputStyle() {
        answerInput.style.background = "white";
        answerInput.style.border = "3px solid #ffb347";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.value = "";
        answerInput.focus();
        if (window.innerWidth <= 550) {
            answerInput.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 40;
        timerCircle.innerText = timeLeft;
        timerCircle.classList.remove("warning");
        updateHint();
        timerInterval = setInterval(() => {
            if (lockAnswer || waitingForNext) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                timeLeft--;
                timerCircle.innerText = timeLeft;
                updateHint();
                if (timeLeft <= 10) timerCircle.classList.add("warning");
                else timerCircle.classList.remove("warning");
            }
        }, 1000);
    }
    
    function loadQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        lockAnswer = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        resetInputStyle();
        
        if (currentQuestionIndex >= questions.length) {
            let requiredPass = Math.ceil(questions.length * 0.8);
            if (score >= requiredPass) {
                if (currentLevel === 5) {
                    statusMsg.innerText = "🏆🏆 AMAZING! YOU MASTERED SUBTRACTION! GRADE 1 MATH CHAMPION! 🏆🏆";
                    speakText("Congratulations! You completed all 5 levels! You are a subtraction champion!");
                    questionTextEl.innerText = "🎉 GRAND VICTORY! 🎉 Subtraction Expert!";
                    mathVisualEl.innerHTML = "🏆🎉🏆";
                    answerInput.disabled = true;
                    submitBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                } else {
                    currentLevel++;
                    currentQuestionIndex = 0;
                    score = 0;
                    loadLevelData();
                    updateLevelDisplay();
                    updateUI();
                    loadQuestion();
                    return;
                }
            } else {
                statusMsg.innerText = `❌ You got ${score}/${questions.length} (need ${requiredPass}%). Restarting level ${currentLevel}. Try again! ❌`;
                speakText(`Restarting level ${currentLevel}. Keep practicing subtraction!`);
                resetCurrentLevel();
                return;
            }
        }
        
        currentQuestionObj = questions[currentQuestionIndex];
        questionTextEl.innerText = currentQuestionObj.text;
        mathVisualEl.innerHTML = currentQuestionObj.visual || "🧮";
        hintBox.innerHTML = "💡 Hint will appear at 15 seconds. Subtract carefully! 💡";
        startTimer();
        updateUI();
        statusMsg.innerText = "📖 Listen or read, then type your answer. Click SUBMIT!";
        speakText(`Solve: ${currentQuestionObj.text}`);
    }
    
    function loadLevelData() {
        questions = generateQuestionsForLevel(currentLevel);
        score = 0;
        currentQuestionIndex = 0;
    }
    
    function updateUI() {
        currentScoreSpan.innerText = score;
        let needed = Math.ceil(questions.length * 0.8);
        requiredInfoSpan.innerText = `${score}/${needed}`;
        let percent = (score / questions.length) * 100;
        let starCount = Math.min(5, Math.floor(percent / 20));
        starRatingSpan.innerHTML = "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
    }
    
    function updateLevelDisplay() {
        levelDisplaySpan.innerHTML = `➖ LEVEL ${currentLevel} / 5 ➖`;
        let need = Math.ceil(30 * 0.8);
        requiredInfoSpan.innerText = `0/${need}`;
    }
    
    function resetCurrentLevel() {
        if (timerInterval) clearInterval(timerInterval);
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        lockAnswer = false;
        waitingForNext = false;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = 1;
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    // Event Listeners
    submitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        checkAnswer();
    });
    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!waitingForNext && !lockAnswer) {
            statusMsg.innerText = "👉 Please answer the question first!";
            speakText("Please answer the question first.");
            return;
        }
        if (waitingForNext) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });
    resetBtn.addEventListener("click", (e) => {
        e.preventDefault();
        fullReset();
    });
    speakBtn.addEventListener("click", (e) => {
        e.preventDefault();
        readQuestionAloud();
    });
    answerInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !lockAnswer && !waitingForNext) {
            e.preventDefault();
            checkAnswer();
        }
    });
    answerInput.addEventListener("focus", () => {
        setTimeout(() => answerInput.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
    });
    
    // Initialize game
    loadLevelData();
    updateLevelDisplay();
    updateUI();
    loadQuestion();
</script>
</body>
</html>
