<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Talia na Nyani - Darasa la 2 CBC | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a6b3c 0%, #0e4d2a 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #1a6b3c;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
        }

        /* Multiple Choice Options */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #f0e6d2;
            border: 3px solid #c8b27a;
            border-radius: 60px;
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            color: #2c4727;
            cursor: pointer;
            transition: all 0.1s;
            min-width: 120px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .option-btn:hover:not(:disabled) {
            background: #ffecb3;
            transform: scale(1.02);
            border-color: #f3a712;
        }

        .option-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .voice-btn {
            background: #5a4a8c;
            border: none;
            padding: 12px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 0 #3a2a5c;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #3a2a5c;
        }

        .voice-btn.listening {
            background: #e63946;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); background: #c1121f; }
            100% { transform: scale(1); }
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check, .voice-btn { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
            .option-btn { padding: 8px 12px; font-size: 1rem; min-width: 90px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🐒📖 Talia na Nyani - Darasa la 2! Jifunze kusikiliza, kuzungumza, kusoma na kuandika.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        
        <!-- Multiple Choice Options -->
        <div class="options-container" id="optionsContainer">
            <button class="option-btn" data-opt="0">-</button>
            <button class="option-btn" data-opt="1">-</button>
            <button class="option-btn" data-opt="2">-</button>
            <button class="option-btn" data-opt="3">-</button>
        </div>
        
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa au tumia sauti..." autocomplete="off">
            <button class="voice-btn" id="voiceBtn">🎤 Sema Jibu</button>
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Talia na Nyani watakusaidia! Bonyeza chaguo au andika jibu. Bonyeza kitufe cha sauti kuzungumza.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- SAUTI KWA KISWAHILI ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa. Swali linalofuata linakuja.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakKiswahili(qData.text);
        else speakKiswahili("Hakuna swali kwa sasa.");
    }

    // ---------- MASWALI YA DARASA LA 2: Kusikiliza, Kuzungumza, Kusoma, Kuandika ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        const kusikiliza = [
            { q: "Tunaposikiliza hadithi, tunapaswa kuwa ______ ili kuelewa vizuri.", a: "makini", options: ["makini", "kelele", "usingizi", "hasira"] },
            { q: "Kusikiliza kwa umakini kunatusaidia kukumbuka ______ muhimu.", a: "mambo", options: ["fujo", "mambo", "ngoma", "chakula"] },
            { q: "Talia alimsikiliza nyani akielezea ______ yake msituni.", a: "maisha", options: ["maisha", "ndoto", "magari", "vitabu"] },
            { q: "Mwalimu anaposoma hadithi, wanafunzi wanapaswa kusikiliza bila ______.", a: "kelele", options: ["furaha", "kelele", "nyimbo", "macho"] },
            { q: "Kusikiliza kwa makini ni alama ya ______ na heshima.", a: "adabu", options: ["uchafu", "adabu", "uzembe", "hasira"] },
            { q: "Talia alisikiliza hadithi ya ______ aliyepotea msituni.", a: "mtoto", options: ["ndege", "mtoto", "gari", "nyumba"] },
            { q: "Nyani alijifunza mambo mengi kwa kumsikiliza ______ wake.", a: "rafiki", options: ["adui", "rafiki", "mgeni", "mwalimu"] },
            { q: "Tunapaswa kusikiliza ili tuweze kujibu ______ kwa usahihi.", a: "maswali", options: ["vitani", "maswali", "ngoma", "chakula"] },
            { q: "Kusikiliza ni sehemu muhimu ya ______ bora.", a: "mawasiliano", options: ["mapigano", "mawasiliano", "usafiri", "uchezaji"] },
            { q: "Nyani alisikiliza sauti ya ______ akimwita kwa jina.", a: "talia", options: ["simba", "talia", "nyoka", "ndege"] }
        ];
        
        const kuzungumza = [
            { q: "Tunapozungumza na wazee, tunapaswa kutumia lugha ya ______.", a: "heshima", options: ["fujo", "heshima", "kelele", "hasira"] },
            { q: "Talia alimwuliza nyani, 'Una ______ gani unayopenda kula?'", a: "matunda", options: ["magari", "matunda", "nyumba", "vitabu"] },
            { q: "Nyani alijibu kwa upole, 'Ninapenda ______ na ndizi.'", a: "embe", options: ["chungwa", "embe", "nanasi", "papai"] },
            { q: "Kuzungumza kwa sauti ______ ni jambo la adabu.", a: "laini", options: ["kubwa", "laini", "kali", "ngumu"] },
            { q: "Talia alimweleza nyani kuhusu ______ yake shuleni.", a: "maisha", options: ["ndoto", "maisha", "magari", "ngoma"] },
            { q: "Tunapaswa kuzungumza kwa ______ ili wengine watuelewe.", a: "ungama", options: ["haraka", "ungama", "kelele", "fujo"] },
            { q: "Nyani aliuliza, 'Ninaweza ______ pamoja na wewe?'", a: "kucheza", options: ["kuimba", "kucheza", "kusoma", "kuandika"] },
            { q: "Kuzungumza kwa ukweli kunajenga ______ kati ya watu.", a: "uaminifu", options: ["uadui", "uaminifu", "chuki", "hasira"] },
            { q: "Talia alisema, 'Ni vizuri kuzungumza kwa ______.'", a: "upole", options: ["hasira", "upole", "kelele", "fujo"] },
            { q: "Tunapaswa kuzungumza kwa ______ na kuheshimu maoni ya wengine.", a: "staha", options: ["staha", "uzembe", "hasira", "fujo"] }
        ];
        
        const kusoma = [
            { q: "Talia anapenda kusoma ______ za hadithi za wanyama.", a: "vitabu", options: ["majani", "vitabu", "magari", "nyumba"] },
            { q: "Nyani alimwomba Talia amsomee ______ juu ya nyani wengine.", a: "hadithi", options: ["ngoma", "hadithi", "chakula", "mchezo"] },
            { q: "Kusoma kunatusaidia kupata ______ na maarifa mapya.", a: "elimu", options: ["elimu", "fujo", "hasira", "uzembe"] },
            { q: "Talia alisoma hadithi ya 'Nyani na ______' kutoka kwenye kitabu.", a: "kobe", options: ["simba", "kobe", "nyoka", "ndege"] },
            { q: "Kusoma kwa sauti kunaitwa ______ kwa sauti.", a: "kusoma", options: ["kuimba", "kusoma", "kucheka", "kulia"] },
            { q: "Nyani alijifunza herufi mpya kwa kusoma ______ za Talia.", a: "barua", options: ["nyimbo", "barua", "ngoma", "mchezo"] },
            { q: "Vitabu vina picha na ______ zinazotusaidia kuelewa hadithi.", a: "maneno", options: ["maneno", "nyimbo", "ngoma", "mchezo"] },
            { q: "Talia alimtia moyo nyani kusoma ______ kila siku.", a: "kitabu", options: ["gari", "kitabu", "nyumba", "mchezo"] },
            { q: "Kusoma kunatuwezesha kujua ______ za watu wengine.", a: "hadithi", options: ["ngoma", "hadithi", "chakula", "mchezo"] },
            { q: "Nyani alifurahi alipojifunza kusoma ______ lake kwa usahihi.", a: "jina", options: ["jina", "gari", "nyumba", "mchezo"] }
        ];
        
        const kuandika = [
            { q: "Talia aliandika barua kwa ______ wake akimwalika kwenye sherehe.", a: "rafiki", options: ["adui", "rafiki", "mgeni", "mwalimu"] },
            { q: "Nyani alijaribu kuandika kwa kalamu na ______ nyeupe.", a: "karatasi", options: ["kitabu", "karatasi", "meza", "mti"] },
            { q: "Kuandika sentensi kamili ni ishara ya ujuzi wa ______.", a: "lugha", options: ["lugha", "hesabu", "sayansi", "historia"] },
            { q: "Talia alimfundisha nyani jinsi ya kuandika herufi '______' na 'B'.", a: "a", options: ["a", "b", "c", "d"] },
            { q: "Nyani aliandika orodha ya ______ anayopenda kula.", a: "matunda", options: ["magari", "matunda", "nyumba", "vitabu"] },
            { q: "Kuandika kwa ______ na usafi ni jambo la kuvutia.", a: "maridadi", options: ["maridadi", "fujo", "haraka", "uzembe"] },
            { q: "Talia aliandika insha fupi kuhusu ______ wake na nyani.", a: "safari", options: ["safari", "ndoto", "chakula", "mchezo"] },
            { q: "Nyani alijifunza kuandika namba ______ kwa usahihi.", a: "moja", options: ["moja", "mbili", "tatu", "nne"] },
            { q: "Talia alimshauri nyani kuandika kila ______ ili kuboresha uandishi.", a: "siku", options: ["wiki", "siku", "mwezi", "mwaka"] },
            { q: "Kuandika kunatusaidia kukumbuka na kuhifadhi ______ muhimu.", a: "habari", options: ["habari", "ngoma", "chakula", "mchezo"] }
        ];
        
        const allTopics = [...kusikiliza, ...kuzungumza, ...kusoma, ...kuandika];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            questions.push({ 
                text: item.q, 
                answer: item.a.toLowerCase(),
                options: item.options 
            });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    // Speech Recognition
    let recognition = null;
    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'sw-KE';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('answerInput').value = transcript;
            speakKiswahili("Umesema: " + transcript);
            document.getElementById('voiceBtn').classList.remove('listening');
        };
        
        recognition.onerror = function(event) {
            console.error('Speech recognition error', event.error);
            speakKiswahili("Samahani, sikusikia vizuri. Tafadhali jaribu tena.");
            document.getElementById('voiceBtn').classList.remove('listening');
        };
        
        recognition.onend = function() {
            document.getElementById('voiceBtn').classList.remove('listening');
        };
    }
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const optionsContainer = document.getElementById('optionsContainer');
    let optionButtons = [];
    
    function updateOptions() {
        const qData = currentQuestions[currentQuestionIndex];
        if (qData && qData.options) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                if (idx < qData.options.length) {
                    btn.textContent = qData.options[idx];
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            });
        }
    }
    
    function handleOptionClick(selectedValue) {
        if (!allowAnswer) return;
        answerInput.value = selectedValue;
        checkAnswer();
    }
    
    function startVoiceInput() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa.");
            return;
        }
        if (recognition) {
            recognition.start();
            voiceBtn.classList.add('listening');
            speakKiswahili("Sema jibu lako sasa...");
        } else {
            speakKiswahili("Samahani, kifaa chako hakina uwezo wa kutambua sauti.");
        }
    }
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Tunasonga kwenye swali linalofuata.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako au bonyeza chaguo! Bonyeza kitufe cha sauti kusikia swali.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        voiceBtn.disabled = false;
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = false);
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateOptions();
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Kusikiliza kwa makini! Jifunze kutumia masikio kusikiliza hadithi za Talia na Nyani.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Kuzungumza kwa heshima! Jifunze kuongea kwa upole na adabu.";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Kusoma kwa ufasaha! Soma hadithi fupi na uelewe mambo muhimu.";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Kuandika sentensi! Andika sentensi kamili kwa usahihi na maridadi.";
        else levelDesc = "Ngazi 5: Ngazi ya mwisho! Kuwa Bingwa wa Kiswahili Darasa la 2!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele. ⏱️ 40s/swali.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        voiceBtn.disabled = true;
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5 za Darasa la 2! Talia na Nyani wanakupa Tuzo ya Kiswahili! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza ngazi zote tano za Darasa la Pili. Wewe ni bingwa wa kusikiliza, kuzungumza, kusoma na kuandika! Endelea kujifunza Kiswahili!");
                storyAreaDiv.innerHTML = "🏁 MCHEZO UMEMALIZIKA! Talia na Nyani wanajivunia wewe! Sasa una ujuzi wa kusikiliza, kuzungumza, kusoma na kuandika kwa Kiswahili cha Darasa la 2! 🐒📖✨";
                nextLevelMsgDiv.innerHTML = "✨ UMESHINDA! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel} ya Darasa la Pili. Sasa unaenda ngazi ${currentLevel+1}. Endelea kujifunza Kiswahili na Talia na Nyani!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukufika 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu Ngazi ${currentLevel} tena.`;
            speakKiswahili(`Pole! Unahitaji angalau asilimia themanini kupita katika Darasa la Pili. Una alama ${scoreCorrect} kati ya ${totalQuestionsInLevel}. Tafadhali jaribu ngazi ${currentLevel} tena.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        voiceBtn.disabled = false;
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = false);
        feedbackMsgDiv.innerHTML = "🎤 Talia na Nyani wanakusubiri! Bonyeza chaguo au andika jibu. Bonyeza kitufe cha sauti kuzungumza.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateOptions();
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu au bonyeza chaguo! Talia na Nyani wanakungoja.";
            speakKiswahili("Tafadhali andika jibu au chagua jibu kutoka kwenye chaguzi.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        if (!isCorrect && currentQ.options) {
            for (let opt of currentQ.options) {
                if (opt.toLowerCase() === normalizedUser) {
                    isCorrect = (opt.toLowerCase() === normalizedCorrect);
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri kwa Darasa la 2! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama! Talia na Nyani wanafurahi!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi ni: "${currentQ.answer}". Endelea kujifunza Kiswahili cha Darasa la 2 na Talia na Nyani! ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Usikate tamaa! Nyani anakuunga mkono!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        voiceBtn.disabled = true;
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        moveToNextQuestionAfterDelay();
    }
    
    // Event listeners
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    voiceBtn.addEventListener('click', startVoiceInput);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    // Create option buttons dynamically
    const optionsDiv = document.getElementById('optionsContainer');
    for (let i = 0; i < 4; i++) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.setAttribute('data-opt', i);
        btn.addEventListener('click', () => {
            if (allowAnswer && btn.textContent !== '-') {
                handleOptionClick(btn.textContent);
            }
        });
        optionsDiv.appendChild(btn);
    }
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa Talia na Nyani wa Darasa la Pili! Unaweza kuchagua jibu kutoka kwenye chaguzi, kuandika jibu, au kutumia sauti kuzungumza jibu. Una sekunde arobaini kwa kila swali. Bonyeza kitufe cha sauti kusikia swali. Twende kujifunza pamoja!");
        }, 500);
    });
</script>
</body>
</html>
