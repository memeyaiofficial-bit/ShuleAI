<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PP2 Star Scholar Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#243047;
  --purple:#a78bfa;--purple2:#7c3aed;
  --green:#34d399;--green2:#059669;
  --yellow:#fbbf24;--yellow2:#d97706;
  --red:#f87171;--red2:#dc2626;
  --blue:#60a5fa;--blue2:#2563eb;
  --pink:#f472b6;--pink2:#db2777;
  --orange:#fb923c;--orange2:#ea580c;
  --teal:#2dd4bf;--teal2:#0d9488;
  --white:#f1f5f9;--muted:#94a3b8;
  --r:16px;--r2:12px;
}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--white);overflow-x:hidden}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;outline:none}

body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.3) 0%,transparent 100%),
  radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.2) 0%,transparent 100%),
  radial-gradient(1px 1px at 50% 70%,rgba(255,255,255,0.25) 0%,transparent 100%),
  radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,0.15) 0%,transparent 100%),
  radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,0.2) 0%,transparent 100%);
  pointer-events:none;z-index:0}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}

.screen{display:none;width:100%;max-width:480px;animation:fadeIn .35s ease}
.screen.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes confetti{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.logo-area{text-align:center;padding:24px 0 16px;width:100%}
.logo-star{font-size:72px;animation:bounce 2s ease-in-out infinite;display:block;line-height:1}
.logo-title{font-family:'Fredoka One',cursive;font-size:clamp(28px,8vw,40px);background:linear-gradient(135deg,var(--yellow),var(--orange),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0 4px}
.logo-sub{font-size:14px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

.student-form{width:100%;background:var(--card);border-radius:var(--r);padding:20px;margin:12px 0}
.form-label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.form-input{width:100%;background:var(--card2);border:2px solid rgba(255,255,255,0.08);border-radius:var(--r2);padding:12px 16px;color:var(--white);font-size:16px;font-family:'Nunito',sans-serif;transition:.2s}
.form-input:focus{border-color:var(--purple);outline:none}

.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin:10px 0}
.subj-btn{background:var(--card2);border:2px solid transparent;border-radius:var(--r2);padding:14px 10px;text-align:center;cursor:pointer;transition:.2s;color:var(--white)}
.subj-btn:hover{transform:scale(1.03)}
.subj-btn.selected{border-color:var(--color, var(--purple));background:rgba(167,139,250,.15)}
.subj-btn.selected .subj-icon{animation:pop .3s ease}
.subj-icon{font-size:30px;display:block;margin-bottom:6px}
.subj-name{font-size:12px;font-weight:700;letter-spacing:.3px}

.play-btn{width:100%;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#1a1a1a;border-radius:var(--r);padding:18px;font-size:18px;font-weight:800;font-family:'Fredoka One',cursive;letter-spacing:1px;transition:.2s;margin-top:10px}
.play-btn:hover{transform:scale(1.02);filter:brightness(1.05)}
.play-btn:active{transform:scale(0.98)}
.play-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.hud{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:8px}
.hud-score{font-family:'Fredoka One',cursive;font-size:22px;color:var(--yellow);min-width:80px}
.hud-score span{font-size:12px;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:600;display:block}
.hud-lives{display:flex;gap:4px}
.heart{font-size:20px;transition:.3s}
.heart.lost{opacity:.2;filter:grayscale(1)}
.hud-streak{background:rgba(251,191,36,.1);border:1.5px solid rgba(251,191,36,.3);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--yellow)}

.timer-wrap{width:100%;max-width:480px;background:rgba(255,255,255,.08);border-radius:20px;height:8px;margin:4px 0 10px;overflow:hidden}
.timer-bar{height:100%;border-radius:20px;transition:width .1s linear,background .5s;background:var(--green)}
.timer-bar.warn{background:var(--yellow)}
.timer-bar.danger{background:var(--red);animation:pulse .5s ease infinite}

.q-card{width:100%;background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:12px;border:2px solid rgba(255,255,255,.05)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.q-subj-badge{font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.q-num{font-size:12px;color:var(--muted);font-weight:600;margin-left:auto}
.q-text{font-size:clamp(16px,4.5vw,19px);font-weight:700;line-height:1.5;color:var(--white)}
.q-img{width:100%;border-radius:var(--r2);margin-top:12px;max-height:160px;object-fit:cover}

.options-grid{width:100%;display:flex;flex-direction:column;gap:9px}
.opt-btn{background:var(--card2);border:2px solid rgba(255,255,255,.08);border-radius:var(--r2);padding:14px 16px;text-align:left;color:var(--white);font-size:15px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:12px}
.opt-btn:hover:not(:disabled){background:rgba(167,139,250,.12);border-color:var(--purple);transform:translateX(4px)}
.opt-btn:disabled{cursor:default}
.opt-btn.correct{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.opt-btn.wrong{background:rgba(248,113,113,.12);border-color:var(--red);color:var(--red);animation:shake .4s ease}
.opt-letter{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.opt-btn.correct .opt-letter{background:var(--green);color:#063}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff}

.feedback{width:100%;text-align:center;padding:12px;border-radius:var(--r2);font-size:15px;font-weight:700;margin-top:4px;animation:pop .3s ease;display:none}
.feedback.show{display:block}
.feedback.correct{background:rgba(52,211,153,.15);color:var(--green)}
.feedback.wrong{background:rgba(248,113,113,.1);color:var(--red)}

.next-btn{width:100%;background:var(--purple2);color:#fff;border-radius:var(--r2);padding:15px;font-size:16px;font-weight:800;margin-top:10px;transition:.2s;display:none}
.next-btn.show{display:block;animation:slideIn .3s ease}
.next-btn:hover{background:var(--purple);transform:scale(1.02)}

.hint-btn{background:rgba(96,165,250,.1);border:1.5px solid rgba(96,165,250,.25);color:var(--blue);border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;transition:.2s}
.hint-btn:hover{background:rgba(96,165,250,.2)}
.hint-btn:disabled{opacity:.4;cursor:not-allowed}
.hint-area{width:100%;background:rgba(96,165,250,.08);border:1.5px solid rgba(96,165,250,.2);border-radius:var(--r2);padding:12px 14px;font-size:14px;color:var(--blue);margin-top:8px;display:none}
.hint-area.show{display:block;animation:fadeIn .3s ease}

.result-card{width:100%;background:var(--card);border-radius:var(--r);padding:24px;text-align:center}
.result-trophy{font-size:80px;animation:bounce 1.5s ease infinite;display:block}
.result-grade{font-family:'Fredoka One',cursive;font-size:clamp(40px,12vw,64px)}
.result-label{font-size:14px;color:var(--muted);margin:4px 0 16px;font-weight:600}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat-box{background:var(--card2);border-radius:var(--r2);padding:14px 8px;text-align:center}
.stat-val{font-family:'Fredoka One',cursive;font-size:24px}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase}

.badges-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.badge{background:var(--card2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;border:1.5px solid rgba(255,255,255,.1)}

.action-row{display:flex;gap:10px;width:100%;margin-top:14px}
.action-btn{flex:1;padding:14px;border-radius:var(--r2);font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;transition:.2s}
.action-btn:hover{transform:scale(1.02)}
.btn-retry{background:var(--card2);color:var(--white);border:2px solid rgba(255,255,255,.1)}
.btn-home{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#1a1a1a}

.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:confetti 3s ease-out forwards;z-index:999}

.s-math{--color:var(--blue);background:rgba(96,165,250,.15);color:var(--blue)}
.s-english{--color:var(--pink);background:rgba(244,114,182,.15);color:var(--pink)}
.s-kiswahili{--color:var(--green);background:rgba(52,211,153,.15);color:var(--green)}
.s-science{--color:var(--purple);background:rgba(167,139,250,.15);color:var(--purple)}
.s-social{--color:var(--orange);background:rgba(251,146,60,.15);color:var(--orange)}
.s-cre{--color:var(--yellow);background:rgba(251,191,36,.15);color:var(--yellow)}
.s-arts{--color:var(--teal);background:rgba(45,212,191,.15);color:var(--teal)}

.combo-popup{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--yellow);color:#1a1a1a;border-radius:30px;padding:10px 28px;font-family:'Fredoka One',cursive;font-size:22px;pointer-events:none;z-index:100;animation:pop .4s ease,fadeOut 1.5s .8s ease forwards;white-space:nowrap}
@keyframes fadeOut{to{opacity:0;transform:translateX(-50%) translateY(-20px)}}

@media(max-width:380px){.subject-grid{grid-template-columns:repeat(2,1fr)}.result-stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:600px){#app{padding:20px}.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}

.level-badge{background:linear-gradient(135deg,var(--purple2),var(--pink2));border-radius:20px;padding:4px 14px;font-size:12px;font-weight:800;letter-spacing:.5px}
.progress-dots{display:flex;flex-wrap:wrap;gap:4px;width:100%;max-width:480px;margin:6px 0}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.1);transition:.3s}
.dot.done-ok{background:var(--green)}
.dot.done-wrong{background:var(--red)}
.dot.current{background:var(--yellow);animation:pulse .8s ease infinite}
</style>
</head>
<body>
<div id="app">

<div id="screen-home" class="screen active">
  <div class="logo-area">
    <span class="logo-star">⭐</span>
    <div class="logo-title">PP2 Star Scholar</div>
    <div class="logo-sub">CBC Quiz Challenge</div>
  </div>
  <div class="student-form">
    <label class="form-label" for="studentName">Your Name</label>
    <input class="form-input" id="studentName" type="text" placeholder="Enter your name..." maxlength="24" autocomplete="off">
  </div>
  <div style="width:100%;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Choose Subjects</div>
  <div class="subject-grid" id="subjectGrid">
    <button class="subj-btn selected" data-subj="math" style="--color:var(--blue)"><span class="subj-icon">🔢</span><span class="subj-name" style="color:var(--blue)">Mathematics</span></button>
    <button class="subj-btn selected" data-subj="english" style="--color:var(--pink)"><span class="subj-icon">📖</span><span class="subj-name" style="color:var(--pink)">English</span></button>
    <button class="subj-btn selected" data-subj="kiswahili" style="--color:var(--green)"><span class="subj-icon">🗣️</span><span class="subj-name" style="color:var(--green)">Kiswahili</span></button>
    <button class="subj-btn selected" data-subj="science" style="--color:var(--purple)"><span class="subj-icon">🔬</span><span class="subj-name" style="color:var(--purple)">Science</span></button>
    <button class="subj-btn selected" data-subj="social" style="--color:var(--orange)"><span class="subj-icon">🌍</span><span class="subj-name" style="color:var(--orange)">Social Studies</span></button>
    <button class="subj-btn selected" data-subj="cre" style="--color:var(--yellow)"><span class="subj-icon">✝️</span><span class="subj-name" style="color:var(--yellow)">C.R.E</span></button>
    <button class="subj-btn selected" data-subj="arts" style="--color:var(--teal)"><span class="subj-icon">🎨</span><span class="subj-name" style="color:var(--teal)">Creative Arts</span></button>
  </div>
  <div style="width:100%;display:flex;gap:10px;margin:10px 0 6px;align-items:center">
    <div style="font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px">Difficulty</div>
    <div style="display:flex;gap:6px;margin-left:auto">
      <button class="diff-btn" data-diff="easy" style="background:rgba(52,211,153,.15);border:1.5px solid rgba(52,211,153,.3);color:var(--green);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700">Easy</button>
      <button class="diff-btn selected" data-diff="mixed" style="background:rgba(251,191,36,.15);border:1.5px solid rgba(251,191,36,.4);color:var(--yellow);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700">Mixed</button>
      <button class="diff-btn" data-diff="hard" style="background:rgba(248,113,113,.12);border:1.5px solid rgba(248,113,113,.3);color:var(--red);border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700">Hard</button>
    </div>
  </div>
  <button class="play-btn" id="startBtn" onclick="startGame()">🚀 Start Quiz!</button>
  <div style="margin-top:16px;width:100%;text-align:center"><div style="font-size:12px;color:var(--muted)">20 questions per session • 3 lives • Earn badges!</div></div>
</div>

<div id="screen-game" class="screen">
  <div class="hud"><div class="hud-score"><span>SCORE</span><span id="scoreDisplay">0</span></div><div id="progressDots" class="progress-dots" style="flex:1;justify-content:center"></div><div><div class="hud-lives" id="livesDisplay"></div><div id="streakBadge" class="hud-streak" style="margin-top:4px;text-align:center;display:none">🔥 <span id="streakCount">0</span></div></div></div>
  <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  <div class="q-card" id="questionCard"><div class="q-meta"><span class="q-subj-badge" id="qSubjBadge">Math</span><span class="level-badge" id="qLevel">⭐ Level 1</span><span class="q-num" id="qNum">1/20</span></div><div class="q-text" id="questionText">Loading...</div></div>
  <div class="options-grid" id="optionsGrid"></div>
  <div class="feedback" id="feedback"></div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px;width:100%">
    <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Hint (<span id="hintsLeft">3</span>)</button>
    <span id="pointsEarned" style="font-size:13px;color:var(--yellow);font-weight:700;margin-left:auto;display:none"></span>
  </div>
  <div class="hint-area" id="hintArea"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question ➜</button>
</div>

<div id="screen-results" class="screen">
  <div id="confettiContainer"></div>
  <div class="result-card">
    <span id="resultTrophy" class="result-trophy">🏆</span>
    <div class="result-grade" id="resultGrade" style="color:var(--yellow)">A+</div>
    <div class="result-label" id="resultLabel">Outstanding Performance!</div>
    <div id="resultName" style="font-size:16px;font-weight:700;margin-bottom:8px"></div>
    <div class="result-stats"><div class="stat-box"><div class="stat-val" style="color:var(--yellow)" id="finalScore">0</div><div class="stat-lbl">Score</div></div><div class="stat-box"><div class="stat-val" style="color:var(--green)" id="finalCorrect">0</div><div class="stat-lbl">Correct</div></div><div class="stat-box"><div class="stat-val" style="color:var(--purple)" id="finalStreak">0</div><div class="stat-lbl">Best Streak</div></div></div>
    <div id="subjectBreakdown" style="width:100%;margin:12px 0"></div>
    <div class="badges-row" id="badgesRow"></div>
    <div class="action-row"><button class="action-btn btn-retry" onclick="retryGame()">🔄 Play Again</button><button class="action-btn btn-home" onclick="goHome()">🏠 Home</button></div>
  </div>
</div>
</div>

<script>
// ============ COMPLETE QUESTION BANK - 30 QUESTIONS PER SUBJECT WITH EASY/MIXED/HARD LEVELS ============
const ALL_QUESTIONS = {
math: [
  {q:"What is 2 + 3?", o:["4","5","6","7"], a:1, hint:"Count on your fingers!", diff:"easy"},
  {q:"What is 5 + 4?", o:["7","8","9","10"], a:2, hint:"Start at 5, count 4 more", diff:"easy"},
  {q:"How many sides does a triangle have?", o:["2","3","4","5"], a:1, hint:"Tri means three!", diff:"easy"},
  {q:"What is half of 10?", o:["4","5","6","3"], a:1, hint:"Share 10 equally between 2", diff:"easy"},
  {q:"What shape has no corners?", o:["Square","Rectangle","Circle","Triangle"], a:2, hint:"It is round!", diff:"easy"},
  {q:"What is 7 + 8?", o:["14","15","16","13"], a:1, hint:"7 + 8 = ?", diff:"mixed"},
  {q:"What is 20 - 9?", o:["10","11","12","9"], a:1, hint:"Count back from 20", diff:"mixed"},
  {q:"What is 4 × 2?", o:["6","8","10","12"], a:1, hint:"4 groups of 2", diff:"mixed"},
  {q:"What is 3 × 4?", o:["10","11","12","13"], a:2, hint:"3 groups of 4", diff:"mixed"},
  {q:"What is double 7?", o:["12","14","13","15"], a:1, hint:"7 + 7 = ?", diff:"mixed"},
  {q:"Which is the largest: 34, 43, 27, 39?", o:["34","43","27","39"], a:1, hint:"Look at the tens first", diff:"mixed"},
  {q:"What is 100 - 45?", o:["55","65","45","50"], a:0, hint:"100 take away 45", diff:"hard"},
  {q:"What is 6 × 7?", o:["36","42","48","40"], a:1, hint:"6 groups of 7", diff:"hard"},
  {q:"What is 81 ÷ 9?", o:["7","8","9","10"], a:2, hint:"How many 9s in 81?", diff:"hard"},
  {q:"What is 15% of 200?", o:["20","25","30","35"], a:2, hint:"10% is 20, plus half", diff:"hard"},
  {q:"What is the perimeter of a square with side 5cm?", o:["15cm","20cm","25cm","30cm"], a:1, hint:"Add all 4 sides", diff:"hard"},
  {q:"What is 3/4 of 100?", o:["50","75","25","80"], a:1, hint:"Quarter is 25, times 3", diff:"hard"},
  {q:"What is 2 × 2 × 2?", o:["4","6","8","10"], a:2, hint:"Multiply step by step", diff:"mixed"},
  {q:"What is the square root of 64?", o:["6","7","8","9"], a:2, hint:"What number times itself = 64", diff:"hard"},
  {q:"What comes after 99?", o:["98","100","101","110"], a:1, hint:"Add 1 to 99", diff:"easy"},
  {q:"How many hours are in 2 days?", o:["24","36","48","72"], a:2, hint:"1 day = 24 hours", diff:"mixed"},
  {q:"What is 5 + 5 + 5 + 5?", o:["15","20","25","30"], a:1, hint:"Four groups of 5", diff:"easy"},
  {q:"What is 12 × 12?", o:["121","132","144","156"], a:2, hint:"12 groups of 12", diff:"hard"},
  {q:"What is 0 × 15?", o:["0","15","1","10"], a:0, hint:"Anything times zero is zero", diff:"easy"},
  {q:"What is 56 ÷ 7?", o:["6","7","8","9"], a:2, hint:"7 × 8 = 56", diff:"mixed"},
  {q:"What is 9 × 11?", o:["90","99","100","108"], a:1, hint:"9 × 10 = 90, plus 9", diff:"hard"},
  {q:"What is 40% of 50?", o:["15","20","25","30"], a:1, hint:"Half of 50 is 25, 40% is a bit less", diff:"hard"},
  {q:"What is the area of a rectangle 4cm by 6cm?", o:["20cm²","24cm²","28cm²","30cm²"], a:1, hint:"Length × Width", diff:"mixed"},
  {q:"Count in 5s: 5, 10, 15, ___", o:["18","20","25","30"], a:1, hint:"Add 5 each time", diff:"easy"},
  {q:"What is 250 + 350?", o:["500","600","550","650"], a:1, hint:"25 + 35 = 60, add zero", diff:"mixed"},
],
english: [

  {q:"What do we call a group of singers?", o:["Band","Choir","Orchestra","Duet"], a:1, hint:"Often sings in church", diff:"mixed"},
  {q:"Which type of dance is traditional among the Kikuyu?", o:["Mugithi","Ohangla","Taarab","Isukuti"], a:0, hint:"Famous for guitar music", diff:"hard"},
  {q:"What is a mural?", o:["Small painting","Wall painting","Clay pot","Bead necklace"], a:1, hint:"Large wall art", diff:"mixed"},
  {q:"What does 'texture' mean in art?", o:["Colour","How surface feels","Shape","Size"], a:1, hint:"Smooth or rough", diff:"mixed"},
  {q:"Which famous Kenyan artist is known for 'Batwing' paintings?", o:["El Anatsui","Wangechi Mutu","Sane Wadu","John Njenga"], a:2, hint:"Early Kenyan contemporary", diff:"hard"},
  {q:"What is the main colour used for the Kenyan flag shield?", o:["Black","Red","Green","White"], a:0, hint:"Traditional Maasai shield", diff:"hard"},
  {q:"What is a still life painting?", o:["Landscape","Objects like fruit/flowers","Portrait","Abstract"], a:1, hint:"Non-moving objects", diff:"mixed"},
  {q:"Which dance is popular among the Luo community?", o:["Ohangla","Mugithi","Adumu","Isukuti"], a:0, hint:"Drums and traditional", diff:"hard"},
  {q:"What is the meaning of 'improvisation' in music?", o:["Writing notes","Creating music on the spot","Repeating melody","Singing loudly"], a:1, hint:"Making up as you go", diff:"hard"},
  {q:"What is the art of folding paper called?", o:["Origami","Calligraphy","Collage","Sculpture"], a:0, hint:"Japanese art", diff:"mixed"},
  {q:"Which is a warm colour?", o:["Blue","Green","Red","Purple"], a:2, hint:"Fire and sun", diff:"easy"},
]
};

const SUBJECT_META = {
  math:{name:"Mathematics",icon:"🔢",badge:"s-math",color:"var(--blue)"},
  english:{name:"English",icon:"📖",badge:"s-english",color:"var(--pink)"},
  kiswahili:{name:"Kiswahili",icon:"🗣️",badge:"s-kiswahili",color:"var(--green)"},
  science:{name:"Science",icon:"🔬",badge:"s-science",color:"var(--purple)"},
  social:{name:"Social Studies",icon:"🌍",badge:"s-social",color:"var(--orange)"},
  cre:{name:"C.R.E",icon:"✝️",badge:"s-cre",color:"var(--yellow)"},
  arts:{name:"Creative Arts",icon:"🎨",badge:"s-arts",color:"var(--teal)"}
};

let state={};

function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildQuestions(subjects,difficulty){
  let pool=[];
  subjects.forEach(s=>{
    let qs=ALL_QUESTIONS[s]||[];
    if(difficulty!=='mixed') qs=qs.filter(q=>q.diff===difficulty);
    if(qs.length>0) qs.forEach(q=>pool.push({...q,subject:s}));
  });
  if(pool.length===0) return [];
  pool=shuffleArray(pool);
  let result=[];
  let usedIndices=new Set();
  while(result.length<20 && result.length<pool.length){
    let idx=Math.floor(Math.random()*pool.length);
    if(!usedIndices.has(idx)){
      usedIndices.add(idx);
      result.push({...pool[idx]});
    }
  }
  return result;
}

function getSelectedSubjects(){return [...document.querySelectorAll('.subj-btn.selected')].map(b=>b.dataset.subj);}

document.querySelectorAll('.subj-btn').forEach(btn=>{btn.addEventListener('click',()=>{btn.classList.toggle('selected');checkStartBtn();});});

let selectedDiff='mixed';
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>{b.style.opacity='0.5';b.classList.remove('selected');});
    btn.style.opacity='1';btn.classList.add('selected');selectedDiff=btn.dataset.diff;
  });
});

function checkStartBtn(){document.getElementById('startBtn').disabled=getSelectedSubjects().length===0;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}

let timerInterval=null;

function startGame(){
  const name=document.getElementById('studentName').value.trim()||'Student';
  const subjects=getSelectedSubjects();
  if(subjects.length===0) return;
  const questions=buildQuestions(subjects,selectedDiff);
  if(questions.length===0){alert("No questions available for selected subjects/difficulty. Please try different options.");return;}
  state={
    name,subjects,questions,current:0,score:0,lives:3,streak:0,bestStreak:0,
    hints:3,answered:false,correct:0,wrong:0,subjStats:{},timeLeft:20,dots:[]
  };
  subjects.forEach(s=>state.subjStats[s]={correct:0,total:0});
  show('game');
  buildDots();
  renderQuestion();
}

function buildDots(){
  const container=document.getElementById('progressDots');container.innerHTML='';state.dots=[];
  state.questions.forEach((q,i)=>{const d=document.createElement('div');d.className='dot'+(i===0?' current':'');container.appendChild(d);state.dots.push(d);});
}

function updateDots(idx,ok){state.dots.forEach((d,i)=>{d.className='dot';if(i<idx)d.className+=' '+(state.questions[i]._correct?'done-ok':'done-wrong');else if(i===idx)d.className+=' current';});}

function renderLives(){
  const el=document.getElementById('livesDisplay');el.innerHTML='';
  for(let i=0;i<3;i++){const h=document.createElement('span');h.className='heart'+(i>=state.lives?' lost':'');h.textContent='❤️';el.appendChild(h);}
}

function renderQuestion(){
  clearInterval(timerInterval);
  const q=state.questions[state.current];if(!q){endGame();return;}
  state.answered=false;
  document.getElementById('hintArea').className='hint-area';
  document.getElementById('feedback').className='feedback';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('pointsEarned').style.display='none';
  document.getElementById('hintBtn').disabled=false;
  document.getElementById('hintsLeft').textContent=state.hints;
  const meta=SUBJECT_META[q.subject];
  const badge=document.getElementById('qSubjBadge');badge.textContent=meta.icon+' '+meta.name;
  badge.className='q-subj-badge '+meta.badge;
  document.getElementById('qLevel').textContent='⭐ Q '+(state.current+1);
  document.getElementById('qNum').textContent=(state.current+1)+'/'+state.questions.length;
  document.getElementById('questionText').textContent=q.q;
  document.getElementById('scoreDisplay').textContent=state.score;
  const grid=document.getElementById('optionsGrid');grid.innerHTML='';
  const letters=['A','B','C','D'];
  q.o.forEach((opt,i)=>{const btn=document.createElement('button');btn.className='opt-btn';btn.innerHTML=`<span class="opt-letter">${letters[i]}</span>${opt}`;btn.addEventListener('click',()=>answer(i));grid.appendChild(btn);});
  renderLives();updateDots(state.current,null);
  const sb=document.getElementById('streakBadge');
  if(state.streak>=2){sb.style.display='block';document.getElementById('streakCount').textContent=state.streak+'🔥';}else sb.style.display='none';
  state.timeLeft=q.diff==='easy'?20:q.diff==='hard'?12:16;
  startTimer();
}

function startTimer(){
  const bar=document.getElementById('timerBar');const max=state.timeLeft;bar.style.width='100%';bar.className='timer-bar';
  timerInterval=setInterval(()=>{state.timeLeft-=0.1;const pct=Math.max(0,(state.timeLeft/max)*100);bar.style.width=pct+'%';
    if(pct<30)bar.className='timer-bar danger';else if(pct<60)bar.className='timer-bar warn';
    if(state.timeLeft<=0&&!state.answered)timeUp();},100);
}

function timeUp(){
  state.answered=true;
  const q=state.questions[state.current];
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach((b,i)=>{if(i===q.a){b.className='opt-btn correct';}b.disabled=true;});
  state.lives--;state.streak=0;q._correct=false;
  showFeedback(false,"⏰ Time's up! Correct answer: "+q.o[q.a]);
  if(q.subject in state.subjStats) state.subjStats[q.subject].total++;
  if(state.lives<=0){setTimeout(endGame,1800);return;}
  document.getElementById('nextBtn').className='next-btn show';
  updateDots(state.current,false);renderLives();
}

function answer(idx){
  if(state.answered) return;
  state.answered=true;clearInterval(timerInterval);
  const q=state.questions[state.current];
  const btns=document.querySelectorAll('.opt-btn');btns.forEach(b=>b.disabled=true);
  if(q.subject in state.subjStats) state.subjStats[q.subject].total++;
  if(idx===q.a){
    btns[idx].className='opt-btn correct';
    const bonus=Math.ceil(state.timeLeft);const pts=10+Math.min(bonus,10)+(state.streak>=3?5:0);
    state.score+=pts;state.correct++;state.streak++;
    if(state.streak>state.bestStreak) state.bestStreak=state.streak;
    q._correct=true;
    if(q.subject in state.subjStats) state.subjStats[q.subject].correct++;
    showFeedback(true,'✅ Correct! +'+pts+' points'+(state.streak>=3?' 🔥 COMBO!':''));
    showPoints('+'+pts);
    if(state.streak>=3) showCombo(state.streak+'x COMBO!');
    document.getElementById('scoreDisplay').textContent=state.score;
    if(state.streak>=2){document.getElementById('streakBadge').style.display='block';document.getElementById('streakCount').textContent=state.streak+'🔥';}
  } else {
    btns[idx].className='opt-btn wrong';btns[q.a].className='opt-btn correct';
    state.lives--;state.streak=0;q._correct=false;
    showFeedback(false,'❌ Wrong! Correct: '+q.o[q.a]);
    renderLives();
    if(state.lives<=0){setTimeout(endGame,1800);return;}
  }
  updateDots(state.current,q._correct);
  document.getElementById('nextBtn').className='next-btn show';
}

function showFeedback(ok,msg){const el=document.getElementById('feedback');el.textContent=msg;el.className='feedback show '+(ok?'correct':'wrong');}
function showPoints(txt){const el=document.getElementById('pointsEarned');el.textContent=txt;el.style.display='block';el.style.animation='pop .3s ease';setTimeout(()=>el.style.display='none',1000);}
function showCombo(txt){const el=document.createElement('div');el.className='combo-popup';el.textContent=txt;document.body.appendChild(el);setTimeout(()=>el.remove(),2400);}
function showHint(){
  if(state.hints<=0||state.answered) return;
  const q=state.questions[state.current];
  const area=document.getElementById('hintArea');area.textContent='💡 '+q.hint;area.className='hint-area show';
  state.hints--;document.getElementById('hintsLeft').textContent=state.hints;
  if(state.hints===0) document.getElementById('hintBtn').disabled=true;
}
function nextQuestion(){state.current++;if(state.current>=state.questions.length){endGame();return;}renderQuestion();}
function endGame(){
  clearInterval(timerInterval);show('results');
  const pct=Math.round((state.correct/state.questions.length)*100);
  let grade,label,trophy,color;
  if(pct>=90){grade='A+';label='Outstanding! You are a STAR!';trophy='🏆';color='var(--yellow)';spawnConfetti();}
  else if(pct>=75){grade='A';label='Excellent work! Well done!';trophy='🥇';color='var(--yellow)';spawnConfetti();}
  else if(pct>=60){grade='B';label='Good job! Keep practising!';trophy='🥈';color='var(--muted)';}
  else if(pct>=40){grade='C';label='You can do better. Try again!';trophy='📚';color='var(--blue)';}
  else{grade='D';label='Keep studying and you will improve!';trophy='💪';color='var(--red)';}
  document.getElementById('resultTrophy').textContent=trophy;
  document.getElementById('resultGrade').textContent=grade+'  '+pct+'%';
  document.getElementById('resultGrade').style.color=color;
  document.getElementById('resultLabel').textContent=label;
  document.getElementById('resultName').textContent=state.name+"'s Report Card";
  document.getElementById('finalScore').textContent=state.score;
  document.getElementById('finalCorrect').textContent=state.correct+'/'+state.questions.length;
  document.getElementById('finalStreak').textContent=state.bestStreak;
  const bd=document.getElementById('subjectBreakdown');bd.innerHTML='';
  state.subjects.forEach(s=>{const st=state.subjStats[s];if(!st||st.total===0)return;const pct2=Math.round((st.correct/st.total)*100);const meta=SUBJECT_META[s];
    const bar=document.createElement('div');bar.style.cssText='margin-bottom:8px';
    bar.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px"><span>${meta.icon} ${meta.name}</span><span>${st.correct}/${st.total}</span></div>
    <div style="background:rgba(255,255,255,.08);border-radius:20px;height:6px;overflow:hidden"><div style="width:${pct2}%;height:100%;background:${meta.color};border-radius:20px;transition:width 1s ease"></div></div>`;
    bd.appendChild(bar);
  });
  const badges=[];
  if(pct>=90) badges.push({t:'🌟 Star Scholar',c:'var(--yellow)'});
  if(pct>=75) badges.push({t:'📚 Book Worm',c:'var(--blue)'});
  if(state.bestStreak>=5) badges.push({t:'🔥 Hot Streak x'+state.bestStreak,c:'var(--orange)'});
  if(state.bestStreak>=3) badges.push({t:'⚡ Combo Master',c:'var(--purple)'});
  if(state.hints===3) badges.push({t:'🧠 No Hints Needed',c:'var(--green)'});
  if(state.lives===3) badges.push({t:'💖 All Lives Saved',c:'var(--pink)'});
  if(state.subjects.length>=5) badges.push({t:'🎯 All-Rounder',c:'var(--teal)'});
  const br=document.getElementById('badgesRow');br.innerHTML='';
  if(badges.length===0) badges.push({t:'🎓 Good Try!',c:'var(--muted)'});
  badges.forEach(b=>{const el=document.createElement('div');el.className='badge';el.style.color=b.c;el.style.borderColor=b.c;el.textContent=b.t;br.appendChild(el);});
}
function spawnConfetti(){for(let i=0;i<40;i++){setTimeout(()=>{const el=document.createElement('div');el.className='confetti-piece';el.style.left=Math.random()*100+'vw';el.style.top='-20px';el.style.background=['#fbbf24','#f472b6','#60a5fa','#34d399','#a78bfa','#fb923c'][Math.floor(Math.random()*6)];el.style.width=(8+Math.random()*8)+'px';el.style.height=(8+Math.random()*8)+'px';el.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),4000);},i*60);}}
function retryGame(){startGame();}
function goHome(){clearInterval(timerInterval);show('home');}
checkStartBtn();
</script>
