<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Shamba Master | Grade 6 English | Proverbs, Writing & Safety</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef5ff 0%, #cfe2fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 16px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 30px 45px rgba(0, 30, 60, 0.2), inset 0 1px 2px rgba(255,255,255,0.9);
            overflow: hidden;
            border: 2px solid white;
        }

        /* Tabs */
        .mode-tabs {
            display: flex;
            background: #0a2f6c;
            border-bottom: 3px solid #ffcd3c;
            gap: 2px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            background: #1f5e9e;
            color: #fef9e0;
            border: none;
            padding: 14px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ffcd3c, #f9a826);
            color: #0a2f6c;
        }
        .tab-btn:active { transform: scale(0.98); }

        /* Header */
        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #0a2f6c;
            padding: 16px 28px;
            color: white;
        }

        .title-box h1 {
            font-size: clamp(1.2rem, 6vw, 1.8rem);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .title-box h1 span {
            background: #ffcd3c;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: clamp(0.7rem, 4vw, 1rem);
            color: #0a2f6c;
            font-weight: bold;
        }

        .kenya-fact {
            background: #1f5e9e;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            text-align: center;
            max-width: 380px;
        }

        .score-board {
            background: white;
            padding: 5px 18px;
            border-radius: 40px;
            color: #0a2f6c;
            font-weight: bold;
            font-size: clamp(1rem, 5vw, 1.5rem);
            white-space: nowrap;
        }

        /* Level Panel */
        .level-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: 16px 20px;
            background: #eef5ff;
            padding: 12px 20px;
            border-radius: 60px;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-btn {
            background: #cddffd;
            border: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            cursor: pointer;
            transition: 0.2s;
            color: #023b6d;
            white-space: nowrap;
        }

        .level-btn.active {
            background: #0f4c81;
            color: white;
            transform: scale(0.97);
        }

        .hint-area {
            background: #fff5dc;
            border-left: 12px solid #ffae42;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            color: #5a3e1b;
            flex: 1;
            min-width: 160px;
        }

        /* Quiz Card */
        .quiz-card {
            background: white;
            border-radius: 52px;
            padding: 22px 20px 28px;
            margin: 10px 20px 20px;
            box-shadow: 0 15px 30px rgba(0, 30, 60, 0.08);
            border: 1px solid #cce3ff;
        }

        .question {
            font-size: clamp(1rem, 5.5vw, 1.5rem);
            font-weight: 700;
            margin-bottom: 24px;
            color: #023459;
            background: #f0f7ff;
            padding: 16px 22px;
            border-radius: 48px;
            word-break: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 28px;
        }

        .option {
            background: #f3f9ff;
            border: 2px solid #cde3fc;
            border-radius: 60px;
            padding: 12px 14px;
            font-size: clamp(0.85rem, 4vw, 0.95rem);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            color: #1f4e7a;
            text-align: center;
        }

        .option:hover {
            background: #d9ebff;
            transform: scale(0.97);
            border-color: #2c7ac9;
        }

        .feedback {
            text-align: center;
            font-size: clamp(0.85rem, 4vw, 1rem);
            font-weight: bold;
            margin: 8px 0 20px;
            padding: 10px;
            border-radius: 48px;
        }

        .next-btn {
            background: #0f4c81;
            border: none;
            padding: 12px 28px;
            font-size: clamp(0.9rem, 4.5vw, 1.1rem);
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            max-width: 260px;
            margin: 0 auto;
            display: block;
        }

        .next-btn:active { transform: scale(0.96); }

        .game-status {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 10px 20px 20px;
            background: #eef2fc;
            padding: 12px 20px;
            border-radius: 48px;
            font-weight: bold;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
        }

        .progress {
            background: #b7d0f0;
            border-radius: 30px;
            padding: 5px 16px;
        }

        #hintTriggerBtn {
            background: #ffbb77;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: clamp(0.7rem, 3vw, 0.85rem);
        }

        @media (max-width: 680px) {
            .level-panel { flex-direction: column; align-items: stretch; margin: 12px; }
            .level-buttons { justify-content: center; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .game-status { flex-direction: column; align-items: stretch; text-align: center; }
            .score-board { white-space: normal; }
            .tab-btn { font-size: 0.65rem; padding: 10px 4px; }
        }
        
        button { font-family: inherit; }
        .disabled-click { pointer-events: none; opacity: 0.9; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabWise">🌾 Shamba Wise (Proverbs & Safety)</button>
        <button class="tab-btn" id="tabScribes">📝 Shamba Scribes (Writing & Patterns)</button>
    </div>
    <div class="game-header">
        <div class="title-box">
            <h1>🌍 SHAMBA MASTER <span>Grade 6</span></h1>
        </div>
        <div class="kenya-fact" id="kenyaFunFact">🇰🇪 Kenya's farms produce fresh milk, tea, and wisdom!</div>
        <div class="score-board">🏆 SCORE: <span id="totalScoreDisplay">0</span></div>
    </div>

    <div class="level-panel">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="hint-area" id="hintBox">💡 Tap hint button for a clue + farm wisdom!</div>
    </div>

    <div class="quiz-card">
        <div class="question" id="questionText">Loading Shamba Challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback" id="feedbackMsg"></div>
        <button class="next-btn" id="nextButton">➡️ NEXT QUESTION</button>
    </div>

    <div class="game-status">
        <div class="progress">📚 LEVEL: <span id="currentLevelName">Level 1</span> | Q <span id="qCounter">1</span>/<span id="totalPerLevel">15</span></div>
        <div>✨ Level Score: <span id="levelScoreSpan">0</span> | 🔥 Streak: <span id="streakSpan">0</span></div>
        <button id="hintTriggerBtn">🔎 HINT & WISDOM</button>
    </div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: SHAMBA WISE (Proverbs & Safety) + SHAMBA SCRIBES (Writing)
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: built into progression (no unlocking required, just play)
    // ==============================================================

    // ---------- MODE 1: SHAMBA WISE (Proverbs, Idioms, Animal Safety) ----------
    const FARM_PROVERBS = [
        { proverb: "Don't count your chickens before they hatch", meaning: "Don't assume success before it happens", hint: "Wait for results before celebrating" },
        { proverb: "A bird in hand is worth two in the bush", meaning: "It's better to have a small real gain than a big uncertain one", hint: "Value what you already have" },
        { proverb: "The early bird catches the worm", meaning: "Starting early leads to success", hint: "Wake up early on the farm!" },
        { proverb: "You can lead a horse to water, but you can't make it drink", meaning: "You can provide opportunities but not force someone", hint: "Provide care but respect animal nature" },
        { proverb: "A cow that bellows much gives little milk", meaning: "Those who complain a lot achieve little", hint: "Quiet, hard work is best on farm" },
        { proverb: "Don't put all your eggs in one basket", meaning: "Don't risk everything on a single venture", hint: "Spread your resources" }
    ];
    
    const ANIMAL_SAFETY_RULES = [
        { rule: "Always close the gate after entering an animal pen.", reason: "Prevents animals from wandering into danger", hint: "Secure enclosures reduce accidents" },
        { rule: "Separate sick animals immediately.", reason: "Stops diseases from spreading to the herd", hint: "Isolation protects healthy livestock" },
        { rule: "Don't startle cows from behind.", reason: "Cows may kick and injure a person", hint: "Approach slowly and speak gently" },
        { rule: "Wash hands after touching any farm animal.", reason: "Prevents transfer of germs", hint: "Hygiene keeps you and animals healthy" },
        { rule: "Check for sharp objects in the paddock.", reason: "Prevents foot injuries", hint: "Inspect enclosures daily" }
    ];
    
    const FARM_IDIOMS = [
        { idiom: "Hold your horses", meaning: "Be patient, wait", hint: "Calm down like a herder with restless horses" },
        { idiom: "Wild goose chase", meaning: "A pointless search", hint: "Don't waste time chasing something impossible" },
        { idiom: "Till the cows come home", meaning: "For a very long time", hint: "Cows return at their own pace" },
        { idiom: "Straight from the horse's mouth", meaning: "From a reliable source", hint: "Get information directly from the one who knows" },
        { idiom: "Kill two birds with one stone", meaning: "Solve two problems at once", hint: "Efficient farm work accomplishes many tasks" }
    ];
    
    function buildWiseLevels() {
        let levels = [[], [], [], []];
        // Level 0: Proverbs
        for (let i = 0; i < 15; i++) {
            let item = FARM_PROVERBS[i % FARM_PROVERBS.length];
            let wrongs = ["Ignore all animals", "Sleep all day", "Sell everything", "Shout loudly", "Run away"];
            let opts = [item.meaning, ...wrongs.slice(0,3)];
            opts = shuffleArray([...new Set(opts)]).slice(0,4);
            levels[0].push({ text: `What does the proverb "${item.proverb}" mean on a farm?`, correct: item.meaning, options: opts, hint: item.hint });
        }
        // Level 1: Animal Safety
        for (let i = 0; i < 15; i++) {
            let item = ANIMAL_SAFETY_RULES[i % ANIMAL_SAFETY_RULES.length];
            let wrongs = ["Ignore sick animals", "Leave gates open", "Run behind cows screaming", "Never wash hands", "Feed rotten food"];
            let opts = [item.rule, ...wrongs.slice(0,3)];
            opts = shuffleArray([...new Set(opts)]).slice(0,4);
            levels[1].push({ text: `Which option is an important animal safety practice?`, correct: item.rule, options: opts, hint: item.hint });
        }
        // Level 2: Idioms
        for (let i = 0; i < 15; i++) {
            let item = FARM_IDIOMS[i % FARM_IDIOMS.length];
            let wrongs = ["Move quickly", "Sleep all day", "Overfeed animals", "Break fences", "Sell livestock"];
            let opts = [item.meaning, ...wrongs.slice(0,3)];
            opts = shuffleArray([...new Set(opts)]).slice(0,4);
            levels[2].push({ text: `What does the idiom "${item.idiom}" mean?`, correct: item.meaning, options: opts, hint: item.hint });
        }
        // Level 3: Advanced Safety & Proverbs
        for (let i = 0; i < 15; i++) {
            if (i % 3 === 0) {
                levels[3].push({ text: "A cow seems lethargic and not eating. What is the FIRST safety step?", correct: "Isolate from the herd and call a veterinarian", options: ["Isolate from the herd and call a vet", "Give extra grain", "Leave it in the field", "Force it to walk"], hint: "Quick action prevents disease spread" });
            } else if (i % 3 === 1) {
                levels[3].push({ text: "What does 'An ounce of prevention is worth a pound of cure' mean for farmers?", correct: "Small safety steps prevent big disasters", options: ["Small safety steps prevent big disasters", "Ignore small problems", "Wait until things break", "Use more medicine"], hint: "Vaccinate and clean sheds" });
            } else {
                levels[3].push({ text: "What does 'The eye of the master fattens the calf' mean?", correct: "Constant care and observation improves livestock health", options: ["Constant care improves livestock health", "Ignore animals", "Feed only once a week", "Shout at calves"], hint: "Daily check-ups prevent losses" });
            }
        }
        return levels;
    }

    // ---------- MODE 2: SHAMBA SCRIBES (Creative Writing, Sentence Patterns) ----------
    const WRITING_BANK = [
        { stem: "Every morning, the farmer __________ the cows before letting them to the pasture.", correct: "milks", options: ["milks", "feeds", "ignores", "washes"], hint: "Dairy farmers collect milk early." },
        { stem: "To keep the animals safe, we must always __________ the gate after entering.", correct: "close", options: ["close", "open", "break", "paint"], hint: "Prevent animals from wandering away." },
        { stem: "The herd of cattle __________ across the green Kenyan field.", correct: "grazes peacefully", options: ["grazes peacefully", "runs wildly", "sleeps deeply", "hides shyly"], hint: "Describe a calm, beautiful farm image." },
        { stem: "Which phrase creates a vivid image of a healthy farm?", correct: "Shiny coats, bright eyes, and contented moos", options: ["Shiny coats, bright eyes, and contented moos", "Dirty pens and sad animals", "Broken fences", "Loud shouting"], hint: "Good animal care shows in happy, clean livestock." },
        { stem: "Choose the best sentence to start a story about rescuing a goat.", correct: "The little goat was stuck in the thorny thicket, crying for help.", options: ["The little goat was stuck crying for help", "Goats are animals", "It was a sunny day", "I like goats"], hint: "Strong openings make readers curious." },
        { stem: "Which sentence uses an exciting verb to describe a horse's movement?", correct: "The stallion galloped across the lush Kenyan pasture.", options: ["The stallion galloped", "The horse walked slowly", "The animal moved", "The creature was there"], hint: "Use action words like galloped, dashed, trotted." },
        { stem: "Combine these sentences: 'The farmer noticed a limp. He examined the cow's hoof.'", correct: "After noticing a limp, the farmer examined the cow's hoof.", options: ["After noticing a limp, the farmer examined the cow's hoof.", "The farmer did nothing", "He ignored the cow", "The cow was fine"], hint: "Use a time connector like 'after' or 'when'." },
        { stem: "Improve this sentence: 'The water trough was empty. The animals were thirsty. The herder filled it quickly.'", correct: "The herder quickly filled the empty water trough because the animals were thirsty.", options: ["The herder quickly filled the empty trough because the animals were thirsty", "The animals drank water", "The herder slept", "Nothing happened"], hint: "Combine ideas to show cause and effect." }
    ];
    
    function buildScribesLevels() {
        let levels = [[], [], [], []];
        for (let lvl = 0; lvl < 4; lvl++) {
            for (let i = 0; i < 15; i++) {
                let base = WRITING_BANK[i % WRITING_BANK.length];
                let wrongs = ["The farmer ran away", "Ignore the animals", "Shout loudly", "Leave gates open", "A boring sentence", "The animal slept"];
                let opts = [base.correct, ...wrongs.slice(0,3)];
                opts = shuffleArray([...new Set(opts)]).slice(0,4);
                levels[lvl].push({
                    text: base.stem,
                    correct: base.correct,
                    options: opts,
                    hint: base.hint + " Use correct grammar and farm vocabulary."
                });
            }
        }
        return levels;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    const wiseData = buildWiseLevels();
    const scribesData = buildScribesLevels();

    let currentMode = "wise";
    let currentLevel = 0;
    let currentQIndex = 0;
    let levelScores = [0, 0, 0, 0];
    let answerLock = false;
    let currentStreak = 0;
    let totalPoints = 0;

    const modeNames = { wise: "🌾 Shamba Wise", scribes: "📝 Shamba Scribes" };
    const levelNames = {
        wise: ["Farm Proverbs", "Animal Safety", "Idioms & Fluency", "Master Herder"],
        scribes: ["Sentence Builders", "Farm Safety Stories", "Creative Descriptions", "Master Scribe"]
    };
    const funFacts = [
        "🇰🇪 Kenya produces over 80% of East Africa's dairy products!",
        "🇰🇪 The famous Boran cattle breed originated in Kenya.",
        "🇰🇪 Kenyan farmers use solar-powered electric fences for livestock safety.",
        "🇰🇪 Kenya produces award-winning creative writers like Ngũgĩ wa Thiong'o!",
        "🇰🇪 A Kenyan child's creativity shines in writing about herding cattle."
    ];

    const dynamicDiv = document.getElementById('optionsContainer');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const totalScoreSpan = document.getElementById('totalScoreDisplay');
    const kenyanFactSpan = document.getElementById('kenyaFunFact');
    const questionTextDiv = document.getElementById('questionText');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const nextBtn = document.getElementById('nextButton');
    const levelNameSpan = document.getElementById('currentLevelName');
    const qCounterSpan = document.getElementById('qCounter');
    const levelScoreSpan = document.getElementById('levelScoreSpan');
    const streakSpan = document.getElementById('streakSpan');
    const hintTrigger = document.getElementById('hintTriggerBtn');
    const hintBox = document.getElementById('hintBox');

    let currentHintMsg = "";

    function updateTotalScore() {
        totalPoints = levelScores.reduce((a, b) => a + b, 0);
        totalScoreSpan.innerText = totalPoints;
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=0;i<4;i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''}`;
            btn.innerText = `Lvl ${i+1}`;
            btn.onclick = () => { if(!answerLock) switchLevel(i); };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchLevel(level) {
        currentLevel = level;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        updateUI();
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactSpan.innerText = funFacts[Math.floor(Math.random() * funFacts.length)];
    }

    function updateUI() {
        levelNameSpan.innerText = `${levelNames[currentMode][currentLevel]} (${modeNames[currentMode]})`;
        levelScoreSpan.innerText = levelScores[currentLevel];
        streakSpan.innerText = currentStreak;
        qCounterSpan.innerText = `${currentQIndex+1}/15`;
        updateTotalScore();
    }

    function checkLevelCompletion() {
        if(currentQIndex + 1 >= 15) {
            let msg = `🎉 LEVEL ${currentLevel+1} COMPLETE! Score: ${levelScores[currentLevel]}/15.`;
            alert(msg);
            if(currentLevel + 1 < 4) {
                currentLevel++;
                currentQIndex = 0;
                currentStreak = 0;
                answerLock = false;
                updateUI();
                loadCurrentQuestion();
                updateLevelButtons();
            } else {
                let total = levelScores.reduce((a,b)=>a+b,0);
                alert(`🏆 MASTER COMPLETE! Total Score: ${total}/60. You are a Shamba Champion! 🏆`);
                if(confirm("Start a new adventure?")) resetGame();
            }
        }
    }

    function resetGame() {
        levelScores = [0,0,0,0];
        currentLevel = 0;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        updateUI();
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactSpan.innerText = funFacts[0];
    }

    function loadCurrentQuestion() {
        const data = currentMode === 'wise' ? wiseData[currentLevel][currentQIndex] : scribesData[currentLevel][currentQIndex];
        questionTextDiv.innerHTML = `❓ ${data.text}`;
        currentHintMsg = data.hint;
        hintBox.innerHTML = `💡 ${data.hint}`;
        dynamicDiv.innerHTML = '';
        data.options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => { if(!answerLock) checkAnswer(opt, data.correct, btn); };
            dynamicDiv.appendChild(btn);
        });
        feedbackDiv.innerHTML = '';
        answerLock = false;
        nextBtn.style.background = "#0f4c81";
        updateUI();
    }

    function checkAnswer(selected, correct, element) {
        if(answerLock) return;
        answerLock = true;
        const isCorrect = (selected === correct);
        if(isCorrect) {
            levelScores[currentLevel]++;
            currentStreak++;
            feedbackDiv.innerHTML = "✅ CORRECT! +1 point! 🎉";
            feedbackDiv.style.color = "#1f7a1f";
            element.style.background = "#c8f0d1";
        } else {
            currentStreak = 0;
            feedbackDiv.innerHTML = `❌ Correct answer: "${correct}". Keep learning!`;
            feedbackDiv.style.color = "#b13e3e";
            element.style.background = "#ffe0e0";
        }
        updateUI();
        document.querySelectorAll(".option").forEach(opt => opt.style.pointerEvents = "none");
    }

    function nextQuestionHandler() {
        if(!answerLock) {
            feedbackDiv.innerHTML = "⚠️ Please select an answer first!";
            return;
        }
        if(currentQIndex + 1 < 15) {
            currentQIndex++;
            answerLock = false;
            loadCurrentQuestion();
            updateUI();
        } else {
            checkLevelCompletion();
        }
    }

    function showHint() {
        if(!answerLock) {
            hintBox.innerHTML = `💡 ${currentHintMsg} (Farm wisdom & careful thinking!)`;
        } else {
            hintBox.innerHTML = `💡 Already answered! Next question gives fresh clue.`;
        }
    }

    function switchMode(mode) {
        if(mode === currentMode) return;
        currentMode = mode;
        currentLevel = 0;
        currentQIndex = 0;
        levelScores = [0,0,0,0];
        currentStreak = 0;
        answerLock = false;
        updateUI();
        loadCurrentQuestion();
        updateLevelButtons();
        kenyanFactSpan.innerText = funFacts[Math.floor(Math.random() * funFacts.length)];
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabWise').addEventListener('click', () => switchMode('wise'));
    document.getElementById('tabScribes').addEventListener('click', () => switchMode('scribes'));
    nextBtn.addEventListener('click', nextQuestionHandler);
    hintTrigger.addEventListener('click', showHint);

    // Initialize
    updateLevelButtons();
    loadCurrentQuestion();
    updateUI();
    kenyanFactSpan.innerText = funFacts[0];
</script>
</body>
</html>
