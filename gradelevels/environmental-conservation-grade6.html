<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Eco Academy | Grade 6 English | Writing, Reading, Listening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef5ff 0%, #cfe2fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 16px;
        }

        .game-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 30px 45px rgba(0, 30, 60, 0.2), inset 0 1px 2px rgba(255,255,255,0.9);
            overflow: hidden;
            border: 2px solid white;
        }

        .mode-tabs {
            display: flex;
            background: #0a2f6c;
            border-bottom: 3px solid #ffcd3c;
            gap: 2px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            background: #1f5e9e;
            color: #fef9e0;
            border: none;
            padding: 14px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ffcd3c, #f9a826);
            color: #0a2f6c;
        }
        .tab-btn:active { transform: scale(0.98); }

        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #0a2f6c;
            padding: 16px 28px;
            color: white;
        }

        .title-box h1 {
            font-size: clamp(1.2rem, 6vw, 1.8rem);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .title-box h1 span {
            background: #ffcd3c;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: clamp(0.7rem, 4vw, 1rem);
            color: #0a2f6c;
            font-weight: bold;
        }
        .kenya-fact {
            background: #1f5e9e;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            text-align: center;
            max-width: 380px;
        }
        .score-board {
            background: white;
            padding: 5px 18px;
            border-radius: 40px;
            color: #0a2f6c;
            font-weight: bold;
            font-size: clamp(1rem, 5vw, 1.5rem);
            white-space: nowrap;
        }

        .level-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: 16px 20px;
            background: #eef5ff;
            padding: 12px 20px;
            border-radius: 60px;
        }
        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .level-btn {
            background: #cddffd;
            border: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            cursor: pointer;
            transition: 0.2s;
            color: #023b6d;
            white-space: nowrap;
        }
        .level-btn.active {
            background: #0f4c81;
            color: white;
            transform: scale(0.97);
        }
        .hint-area {
            background: #fff5dc;
            border-left: 12px solid #ffae42;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            color: #5a3e1b;
            flex: 1;
            min-width: 160px;
        }

        .quiz-card {
            background: white;
            border-radius: 52px;
            padding: 22px 20px 28px;
            margin: 10px 20px 20px;
            box-shadow: 0 15px 30px rgba(0, 30, 60, 0.08);
            border: 1px solid #cce3ff;
        }

        .passage {
            background: #f8fbfe;
            border-left: 8px solid #0f4c81;
            padding: 18px 22px;
            border-radius: 32px;
            margin-bottom: 20px;
            font-size: clamp(0.85rem, 4vw, 1rem);
            line-height: 1.5;
            color: #1a2c3e;
            max-height: 250px;
            overflow-y: auto;
        }
        .audio-control {
            background: #eef5ff;
            border-radius: 60px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .listen-btn {
            background: #0f4c81;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .listen-btn:active { transform: scale(0.96); }
        .listen-btn.listening { background: #ff8c42; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .read-aloud-btn {
            background: #ffcd3c;
            border: none;
            border-radius: 40px;
            padding: 5px 15px;
            margin-bottom: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-block;
        }
        .question {
            font-size: clamp(1rem, 5.5vw, 1.4rem);
            font-weight: 700;
            margin-bottom: 24px;
            color: #023459;
            background: #f0f7ff;
            padding: 16px 22px;
            border-radius: 48px;
            word-break: break-word;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 28px;
        }
        .option {
            background: #f3f9ff;
            border: 2px solid #cde3fc;
            border-radius: 60px;
            padding: 12px 14px;
            font-size: clamp(0.85rem, 4vw, 0.95rem);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            color: #1f4e7a;
            text-align: center;
        }
        .option:hover { background: #d9ebff; transform: scale(0.97); border-color: #2c7ac9; }
        .feedback {
            text-align: center;
            font-size: clamp(0.85rem, 4vw, 1rem);
            font-weight: bold;
            margin: 8px 0 20px;
            padding: 10px;
            border-radius: 48px;
        }
        .next-btn {
            background: #0f4c81;
            border: none;
            padding: 12px 28px;
            font-size: clamp(0.9rem, 4.5vw, 1.1rem);
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            width: 100%;
            max-width: 260px;
            margin: 0 auto;
            display: block;
        }
        .next-btn:active { transform: scale(0.96); }
        .game-status {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 10px 20px 20px;
            background: #eef2fc;
            padding: 12px 20px;
            border-radius: 48px;
            font-weight: bold;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
        }
        .progress { background: #b7d0f0; border-radius: 30px; padding: 5px 16px; }
        #hintTriggerBtn {
            background: #ffbb77;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .badge { display: inline-block; background: #e0ecff; border-radius: 30px; padding: 4px 12px; font-size: 0.7rem; margin-left: 10px; color: #0f4c81; }
        @media (max-width: 680px) {
            .level-panel { flex-direction: column; align-items: stretch; margin: 12px; }
            .options-grid { grid-template-columns: 1fr; }
            .game-status { flex-direction: column; text-align: center; }
            .score-board { white-space: normal; }
            .tab-btn { font-size: 0.65rem; padding: 10px 4px; }
        }
        button { font-family: inherit; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabWriting">✍️ Eco Writers</button>
        <button class="tab-btn" id="tabReading">📖 Eco Readers</button>
        <button class="tab-btn" id="tabListening">🎧 Eco Listen</button>
    </div>
    <div class="game-header">
        <div class="title-box"><h1>🌍 ECO ACADEMY <span>Grade 6</span></h1></div>
        <div class="kenya-fact" id="kenyaFunFact">🇰🇪 Kenya's Green Belt Movement planted over 51 million trees!</div>
        <div class="score-board">🏆 SCORE: <span id="totalScoreDisplay">0</span></div>
    </div>
    <div class="level-panel">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="hint-area" id="hintBox">💡 Tap hint button for a clue!</div>
    </div>
    <div class="quiz-card" id="quizCard">
        <div id="modeSpecific"></div>
        <div class="question" id="questionText">Loading challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback" id="feedbackMsg"></div>
        <button class="next-btn" id="nextButton">➡️ NEXT QUESTION</button>
    </div>
    <div class="game-status">
        <div class="progress">📚 LEVEL: <span id="currentLevelName">Level 1</span> | Q <span id="qCounter">1</span>/<span id="totalPerLevel">15</span></div>
        <div>✨ Score: <span id="levelScoreSpan">0</span> | 🔥 Streak: <span id="streakSpan">0</span></div>
        <button id="hintTriggerBtn">🔎 HINT</button>
    </div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: Eco Writers + Eco Readers + Eco Listen
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Includes voice feedback, reading passages, and audio-based listening
    // ==============================================================

    function speakMessage(text, isCorrect = true) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = isCorrect ? 1.1 : 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    // ---------- MODE 1: ECO WRITERS (Functional Writing) ----------
    const WRITING_DATA = [
        { name: "Level 1: Letters & Requests", type: "letters", questions: [
            { prompt: "You are writing a letter to the headteacher requesting permission to start an environmental club. Which salutation is correct?", correct: "Dear Headteacher,", options: ["Dear Headteacher,", "Hey Headteacher,", "To the Principal,", "What's up?"], hint: "Formal letter greeting." },
            { prompt: "Choose the best closing for a formal letter requesting tree planting materials.", correct: "Yours sincerely,", options: ["Yours sincerely,", "Bye for now,", "See you later,", "Cheers,"], hint: "Formal letter closing." }
        ]},
        { name: "Level 2: Reports & Articles", type: "reports", questions: [
            { prompt: "Which headline is most effective for a tree planting event?", correct: "Students Plant 500 Trees to Restore Forest", options: ["Students Plant 500 Trees to Restore Forest", "Tree Planting Happened", "Students Were Busy", "Forest Day"], hint: "Specific and newsworthy." }
        ]},
        { name: "Level 3: Posters & Speeches", type: "awareness", questions: [
            { prompt: "Which slogan is most effective for a plastic recycling poster?", correct: "Recycle Today for a Better Tomorrow!", options: ["Recycle Today for a Better Tomorrow!", "Plastic is Bad", "Please Recycle", "Don't Litter"], hint: "Catchy and action-oriented." }
        ]},
        { name: "Level 4: Eco Writing Master", type: "advanced", questions: [
            { prompt: "Which format is correct for recording a meeting decision?", correct: "Motion: To plant 100 trees. Passed unanimously.", options: ["Motion: To plant 100 trees. Passed unanimously.", "We decided to plant trees.", "Everyone agreed on trees.", "Trees were planted."], hint: "Formal minutes format." }
        ]}
    ];
    for (let l of WRITING_DATA) while (l.questions.length < 15) l.questions.push(l.questions[0]);

    // ---------- MODE 2: ECO READERS (Reading & Question Tags) ----------
    const READING_DATA = [
        { name: "Level 1: Save Our Planet", passages: [
            { text: "The Green Belt Movement was founded by Wangari Maathai in 1977. It has planted over 51 million trees.", questions: [{ q: "Who founded the Green Belt Movement?", correct: "Wangari Maathai", options: ["Wangari Maathai", "UNEP", "WWF", "Kenya Forest Service"], hint: "Nobel Prize winner." }] }
        ]},
        { name: "Level 2: Water & Forests", passages: [{ text: "Kenya's Mau Forest is the largest water tower, providing water to major rivers.", questions: [{ q: "What is Kenya's largest water tower?", correct: "Mau Forest", options: ["Mau Forest", "Mount Kenya", "Aberdare Forest", "Kakamega Forest"], hint: "Provides water to rivers." }] }] },
        { name: "Level 3: Reduce, Reuse, Recycle", passages: [{ text: "The three R's of conservation are Reduce, Reuse, and Recycle.", questions: [{ q: "What are the three R's of conservation?", correct: "Reduce, Reuse, Recycle", options: ["Reduce, Reuse, Recycle", "Read, Write, Recite", "Run, Jump, Play", "Rest, Relax, Recover"], hint: "Environmental principle." }] }] },
        { name: "Level 4: Eco Champions", passages: [{ text: "Wangari Maathai was the first African woman to win the Nobel Peace Prize in 2004.", questions: [{ q: "What prize did Wangari Maathai win in 2004?", correct: "Nobel Peace Prize", options: ["Nobel Peace Prize", "Nobel Literature Prize", "Nobel Science Prize", "Nobel Medicine Prize"], hint: "For peace and environment." }] }] }
    ];
    function buildReadingLevel(level) {
        let levelData = READING_DATA[level];
        let allQ = [];
        for (let p of levelData.passages) for (let q of p.questions) allQ.push({ passage: p.text, question: q.q, correct: q.correct, options: shuffleArray([...q.options]), hint: q.hint });
        let expanded = [];
        for (let i = 0; i < 15; i++) { let orig = allQ[i % allQ.length]; expanded.push({ ...orig, options: shuffleArray([...orig.options]) }); }
        return expanded;
    }

    // ---------- MODE 3: ECO LISTEN (Pronunciation & Vocabulary) ----------
    const LISTEN_DATA = [
        { name: "Level 1: Eco Words", questions: [
            { audioWord: "conservation", correct: "protecting nature", options: ["Protecting nature", "Destroying forests", "Polluting water", "Wasting energy"], hint: "Saving the environment." }
        ]},
        { name: "Level 2: Say It Right", questions: [
            { audioWord: "environment", correct: "environment", options: ["environment", "enviroment", "envirnment", "environmint"], hint: "The world around us." }
        ]},
        { name: "Level 3: Conservation Vocab", questions: [
            { audioWord: "Climate change is causing temperatures to rise globally.", correct: "rising temperatures worldwide", options: ["Rising temperatures worldwide", "Cooler weather", "More rain", "Stronger winds"], hint: "Global warming effect." }
        ]},
        { name: "Level 4: Eco Champion", questions: [
            { audioWord: "Wangari Maathai won the Nobel Peace Prize for her environmental work.", correct: "Nobel Peace Prize", options: ["Nobel Peace Prize", "Olympic Gold", "Booker Prize", "Grammy Award"], hint: "Kenyan environmental hero." }
        ]}
    ];
    function buildListenLevel(level) {
        let levelData = LISTEN_DATA[level];
        let expanded = [];
        for (let i = 0; i < 15; i++) { let orig = levelData.questions[i % levelData.questions.length]; expanded.push({ ...orig, options: shuffleArray([...orig.options]) }); }
        return expanded;
    }

    // Mode builders
    const modeBuilders = { writing: (lvl) => WRITING_DATA[lvl].questions, reading: (lvl) => buildReadingLevel(lvl), listening: (lvl) => buildListenLevel(lvl) };
    const modeNames = { writing: "✍️ Eco Writers", reading: "📖 Eco Readers", listening: "🎧 Eco Listen" };
    const levelNames = { writing: ["Letters & Requests", "Reports & Articles", "Posters & Speeches", "Eco Writing Master"], reading: ["Save Our Planet", "Water & Forests", "Reduce Reuse Recycle", "Eco Champions"], listening: ["Eco Words", "Say It Right", "Conservation Vocab", "Eco Champion"] };

    let currentMode = "writing";
    let currentLevel = 0;
    let currentQIndex = 0;
    let levelScores = [0, 0, 0, 0];
    let answerLock = false;
    let currentStreak = 0;
    let currentPassageText = "";
    let currentAudioText = "";
    let recognition = null;

    function updateTotalScore() { let total = levelScores.reduce((a,b)=>a+b,0); document.getElementById("totalScoreDisplay").innerText = total; }
    function updateUI() {
        document.getElementById("levelScoreSpan").innerText = levelScores[currentLevel];
        document.getElementById("streakSpan").innerText = currentStreak;
        document.getElementById("qCounter").innerText = currentQIndex + 1;
        document.getElementById("totalPerLevel").innerText = "15";
        document.getElementById("currentLevelName").innerHTML = `${levelNames[currentMode][currentLevel]} (${modeNames[currentMode]})`;
        updateTotalScore();
    }
    function updateLevelButtons() {
        const container = document.getElementById("levelButtonsContainer");
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''}`;
            btn.innerText = `Lvl ${i + 1}`;
            btn.onclick = () => { if (!answerLock) switchLevel(i); };
            container.appendChild(btn);
        }
    }
    function switchLevel(level) {
        if (answerLock) { speakMessage("Please answer current question first.", false); return; }
        currentLevel = level;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        speakMessage(`Switched to ${levelNames[currentMode][currentLevel]} level.`, true);
    }

    function loadCurrentQuestion() {
        const data = modeBuilders[currentMode](currentLevel)[currentQIndex];
        const modeSpecific = document.getElementById("modeSpecific");
        modeSpecific.innerHTML = '';
        
        if (currentMode === 'reading') {
            modeSpecific.innerHTML = `<div style="display: flex; justify-content: flex-end;"><button class="read-aloud-btn" id="readPassageBtn">🔊 READ STORY ALOUD</button></div><div class="passage" id="passageText">${data.passage}</div>`;
            currentPassageText = data.passage;
            document.getElementById("readPassageBtn")?.addEventListener('click', () => speakMessage(currentPassageText, true));
            document.getElementById("questionText").innerHTML = `📖 ${data.question}`;
        } else if (currentMode === 'listening') {
            modeSpecific.innerHTML = `<div class="audio-control"><button class="listen-btn" id="listenBtn">🔊 LISTEN TO AUDIO</button></div>`;
            currentAudioText = data.audioWord;
            document.getElementById("listenBtn")?.addEventListener('click', () => {
                if (answerLock) { speakMessage("Already answered. Press next.", false); return; }
                speakMessage(currentAudioText, true);
            });
            document.getElementById("questionText").innerHTML = `🎧 Choose the correct ${currentLevel === 1 ? 'spelling' : 'meaning'}: <span class="badge">Audio Quiz</span>`;
        } else {
            document.getElementById("questionText").innerHTML = `✍️ ${data.prompt}`;
        }
        
        window.currentHintMsg = data.hint;
        document.getElementById("hintBox").innerHTML = `💡 ${data.hint}`;
        
        const optsDiv = document.getElementById("optionsContainer");
        optsDiv.innerHTML = "";
        data.options.forEach(opt => {
            let btn = document.createElement("div");
            btn.classList.add("option");
            btn.innerText = opt;
            btn.onclick = () => { if (!answerLock) checkAnswer(opt, data.correct, btn); };
            optsDiv.appendChild(btn);
        });
        
        document.getElementById("feedbackMsg").innerHTML = "";
        answerLock = false;
        updateUI();
    }

    function checkAnswer(selected, correct, element) {
        if (answerLock) return;
        answerLock = true;
        const isCorrect = (selected.trim().toLowerCase() === correct.trim().toLowerCase());
        const feedbackDiv = document.getElementById("feedbackMsg");
        
        if (isCorrect) {
            levelScores[currentLevel]++;
            currentStreak++;
            feedbackDiv.innerHTML = "✅ CORRECT! +1 point! 🎉";
            feedbackDiv.style.color = "#1f7a1f";
            element.style.background = "#c8f0d1";
            speakMessage("Correct! Plus one point! Excellent work!", true);
        } else {
            currentStreak = 0;
            feedbackDiv.innerHTML = `❌ Not quite. Correct answer: "${correct}". Keep practicing!`;
            feedbackDiv.style.color = "#b13e3e";
            element.style.background = "#ffe0e0";
            speakMessage(`Incorrect. The correct answer is ${correct}.`, false);
        }
        updateUI();
        document.querySelectorAll(".option").forEach(opt => opt.style.pointerEvents = "none");
    }

    function nextQuestionHandler() {
        if (!answerLock) {
            speakMessage("Please select an answer first.", false);
            document.getElementById("feedbackMsg").innerHTML = "⚠️ Please select an answer first!";
            return;
        }
        if (currentQIndex + 1 < 15) {
            currentQIndex++;
            loadCurrentQuestion();
        } else {
            let msg = `Level ${currentLevel + 1} complete! Score: ${levelScores[currentLevel]}/15`;
            speakMessage(msg, true);
            alert(`🎉 ${msg}`);
            if (currentLevel + 1 < 4) {
                currentLevel++;
                currentQIndex = 0;
                currentStreak = 0;
                answerLock = false;
                loadCurrentQuestion();
                updateUI();
                updateLevelButtons();
            } else {
                let finalTotal = levelScores.reduce((a, b) => a + b, 0);
                let finalMsg = `🏆 MASTER COMPLETE! Total Score: ${finalTotal}/60. You are an Eco Academy Champion! 🏆`;
                speakMessage(finalMsg, true);
                alert(finalMsg);
                if (confirm("Start a new adventure?")) resetGame();
            }
        }
    }

    function resetGame() {
        levelScores = [0, 0, 0, 0];
        currentLevel = 0;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        speakMessage("Game reset. Starting fresh!", true);
    }

    function showHint() {
        if (!answerLock && window.currentHintMsg) {
            speakMessage(`Hint: ${window.currentHintMsg}`, true);
            document.getElementById("hintBox").innerHTML = `💡 ${window.currentHintMsg}`;
        } else if (answerLock) {
            speakMessage("Already answered. Press next to continue.", false);
        } else {
            speakMessage("Read carefully and think about the answer.", true);
        }
    }

    function switchMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        currentLevel = 0;
        currentQIndex = 0;
        levelScores = [0, 0, 0, 0];
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
        speakMessage(`Switched to ${modeNames[currentMode]} mode.`, true);
    }

    document.getElementById('tabWriting').addEventListener('click', () => switchMode('writing'));
    document.getElementById('tabReading').addEventListener('click', () => switchMode('reading'));
    document.getElementById('tabListening').addEventListener('click', () => switchMode('listening'));
    document.getElementById('nextButton').addEventListener('click', nextQuestionHandler);
    document.getElementById('hintTriggerBtn').addEventListener('click', showHint);

    updateLevelButtons();
    loadCurrentQuestion();
    updateUI();
    speakMessage("Welcome to Eco Academy! Select a mode: Writing, Reading, or Listening. Complete all levels to become an Eco Champion!", true);
</script>
</body>
</html>
