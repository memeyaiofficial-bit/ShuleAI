<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>🇰🇪 Mabingwa wa Kiswahili | Gredi 6 | Mahusiano, Barua, Sarufi, Misimu</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(145deg, #eef5ff 0%, #ffffff 100%);
    font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

.game-container {
    max-width: 1100px;
    width: 100%;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 3rem 2rem 3rem 2rem;
    box-shadow: 0 25px 45px -12px rgba(0, 65, 115, 0.4);
    overflow: hidden;
    border: 2px solid #7abff7;
}

.mode-tabs {
    display: flex;
    background: #0b3b5f;
    border-bottom: 3px solid #ffcd7e;
    gap: 2px;
    flex-wrap: wrap;
}
.tab-btn {
    flex: 1;
    background: #1e6faf;
    color: #fef9e0;
    border: none;
    padding: 14px 8px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
    text-align: center;
}
.tab-btn.active {
    background: linear-gradient(135deg, #f4a261, #e76f51);
    color: white;
}
.tab-btn:active { transform: scale(0.98); }

.game-header {
    background: #0b3b5f;
    padding: 1rem 1.5rem;
    color: white;
    text-align: center;
    border-bottom: 4px solid #ffcd7e;
}
.game-header h1 {
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}
.kenyan-flag-badge {
    background: #f5f5f5;
    padding: 5px 15px;
    border-radius: 60px;
    font-size: 0.7rem;
    font-weight: 700;
    color: #0b3b5f;
}

.levels-row {
    display: flex;
    justify-content: space-between;
    background: #f0f9ff;
    padding: 12px 20px;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 2px dashed #b9dcf5;
}
.level-btn {
    background: white;
    border: none;
    padding: 10px 0;
    flex: 1;
    font-weight: bold;
    font-size: 0.9rem;
    border-radius: 60px;
    cursor: pointer;
    font-family: inherit;
    color: #15607a;
    border: 1px solid #cae3f5;
    transition: 0.2s;
}
.level-btn.active {
    background: #1e6faf;
    color: white;
    transform: scale(0.97);
}
.level-btn:hover:not(.active) { background: #d4ebff; transform: translateY(-2px); }

.info-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 10px 24px;
    border-bottom: 1px solid #d0e6f7;
    flex-wrap: wrap;
    gap: 10px;
}
.score-box, .q-counter {
    background: #eef2fc;
    padding: 5px 18px;
    border-radius: 40px;
    font-weight: bold;
    color: #0f5080;
}
.score-box span, .q-counter span {
    font-size: 1.4rem;
    font-weight: 800;
    margin-left: 6px;
    color: #033b61;
}

.quiz-area {
    padding: 1.5rem 1.5rem 0.8rem;
    text-align: center;
}
.question-card {
    background: linear-gradient(145deg, #fefefe, #f2f9ff);
    padding: 24px 18px;
    border-radius: 48px;
    margin-bottom: 18px;
    border: 2px solid #b3defa;
}
.topic-badge {
    font-size: 0.9rem;
    font-weight: bold;
    background: #cde6fe;
    display: inline-block;
    padding: 4px 20px;
    border-radius: 40px;
    margin-bottom: 14px;
    color: #043753;
}
.question-text {
    font-size: 1.3rem;
    font-weight: 800;
    color: #00263b;
    line-height: 1.4;
    margin-top: 8px;
}
.passage-text, .letter-text {
    background: #e6f2ff;
    padding: 18px;
    border-radius: 28px;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 18px;
    text-align: left;
    color: #003366;
}
.options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 18px 0;
}
.option-btn {
    background: #d9ecff;
    border: none;
    padding: 14px 16px;
    border-radius: 60px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
    font-family: inherit;
}
.option-btn:hover:not(:disabled) { background: #80bfff; transform: translateX(5px); }
.option-btn.correct { background: #66ff99; color: #004d1a; }
.option-btn.wrong { background: #ff6666; color: #660000; text-decoration: line-through; }
.option-btn:disabled { cursor: default; opacity: 0.7; }

.hint-box {
    background: #fff6e0;
    border-left: 10px solid #ffb347;
    padding: 12px 20px;
    margin: 10px 0 0;
    border-radius: 30px;
    font-size: 0.9rem;
    color: #0a537c;
    text-align: left;
}
.next-level-msg {
    background: #00713b;
    color: white;
    text-align: center;
    padding: 12px;
    border-radius: 60px;
    margin: 10px 20px;
    cursor: pointer;
    font-weight: bold;
}
.footer-note {
    text-align: center;
    font-size: 0.7rem;
    padding: 14px;
    color: #346f95;
}
@media (max-width: 680px) {
    .question-text { font-size: 1rem; }
    .tab-btn { font-size: 0.65rem; padding: 10px 4px; }
    .option-btn { padding: 12px; font-size: 0.9rem; }
}
</style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabMahusiano">🤝 Mahusiano & Urafiki</button>
        <button class="tab-btn" id="TabBarua">✉️ Barua Rasmi</button>
        <button class="tab-btn" id="TabSarufi">📝 Sarufi ya Ngeli YA-YA</button>
        <button class="tab-btn" id="TabMisimu">🌦️ Kusoma kwa Mapana: Misimu</button>
    </div>
    <div class="game-header">
        <h1>🇰🇪 MABINGWA WA KISWAHILI 🏆
            <span class="kenyan-flag-badge">GREDI 6 • MAHUSIANO, BARUA, SARUFI NA KUSOMA</span>
        </h1>
    </div>
    <div class="levels-row" id="levelButtonsContainer"></div>
    <div class="info-panel">
        <div class="score-box">⭐ ALAMA: <span id="scoreValue">0</span></div>
        <div class="q-counter">📌 SWALI: <span id="currentQNumber">1</span> / <span id="totalQperLevel">15</span></div>
    </div>
    <div class="quiz-area" id="dynamicContent"></div>
    <div id="levelCompleteMsg"></div>
    <div class="footer-note">🎯 Jibu kwa kubonyeza chaguo sahihi. Pata pointi 10 kwa jibu sahihi. Pita ngazi kwa 80% (12/15)!</div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: 4 MODES - Mahusiano, Barua Rasmi, Sarufi YA-YA, Misimu
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Pass: 80% (12/15 correct per level)
    // ==============================================================

    // ---------- MODE 1: MAHUSIANO NA URAFIKI ----------
    const mahusianoData = [
        {p:"Urafiki mzuri kati ya wanafunzi unajengwa kwa kusaidiana na kuheshimiana.", q:"Ni nini msingi wa urafiki mzuri?", o:["Kugombana","Kusaidiana na kuheshimiana","Kukimbia","Kucheka tu"], a:"Kusaidiana na kuheshimiana", h:"Angalia maneno ya mwisho"},
        {p:"Familia ina jukumu muhimu katika malezi ya watoto. Wazazi huwafundisha watoto maadili mema.", q:"Ni nani wanaowafundisha watoto maadili?", o:["Walimu","Wazazi","Wachezaji","Majirani"], a:"Wazazi", h:"Angalia mwanzo wa kifungu"},
        {p:"Shuleni, wanafunzi wanapaswa kushirikiana ili kufanikisha miradi ya darasa.", q:"Kwa nini wanafunzi washirikiane?", o:["Kugombana","Kufanikisha miradi","Kulala","Kucheza"], a:"Kufanikisha miradi", h:"Tafuta sababu"},
        {p:"Urafiki unaweza kuharibika ikiwa hakuna uaminifu kati ya watu wawili.", q:"Nini kinaweza kuharibu urafiki?", o:["Uaminifu","Kucheka","Uongo","Michezo"], a:"Uongo", h:"Angalia kinyume cha uaminifu"},
        {p:"Wanafunzi wazuri huwasaidia wenzao wanaoshindwa kuelewa masomo.", q:"Nani husaidiwa shuleni?", o:["Walimu","Wanafunzi wanaoshindwa kuelewa","Wachezaji","Wazazi"], a:"Wanafunzi wanaoshindwa kuelewa", h:"Angalia neno 'huwasaidia'"}
    ];
    while(mahusianoData.length<15) mahusianoData.push(mahusianoData[0]);
    const mahusianoDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++){
        for(let i=0;i<15;i++) mahusianoDB[l].push(mahusianoData[(i+l)%mahusianoData.length]);
    }

    // ---------- MODE 2: BARUA RASMI ----------
    const baruaData = [
        {l:"Mheshimiwa Mkuu wa Shule, Ningependa kuomba ruhusa ya kutohudhuria shule kwa siku moja kwa sababu ya ugonjwa.", q:"Barua hii imeandikwa kwa nani?", o:["Mwalimu","Mkuu wa shule","Mwanafunzi","Mzazi"], a:"Mkuu wa shule", h:"Angalia mwanzo wa barua"},
        {l:"Mpendwa Mwalimu, ninashukuru kwa kunifundisha kwa bidii.", q:"Hii ni aina gani ya barua?", o:["Barua ya kikazi","Barua ya kirafiki","Barua rasmi ya shukrani","Barua ya biashara"], a:"Barua rasmi ya shukrani", h:"Angalia hisia za mwandishi"},
        {l:"Afisa wa polisi, tafadhali chunguza tukio lililotokea shuleni.", q:"Barua hii ina lengo gani?", o:["Kuomba msaada","Kucheza","Kusafiri","Kusoma"], a:"Kuomba msaada", h:"Angalia ombi"},
        {l:"Mheshimiwa Waziri wa Elimu, naomba msaada wa vitabu vya darasa.", q:"Barua hii inaomba nini?", o:["Vitabu","Chakula","Michezo","Safari"], a:"Vitabu", h:"Angalia ombi kuu"},
        {l:"Mkuu wa shule, ninaomba kuhamishwa darasa.", q:"Nani anahusika kwenye barua hii?", o:["Mwalimu","Mkuu wa shule","Daktari","Polisi"], a:"Mkuu wa shule", h:"Angalia mwanzoni"}
    ];
    while(baruaData.length<15) baruaData.push(baruaData[0]);
    const baruaDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++){
        for(let i=0;i<15;i++) baruaDB[l].push(baruaData[(i+l)%baruaData.length]);
    }

    // ---------- MODE 3: SARUFI - NGELI YA-YA ----------
    const sarufiData = [
        {q:"Umoja wa neno 'yaya' ni upi?", o:["yaya","mayaya","yayi","maye"], a:"yaya", h:"Angalia neno la msingi"},
        {q:"Wingi wa 'yaya' ni upi?", o:["mayaya","yaya","waya","yayi"], a:"mayaya", h:"Badilisha nomino"},
        {q:"Sentensi: 'Yaya analinda mtoto.' Wingi wake ni upi?", o:["Mayaya wanamlinda mtoto","Yaya analinda watoto","Mtoto analinda yaya","Yaya analinda mtoto"], a:"Mayaya wanamlinda mtoto", h:"Badilisha nomino na kitenzi"},
        {q:"Ngeli YA-YA ina mfano upi?", o:["yaya - mayaya","mtoto - watoto","kitabu - vitabu","nyumba - nyumba"], a:"yaya - mayaya", h:"Angalia kundi la maneno"},
        {q:"Sentensi ipi iko katika wingi?", o:["Yaya anacheza","Mayaya wanacheza","Mtoto analia","Yaya analala"], a:"Mayaya wanacheza", h:"Tafuta zaidi ya mmoja"}
    ];
    while(sarufiData.length<15) sarufiData.push(sarufiData[0]);
    const sarufiDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++){
        for(let i=0;i<15;i++) sarufiDB[l].push(sarufiData[(i+l)%sarufiData.length]);
    }

    // ---------- MODE 4: KUSOMA KWA MAPANA - MISIMU ----------
    const misimuData = [
        {p:"Kenya ina misimu miwili kuu: masika na vuli. Masika huanza Machi hadi Mei.", q:"Kenya ina misimu mingapi kuu ya mvua?", o:["Miwiili","Mitatu","Minne","Moja"], a:"Miwiili", h:"Angalia sentensi ya kwanza"},
        {p:"Katika nchi za Ulaya, kuna misimu minne: spring, summer, autumn na winter.", q:"Nchi za Ulaya zina misimu mingapi?", o:["Mbili","Tatu","Nne","Tano"], a:"Nne", h:"Taja idadi iliyotajwa"},
        {p:"Wakulima hupanda mahindi na maharagwe wakati wa masika.", q:"Wakulima hupanda nini wakati wa masika?", o:["Mahindi tu","Maharagwe tu","Mahindi na maharagwe","Viazi"], a:"Mahindi na maharagwe", h:"Pata mazao mawili"}
    ];
    while(misimuData.length<15) misimuData.push(misimuData[0]);
    const misimuDB = {1:[],2:[],3:[],4:[]};
    for(let l=1;l<=4;l++){
        for(let i=0;i<15;i++) misimuDB[l].push(misimuData[(i+l)%misimuData.length]);
    }

    const modeBuilders = {
        mahusiano: (lvl) => mahusianoDB[lvl],
        barua: (lvl) => baruaDB[lvl],
        sarufi: (lvl) => sarufiDB[lvl],
        misimu: (lvl) => misimuDB[lvl]
    };
    const modeNames = { mahusiano:"Mahusiano na Urafiki", barua:"Barua Rasmi", sarufi:"Ngeli YA-YA", misimu:"Kusoma kwa Mapana: Misimu" };

    let currentMode = "mahusiano";
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelQuestions = [];
    let levelScore = 0;
    let totalQuestions = 15;
    let requiredCorrect = Math.ceil(totalQuestions * 0.8);
    let answeringLock = false;
    let levelFinished = false;
    let gameActive = true;

    const dynamicDiv = document.getElementById('dynamicContent');
    const levelButtonsRow = document.getElementById('levelButtonsContainer');
    const scoreSpan = document.getElementById('scoreValue');
    const qNumSpan = document.getElementById('currentQNumber');
    const totalQSpan = document.getElementById('totalQperLevel');
    const levelCompleteDiv = document.getElementById('levelCompleteMsg');
    totalQSpan.innerText = totalQuestions;

    function updateUI() {
        scoreSpan.innerText = levelScore;
        qNumSpan.innerText = currentQIndex+1;
    }

    function checkIfLevelComplete() {
        if(levelScore >= requiredCorrect) {
            if(currentLevel === 4) {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#ffb347;">🏆 HONGERA! Umemaliza ngazi zote! Bingwa wa Kiswahili! 🏆</div>`;
                gameActive = false;
            } else {
                levelCompleteDiv.innerHTML = `<div class="next-level-msg" id="nextLevelTrigger">🎉 HONGERA! Umepita NGEAZI ${currentLevel}! Bonyeza hapa kuendelea 🎉</div>`;
                const trigger = document.getElementById('nextLevelTrigger');
                if(trigger) trigger.onclick = () => {
                    currentLevel++;
                    currentQIndex = 0;
                    levelScore = 0;
                    levelFinished = false;
                    gameActive = true;
                    levelCompleteDiv.innerHTML = "";
                    loadLevelQuestions();
                    updateUI();
                    updateLevelButtons();
                    loadCurrentQuestion();
                };
            }
        } else {
            levelCompleteDiv.innerHTML = `<div class="next-level-msg" style="background:#c73d23;">😔 HUKUFAULU! ${levelScore}/${requiredCorrect} sahihi. Bonyeza hapa kujaribu tena.</div>`;
            const trigger = document.getElementById('nextLevelTrigger');
            if(trigger) trigger.onclick = () => { currentQIndex=0; levelScore=0; loadLevelQuestions(); loadCurrentQuestion(); updateUI(); levelCompleteDiv.innerHTML=""; };
        }
    }

    function handleAnswer(selectedValue) {
        if(answeringLock || !gameActive || levelFinished) return;
        answeringLock = true;
        const currentItem = levelQuestions[currentQIndex];
        const isCorrect = (selectedValue === currentItem.a);
        if(isCorrect) levelScore++;
        updateUI();
        if(currentQIndex + 1 >= totalQuestions) {
            levelFinished = true;
            checkIfLevelComplete();
        } else {
            currentQIndex++;
            loadCurrentQuestion();
        }
        answeringLock = false;
    }

    function loadCurrentQuestion() {
        if(!gameActive && levelFinished) return;
        const q = levelQuestions[currentQIndex];
        let html = `<div class="question-card">`;
        html += `<div class="topic-badge">${modeNames[currentMode]}</div>`;
        if(currentMode === 'mahusiano' || currentMode === 'misimu') {
            html += `<div class="passage-text">📖 ${q.p}</div>`;
        } else if(currentMode === 'barua') {
            html += `<div class="letter-text">✉️ ${q.l}</div>`;
        }
        html += `<div class="question-text">❓ ${q.q}</div>`;
        html += `<div class="options-grid">`;
        (q.o || []).forEach((opt, idx) => {
            html += `<button class="option-btn" data-value="${opt}">${String.fromCharCode(65+idx)}. ${opt}</button>`;
        });
        html += `</div><div class="hint-box">💡 Dokezo: ${q.h}</div>`;
        html += `</div>`;
        dynamicDiv.innerHTML = html;
        updateUI();
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', () => handleAnswer(btn.getAttribute('data-value')));
        });
    }

    function loadLevelQuestions() {
        levelQuestions = modeBuilders[currentMode](currentLevel);
        requiredCorrect = Math.ceil(totalQuestions * 0.8);
        levelScore = 0;
        currentQIndex = 0;
        updateUI();
    }

    function updateLevelButtons() {
        levelButtonsRow.innerHTML = '';
        for(let i=1;i<=4;i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn' + (i===currentLevel ? ' active' : '');
            btn.innerText = `Ngazi ${i}`;
            btn.onclick = () => {
                if(i === currentLevel) return;
                currentLevel = i;
                currentQIndex = 0;
                levelScore = 0;
                levelFinished = false;
                gameActive = true;
                levelCompleteDiv.innerHTML = "";
                loadLevelQuestions();
                loadCurrentQuestion();
                updateLevelButtons();
            };
            levelButtonsRow.appendChild(btn);
        }
    }

    function switchMode(mode) {
        if(mode === currentMode) return;
        currentMode = mode;
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        levelFinished = false;
        gameActive = true;
        levelCompleteDiv.innerHTML = "";
        loadLevelQuestions();
        updateLevelButtons();
        loadCurrentQuestion();
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase()+mode.slice(1)}`).classList.add('active');
    }

    document.getElementById('tabMahusiano').addEventListener('click', () => switchMode('mahusiano'));
    document.getElementById('TabBarua').addEventListener('click', () => switchMode('barua'));
    document.getElementById('TabSarufi').addEventListener('click', () => switchMode('sarufi'));
    document.getElementById('TabMisimu').addEventListener('click', () => switchMode('misimu'));

    loadLevelQuestions();
    updateLevelButtons();
    loadCurrentQuestion();
</script>
</body>
</html>
