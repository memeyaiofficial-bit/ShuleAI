<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 7 - Creative Arts & Sports Champion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* keeps interface clean, text can still be read aloud */
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 30%, #1a472a, #0e2a1a);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, -apple-system, sans-serif;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* main game card */
        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fef9e6;
            border-radius: 70px 70px 60px 60px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,245,190,0.8);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* header: level, score, timer */
        .game-header {
            background: linear-gradient(135deg, #ffb347, #ff7e05);
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 5px solid gold;
            color: white;
            text-shadow: 2px 2px 0 #aa4f0a;
        }

        .level-badge {
            background: #2e5c2e;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #1d391d;
        }

        .score-card {
            background: #1f3b2c;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-area {
            background: #091c14;
            padding: 5px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-clock {
            background: #f5e7c8;
            color: #c0392b;
            padding: 5px 15px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: 800;
            min-width: 85px;
            text-align: center;
        }

        /* progress bar */
        .progress-wrapper {
            background: #d6c79e;
            padding: 6px 20px;
        }
        .progress-fill {
            height: 18px;
            background: #f4b942;
            width: 0%;
            border-radius: 30px;
            transition: width 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        /* main quiz area */
        .quiz-area {
            padding: 30px 30px 35px;
        }

        .question-panel {
            background: #fff3df;
            border-radius: 55px;
            padding: 25px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2c4b32;
            line-height: 1.4;
            word-break: break-word;
        }

        .speaker-button {
            background: #ffdd99;
            border: none;
            font-size: 1.4rem;
            padding: 10px 24px;
            margin-top: 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: 0.08s linear;
            box-shadow: 0 5px 0 #b97f3a;
        }

        .speaker-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f3a;
        }

        /* options grid A B C D style */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin: 30px 0 25px;
        }

        .option {
            background: #e8ddc4;
            border-radius: 100px;
            padding: 15px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.08s linear;
            border: 2px solid #cbad7a;
            text-align: center;
            box-shadow: 0 6px 0 #a67c48;
            color: #2a2b1f;
            letter-spacing: 0.3px;
        }

        .option:hover {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option.correct-feedback {
            background: #3c9e3c;
            border-color: #1b6b1b;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .option.wrong-feedback {
            background: #d94a2b;
            border-color: #962b12;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .next-btn {
            background: #2c7a2d;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 60px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.08s;
            box-shadow: 0 7px 0 #164d17;
            margin-top: 15px;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #164d17;
        }

        .info-message {
            text-align: center;
            font-size: 1.3rem;
            background: #fff1bf;
            padding: 14px;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }

        /* responsive */
        @media (max-width: 700px) {
            .question-text {
                font-size: 1.3rem;
            }
            .option {
                font-size: 1rem;
                padding: 12px 10px;
            }
            .game-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .timer-area {
                justify-content: center;
            }
        }

        footer {
            background: #e1cf9b;
            text-align: center;
            padding: 14px;
            font-weight: 500;
            color: #2c2b1a;
            font-size: 0.85rem;
        }

        button {
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-card">🏆 SCORE: <span id="currentScore">0</span> / <span id="maxLevelScore">0</span></div>
        <div class="timer-area">
            ⏱️ TIME
            <div class="timer-clock" id="timerNumber">20</div>
        </div>
    </div>
    <div class="progress-wrapper">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="quiz-area" id="quizArea">
        <!-- dynamic content injected -->
    </div>
    <footer>🎨⚽ CBC Grade 7: Introduction to Creative Arts & Sports | Components of Creative Arts & Sports 🎭🏅</footer>
</div>

<script>
    // --------------------------------------------------------------
    // TOPICS: Introduction to Creative Arts & Sports + Components 
    // (Visual Arts, Music, Dance, Drama, Sports, Components like elements, skills, etc)
    // 5 LEVELS each with 40 UNIQUE questions, randomized answers (A,B,C,D shuffled)
    // Passing grade: 80% (32/40)
    // VOICE OUTPUT, TIMER (20s per question), addictive & challenging
    // Fully responsive.
    // ADAPTED FOR GRADE 7 (all content and mechanics remain the same)
    // --------------------------------------------------------------

    // Helper to shuffle answers array (preserve correct answer index)
    function shuffleAnswers(questionObj) {
        const originalOptions = [...questionObj.options];
        const correctAns = originalOptions[questionObj.correctIndex];
        // create array of {text, isCorrect}
        let items = originalOptions.map((text, idx) => ({ text, isCorrect: idx === questionObj.correctIndex }));
        // Fisher-Yates shuffle
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        const newOptions = items.map(item => item.text);
        const newCorrectIndex = items.findIndex(item => item.isCorrect === true);
        return {
            ...questionObj,
            options: newOptions,
            correctIndex: newCorrectIndex
        };
    }

    // generate 40 high-quality questions per level about "Introduction to Creative Arts and Sports" and "Components of Creative Arts and Sports"
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        // level adds complexity: deeper concepts for level 4-5
        for (let i = 0; i < 40; i++) {
            let qText = "";
            let opts = [];
            let correct = 0;
            const seed = (level * 231 + i * 17) % 37;
            const topicChoice = (seed % 4); // 0: intro general, 1: visual arts comp, 2: music/dance/drama comp, 3: sports components
            
            // base templates but massive variety using seed & level
            if (topicChoice === 0) { // INTRODUCTION TO CREATIVE ARTS & SPORTS
                const introVariants = [
                    { q: "What does Creative Arts include?", opts: ["Painting, music, drama", "Only Mathematics", "Only running", "Only Science"], correct: 0 },
                    { q: "Which of these is a benefit of Creative Arts in school?", opts: ["Improves imagination", "Increases fear", "Reduces teamwork", "Limits expression"], correct: 0 },
                    { q: "Creative Arts and Sports help us to _______", opts: ["Express ourselves and stay healthy", "Only sit quietly", "Avoid friends", "Memorize facts"], correct: 0 },
                    { q: "Which activity is BOTH a creative art and a sport?", opts: ["Dance", "Reading", "Sleeping", "Cooking"], correct: 0 },
                    { q: "Why are sports important for Grade 7 learners?", opts: ["Build fitness & teamwork", "Make you tired only", "Avoid playing", "Reduce fun"], correct: 0 },
                    { q: "What is the main purpose of creative arts?", opts: ["To express ideas and emotions", "To win competitions only", "To draw perfectly", "To memorize songs"], correct: 0 },
                    { q: "Which is a component of Creative Arts?", opts: ["Visual Arts", "Biology", "Geography", "Grammar"], correct: 0 },
                    { q: "Sports and games help develop which life skill?", opts: ["Cooperation", "Selfishness", "Laziness", "Fear of failure"], correct: 0 },
                ];
                let pick = introVariants[(seed + i) % introVariants.length];
                qText = pick.q;
                opts = [...pick.opts];
                correct = pick.correct;
            } 
            else if (topicChoice === 1) { // COMPONENTS: VISUAL ARTS
                const visual = [
                    { q: "Which one is an element of art?", opts: ["Line", "Pencil", "Eraser", "Ruler"], correct: 0 },
                    { q: "The lightness or darkness of a colour is called?", opts: ["Value", "Hue", "Texture", "Shape"], correct: 0 },
                    { q: "Which material is used for drawing?", opts: ["Charcoal", "Hammer", "Saw", "Glue stick only"], correct: 0 },
                    { q: "What is a primary colour?", opts: ["Red", "Orange", "Green", "Purple"], correct: 0 },
                    { q: "Which of these is a component of Creative Arts in visual arts?", opts: ["Colour theory", "Multiplication", "Verbs", "Solar system"], correct: 0 },
                    { q: "Form in visual arts means?", opts: ["3D shape", "Flat drawing", "Colour wheel", "Texture only"], correct: 0 },
                    { q: "Which tool is used for painting?", opts: ["Brush", "Compass", "Ruler", "Calculator"], correct: 0 },
                    { q: "What does 'texture' mean in art?", opts: ["How surface feels", "Bright colours", "Large size", "Small size"], correct: 0 },
                ];
                let pick = visual[(seed + i*2) % visual.length];
                qText = pick.q;
                opts = [...pick.opts];
                correct = pick.correct;
            }
            else if (topicChoice === 2) { // COMPONENTS: MUSIC, DANCE, DRAMA
                const perf = [
                    { q: "Which is an element of music?", opts: ["Rhythm", "Friction", "Gravity", "Magnetism"], correct: 0 },
                    { q: "Dance involves movement of the body in ______.", opts: ["Rhythm", "Stillness", "Silence", "Sleeping"], correct: 0 },
                    { q: "What is drama?", opts: ["Acting a story", "Singing alone", "Drawing", "Running fast"], correct: 0 },
                    { q: "Pitch in music refers to?", opts: ["Highness or lowness of sound", "Loudness", "Speed", "Duration"], correct: 0 },
                    { q: "Which is a component of Creative Arts in performance?", opts: ["Role play", "Algebra", "Geology", "Astronomy"], correct: 0 },
                    { q: "A person who performs a role in a play is called?", opts: ["Actor/Actress", "Artist", "Director", "Audience"], correct: 0 },
                    { q: "Dynamics in music mean?", opts: ["Volume (loud/soft)", "Fast/slow", "High/low pitch", "Long/short notes"], correct: 0 },
                    { q: "Which dance style is part of Creative Arts?", opts: ["Traditional dance", "Running in place", "Weightlifting", "Sleep dance"], correct: 0 },
                ];
                let pick = perf[(seed + i) % perf.length];
                qText = pick.q;
                opts = [...pick.opts];
                correct = pick.correct;
            }
            else { // COMPONENTS: SPORTS (skills, rules, values)
                const sportsComp = [
                    { q: "Which is a basic sport skill?", opts: ["Throwing", "Reading", "Writing", "Drawing"], correct: 0 },
                    { q: "Fair play in sports means?", opts: ["Respecting rules & opponents", "Winning at all costs", "Cheating", "Arguing"], correct: 0 },
                    { q: "Which of these is a component of sports?", opts: ["Agility", "Multiplication tables", "Poems", "Sculpture"], correct: 0 },
                    { q: "What is teamwork?", opts: ["Working together", "Playing alone", "Fighting", "Spectating"], correct: 0 },
                    { q: "Which activity develops cardiovascular endurance?", opts: ["Running", "Sleeping", "Eating", "Painting"], correct: 0 },
                    { q: "In sports, a 'warm-up' helps to?", opts: ["Prevent injury", "Get tired", "Cool down", "Lose energy"], correct: 0 },
                    { q: "Which value is important in Creative Arts and Sports?", opts: ["Respect", "Greed", "Laziness", "Dishonesty"], correct: 0 },
                    { q: "Locomotor movement includes?", opts: ["Walking, running, hopping", "Sitting only", "Painting only", "Singing"], correct: 0 },
                ];
                let pick = sportsComp[(seed + i) % sportsComp.length];
                qText = pick.q;
                opts = [...pick.opts];
                correct = pick.correct;
            }
            
            // Ensure we have 4 distinct options
            if (opts.length !== 4) opts = ["Option A", "Option B", "Option C", "Option D"];
            // Create question object
            let questionObj = {
                questionText: qText,
                options: opts,
                correctIndex: correct
            };
            // shuffle answers (mix A,B,C,D)
            questionObj = shuffleAnswers(questionObj);
            const key = questionObj.questionText;
            if (usedKeys.has(key) && i < 38) {
                questionObj.questionText = questionObj.questionText + " (challenge)";
            }
            usedKeys.add(questionObj.questionText);
            questions.push(questionObj);
        }
        while(questions.length < 40) questions.push(shuffleAnswers({
            questionText: "What is a key component of Creative Arts?",
            options: ["Expression", "Calculation", "Memorization", "Isolation"],
            correctIndex: 0
        }));
        return questions.slice(0,40);
    }
    
    // generate all 5 levels of 40 questions each
    const levelsBank = [];
    for (let lvl = 1; lvl <= 5; lvl++) {
        levelsBank.push(generateQuestionsForLevel(lvl));
    }
    
    // GLOBAL GAME STATE
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    const questionsPerLevel = 40;
    let timerInterval = null;
    let timeLeft = 20;
    let answered = false;
    let waitingForNext = false;
    let selectedOptIdx = -1;
    
    // DOM elements
    const gameContainer = document.getElementById("gameRoot");
    const quizArea = document.getElementById("quizArea");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const currentScoreSpan = document.getElementById("currentScore");
    const maxScoreSpan = document.getElementById("maxLevelScore");
    const progressFillDiv = document.getElementById("progressFill");
    const timerNumberSpan = document.getElementById("timerNumber");
    
    // Voice synthesis function
    function speakText(message) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
    }
    
    // update UI (score, progress)
    function updateStatsUI() {
        currentScoreSpan.innerText = levelScore;
        maxScoreSpan.innerText = questionsPerLevel;
        let percent = (levelScore / questionsPerLevel) * 100;
        progressFillDiv.style.width = `${percent}%`;
    }
    
    // stop timer
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!answered && !waitingForNext && timeLeft > 0) {
                timeLeft--;
                timerNumberSpan.innerText = timeLeft;
                if (timeLeft <= 3) timerNumberSpan.style.background = "#ff8a7a";
                if (timeLeft === 0) {
                    stopTimer();
                    if (!answered && !waitingForNext) {
                        handleTimeout();
                    }
                }
            } else if (answered || waitingForNext) {
                // do nothing, timer should not count
            }
        }, 1000);
    }
    
    function resetTimer() {
        timeLeft = 20;
        timerNumberSpan.innerText = timeLeft;
        timerNumberSpan.style.background = "#f5e7c8";
        stopTimer();
        startTimer();
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        waitingForNext = true;
        const q = currentQuestions[currentIndex];
        const correctAnswerText = q.options[q.correctIndex];
        const msgDiv = document.getElementById("infoMsg");
        if (msgDiv) msgDiv.innerHTML = `⏰ TIME’S UP! The correct answer is: ${escapeHtml(correctAnswerText)}. No points added.`;
        speakText(`Time is up! The correct answer is ${correctAnswerText}.`);
        highlightOptions(q.correctIndex, -1);
        // no score increment
        updateStatsUI();
    }
    
    function handleAnswer(clickedIdx) {
        if (answered || waitingForNext) return;
        answered = true;
        stopTimer();
        const q = currentQuestions[currentIndex];
        const isCorrect = (clickedIdx === q.correctIndex);
        if (isCorrect) {
            levelScore++;
            updateStatsUI();
        }
        highlightOptions(q.correctIndex, clickedIdx);
        const msgDiv = document.getElementById("infoMsg");
        if (isCorrect) {
            msgDiv.innerHTML = `✅ CORRECT! +1 point! Awesome! 🎉`;
            speakText(`Correct! Great job, keep going!`);
        } else {
            msgDiv.innerHTML = `❌ WRONG! The correct answer was: ${escapeHtml(q.options[q.correctIndex])}. Don't give up!`;
            speakText(`Wrong answer. The correct answer is ${q.options[q.correctIndex]}. Keep trying!`);
        }
        waitingForNext = true;
    }
    
    function highlightOptions(correctIdx, chosenIdx) {
        const allOpts = document.querySelectorAll('.option');
        allOpts.forEach((opt, idx) => {
            opt.classList.remove('correct-feedback', 'wrong-feedback');
            if (idx === correctIdx) opt.classList.add('correct-feedback');
            if (idx === chosenIdx && idx !== correctIdx) opt.classList.add('wrong-feedback');
        });
    }
    
    function loadNextQuestionOrLevel() {
        if (!waitingForNext) return;
        // if last question of level
        if (currentIndex + 1 >= questionsPerLevel) {
            let percent = (levelScore / questionsPerLevel) * 100;
            if (percent >= 80) {
                if (currentLevel === 5) {
                    // VICTORY complete game
                    showCompletionCelebration(true);
                    return;
                } else {
                    // advance level
                    showLevelTransition(true, percent);
                    currentLevel++;
                    loadLevel(currentLevel);
                    return;
                }
            } else {
                // retry same level
                showLevelTransition(false, percent);
                loadLevel(currentLevel);
                return;
            }
        } else {
            // move to next question
            currentIndex++;
            answered = false;
            waitingForNext = false;
            renderCurrentQuestion();
        }
    }
    
    function showLevelTransition(passed, percent) {
        const message = passed ? `🎉✨ You passed Level ${currentLevel} with ${Math.floor(percent)}%! Moving to Level ${currentLevel+1}. ✨🎉` : `😓 Oops! ${Math.floor(percent)}% (need 80%). Repeating Level ${currentLevel}. Keep practicing! 💪`;
        speakText(passed ? `Excellent! You passed level ${currentLevel}. Proceeding to next level.` : `You need 80 percent to pass. Repeating level ${currentLevel}.`);
        alert(message); // simple alert but ensures user knows
    }
    
    function showCompletionCelebration() {
        stopTimer();
        quizArea.innerHTML = `
            <div class="question-panel" style="text-align:center">
                <div class="question-text">🏆🏅 GRAND MASTER CHAMPION (GRADE 7)! 🏅🏆<br>You completed all 5 levels with 80%+!<br>You truly excel in Creative Arts & Sports!</div>
                <button class="next-btn" id="restartChamp">🌟 PLAY AGAIN 🌟</button>
            </div>
        `;
        speakText(`Congratulations, champion! You have mastered all levels of Creative Arts and Sports. You are a star for Grade 7!`);
        document.getElementById("restartChamp")?.addEventListener('click', () => {
            currentLevel = 1;
            loadLevel(1);
        });
    }
    
    function renderCurrentQuestion() {
        if (!currentQuestions.length) return;
        const q = currentQuestions[currentIndex];
        const letterLabels = ['A', 'B', 'C', 'D'];
        const optionsHtml = q.options.map((opt, idx) => `<div class="option" data-opt-index="${idx}">${letterLabels[idx]}. ${escapeHtml(opt)}</div>`).join('');
        const html = `
            <div class="question-panel">
                <div class="question-text">${escapeHtml(q.questionText)}</div>
                <button class="speaker-button" id="readQuestionBtn">🔊 Read Question Aloud</button>
            </div>
            <div class="options-grid" id="optionsGrid">
                ${optionsHtml}
            </div>
            <button class="next-btn" id="nextQuestionBtn">➡ NEXT QUESTION</button>
            <div id="infoMsg" class="info-message"></div>
        `;
        quizArea.innerHTML = html;
        // attach listeners
        document.querySelectorAll('.option').forEach(optDiv => {
            optDiv.addEventListener('click', (e) => {
                const idx = parseInt(optDiv.dataset.optIndex);
                if (!answered && !waitingForNext) handleAnswer(idx);
            });
        });
        const nextBtn = document.getElementById("nextQuestionBtn");
        nextBtn.addEventListener('click', () => {
            if (!answered && !waitingForNext) {
                // user didn't answer and clicked next? force wrong/timeout effect
                handleTimeout();
            } else if (waitingForNext) {
                loadNextQuestionOrLevel();
            }
        });
        const readBtn = document.getElementById("readQuestionBtn");
        if (readBtn) readBtn.addEventListener('click', () => speakText(q.questionText));
        answered = false;
        waitingForNext = false;
        resetTimer();
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = levelsBank[level-1];
        currentIndex = 0;
        levelScore = 0;
        answered = false;
        waitingForNext = false;
        stopTimer();
        timeLeft = 20;
        timerNumberSpan.innerText = "20";
        timerNumberSpan.style.background = "#f5e7c8";
        levelDisplaySpan.innerText = `LEVEL ${currentLevel}`;
        updateStatsUI();
        renderCurrentQuestion();
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // start game
    loadLevel(1);
</script>
</body>
</html>
