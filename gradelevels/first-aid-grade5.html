<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Toti's Secret | CBC Grade 5 English – Accident Prevention & Grammar Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a3c34 0%, #0e2a24 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fffef5;
            background-image: radial-gradient(circle at 10% 20%, rgba(110, 180, 140, 0.08) 2%, transparent 2.5%);
            background-size: 30px 30px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,250,210,0.9);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #6abf8f;
        }

        .game-header {
            background: linear-gradient(98deg, #2d6a4f, #1f8a5c);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #f4c542;
        }

        .level-badge {
            background: #f4c542;
            color: #1f5e4b;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #c58f2a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #175a48;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #ffe1a0;
            margin-right: 6px;
        }

        .progress-area {
            background: #e6dcc5;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #8b6946;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #f3b33d;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #4f3a22;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #b7c9b1;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #1b4e3f;
            border: 1px solid #cbe5cf;
        }

        .voice-btn {
            background: #2f8b5e;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #1e4a3a;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e4a3a;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #2f6b58;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #9bcdb0;
            border-radius: 60px;
            background: #fffff2;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #f3b33d;
            box-shadow: 0 0 0 3px rgba(243,179,61,0.3);
        }

        .hint-message {
            background: #faf4e3;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #7b5a39;
            font-style: italic;
            border-left: 7px solid #5fad82;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #2d6a4f;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #154f3f;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #154f3f;
        }

        .submit-btn {
            background: #f3b33d;
            color: #2c3a1f;
            box-shadow: 0 4px 0 #b8681a;
            flex: 2;
        }

        .next-btn {
            background: #4f8a72;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #fff0dd;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #f1c40f;
        }

        .timer.warning {
            color: #ffcf9a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>🔮 SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">Unlocking Toti's secret...</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word/phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). Stay safe!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // TOTI'S SECRET – CBC Grade 5 English
    // Topics: Listening, Speaking, Reading (Narrative "Toti's Secret"),
    // Grammar: Use of "must" and "should",
    // Writing, Handwriting on accidents prevention.
    // 5 levels x 30 questions. Timer 40s. Pass 80% to advance.
    // Voice output, fully responsive, open-ended. Hints when time ≤12s.
    // --------------------------------------------------------------

    // Generate rich, varied question bank for each level (150 total)
    function generateBankForLevel(level) {
        const bank = [];
        // Six strands: 0:Grammar(must/should) 1:Narrative (Toti's secret) 2:Accident Prevention 3:Listening/Speaking 4:Writing/Handwriting 5:Pronunciation/Reading extras
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            // dynamic category mixing per level to keep fresh
            let category = (i + level * 2) % 6;
            if (level === 1) category = i % 6;
            if (level === 2) category = (i + 3) % 6;
            if (level === 3) category = (i + 1) % 6;
            if (level === 4) category = (i + 4) % 6;
            if (level === 5) category = (i + 2) % 6;

            if (category === 0) { // Grammar: must / should
                const grammarBank = [
                    { q: "You ______ obey traffic rules to prevent accidents. (must/should)", ans: "must", hint: "strong obligation" },
                    { q: "We ______ always look both sides before crossing.", ans: "must", hint: "necessary rule" },
                    { q: "Children ______ wear helmets when cycling.", ans: "should", hint: "good advice" },
                    { q: "You ______ play with matches – it's dangerous.", ans: "must not", hint: "prohibition" },
                    { q: "Drivers ______ stop at red lights.", ans: "must", hint: "compulsory" },
                    { q: "We ______ keep first aid kits at home.", ans: "should", hint: "recommended" },
                    { q: "You ______ run on wet floors. (must not / should not)", ans: "must not", hint: "strong warning" }
                ];
                const pick = grammarBank[i % grammarBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Narrative: "Toti's Secret" (reading comprehension)
                const narrativeBank = [
                    { q: "In 'Toti's Secret', Toti discovered a hidden ______ in the forest.", ans: "path", hint: "trail/way" },
                    { q: "Toti's secret was about preventing ______ (accidents/fires).", ans: "accidents", hint: "unexpected harms" },
                    { q: "The wise elder said: 'You ______ always tell an adult if you see danger.'", ans: "must", hint: "strong advice" },
                    { q: "Toti learned that keeping secrets about safety is ______ (dangerous).", ans: "dangerous", hint: "risky" },
                    { q: "What did Toti promise at the end? To be ______ (careful).", ans: "careful", hint: "cautious" },
                    { q: "The secret message was: 'Prevention is better than ______.'", ans: "cure", hint: "treatment" }
                ];
                const pick = narrativeBank[i % narrativeBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Accident Prevention (knowledge & writing prompts)
                const preventBank = [
                    { q: "To prevent burns, you ______ keep hot liquids away from edges.", ans: "should", hint: "recommended action" },
                    { q: "Always use a ______ when crossing the road near a zebra crossing.", ans: "crosswalk", hint: "marked path" },
                    { q: "Store medicines in a ______ cabinet.", ans: "locked", hint: "secured" },
                    { q: "Wear ______ while riding a bicycle.", ans: "helmet", hint: "head protection" },
                    { q: "Clean spills immediately to avoid ______ (slipping).", ans: "slipping", hint: "fall risk" },
                    { q: "You ______ play with sharp objects.", ans: "must not", hint: "forbidden" }
                ];
                const pick = preventBank[i % preventBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Listening & Speaking (dialogue, advice, safety talk)
                const listenBank = [
                    { q: "When someone gives safety advice, you should ______ carefully.", ans: "listen", hint: "pay attention" },
                    { q: "Speak ______ when warning others about danger.", ans: "clearly", hint: "not mumbling" },
                    { q: "In an emergency, you should shout for ______.", ans: "help", hint: "assistance" },
                    { q: "After listening to safety rules, you ______ follow them.", ans: "must", hint: "obligation" },
                    { q: "A good speaker uses a ______ tone to show seriousness.", ans: "calm", hint: "not panicky" }
                ];
                const pick = listenBank[i % listenBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 4) { // Writing & Handwriting (accident prevention compositions)
                const writeBank = [
                    { q: "In a composition about safety, begin with a capital letter and end with a ______.", ans: "period", hint: "punctuation" },
                    { q: "Good handwriting makes your message ______ (legible).", ans: "legible", hint: "readable" },
                    { q: "Write this safety rule: 'You ______ wash hands before eating.' (must/should)", ans: "should", hint: "good habit" },
                    { q: "To improve handwriting, write on ______ paper.", ans: "lined", hint: "ruled sheets" },
                    { q: "List three safety rules: first, ______.", ans: "look", hint: "observe before crossing" }
                ];
                const pick = writeBank[i % writeBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Pronunciation & reading aloud / safety chant
                const pronBank = [
                    { q: "The word 'accident' has ______ syllables.", ans: "three", hint: "ac-ci-dent (3)" },
                    { q: "Say 'prevention' – stress on second syllable: pre______tion.", ans: "ven", hint: "the 'ven' part" },
                    { q: "The 'c' in 'safety' sounds like /______/ (s/k).", ans: "s", hint: "soft c" },
                    { q: "Read aloud: 'You ______ avoid running indoors.' (must/should)", ans: "should", hint: "advisory" }
                ];
                const pick = pronBank[i % pronBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech synthesis
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 A hint appears when timer ≤12s. Stay alert and prevent accidents!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ TIME'S UP! Toti's secret revealed: correct answer was "${currentCorrectAnswer.toUpperCase()}". Press NEXT.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "✨ Discover Toti's secret — type your answer wisely! ✨";
        hintArea.innerHTML = "💡 Hint shows when timer ≤12 seconds. Keep safe!";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT to continue your adventure.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        const correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible, grade 5 friendly matching
        if (userAns === correct) isCorrect = true;
        else if (correct === "must not" && (userAns === "mustn't" || userAns === "must not")) isCorrect = true;
        else if (correct === "should not" && (userAns === "shouldn't" || userAns === "should not")) isCorrect = true;
        else if (correct === "must" && userAns === "have to") isCorrect = true;
        else if (correct === "should" && (userAns === "ought to" || userAns === "need to")) isCorrect = true;
        else if (correct === "careful" && userAns === "cautious") isCorrect = true;
        else if (correct === "accidents" && userAns === "accident") isCorrect = true;
        else if (correct === "helmet" && userAns === "headgear") isCorrect = true;
        else if (correct === "crosswalk" && (userAns === "zebra crossing" || userAns === "crossing")) isCorrect = true;
        else if (correct === "legible" && userAns === "readable") isCorrect = true;
        else if (correct === "listen" && userAns === "hear") isCorrect = false; // subtle
        else if (userAns.includes(correct) && correct.length > 3 && !correct.includes(" ")) isCorrect = true;
        else if (correct.includes(userAns) && userAns.length > 2) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! You're learning Toti's secret of safety.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ OOPS! The correct answer is "${correct.toUpperCase()}". You typed "${userAns}". Remember: prevention is key!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first, or let the timer finish.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 TOTI'S SECRET MASTER! 🏆", `You unlocked all secrets with ${percent.toFixed(0)}%! You know how to prevent accidents and use 'must' & 'should' correctly.`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉`, `You scored ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}? Toti is proud!`, false);
            }
        } else {
            showLevelTransition(`⚠️ SECRET NOT YET UNLOCKED`, `You got ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to improve your safety knowledge.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">🔁 PLAY AGAIN 🔁</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the game
    initLevel();
</script>
</body>
</html>
