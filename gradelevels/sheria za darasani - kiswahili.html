<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sheria za Darsani - Darasa la 2 CBC | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2c5f8a 0%, #1a3f5c 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #2c5f8a;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi: 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        📚📏 Sheria za Darsani! Jifunze kusikiliza, kuzungumza, kusoma na kuandika sheria za darasa.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Swali litakuja hapa...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Soma Swali</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Andika jibu lako hapa..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Angalia</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Jifunze sheria za darasani! Andika jibu sahihi. Bonyeza kitufe cha sauti kusikia swali.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- SAUTI KWA KISWAHILI ----------
    function speakKiswahili(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.85;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakKiswahili("Subiri, swali hili tayari limejibiwa. Swali linalofuata linakuja.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakKiswahili(qData.text);
        else speakKiswahili("Hakuna swali kwa sasa.");
    }

    // ---------- MASWALI: Sheria za Darsani (Kusikiliza, Kuzungumza, Kusoma, Kuandika) ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // KUSIKILIZA - Sheria za kusikiliza darasani
        const kusikiliza = [
            { q: "Mwalimu anapozungumza, wanafunzi wanapaswa kum______.", a: "sikiliza" },
            { q: "Kusikiliza kwa makini darasani kunatusaidia kuelewa ______.", a: "somo" },
            { q: "Tunapaswa kufunga ______ wakati mwalimu anafundisha.", a: "midomo" },
            { q: "Kusikiliza ni alama ya ______ na heshima kwa mwalimu.", a: "adabu" },
            { q: "Mwanafunzi anayesikiliza vizuri hujibu ______ kwa usahihi.", a: "maswali" },
            { q: "Tunapaswa kuepuka ______ wakati wa somo.", a: "makelele" },
            { q: "Kusikiliza sheria za darasa kunatusaidia kuwa ______.", a: "wanafunzi wema" },
            { q: "Mwalimu anaposoma, tunapaswa kusikiliza bila ______.", a: "kuzungumza" },
            { q: "Kusikiliza kwa makini ni sehemu ya ______ bora darasani.", a: "mwenendo" },
            { q: "Tunapaswa kuwa ______ tunaposikiliza maelekezo ya mwalimu.", a: "makini" }
        ];
        
        // KUZUNGUMZA - Sheria za kuzungumza darasani
        const kuzungumza = [
            { q: "Tunapozungumza darasani, tunapaswa kuinua ______ kwanza.", a: "mkono" },
            { q: "Kuzungumza kwa ______ ni jambo la adabu darasani.", a: "upole" },
            { q: "Tunapaswa kusubiri ______ yetu kuzungumza.", a: "zamu" },
            { q: "Kuzungumza kwa sauti ______ huwakera wengine.", a: "kubwa" },
            { q: "Tunapaswa kuzungumza kwa lugha ya ______ kwa wenzetu.", a: "heshima" },
            { q: "Mwalimu anapouliza swali, tunapaswa kujibu kwa ______.", a: "ukweli" },
            { q: "Kuzungumza bila ruhusa kunaitwa ______.", a: "kuzungumza ovyo" },
            { q: "Tunapaswa kutumia maneno ya ______ tunapozungumza na wengine.", a: "taadhima" },
            { q: "Kuzungumza kwa ______ kunasaidia kuweka amani darasani.", a: "utulivu" },
            { q: "Tunapaswa kuepuka kum______ mwanafunzi mwenzetu.", a: "dhihaki" }
        ];
        
        // KUSOMA - Sheria za kusoma darasani
        const kusoma = [
            { q: "Tunaposoma darasani, tunapaswa kukaa ______.", a: "vizuri" },
            { q: "Kusoma kwa sauti huitwa ______ kwa sauti.", a: "kusoma" },
            { q: "Tunapaswa kusoma ______ yetu kwa umakini.", a: "kitabu" },
            { q: "Kusoma kunatusaidia kupata ______ mpya.", a: "maarifa" },
            { q: "Tunapaswa kusoma ______ ili kuelewa vizuri.", a: "taratibu" },
            { q: "Mwalimu anaposoma hadithi, tunapaswa kumsikiliza na ku______.", a: "fuata" },
            { q: "Kusoma kila siku kunaboresha ujuzi wa ______.", a: "lugha" },
            { q: "Tunapaswa kuwa na ______ wakati wa kusoma.", a: "umakini" },
            { q: "Kusoma sheria za darasa kunatusaidia kujua ______ zetu.", a: "majukumu" },
            { q: "Kitabu cha kusoma kinapaswa kutunzwa kwa ______.", a: "usafi" }
        ];
        
        // KUANDIKA - Sheria za kuandika darasani
        const kuandika = [
            { q: "Tunapoandika darasani, tunapaswa kutumia ______ au penseli.", a: "kalamu" },
            { q: "Kuandika kwa ______ ni jambo la kuvutia.", a: "maridadi" },
            { q: "Tunapaswa kuandika kwenye ______ yetu.", a: "daftari" },
            { q: "Kuandika kwa usafi kunasaidia kusomeka ______.", a: "vizuri" },
            { q: "Tunapaswa kuandika kwa ______ ili tusiwe na makosa.", a: "upeo" },
            { q: "Baada ya kuandika, tunapaswa kusoma tena ______ yetu.", a: "kazi" },
            { q: "Kuandika sheria za darasa kunatusaidia kuzikumbuka ______.", a: "kwa urahisi" },
            { q: "Tunapaswa kuandika tarehe na ______ kwenye kila ukurasa.", a: "kichwa" },
            { q: "Kuandika kwa haraka kunaweza kusababisha ______.", a: "makosa" },
            { q: "Daftari letu linapaswa kuwa safi na ______.", a: "nadhifu" }
        ];
        
        const allTopics = [...kusikiliza, ...kuzungumza, ...kusoma, ...kuandika];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Mwalimu anapofundisha, wanafunzi wote wanapaswa kusikiliza kwa ______.";
                correctAnswer = "makini";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "Kabla ya kuzungumza darasani, unapaswa kuinua ______ yako juu.";
                correctAnswer = "mkono";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "Wakati wa kusoma, tunapaswa kukaa ______ na kuzingatia kitabu chetu.";
                correctAnswer = "vizuri";
            }
            if (i % 8 === 0) {
                qText = "Kuandika kwa ______ ni jambo linalompendeza mwalimu.";
                correctAnswer = "maridadi";
            }
            if (i % 9 === 0) {
                qText = "Tunapaswa kuzingatia sheria za darasa ili kuwa ______ wema.";
                correctAnswer = "wanafunzi";
            }
            if (i % 11 === 0) {
                qText = "Kusikiliza kwa makini hukusaidia kuelewa somo ______.";
                correctAnswer = "vizuri";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Alama: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakKiswahili(`Wakati umekwisha! Jibu sahihi ni ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Wakati umekwisha! Jibu sahihi: <strong>${correctAns}</strong>. Tunasonga kwenye swali linalofuata.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Andika jibu lako! Bonyeza kitufe cha sauti kusikia swali tena. Kumbuka sheria za darasani!";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Ngazi 1: Kusikiliza sheria za darasani! Jifunze kusikiliza kwa makini mwalimu.";
        else if (currentLevel === 2) levelDesc = "Ngazi 2: Kuzungumza kwa heshima darasani! Inua mkono kabla ya kuzungumza.";
        else if (currentLevel === 3) levelDesc = "Ngazi 3: Kusoma sheria za darasani! Soma kwa umakini na uelewe.";
        else if (currentLevel === 4) levelDesc = "Ngazi 4: Kuandika sheria za darasani! Andika kwa usafi na maridadi.";
        else levelDesc = "Ngazi 5: Ngazi ya mwisho! Kuwa Bingwa wa Sheria za Darsani Darasa la 2!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Swali ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Unahitaji angalau ${reqPass} sahihi kusonga mbele. ⏱️ 40s/swali.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 HONGERA SANA! Umemaliza ngazi zote 5! Wewe ni Bingwa wa Sheria za Darsani Darasa la 2! 🏆🎉";
                speakKiswahili("Hongera! Umemaliza ngazi zote tano. Wewe ni bingwa wa sheria za darasani! Endelea kusikiliza, kuzungumza, kusoma na kuandika kwa adabu!");
                storyAreaDiv.innerHTML = "🏁 MCHEZO UMEMALIZIKA! Sasa unajua sheria zote za darasani! Tunakupongeza kwa kuwa mwanafunzi mwema! 📚📏✨";
                nextLevelMsgDiv.innerHTML = "✨ UMESHINDA! Bonyeza Refresh kucheza tena ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 Umefuzu! Alama: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Unaenda Ngazi ${currentLevel+1}! 🎉`;
                speakKiswahili(`Hongera! Umepita ngazi ${currentLevel}. Sasa unaenda ngazi ${currentLevel+1}. Endelea kujifunza sheria za darasani!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Nenda Ngazi ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Pole! Hukufika 80%. Alama: ${scoreCorrect}/${totalQuestionsInLevel}. Unahitaji ${required}. Jaribu Ngazi ${currentLevel} tena.`;
            speakKiswahili(`Pole! Unahitaji angalau asilimia themanini kupita. Una alama ${scoreCorrect} kati ya ${totalQuestionsInLevel}. Tafadhali jaribu ngazi ${currentLevel} tena. Kumbuka sheria za darasani!`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Jaribu Ngazi ${currentLevel} Tena`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Ngazi: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Jifunze sheria za darasani! Andika jibu lako. Bonyeza kitufe cha sauti kusikia swali.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Tafadhali andika jibu! Kumbuka sheria za darasani - andika jibu lako kwa usafi.";
            speakKiswahili("Tafadhali andika jibu.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for Kiswahili answers
        if (!isCorrect) {
            const forgiving = {
                "sikiliza": ["msikilize", "sikilizeni", "sikia"],
                "somo": ["masomo", "funzo", "mafunzo"],
                "midomo": ["mdomo", "kinywa"],
                "adabu": ["heshima", "staha", "taadhima"],
                "maswali": ["swali", "majibu"],
                "makelele": ["kelele", "ngurumo", "fujo"],
                "wanafunzi wema": ["wanafunzi wazuri", "wanafunzi bora"],
                "kuzungumza": ["kuongea", "kusema"],
                "mwenendo": ["tabia", "maadili"],
                "makini": ["kwa makini", "umakini", "mwangalifu"],
                "mkono": ["mikono", "mkononi"],
                "upole": ["laini", "taratibu"],
                "zamu": ["nafasi", "fursa"],
                "kubwa": ["sauti kubwa", "kelele kubwa"],
                "heshima": ["staha", "adabu"],
                "ukweli": ["kweli", "sahihi"],
                "kuzungumza ovyo": ["kuzungumza bila ruhusa", "kusema ovyo"],
                "taadhima": ["heshima", "staha"],
                "utulivu": ["amani", "kimya"],
                "dhihaki": ["kejeli", "kumdhihaki"],
                "vizuri": ["safi", "vyema", "nzuri"],
                "kusoma": ["soma", "kujisomea"],
                "kitabu": ["kijitabu", "kitabu chako"],
                "maarifa": ["elimu", "ujuzi"],
                "taratibu": ["polepole", "kwa utulivu"],
                "fuata": ["fuata maelekezo", "zingatia"],
                "lugha": ["kiswahili", "sarufi"],
                "umakini": ["makini", "uzingatiaji"],
                "majukumu": ["kazi", "wajibu"],
                "usafi": ["safi", "nadhifu"],
                "kalamu": ["kalamu ya wino", "penseli"],
                "maridadi": ["uzuri", "nadhifu", "mzuri"],
                "daftari": ["daftari lako", "kitabu cha mazoezi"],
                "upeo": ["makini", "uzingatiaji"],
                "kazi": ["kazi yako", "mazoezi"],
                "kwa urahisi": ["urahisi", "kwa haraka"],
                "kichwa": ["kichwa cha habari", "tarehe"],
                "makosa": ["dosari", "hitilafu"],
                "nadhifu": ["safi", "maridadi"],
                "wanafunzi": ["wanafunzi wema", "watoto wa shule"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Sahihi kabisa! "${currentQ.answer}" ni jibu zuri! +1 alama ✅`;
            speakKiswahili(`Sahihi! Jibu ni ${currentQ.answer}. Umepata alama! Endelea kuzingatia sheria za darasani!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Si sahihi. Jibu sahihi ni: "${currentQ.answer}. Kumbuka sheria za darasani - sikiliza, zungumza kwa heshima, soma na andika kwa usafi!" ❌`;
            speakKiswahili(`Sio sahihi. Jibu sahihi ni ${currentQ.answer}. Usikate tamaa! Tafadhali jaribu tena!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo wa Sheria za Darsani! Jifunze kusikiliza, kuzungumza, kusoma na kuandika kwa kufuata sheria za darasani. Una sekunde arobaini kwa kila swali. Bonyeza kitufe cha sauti kusikia swali. Andika jibu lako. Kumbuka: Inua mkono kabla ya kuzungumza, sikiliza mwalimu, soma kwa makini, na andika kwa usafi!");
        }, 500);
    });
</script>
</body>
</html>
