<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Grade 1 CBC Maths | Measuring Length | Fixed Units (Paperclips, Cubes, Footsteps)</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #2c7da0 0%, #1f5068 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fffef7;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), inset 0 1px 3px rgba(255, 250, 210, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: #61a5c2;
            padding: 16px 18px 12px;
            text-align: center;
            border-bottom: 4px solid #2c7da0;
        }

        .level-badge {
            background: #1f5068;
            display: inline-block;
            padding: 5px 22px;
            border-radius: 50px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
        }

        .stars {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .star {
            font-size: 24px;
            color: #ffc107;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-progress {
            background: #fff3e0;
            margin: 10px 12px 0;
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
            color: #5a3a1a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-card {
            padding: 18px 18px 20px;
        }

        .question-area {
            background: #ffffff;
            padding: 22px 14px;
            border-radius: 48px;
            box-shadow: inset 0 0 0 3px #cfe8f0, 0 6px 12px rgba(0,0,0,0.05);
            border: 1px solid #a9d6e5;
            margin-bottom: 18px;
            text-align: center;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1f5068;
            margin-bottom: 12px;
            word-break: break-word;
            line-height: 1.3;
        }

        .math-visual {
            font-size: 1.4rem;
            background: #e8f4f8;
            padding: 12px;
            border-radius: 40px;
            margin-top: 8px;
            color: #2c7da0;
            font-weight: bold;
        }

        .ruler-icons {
            font-size: 1.8rem;
            letter-spacing: 6px;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .timer-circle {
            background: #2c7da0;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            font-family: monospace;
            box-shadow: 0 4px 0 #1f5068;
            transition: 0.1s;
        }

        .warning {
            background: #c0392b;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); background-color: #c0392b; }
            100% { transform: scale(1.05); background-color: #e67e22; }
        }

        .hint-box {
            background: #ffe0b5;
            border-radius: 35px;
            padding: 8px 14px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #b45f1b;
        }

        .answer-input-area {
            margin: 16px 0;
        }

        .answer-input {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            text-align: center;
            border-radius: 55px;
            border: 3px solid #61a5c2;
            background: white;
            font-family: monospace;
            font-weight: bold;
            color: #2d5a2c;
            outline: none;
            -webkit-appearance: none;
        }

        .answer-input:focus {
            border-color: #2c7da0;
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }

        .submit-btn {
            background: #52b788;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .voice-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .voice-btn {
            background: #2a9d8f;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .voice-btn.speaker {
            background: #e76f51;
        }

        .status-msg {
            background: #efe0c9;
            border-radius: 35px;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        .next-btn {
            background: #61a5c2;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-area {
            text-align: center;
            margin: 12px 15px 15px;
        }

        .reset-btn {
            background: #b4813c;
            border: none;
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            body { padding: 12px; }
            .question-text { font-size: 1.2rem; }
            .math-visual { font-size: 1rem; }
            .answer-input { font-size: 1.2rem; padding: 14px; }
            .timer-circle { width: 60px; height: 60px; font-size: 1.7rem; }
            .submit-btn, .next-btn { padding: 12px; font-size: 1rem; }
            .ruler-icons { font-size: 1.3rem; }
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            background: #ebd5b3;
            padding: 8px;
            color: #4a3720;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">📏 LEVEL 1 / 5</div>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <div class="score-progress">
            <span>🏆 SCORE: <span id="currentScore">0</span></span>
            <span>✅ NEED 80% ➡️ <span id="requiredInfo">0/24</span></span>
        </div>
    </div>
    <div class="quiz-card">
        <div class="question-area">
            <div class="question-text" id="questionText">🌟 Measure length with fixed units! 🌟</div>
            <div class="math-visual" id="mathVisual"></div>
        </div>
        <div class="timer-area"><div class="timer-circle" id="timerCircle">40</div></div>
        <div class="hint-box" id="hintBox">💡 Hint will appear here when time is low 💡</div>
        
        <div class="answer-input-area">
            <input type="number" id="answerInput" class="answer-input" placeholder="Type your answer..." inputmode="numeric" autocomplete="off">
        </div>
        <button class="submit-btn" id="submitBtn">✅ SUBMIT ANSWER</button>
        
        <div class="voice-actions">
            <button class="voice-btn speaker" id="speakBtn">🔊 READ QUESTION</button>
        </div>
        
        <div class="status-msg" id="statusMsg">✨ How many units long? Type the number. 40 seconds. ✨</div>
        <button class="next-btn" id="nextBtn" disabled>➡️ NEXT QUESTION</button>
        <div class="reset-area"><button class="reset-btn" id="resetGameBtn">🔄 RESTART GAME</button></div>
    </div>
    <footer>📏 Measuring length using fixed units (paperclips, cubes, hands, footsteps, crayons) | Grade 1 CBC Maths</footer>
</div>

<script>
    // ======================= QUESTION BANK: Measuring Length with Fixed Units =======================
    // Topics: paperclips, cubes, hands, footsteps, crayons, erasers, matches
    // Each question presents a visual/text description of an object measured with a fixed unit.
    // Student must count how many units long the object is.
    
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        
        // Different fixed units and objects
        const unitTypes = [
            { name: "paperclips", icon: "📎", emoji: "📎", plural: "paperclips", singular: "paperclip" },
            { name: "cubes", icon: "🧊", emoji: "🧊", plural: "cubes", singular: "cube" },
            { name: "hands", icon: "🖐️", emoji: "🖐️", plural: "hands", singular: "hand" },
            { name: "footsteps", icon: "👣", emoji: "👣", plural: "footsteps", singular: "footstep" },
            { name: "crayons", icon: "🖍️", emoji: "🖍️", plural: "crayons", singular: "crayon" },
            { name: "erasers", icon: "🧽", emoji: "🧽", plural: "erasers", singular: "eraser" },
            { name: "matches", icon: "🪶", emoji: "🪶", plural: "matches", singular: "match" }
        ];
        
        // Object length scenarios (how many units long)
        const scenarios = [
            { object: "pencil", lengths: [3,4,5,6,7,8], visualPrefix: "✏️" },
            { object: "book", lengths: [5,6,7,8,9,10], visualPrefix: "📚" },
            { object: "table", lengths: [8,9,10,11,12], visualPrefix: "🪑" },
            { object: "ruler", lengths: [4,5,6,7], visualPrefix: "📏" },
            { object: "crayon", lengths: [2,3,4,5], visualPrefix: "🖍️" },
            { object: "shoe", lengths: [4,5,6,7], visualPrefix: "👟" },
            { object: "water bottle", lengths: [4,5,6,7,8], visualPrefix: "💧" },
            { object: "phone", lengths: [3,4,5,6], visualPrefix: "📱" }
        ];
        
        // Generate 30 unique questions mixing different units and objects
        for (let i = 0; i < 30; i++) {
            let questionObj = null;
            let attempts = 0;
            
            while (!questionObj && attempts < 50) {
                const unit = unitTypes[Math.floor(Math.random() * unitTypes.length)];
                const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
                const length = scenario.lengths[Math.floor(Math.random() * scenario.lengths.length)];
                const key = `${unit.name}_${scenario.object}_${length}`;
                
                if (!usedKeys.has(key)) {
                    usedKeys.add(key);
                    const unitPlural = unit.plural;
                    const unitSingular = unit.singular;
                    const unitIcon = unit.icon;
                    
                    // Create visual representation of the length using the unit icon
                    const visualUnits = unitIcon.repeat(Math.min(length, 15));
                    const visualText = `${scenario.visualPrefix || "📐"} ${scenario.object} = ${visualUnits} (${length} ${length === 1 ? unitSingular : unitPlural})`;
                    
                    const questionText = `The ${scenario.object} is ${visualUnits} ${unitPlural} long. How many ${unitPlural} is that?`;
                    const cleanQuestion = `How many ${unitPlural} long is the ${scenario.object}? ${unitIcon.repeat(length)}`;
                    
                    questionObj = {
                        type: "length",
                        text: `How many ${unitPlural} long is the ${scenario.object}?`,
                        visual: `${unitIcon.repeat(length)} (${length} ${unitPlural})`,
                        answer: length,
                        hint: `Count the ${unitPlural} carefully. Each ${unitSingular} is one unit. There are ${length} ${unitPlural}.`
                    };
                }
                attempts++;
            }
            
            if (!questionObj) {
                // fallback
                questionObj = {
                    type: "length",
                    text: "How many paperclips long is the pencil? 📎📎📎📎📎",
                    visual: "📎📎📎📎📎 (5 paperclips)",
                    answer: 5,
                    hint: "Count the paperclips: 5 paperclips."
                };
            }
            questions.push(questionObj);
        }
        
        // Add more variety with direct measurement comparison questions
        const extraQuestions = [
            { text: "A crayon is 4 paperclips long. How many paperclips?", visual: "🖍️ = 📎📎📎📎", ans: 4, hint: "Count the paperclips: 4" },
            { text: "A book measures 6 cubes long. How many cubes?", visual: "📚 = 🧊🧊🧊🧊🧊🧊", ans: 6, hint: "There are 6 cubes" },
            { text: "The table is 8 hands long. How many hands?", visual: "🪑 = 🖐️🖐️🖐️🖐️🖐️🖐️🖐️🖐️", ans: 8, hint: "8 hands" },
            { text: "A pencil is 5 paperclips long. How many paperclips?", visual: "✏️ = 📎📎📎📎📎", ans: 5, hint: "5 paperclips" },
            { text: "The desk is 10 footsteps long. How many footsteps?", visual: "🪑 = 👣👣👣👣👣👣👣👣👣👣", ans: 10, hint: "10 footsteps" }
        ];
        
        for (let eq of extraQuestions) {
            if (questions.length < 30 && !usedKeys.has(eq.text)) {
                usedKeys.add(eq.text);
                questions.push({
                    type: "length",
                    text: eq.text,
                    visual: eq.visual,
                    answer: eq.ans,
                    hint: eq.hint
                });
            }
        }
        
        // Ensure 30 questions
        while (questions.length < 30) {
            const fallback = { text: "How many cubes long is the crayon? 🧊🧊🧊", visual: "🧊🧊🧊 (3 cubes)", ans: 3, hint: "3 cubes" };
            questions.push(fallback);
        }
        
        // Shuffle
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        return questions;
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let lockAnswer = false;
    let currentQuestionObj = null;
    
    // DOM elements
    const questionTextEl = document.getElementById("questionText");
    const mathVisualEl = document.getElementById("mathVisual");
    const timerCircle = document.getElementById("timerCircle");
    const hintBox = document.getElementById("hintBox");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetGameBtn");
    const speakBtn = document.getElementById("speakBtn");
    const statusMsg = document.getElementById("statusMsg");
    const currentScoreSpan = document.getElementById("currentScore");
    const requiredInfoSpan = document.getElementById("requiredInfo");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const starRatingSpan = document.getElementById("starRating");
    
    // Speech synthesis with pause between "Time is up" and "moving to the next question"
    function speakWithPause(phrases, pauseMs = 900) {
        if (!window.speechSynthesis) return;
        const items = Array.isArray(phrases) ? phrases : [phrases];
        window.speechSynthesis.cancel();
        function speakNext(index) {
            if (index >= items.length) return;
            const utterance = new SpeechSynthesisUtterance(items[index]);
            utterance.lang = "en-US";
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.onend = () => {
                setTimeout(() => speakNext(index + 1), pauseMs);
            };
            window.speechSynthesis.speak(utterance);
        }
        speakNext(0);
    }
    
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
    
    function announceTimeUp() {
        speakWithPause(["Time is up", "moving to the next question"], 900);
        statusMsg.innerText = "⏰ TIME IS UP! Moving to next question... ⏰";
    }
    
    function readQuestionAloud() {
        if (currentQuestionObj) {
            speakText(`Question: ${currentQuestionObj.text} Count the units.`);
            statusMsg.innerText = "🔊 Reading question...";
            setTimeout(() => statusMsg.innerText = "✅ Type your answer and click submit!", 2000);
        }
    }
    
    function announceCorrect() {
        const praises = ["Excellent!", "Great job!", "You're a measuring star!", "Correct!", "Wonderful counting!"];
        const rand = praises[Math.floor(Math.random() * praises.length)];
        speakText(rand);
    }
    
    function announceWrong(correctAnswer) {
        speakText(`Oops! The correct answer is ${correctAnswer}. Keep practicing measuring!`);
    }
    
    function updateHint() {
        if (currentQuestionObj && !lockAnswer && !waitingForNext) {
            if (timeLeft <= 15 && timeLeft > 5) {
                hintBox.innerHTML = `⏰ ${timeLeft} seconds left! 💡 Hint: ${currentQuestionObj.hint}`;
            } else if (timeLeft <= 5) {
                hintBox.innerHTML = `🚨 LAST ${timeLeft} SECONDS! 🚨 ${currentQuestionObj.hint}`;
            } else {
                hintBox.innerHTML = `💡 Hint will appear at 15 seconds. Count the units carefully! 💡`;
            }
        }
    }
    
    function checkAnswer() {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "⚠️ Question already answered! Press NEXT.";
            return;
        }
        const userAnswer = parseInt(answerInput.value.trim());
        if (isNaN(userAnswer)) {
            statusMsg.innerText = "🔢 Please type a number (how many units)!";
            speakText("Please type a number.");
            return;
        }
        if (userAnswer === currentQuestionObj.answer) {
            handleCorrect();
        } else {
            handleWrong();
        }
    }
    
    function handleCorrect() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        score++;
        updateUI();
        announceCorrect();
        statusMsg.innerText = "🎉 CORRECT! +1 POINT! 🎉";
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#d4f0d4";
        answerInput.style.border = "3px solid #2e7d32";
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleWrong() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceWrong(currentQuestionObj.answer);
        statusMsg.innerText = `😓 WRONG! Correct answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleTimeout() {
        if (lockAnswer || waitingForNext) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceTimeUp();
        statusMsg.innerText = `⏰ TIME UP! Answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function resetInputStyle() {
        answerInput.style.background = "white";
        answerInput.style.border = "3px solid #61a5c2";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.value = "";
        answerInput.focus();
        if (window.innerWidth <= 550) {
            answerInput.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 40;
        timerCircle.innerText = timeLeft;
        timerCircle.classList.remove("warning");
        updateHint();
        timerInterval = setInterval(() => {
            if (lockAnswer || waitingForNext) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                timeLeft--;
                timerCircle.innerText = timeLeft;
                updateHint();
                if (timeLeft <= 10) timerCircle.classList.add("warning");
                else timerCircle.classList.remove("warning");
            }
        }, 1000);
    }
    
    function loadQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        lockAnswer = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        resetInputStyle();
        
        if (currentQuestionIndex >= questions.length) {
            let requiredPass = Math.ceil(questions.length * 0.8);
            if (score >= requiredPass) {
                if (currentLevel === 5) {
                    statusMsg.innerText = "🏆🏆 AMAZING! YOU MASTERED MEASURING LENGTH! GRADE 1 MATH CHAMPION! 🏆🏆";
                    speakText("Congratulations! You completed all 5 levels! You are a measurement champion!");
                    questionTextEl.innerText = "🎉 GRAND VICTORY! 🎉 Measuring Expert!";
                    mathVisualEl.innerHTML = "📏🏆📏";
                    answerInput.disabled = true;
                    submitBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                } else {
                    currentLevel++;
                    currentQuestionIndex = 0;
                    score = 0;
                    loadLevelData();
                    updateLevelDisplay();
                    updateUI();
                    loadQuestion();
                    return;
                }
            } else {
                statusMsg.innerText = `❌ You got ${score}/${questions.length} (need ${requiredPass}%). Restarting level ${currentLevel}. Try again! ❌`;
                speakText(`Restarting level ${currentLevel}. Keep practicing measurement!`);
                resetCurrentLevel();
                return;
            }
        }
        
        currentQuestionObj = questions[currentQuestionIndex];
        questionTextEl.innerText = currentQuestionObj.text;
        mathVisualEl.innerHTML = currentQuestionObj.visual || "📏🔢";
        hintBox.innerHTML = "💡 Hint will appear at 15 seconds. Count the units carefully! 💡";
        startTimer();
        updateUI();
        statusMsg.innerText = "📏 Listen or read, count the units, then type your answer!";
        speakText(`Question: ${currentQuestionObj.text}`);
    }
    
    function loadLevelData() {
        questions = generateQuestionsForLevel(currentLevel);
        score = 0;
        currentQuestionIndex = 0;
    }
    
    function updateUI() {
        currentScoreSpan.innerText = score;
        let needed = Math.ceil(questions.length * 0.8);
        requiredInfoSpan.innerText = `${score}/${needed}`;
        let percent = (score / questions.length) * 100;
        let starCount = Math.min(5, Math.floor(percent / 20));
        starRatingSpan.innerHTML = "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
    }
    
    function updateLevelDisplay() {
        levelDisplaySpan.innerHTML = `📏 LEVEL ${currentLevel} / 5 📏`;
        let need = Math.ceil(30 * 0.8);
        requiredInfoSpan.innerText = `0/${need}`;
    }
    
    function resetCurrentLevel() {
        if (timerInterval) clearInterval(timerInterval);
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        lockAnswer = false;
        waitingForNext = false;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = 1;
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    // Event Listeners
    submitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        checkAnswer();
    });
    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!waitingForNext && !lockAnswer) {
            statusMsg.innerText = "👉 Please answer the question first!";
            speakText("Please answer the question first.");
            return;
        }
        if (waitingForNext) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });
    resetBtn.addEventListener("click", (e) => {
        e.preventDefault();
        fullReset();
    });
    speakBtn.addEventListener("click", (e) => {
        e.preventDefault();
        readQuestionAloud();
    });
    answerInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !lockAnswer && !waitingForNext) {
            e.preventDefault();
            checkAnswer();
        }
    });
    answerInput.addEventListener("focus", () => {
        setTimeout(() => answerInput.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
    });
    
    // Initialize game
    loadLevelData();
    updateLevelDisplay();
    updateUI();
    loadQuestion();
</script>
</body>
</html>
