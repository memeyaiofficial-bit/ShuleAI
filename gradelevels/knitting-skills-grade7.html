<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 7 Agriculture: Knitting | Suspended Gardens | Value Addition | Soap Making</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e6b4c, #0a3b2a);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef0;
            border-radius: 70px 70px 60px 60px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255, 245, 180, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #f4a261, #e76f51);
            padding: 1.2rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 5px solid #f5c542;
            color: white;
            text-shadow: 2px 2px 0 #9c4d2e;
        }

        .level-badge {
            background: #2c5e2c;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1f4a1f;
        }

        .score-card {
            background: #1f3f2a;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-area {
            background: #0c1e15;
            padding: 5px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .timer-clock {
            background: #f9e5c1;
            color: #c0392b;
            padding: 5px 15px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.9rem;
            font-weight: 800;
            min-width: 85px;
            text-align: center;
        }

        .progress-wrapper {
            background: #ddce9f;
            padding: 6px 20px;
        }
        .progress-fill {
            height: 18px;
            background: #f5a623;
            width: 0%;
            border-radius: 30px;
            transition: width 0.2s ease;
        }

        .quiz-area {
            padding: 30px 30px 35px;
        }

        .question-panel {
            background: #fff1df;
            border-radius: 55px;
            padding: 25px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.7rem;
            font-weight: 700;
            color: #2d543a;
            line-height: 1.4;
            word-break: break-word;
        }

        .speaker-button {
            background: #ffdd99;
            border: none;
            font-size: 1.4rem;
            padding: 10px 24px;
            margin-top: 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: 0.08s linear;
            box-shadow: 0 5px 0 #b97f3a;
        }

        .speaker-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f3a;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
            margin: 30px 0 25px;
        }

        .option {
            background: #e8ddc4;
            border-radius: 100px;
            padding: 15px 16px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.08s linear;
            border: 2px solid #cbad7a;
            text-align: center;
            box-shadow: 0 6px 0 #a67c48;
            color: #2a2b1f;
        }

        .option:hover {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option.correct-feedback {
            background: #3c9e3c;
            border-color: #1b6b1b;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .option.wrong-feedback {
            background: #d94a2b;
            border-color: #962b12;
            color: white;
            box-shadow: none;
            transform: scale(0.97);
        }

        .next-btn {
            background: #2c7a2d;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 16px 20px;
            border-radius: 60px;
            color: white;
            width: 100%;
            cursor: pointer;
            transition: 0.08s;
            box-shadow: 0 7px 0 #164d17;
            margin-top: 15px;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #164d17;
        }

        .info-message {
            text-align: center;
            font-size: 1.3rem;
            background: #fff1bf;
            padding: 14px;
            border-radius: 50px;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .question-text { font-size: 1.3rem; }
            .option { font-size: 1rem; padding: 12px 10px; }
            .game-header { flex-direction: column; align-items: stretch; text-align: center; }
            .timer-area { justify-content: center; }
        }

        footer {
            background: #e1cf9b;
            text-align: center;
            padding: 14px;
            font-weight: 500;
            color: #2c2b1a;
            font-size: 0.85rem;
        }

        button { font-family: inherit; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-card">🧶 SCORE: <span id="currentScore">0</span> / <span id="maxLevelScore">0</span></div>
        <div class="timer-area">
            ⏱️ TIME
            <div class="timer-clock" id="timerNumber">20</div>
        </div>
    </div>
    <div class="progress-wrapper">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="quiz-area" id="quizArea"></div>
    <footer>🌱 CBC Grade 7 Agriculture: Knitting Skills | Framed Suspended Gardens | Value Addition | Homemade Soap 🧼</footer>
</div>

<script>
    // --------------------------------------------------------------
    // TOPICS: Knitting skills, Constructing framed suspended gardens,
    // Adding value to crop produce, Making homemade soap
    // 5 levels x 40 questions, shuffled answers (A,B,C,D)
    // Pass 80% (32/40), Timer 20s, Voice Output, Fully Responsive
    // Adapted for GRADE 7 (all content and mechanics remain the same)
    // --------------------------------------------------------------

    function shuffleAnswers(questionObj) {
        const originalOptions = [...questionObj.options];
        let items = originalOptions.map((text, idx) => ({ text, isCorrect: idx === questionObj.correctIndex }));
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        return {
            ...questionObj,
            options: items.map(item => item.text),
            correctIndex: items.findIndex(item => item.isCorrect === true)
        };
    }

    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        const topics = ["knitting", "suspended_garden", "value_addition", "soap_making"];
        
        for (let i = 0; i < 40; i++) {
            let topic = topics[i % 4];
            let qText = "", opts = [], correct = 0;
            const seed = (level * 521 + i * 17) % 67;
            
            // ----- 1. KNITTING SKILLS -----
            if (topic === "knitting") {
                const knitPool = [
                    { q: "What are the basic tools for knitting?", opts: ["Knitting needles and yarn", "Scissors and glue", "Hammer and nails", "Paint and brush"], correct: 0 },
                    { q: "The two main stitches in knitting are...", opts: ["Knit and purl", "Sew and cut", "Loop and tie", "Hook and eye"], correct: 0 },
                    { q: "What is cast-on in knitting?", opts: ["First row of loops on needle", "Final stitch", "Tying a knot", "Cutting yarn"], correct: 0 },
                    { q: "Which fiber is commonly used for knitting warm clothes?", opts: ["Wool", "Plastic", "Metal wire", "Paper"], correct: 0 },
                    { q: "What is a 'yarn over' used for?", opts: ["Creating holes / decorative pattern", "Tying ends", "Increasing stitches", "Decreasing stitches"], correct: 0 },
                    { q: "Why do we knit in agriculture?", opts: ["Make useful items from animal fibers", "To plant seeds", "To water crops", "To harvest"], correct: 0 },
                    { q: "What does 'gauge' mean in knitting?", opts: ["Stitches per inch", "Type of needle", "Colour of yarn", "Length of thread"], correct: 0 },
                    { q: "Which animal gives wool for knitting?", opts: ["Sheep", "Cow", "Chicken", "Goat (mohair)"], correct: 0 },
                ];
                let pick = knitPool[(seed + i) % knitPool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            // ----- 2. CONSTRUCTING FRAMED SUSPENDED GARDENS -----
            else if (topic === "suspended_garden") {
                const gardenPool = [
                    { q: "What is a framed suspended garden?", opts: ["A garden hung on a frame/vertical structure", "A garden on the ground", "A garden under water", "A garden in a cave"], correct: 0 },
                    { q: "Which material is suitable for the frame?", opts: ["Wood or metal pipes", "Cardboard", "Plastic bag", "Cotton cloth"], correct: 0 },
                    { q: "Why use a suspended garden in urban areas?", opts: ["Saves space and reduces pests", "Requires more land", "Uses no water", "Grows only weeds"], correct: 0 },
                    { q: "What should be placed inside the suspended garden structure?", opts: ["Soil and compost", "Sand only", "Stones only", "Plastic waste"], correct: 0 },
                    { q: "Which plants grow well in suspended gardens?", opts: ["Leafy greens like spinach", "Maize", "Watermelon", "Pumpkins"], correct: 0 },
                    { q: "How do you water a suspended garden?", opts: ["Drip irrigation or gentle watering", "Flooding", "Only rainwater", "No watering"], correct: 0 },
                    { q: "What is a benefit of framed gardens?", opts: ["Better air circulation", "Increases soil pollution", "Uses more chemicals", "Encourages weeds"], correct: 0 },
                    { q: "Which of these is a vertical garden example?", opts: ["Pallet garden", "Ploughed field", "Rice paddy", "Pasture land"], correct: 0 },
                ];
                let pick = gardenPool[(seed + i) % gardenPool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            // ----- 3. ADDING VALUE TO CROP PRODUCE -----
            else if (topic === "value_addition") {
                const valuePool = [
                    { q: "What does 'value addition' mean in agriculture?", opts: ["Processing raw crops into higher value products", "Planting more seeds", "Using less water", "Harvesting early"], correct: 0 },
                    { q: "Which is a value-added product from tomatoes?", opts: ["Tomato sauce", "Fresh tomato", "Tomato seed", "Tomato leaf"], correct: 0 },
                    { q: "How can mangoes be value-added?", opts: ["Make dried mango or juice", "Store raw", "Burn them", "Bury them"], correct: 0 },
                    { q: "Why add value to crops?", opts: ["Increase income and reduce waste", "Make them spoil faster", "Reduce taste", "Make them heavier"], correct: 0 },
                    { q: "Which is a value-added product from maize?", opts: ["Maize flour or popcorn", "Fresh cob only", "Maize stalk", "Maize root"], correct: 0 },
                    { q: "What is 'packaging' in value addition?", opts: ["Attractive packing for selling", "Throwing away", "Mixing with soil", "Freezing raw"], correct: 0 },
                    { q: "Cassava can be processed into...", opts: ["Flour, chips or starch", "Plastic", "Oil", "Fabric"], correct: 0 },
                    { q: "Value addition helps farmers to...", opts: ["Get better prices", "Lose money", "Reduce harvest", "Stop farming"], correct: 0 },
                ];
                let pick = valuePool[(seed + i) % valuePool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            // ----- 4. MAKING HOMEMADE SOAP -----
            else {
                const soapPool = [
                    { q: "What are two main ingredients for homemade soap?", opts: ["Lye and oil/fat", "Water and sand", "Sugar and salt", "Flour and eggs"], correct: 0 },
                    { q: "Why wear gloves when making soap?", opts: ["Protect skin from lye", "Keep hands warm", "To stir faster", "For decoration"], correct: 0 },
                    { q: "Which oil is good for soap making?", opts: ["Coconut oil", "Engine oil", "Kerosene", "Cooking oil waste"], correct: 0 },
                    { q: "What is saponification?", opts: ["Chemical reaction making soap", "Melting soap", "Cutting soap", "Drying soap"], correct: 0 },
                    { q: "How long should homemade soap cure?", opts: ["Several weeks", "One hour", "One minute", "One day only"], correct: 0 },
                    { q: "Why add herbs to soap?", opts: ["Fragrance and skin benefits", "Make it toxic", "Change colour only", "Increase weight"], correct: 0 },
                    { q: "Which safety item is essential when making soap?", opts: ["Goggles and gloves", "Swimsuit", "Umbrella", "Sunglasses"], correct: 0 },
                    { q: "What happens if you mix lye with water incorrectly?", opts: ["It can splatter and burn", "It becomes sugar", "It cools down", "It turns to jelly"], correct: 0 },
                ];
                let pick = soapPool[(seed + i) % soapPool.length];
                qText = pick.q; opts = [...pick.opts]; correct = pick.correct;
            }
            
            if (opts.length !== 4) opts = ["Option A", "Option B", "Option C", "Option D"];
            let qObj = { questionText: qText, options: opts, correctIndex: correct };
            qObj = shuffleAnswers(qObj);
            const key = qObj.questionText;
            if (usedKeys.has(key) && i < 38) qObj.questionText = qObj.questionText + " (agri)";
            usedKeys.add(qObj.questionText);
            questions.push(qObj);
        }
        while(questions.length < 40) questions.push(shuffleAnswers({
            questionText: "Which crop can be processed into juice for value addition?",
            options: ["Oranges", "Potatoes", "Onions", "Garlic"],
            correctIndex: 0
        }));
        return questions.slice(0,40);
    }
    
    // Generate 5 levels
    const levelsBank = [];
    for (let lvl = 1; lvl <= 5; lvl++) levelsBank.push(generateQuestionsForLevel(lvl));
    
    // ---------- GAME STATE ----------
    let currentLevel = 1, currentQuestions = [], currentIndex = 0, levelScore = 0;
    const questionsPerLevel = 40;
    let timerInterval = null, timeLeft = 20, answered = false, waitingForNext = false;
    
    const quizArea = document.getElementById("quizArea");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const currentScoreSpan = document.getElementById("currentScore");
    const maxScoreSpan = document.getElementById("maxLevelScore");
    const progressFillDiv = document.getElementById("progressFill");
    const timerNumberSpan = document.getElementById("timerNumber");
    
    function speakText(message) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.rate = 0.92; utterance.pitch = 1.05; utterance.lang = "en-US";
        window.speechSynthesis.speak(utterance);
    }
    
    function updateStatsUI() {
        currentScoreSpan.innerText = levelScore;
        maxScoreSpan.innerText = questionsPerLevel;
        let percent = (levelScore / questionsPerLevel) * 100;
        progressFillDiv.style.width = `${percent}%`;
    }
    
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    
    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!answered && !waitingForNext && timeLeft > 0) {
                timeLeft--;
                timerNumberSpan.innerText = timeLeft;
                if (timeLeft <= 3) timerNumberSpan.style.background = "#ff8a7a";
                if (timeLeft === 0) { stopTimer(); if (!answered && !waitingForNext) handleTimeout(); }
            }
        }, 1000);
    }
    
    function resetTimer() { timeLeft = 20; timerNumberSpan.innerText = "20"; timerNumberSpan.style.background = "#f9e5c1"; stopTimer(); startTimer(); }
    
    function handleTimeout() {
        if (answered) return;
        answered = true; waitingForNext = true;
        const q = currentQuestions[currentIndex];
        const correctAns = q.options[q.correctIndex];
        const msgDiv = document.getElementById("infoMsg");
        if (msgDiv) msgDiv.innerHTML = `⏰ TIME'S UP! Correct answer: ${escapeHtml(correctAns)}. No points. Keep learning!`;
        speakText(`Time is up! The correct answer is ${correctAns}.`);
        highlightOptions(q.correctIndex, -1);
        updateStatsUI();
    }
    
    function handleAnswer(clickedIdx) {
        if (answered || waitingForNext) return;
        answered = true; stopTimer();
        const q = currentQuestions[currentIndex];
        const isCorrect = (clickedIdx === q.correctIndex);
        if (isCorrect) { levelScore++; updateStatsUI(); }
        highlightOptions(q.correctIndex, clickedIdx);
        const msgDiv = document.getElementById("infoMsg");
        if (isCorrect) {
            msgDiv.innerHTML = `✅ CORRECT! +1 point! 🌟 Wonderful agricultural skills! 🧶🌱🧼`;
            speakText(`Correct! Excellent job!`);
        } else {
            msgDiv.innerHTML = `❌ WRONG! Correct: ${escapeHtml(q.options[q.correctIndex])}. Keep practicing these valuable skills!`;
            speakText(`Wrong answer. The correct answer is ${q.options[q.correctIndex]}.`);
        }
        waitingForNext = true;
    }
    
    function highlightOptions(correctIdx, chosenIdx) {
        document.querySelectorAll('.option').forEach((opt, idx) => {
            opt.classList.remove('correct-feedback', 'wrong-feedback');
            if (idx === correctIdx) opt.classList.add('correct-feedback');
            if (idx === chosenIdx && idx !== correctIdx) opt.classList.add('wrong-feedback');
        });
    }
    
    function loadNextQuestionOrLevel() {
        if (!waitingForNext) return;
        if (currentIndex + 1 >= questionsPerLevel) {
            let percent = (levelScore / questionsPerLevel) * 100;
            if (percent >= 80) {
                if (currentLevel === 5) { showCompletion(); return; }
                else { showTransition(true, percent); currentLevel++; loadLevel(currentLevel); return; }
            } else { showTransition(false, percent); loadLevel(currentLevel); return; }
        } else {
            currentIndex++; answered = false; waitingForNext = false;
            renderCurrentQuestion();
        }
    }
    
    function showTransition(passed, percent) {
        let msg = passed ? `🎉✨ You passed Level ${currentLevel} with ${Math.floor(percent)}%! Moving to Level ${currentLevel+1}. Keep innovating! ✨🎉` : `😓 Oops! ${Math.floor(percent)}% (need 80%). Repeating Level ${currentLevel}. Keep practicing agriculture skills! 💪`;
        speakText(passed ? `Great! You passed level ${currentLevel}. Proceeding to next level.` : `You need 80 percent to pass. Repeating level.`);
        alert(msg);
    }
    
    function showCompletion() {
        stopTimer();
        quizArea.innerHTML = `<div class="question-panel" style="text-align:center"><div class="question-text">🏆🧶🌱 AGRICULTURE INNOVATOR CHAMPION (GRADE 7)! 🧼🪴<br>You mastered Knitting, Suspended Gardens, Value Addition & Soap Making!<br>You are a Grade 7 Agriculture Superstar! 🌟</div><button class="next-btn" id="restartGameBtn">🌟 PLAY AGAIN 🌟</button></div>`;
        speakText(`Congratulations, champion! You have mastered knitting skills, constructing framed suspended gardens, adding value to crop produce, and making homemade soap. You are a true agriculture expert for Grade 7!`);
        document.getElementById("restartGameBtn")?.addEventListener('click', () => { currentLevel = 1; loadLevel(1); });
    }
    
    function renderCurrentQuestion() {
        const q = currentQuestions[currentIndex];
        const letters = ['A', 'B', 'C', 'D'];
        const html = `
            <div class="question-panel">
                <div class="question-text">${escapeHtml(q.questionText)}</div>
                <button class="speaker-button" id="readQuestionBtn">🔊 Read Question Aloud</button>
            </div>
            <div class="options-grid" id="optionsGrid">
                ${q.options.map((opt, idx) => `<div class="option" data-opt-index="${idx}">${letters[idx]}. ${escapeHtml(opt)}</div>`).join('')}
            </div>
            <button class="next-btn" id="nextQuestionBtn">➡ NEXT QUESTION</button>
            <div id="infoMsg" class="info-message"></div>
        `;
        quizArea.innerHTML = html;
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', (e) => { if (!answered && !waitingForNext) handleAnswer(parseInt(opt.dataset.optIndex)); });
        });
        document.getElementById("nextQuestionBtn").addEventListener('click', () => {
            if (!answered && !waitingForNext) handleTimeout();
            else if (waitingForNext) loadNextQuestionOrLevel();
        });
        document.getElementById("readQuestionBtn").addEventListener('click', () => speakText(q.questionText));
        answered = false; waitingForNext = false;
        resetTimer();
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = levelsBank[level-1];
        currentIndex = 0;
        levelScore = 0;
        answered = false; waitingForNext = false;
        stopTimer(); timeLeft = 20;
        timerNumberSpan.innerText = "20"; timerNumberSpan.style.background = "#f9e5c1";
        levelDisplaySpan.innerText = `LEVEL ${currentLevel}`;
        updateStatsUI();
        renderCurrentQuestion();
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m)); }
    
    // Start the game
    loadLevel(1);
</script>
</body>
</html>
