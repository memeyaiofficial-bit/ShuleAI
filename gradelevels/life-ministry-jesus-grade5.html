<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Grade 5: Life of Jesus - CBC Game | Preparation, Power, Compassion & Miracles</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: linear-gradient(145deg, #2c5f2d 0%, #1a3b1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .game-container {
      max-width: 800px;
      width: 100%;
      background: #fffef7;
      border-radius: 70px 70px 60px 60px;
      box-shadow: 0 30px 35px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255,255,210,0.9);
      overflow: hidden;
      transition: all 0.2s;
    }

    .game-header {
      background: #d4a373;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 6px solid #b5835a;
    }

    .level-badge {
      background: #2f3e2e;
      color: #ffefb9;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .score-area {
      background: #6b4c3b;
      padding: 6px 16px;
      border-radius: 40px;
      color: #f9e0a0;
      font-weight: bold;
      font-size: 1rem;
    }

    .progress {
      background: #f7e3af;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #4a2e1a;
    }

    .timer-section {
      background: #fff0cf;
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px dashed #e6b064;
    }

    .timer-clock {
      background: #1e2a2e;
      color: #f9c74f;
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: bold;
      padding: 5px 22px;
      border-radius: 60px;
      letter-spacing: 3px;
      box-shadow: inset 0 0 3px gold, 0 4px 0 #4a3512;
    }

    .hint-area {
      background: #f7b05e;
      padding: 8px 20px;
      border-radius: 36px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c2b1f;
      max-width: 280px;
      transition: 0.2s;
    }

    .voice-btn {
      background: #8b5a2b;
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 0 #5a3a1a;
      transition: 0.05s linear;
    }

    .voice-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5a3a1a;
    }

    .question-panel {
      padding: 30px 25px 25px;
    }

    .question-text {
      font-size: 1.7rem;
      line-height: 1.35;
      font-weight: bold;
      color: #3b2a1f;
      background: #ffffff;
      padding: 18px 20px;
      border-radius: 55px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: inset 0 0 0 3px #f0e0c0, 0 10px 15px rgba(0,0,0,0.05);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .answer-input {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.2rem;
      border-radius: 60px;
      border: 3px solid #d4a373;
      background: white;
      font-family: inherit;
      outline: none;
      text-align: center;
      font-weight: 500;
    }

    .answer-input:focus {
      border-color: #e67e22;
      box-shadow: 0 0 0 4px rgba(230,126,34,0.3);
    }

    .submit-btn {
      background: #b5835a;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 14px;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      transition: 0.08s linear;
      box-shadow: 0 6px 0 #6b3e1a;
    }

    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #6b3e1a;
    }

    .feedback {
      text-align: center;
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 50px;
      background: #f3ebd2;
      margin-top: 15px;
      font-weight: bold;
    }

    .modal-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-card {
      background: #fff3df;
      max-width: 360px;
      width: 85%;
      padding: 30px 20px;
      text-align: center;
      border-radius: 65px;
      font-size: 1.3rem;
      font-weight: bold;
      box-shadow: 0 20px 30px black;
    }

    .modal-card button {
      background: #b5835a;
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 10px 28px;
      margin-top: 20px;
      border-radius: 40px;
      cursor: pointer;
    }

    @media (max-width: 580px) {
      .question-text {
        font-size: 1.3rem;
      }
      .timer-clock {
        font-size: 1.6rem;
        padding: 4px 15px;
      }
      .voice-btn {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
      .hint-area {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
<div id="gameRoot"></div>

<script>
  // --------------------------------------------------------------
  // GRADE 5 CBC - THE LIFE OF JESUS
  // Topics: Preparation for the coming of Jesus, John the Baptist,
  // God's power over nature, Compassion for the needy, Power of Jesus over life
  // 5 Levels x 30 Questions = 150 Total. Open-ended. Timer 40s. Voice output.
  // Pass mark: 80% (24/30 per level)
  // --------------------------------------------------------------

  function generateJesusLifeBank() {
    const questions = [];
    let id = 1;

    function addQ(text, correct) {
      questions.push({ id: id++, text: text, correct: correct.trim().toLowerCase() });
    }

    // ========== PREPARATION FOR THE COMING OF JESUS (30 questions) ==========
    addQ("Which prophet foretold that a virgin would give birth to Immanuel?", "isaiah");
    addQ("What was the name of the angel who announced Jesus' birth to Mary?", "gabriel");
    addQ("In which town was Jesus born according to prophecy?", "bethlehem");
    addQ("What did the angel tell Joseph in a dream about Mary's pregnancy?", "do not be afraid");
    addQ("The Old Testament prophet who said 'Prepare the way of the Lord' was ________.", "isaiah");
    addQ("Who was the Roman emperor when Jesus was born?", "caesar augustus");
    addQ("What did the wise men follow to find baby Jesus?", "star");
    addQ("What gifts did the Magi bring to baby Jesus?", "gold frankincense myrrh");
    addQ("Who tried to kill baby Jesus by ordering the death of all boys under two?", "herod");
    addQ("Where did Joseph, Mary and Jesus flee to escape Herod?", "egypt");
    addQ("The name 'Immanuel' means 'God with _______'.", "us");
    addQ("What was the name of the priest who was told he would see the Messiah before dying?", "simeon");
    addQ("Which elderly prophetess spoke about Jesus at the temple?", "anna");
    addQ("The angel told Mary she would conceive by the power of the _____ Spirit.", "holy");
    addQ("How many years was the period of silence before John the Baptist came?", "400");
    addQ("Malachi prophesied that Elijah would come before the great day of the Lord - who fulfilled this?", "john the baptist");
    addQ("What was Joseph's occupation?", "carpenter");
    addQ("Jesus was born in a _______ because there was no room in the inn.", "stable");
    addQ("What did the shepherds see in the sky when Jesus was born?", "angels");
    addQ("Who announced to the shepherds the birth of a Savior?", "angel");
    addQ("The wise men came from the ______ (direction).", "east");
    addQ("King Herod pretended he wanted to worship Jesus but actually wanted to _______ him.", "kill");
    addQ("After Herod died, Joseph brought the family back to live in _______.", "nazareth");
    addQ("Jesus grew in wisdom and stature and in favor with God and _______.", "man");
    addQ("The prophet Micah said the Messiah would come from Bethlehem _______.", "judah");
    addQ("Gabriel told Zechariah that his wife Elizabeth would bear a son named _______.", "john");
    addQ("Elizabeth was the ______ of Mary.", "relative");
    addQ("When Mary visited Elizabeth, the baby in Elizabeth's womb ______ for joy.", "leaped");
    addQ("Zechariah was unable to speak because he _______ the angel's message.", "doubted");
    addQ("The birth of John the Baptist was to prepare people for the coming of the _______.", "messiah");

    // ========== JOHN THE BAPTIST (25 questions) ==========
    addQ("What did John the Baptist eat in the wilderness?", "locusts");
    addQ("What kind of clothing did John the Baptist wear?", "camel hair");
    addQ("John the Baptist baptized people in the _______ River.", "jordan");
    addQ("What did John call the Pharisees and Sadducees?", "brood of vipers");
    addQ("John said he was not worthy to untie the _______ of Jesus.", "sandals");
    addQ("John the Baptist said Jesus would baptize with the Holy Spirit and with _______.", "fire");
    addQ("What did John the Baptist preach that people should do?", "repent");
    addQ("Herod arrested John the Baptist because John spoke against his marriage to _______.", "herodias");
    addQ("John the Baptist was beheaded at the request of _______ daughter.", "herodias");
    addQ("Jesus called John the Baptist the greatest among those born of _______.", "women");
    addQ("John's father Zechariah was a _______ in the temple.", "priest");
    addQ("John the Baptist said, 'He must increase, but I must _______.'", "decrease");
    addQ("John's mother Elizabeth was ______ before she conceived.", "barren");
    addQ("The angel Gabriel appeared to Zechariah while he was burning _______.", "incense");
    addQ("John the Baptist was filled with the Holy Spirit even from his mother's _______.", "womb");
    addQ("John the Baptist prepared the way for Jesus by calling people to _______.", "repentance");
    addQ("John said, 'I am the voice of one crying in the _______.'", "wilderness");
    addQ("What did John tell tax collectors to do?", "collect no more than due");
    addQ("What did John tell soldiers to do?", "be content with pay");
    addQ("John confessed, 'I am not the Christ, nor Elijah, nor the _______ .'", "prophet");
    addQ("Jesus said, among those born of women, no one is greater than _______.", "john");
    addQ("John the Baptist's disciples fasted and prayed, but Jesus' disciples did not because the bridegroom was with them. Who is the bridegroom?", "jesus");
    addQ("John pointed to Jesus and said, 'Behold the _______ of God.'", "lamb");
    addQ("Which of Jesus' disciples was first a disciple of John the Baptist?", "andrew");
    addQ("John the Baptist was imprisoned in the fortress of _______.", "machaerus");

    // ========== GOD'S POWER OVER NATURE (25 questions) ==========
    addQ("What did Jesus turn into wine at the wedding in Cana?", "water");
    addQ("How many baskets of leftover pieces were collected after Jesus fed the 5000?", "twelve");
    addQ("Jesus walked on the _____ to reach his disciples' boat.", "water");
    addQ("When Jesus calmed the storm, what did He say to the wind and waves?", "peace be still");
    addQ("Jesus cursed a _______ tree and it withered.", "fig");
    addQ("How many people did Jesus feed with five loaves and two fish?", "5000");
    addQ("What fish did Jesus tell Peter to catch to find a coin for the temple tax?", "first fish");
    addQ("When Jesus got into Peter's boat and told him to let down nets, they caught so many fish the nets began to _______.", "break");
    addQ("On which lake did Jesus calm the storm?", "sea of galilee");
    addQ("After the miraculous catch of fish, Peter said, 'Depart from me, for I am a sinful man, O _______.'", "lord");
    addQ("Jesus walked on water during the _______ watch of the night.", "fourth");
    addQ("Peter began to sink when he took his eyes off Jesus and saw the _______.", "wind");
    addQ("How many baskets were collected after feeding the 4000?", "seven");
    addQ("What did Jesus use to heal the blind man at Bethsaida?", "spit");
    addQ("Jesus healed a man who was born blind by making mud with ______ and putting it on his eyes.", "spit");
    addQ("When Jesus told the paralyzed man to rise and walk, the man picked up his ______ and went home.", "mat");
    addQ("Jesus healed a centurion's servant from a ______. (distance)", "distance");
    addQ("The woman with the issue of blood was healed when she touched the hem of Jesus' _______.", "garment");
    addQ("Jesus raised Jairus' daughter who had ______.", "died");
    addQ("When Jesus healed the man with a withered hand, it was on the _______.", "sabbath");
    addQ("Jesus healed a man who was deaf and had a speech impediment. He put his fingers into the man's _______.", "ears");
    addQ("At the pool of Bethesda, Jesus healed a man who had been an invalid for _____ years.", "38");
    addQ("Jesus healed ten lepers, but only one returned to give _______.", "thanks");
    addQ("The man born blind was told to wash in the pool of _______.", "siloam");
    addQ("Jesus told the paralyzed man 'Your _______ are forgiven' before healing his body.", "sins");

    // ========== COMPASSION FOR THE NEEDY (20 questions) ==========
    addQ("Jesus fed the hungry crowd because He had _________ on them.", "compassion");
    addQ("The Good Samaritan helped a man who was beaten and left for _______.", "dead");
    addQ("In the parable of the Prodigal Son, the father ran to embrace his son showing great _______.", "compassion");
    addQ("Jesus touched a man with leprosy because He was _______ to heal him.", "willing");
    addQ("Jesus wept at the tomb of his friend _______.", "lazarus");
    addQ("Jesus forgave the woman caught in adultery and told her to sin no _______.", "more");
    addQ("Jesus healed the servant of a Roman centurion, showing compassion to a _______.", "gentile");
    addQ("Jesus said, 'It is more blessed to give than to _______.'", "receive");
    addQ("Jesus told the rich young ruler to sell his possessions and give to the _______.", "poor");
    addQ("Zacchaeus gave half of his possessions to the poor after meeting _______.", "jesus");
    addQ("Jesus said, 'Whatever you did for the least of these brothers of mine, you did for _______.'", "me");
    addQ("The widow gave two small copper coins, all she had to live on, as an _______.", "offering");
    addQ("Jesus healed a woman who had been bent over for eighteen years on the _______.", "sabbath");
    addQ("Jesus raised the widow's son at _______.", "nain");
    addQ("Jesus said, 'Come to me, all you who are weary and burdened, and I will give you _______.'", "rest");
    addQ("Jesus fed the 4000 because they had been with Him for three days and had nothing to _______.", "eat");
    addQ("Jesus gave sight to Bartimaeus, a blind _______.", "beggar");
    addQ("Jesus touched the ear of Malchus, the high priest's servant, and _______ him.", "healed");
    addQ("Jesus told the parable of the Sheep and the Goats, saying that feeding the hungry is serving _______.", "jesus");
    addQ("When Jesus saw the crowds, He had compassion because they were harassed and helpless like sheep without a _______.", "shepherd");

    // ========== POWER OF JESUS OVER LIFE (20 questions) ==========
    addQ("How many days was Lazarus dead before Jesus raised him?", "four");
    addQ("Jesus said, 'I am the resurrection and the _______.'", "life");
    addQ("Jesus raised the son of the widow of _______ from the dead.", "nain");
    addQ("Jesus raised Jairus' daughter. He took her by the hand and said 'Talitha koum' which means 'Little girl, I say to you, _______'.", "arise");
    addQ("At the tomb of Lazarus, Jesus _______.", "wept");
    addQ("Jesus said, 'Lazarus, come _______!'", "out");
    addQ("After Jesus was crucified, He rose from the dead on the _______ day.", "third");
    addQ("Who was the first person to see the resurrected Jesus?", "mary magdalene");
    addQ("Jesus appeared to two disciples on the road to _______.", "emmaus");
    addQ("Thomas doubted Jesus' resurrection until he saw Jesus' ______ and side.", "wounds");
    addQ("Jesus told Martha, 'I am the resurrection and the life; he who believes in me will live even though he _______.'", "dies");
    addQ("When Jesus died, the curtain of the temple was torn in _______ from top to bottom.", "two");
    addQ("Many bodies of holy people were raised to life after Jesus' _______.", "resurrection");
    addQ("Jesus breathed on his disciples and said, 'Receive the Holy _______' after His resurrection.", "spirit");
    addQ("Jesus appeared to more than _______ brothers at one time after His resurrection.", "five hundred");
    addQ("After His resurrection, Jesus ate broiled _______ to show He was not a ghost.", "fish");
    addQ("Jesus said, 'I have the keys of Death and _______.'", "hades");
    addQ("When the soldier pierced Jesus' side, blood and _______ came out.", "water");
    addQ("Jesus gave Peter the command to 'Feed my _______' after His resurrection.", "sheep");
    addQ("Jesus' resurrection is the foundation of the Christian _______ .", "faith");

    // Fill to exactly 150
    while (questions.length < 150) {
      addQ("Who said 'Repent, for the kingdom of heaven is at hand'?", "john the baptist");
    }
    return questions.slice(0, 150);
  }

  const masterBank = generateJesusLifeBank();

  // Game state
  let currentLevel = 1;
  let currentQIndex = 0;
  let levelQuestions = [];
  let levelScore = 0;
  let totalAttempted = 0;
  let timerInterval = null;
  let timeLeft = 40;
  let isActive = true;
  let waitingTransition = false;
  let answerLock = false;

  const root = document.getElementById("gameRoot");

  function renderGame() {
    if (!levelQuestions.length) return;
    const currentQ = levelQuestions[currentQIndex];
    const neededPass = 24;
    const remaining = 30 - totalAttempted;
    const hintMsg = getDynamicHint();

    root.innerHTML = `
      <div class="game-container">
        <div class="game-header">
          <div class="level-badge">✝️ Level ${currentLevel} / 5</div>
          <div class="score-area">⛪ Score: ${levelScore} / ${totalAttempted}</div>
          <div class="progress">🎯 Need ${neededPass} to pass | Left: ${remaining}</div>
        </div>
        <div class="timer-section">
          <div class="timer-clock" id="timerDisplay">${timeLeft}s</div>
          <div class="hint-area" id="hintMessage">💡 ${hintMsg}</div>
          <button class="voice-btn" id="readBtn">🔊 Read Question</button>
        </div>
        <div class="question-panel">
          <div class="question-text">${escapeHtml(currentQ.text)}</div>
          <div class="answer-area">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer (one word or short phrase)..." autocomplete="off">
            <button id="submitAnswerBtn" class="submit-btn">✔ Submit Answer</button>
          </div>
          <div class="feedback" id="feedbackMsg">🕊️ Life of Jesus challenge! 40 seconds. Press 🔊 to listen.</div>
        </div>
      </div>
    `;

    document.getElementById("readBtn").addEventListener("click", () => speakText(currentQ.text));
    document.getElementById("submitAnswerBtn").addEventListener("click", () => submitAnswer());
    const inputField = document.getElementById("answerInput");
    inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") submitAnswer(); });
    inputField.focus();
    startTimer();
  }

  function getDynamicHint() {
    if (timeLeft <= 10) return "⏰ Last seconds! Think: John the Baptist, miracles, compassion, resurrection!";
    if (timeLeft <= 20) return "💡 Hint: Bethlehem, Jordan River, feeding 5000, raising Lazarus, Mary Magdalene!";
    if (timeLeft <= 30) return "📢 Clue: Jesus' birth, baptism, miracles, parables, death and rising again!";
    return "🙏 John prepared the way. Jesus calmed storms, healed sick, raised the dead, showed compassion!";
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.05;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Your browser does not support voice reading.");
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if (!isActive || waitingTransition) return;
      if (timeLeft <= 1) {
        clearInterval(timerInterval);
        timerInterval = null;
        if (isActive && !answerLock) handleTimeout();
      } else {
        timeLeft--;
        updateTimerDisplay();
        const hintDiv = document.getElementById("hintMessage");
        if (hintDiv) hintDiv.innerText = getDynamicHint();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const timerSpan = document.getElementById("timerDisplay");
    if (timerSpan) timerSpan.innerText = `${timeLeft}s`;
  }

  function handleTimeout() {
    if (!isActive || waitingTransition) return;
    isActive = false;
    answerLock = true;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    const fb = document.getElementById("feedbackMsg");
    if (fb) fb.innerHTML = "⏰ TIME'S UP! No answer given. Moving to next question.";
    totalAttempted++;
    scheduleNextAfterDelay();
  }

  function submitAnswer() {
    if (!isActive || waitingTransition) {
      speakText("Please wait, next question loading.");
      return;
    }
    const inputEl = document.getElementById("answerInput");
    let userAnswer = inputEl.value.trim().toLowerCase();
    if (userAnswer === "") {
      document.getElementById("feedbackMsg").innerHTML = "❗ Please type an answer!";
      speakText("Please write your answer.");
      return;
    }

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    isActive = false;
    answerLock = true;

    const currentQ = levelQuestions[currentQIndex];
    const correctAns = currentQ.correct;
    let isCorrect = false;

    let normalizedUser = userAnswer.replace(/[^a-z0-9]/g, '');
    let normalizedCorrect = correctAns.replace(/[^a-z0-9]/g, '');

    if (normalizedUser === normalizedCorrect) {
      isCorrect = true;
    } else {
      const synonyms = {
        "isaiah": ["isaiah prophet"],
        "gabriel": ["angel gabriel"],
        "bethlehem": ["bethlehem judah"],
        "jordan": ["jordan river"],
        "jesus": ["christ", "messiah"],
        "john the baptist": ["john baptist", "john"],
        "lazarus": ["lazarus of bethany"],
        "peter": ["simon peter"],
        "mary magdalene": ["mary magdalene"],
        "moses": ["moshe"],
        "elijah": ["elijah prophet"],
        "gold frankincense myrrh": ["gold and frankincense", "three gifts"],
        "5000": ["five thousand"],
        "four": ["4"],
        "twelve": ["12"],
        "seven": ["7"],
        "38": ["thirty eight"]
      };
      for (let [key, vals] of Object.entries(synonyms)) {
        if (normalizedCorrect === key && vals.some(v => normalizedUser.includes(v))) {
          isCorrect = true;
          break;
        }
      }
      if (!isCorrect && normalizedUser.includes(normalizedCorrect) && normalizedCorrect.length > 2) isCorrect = true;
      if (correctAns === "locusts" && userAnswer.includes("locust")) isCorrect = true;
      if (correctAns === "camel hair" && (userAnswer.includes("camel") || userAnswer === "camel's hair")) isCorrect = true;
    }

    const feedbackDiv = document.getElementById("feedbackMsg");
    if (isCorrect) {
      levelScore++;
      totalAttempted++;
      feedbackDiv.innerHTML = "✅ CORRECT! ✝️ +1 point! Great knowledge of Jesus' life!";
      speakText("Correct! Excellent!");
    } else {
      totalAttempted++;
      feedbackDiv.innerHTML = `❌ Oops. Correct answer: "${capitalizeFirst(correctAns)}". Keep learning about Jesus!`;
      speakText(`Wrong. The correct answer is ${correctAns}.`);
    }
    scheduleNextAfterDelay();
  }

  function scheduleNextAfterDelay() {
    waitingTransition = true;
    setTimeout(() => {
      if (currentQIndex + 1 >= levelQuestions.length || totalAttempted >= 30) {
        finishLevel();
      } else {
        currentQIndex++;
        resetForNextQuestion();
      }
    }, 1600);
  }

  function finishLevel() {
    const percent = (levelScore / 30) * 100;
    const passed = percent >= 80;
    if (passed && currentLevel < 5) {
      showModal(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉<br>Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>🕊️ You pass! Advancing to Level ${currentLevel+1}.`, true);
    } else if (passed && currentLevel === 5) {
      showModal(`🏆🙌 LIFE OF JESUS MASTER! 🙌🏆<br>You completed all 5 levels!<br>Final Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>You know the miracles, compassion and power of Christ!`, false);
    } else {
      showModal(`💔 Level ${currentLevel} FAILED!<br>${levelScore}/30 (${Math.floor(percent)}%)<br>Need 80% to proceed. Restarting Level ${currentLevel}...`, false);
    }
  }

  function showModal(message, advanceToNext) {
    if (timerInterval) clearInterval(timerInterval);
    const modalDiv = document.createElement("div");
    modalDiv.className = "modal-message";
    modalDiv.innerHTML = `
      <div class="modal-card">
        <div>${message}</div>
        <button id="modalConfirmBtn">CONTINUE</button>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById("modalConfirmBtn").onclick = () => {
      modalDiv.remove();
      if (advanceToNext && currentLevel < 5) {
        currentLevel++;
        loadLevel(currentLevel);
      } else if (!advanceToNext && currentLevel === 5 && message.includes("LIFE OF JESUS MASTER")) {
        currentLevel = 1;
        loadLevel(1);
      } else if (!advanceToNext) {
        loadLevel(currentLevel);
      } else {
        loadLevel(currentLevel);
      }
    };
  }

  function loadLevel(level) {
    const startIdx = (level - 1) * 30;
    levelQuestions = masterBank.slice(startIdx, startIdx + 30);
    if (levelQuestions.length < 30) console.warn("Bank issue");
    currentQIndex = 0;
    levelScore = 0;
    totalAttempted = 0;
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    renderGame();
  }

  function resetForNextQuestion() {
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    timeLeft = 40;
    renderGame();
  }

  function capitalizeFirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  loadLevel(1);
</script>
</body>
</html>
