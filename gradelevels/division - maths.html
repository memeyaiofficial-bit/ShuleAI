<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Grade 1 CBC Maths | Division Adventures | Equal Sharing • Equal Grouping • Division Sign</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #6a1b9a 0%, #4a148c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fffef7;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3), inset 0 1px 3px rgba(255, 250, 210, 0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb74d;
            padding: 16px 18px 12px;
            text-align: center;
            border-bottom: 4px solid #f57c00;
        }

        .level-badge {
            background: #3d2b1a;
            display: inline-block;
            padding: 5px 22px;
            border-radius: 50px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1rem;
        }

        .stars {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .star {
            font-size: 24px;
            color: #ffc107;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .score-progress {
            background: #fff3e0;
            margin: 10px 12px 0;
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.85rem;
            color: #5a3a1a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiz-card {
            padding: 18px 18px 20px;
        }

        .question-area {
            background: #ffffff;
            padding: 22px 14px;
            border-radius: 48px;
            box-shadow: inset 0 0 0 3px #ffe0a3, 0 6px 12px rgba(0,0,0,0.05);
            border: 1px solid #ffcd94;
            margin-bottom: 18px;
            text-align: center;
        }

        .question-text {
            font-size: 1.7rem;
            font-weight: bold;
            color: #4a148c;
            margin-bottom: 12px;
            word-break: break-word;
            line-height: 1.3;
        }

        .math-visual {
            font-size: 1.5rem;
            color: #e67e22;
            margin-top: 8px;
            font-weight: bold;
            background: #fff8e1;
            padding: 10px;
            border-radius: 40px;
            display: inline-block;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        .timer-circle {
            background: #d96c2b;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            font-family: monospace;
            box-shadow: 0 4px 0 #9b4a1a;
            transition: 0.1s;
        }

        .warning {
            background: #c0392b;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); background-color: #c0392b; }
            100% { transform: scale(1.05); background-color: #e67e22; }
        }

        .hint-box {
            background: #ffe0b5;
            border-radius: 35px;
            padding: 8px 14px;
            text-align: center;
            font-weight: bold;
            margin: 10px 0;
            font-size: 0.85rem;
            color: #b45f1b;
        }

        .answer-input-area {
            margin: 16px 0;
        }

        .answer-input {
            width: 100%;
            padding: 16px;
            font-size: 1.4rem;
            text-align: center;
            border-radius: 55px;
            border: 3px solid #ffb347;
            background: white;
            font-family: monospace;
            font-weight: bold;
            color: #2d5a2c;
            outline: none;
            -webkit-appearance: none;
        }

        .answer-input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px rgba(230,126,34,0.2);
        }

        .submit-btn {
            background: #52b788;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }

        .voice-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 8px;
        }

        .voice-btn {
            background: #2a9d8f;
            border: none;
            padding: 10px 18px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            font-family: inherit;
        }

        .voice-btn.speaker {
            background: #e76f51;
        }

        .status-msg {
            background: #efe0c9;
            border-radius: 35px;
            padding: 8px 12px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
        }

        .next-btn {
            background: #f4a261;
            width: 100%;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 55px;
            color: white;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-area {
            text-align: center;
            margin: 12px 15px 15px;
        }

        .reset-btn {
            background: #b4813c;
            border: none;
            padding: 7px 22px;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            body { padding: 12px; }
            .question-text { font-size: 1.3rem; }
            .math-visual { font-size: 1.1rem; }
            .answer-input { font-size: 1.2rem; padding: 14px; }
            .timer-circle { width: 60px; height: 60px; font-size: 1.7rem; }
            .submit-btn, .next-btn { padding: 12px; font-size: 1rem; }
        }

        @media (max-width: 400px) {
            .question-text { font-size: 1.1rem; }
        }

        footer {
            font-size: 0.65rem;
            text-align: center;
            background: #ebd5b3;
            padding: 8px;
            color: #4a3720;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">➗ LEVEL 1 / 5</div>
        <div class="stars" id="starRating">⭐⭐⭐</div>
        <div class="score-progress">
            <span>🏆 SCORE: <span id="currentScore">0</span></span>
            <span>✅ NEED 80% ➡️ <span id="requiredInfo">0/24</span></span>
        </div>
    </div>
    <div class="quiz-card">
        <div class="question-area">
            <div class="question-text" id="questionText">🌟 Ready to share equally? 🌟</div>
            <div class="math-visual" id="mathVisual"></div>
        </div>
        <div class="timer-area"><div class="timer-circle" id="timerCircle">40</div></div>
        <div class="hint-box" id="hintBox">💡 Hint will appear here when time is low 💡</div>
        
        <div class="answer-input-area">
            <input type="number" id="answerInput" class="answer-input" placeholder="Type your answer..." inputmode="numeric" autocomplete="off">
        </div>
        <button class="submit-btn" id="submitBtn">✅ SUBMIT ANSWER</button>
        
        <div class="voice-actions">
            <button class="voice-btn speaker" id="speakBtn">🔊 READ QUESTION</button>
        </div>
        
        <div class="status-msg" id="statusMsg">✨ Solve the division! Type the answer. 40 seconds. ✨</div>
        <button class="next-btn" id="nextBtn" disabled>➡️ NEXT QUESTION</button>
        <div class="reset-area"><button class="reset-btn" id="resetGameBtn">🔄 RESTART GAME</button></div>
    </div>
    <footer>📖 Equal Sharing · Equal Grouping · Division Sign · Divide | Grade 1 CBC Maths</footer>
</div>

<script>
    // ======================= QUESTION BANK (4 TOPICS, 30 UNIQUE QUESTIONS PER LEVEL) =======================
    // Topics: 1) Equal Sharing (divide total among groups)
    //        2) Equal Grouping (how many groups)
    //        3) Division Sign (using ÷ symbol)
    //        4) Basic Division facts (numbers 1-20 divisible by 2,3,4,5)
    
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedKeys = new Set();
        
        function addKey(prefix, value) {
            const key = `${prefix}_${value}`;
            if (usedKeys.has(key)) return false;
            usedKeys.add(key);
            return true;
        }
        
        // 1. Equal Sharing: "12 candies shared equally among 3 friends. How many each?"
        const sharingProblems = [
            { total: 6, groups: 2, each: 3, text: "6 candies shared equally between 2 friends. How many each?" },
            { total: 8, groups: 2, each: 4, text: "8 apples shared equally between 2 children. How many each?" },
            { total: 9, groups: 3, each: 3, text: "9 oranges shared equally among 3 kids. How many each?" },
            { total: 10, groups: 2, each: 5, text: "10 stickers shared equally between 2 students. How many each?" },
            { total: 12, groups: 3, each: 4, text: "12 bananas shared equally among 3 monkeys. How many each?" },
            { total: 12, groups: 4, each: 3, text: "12 cookies shared equally among 4 friends. How many each?" },
            { total: 15, groups: 3, each: 5, text: "15 toys shared equally among 3 boxes. How many in each box?" },
            { total: 16, groups: 4, each: 4, text: "16 pencils shared equally among 4 pupils. How many each?" },
            { total: 20, groups: 4, each: 5, text: "20 stars shared equally among 4 groups. How many each group?" },
            { total: 18, groups: 3, each: 6, text: "18 flowers shared equally among 3 vases. How many in each vase?" },
            { total: 14, groups: 2, each: 7, text: "14 eggs shared equally between 2 baskets. How many each?" },
            { total: 10, groups: 5, each: 2, text: "10 marbles shared equally among 5 children. How many each?" }
        ];
        
        // 2. Equal Grouping: "How many groups of 2 can you make from 8 items?"
        const groupingProblems = [
            { total: 8, size: 2, groups: 4, text: "How many groups of 2 can you make from 8 stars?" },
            { total: 9, size: 3, groups: 3, text: "How many groups of 3 can you make from 9 apples?" },
            { total: 10, size: 2, groups: 5, text: "How many groups of 2 can you make from 10 candies?" },
            { total: 12, size: 3, groups: 4, text: "How many groups of 3 can you make from 12 pencils?" },
            { total: 12, size: 4, groups: 3, text: "How many groups of 4 can you make from 12 balls?" },
            { total: 15, size: 3, groups: 5, text: "How many groups of 3 can you make from 15 oranges?" },
            { total: 16, size: 4, groups: 4, text: "How many groups of 4 can you make from 16 stickers?" },
            { total: 20, size: 5, groups: 4, text: "How many groups of 5 can you make from 20 toys?" },
            { total: 18, size: 3, groups: 6, text: "How many groups of 3 can you make from 18 books?" },
            { total: 14, size: 2, groups: 7, text: "How many groups of 2 can you make from 14 eggs?" },
            { total: 6, size: 2, groups: 3, text: "How many groups of 2 can you make from 6 bananas?" },
            { total: 4, size: 2, groups: 2, text: "How many groups of 2 can you make from 4 balls?" }
        ];
        
        // 3. Division Sign: "What is 12 ÷ 3 = ?"
        const divisionSignProblems = [
            { a: 6, b: 2, result: 3, text: "What is 6 ÷ 2 = ?" },
            { a: 8, b: 2, result: 4, text: "What is 8 ÷ 2 = ?" },
            { a: 9, b: 3, result: 3, text: "What is 9 ÷ 3 = ?" },
            { a: 10, b: 2, result: 5, text: "What is 10 ÷ 2 = ?" },
            { a: 12, b: 3, result: 4, text: "What is 12 ÷ 3 = ?" },
            { a: 12, b: 4, result: 3, text: "What is 12 ÷ 4 = ?" },
            { a: 15, b: 3, result: 5, text: "What is 15 ÷ 3 = ?" },
            { a: 16, b: 4, result: 4, text: "What is 16 ÷ 4 = ?" },
            { a: 20, b: 4, result: 5, text: "What is 20 ÷ 4 = ?" },
            { a: 18, b: 3, result: 6, text: "What is 18 ÷ 3 = ?" },
            { a: 14, b: 2, result: 7, text: "What is 14 ÷ 2 = ?" },
            { a: 4, b: 2, result: 2, text: "What is 4 ÷ 2 = ?" },
            { a: 10, b: 5, result: 2, text: "What is 10 ÷ 5 = ?" },
            { a: 12, b: 2, result: 6, text: "What is 12 ÷ 2 = ?" }
        ];
        
        // 4. Basic Division (word problems with divide)
        const basicDivideProblems = [
            { total: 8, divisor: 2, result: 4, text: "8 ÷ 2 = ?" },
            { total: 6, divisor: 3, result: 2, text: "6 ÷ 3 = ?" },
            { total: 10, divisor: 5, result: 2, text: "10 ÷ 5 = ?" },
            { total: 12, divisor: 6, result: 2, text: "12 ÷ 6 = ?" },
            { total: 9, divisor: 3, result: 3, text: "9 ÷ 3 = ?" },
            { total: 15, divisor: 5, result: 3, text: "15 ÷ 5 = ?" },
            { total: 16, divisor: 2, result: 8, text: "16 ÷ 2 = ?" }
        ];
        
        const allTopics = [
            ...sharingProblems.map(p => ({ type: "sharing", ...p, hint: `Divide ${p.total} by ${p.groups} = ${p.each}` })),
            ...groupingProblems.map(p => ({ type: "grouping", ...p, hint: `Divide ${p.total} by ${p.size} = ${p.groups}` })),
            ...divisionSignProblems.map(p => ({ type: "division_sign", ...p, hint: `${p.a} ÷ ${p.b} = ${p.result}` })),
            ...basicDivideProblems.map(p => ({ type: "basic", ...p, hint: `${p.total} ÷ ${p.divisor} = ${p.result}` }))
        ];
        
        // Build unique questions (30 total, no repeats within level)
        let shuffled = [...allTopics];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        let added = 0;
        for (let item of shuffled) {
            if (added >= 30) break;
            let key = "";
            if (item.type === "sharing") key = `share_${item.total}_${item.groups}`;
            else if (item.type === "grouping") key = `group_${item.total}_${item.size}`;
            else if (item.type === "division_sign") key = `divsign_${item.a}_${item.b}`;
            else key = `basic_${item.total}_${item.divisor}`;
            
            if (!usedKeys.has(key)) {
                usedKeys.add(key);
                let questionObj = {};
                if (item.type === "sharing") {
                    questionObj = {
                        type: "sharing",
                        text: item.text,
                        visual: `🍬 ${item.total} ÷ ${item.groups} groups = ?`,
                        answer: item.each,
                        hint: item.hint
                    };
                } else if (item.type === "grouping") {
                    questionObj = {
                        type: "grouping",
                        text: item.text,
                        visual: `📦 ${item.total} ÷ ${item.size} in each = ? groups`,
                        answer: item.groups,
                        hint: item.hint
                    };
                } else if (item.type === "division_sign") {
                    questionObj = {
                        type: "division_sign",
                        text: item.text,
                        visual: `➗ ${item.a} ÷ ${item.b} = ?`,
                        answer: item.result,
                        hint: item.hint
                    };
                } else {
                    questionObj = {
                        type: "basic",
                        text: item.text,
                        visual: `🧮 ${item.total} ÷ ${item.divisor} = ?`,
                        answer: item.result,
                        hint: item.hint
                    };
                }
                questions.push(questionObj);
                added++;
            }
        }
        
        // If still less than 30, add more simple division facts
        while (questions.length < 30) {
            const simpleFacts = [
                { text: "2 ÷ 2 = ?", ans: 1, hint: "2 ÷ 2 = 1" },
                { text: "4 ÷ 2 = ?", ans: 2, hint: "4 ÷ 2 = 2" },
                { text: "3 ÷ 1 = ?", ans: 3, hint: "Any number divided by 1 is itself." },
                { text: "5 ÷ 5 = ?", ans: 1, hint: "A number divided by itself equals 1." }
            ];
            for (let f of simpleFacts) {
                if (questions.length < 30 && !usedKeys.has(`simple_${f.text}`)) {
                    usedKeys.add(`simple_${f.text}`);
                    questions.push({
                        type: "basic",
                        text: f.text,
                        visual: `🧮 ${f.text}`,
                        answer: f.ans,
                        hint: f.hint
                    });
                }
            }
        }
        
        // Shuffle final questions
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        return questions;
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let questions = [];
    let score = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let lockAnswer = false;
    let currentQuestionObj = null;
    
    // DOM elements
    const questionTextEl = document.getElementById("questionText");
    const mathVisualEl = document.getElementById("mathVisual");
    const timerCircle = document.getElementById("timerCircle");
    const hintBox = document.getElementById("hintBox");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetGameBtn");
    const speakBtn = document.getElementById("speakBtn");
    const statusMsg = document.getElementById("statusMsg");
    const currentScoreSpan = document.getElementById("currentScore");
    const requiredInfoSpan = document.getElementById("requiredInfo");
    const levelDisplaySpan = document.getElementById("levelDisplay");
    const starRatingSpan = document.getElementById("starRating");
    
    // Speech synthesis with pause between "Time is up" and "moving to the next question"
    function speakWithPause(phrases, pauseMs = 900) {
        if (!window.speechSynthesis) return;
        const items = Array.isArray(phrases) ? phrases : [phrases];
        window.speechSynthesis.cancel();
        function speakNext(index) {
            if (index >= items.length) return;
            const utterance = new SpeechSynthesisUtterance(items[index]);
            utterance.lang = "en-US";
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.onend = () => {
                setTimeout(() => speakNext(index + 1), pauseMs);
            };
            window.speechSynthesis.speak(utterance);
        }
        speakNext(0);
    }
    
    function speakText(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
    }
    
    function announceTimeUp() {
        speakWithPause(["Time is up", "moving to the next question"], 900);
        statusMsg.innerText = "⏰ TIME IS UP! Moving to next question... ⏰";
    }
    
    function readQuestionAloud() {
        if (currentQuestionObj) {
            speakText(`Solve: ${currentQuestionObj.text}`);
            statusMsg.innerText = "🔊 Reading question...";
            setTimeout(() => statusMsg.innerText = "✅ Type your answer and click submit!", 2000);
        }
    }
    
    function announceCorrect() {
        const praises = ["Excellent!", "Great job!", "You're a division star!", "Correct!", "Wonderful sharing!"];
        const rand = praises[Math.floor(Math.random() * praises.length)];
        speakText(rand);
    }
    
    function announceWrong(correctAnswer) {
        speakText(`Oops! The correct answer is ${correctAnswer}. Keep practicing division!`);
    }
    
    function updateHint() {
        if (currentQuestionObj && !lockAnswer && !waitingForNext) {
            if (timeLeft <= 15 && timeLeft > 5) {
                hintBox.innerHTML = `⏰ ${timeLeft} seconds left! 💡 Hint: ${currentQuestionObj.hint}`;
            } else if (timeLeft <= 5) {
                hintBox.innerHTML = `🚨 LAST ${timeLeft} SECONDS! 🚨 ${currentQuestionObj.hint}`;
            } else {
                hintBox.innerHTML = `💡 Hint will appear at 15 seconds. Divide carefully! 💡`;
            }
        }
    }
    
    function checkAnswer() {
        if (lockAnswer || waitingForNext) {
            statusMsg.innerText = "⚠️ Question already answered! Press NEXT.";
            return;
        }
        const userAnswer = parseInt(answerInput.value.trim());
        if (isNaN(userAnswer)) {
            statusMsg.innerText = "🔢 Please type a number!";
            speakText("Please type a number.");
            return;
        }
        if (userAnswer === currentQuestionObj.answer) {
            handleCorrect();
        } else {
            handleWrong();
        }
    }
    
    function handleCorrect() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        score++;
        updateUI();
        announceCorrect();
        statusMsg.innerText = "🎉 CORRECT! +1 POINT! 🎉";
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#d4f0d4";
        answerInput.style.border = "3px solid #2e7d32";
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleWrong() {
        if (lockAnswer) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceWrong(currentQuestionObj.answer);
        statusMsg.innerText = `😓 WRONG! Correct answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function handleTimeout() {
        if (lockAnswer || waitingForNext) return;
        lockAnswer = true;
        if (timerInterval) clearInterval(timerInterval);
        announceTimeUp();
        statusMsg.innerText = `⏰ TIME UP! Answer: ${currentQuestionObj.answer}`;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        answerInput.style.background = "#ffe0b0";
        answerInput.style.border = "3px solid #c0392b";
        answerInput.value = currentQuestionObj.answer;
        waitingForNext = true;
        nextBtn.disabled = false;
        answerInput.blur();
    }
    
    function resetInputStyle() {
        answerInput.style.background = "white";
        answerInput.style.border = "3px solid #ffb347";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.value = "";
        answerInput.focus();
        if (window.innerWidth <= 550) {
            answerInput.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = 40;
        timerCircle.innerText = timeLeft;
        timerCircle.classList.remove("warning");
        updateHint();
        timerInterval = setInterval(() => {
            if (lockAnswer || waitingForNext) return;
            if (timeLeft <= 1) {
                clearInterval(timerInterval);
                handleTimeout();
            } else {
                timeLeft--;
                timerCircle.innerText = timeLeft;
                updateHint();
                if (timeLeft <= 10) timerCircle.classList.add("warning");
                else timerCircle.classList.remove("warning");
            }
        }, 1000);
    }
    
    function loadQuestion() {
        if (timerInterval) clearInterval(timerInterval);
        lockAnswer = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        resetInputStyle();
        
        if (currentQuestionIndex >= questions.length) {
            let requiredPass = Math.ceil(questions.length * 0.8);
            if (score >= requiredPass) {
                if (currentLevel === 5) {
                    statusMsg.innerText = "🏆🏆 AMAZING! YOU MASTERED DIVISION! GRADE 1 MATH CHAMPION! 🏆🏆";
                    speakText("Congratulations! You completed all 5 levels! You are a division champion!");
                    questionTextEl.innerText = "🎉 GRAND VICTORY! 🎉 Division Expert!";
                    mathVisualEl.innerHTML = "🏆➗🏆";
                    answerInput.disabled = true;
                    submitBtn.disabled = true;
                    nextBtn.disabled = true;
                    return;
                } else {
                    currentLevel++;
                    currentQuestionIndex = 0;
                    score = 0;
                    loadLevelData();
                    updateLevelDisplay();
                    updateUI();
                    loadQuestion();
                    return;
                }
            } else {
                statusMsg.innerText = `❌ You got ${score}/${questions.length} (need ${requiredPass}%). Restarting level ${currentLevel}. Try again! ❌`;
                speakText(`Restarting level ${currentLevel}. Keep practicing division!`);
                resetCurrentLevel();
                return;
            }
        }
        
        currentQuestionObj = questions[currentQuestionIndex];
        questionTextEl.innerText = currentQuestionObj.text;
        mathVisualEl.innerHTML = currentQuestionObj.visual || "➗";
        hintBox.innerHTML = "💡 Hint will appear at 15 seconds. Divide carefully! 💡";
        startTimer();
        updateUI();
        statusMsg.innerText = "📖 Listen or read, then type your answer. Click SUBMIT!";
        speakText(`Solve: ${currentQuestionObj.text}`);
    }
    
    function loadLevelData() {
        questions = generateQuestionsForLevel(currentLevel);
        score = 0;
        currentQuestionIndex = 0;
    }
    
    function updateUI() {
        currentScoreSpan.innerText = score;
        let needed = Math.ceil(questions.length * 0.8);
        requiredInfoSpan.innerText = `${score}/${needed}`;
        let percent = (score / questions.length) * 100;
        let starCount = Math.min(5, Math.floor(percent / 20));
        starRatingSpan.innerHTML = "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
    }
    
    function updateLevelDisplay() {
        levelDisplaySpan.innerHTML = `➗ LEVEL ${currentLevel} / 5 ➗`;
        let need = Math.ceil(30 * 0.8);
        requiredInfoSpan.innerText = `0/${need}`;
    }
    
    function resetCurrentLevel() {
        if (timerInterval) clearInterval(timerInterval);
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        lockAnswer = false;
        waitingForNext = false;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    function fullReset() {
        if (timerInterval) clearInterval(timerInterval);
        currentLevel = 1;
        loadLevelData();
        currentQuestionIndex = 0;
        score = 0;
        updateLevelDisplay();
        updateUI();
        loadQuestion();
    }
    
    // Event Listeners
    submitBtn.addEventListener("click", (e) => {
        e.preventDefault();
        checkAnswer();
    });
    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (!waitingForNext && !lockAnswer) {
            statusMsg.innerText = "👉 Please answer the question first!";
            speakText("Please answer the question first.");
            return;
        }
        if (waitingForNext) {
            currentQuestionIndex++;
            loadQuestion();
        }
    });
    resetBtn.addEventListener("click", (e) => {
        e.preventDefault();
        fullReset();
    });
    speakBtn.addEventListener("click", (e) => {
        e.preventDefault();
        readQuestionAloud();
    });
    answerInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !lockAnswer && !waitingForNext) {
            e.preventDefault();
            checkAnswer();
        }
    });
    answerInput.addEventListener("focus", () => {
        setTimeout(() => answerInput.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
    });
    
    // Initialize game
    loadLevelData();
    updateLevelDisplay();
    updateUI();
    loadQuestion();
</script>
</body>
</html>
