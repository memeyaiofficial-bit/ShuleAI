<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mission Accomplished | CBC Grade 5 English – Traditional Foods & Grammar Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2d5a2c 0%, #1c3e1a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fffef0;
            background-image: radial-gradient(circle at 10% 30%, rgba(200, 160, 100, 0.1) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,250,210,0.9);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #e0a82b;
        }

        .game-header {
            background: linear-gradient(98deg, #b45f1b, #e68a2e);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #ffd966;
        }

        .level-badge {
            background: #ffd966;
            color: #7a3e0e;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #c58f2a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #9b4a1a;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #ffe1a0;
            margin-right: 6px;
        }

        .progress-area {
            background: #e8dcc0;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #8b6946;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #f3b33d;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #5a3e1f;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #cfb27c;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #2d5720;
            border: 1px solid #ecc897;
        }

        .voice-btn {
            background: #c96f1e;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #7a3e0e;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #7a3e0e;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #b85c12;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #e2bc84;
            border-radius: 60px;
            background: #fffff5;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #f3b33d;
            box-shadow: 0 0 0 3px rgba(243,179,61,0.3);
        }

        .hint-message {
            background: #fcf5e6;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #7b5a39;
            font-style: italic;
            border-left: 7px solid #e0a82b;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #b45f1b;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #6b3f0e;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #6b3f0e;
        }

        .submit-btn {
            background: #e09d32;
            color: #2c3a1f;
            box-shadow: 0 4px 0 #b8681a;
            flex: 2;
        }

        .next-btn {
            background: #7c531a;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #fff0dd;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #f1c40f;
        }

        .timer.warning {
            color: #ffcf9a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>🏆 SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">Mission loading... traditional foods await!</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word/phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). Accomplish the mission!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // MISSION ACCOMPLISHED – CBC Grade 5 English
    // Topics: Listening, Speaking, Reading (Fiction & Non-fiction),
    // Grammar: Comparative and Superlative Adjectives,
    // Nutrition - Traditional Foods (African & global heritage)
    // 5 levels × 30 questions. Timer 40s. Pass 80% to advance.
    // Voice output, fully responsive, open-ended. Hints when time ≤12s.
    // --------------------------------------------------------------

    // Generate rich, curriculum-aligned question bank (150 questions)
    function generateBankForLevel(level) {
        const bank = [];
        // Six strands: 
        // 0: Comparative/Superlative (grammar)
        // 1: Traditional Foods (nutrition)
        // 2: Reading (Fiction/Non-fiction passages)
        // 3: Listening & Speaking
        // 4: Mixed mission (food comparisons)
        // 5: Writing prompts (food & health)
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            let category = (i + level * 3) % 6;
            if (level === 1) category = i % 6;
            if (level === 2) category = (i + 2) % 6;
            if (level === 3) category = (i + 4) % 6;
            if (level === 4) category = (i + 1) % 6;
            if (level === 5) category = (i + 5) % 6;

            if (category === 0) { // Grammar: Comparative & Superlative adjectives
                const gramBank = [
                    { q: "Ugali is ______ (filling) than rice. (comparative)", ans: "more filling", hint: "use 'more' + adjective" },
                    { q: "Among all traditional foods, sukuma wiki is the ______ (healthy).", ans: "healthiest", hint: "superlative, ends with -iest" },
                    { q: "This porridge is ______ (sweet) than the other one.", ans: "sweeter", hint: "add -er" },
                    { q: "Cassava is the ______ (nutritious) root vegetable.", ans: "most nutritious", hint: "3+ syllables use 'most'" },
                    { q: "Millet porridge is ______ (thick) than oat porridge.", ans: "thicker", hint: "double consonant + er" },
                    { q: "Of all grains, sorghum is the ______ (good).", ans: "best", hint: "irregular superlative" },
                    { q: "Grilled fish is ______ (tasty) than boiled fish.", ans: "tastier", hint: "change y to ier" }
                ];
                const pick = gramBank[i % gramBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Traditional Foods & Nutrition (non-fiction)
                const foodBank = [
                    { q: "A traditional Kenyan staple made from maize flour is ______.", ans: "ugali", hint: "stiff porridge" },
                    { q: "Fermented milk traditional food is called ______.", ans: "mursik", hint: "Kalenjin delicacy" },
                    { q: "______ is a leafy green vegetable rich in iron.", ans: "sukuma wiki", hint: "collard greens" },
                    { q: "Githeri contains maize and ______.", ans: "beans", hint: "legume" },
                    { q: "Millet and sorghum are ______ (gluten-free grains).", ans: "gluten-free", hint: "no wheat protein" },
                    { q: "Traditional stew with meat and veggies is called ______.", ans: "nyama choma", hint: "roasted meat" }
                ];
                const pick = foodBank[i % foodBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Reading: Fiction & Non-fiction narratives about mission and food
                const readingBank = [
                    { q: "In the story 'Mission Accomplished', the hero shared ______ with villagers.", ans: "food", hint: "nutrition" },
                    { q: "Non-fiction text: 'Traditional grains are ______ than processed cereals.'", ans: "healthier", hint: "comparative of healthy" },
                    { q: "The moral of the fiction: 'Sharing ______ brings joy.'", ans: "meals", hint: "eating together" },
                    { q: "According to the passage, the ______ food of all is fermented millet.", ans: "oldest", hint: "superlative of old" },
                    { q: "The chief said: 'Our mission is to protect ______ foods.'", ans: "traditional", hint: "heritage dishes" }
                ];
                const pick = readingBank[i % readingBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Listening & Speaking (dialogues, pronunciation, discussion)
                const lsBank = [
                    { q: "When discussing nutrition, you should speak ______ (clearly/loudly).", ans: "clearly", hint: "understandable" },
                    { q: "Listening to elders about traditional foods helps us learn ______.", ans: "recipes", hint: "cooking methods" },
                    { q: "Say 'comparative' – the stress is on ______ syllable.", ans: "second", hint: "com-PAR-a-tive" },
                    { q: "A good speaker uses ______ when describing tasty food.", ans: "enthusiasm", hint: "excitement" },
                    { q: "After listening to a nutrition talk, you should ______ questions.", ans: "ask", hint: "seek clarity" }
                ];
                const pick = lsBank[i % lsBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 4) { // Mixed: Compare foods & mission accomplishment
                const mixBank = [
                    { q: "Groundnuts are ______ (crunchy) than roasted maize.", ans: "crunchier", hint: "add -ier" },
                    { q: "The ______ (nutritious) traditional meal is a balanced plate.", ans: "most nutritious", hint: "superlative" },
                    { q: "This vegetable is ______ (good) for eyesight than that one.", ans: "better", hint: "comparative of good" },
                    { q: "A traditional feast is ______ (exciting) than a regular dinner.", ans: "more exciting", hint: "two syllables with -ing" },
                    { q: "Mission: Eat the ______ (colorful) fruits for vitamins.", ans: "most colorful", hint: "superlative" }
                ];
                const pick = mixBank[i % mixBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Writing prompts & handwriting (food & mission)
                const writeBank = [
                    { q: "When writing a recipe, begin with a ______ letter.", ans: "capital", hint: "uppercase" },
                    { q: "The sentence 'Millet is healthier than maize' uses ______ degree.", ans: "comparative", hint: "comparing two" },
                    { q: "Write: 'We ______ eat traditional foods for strong bones.' (must/should)", ans: "should", hint: "advice" },
                    { q: "Good handwriting makes your food journal ______ (legible).", ans: "legible", hint: "readable" },
                    { q: "A food paragraph ends with a ______ statement.", ans: "concluding", hint: "summary" }
                ];
                const pick = writeBank[i % writeBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech synthesis
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 Hint appears when ≤12s remain. Compare foods wisely!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ MISSION DELAY! Correct answer: "${currentCorrectAnswer.toUpperCase()}". Press NEXT.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "🥘 Type your answer to accomplish the mission! 🥘";
        hintArea.innerHTML = "💡 Hint appears at 12 seconds. Stay focused!";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT to continue your mission.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        const correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible matching for grade 5
        if (userAns === correct) isCorrect = true;
        else if (correct === "more filling" && userAns === "filling") isCorrect = false;
        else if (correct === "healthiest" && userAns === "most healthy") isCorrect = true;
        else if (correct === "sweeter" && (userAns === "more sweet")) isCorrect = true;
        else if (correct === "most nutritious" && userAns === "nutritiousest") isCorrect = false;
        else if (correct === "thicker" && userAns === "more thick") isCorrect = true;
        else if (correct === "best" && userAns === "goodest") isCorrect = false;
        else if (correct === "tastier" && (userAns === "more tasty")) isCorrect = true;
        else if (correct === "ugali" && (userAns === "ugali meal")) isCorrect = true;
        else if (correct === "sukuma wiki" && (userAns === "sukuma" || userAns === "collard greens")) isCorrect = true;
        else if (correct === "mursik" && userAns === "sour milk") isCorrect = true;
        else if (correct === "nyama choma" && (userAns === "roasted meat" || userAns === "bbq")) isCorrect = true;
        else if (correct === "healthier" && userAns === "more healthy") isCorrect = true;
        else if (correct === "clearly" && userAns === "clear") isCorrect = true;
        else if (correct === "crunchier" && userAns === "crunchy") isCorrect = false;
        else if (correct.includes(userAns) && userAns.length > 3 && correct.length > 4) isCorrect = true;
        else if (userAns.includes(correct) && correct.length > 3) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! Mission advancing.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ MISSION HICCUP! Correct answer: "${correct.toUpperCase()}". You typed "${userAns}". Keep learning traditional nutrition!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first or let the timer complete.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 MISSION ACCOMPLISHED! 🏆", `You conquered all levels with ${percent.toFixed(0)}%! You are a master of comparatives, superlatives & traditional foods.`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} PASSED! 🎉`, `Score: ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}? Traditional foods await!`, false);
            }
        } else {
            showLevelTransition(`⚠️ MISSION INCOMPLETE`, `You scored ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to master grammar & nutrition.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">🍲 PLAY AGAIN 🍲</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the adventure
    initLevel();
</script>
</body>
</html>
