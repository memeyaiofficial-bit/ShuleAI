<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🇰🇪 Bendera ya Kenya | CBC Grade 4 | Kiswahili Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1e5a3a 0%, #0e3a22 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Poppins', 'Roboto', 'Noto Sans', system-ui, sans-serif;
      padding: 16px;
    }

    /* Hub Screen */
    .hub-container {
      max-width: 1300px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      text-align: center;
      padding: 20px 15px;
      background: rgba(255,215,0,0.15);
      border-radius: 48px;
      margin-bottom: 30px;
      backdrop-filter: blur(8px);
    }

    .hero h1 {
      font-size: clamp(1.6rem, 6vw, 2.5rem);
      color: #FFD700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .hero p {
      color: #FFF8E7;
      font-size: clamp(0.85rem, 3vw, 1rem);
      margin-top: 8px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 30px;
    }

    .game-card {
      background: linear-gradient(145deg, #fffef7, #fff9e8);
      border-radius: 48px;
      padding: 24px 20px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      border: 2px solid #FFD966;
      text-align: center;
    }

    .game-card:hover { transform: translateY(-8px); box-shadow: 0 25px 40px rgba(0,0,0,0.3); }

    .game-icon { font-size: 3.5rem; margin-bottom: 12px; }

    .game-card h2 { color: #1b5e20; font-size: 1.5rem; margin-bottom: 8px; }

    .game-card p { color: #5a4a2a; font-size: 0.9rem; margin-bottom: 16px; }

    .play-badge {
      background: #FFB300;
      display: inline-block;
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: bold;
      color: #2e2c1f;
    }

    /* Game Container */
    .game-container {
      max-width: 850px;
      width: 100%;
      background: #fffef5;
      background-image: radial-gradient(circle at 5% 20%, rgba(30,90,58,0.05) 2%, transparent 2.5%);
      background-size: 28px 28px;
      border-radius: 70px 50px 70px 50px;
      box-shadow: 0 30px 40px rgba(0,0,0,0.4);
      overflow: hidden;
      margin: 0 auto;
    }

    .game-header {
      background: #d32f2f;
      padding: 18px 24px;
      color: #fff3e0;
      text-shadow: 2px 2px 0 #8b0000;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 5px solid #ffd966;
    }

    .level-badge {
      background: #2c2b28;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .score-timer {
      display: flex;
      gap: 20px;
      background: rgba(0,0,0,0.33);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 60px;
    }

    .score, .timer { font-weight: bold; font-size: 1.1rem; }

    .game-main { padding: 28px 24px 35px; }

    .question-card {
      background: #fffdf7;
      border-radius: 50px;
      padding: 28px 24px;
      margin-bottom: 28px;
      box-shadow: 0 12px 20px rgba(0,0,0,0.1);
      border-left: 12px solid #d32f2f;
    }

    .question-text {
      font-size: 1.4rem;
      line-height: 1.5;
      font-weight: 600;
      color: #1e5a3a;
      word-break: break-word;
    }

    .story-icon { font-size: 1.8rem; margin-bottom: 10px; display: inline-block; }

    .answer-area { margin: 20px 0 16px; }
    .answer-label { font-size: 1rem; font-weight: bold; color: #8b0000; display: block; margin-bottom: 10px; }

    .answer-input {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      border: 3px solid #ffd966;
      border-radius: 60px;
      background: #fffef7;
      font-family: inherit;
      outline: none;
    }

    .answer-input:focus { border-color: #d32f2f; box-shadow: 0 0 0 3px rgba(211,47,47,0.2); }

    .button-group { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }

    .check-btn, .next-btn {
      border: none;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      flex: 1;
      min-width: 130px;
    }

    .check-btn { background: #2e7d32; color: white; box-shadow: 0 4px 0 #1b5e20; }
    .check-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1b5e20; }

    .next-btn { background: #ffd966; color: #2c2b28; box-shadow: 0 4px 0 #c9a03d; }
    .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9a03d; }

    .check-btn:disabled, .next-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .feedback {
      margin-top: 18px;
      padding: 12px;
      border-radius: 40px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .feedback.correct { background: #d4ecd0; color: #1f5437; border-left: 6px solid #2e7d32; }
    .feedback.wrong { background: #ffe0db; color: #bc3900; border-left: 6px solid #d32f2f; }

    .progress-container {
      background: #e2cfb3;
      border-radius: 30px;
      margin: 20px 0 12px;
      height: 14px;
      overflow: hidden;
    }

    .progress-fill { background: #d32f2f; width: 0%; height: 100%; transition: width 0.3s ease; }

    .level-next { text-align: center; margin-top: 20px; }
    .action-btn {
      background: #ffd966;
      border: none;
      padding: 10px 22px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1rem;
      color: #2c2b28;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 4px;
    }

    .back-btn {
      background: #5d4037;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .timer-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      margin: 10px 0;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: #f97316;
      width: 100%;
      transition: width 1s linear;
    }
    .timer-fill.critical { background: #dc2626; animation: pulse 0.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

    .flag-preview {
      display: flex;
      height: 30px;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
    }
    .flag-preview div { flex: 1; }
    .flag-preview .black { background: #000000; }
    .flag-preview .red { background: #dc2626; }
    .flag-preview .white { background: #ffffff; }
    .flag-preview .green { background: #16a34a; }

    .confetti-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    .confetti {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 2px;
      animation: fall 1.8s linear forwards;
    }
    @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

    @media (max-width: 600px) {
      .game-header { flex-direction: column; align-items: center; text-align: center; }
      .question-text { font-size: 1.2rem; }
      .game-main { padding: 20px 16px; }
      .answer-input { font-size: 0.95rem; padding: 12px 16px; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="appRoot">
  <!-- HUB SCREEN -->
  <div id="hubScreen" class="hub-container">
    <div class="hero">
      <h1>🇰🇪 Bendera ya Kenya 🇰🇪</h1>
      <p>Darasa la 4 CBC | Rangi · Maana · Alama · Historia · Heshima</p>
    </div>
    <div class="games-grid">
      <div class="game-card" data-game="reading">
        <div class="game-icon">📖🇰🇪</div>
        <h2>Kusoma na Bendera</h2>
        <p>Soma hadithi fupi kuhusu bendera ya Kenya, kisha andika jibu sahihi.</p>
        <div class="play-badge">▶ CHEZA</div>
      </div>
      <div class="game-card" data-game="grammar">
        <div class="game-icon">🗣️📝</div>
        <h2>Sarufi na Alama</h2>
        <p>Jifunze kuhusu rangi, maana, ngao, mishale, na historia ya bendera yetu.</p>
        <div class="play-badge">▶ CHEZA</div>
      </div>
    </div>
  </div>

  <!-- GAME CONTAINER -->
  <div id="gameContainer" class="game-container" style="display: none;"></div>
</div>

<script>
  // ======================= DATA FOR EACH GAME MODE =======================
  
  // ---------- READING GAME (Hadithi kuhusu Bendera) ----------
  function buildReadingBank() {
    const reading = [
      { n:"Juma anatazama bendera ya Kenya. Rangi ya kwanza juu ni nyeusi.", p:"Rangi ya kwanza juu ya bendera ya Kenya ni _____.", a:"nyeusi" },
      { n:"Amina anasoma kuhusu bendera. Rangi ya pili ni nyekundu.", p:"Rangi ya pili ya bendera ya Kenya ni _____.", a:"nyekundu" },
      { n:"Baba anaelekeza bendera. Rangi ya tatu ni nyeupe.", p:"Rangi ya tatu ya bendera ya Kenya ni _____.", a:"nyeupe" },
      { n:"Mama anaonyesha bendera. Rangi ya nne chini ni kijani.", p:"Rangi ya nne ya bendera ya Kenya ni _____.", a:"kijani" },
      { n:"Watoto wanajifunza bendera. Rangi nne ziko kwa mpangilio.", p:"Bendera ya Kenya ina rangi _____.", a:"nne" }
    ];
    let items = [];
    for(let i=0;i<150;i++) {
      let r = reading[i%reading.length];
      items.push({ ...r, level: Math.floor(i/30) });
    }
    return items;
  }
  
  // ---------- GRAMMAR GAME (Sarufi ya Bendera) ----------
  function buildGrammarBank() {
    const grammar = [
      { q:"Sarufi: Neno 'bendera' liko katika ngeli gani? (andika i-i)", a:"i-i", example:"Ngeli ya I-I" },
      { q:"Rangi nyeusi kwenye bendera ya Kenya inawakilisha nini?", a:"watu", example:"Watu wa Kenya" },
      { q:"Rangi nyekundu inawakilisha nini?", a:"uhuru", example:"Mapambano ya uhuru" },
      { q:"Rangi nyeupe inawakilisha nini?", a:"amani", example:"Amani na umoja" },
      { q:"Rangi kijani inawakilisha nini?", a:"ardhi", example:"Ardhi na kilimo" },
      { q:"Kitenzi: 'Bendera ya Kenya ______ juu kila Siku ya Jamhuri.'", a:"hupandishwa", example:"Kupandishwa bendera" }
    ];
    let items = [];
    for(let i=0;i<150;i++) {
      let g = grammar[i%grammar.length];
      items.push({ ...g, level: Math.floor(i/30) });
    }
    return items;
  }
  
  function splitLevels(arr) {
    const levels = [[],[],[],[],[]];
    for(let i=0;i<arr.length;i++) levels[Math.floor(i/30)].push(arr[i]);
    return levels;
  }
  
  const READING_LEVELS = splitLevels(buildReadingBank());
  const GRAMMAR_LEVELS = splitLevels(buildGrammarBank());
  
  // ---------------------- GAME ENGINE ----------------------
  let activeGame = null;
  let currentLevel = 0, currentQIndex = 0, levelItems = [], levelAnswers = [], levelScore = 0, totalScore = 0;
  let timeLeft = 600, timerInterval = null, gameActive = true, hasAnsweredCurrent = false;
  let secondsElapsed = 0, localTimerInterval = null;
  
  let hubScreen, gameContainer;
  
  function normalizeAnswer(str) {
    return str.trim().toLowerCase()
      .replace(/[^\w\s]/g, '')
      .replace(/\s+/g, ' ')
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  
  function stopTimer() {
    if(timerInterval) { clearInterval(timerInterval); timerInterval=null; }
    if(localTimerInterval) { clearInterval(localTimerInterval); localTimerInterval=null; }
  }
  
  function startGlobalTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
      if(!gameActive) return;
      if(timeLeft<=0) {
        stopTimer(); gameActive=false;
        alert("⏰ MUDA UMEISHA! Kuanza ngazi ya 1 tena...");
        resetGame();
      } else {
        timeLeft--;
        const mins = Math.floor(timeLeft/60), secs = timeLeft%60;
        const timerEl = document.getElementById("timerDisplay");
        if(timerEl) timerEl.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
      }
    },1000);
  }
  
  function startQuestionTimer() {
    if(localTimerInterval) clearInterval(localTimerInterval);
    secondsElapsed = 0;
    const timerSpan = document.getElementById("timerSpan");
    if(timerSpan) timerSpan.textContent = "00";
    localTimerInterval = setInterval(() => {
      if(!gameActive || hasAnsweredCurrent) return;
      secondsElapsed++;
      if(timerSpan) timerSpan.textContent = secondsElapsed.toString().padStart(2,'0');
    }, 1000);
  }
  
  function updateUI() {
    const totalSpan = document.getElementById("totalScore");
    const levelSpan = document.getElementById("levelScore");
    const totalLevelSpan = document.getElementById("levelTotal");
    const progressSpan = document.getElementById("progressText");
    const scoreSpan = document.getElementById("scoreSpan");
    const qTotalSpan = document.getElementById("qTotalSpan");
    const progressFill = document.getElementById("progressFill");
    
    if(totalSpan) totalSpan.textContent = totalScore;
    if(levelSpan) levelSpan.textContent = levelScore;
    if(totalLevelSpan) totalLevelSpan.textContent = levelItems.length;
    if(progressSpan) progressSpan.textContent = `Swali ${currentQIndex+1} / ${levelItems.length}`;
    if(scoreSpan) scoreSpan.textContent = `${levelScore}/${levelItems.length}`;
    if(qTotalSpan) qTotalSpan.textContent = levelItems.length;
    if(progressFill) {
      const percent = (levelScore / levelItems.length) * 100;
      progressFill.style.width = `${percent}%`;
    }
  }
  
  function spawnConfetti() {
    const container = document.getElementById("confetti");
    if(!container) return;
    const colors = ['#000000', '#dc2626', '#ffffff', '#16a34a', '#1e40af'];
    for (let i = 0; i < 15; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.top = '-10px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      piece.style.animationDuration = `${1.2 + Math.random()}s`;
      container.appendChild(piece);
      setTimeout(() => piece.remove(), 1800);
    }
  }
  
  function handleAnswer(isCorrect, userAnswer) {
    if(hasAnsweredCurrent) return;
    if(localTimerInterval) clearInterval(localTimerInterval);
    
    if(isCorrect) {
      if(!levelAnswers[currentQIndex]) { levelAnswers[currentQIndex]=true; levelScore++; totalScore++; updateUI(); }
      const fb = document.getElementById("feedbackArea");
      if(fb) { 
        fb.className = "feedback correct"; 
        fb.innerHTML = "✅ SAHIHI! Vizuri sana! +1 alama"; 
      }
      spawnConfetti();
    } else {
      if(!levelAnswers[currentQIndex]) { levelAnswers[currentQIndex]=false; updateUI(); }
      const fb = document.getElementById("feedbackArea");
      if(fb) { 
        let correctAns = levelItems[currentQIndex].a || levelItems[currentQIndex].answer || "sahihi";
        fb.className = "feedback wrong"; 
        fb.innerHTML = `❌ Jibu sahihi: "${correctAns}". Endelea kujifunza kuhusu bendera yetu!`;
      }
    }
    hasAnsweredCurrent = true;
    const ansInp = document.getElementById("answerInput"); if(ansInp) ansInp.disabled=true;
    const checkBtn = document.getElementById("checkButton"); if(checkBtn) checkBtn.disabled=true;
    const nextBtn = document.getElementById("nextButton"); if(nextBtn) nextBtn.disabled=false;
  }
  
  function checkTypedAnswer() {
    if(!gameActive) return;
    if(hasAnsweredCurrent) {
      const fb = document.getElementById("feedbackArea");
      if(fb) { fb.className = "feedback wrong"; fb.innerHTML = "Umekwisha jibu! Bonyeza NEXT."; }
      return;
    }
    const user = document.getElementById("answerInput").value.trim();
    if(user === "") {
      const fb = document.getElementById("feedbackArea");
      if(fb) { fb.className = "feedback wrong"; fb.innerHTML = "⚠️ Tafadhali andika jibu lako!"; }
      return;
    }
    const current = levelItems[currentQIndex];
    const correctAns = current.a || current.answer;
    const userNorm = normalizeAnswer(user);
    const correctNorm = normalizeAnswer(correctAns);
    
    let isCorrect = (userNorm === correctNorm);
    // synonyms
    if(!isCorrect && correctNorm === "nyeusi" && userNorm === "nyeusi") isCorrect = true;
    if(!isCorrect && correctNorm === "nyekundu" && userNorm === "nyekundu") isCorrect = true;
    if(!isCorrect && correctNorm === "nyeupe" && userNorm === "nyeupe") isCorrect = true;
    if(!isCorrect && correctNorm === "kijani" && userNorm === "kijani") isCorrect = true;
    if(!isCorrect && correctNorm === "nne" && userNorm === "nne") isCorrect = true;
    if(!isCorrect && correctNorm === "watu" && userNorm === "watu") isCorrect = true;
    
    handleAnswer(isCorrect, user);
  }
  
  function moveToNext() {
    if(currentQIndex + 1 < levelItems.length) {
      currentQIndex++;
      loadCurrentQuestion();
    } else {
      const required = Math.ceil(levelItems.length * 0.8);
      const passed = levelScore >= required;
      if(passed && currentLevel+1 < 5) {
        showModal(true, `🎉 Ngazi ${currentLevel+1} Imekamilika!`, `Alama: ${levelScore}/${levelItems.length} (${Math.round(levelScore/levelItems.length*100)}%). Unahitaji 80% kupita.`, () => { currentLevel++; loadLevel(currentLevel); });
      } else if(passed && currentLevel+1 >=5) {
        showModal(true, `🏆 BINGWA WA BENDERA YA KENYA! 🏆`, `Umekamilisha ngazi zote 5! Alama ya jumla: ${totalScore}/${levelItems.length*5}. Hongera sana!`, () => { backToHub(); }, "CHEZA TENA");
      } else {
        showModal(false, `😭 Ngazi ${currentLevel+1} Haikupita`, `Ulipata ${levelScore}/${levelItems.length} (${Math.round(levelScore/levelItems.length*100)}%). Unahitaji 80% kupita ngazi.`, () => { loadLevel(currentLevel); }, "JARIBU TENA");
      }
    }
  }
  
  function showModal(isSuccess, title, msg, onClose, btnText=null) {
    stopTimer(); gameActive=false;
    const modal = document.createElement("div");
    modal.style.position = "fixed"; modal.style.top = "0"; modal.style.left = "0";
    modal.style.width = "100%"; modal.style.height = "100%";
    modal.style.background = "rgba(0,0,0,0.85)";
    modal.style.display = "flex"; modal.style.alignItems = "center"; modal.style.justifyContent = "center";
    modal.style.zIndex = "1000";
    modal.innerHTML = `<div style="background:#fff8ec; max-width:400px; width:85%; padding:30px 20px; border-radius:60px; text-align:center; border:5px solid gold;"><h2>${title}</h2><p style="white-space:pre-line; margin:15px 0;">${msg}</p><button style="background:#2e7d4a; color:white; border:none; padding:10px 24px; margin-top:20px; border-radius:40px; font-weight:bold; cursor:pointer;" id="modalActionBtn">${btnText || (isSuccess ? "ENDELEA ➡️" : "JARIBU TENA")}</button></div>`;
    document.body.appendChild(modal);
    document.getElementById("modalActionBtn").addEventListener("click", () => { modal.remove(); onClose(); });
  }
  
  function loadCurrentQuestion() {
    const q = levelItems[currentQIndex];
    const storyDiv = document.getElementById("storyText");
    const promptDiv = document.getElementById("promptText");
    
    if(storyDiv) storyDiv.innerHTML = `<div class="story-icon">🇰🇪🏴</div> ${q.n || q.q || "Hadithi yako iko tayari"}`;
    if(promptDiv) promptDiv.innerHTML = `✍️ ${q.p || "Andika jibu lako:"}`;
    
    const ansInp = document.getElementById("answerInput");
    if(ansInp) { ansInp.value = ""; ansInp.disabled = false; ansInp.focus(); }
    const checkBtn = document.getElementById("checkButton"); if(checkBtn) checkBtn.disabled=false;
    const nextBtn = document.getElementById("nextButton"); if(nextBtn) nextBtn.disabled=true;
    hasAnsweredCurrent = false;
    const fb = document.getElementById("feedbackArea"); if(fb) fb.innerHTML = "";
    updateUI();
    startQuestionTimer();
  }
  
  function loadLevel(levelIdx) {
    stopTimer();
    currentLevel = levelIdx;
    if(activeGame === 'reading') levelItems = [...READING_LEVELS[currentLevel]];
    else levelItems = [...GRAMMAR_LEVELS[currentLevel]];
    currentQIndex = 0;
    levelAnswers = new Array(levelItems.length).fill(false);
    levelScore = 0;
    if(currentLevel===0) totalScore = 0;
    gameActive = true;
    hasAnsweredCurrent = false;
    timeLeft = 600;
    const timerDisp = document.getElementById("timerDisplay");
    if(timerDisp) timerDisp.textContent = "10:00";
    const levelSpan = document.getElementById("levelDisplay");
    if(levelSpan) levelSpan.textContent = `Ngazi ${currentLevel+1}/5 • ${activeGame.toUpperCase()}`;
    updateUI();
    loadCurrentQuestion();
    startGlobalTimer();
  }
  
  function resetGame() { currentLevel=0; totalScore=0; loadLevel(0); }
  
  function backToHub() {
    stopTimer();
    gameContainer.style.display = "none";
    hubScreen.style.display = "block";
    activeGame = null;
  }
  
  function startGame(type) {
    activeGame = type;
    currentLevel = 0;
    totalScore = 0;
    gameContainer.innerHTML = `
      <div class="game-header">
        <div class="level-badge" id="levelDisplay">🇰🇪 Ngazi 1/5 • ${type.toUpperCase()}</div>
        <div class="score-timer">
          <div class="score">⭐ Alama: <span id="scoreSpan">0</span>/<span id="levelTotal">30</span></div>
          <div class="timer">⏱️ Muda: <span id="timerDisplay">10:00</span></div>
        </div>
      </div>
      <div class="game-main">
        <button class="back-btn" id="backToHubBtn">← Nyumbani</button>
        <div class="question-card">
          <div id="storyText" class="question-text">...</div>
          <div id="promptText" class="answer-label" style="margin-top:15px;"></div>
        </div>
        <div class="answer-area">
          <input type="text" id="answerInput" class="answer-input" placeholder="Andika jibu lako hapa..." autocomplete="off">
          <div class="button-group">
            <button id="checkButton" class="check-btn">🔍 Angalia Jibu</button>
            <button id="nextButton" class="next-btn" disabled>➡️ Swali Linalofuata</button>
          </div>
        </div>
        <div id="feedbackArea" class="feedback"></div>
        <div class="progress-container">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="flag-preview">
          <div class="black"></div><div class="red"></div><div class="white"></div><div class="green"></div>
        </div>
        <div id="gameMessage" style="text-align:center; margin-top:12px; font-size:0.85rem; color:#6b3e1c;">🎯 Lengo: 80% kupita kila ngazi. 📝 Andika kwa Kiswahili sanifu!</div>
        <div id="progressText" style="text-align:center; margin-top:6px; font-size:0.8rem;">Swali 0 / 30</div>
        <div id="confetti" style="position:relative; height:0;"></div>
      </div>
    `;
    hubScreen.style.display = "none";
    gameContainer.style.display = "block";
    
    document.getElementById("backToHubBtn").addEventListener("click", backToHub);
    document.getElementById("checkButton").addEventListener("click", checkTypedAnswer);
    document.getElementById("nextButton").addEventListener("click", () => { if(hasAnsweredCurrent) moveToNext(); else { const fb=document.getElementById("feedbackArea"); if(fb){ fb.className="feedback wrong"; fb.innerHTML="⚠️ Tafadhali jibu swali kwanza!"; } } });
    document.getElementById("answerInput").addEventListener("keypress", (e) => { if(e.key==="Enter" && !hasAnsweredCurrent && gameActive) document.getElementById("checkButton").click(); });
    
    loadLevel(0);
  }
  
  window.onload = () => {
    hubScreen = document.getElementById("hubScreen");
    gameContainer = document.getElementById("gameContainer");
    document.querySelectorAll(".game-card").forEach(card => {
      card.addEventListener("click", () => {
        const game = card.getAttribute("data-game");
        if(game === 'reading') startGame('reading');
        else if(game === 'grammar') startGame('grammar');
      });
    });
  };
</script>
</body>
</html>
