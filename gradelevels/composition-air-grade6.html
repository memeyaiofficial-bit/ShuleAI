<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Air Explorer | Grade 4 Science | Composition of Air & Pollution</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0b2b44 0%, #1c5a7a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 950px;
            width: 100%;
            background: #f0f9ff;
            border-radius: 68px 68px 56px 56px;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,240,0.9);
            overflow: hidden;
            transition: all 0.2s;
        }

        .game-header {
            background: #ffcd7e;
            background: linear-gradient(135deg, #ffd966, #ffb347);
            padding: 20px 28px;
            text-align: center;
            border-bottom: 6px solid #dc841a;
        }

        .game-header h1 {
            margin: 0;
            font-size: 1.9rem;
            color: #2c3e2b;
            text-shadow: 2px 2px 0 #ffeecc;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 14px;
            gap: 12px;
            background: #fff2d7;
            padding: 12px 20px;
            border-radius: 60px;
        }

        .level-box, .score-box, .timer-box {
            background: #1f5e3a;
            padding: 6px 20px;
            border-radius: 40px;
            color: #ffefb0;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: inset 0 -2px 0 #0e3a22, 0 5px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #b13e3e;
            font-family: monospace;
            font-size: 1.3rem;
            letter-spacing: 2px;
        }

        .question-area {
            padding: 30px 28px 20px;
            background: #ffffffea;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 600;
            color: #0f4c5f;
            background: #e6f4ff;
            padding: 22px;
            border-radius: 48px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 10px 15px rgba(0,0,0,0.05);
            line-height: 1.4;
        }

        .answer-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin: 18px 0;
        }

        .answer-input {
            flex: 1;
            padding: 16px 22px;
            font-size: 1.2rem;
            border: 3px solid #7fbcb8;
            border-radius: 60px;
            background: white;
            font-weight: 500;
            outline: none;
            transition: 0.1s;
        }

        .answer-input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243,156,18,0.3);
        }

        .submit-btn {
            background: #2a9d8f;
            width: 100%;
            padding: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            color: white;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.08s;
            box-shadow: 0 7px 0 #1e6b5e;
        }

        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #1e6b5e;
        }

        .feedback {
            margin-top: 20px;
            padding: 14px;
            text-align: center;
            border-radius: 48px;
            background: #cfe8cf;
            font-weight: bold;
            font-size: 1.1rem;
            color: #1f5437;
        }

        .progress {
            background: #ddddb0;
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border-top: 3px solid #c27d3a;
            border-radius: 0 0 32px 32px;
        }

        button {
            font-family: inherit;
        }

        @media (max-width: 640px) {
            .question-text {
                font-size: 1.2rem;
                padding: 16px;
            }
            .badge-area {
                justify-content: center;
            }
            .level-box, .score-box, .timer-box {
                font-size: 0.8rem;
                padding: 5px 12px;
            }
            .answer-input {
                font-size: 1rem;
                padding: 12px 16px;
            }
        }

        .restart-btn {
            background: #7f5539;
            border: none;
            margin-top: 18px;
            padding: 10px;
            width: 100%;
            border-radius: 40px;
            color: #ffeaac;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        footer {
            background: #fef3cf;
            text-align: center;
            font-size: 0.7rem;
            padding: 10px;
            color: #5c3b1f;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <h1>💨 AIR EXPLORER 🧪</h1>
        <div class="badge-area">
            <div class="level-box">🌟 LEVEL <span id="levelNum">1</span>/5</div>
            <div class="score-box">💨 SCORE: <span id="scoreSpan">0</span> / <span id="qPerLevel">40</span></div>
            <div class="timer-box">⏱️ <span id="timerSec">30</span> s</div>
        </div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading air facts...</div>
        <div class="answer-row">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <button id="submitAnswer" class="submit-btn">✅ SUBMIT ANSWER</button>
        <div id="feedbackMsg" class="feedback">🌬️ Type your answer carefully! Timer: 30 seconds per question. Beat the clock!</div>
        <div class="progress">
            📊 Level Progress: <span id="progressCount">0</span>/40 &nbsp;| 🎯 Need 80% (32/40) to advance
        </div>
        <button id="restartGameBtn" class="restart-btn">🔄 RESTART GAME</button>
    </div>
    <footer>🔬 Grade 4 Science: Air Composition, Pollution, Oxygen & Safety | Answer all questions</footer>
</div>

<script>
    // ---------- GRADE 4: COMPOSITION OF AIR, POLLUTION, OXYGEN, SAFETY ----------
    // Topics: composition (nitrogen, oxygen, CO2, argon), air pollution, pollutants (smoke, dust, gases),
    // effects on environment, safety precautions in polluted areas, presence of oxygen, uses of air components.
    
    // TIMER DURATION (seconds per question)
    const TIMER_DURATION = 30;
    
    function generateQuestionsForLevel(level) {
        const baseBank = [
            { text: "Which gas makes up most of the air around us? (about 78%)", answer: "nitrogen" },
            { text: "What is the second most abundant gas in air? (about 21%)", answer: "oxygen" },
            { text: "True or false: Carbon dioxide makes up most of the atmosphere.", answer: "false" },
            { text: "Which gas do humans and animals breathe in to stay alive?", answer: "oxygen" },
            { text: "Name one harmful gas released by cars that causes air pollution.", answer: "carbon monoxide" },
            { text: "What do we call the tiny particles released from factories that pollute air?", answer: "smoke" },
            { text: "What should you wear if you must go outside on a very polluted day?", answer: "mask" },
            { text: "How does air pollution affect trees and plants?", answer: "damages leaves" },
            { text: "Which gas is released when we breathe out?", answer: "carbon dioxide" },
            { text: "Name one natural air pollutant (from volcanoes).", answer: "ash" },
            { text: "Why is oxygen important for a fire?", answer: "helps burning" },
            { text: "What is the layer of air surrounding Earth called?", answer: "atmosphere" },
            { text: "Which gas do plants use to make food during photosynthesis?", answer: "carbon dioxide" },
            { text: "Name one safety precaution when air pollution is severe.", answer: "stay indoors" },
            { text: "What effect does air pollution have on human lungs?", answer: "asthma" },
            { text: "True or false: Nitrogen is used by plants to grow.", answer: "true" },
            { text: "Which human activity is a major cause of air pollution?", answer: "burning fossil fuels" },
            { text: "Name a gas that is present in very small amount in air (0.93%).", answer: "argon" },
            { text: "What is the main harmful effect of smog?", answer: "breathing problems" },
            { text: "Which device can help measure air pollution levels?", answer: "air quality monitor" },
            { text: "What do we call rain that contains harmful gases from pollution?", answer: "acid rain" },
            { text: "Name one way to reduce air pollution at home.", answer: "plant trees" },
            { text: "How does oxygen help in the human body?", answer: "energy production" },
            { text: "Name a disease caused by long-term exposure to polluted air.", answer: "lung cancer" },
            { text: "What gas is needed for rusting to occur?", answer: "oxygen" },
            { text: "What safety action should schools take when air quality is poor?", answer: "cancel outdoor activities" },
            { text: "Which gas makes up about 78% of clean dry air?", answer: "nitrogen" },
            { text: "What is the main pollutant from vehicle exhaust?", answer: "nitrogen oxides" },
            { text: "True or false: Air is a mixture of gases.", answer: "true" },
            { text: "Why should you avoid exercising outdoors on high pollution days?", answer: "inhale pollutants" },
            { text: "Name one use of oxygen in hospitals.", answer: "help patients breathe" },
            { text: "What do factories use to reduce smoke emissions?", answer: "filters" },
            { text: "How does air pollution affect animals?", answer: "respiratory issues" },
            { text: "What is the main component of air we exhale?", answer: "carbon dioxide" },
            { text: "Name a safety measure for workers in polluted areas.", answer: "wear respirator" },
            { text: "Which greenhouse gas is a major air pollutant from vehicles?", answer: "carbon dioxide" },
            { text: "What effect does acid rain have on buildings?", answer: "erodes stone" },
            { text: "Why is argon used in light bulbs?", answer: "prevents oxidation" },
            { text: "What should you do if air pollution alert is red?", answer: "stay indoors" },
            { text: "What is the process by which plants use sunlight, CO2 and water?", answer: "photosynthesis" }
        ];
        
        // ensure 40 questions
        let finalQ = [...baseBank];
        const extras = [
            { text: "Name a respiratory disease worsened by air pollution.", answer: "asthma" },
            { text: "Which common household activity causes indoor air pollution?", answer: "cooking" },
            { text: "What does a mask protect you from in polluted air?", answer: "particles" },
            { text: "How does planting trees help fight air pollution?", answer: "absorb co2" },
            { text: "Which gas is used in fire extinguishers to put out fires?", answer: "carbon dioxide" }
        ];
        while(finalQ.length < 40) finalQ.push(...extras);
        finalQ = finalQ.slice(0,40);
        
        // shuffle for randomness
        for(let i=finalQ.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [finalQ[i], finalQ[j]] = [finalQ[j], finalQ[i]];
        }
        
        // Level-specific difficulty twists
        if(level === 2) {
            finalQ[3].text = "Which gas is essential for burning and respiration?";
            finalQ[3].answer = "oxygen";
        } else if(level === 3) {
            finalQ[10].text = "What gas do plants absorb from air to make food?";
            finalQ[10].answer = "carbon dioxide";
        } else if(level === 4) {
            finalQ[22].text = "Name a harmful effect of breathing carbon monoxide.";
            finalQ[22].answer = "headache";
        } else if(level === 5) {
            finalQ[31].text = "What do we call the protective gear for workers in highly polluted zones?";
            finalQ[31].answer = "respirator";
        }
        return finalQ;
    }
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let questions = [];
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = TIMER_DURATION;
    let gameActive = true;
    
    // DOM elements
    const levelNumSpan = document.getElementById('levelNum');
    const scoreSpan = document.getElementById('scoreSpan');
    const timerSecSpan = document.getElementById('timerSec');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitAnswer');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const progressCountSpan = document.getElementById('progressCount');
    const restartBtn = document.getElementById('restartGameBtn');
    
    function updateUI() {
        levelNumSpan.innerText = currentLevel;
        scoreSpan.innerText = levelScore;
        const answered = currentQIndex;
        progressCountSpan.innerText = `${levelScore} correct / ${answered} answered`;
        
        if(!gameActive) return;
        if(currentQIndex >= 40 && gameActive) {
            const percent = (levelScore / 40) * 100;
            if(percent >= 80) {
                if(currentLevel === 5) {
                    feedbackDiv.innerHTML = "🏆✨ AMAZING! You mastered AIR COMPOSITION & POLLUTION! ✨🏆";
                    gameActive = false;
                    clearTimer();
                    disableGameInputs(true);
                } else {
                    feedbackDiv.innerHTML = `🎉 LEVEL UP! ${percent.toFixed(1)}% correct! Moving to Level ${currentLevel+1} 🎉`;
                    currentLevel++;
                    loadLevel(currentLevel);
                }
            } else {
                feedbackDiv.innerHTML = `😭 FAILED! ${percent.toFixed(1)}% (need 80%). Press RESTART to try again.`;
                gameActive = false;
                clearTimer();
                disableGameInputs(true);
            }
            return;
        }
        if(gameActive && questions.length && currentQIndex < 40) {
            const q = questions[currentQIndex];
            questionTextDiv.innerText = q.text;
        }
        progressCountSpan.innerText = `${levelScore} correct / ${currentQIndex} answered`;
    }
    
    function disableGameInputs(disabled) {
        submitBtn.disabled = disabled;
        answerInput.disabled = disabled;
    }
    
    function clearTimer() {
        if(timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        clearTimer();
        if(!gameActive) return;
        timeLeft = TIMER_DURATION;
        timerSecSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if(!gameActive) return;
            if(timeLeft <= 1) {
                clearTimer();
                handleTimeout();
            } else {
                timeLeft--;
                timerSecSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if(!gameActive) return;
        feedbackDiv.innerHTML = "⏰ TIME'S UP! No answer. Moving to next question.";
        moveToNextQuestion();
    }
    
    function normalizeAnswer(str) {
        let ans = str.trim().toLowerCase();
        ans = ans.replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
        // synonyms & common grade-4 variations
        if(ans === "nitrogen" || ans === "n2") ans = "nitrogen";
        if(ans === "oxygen" || ans === "o2") ans = "oxygen";
        if(ans === "carbon dioxide" || ans === "co2") ans = "carbon dioxide";
        if(ans === "carbon monoxide" || ans === "co") ans = "carbon monoxide";
        if(ans === "true" || ans === "t") ans = "true";
        if(ans === "false" || ans === "f") ans = "false";
        if(ans === "mask" || ans === "face mask") ans = "mask";
        if(ans === "stay inside" || ans === "stay indoors") ans = "stay indoors";
        if(ans === "respirator" || ans === "n95 mask") ans = "respirator";
        if(ans === "ash" || ans === "volcanic ash") ans = "ash";
        if(ans.includes("damages leaves") || ans === "damage leaves") ans = "damages leaves";
        if(ans === "asthma" || ans === "breathing problems") ans = "asthma";
        if(ans === "acid rain" || ans === "acid rain") ans = "acid rain";
        if(ans === "plant trees" || ans === "tree planting") ans = "plant trees";
        if(ans === "burning fossil fuels" || ans === "burning coal") ans = "burning fossil fuels";
        if(ans === "argon" || ans === "ar") ans = "argon";
        if(ans === "photosynthesis" || ans === "making food") ans = "photosynthesis";
        if(ans === "energy production" || ans === "energy") ans = "energy production";
        if(ans === "lung cancer" || ans === "cancer") ans = "lung cancer";
        if(ans === "particles" || ans === "dust") ans = "particles";
        if(ans === "headache" || ans === "dizziness") ans = "headache";
        if(ans === "absorb co2" || ans === "absorb carbon dioxide") ans = "absorb co2";
        if(ans === "cooking" || ans === "burning food") ans = "cooking";
        if(ans === "air quality monitor" || ans === "monitor") ans = "air quality monitor";
        if(ans === "cancel outdoor activities" || ans === "stay inside school") ans = "cancel outdoor activities";
        if(ans === "filters" || ans === "air filters") ans = "filters";
        if(ans === "respiratory issues" || ans === "lung problems") ans = "respiratory issues";
        if(ans === "erodes stone" || ans === "damages buildings") ans = "erodes stone";
        if(ans === "prevents oxidation" || ans === "stops rust") ans = "prevents oxidation";
        if(ans === "inhale pollutants" || ans === "breathe bad air") ans = "inhale pollutants";
        if(ans === "help patients breathe" || ans === "medical oxygen") ans = "help patients breathe";
        return ans;
    }
    
    function checkAnswer() {
        if(!gameActive) return;
        if(currentQIndex >= 40) {
            updateUI();
            return;
        }
        const raw = answerInput.value;
        if(raw.trim() === "") {
            feedbackDiv.innerHTML = "📝 Please type an answer before submitting!";
            return;
        }
        const normalizedUser = normalizeAnswer(raw);
        const currentQ = questions[currentQIndex];
        const correctNorm = normalizeAnswer(currentQ.answer);
        let isCorrect = false;
        if(normalizedUser === correctNorm) isCorrect = true;
        else if(correctNorm === "damages leaves" && (normalizedUser.includes("leaf") || normalizedUser.includes("damage"))) isCorrect = true;
        else if(correctNorm === "photosynthesis" && (normalizedUser.includes("photo") || normalizedUser === "making food")) isCorrect = true;
        else if(correctNorm === "asthma" && (normalizedUser === "breathing problem" || normalizedUser === "wheezing")) isCorrect = true;
        else if(correctNorm === "plant trees" && (normalizedUser.includes("plant") && normalizedUser.includes("tree"))) isCorrect = true;
        else if(correctNorm === "absorb co2" && (normalizedUser.includes("absorb") || normalizedUser.includes("co2"))) isCorrect = true;
        else if(correctNorm === "inhale pollutants" && (normalizedUser.includes("inhale") || normalizedUser.includes("pollutants"))) isCorrect = true;
        else if(correctNorm === "help patients breathe" && (normalizedUser.includes("breathe") || normalizedUser.includes("patients"))) isCorrect = true;
        else if((correctNorm === "true" && normalizedUser === "true") || (correctNorm === "false" && normalizedUser === "false")) isCorrect = true;
        
        if(isCorrect) {
            levelScore++;
            feedbackDiv.innerHTML = "✅ CORRECT! +1 point 💨 " + (currentQ.text.includes("safety") ? "Great safety habit!" : "Air expert!");
        } else {
            feedbackDiv.innerHTML = `❌ WRONG! Correct answer: "${currentQ.answer}". Keep learning about air! 🌍`;
        }
        moveToNextQuestion();
    }
    
    function moveToNextQuestion() {
        clearTimer();
        currentQIndex++;
        answerInput.value = "";
        if(currentQIndex >= 40) {
            updateUI();
            return;
        }
        updateUI();
        if(gameActive && currentQIndex < 40) {
            startTimer();
        }
    }
    
    function loadLevel(level) {
        gameActive = true;
        currentQIndex = 0;
        levelScore = 0;
        currentLevel = level;
        questions = generateQuestionsForLevel(level);
        clearTimer();
        disableGameInputs(false);
        answerInput.disabled = false;
        answerInput.value = "";
        updateUI();
        if(questions.length) questionTextDiv.innerText = questions[0].text;
        startTimer();
        feedbackDiv.innerHTML = `🌿 LEVEL ${level} - 40 questions about Air! Need 80% correct. Timer: ${TIMER_DURATION}s. You can do it! 💪`;
    }
    
    submitBtn.addEventListener("click", () => {
        if(!gameActive) return;
        if(timerInterval) clearTimer();
        checkAnswer();
    });
    
    restartBtn.addEventListener("click", () => {
        clearTimer();
        currentLevel = 1;
        currentQIndex = 0;
        levelScore = 0;
        gameActive = true;
        disableGameInputs(false);
        loadLevel(1);
    });
    
    loadLevel(1);
</script>
</body>
</html>
