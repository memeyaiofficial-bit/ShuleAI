<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Soil Adventures - Grade 1 CBC | Playing with Soil & Making Models</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #8B5A2B 0%, #5D3A1A 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #8B5A2B;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🧑‍🌾🌱 Bobo's Soil Adventures! Learn about playing with soil and making models with soil.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Playing with Soil & Making Models with Soil ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // SOIL BASICS & PLAYING WITH SOIL
        const soilPlay = [
            { q: "The soft, brown earth on the ground is called ______.", a: "soil" },
            { q: "When you add water to dry soil, it becomes ______.", a: "mud" },
            { q: "You can use your ______ to dig and play in the soil.", a: "hands" },
            { q: "A small tool used to dig soil is called a ______.", a: "trowel" },
            { q: "You can make a ______ by patting soil into a ball.", a: "soil ball" },
            { q: "Playing with soil helps us learn about ______.", a: "nature" },
            { q: "Soil is home to many small creatures like ______.", a: "worms" },
            { q: "When soil is very dry, it feels ______.", a: "crumbly" },
            { q: "When soil is wet, it feels ______ and sticky.", a: "soggy" },
            { q: "You can find ______ like pebbles and rocks in soil.", a: "stones" }
        ];
        
        // MAKING MODELS WITH SOIL
        const soilModels = [
            { q: "You can make a small ______ using wet soil.", a: "house" },
            { q: "To make a soil model, you need soil and ______.", a: "water" },
            { q: "You can roll soil into long ______ to make walls.", a: "snakes" },
            { q: "A soil model of a person is called a soil ______.", a: "doll" },
            { q: "You can make a soil ______ to plant seeds in.", a: "pot" },
            { q: "After making a soil model, you let it ______ in the sun.", a: "dry" },
            { q: "You can use a ______ to smooth the surface of your model.", a: "stick" },
            { q: "A soil model of an animal is called a soil ______.", a: "animal" },
            { q: "You can make a soil ______ of your school building.", a: "model" },
            { q: "To join two pieces of soil, you add a little ______.", a: "water" }
        ];
        
        // SOIL PROPERTIES AND USES
        const soilUses = [
            { q: "Plants grow in ______ because it has nutrients.", a: "soil" },
            { q: "Different types of soil have different ______.", a: "colors" },
            { q: "Soil that is dark brown is very ______ for plants.", a: "good" },
            { q: "You should wash your ______ after playing with soil.", a: "hands" },
            { q: "Soil can be used to make ______ for building houses.", a: "bricks" },
            { q: "When you mix soil with water, you can ______ it into shapes.", a: "mold" },
            { q: "Soil models can be painted after they are ______.", a: "dry" },
            { q: "You can use a ______ to dig soil from the ground.", a: "shovel" },
            { q: "Soil feels different when it is wet and when it is ______.", a: "dry" },
            { q: "Playing with soil is a fun way to learn about our ______.", a: "environment" }
        ];
        
        // MODEL-MAKING TECHNIQUES
        const techniques = [
            { q: "To make a soil bowl, you press soil into a ______ shape.", a: "round" },
            { q: "You can decorate your soil model using small ______.", a: "pebbles" },
            { q: "A soil model should be kept away from ______ until it dries.", a: "rain" },
            { q: "You can make a soil ______ of a tree by rolling a long piece.", a: "trunk" },
            { q: "When soil is too wet, your model will ______ apart.", a: "fall" },
            { q: "When soil is too dry, it will not ______ together.", a: "stick" },
            { q: "The best soil for making models has a little ______ mixed in.", a: "sand" },
            { q: "You can use a ______ to carve details into your soil model.", a: "toothpick" },
            { q: "After playing with soil, you should ______ your work area.", a: "clean" },
            { q: "Soil models can be displayed on a ______ for everyone to see.", a: "table" }
        ];
        
        const allTopics = [...soilPlay, ...soilModels, ...soilUses, ...techniques];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 2) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo loves playing with soft, brown earth. This earth is called ______.";
                correctAnswer = "soil";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "To make a soil house, Bobo adds water to soil to make it ______ and easy to shape.";
                correctAnswer = "mud";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "After shaping his soil animal, Bobo puts it in the sun to ______.";
                correctAnswer = "dry";
            }
            if (i % 8 === 0) {
                qText = "Bobo uses a small tool called a ______ to dig soil from the garden.";
                correctAnswer = "trowel";
            }
            if (i % 9 === 0) {
                qText = "When Bobo finishes playing with soil, he always washes his ______ with soap and water.";
                correctAnswer = "hands";
            }
            if (i % 11 === 0) {
                qText = "Bobo makes a long, thin roll of soil like a snake. He uses it to build the ______ of his soil house.";
                correctAnswer = "walls";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: What is soil? Let's learn about the soft, brown earth we play with!";
        else if (currentLevel === 2) levelDesc = "Level 2: How to play with soil? Digging, making mud balls, and having fun!";
        else if (currentLevel === 3) levelDesc = "Level 3: Making models with soil! Create houses, animals, and shapes!";
        else if (currentLevel === 4) levelDesc = "Level 4: Soil properties and model-making techniques! Add water, let it dry!";
        else levelDesc = "Level 5: Final challenge! Become a Grade 1 Soil Model Champion!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Soil Master Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of playing with soil and making soil models! Keep exploring and creating with soil!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know all about soil, how to play with it, and how to make amazing models! 🧑‍🌾🏠✨";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about soil and making models!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for English answers
        if (!isCorrect) {
            const forgiving = {
                "soil": ["dirt", "earth", "ground"],
                "mud": ["wet soil", "clay", "muddy soil"],
                "hands": ["hand", "fingers"],
                "trowel": ["small shovel", "garden tool", "hand shovel"],
                "soil ball": ["mud ball", "dirt ball", "clay ball"],
                "nature": ["environment", "outdoors"],
                "worms": ["earthworms", "worm"],
                "crumbly": ["dry soil", "loose", "sandy"],
                "soggy": ["wet", "muddy", "waterlogged"],
                "stones": ["rocks", "pebbles", "gravel"],
                "house": ["home", "hut", "shelter"],
                "water": ["h2o", "liquid"],
                "snakes": ["coils", "rolls", "soil snakes"],
                "doll": ["figure", "statue", "sculpture"],
                "pot": ["container", "flower pot", "vase"],
                "dry": ["harden", "set", "become hard"],
                "stick": ["twig", "wooden stick", "branch"],
                "animal": ["creature", "beast", "soil animal"],
                "model": ["replica", "miniature", "sculpture"],
                "good": ["nutritious", "fertile", "rich"],
                "bricks": ["mud bricks", "clay bricks"],
                "mold": ["shape", "form", "sculpt"],
                "shovel": ["spade", "digging tool"],
                "environment": ["world", "earth", "planet"],
                "round": ["circular", "circle", "ball shape"],
                "pebbles": ["small stones", "gravel"],
                "rain": ["water", "moisture"],
                "trunk": ["tree trunk", "main part"],
                "fall": ["collapse", "break apart"],
                "stick": ["adhere", "cling", "bond"],
                "sand": ["grit", "sandy soil"],
                "toothpick": ["small stick", "pointed stick"],
                "clean": ["tidy", "wash", "wipe"],
                "table": ["desk", "surface", "bench"],
                "walls": ["wall", "sides", "edges"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // Accept plural/singular
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep learning about soil! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Soil Adventures! Learn about playing with soil and making models with soil. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's get our hands dirty and have fun!");
        }, 500);
    });
</script>
</body>
</html>
