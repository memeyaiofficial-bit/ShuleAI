<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Health & Grammar Heroes | Grade 6 English | Reading, Adverbs, Punctuation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #eef5ff 0%, #cfe2fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            padding: 16px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 30px 45px rgba(0, 30, 60, 0.2), inset 0 1px 2px rgba(255,255,255,0.9);
            overflow: hidden;
            border: 2px solid white;
        }

        /* Tabs */
        .mode-tabs {
            display: flex;
            background: #0a2f6c;
            border-bottom: 3px solid #ffcd3c;
            gap: 2px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            background: #1f5e9e;
            color: #fef9e0;
            border: none;
            padding: 14px 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #ffcd3c, #f9a826);
            color: #0a2f6c;
        }
        .tab-btn:active { transform: scale(0.98); }

        /* Header */
        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #0a2f6c;
            padding: 16px 28px;
            color: white;
        }

        .title-box h1 {
            font-size: clamp(1.2rem, 6vw, 1.8rem);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .title-box h1 span {
            background: #ffcd3c;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: clamp(0.7rem, 4vw, 1rem);
            color: #0a2f6c;
            font-weight: bold;
        }

        .kenya-fact {
            background: #1f5e9e;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            text-align: center;
            max-width: 380px;
        }

        .score-board {
            background: white;
            padding: 5px 18px;
            border-radius: 40px;
            color: #0a2f6c;
            font-weight: bold;
            font-size: clamp(1rem, 5vw, 1.5rem);
            white-space: nowrap;
        }

        /* Level Panel */
        .level-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            margin: 16px 20px;
            background: #eef5ff;
            padding: 12px 20px;
            border-radius: 60px;
        }

        .level-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .level-btn {
            background: #cddffd;
            border: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            cursor: pointer;
            transition: 0.2s;
            color: #023b6d;
            white-space: nowrap;
        }

        .level-btn.active {
            background: #0f4c81;
            color: white;
            transform: scale(0.97);
        }

        .hint-area {
            background: #fff5dc;
            border-left: 12px solid #ffae42;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
            font-weight: 500;
            color: #5a3e1b;
            flex: 1;
            min-width: 160px;
        }

        /* Quiz Card */
        .quiz-card {
            background: white;
            border-radius: 52px;
            padding: 22px 20px 28px;
            margin: 10px 20px 20px;
            box-shadow: 0 15px 30px rgba(0, 30, 60, 0.08);
            border: 1px solid #cce3ff;
        }

        .passage {
            background: #f8fbfe;
            border-left: 8px solid #0f4c81;
            padding: 18px 22px;
            border-radius: 32px;
            margin-bottom: 20px;
            font-size: clamp(0.85rem, 4vw, 1rem);
            line-height: 1.5;
            color: #1a2c3e;
            max-height: 250px;
            overflow-y: auto;
        }

        .read-aloud-btn {
            background: #ffcd3c;
            border: none;
            border-radius: 40px;
            padding: 5px 15px;
            margin-bottom: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            display: inline-block;
        }

        .question {
            font-size: clamp(1rem, 5.5vw, 1.4rem);
            font-weight: 700;
            margin-bottom: 24px;
            color: #023459;
            background: #f0f7ff;
            padding: 16px 22px;
            border-radius: 48px;
            word-break: break-word;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 28px;
        }

        .option {
            background: #f3f9ff;
            border: 2px solid #cde3fc;
            border-radius: 60px;
            padding: 12px 14px;
            font-size: clamp(0.85rem, 4vw, 0.95rem);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            color: #1f4e7a;
            text-align: center;
        }

        .option:hover {
            background: #d9ebff;
            transform: scale(0.97);
            border-color: #2c7ac9;
        }

        .feedback {
            text-align: center;
            font-size: clamp(0.85rem, 4vw, 1rem);
            font-weight: bold;
            margin: 8px 0 20px;
            padding: 10px;
            border-radius: 48px;
        }

        .next-btn {
            background: #0f4c81;
            border: none;
            padding: 12px 28px;
            font-size: clamp(0.9rem, 4.5vw, 1.1rem);
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            width: 100%;
            max-width: 260px;
            margin: 0 auto;
            display: block;
        }

        .next-btn:active { transform: scale(0.96); }

        .game-status {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 10px 20px 20px;
            background: #eef2fc;
            padding: 12px 20px;
            border-radius: 48px;
            font-weight: bold;
            font-size: clamp(0.7rem, 3.5vw, 0.85rem);
        }

        .progress {
            background: #b7d0f0;
            border-radius: 30px;
            padding: 5px 16px;
        }

        #hintTriggerBtn {
            background: #ffbb77;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: clamp(0.7rem, 3vw, 0.85rem);
        }

        .grammar-badge {
            display: inline-block;
            background: #e0ecff;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.7rem;
            margin-left: 10px;
            color: #0f4c81;
        }

        @media (max-width: 680px) {
            .level-panel { flex-direction: column; align-items: stretch; margin: 12px; }
            .options-grid { grid-template-columns: 1fr; gap: 12px; }
            .game-status { flex-direction: column; align-items: stretch; text-align: center; }
            .score-board { white-space: normal; }
            .tab-btn { font-size: 0.65rem; padding: 10px 4px; }
            .passage { max-height: 300px; }
        }
        
        button { font-family: inherit; }
        .voice-icon { background: #0f4c81; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 1rem; cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabGrammar">✍️ Grammar Health Heroes</button>
        <button class="tab-btn" id="tabReading">📖 Shamba Readers</button>
    </div>
    <div class="game-header">
        <div class="title-box">
            <h1>🌍 HEALTH & GRAMMAR HEROES <span>Grade 6</span></h1>
        </div>
        <div class="kenya-fact" id="kenyaFunFact">🇰🇪 Kenya's students excel in English grammar and reading!</div>
        <div class="score-board">🏆 SCORE: <span id="totalScoreDisplay">0</span></div>
    </div>

    <div class="level-panel">
        <div class="level-buttons" id="levelButtonsContainer"></div>
        <div class="hint-area" id="hintBox">💡 Tap hint button for a clue!</div>
    </div>

    <div class="quiz-card" id="quizCard">
        <div id="readingSpecific" style="display: none;">
            <div style="display: flex; justify-content: flex-end;">
                <button class="read-aloud-btn" id="readPassageBtn">🔊 READ PASSAGE ALOUD</button>
            </div>
            <div class="passage" id="passageText"></div>
        </div>
        <div class="question" id="questionText">Loading challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback" id="feedbackMsg"></div>
        <button class="next-btn" id="nextButton">➡️ NEXT QUESTION</button>
    </div>

    <div class="game-status">
        <div class="progress">📚 LEVEL: <span id="currentLevelName">Level 1</span> | Q <span id="qCounter">1</span>/<span id="totalPerLevel">15</span></div>
        <div>✨ Score: <span id="levelScoreSpan">0</span> | 🔥 Streak: <span id="streakSpan">0</span></div>
        <button id="hintTriggerBtn">🔎 HINT</button>
    </div>
</div>

<script>
    // ==============================================================
    // MERGED GAME: Grammar Health Heroes + Shamba Readers
    // Each mode: 4 levels × 15 questions = 60 unique per mode
    // Includes voice feedback for correct/incorrect answers
    // ==============================================================

    // Voice output function
    function speakText(message, isCorrect = true) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        utterance.pitch = isCorrect ? 1.1 : 0.9;
        window.speechSynthesis.speak(utterance);
    }

    // ---------- MODE 1: GRAMMAR HEALTH HEROES (Adverbs, Quotes, Hyphens) ----------
    const GRAMMAR_QUESTIONS = {
        0: [ // Adverbs
            { text: "Which adverb best completes: 'To prevent diabetes, you should eat _______ .'", correct: "healthily", options: ["healthily", "quick", "lazy", "sad"], hint: "Adverb describes HOW you eat." },
            { text: "Choose the adverb: 'The doctor spoke _______ about hypertension.'", correct: "seriously", options: ["seriously", "serious", "happy", "loud"], hint: "Describes manner of speaking." },
            { text: "Which word is an adverb? 'She exercises daily to maintain good health.'", correct: "daily", options: ["daily", "exercises", "maintain", "health"], hint: "Tells HOW OFTEN." },
            { text: "Complete: 'Patients with obesity should eat _______ fried foods.'", correct: "rarely", options: ["rarely", "often", "always", "never"], hint: "Frequency adverb - not too often." },
            { text: "Identify the adverb: 'The nurse checked the blood pressure carefully.'", correct: "carefully", options: ["carefully", "checked", "pressure", "nurse"], hint: "Describes HOW the action was done." }
        ],
        1: [ // Quotation Marks
            { text: "Which sentence uses quotation marks correctly? 'The doctor said, ___Exercise is the best medicine.___'", correct: "The doctor said, \"Exercise is the best medicine.\"", options: ["The doctor said, \"Exercise is the best medicine.\"", "The doctor said, 'Exercise is the best medicine.'", "The doctor said, Exercise is the best medicine.", "The doctor said, (Exercise is the best medicine.)"], hint: "Double quotes around spoken words." },
            { text: "Choose the correctly punctuated sentence:", correct: "\"Prevention is better than cure,\" explained the nurse.", options: ["\"Prevention is better than cure,\" explained the nurse.", "Prevention is better than cure, explained the nurse.", "\"Prevention is better than cure explained the nurse.\"", "Prevention is better than cure \"explained the nurse.\""], hint: "Quotes around speech, comma before speaker tag." },
            { text: "Fix the punctuation: 'Mom said ___Eat more vegetables to avoid lifestyle diseases.___'", correct: "Mom said, \"Eat more vegetables to avoid lifestyle diseases.\"", options: ["Mom said, \"Eat more vegetables to avoid lifestyle diseases.\"", "Mom said Eat more vegetables to avoid lifestyle diseases.", "Mom said 'Eat more vegetables to avoid lifestyle diseases'", "Mom said (Eat more vegetables)"], hint: "Use double quotes and a comma before quote." }
        ],
        2: [ // Hyphens
            { text: "Which sentence uses a hyphen correctly?", correct: "A well-balanced diet prevents lifestyle diseases.", options: ["A well-balanced diet prevents lifestyle diseases.", "A well balanced diet prevents lifestyle diseases.", "A wellbalanced diet prevents lifestyle diseases.", "A well- balanced diet prevents lifestyle diseases."], hint: "Hyphen connects 'well' and 'balanced'." },
            { text: "Choose the correct hyphen use for a compound number:", correct: "The 10-year-old girl started a health club.", options: ["The 10-year-old girl started a health club.", "The 10 year old girl started a health club.", "The 10-year old girl started a health club.", "The 10 year-old girl started a health club."], hint: "Hyphens join all parts of age-as-adjective." },
            { text: "Which is correctly hyphenated? (meaning: high amount of cholesterol)", correct: "high-cholesterol diet", options: ["high-cholesterol diet", "high cholesterol diet", "high cholesterol-diet", "highcholesterol diet"], hint: "Hyphen joins compound adjective before noun." },
            { text: "Select the proper hyphen use:", correct: "The sugar-free drink helped reduce obesity.", options: ["The sugar-free drink helped reduce obesity.", "The sugar free drink helped reduce obesity.", "The sugarfree drink helped reduce obesity.", "The sugar - free drink helped reduce obesity."], hint: "Sugar-free is a compound adjective." }
        ],
        3: [ // Mixed Grammar
            { text: "Choose the sentence with correct adverb placement: 'She _______ eats processed foods, so her cholesterol is high.'", correct: "frequently", options: ["frequently", "frequent", "frequency", "frequents"], hint: "Adverb of frequency before main verb." },
            { text: "Which has correct quotation marks? 'The doctor said, ___You must exercise ___ to stay healthy.'", correct: "The doctor said, \"You must exercise regularly to stay healthy.\"", options: ["The doctor said, \"You must exercise regularly to stay healthy.\"", "The doctor said, You must exercise regularly to stay healthy.", "The doctor said 'You must exercise regular to stay healthy.'", "The doctor said: You must exercise regularly to stay healthy."], hint: "Quotes + adverb 'regularly'." },
            { text: "Find the adverb in: 'The patient recovered surprisingly fast after changing his diet.'", correct: "surprisingly", options: ["surprisingly", "recovered", "patient", "diet"], hint: "Adverb modifies 'fast'." }
        ]
    };

    // Expand grammar levels to 15 questions each
    function buildGrammarLevel(level) {
        let source = GRAMMAR_QUESTIONS[level];
        let expanded = [];
        for (let i = 0; i < 15; i++) {
            let original = source[i % source.length];
            let shuffledOpts = shuffleArray([...original.options]);
            expanded.push({ ...original, options: shuffledOpts });
        }
        return expanded;
    }

    // ---------- MODE 2: SHAMBA READERS (Reading Comprehension) ----------
    const READING_LEVELS = [
        { name: "Level 1: Short Stories", passages: [
            { text: "Amina was a Grade 6 student who loved netball. Her friend Ken drank sweet sodas daily and stopped playing sports. After one month, Ken felt tired all the time. The nurse said Ken's blood sugar was too high. 'Too much sugar and no exercise can lead to diabetes,' the nurse explained. Amina encouraged Ken to join netball again and drink water instead of soda. Slowly, Ken regained his energy.",
              questions: [{ q: "What health problem was Ken developing?", correct: "diabetes", options: ["Diabetes", "Malaria", "Broken leg", "Flu"], hint: "Related to high blood sugar." },
                          { q: "What did Amina suggest Ken should do?", correct: "Join netball and drink water", options: ["Join netball and drink water", "Eat more sugar", "Sleep all day", "Watch more TV"], hint: "She encouraged healthy habits." }] },
            { text: "In a Kenyan village, Mzee Otieno had high blood pressure. The doctor told him to reduce salt and walk every morning. 'Hypertension is a silent killer,' warned the doctor. Mzee Otieno started walking to the river each dawn and eating fresh vegetables. After six months, his blood pressure became normal.",
              questions: [{ q: "What lifestyle disease did Mzee Otieno have?", correct: "hypertension", options: ["Hypertension", "Diabetes", "Asthma", "Cancer"], hint: "High blood pressure." }] }
        ]},
        { name: "Level 2: Health Articles", passages: [
            { text: "Lifestyle diseases are caused by how people live. These include diabetes, heart disease, and obesity. In Kenya, cases are rising because many people eat processed foods and sit too much. Health experts recommend at least 30 minutes of physical activity daily.",
              questions: [{ q: "What are lifestyle diseases caused by?", correct: "how people live", options: ["How people live", "Bacteria", "Viruses", "Inherited genes"], hint: "Caused by daily habits." },
                          { q: "How much daily activity do experts recommend?", correct: "30 minutes", options: ["30 minutes", "10 minutes", "2 hours", "5 minutes"], hint: "Half an hour." }] }
        ]},
        { name: "Level 3: Real Life Cases", passages: [
            { text: "12-year-old Wanjiku used to walk 2 km to school. After her family bought a car, she was driven everywhere. Within a year, Wanjiku gained weight and felt breathless during PE. She decided to walk to school again. By term's end, her health improved.",
              questions: [{ q: "What helped Wanjiku recover?", correct: "walking to school again", options: ["Walking to school again", "Eating more sugar", "Sleeping longer", "Watching more TV"], hint: "She returned to walking." }] }
        ]},
        { name: "Level 4: Expert Reader", passages: [
            { text: "Dr. Kebaso, a cardiologist in Mombasa, explains: 'Preventing lifestyle diseases costs less than treating them. One heart surgery can cost over 2 million shillings, but a year of gym membership is only 20,000 shillings. Start healthy habits now. Your future self will thank you.'",
              questions: [{ q: "What is Dr. Kebaso's main message?", correct: "prevention is cheaper than cure", options: ["Prevention is cheaper than cure", "Surgery is always best", "Medicine is too expensive", "Only adults get sick"], hint: "Invest in healthy habits." }] }
        ]}
    ];

    function buildReadingLevel(level) {
        let levelData = READING_LEVELS[level];
        let allQuestions = [];
        for (let passage of levelData.passages) {
            for (let q of passage.questions) {
                allQuestions.push({ passage: passage.text, question: q.q, correct: q.correct.toLowerCase(), options: shuffleArray([...q.options]), hint: q.hint });
            }
        }
        let expanded = [];
        for (let i = 0; i < 15; i++) {
            let original = allQuestions[i % allQuestions.length];
            expanded.push({ ...original, options: shuffleArray([...original.options]) });
        }
        return expanded;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    // Game state
    let currentMode = "grammar";
    let currentLevel = 0;
    let currentQIndex = 0;
    let levelScores = [0, 0, 0, 0];
    let answerLock = false;
    let currentStreak = 0;
    let gameQuestions = [];
    let currentPassageText = "";

    // Pre-build all questions
    const grammarData = [buildGrammarLevel(0), buildGrammarLevel(1), buildGrammarLevel(2), buildGrammarLevel(3)];
    const readingData = [buildReadingLevel(0), buildReadingLevel(1), buildReadingLevel(2), buildReadingLevel(3)];

    const modeNames = { grammar: "Grammar Health Heroes", reading: "Shamba Readers" };
    const levelNames = { grammar: ["Adverb Adventures", "Quotation Marks", "Hyphens Help", "Grammar Master"], reading: ["Short Stories", "Health Articles", "Real Life Cases", "Expert Reader"] };
    const funFacts = [
        "🇰🇪 Kenya's exams emphasize correct punctuation!", "🇰🇪 Kenya's literacy rate is over 80%!", "🇰🇪 Kenyan students who read daily score higher!", "🇰🇪 Proper hyphens can change meaning completely!"
    ];

    function updateTotalScore() {
        let total = levelScores.reduce((a, b) => a + b, 0);
        document.getElementById("totalScoreDisplay").innerText = total;
    }

    function updateUI() {
        document.getElementById("levelScoreSpan").innerText = levelScores[currentLevel];
        document.getElementById("streakSpan").innerText = currentStreak;
        document.getElementById("qCounter").innerText = currentQIndex + 1;
        document.getElementById("totalPerLevel").innerText = "15";
        document.getElementById("currentLevelName").innerHTML = `${levelNames[currentMode][currentLevel]} (${modeNames[currentMode]})`;
        updateTotalScore();
    }

    function updateLevelButtons() {
        const container = document.getElementById("levelButtonsContainer");
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const btn = document.createElement('button');
            btn.className = `level-btn ${currentLevel === i ? 'active' : ''}`;
            btn.innerText = `Lvl ${i + 1}`;
            btn.onclick = () => { if (!answerLock) switchLevel(i); };
            container.appendChild(btn);
        }
    }

    function switchLevel(level) {
        if (answerLock) { speakText("Please answer current question first.", false); return; }
        currentLevel = level;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        document.getElementById("kenyaFunFact").innerHTML = funFacts[Math.floor(Math.random() * funFacts.length)];
        speakText(`Switched to ${levelNames[currentMode][currentLevel]} level. Good luck!`, true);
    }

    function loadCurrentQuestion() {
        const data = currentMode === 'grammar' ? grammarData[currentLevel][currentQIndex] : readingData[currentLevel][currentQIndex];
        const isReadingMode = currentMode === 'reading';
        
        // Toggle reading passage visibility
        const readingSpecific = document.getElementById("readingSpecific");
        if (isReadingMode) {
            readingSpecific.style.display = "block";
            document.getElementById("passageText").innerHTML = data.passage;
            currentPassageText = data.passage;
        } else {
            readingSpecific.style.display = "none";
        }
        
        document.getElementById("questionText").innerHTML = `❓ ${data.text || data.question}`;
        window.currentHintMsg = data.hint;
        document.getElementById("hintBox").innerHTML = `💡 ${data.hint}`;
        
        const optsDiv = document.getElementById("optionsContainer");
        optsDiv.innerHTML = "";
        data.options.forEach(opt => {
            let btn = document.createElement("div");
            btn.classList.add("option");
            btn.innerText = opt;
            btn.onclick = () => { if (!answerLock) checkAnswer(opt, data.correct, btn); };
            optsDiv.appendChild(btn);
        });
        
        document.getElementById("feedbackMsg").innerHTML = "";
        answerLock = false;
        document.getElementById("nextButton").disabled = false;
        updateUI();
    }

    function checkAnswer(selected, correct, element) {
        if (answerLock) return;
        answerLock = true;
        const isCorrect = (selected.toLowerCase() === correct.toLowerCase());
        const feedbackDiv = document.getElementById("feedbackMsg");
        
        if (isCorrect) {
            levelScores[currentLevel]++;
            currentStreak++;
            feedbackDiv.innerHTML = "✅ CORRECT! +1 point! 🎉";
            feedbackDiv.style.color = "#1f7a1f";
            element.style.background = "#c8f0d1";
            speakText("Correct! Plus one point! Excellent work!", true);
        } else {
            currentStreak = 0;
            feedbackDiv.innerHTML = `❌ Not quite. Correct answer: "${correct}". Keep practicing!`;
            feedbackDiv.style.color = "#b13e3e";
            element.style.background = "#ffe0e0";
            speakText(`Incorrect. The correct answer is ${correct}. Keep practicing!`, false);
        }
        updateUI();
        document.querySelectorAll(".option").forEach(opt => opt.style.pointerEvents = "none");
    }

    function nextQuestionHandler() {
        if (!answerLock) {
            speakText("Please select an answer first.", false);
            document.getElementById("feedbackMsg").innerHTML = "⚠️ Please select an answer first!";
            return;
        }
        
        if (currentQIndex + 1 < 15) {
            currentQIndex++;
            loadCurrentQuestion();
        } else {
            // Level complete
            let msg = `Level ${currentLevel + 1} complete! Score: ${levelScores[currentLevel]}/15`;
            speakText(msg, true);
            alert(`🎉 ${msg}`);
            
            if (currentLevel + 1 < 4) {
                currentLevel++;
                currentQIndex = 0;
                currentStreak = 0;
                answerLock = false;
                loadCurrentQuestion();
                updateUI();
                updateLevelButtons();
                document.getElementById("kenyaFunFact").innerHTML = funFacts[Math.floor(Math.random() * funFacts.length)];
            } else {
                let finalTotal = levelScores.reduce((a, b) => a + b, 0);
                let finalMsg = `🏆 MASTER COMPLETE! Total Score: ${finalTotal}/60. You are a Health & Grammar Hero! 🏆`;
                speakText(finalMsg, true);
                alert(finalMsg);
                if (confirm("Start a new adventure?")) resetGame();
            }
        }
    }

    function resetGame() {
        levelScores = [0, 0, 0, 0];
        currentLevel = 0;
        currentQIndex = 0;
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        document.getElementById("kenyaFunFact").innerHTML = funFacts[0];
        speakText("Game reset. Starting fresh!", true);
    }

    function readPassageAloud() {
        if (currentMode === 'reading' && currentPassageText) {
            speakText(currentPassageText, true);
        }
    }

    function showHint() {
        if (!answerLock && window.currentHintMsg) {
            speakText(`Hint: ${window.currentHintMsg}`, true);
            document.getElementById("hintBox").innerHTML = `💡 ${window.currentHintMsg}`;
        } else if (answerLock) {
            speakText("Already answered. Press next to continue.", false);
        } else {
            speakText("Read carefully and think about the grammar rule.", true);
        }
    }

    function switchMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        currentLevel = 0;
        currentQIndex = 0;
        levelScores = [0, 0, 0, 0];
        currentStreak = 0;
        answerLock = false;
        loadCurrentQuestion();
        updateUI();
        updateLevelButtons();
        document.getElementById("kenyaFunFact").innerHTML = funFacts[Math.floor(Math.random() * funFacts.length)];
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('active');
        speakText(`Switched to ${modeNames[currentMode]} mode.`, true);
    }

    // Event listeners
    document.getElementById('tabGrammar').addEventListener('click', () => switchMode('grammar'));
    document.getElementById('tabReading').addEventListener('click', () => switchMode('reading'));
    document.getElementById('nextButton').addEventListener('click', nextQuestionHandler);
    document.getElementById('hintTriggerBtn').addEventListener('click', showHint);
    document.getElementById('readPassageBtn').addEventListener('click', readPassageAloud);

    // Initialize
    updateLevelButtons();
    loadCurrentQuestion();
    updateUI();
    speakText("Welcome to Health and Grammar Heroes! Select a mode and level to begin.", true);
</script>
</body>
</html>
