<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakari Machachari - Mchezo wa Kiswahili</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --primary: #FF6B35;
    --secondary: #FFD700;
    --accent: #4ECDC4;
    --bg-deep: #1a0a2e;
    --bg-mid: #2d1b4e;
    --bg-light: #3d2b5e;
    --text-bright: #fff;
    --text-soft: #e0d4f7;
    --success: #2ecc71;
    --danger: #e74c3c;
    --card-bg: rgba(255,255,255,0.08);
    --card-border: rgba(255,255,255,0.15);
    --timer-safe: #2ecc71;
    --timer-warn: #f39c12;
    --timer-danger: #e74c3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-mid) 50%, #1a3a5c 100%);
    min-height: 100vh;
    color: var(--text-bright);
    overflow-x: hidden;
  }

  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute; background: #fff; border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle { from { opacity: 0.2; transform: scale(1); } to { opacity: 1; transform: scale(1.3); } }
  @keyframes float { 0%,100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%,100% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.9); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  @keyframes confetti-fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
  @keyframes timerPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.4); } 50% { box-shadow: 0 0 0 15px rgba(231,76,60,0); } }

  /* ====== SCREENS ====== */
  .screen { display: none; position: relative; z-index: 10; }
  .screen.active { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

  /* ====== INTRO SCREEN ====== */
  #introScreen { justify-content: center; text-align: center; }

  .hero-character {
    font-size: clamp(80px, 15vw, 140px);
    animation: float 3s ease-in-out infinite;
    display: block; margin-bottom: 10px;
    filter: drop-shadow(0 10px 30px rgba(255,107,53,0.5));
  }

  .game-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 800;
    background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 50%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .game-subtitle {
    font-size: clamp(14px, 3vw, 20px);
    color: var(--text-soft);
    margin-bottom: 30px;
    font-weight: 600;
  }

  .level-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }

  .level-btn {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 10px;
    cursor: pointer;
    transition: all 0.3s;
    color: white;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 700;
    position: relative;
    overflow: hidden;
  }

  .level-btn:hover, .level-btn.active {
    transform: translateY(-4px) scale(1.05);
    border-color: var(--secondary);
    background: rgba(255,215,0,0.15);
    box-shadow: 0 8px 25px rgba(255,215,0,0.3);
  }

  .level-btn .level-icon { font-size: 28px; display: block; margin-bottom: 4px; }
  .level-btn.locked { opacity: 0.4; cursor: not-allowed; }
  .level-btn.locked:hover { transform: none; }

  .level-badge {
    position: absolute; top: 6px; right: 6px;
    background: var(--success);
    border-radius: 50%; width: 20px; height: 20px;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
  }

  .start-btn {
    background: linear-gradient(135deg, var(--primary), #ff8c42);
    border: none; border-radius: 50px;
    padding: 16px 50px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 800;
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 30px rgba(255,107,53,0.5);
    animation: pulse 2s infinite;
    letter-spacing: 1px;
  }

  .start-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 40px rgba(255,107,53,0.7);
  }

  .music-toggle {
    position: fixed; top: 15px; right: 15px; z-index: 1000;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 50%; width: 50px; height: 50px;
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  .music-toggle:hover { transform: scale(1.1); border-color: var(--secondary); }

  /* ====== GAME SCREEN ====== */
  #gameScreen { padding: 15px; }

  .game-header {
    width: 100%; max-width: 800px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 15px; gap: 10px;
    flex-wrap: wrap;
  }

  .level-info {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: clamp(13px, 2vw, 16px);
    color: var(--secondary);
  }

  .score-display {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: clamp(13px, 2vw, 16px);
    color: var(--accent);
  }

  .progress-bar-wrap {
    width: 100%; max-width: 800px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px; height: 10px;
    margin-bottom: 10px; overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  /* TIMER */
  .timer-wrap {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 12px;
  }

  .timer-circle {
    width: clamp(70px, 15vw, 90px);
    height: clamp(70px, 15vw, 90px);
    border-radius: 50%;
    background: conic-gradient(var(--timer-safe) var(--pct, 100%), rgba(255,255,255,0.1) 0%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: background 0.3s;
  }

  .timer-circle::before {
    content: '';
    position: absolute;
    width: calc(100% - 12px);
    height: calc(100% - 12px);
    background: var(--bg-deep);
    border-radius: 50%;
  }

  .timer-num {
    position: relative; z-index: 1;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 800;
    color: var(--timer-safe);
    transition: color 0.3s;
  }

  /* NARRATIVE CARD */
  .narrative-card {
    width: 100%; max-width: 800px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: clamp(16px, 4vw, 30px);
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
    animation: slideIn 0.5s ease;
    position: relative;
    overflow: hidden;
  }

  .narrative-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
  }

  .character-bubble {
    display: flex; gap: 12px; align-items: flex-start;
    margin-bottom: 16px;
  }

  .char-avatar {
    font-size: clamp(36px, 8vw, 56px);
    flex-shrink: 0;
    animation: float 3s ease-in-out infinite;
  }

  .bubble-text {
    background: rgba(255,255,255,0.1);
    border-radius: 0 20px 20px 20px;
    padding: 14px 18px;
    font-size: clamp(14px, 2.5vw, 18px);
    line-height: 1.6;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    flex: 1;
  }

  .bubble-text::before {
    content: '';
    position: absolute; left: -10px; top: 15px;
    border: 10px solid transparent;
    border-right-color: rgba(255,255,255,0.1);
  }

  .question-label {
    font-size: clamp(11px, 2vw, 14px);
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .question-text {
    font-size: clamp(15px, 2.8vw, 20px);
    font-weight: 700;
    line-height: 1.5;
    color: var(--text-bright);
  }

  /* OPTIONS */
  .options-grid {
    width: 100%; max-width: 800px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
  }

  @media (max-width: 480px) {
    .options-grid { grid-template-columns: 1fr; }
  }

  .option-btn {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 16px;
    padding: clamp(12px, 3vw, 18px) clamp(14px, 3vw, 20px);
    font-family: 'Nunito', sans-serif;
    font-size: clamp(13px, 2.2vw, 17px);
    font-weight: 700;
    color: var(--text-bright);
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
    display: flex; align-items: center; gap: 10px;
    animation: slideIn 0.4s ease backwards;
    line-height: 1.4;
  }

  .option-btn:nth-child(1) { animation-delay: 0.05s; }
  .option-btn:nth-child(2) { animation-delay: 0.10s; }
  .option-btn:nth-child(3) { animation-delay: 0.15s; }
  .option-btn:nth-child(4) { animation-delay: 0.20s; }

  .option-btn:hover:not(:disabled) {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--accent);
    background: rgba(78,205,196,0.15);
    box-shadow: 0 6px 20px rgba(78,205,196,0.3);
  }

  .option-btn.correct {
    border-color: var(--success) !important;
    background: rgba(46,204,113,0.25) !important;
    animation: bounce 0.6s ease !important;
    box-shadow: 0 0 25px rgba(46,204,113,0.5) !important;
  }

  .option-btn.wrong {
    border-color: var(--danger) !important;
    background: rgba(231,76,60,0.25) !important;
    animation: shake 0.5s ease !important;
  }

  .option-btn:disabled { cursor: default; }

  .option-letter {
    width: 32px; height: 32px; min-width: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 14px;
  }

  /* FEEDBACK */
  .feedback-msg {
    width: 100%; max-width: 800px;
    border-radius: 16px;
    padding: 14px 20px;
    font-weight: 700;
    font-size: clamp(14px, 2.5vw, 17px);
    margin-bottom: 12px;
    display: none;
    animation: slideIn 0.4s ease;
    line-height: 1.5;
  }

  .feedback-msg.show { display: flex; gap: 10px; align-items: flex-start; }
  .feedback-msg.correct { background: rgba(46,204,113,0.2); border: 2px solid var(--success); color: #a8ffcc; }
  .feedback-msg.wrong { background: rgba(231,76,60,0.2); border: 2px solid var(--danger); color: #ffb3ae; }

  .next-btn {
    background: linear-gradient(135deg, var(--accent), #2eafd4);
    border: none; border-radius: 50px;
    padding: 14px 40px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 800;
    color: white;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 6px 20px rgba(78,205,196,0.4);
    display: none;
  }

  .next-btn:hover { transform: scale(1.06); box-shadow: 0 10px 30px rgba(78,205,196,0.6); }
  .next-btn.show { display: block; }

  /* RESULTS SCREEN */
  #resultsScreen { justify-content: center; text-align: center; }

  .results-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: clamp(25px, 5vw, 50px) clamp(20px, 5vw, 50px);
    max-width: 550px;
    width: 100%;
    backdrop-filter: blur(15px);
    animation: slideIn 0.6s ease;
  }

  .results-emoji { font-size: clamp(60px, 12vw, 90px); display: block; margin-bottom: 10px; }
  .results-title { font-family: 'Baloo 2', cursive; font-size: clamp(24px, 5vw, 36px); font-weight: 800; margin-bottom: 8px; }
  .results-score { font-family: 'Baloo 2', cursive; font-size: clamp(48px, 10vw, 80px); font-weight: 800; background: linear-gradient(135deg, var(--secondary), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .results-pct { font-size: clamp(18px, 3.5vw, 26px); color: var(--text-soft); margin-bottom: 20px; }
  .results-msg { font-size: clamp(14px, 2.5vw, 17px); color: var(--text-soft); margin-bottom: 25px; line-height: 1.6; }

  .results-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn-retry, .btn-next-level, .btn-home {
    border: none; border-radius: 40px;
    padding: 12px 28px;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(14px, 2.5vw, 18px);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-retry { background: rgba(255,255,255,0.15); color: white; border: 2px solid rgba(255,255,255,0.3); }
  .btn-retry:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
  .btn-next-level { background: linear-gradient(135deg, var(--success), #27ae60); color: white; box-shadow: 0 6px 20px rgba(46,204,113,0.4); }
  .btn-next-level:hover { transform: scale(1.06); }
  .btn-home { background: linear-gradient(135deg, var(--primary), #ff8c42); color: white; box-shadow: 0 6px 20px rgba(255,107,53,0.4); }
  .btn-home:hover { transform: scale(1.06); }

  /* CONFETTI */
  .confetti-piece {
    position: fixed; width: 10px; height: 10px;
    top: -20px; pointer-events: none; z-index: 9999;
    animation: confetti-fall linear forwards;
  }

  /* QUIZ COUNT */
  .quiz-count {
    font-size: clamp(12px, 2vw, 15px);
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 8px;
    font-weight: 600;
  }

  /* TIMER WARN */
  .timer-circle.warn { --timer-color: var(--timer-warn); animation: timerPulse 1s infinite; }
  .timer-circle.danger { --timer-color: var(--timer-danger); }

  .hearts-row { display: flex; gap: 6px; align-items: center; font-size: 20px; }

  .streak-badge {
    background: linear-gradient(135deg, var(--secondary), var(--primary));
    border-radius: 20px; padding: 4px 12px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800; font-size: 13px;
    color: white;
    display: none;
  }

  .streak-badge.show { display: block; }

  /* loading */
  .loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-deep);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 9999;
    transition: opacity 0.8s ease;
  }

  .loading-screen.hide { opacity: 0; pointer-events: none; }
  .loading-char { font-size: 80px; animation: float 1.5s ease-in-out infinite; margin-bottom: 20px; }
  .loading-text { font-family: 'Baloo 2', cursive; font-size: 24px; color: var(--secondary); animation: pulse 1s infinite; }
  .loading-bar-wrap { width: 250px; background: rgba(255,255,255,0.1); border-radius: 10px; height: 8px; margin-top: 20px; overflow: hidden; }
  .loading-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; width: 0%; transition: width 0.1s; }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="starsContainer"></div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-char">🦁</div>
  <div class="loading-text">Inaandaa mchezo...</div>
  <div class="loading-bar-wrap"><div class="loading-bar-fill" id="loadingBar"></div></div>
</div>

<!-- Music Toggle -->
<button class="music-toggle" id="musicToggle" title="Muziki">🎵</button>

<!-- ===== INTRO SCREEN ===== -->
<div class="screen" id="introScreen">
  <span class="hero-character">🦁</span>
  <div class="game-title">Bakari Machachari</div>
  <div class="game-subtitle">Mchezo wa Kiswahili — Darasa la 2</div>

  <div class="level-select-grid" id="levelGrid"></div>

  <button class="start-btn" id="startBtn" onclick="startGame()">
    🎮 Cheza Sasa!
  </button>

  <div style="margin-top:20px; color: var(--text-soft); font-size:13px; font-weight:600;">
    ⏱️ Sekunde 40 kwa kila swali &nbsp;|&nbsp; 🏆 80% kupita kiwango
  </div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="level-info" id="levelInfo">Kiwango 1</div>
    <div class="hearts-row" id="heartsRow"></div>
    <div class="score-display" id="scoreDisplay">Pointi: 0</div>
    <div class="streak-badge" id="streakBadge">🔥 x1</div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="quiz-count" id="quizCount">Swali 1 / 40</div>

  <div class="timer-wrap">
    <div class="timer-circle" id="timerCircle">
      <span class="timer-num" id="timerNum">40</span>
    </div>
  </div>

  <div class="narrative-card" id="narrativeCard">
    <div class="character-bubble" id="charBubble"></div>
    <div class="question-label">❓ Swali</div>
    <div class="question-text" id="questionText"></div>
  </div>

  <div class="options-grid" id="optionsGrid"></div>

  <div class="feedback-msg" id="feedbackMsg"></div>

  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">
    Swali Linalofuata ➜
  </button>
</div>

<!-- ===== RESULTS SCREEN ===== -->
<div class="screen" id="resultsScreen">
  <div class="results-card">
    <span class="results-emoji" id="resultsEmoji">🎉</span>
    <div class="results-title" id="resultsTitle">Hongera!</div>
    <div class="results-score" id="resultsScore">35/40</div>
    <div class="results-pct" id="resultsPct">88%</div>
    <div class="results-msg" id="resultsMsg">Umefanya vizuri sana!</div>
    <div class="results-btns">
      <button class="btn-retry" onclick="retryLevel()">🔄 Jaribu Tena</button>
      <button class="btn-next-level" id="nextLevelBtn" onclick="goNextLevel()">⭐ Kiwango Kinachofuata</button>
      <button class="btn-home" onclick="goHome()">🏠 Nyumbani</button>
    </div>
  </div>
</div>

<script>
// ==================== AUDIO ENGINE ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicPlaying = false;
let musicOscillators = [];
let musicInterval = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playTone(freq, duration, type='sine', gain=0.3, delay=0) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gainNode.gain.setValueAtTime(0, ctx.currentTime + delay);
    gainNode.gain.linearRampToValueAtTime(gain, ctx.currentTime + delay + 0.02);
    gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + delay + duration - 0.02);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  } catch(e){}
}

function playSoundCorrect() {
  playTone(523, 0.15, 'sine', 0.3);
  playTone(659, 0.15, 'sine', 0.3, 0.15);
  playTone(784, 0.3, 'sine', 0.35, 0.3);
}

function playSoundWrong() {
  playTone(200, 0.2, 'sawtooth', 0.25);
  playTone(150, 0.3, 'sawtooth', 0.25, 0.2);
}

function playSoundTimerEnd() {
  for(let i=0;i<3;i++) playTone(880, 0.1, 'square', 0.2, i*0.15);
}

function playSoundTick() {
  playTone(1000, 0.05, 'square', 0.05);
}

function playLevelUp() {
  const notes = [523,587,659,698,784,880];
  notes.forEach((n,i) => playTone(n, 0.2, 'sine', 0.3, i*0.12));
}

// Intro music - fun jingle
function startIntroMusic() {
  if(musicPlaying) return;
  musicPlaying = true;

  let i = 0;
  function playNext() {
    if(!musicPlaying) return;
    const n = melody[i % melody.length];
    playTone(n, 0.3, 'sine', 0.18);

    i++;
    musicInterval = setTimeout(playNext, 380);
  }
  playNext();
}

function stopIntroMusic() {
  musicPlaying = false;
  if(musicInterval) clearTimeout(musicInterval);
}

// Speech synthesis
function speak(text, lang='sw-KE') {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang;
  utt.rate = 0.9;
  utt.pitch = 1.1;
  window.speechSynthesis.speak(utt);
}

// ==================== GAME STATE ====================
let currentLevel = 0;
let currentQ = 0;
let score = 0;
let answers = 0;
let lives = 3;
let streak = 0;
let timerVal = 40;
let timerInterval = null;
let answered = false;
let levelQuestions = [];
let musicOn = true;
let unlockedLevels = [0];
const PASS_PCT = 0.80;
const TIMER_MAX = 40;

// ==================== STARS ====================
function createStars() {
  const c = document.getElementById('starsContainer');
  for(let i=0;i<80;i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+1;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s;`;
    c.appendChild(s);
  }
}

// ==================== LOADING ====================
function runLoading() {
  let pct = 0;
  const bar = document.getElementById('loadingBar');
  const interval = setInterval(() => {
    pct += Math.random()*15;
    if(pct >= 100) {
      pct = 100;
      bar.style.width = '100%';
      clearInterval(interval);
      setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hide');
        setTimeout(() => document.getElementById('loadingScreen').remove(), 800);
        showScreen('introScreen');
        if(musicOn) startIntroMusic();
      }, 500);
    }
    bar.style.width = pct + '%';
  }, 120);
}

// ==================== SCREENS ====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ==================== LEVEL SELECT ====================
function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  const icons = ['🌱','⭐','🔥','💎','🏆'];
  const names = ['Kwanza','Pili','Tatu','Nne','Tano'];
  grid.innerHTML = '';
  for(let i=0;i<5;i++) {
    const btn = document.createElement('button');
    btn.className = 'level-btn' + (i === currentLevel ? ' active' : '') + (unlockedLevels.includes(i) ? '' : ' locked');
    btn.innerHTML = `<span class="level-icon">${icons[i]}</span>Kiwango ${names[i]}`;
    if(unlockedLevels.includes(i)) {
      btn.onclick = () => {
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLevel = i;
      };
    }
    grid.appendChild(btn);
  }
}

// ==================== GAME START ====================
function startGame() {
  stopIntroMusic();
  getAudioCtx(); // unlock audio context
  levelQuestions = shuffle([...allLevels[currentLevel]]).slice(0,40);
  currentQ = 0;
  score = 0;
  answers = 0;
  lives = 3;
  streak = 0;
  showScreen('gameScreen');
  loadQuestion();
}

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function loadQuestion() {
  answered = false;
  clearInterval(timerInterval);

  const q = levelQuestions[currentQ];
  const total = levelQuestions.length;

  document.getElementById('levelInfo').textContent = `🏅 Kiwango ${currentQ < total ? currentLevel+1 : currentLevel+1}`;
  document.getElementById('scoreDisplay').textContent = `⭐ Pointi: ${score}`;
  document.getElementById('quizCount').textContent = `Swali ${currentQ+1} / ${total}`;
  document.getElementById('progressBar').style.width = ((currentQ/total)*100)+'%';

  // Hearts
  const hr = document.getElementById('heartsRow');
  hr.innerHTML = '';
  for(let i=0;i<3;i++) {
    const h = document.createElement('span');
    h.textContent = i < lives ? '❤️' : '🖤';
    h.style.fontSize = '20px';
    hr.appendChild(h);
  }

  // Streak
  const sb = document.getElementById('streakBadge');
  if(streak >= 2) { sb.className='streak-badge show'; sb.textContent=`🔥 ${streak} mfululizo!`; }
  else { sb.className='streak-badge'; }

  // Narrative
  const charBubble = document.getElementById('charBubble');
  charBubble.innerHTML = `
    <div class="char-avatar">${q.char}</div>
    <div class="bubble-text"><strong>${q.charName} anasema:</strong><br>${q.narrative}</div>
  `;
  document.getElementById('questionText').textContent = q.q;

  // Options
  const og = document.getElementById('optionsGrid');
  og.innerHTML = '';
  const letters = ['A','B','C','D'];
  const shuffledOpts = shuffleOpts(q.opts, q.ans);
  shuffledOpts.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.style.animationDelay = (i*0.06)+'s';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
    btn.onclick = () => selectAnswer(btn, i, shuffledOpts.correctIdx, q.exp);
    og.appendChild(btn);
  });

  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('nextBtn').className = 'next-btn';

  startTimer();
}

function shuffleOpts(opts, correctIdx) {
  const items = opts.map((o,i) => ({text:o, isCorrect: i===correctIdx}));
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  const newCorrect = items.findIndex(it => it.isCorrect);
  return {opts: items.map(it=>it.text), correctIdx: newCorrect};
}

// ==================== TIMER ====================
function startTimer() {
  timerVal = TIMER_MAX;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerVal--;
    updateTimerUI();
    if(timerVal <= 5) playSoundTick();
    if(timerVal <= 0) {
      clearInterval(timerInterval);
      timeUp();
    }
  }, 1000);
}

function updateTimerUI() {
  const pct = (timerVal/TIMER_MAX)*100;
  const circle = document.getElementById('timerCircle');
  const num = document.getElementById('timerNum');
  circle.style.setProperty('--pct', pct + '%');
  num.textContent = timerVal;
  let color;
  if(timerVal > 20) color = '#2ecc71';
  else if(timerVal > 10) color = '#f39c12';
  else color = '#e74c3c';
  circle.style.background = `conic-gradient(${color} ${pct}%, rgba(255,255,255,0.1) 0%)`;
  num.style.color = color;
}

function timeUp() {
  if(answered) return;
  answered = true;
  playSoundTimerEnd();
  speak('Muda umekwisha! Jaribu tena.', 'sw-KE');
  lives--;
  streak = 0;
  disableOptions();
  showFeedback(false, 'Muda umekwisha! ⏰ ' + (levelQuestions[currentQ].exp || ''));
  highlightCorrect();
  document.getElementById('nextBtn').className = 'next-btn show';
  if(lives <= 0) { setTimeout(endLevel, 1800); return; }
}

// ==================== ANSWER ====================
function selectAnswer(btn, chosen, correctIdx, exp) {
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  answers++;

  const isCorrect = chosen === correctIdx;
  const btns = document.querySelectorAll('.option-btn');

  if(isCorrect) {
    btn.classList.add('correct');
    score += Math.max(1, Math.ceil(timerVal/10)) + (streak >= 2 ? streak : 0);
    streak++;
    playSoundCorrect();
    speak('Vizuri sana! Jibu sahihi!', 'sw-KE');
    showFeedback(true, '✅ Sahihi kabisa! ' + exp);
    if(streak >= 3) setTimeout(() => spawnConfetti(), 200);
  } else {
    btn.classList.add('wrong');
    btns[correctIdx].classList.add('correct');
    lives--;
    streak = 0;
    playSoundWrong();
    speak('Jibu si sahihi. Jaribu tena!', 'sw-KE');
    showFeedback(false, '❌ Jibu si sahihi. ' + exp);
  }

  document.getElementById('nextBtn').className = 'next-btn show';
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  if(lives <= 0 && !isCorrect) {
    setTimeout(endLevel, 1800);
  }
}

function disableOptions() {
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
}

function highlightCorrect() {
  const q = levelQuestions[currentQ];
  // We can't directly know the shuffled correct idx here since shuffleOpts is called in loadQuestion
  // Instead highlight by green all that should be correct via data or just show feedback
}

function showFeedback(correct, msg) {
  const el = document.getElementById('feedbackMsg');
  el.className = 'feedback-msg show ' + (correct ? 'correct' : 'wrong');
  el.innerHTML = msg;
}

// ==================== NEXT ====================
function nextQuestion() {
  currentQ++;
  if(currentQ >= levelQuestions.length) {
    endLevel();
    return;
  }
  loadQuestion();
}

// ==================== END LEVEL ====================
function endLevel() {
  clearInterval(timerInterval);
  stopIntroMusic();
  const total = levelQuestions.length;
  const pct = score / (total * 4); // rough max score
  const correctAnswers = Math.min(currentQ + (answered ? 1 : 0), total);
  // Better: track correct count separately
  showResults(score, currentQ, total);
}

let correctCount = 0;

function selectAnswerFixed(btn, chosen, correctIdx, exp) {
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);

  const isCorrect = chosen === correctIdx;
  if(isCorrect) { correctCount++; score += Math.max(1,Math.ceil(timerVal/10))+(streak>=2?streak:0); streak++; }
  else { lives--; streak=0; }

  const btns = document.querySelectorAll('.option-btn');
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  if(!isCorrect) btns[correctIdx].classList.add('correct');

  if(isCorrect) { playSoundCorrect(); speak('Vizuri sana! Jibu sahihi!','sw-KE'); showFeedback(true,'✅ Sahihi kabisa! '+exp); if(streak>=3) setTimeout(()=>spawnConfetti(),200); }
  else { playSoundWrong(); speak('Jibu si sahihi. Jaribu tena!','sw-KE'); showFeedback(false,'❌ Jibu si sahihi. '+exp); }

  document.getElementById('nextBtn').className='next-btn show';
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  if(lives<=0&&!isCorrect){setTimeout(showResults2,1800);}
}

function showResults2() {

}

function endLevelFinal() {
  clearInterval(timerInterval);
  const total = levelQuestions.length;
  showResults(correctCount, currentQ, total);
}

window.endLevel = endLevelFinal;
window.nextQuestion = function() {
  currentQ++;
  if(currentQ >= levelQuestions.length) { endLevelFinal(); return; }
  loadQuestion();
};

// ==================== RESULTS ====================
function showResults(correct, attempted, total) {
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 80;

  document.getElementById('resultsEmoji').textContent = passed ? '🎉' : '💪';
  document.getElementById('resultsTitle').textContent = passed ? 'Hongera sana!' : 'Jaribu tena!';
  document.getElementById('resultsScore').textContent = `${correct}/${total}`;
  document.getElementById('resultsPct').textContent = `${pct}%`;

  let msg;
  if(pct === 100) msg = 'Bora kabisa! Hukukosea hata swali moja! 🌟';
  else if(pct >= 90) msg = 'Umefanya vizuri sana! Hongera! 🎊';
  else if(pct >= 80) msg = 'Umepita! Endelea na kiwango kinachofuata. ✅';
  else if(pct >= 60) msg = 'Karibu sana! Unahitaji asilimia 80 kupita. Jaribu tena! 💪';
  else msg = 'Funga vitabu tena na ujifunze zaidi. Huna wasiwasi! 📚';

  document.getElementById('resultsMsg').textContent = msg;

  const nextBtn = document.getElementById('nextLevelBtn');
  if(passed && currentLevel < 4) {
    nextBtn.style.display = 'block';
    if(!unlockedLevels.includes(currentLevel+1)) unlockedLevels.push(currentLevel+1);
    playLevelUp();
    speak('Hongera! Umepita kiwango hiki!','sw-KE');
  } else if(passed && currentLevel === 4) {
    nextBtn.style.display = 'none';
    speak('Hongera sana! Umekamilisha mchezo wote!','sw-KE');
    spawnConfetti();
    spawnConfetti();
  } else {
    nextBtn.style.display = 'none';
    speak('Jaribu tena. Unaweza kufanya vizuri zaidi!','sw-KE');
  }

  showScreen('resultsScreen');
  if(passed) setTimeout(spawnConfetti, 300);
}

// ==================== NAV ====================
function retryLevel() {
  correctCount = 0;
  startGame();
}

function goNextLevel() {
  currentLevel = Math.min(currentLevel+1, 4);
  correctCount = 0;
  buildLevelGrid();
  startGame();
}

function goHome() {
  buildLevelGrid();
  showScreen('introScreen');
  if(musicOn) { setTimeout(startIntroMusic, 300); }
}

// ==================== CONFETTI ====================
function spawnConfetti() {
  const colors = ['#FFD700','#FF6B35','#4ECDC4','#FF69B4','#7CFC00','#FF4500','#00CED1'];
  for(let i=0;i<40;i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

// ==================== MUSIC TOGGLE ====================
document.getElementById('musicToggle').onclick = function() {
  musicOn = !musicOn;
  this.textContent = musicOn ? '🎵' : '🔇';
  if(musicOn && document.getElementById('introScreen').classList.contains('active')) {
    startIntroMusic();
  } else {
    stopIntroMusic();
  }
};

// ==================== INIT ====================
window.startGame = startGame;
window.retryLevel = retryLevel;
window.goNextLevel = goNextLevel;
window.goHome = goHome;

createStars();
buildLevelGrid();
runLoading();
</script>
