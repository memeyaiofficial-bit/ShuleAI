<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Limbukeni Kalulu - Mchezo wa CBC Darasa la 2 | Kusikiliza, Kuzungumza, Kusoma na Kuandika</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #2E7D32 0%, #1B5E20 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #FFF8E1;
            background-image: radial-gradient(circle at 10% 30%, rgba(100,180,80,0.1) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 70px 70px 70px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #FF8F00;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #E65100;
        }

        .level-badge, .score-badge, .progress-badge {
            background: #2c2b28;
            color: #FFD54F;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 -2px 0 #4b3a1e, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #1f2c0e;
            padding: 5px 15px;
            border-radius: 50px;
            color: #FFD54F;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
        }

        .story-card {
            background: #FFFDE7;
            margin: 20px 25px;
            padding: 20px 25px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
        }

        .narrative-text {
            font-size: 1.4rem;
            line-height: 1.4;
            font-weight: 600;
            color: #BF360C;
            text-shadow: 1px 1px 0 #FFE0B2;
            background: #FFF3E0;
            padding: 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: #FFE0B2;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            color: #BF360C;
            margin: 15px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .option-btn {
            background: #FFE0B2;
            border: 4px solid #FF8F00;
            font-size: 1.2rem;
            padding: 15px 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #E65100;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s;
            text-align: left;
            font-family: inherit;
            box-shadow: 0 5px 0 #EF6C00;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            background: #FF8F00;
            color: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-left: 8px;
            box-shadow: inset 0 -1px 0 #E65100;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #EF6C00;
        }

        .option-btn:hover {
            background: #FFCC80;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .next-area {
            text-align: center;
            margin: 20px 0 10px;
        }

        .next-btn {
            background: #FF8F00;
            border: none;
            font-size: 1.5rem;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #E65100;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #E65100;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-message {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px;
            font-weight: bold;
            background: #FFE0B2;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            border-radius: 30px;
        }

        footer {
            background: #FFCC80;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: #BF360C;
        }

        @media (max-width: 650px) {
            .narrative-text { font-size: 1.1rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 5px; }
            .option-prefix { width: 32px; height: 32px; font-size: 1rem; }
            .level-badge, .score-badge { font-size: 0.8rem; }
        }

        .correct-fx {
            background: #A5D6A7 !important;
            border-color: #2E7D32 !important;
        }

        .wrong-fx {
            background: #EF9A9A !important;
            border-color: #C62828 !important;
        }
        
        .bunny-hop {
            display: inline-block;
            animation: hop 0.4s ease;
        }
        
        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 0</div>
        <div class="progress-badge" id="progressDisplay">Swali: 1 / 40</div>
        <div class="timer-area">⏱️ <span id="timerSeconds">40</span> s</div>
    </div>
    <div class="story-card">
        <div class="narrative-text" id="storyNarrative">🐇 Limbukeni Kalulu! Sungura mjanja wa Kiafrika! Jiunge na hadithi za kalulu mwerevu! 🎵</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ Swali linalofuata</button>
        </div>
        <div style="text-align: center; margin-top: 8px;"><span id="feedbackMsg" class="info-message">✨ Chagua jibu (A, B, C, au D)</span></div>
    </div>
    <footer>🎵 "Limbukeni Kalulu" - Kusikiliza, Kuzungumza, Kusoma na Kuandika 🎵</footer>
</div>

<script>
    // ------------------- INTRO SONG (Limbukeni Kalulu theme - traditional African hare song) ------------------
    function playIntroSong() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration, vol = 0.3) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            // Joyful, playful African rhythm inspired melody for Kalulu
            playNote(523.25, now, 0.2);
            playNote(587.33, now + 0.25, 0.2);
            playNote(659.25, now + 0.5, 0.25);
            playNote(783.99, now + 0.8, 0.3);
            playNote(698.46, now + 1.15, 0.25);
            playNote(659.25, now + 1.45, 0.25);
            playNote(587.33, now + 1.75, 0.3);
            playNote(523.25, now + 2.1, 0.35);
            playNote(659.25, now + 2.5, 0.3);
            playNote(783.99, now + 2.9, 0.35);
            playNote(880.00, now + 3.3, 0.4);
            playNote(783.99, now + 3.7, 0.35);
            playNote(659.25, now + 4.0, 0.4);
        } catch(e) { console.log("audio context error", e); }
    }

    // Voice synthesis in Kiswahili
    function speakKiswahili(text, type = "info") {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "sw-KE";
            utterance.rate = 0.9;
            utterance.pitch = (type === "correct") ? 1.15 : (type === "wrong" ? 0.85 : 1.0);
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.log("speech error", e); }
    }

    // ------------------------------------------------------------------
    // 200 UNIQUE QUESTIONS about "Limbukeni Kalulu" (Clever Hare - African folktale)
    // Topics: Kusikiliza, Kuzungumza, Kusoma, Kuandika
    // Kalulu is a trickster hare character from African folklore
    // ------------------------------------------------------------------
    
    // Rich pool of Kalulu (clever hare) scenarios
    const kaluluScenarios = [
        { nar: "Kalulu alikutana na Simba mwenye njaa. Simba alitaka kumla. Kalulu akasema, 'Nina habari njema!'", q: "Kalulu alimwambia Simba nini?", correct: "Nina habari njema", wrongs: ["Nina hasira", "Nina woga", "Nina njaa", "Nina kiu"] },
        { nar: "Kalulu alimdanganya Simba kwamba kuna sungura mwingine kisimani. Simba akaruka ndani.", q: "Simba aliruka wapi?", correct: "Kisimani", wrongs: ["Mtoni", "Msituni", "Jangwani", "Bahari"] },
        { nar: "Kusikiliza: Kalulu anapiga ngoma na kuimba 'Limbukeni, limbukeni, kalulu mwerevu!'", q: "Kalulu anaimba nini?", correct: "Limbukeni, kalulu mwerevu", wrongs: ["Simba mkali", "Kobe mwepesi", "Nyani mjanja", "Tembo mkubwa"] },
        { nar: "Soma: 'Kalulu aliwashinda wanyama wote kwa akili zake nzuri.'", q: "Kalulu aliwashinda wanyama kwa nini?", correct: "Akili zake", wrongs: ["Nguvu zake", "Urembo wake", "Mbali zake", "Kasi yake"] },
        { nar: "Kuandika: Taja herufi ya kwanza ya neno 'Kalulu'.", q: "Herufi ya mwanzo ya 'Kalulu' ni?", correct: "K", wrongs: ["A", "L", "U", "M"] },
        { nar: "Kalulu alimsaidia Kobe kuvuka mto. Kobe alimshukuru. Kalulu akasema, 'Marafiki wanasaidiana.'", q: "Kalulu alimsaidia nani?", correct: "Kobe", wrongs: ["Simba", "Fisi", "Nyani", "Tembo"] },
        { nar: "Simba alimfuata Kalulu lakini Kalulu akakimbia kwa kasi na kupanda mti.", q: "Kalulu alipanda nini?", correct: "Mti", wrongs: ["Jengo", "Mwamba", "Baiskeli", "Gari"] },
        { nar: "Kusikiliza: Kalulu anasema 'Mimi ni mwerevu kuliko wote!' Wanyama wanacheka.", q: "Kalulu anajisifia nini?", correct: "Kuwa mwerevu", wrongs: ["Kuwa na nguvu", "Kuwa mrefu", "Kuwa mzuri", "Kuwa mkubwa"] },
        { nar: "Soma: 'Kalulu alipata karoti shambani. Aligawana na marafiki zake.'", q: "Kalulu alifanya nini na karoti?", correct: "Aligawana na marafiki", wrongs: ["Alikula peke yake", "Alizichoma", "Alizitupa", "Aliziuza"] },
        { nar: "Kuandika: Neno 'Kalulu' lina herufi ngapi?", q: "Neno 'Kalulu' lina herufi ngapi?", correct: "Sita", wrongs: ["Tano", "Saba", "Nne", "Tatu"] },
        { nar: "Kalulu alikutana na Fisi aliyekuwa akilia. Fisi alikuwa amejikwaa.", q: "Kalulu alimwona nani akilia?", correct: "Fisi", wrongs: ["Simba", "Nyani", "Kobe", "Tembo"] },
        { nar: "Nyani alimwomba Kalulu amsaidie kupata ndizi. Kalulu akamwongoza hadi mti wenye ndizi nyingi.", q: "Nyani alimwomba Kalulu nini?", correct: "Amsaidie kupata ndizi", wrongs: ["Ampige", "Amkimbie", "Amcheke", "Ampende"] },
        { nar: "Kusikiliza: Kalulu anamwimbia Simba wimbo wa 'Simba mjinga, uliruka kisimani!'", q: "Simba aliruka wapi?", correct: "Kisimani", wrongs: ["Mtoni", "Mlimani", "Bahari", "Jangwani"] },
        { nar: "Soma: 'Kalulu alijulikana kwa ujanja wake. Hakuna mnyama aliyeweza kumshinda.'", q: "Kalulu alijulikana kwa nini?", correct: "Ujanja wake", wrongs: ["Uzuri wake", "Nguvu zake", "Urefu wake", "Uzito wake"] },
        { nar: "Kuandika: Andika jina 'Limbukeni'. Herufi ya kwanza na ya mwisho ni?", q: "Herufi za mwanzo na mwisho za 'Limbukeni' ni?", correct: "L na I", wrongs: ["L na K", "M na I", "B na N", "L na N"] },
        { nar: "Kalulu alimpa Simba mwiba mgongoni. Simba aliumia na kukimbia.", q: "Kalulu alimpa Simba nini?", correct: "Mwiba", wrongs: ["Maji", "Chakula", "Zawadi", "Maua"] },
        { nar: "Kobe alimwambia Kalulu, 'Wewe ni rafiki mzuri.' Kalulu akajibu, 'Marafiki hulindana.'", q: "Kobe alimwita Kalulu nini?", correct: "Rafiki mzuri", wrongs: ["Mjanja", "Mwepesi", "Mwerevu", "Mrembo"] },
        { nar: "Kusikiliza: Hadithi inafundisha kuwa akili ni bora kuliko nguvu.", q: "Hadithi inafundisha nini?", correct: "Akili ni bora kuliko nguvu", wrongs: ["Nguvu ni bora", "Urembo ni bora", "Utajiri ni bora", "Umaarufu ni bora"] },
        { nar: "Soma: 'Limbukeni Kalulu aliwakimbia wanyama wakubwa kwa uhodari wake.'", q: "Kalulu aliwakimbia wanyama gani?", correct: "Wakubwa", wrongs: ["Wadogo", "Wanyonge", "Warefu", "Wafupi"] },
        { nar: "Kuandika: Taja herufi za neno 'limbukeni' kwa mpangilio.", q: "Neno 'limbukeni' linapoandikwa, herufi ya tatu ni?", correct: "M", wrongs: ["L", "I", "B", "U"] }
    ];
    
    // Shuffle array randomly
    function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
    
    // Generate distinct question for each level and index
    function generateDistinctQuestion(level, qIndex) {
        const scenarioIndex = (level * 29 + qIndex * 37) % kaluluScenarios.length;
        const base = kaluluScenarios[scenarioIndex];
        
        const levelNames = ["Kuanza", "Kujenga", "Ustadi", "Uhodari", "Ubingwa"];
        const levelName = levelNames[level - 1];
        
        const topicType = qIndex % 4;
        let topicPrefix = "";
        if (topicType === 0) topicPrefix = "🎧 Kusikiliza: ";
        else if (topicType === 1) topicPrefix = "💬 Kuzungumza: ";
        else if (topicType === 2) topicPrefix = "📖 Kusoma: ";
        else topicPrefix = "✍️ Kuandika: ";
        
        let narrative = `${topicPrefix}${base.nar} [L${level}Q${qIndex}] - Ngazi ${levelName} ya Limbukeni Kalulu.`;
        let question = base.q;
        let correctAnswer = base.correct;
        
        // Add variation for uniqueness
        if (qIndex % 5 === 2) {
            question = `Kuhusu Kalulu mjanja, ${question.toLowerCase()}`;
        }
        if (qIndex % 7 === 3) {
            narrative = `🐇 ${narrative} Limbukeni! Kalulu yuko hatarini!`;
        }
        if (qIndex % 9 === 4) {
            narrative = `🎵 ${narrative} Limbukeni, limbukeni, kalulu mwerevu!`;
        }
        
        // Build 4 options
        let allOptions = [correctAnswer];
        for (let w of base.wrongs) {
            if (!allOptions.includes(w) && allOptions.length < 4) {
                allOptions.push(w);
            }
        }
        const fallbacks = ["Sijui", "Labda", "Pengine", "Hapana", "Ndiyo", "Kalulu", "Limbukeni", "Mwerevu"];
        for (let f of fallbacks) {
            if (!allOptions.includes(f) && allOptions.length < 4) {
                allOptions.push(f);
            }
        }
        
        // Randomly shuffle answers to A, B, C, D
        const shuffledOptions = shuffleArray(allOptions);
        
        return { narrative, question, options: shuffledOptions, correctAnswer };
    }
    
    // Build 200 unique questions (5 levels x 40)
    let questionBank = [];
    const usedQuestions = new Set();
    
    for (let lvl = 1; lvl <= 5; lvl++) {
        let levelQuestions = [];
        for (let i = 0; i < 40; i++) {
            let q = generateDistinctQuestion(lvl, i);
            let key = `${q.narrative}|${q.question}`;
            let attempts = 0;
            while (usedQuestions.has(key) && attempts < 30) {
                q = generateDistinctQuestion(lvl, i + attempts * 47);
                key = `${q.narrative}|${q.question}`;
                attempts++;
            }
            usedQuestions.add(key);
            levelQuestions.push(q);
        }
        questionBank.push(levelQuestions);
    }
    
    console.log(`✅ Maswali ${usedQuestions.size} tofauti kabisa kuhusu Limbukeni Kalulu!`);
    
    // Game state
    let currentLevel = 1;
    let currentQIndex = 0;
    let scoreInLevel = 0;
    const totalQuestionsInLevel = 40;
    const requiredToPass = 32;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let gameActive = true;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const timerSecondsSpan = document.getElementById('timerSeconds');
    const storyNarrativeDiv = document.getElementById('storyNarrative');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const feedbackSpan = document.getElementById('feedbackMsg');
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!gameActive || waitingForNext || answered) return;
        timeLeft = 40;
        timerSecondsSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext || answered) return;
            if (timeLeft <= 1) {
                if (!answered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                } else {
                    stopTimer();
                }
            } else {
                timeLeft--;
                timerSecondsSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        gameActive = false;
        speakKiswahili("Wakati umekwisha! Jibu sahihi lilikuwa: " + currentQuestionObj.correctAnswer + ". Kalulu anakuona!", "timeout");
        feedbackSpan.innerHTML = `⏰ Muda umekwisha! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
        highlightCorrectAnswer();
        disableOptions(true);
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) autoNextAfterTimeout();
        }, 2200);
    }
    
    function autoNextAfterTimeout() {
        if (!waitingForNext) return;
        waitingForNext = false;
        gameActive = true;
        moveToNextQuestion();
    }
    
    function highlightCorrectAnswer() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('data-value') === currentQuestionObj.correctAnswer) {
                btn.style.backgroundColor = "#A5D6A7";
                btn.style.borderColor = "#2E7D32";
            }
        });
    }
    
    function disableOptions(disabled) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (disabled) {
                btn.classList.add('disabled-opt');
            } else {
                btn.classList.remove('disabled-opt');
            }
        });
    }
    
    function handleAnswer(selectedValue, btnElement) {
        if (!gameActive || answered || waitingForNext) return;
        stopTimer();
        answered = true;
        const isCorrect = (selectedValue === currentQuestionObj.correctAnswer);
        if (isCorrect) {
            scoreInLevel++;
            speakKiswahili("Jibu sahihi! Hongera! Wewe ni mwerevu kama Kalulu!", "correct");
            feedbackSpan.innerHTML = "✅ Sahihi! Umepata alama! 🐇";
            btnElement.classList.add('correct-fx');
            // Add bunny hop effect
            const hop = document.createElement('span');
            hop.innerHTML = '🐰⚡';
            hop.className = 'bunny-hop';
            feedbackSpan.appendChild(hop);
            setTimeout(() => hop.remove(), 500);
        } else {
            speakKiswahili("Pole! Jibu sahihi ni: " + currentQuestionObj.correctAnswer + ". Jifunze kutoka kwa Kalulu!", "wrong");
            feedbackSpan.innerHTML = `❌ Si sahihi! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
            btnElement.classList.add('wrong-fx');
            highlightCorrectAnswer();
        }
        disableOptions(true);
        updateUIStats();
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) moveToNextQuestion();
        }, 2000);
    }
    
    function moveToNextQuestion() {
        waitingForNext = false;
        if (currentQIndex + 1 >= totalQuestionsInLevel) {
            let percentage = (scoreInLevel / totalQuestionsInLevel) * 100;
            if (percentage >= 80) {
                if (currentLevel === 5) {
                    feedbackSpan.innerHTML = "🏆🏆 HONGERA SANA! UMEMALIZA LIMBUKENI KALULU! WEWE NI BINGWA WA HADITHI ZA KALULU! 🏆🏆";
                    speakKiswahili("Hongera sana! Umemaliza ngazi zote tano za Limbukeni Kalulu! Wewe ni mwerevu kama Kalulu mwenyewe! Limbukeni!", "correct");
                    gameActive = false;
                    disableOptions(true);
                    nextButton.disabled = true;
                    stopTimer();
                    return;
                } else {
                    currentLevel++;
                    currentQIndex = 0;
                    scoreInLevel = 0;
                    resetLevelUI();
                    loadQuestion();
                    speakKiswahili(`Hongera! Umefika Ngazi ya ${currentLevel} ya Limbukeni Kalulu! Endelea kujifunza ujanja wa Kalulu!`, "correct");
                    feedbackSpan.innerHTML = `🎉🎉 Umepitisha ngazi! Sasa Ngazi ${currentLevel} ya Kalulu Mwerevu! 🎉🎉`;
                    return;
                }
            } else {
                feedbackSpan.innerHTML = `😭 Hujapata asilimia 80. Unarudia Ngazi ${currentLevel} ya Limbukeni Kalulu. Jaribu tena kuwa mwerevu kama Kalulu! 😭`;
                speakKiswahili("Samahani, hujapata alama za kutosha. Rudia ngazi hii ya Kalulu tena. Kumbuka ujanja wa Kalulu!", "wrong");
                scoreInLevel = 0;
                currentQIndex = 0;
                resetLevelUI();
                loadQuestion();
                return;
            }
        } else {
            currentQIndex++;
            loadQuestion();
        }
    }
    
    function resetLevelUI() {
        updateUIStats();
        if (timerInterval) stopTimer();
        answered = false;
        waitingForNext = false;
        gameActive = true;
        if (nextButton) nextButton.disabled = false;
    }
    
    function updateUIStats() {
        if (levelDisplay) levelDisplay.innerText = `Ngazi ya ${currentLevel}`;
        if (scoreDisplay) scoreDisplay.innerText = `Alama: ${scoreInLevel} / ${totalQuestionsInLevel}`;
        if (progressDisplay) progressDisplay.innerText = `Swali: ${currentQIndex+1} / ${totalQuestionsInLevel}`;
    }
    
    let currentQuestionObj = null;
    
    function loadQuestion() {
        if (!questionBank[currentLevel-1] || !questionBank[currentLevel-1][currentQIndex]) {
            console.error("Swali halipo");
            return;
        }
        currentQuestionObj = questionBank[currentLevel-1][currentQIndex];
        if (storyNarrativeDiv) storyNarrativeDiv.innerHTML = `🐰 ${currentQuestionObj.narrative}`;
        if (questionTextDiv) questionTextDiv.innerHTML = `❓ ${currentQuestionObj.question}`;
        
        if (optionsContainer) {
            optionsContainer.innerHTML = "";
            const prefixes = ['A', 'B', 'C', 'D'];
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-value', opt);
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'option-prefix';
                prefixSpan.innerText = prefixes[idx];
                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = opt;
                btn.appendChild(prefixSpan);
                btn.appendChild(textSpan);
                btn.addEventListener('click', (e) => {
                    if (!answered && gameActive && !waitingForNext) {
                        handleAnswer(opt, btn);
                    }
                });
                optionsContainer.appendChild(btn);
            });
        }
        
        updateUIStats();
        answered = false;
        gameActive = true;
        waitingForNext = false;
        disableOptions(false);
        stopTimer();
        startTimer();
        if (feedbackSpan) feedbackSpan.innerHTML = "🎤 Chagua jibu (A, B, C, D) - Limbukeni Kalulu anakungoja! Kuwa mwerevu! 🎤";
    }
    
    function initGame() {
        currentLevel = 1;
        currentQIndex = 0;
        scoreInLevel = 0;
        answered = false;
        waitingForNext = false;
        gameActive = true;
        loadQuestion();
        playIntroSong();
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo 'Limbukeni Kalulu'! Hadithi za kalulu mwerevu kutoka Afrika. Jibu maswali 40 kwa kila ngazi. Pata angalau asilimia 80 kupanda ngazi. Limbukeni! Kuwa mwerevu kama Kalulu!", "info");
        }, 800);
        
        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (!answered && gameActive && !waitingForNext) {
                    speakKiswahili("Tafadhali jibu swali kwanza!", "info");
                    if (feedbackSpan) feedbackSpan.innerHTML = "⚠️ Jibu swali kabla ya kuendelea! ⚠️";
                    return;
                }
                if (waitingForNext) {
                    if (timerInterval) stopTimer();
                    moveToNextQuestion();
                }
            });
        }
    }
    
    window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
