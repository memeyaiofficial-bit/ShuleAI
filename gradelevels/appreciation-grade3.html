<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CBC Grade 3 | Creative Arts Appreciation | Kenya National Anthem & Water Safety</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #006B3F 0%, #1E8C5C 30%, #F5A623 70%, #D43107 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #FFF9F0;
            border-radius: 60px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .stats-bar {
            background: #D43107;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 4px solid #8B2500;
        }

        .stat {
            background: #1B3B2B;
            padding: 6px 14px;
            border-radius: 50px;
            color: #F9E79F;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .stat span:first-child {
            color: #F5B041;
            margin-right: 5px;
        }

        .level-badge {
            background: #F5A623;
            color: #1B3B2B;
        }

        .question-area {
            padding: 25px;
            text-align: center;
        }

        .question-text {
            background: #E8F8F5;
            padding: 25px 15px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0B3B2F;
            box-shadow: inset 0 0 0 3px white, 0 8px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            word-break: break-word;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .voice-btn {
            background: #F5A623;
            border: none;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2C1A0A;
            box-shadow: 0 3px 0 #C47D0A;
            transition: 0.05s linear;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #C47D0A;
        }

        .answer-input {
            width: 85%;
            padding: 14px 20px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 50px;
            border: 3px solid #F5A623;
            background: white;
            font-weight: bold;
            outline: none;
        }

        .answer-input:focus {
            border-color: #D43107;
        }

        .hint-area {
            background: #FFF2CC;
            margin-top: 12px;
            padding: 10px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #9C640C;
            font-weight: bold;
            min-height: 50px;
        }

        .timer-box {
            background: #1B2B3E;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 50px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .timer-clock {
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.5rem;
            color: #2ECC71;
        }

        .submit-btn {
            background: #006B3F;
            border: none;
            font-size: 1.2rem;
            padding: 12px 20px;
            width: 80%;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            margin: 15px auto;
            display: block;
            cursor: pointer;
            box-shadow: 0 4px 0 #004d2d;
        }

        .submit-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #004d2d;
        }

        .feedback {
            font-size: 0.95rem;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 50px;
            margin: 10px 20px;
            background: #F0E6D2;
        }

        .next-level-info {
            background: linear-gradient(90deg, #F5A623, #F1C40F);
            text-align: center;
            padding: 10px;
            border-radius: 30px;
            margin: 5px 20px 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1rem; padding: 18px 12px; }
            .answer-input { font-size: 0.9rem; width: 90%; }
            .timer-clock { font-size: 1.2rem; }
            .stat { font-size: 0.7rem; padding: 4px 10px; }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-bar">
        <div class="stat level-badge"><span>🇰🇪 LEVEL</span> <span id="levelNum">1</span></div>
        <div class="stat"><span>⭐ SCORE</span> <span id="scoreDisplay">0</span></div>
        <div class="stat"><span>📊 PROGRESS</span> <span id="qCounter">0</span>/<span id="totalQLevel">30</span></div>
        <div class="stat"><span>🎯 NEED</span> 80%</div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">Loading questions...</div>
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION</button>
        <div class="answer-section">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
        </div>
        <div class="hint-area" id="hintMsg">🎧 Click the speaker to hear the question. Type your answer (1-3 words).</div>
    </div>
    <div class="timer-box">
        <span>⏳ TIME REMAINING</span>
        <span class="timer-clock" id="timerDisplay">40</span>
    </div>
    <button class="submit-btn" id="submitAnswer">✅ SUBMIT ANSWER</button>
    <div class="feedback" id="feedbackMsg">🌟 Answer 30 questions per level. Get 80% to advance!</div>
    <div id="levelInfoMsg" class="next-level-info">🇰🇪 Kenya National Anthem + 💧 Water Safety Awareness</div>
</div>

<script>
    // ============================================================
    // CBC GRADE 3 - CREATIVE ARTS APPRECIATION
    // Topics: Kenya National Anthem & Water Safety Awareness
    // 5 Levels x 30 Questions | 40 Second Timer | Voice Output
    // ============================================================
    
    // COMPLETE QUESTION DATABASE - 40+ UNIQUE QUESTIONS
    const ALL_ANTHEM_QUESTIONS = [
        { text: "What is the first word of Kenya's National Anthem?", answer: "O" },
        { text: "Complete the line: 'O God of all ______'", answer: "creation" },
        { text: "What do we ask God to bless in the first line of the anthem?", answer: "our land" },
        { text: "'Bless this our land and nation' is from which song?", answer: "national anthem" },
        { text: "How many stanzas does Kenya's National Anthem have? (write number)", answer: "3" },
        { text: "In which year was Kenya's National Anthem adopted?", answer: "1963" },
        { text: "What is the Swahili title of Kenya's National Anthem?", answer: "ee mungu nguvu yetu" },
        { text: "What does 'Nguvu Yetu' mean in English?", answer: "our strength" },
        { text: "'May we dwell in unity' is from which stanza? (first, second, or third)", answer: "second" },
        { text: "What do we pray for in the Kenya National Anthem?", answer: "peace" },
        { text: "The anthem is sung in which two languages?", answer: "english and swahili" },
        { text: "'Let one and all arise' is from which stanza?", answer: "second" },
        { text: "What color in the Kenyan flag represents peace?", answer: "white" },
        { text: "'With hearts and hands united' is from which stanza?", answer: "third" },
        { text: "Who composed the lyrics of Kenya's National Anthem? (a team or one person)", answer: "team" },
        { text: "'Justice be our shield and defender' is from the?", answer: "national anthem" },
        { text: "The melody of Kenya's anthem was adapted from which type of song?", answer: "african traditional" },
        { text: "What does 'Ee Mungu Nguvu Yetu' translate to?", answer: "oh god our strength" },
        { text: "The anthem is played during what type of ceremonies?", answer: "national" },
        { text: "What should we have for our land according to the anthem?", answer: "pride" }
    ];
    
    const ALL_WATER_QUESTIONS = [
        { text: "Should you swim alone or with an adult? (type: with adult or alone)", answer: "with adult" },
        { text: "What safety equipment should you wear when learning to swim?", answer: "life jacket" },
        { text: "Is it safe to run near a swimming pool? (yes or no)", answer: "no" },
        { text: "What should you do if someone is drowning?", answer: "call for help" },
        { text: "Never swim in water that is too what?", answer: "deep" },
        { text: "What is the most important rule near water?", answer: "stay safe" },
        { text: "Should you push friends into water? (yes or no)", answer: "no" },
        { text: "What skill should you learn to be safe in water?", answer: "swimming" },
        { text: "What color flag means it is safe to swim at the beach?", answer: "green" },
        { text: "What does a lifeguard do?", answer: "save people" },
        { text: "Should you swim during a thunderstorm? (yes or no)", answer: "no" },
        { text: "What do you call a person who watches swimmers for safety?", answer: "lifeguard" },
        { text: "What should you check before entering unknown water?", answer: "depth" },
        { text: "Is it safe to dive into shallow water? (yes or no)", answer: "no" },
        { text: "What should you do if you feel tired while swimming?", answer: "rest" },
        { text: "Never swim in rivers that have strong what?", answer: "currents" },
        { text: "What footwear is safe to wear at the swimming pool?", answer: "sandals" },
        { text: "Always ask for what before going near water?", answer: "permission" },
        { text: "Should you wait after eating before swimming? (yes or no)", answer: "yes" },
        { text: "What does a red flag at the beach mean?", answer: "danger" }
    ];
    
    // Function to generate 30 unique questions for a specific level
    function generateQuestionsForLevel(level) {
        const questions = [];
        const usedTexts = new Set();
        
        // Helper to add question if not duplicate
        function addQuestion(text, answer, topic) {
            if (usedTexts.has(text)) return false;
            usedTexts.add(text);
            questions.push({
                text: text,
                expected: answer,
                topic: topic,
                expectedLower: String(answer).trim().toLowerCase(),
                checkAnswer: function(userInput) {
                    let inputNorm = String(userInput).trim().toLowerCase().replace(/\s+/g, ' ');
                    return inputNorm === this.expectedLower;
                },
                getHint: function(seconds) {
                    if (seconds <= 8) return `💡 HINT: The answer is "${this.expected}"`;
                    if (seconds <= 18) return `⏰ Think about ${this.topic}!`;
                    return `✨ Type your answer. ${seconds} seconds left.`;
                }
            });
            return true;
        }
        
        // Add 15 anthem questions (vary by level)
        let anthemIndices = [];
        for (let i = 0; i < 15; i++) {
            let idx = (level * 7 + i * 3) % ALL_ANTHEM_QUESTIONS.length;
            anthemIndices.push(idx);
        }
        // Remove duplicates from indices
        anthemIndices = [...new Set(anthemIndices)];
        for (let idx of anthemIndices) {
            let q = ALL_ANTHEM_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Kenya National Anthem 🇰🇪");
        }
        
        // Add 15 water safety questions (vary by level)
        let waterIndices = [];
        for (let i = 0; i < 15; i++) {
            let idx = (level * 5 + i * 2) % ALL_WATER_QUESTIONS.length;
            waterIndices.push(idx);
        }
        waterIndices = [...new Set(waterIndices)];
        for (let idx of waterIndices) {
            let q = ALL_WATER_QUESTIONS[idx];
            addQuestion(q.text, q.answer, "Water Safety 💧");
        }
        
        // If we don't have 30 yet, add more from anthem
        let fallbackIdx = 0;
        while (questions.length < 30 && fallbackIdx < ALL_ANTHEM_QUESTIONS.length) {
            let q = ALL_ANTHEM_QUESTIONS[fallbackIdx];
            addQuestion(q.text, q.answer, "Kenya National Anthem 🇰🇪");
            fallbackIdx++;
        }
        
        // Shuffle questions for variety
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
        
        return questions;
    }
    
    // ========== GAME STATE ==========
    let currentLevel = 1;
    let currentQuestionsList = [];
    let currentQuestionIndex = 0;
    let currentLevelScore = 0;
    let timerInterval = null;
    let secondsRemaining = 40;
    let isTransitioning = false;
    let activeQuestion = null;
    let isTimeoutFlag = false;
    
    // DOM Elements
    const levelSpan = document.getElementById("levelNum");
    const scoreSpan = document.getElementById("scoreDisplay");
    const progressSpan = document.getElementById("qCounter");
    const totalSpan = document.getElementById("totalQLevel");
    const questionDiv = document.getElementById("questionText");
    const answerInput = document.getElementById("answerInput");
    const hintDiv = document.getElementById("hintMsg");
    const timerDisplay = document.getElementById("timerDisplay");
    const submitButton = document.getElementById("submitAnswer");
    const feedbackDiv = document.getElementById("feedbackMsg");
    const levelInfoDiv = document.getElementById("levelInfoMsg");
    const speakButton = document.getElementById("speakBtn");
    
    totalSpan.textContent = "30";
    
    // Speech Function
    const speechSynth = window.speechSynthesis;
    function speakMessage(message) {
        if (!message) return;
        try {
            if (speechSynth.speaking) speechSynth.cancel();
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = "en-US";
                utterance.rate = 0.9;
                speechSynth.speak(utterance);
            }, 50);
        } catch(e) {
            console.log("Speech error");
        }
    }
    
    // Timer Functions
    function stopGameTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function updateTimerView() {
        timerDisplay.textContent = secondsRemaining;
        if (secondsRemaining <= 8) timerDisplay.style.color = "#ff8888";
        else if (secondsRemaining <= 20) timerDisplay.style.color = "#ffaa44";
        else timerDisplay.style.color = "#2ecc71";
    }
    
    function startGameTimer() {
        stopGameTimer();
        secondsRemaining = 40;
        updateTimerView();
        timerInterval = setInterval(() => {
            if (isTransitioning) return;
            if (secondsRemaining <= 1) {
                stopGameTimer();
                if (!isTransitioning) {
                    speakMessage("Time is up, moving to the next question");
                    isTransitioning = true;
                    isTimeoutFlag = true;
                    feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                    setTimeout(() => {
                        moveToNextQuestion(false);
                    }, 1500);
                }
            } else {
                secondsRemaining--;
                updateTimerView();
                if (activeQuestion && !isTransitioning) {
                    if (secondsRemaining <= 12) {
                        hintDiv.innerHTML = activeQuestion.getHint(secondsRemaining);
                    } else if (secondsRemaining <= 25) {
                        hintDiv.innerHTML = `⏰ ${secondsRemaining} sec left. Think about ${activeQuestion.topic}!`;
                    } else {
                        hintDiv.innerHTML = `✨ ${secondsRemaining} sec left. Click speaker to hear question.`;
                    }
                }
            }
        }, 1000);
    }
    
    function moveToNextQuestion(isAnswerCorrect) {
        stopGameTimer();
        
        if (isAnswerCorrect) {
            currentLevelScore++;
            scoreSpan.textContent = currentLevelScore;
            feedbackDiv.innerHTML = "✅ CORRECT! Great job! +1 point";
            speakMessage("Correct answer! Well done.");
        } else if (!isTimeoutFlag) {
            let correctAns = activeQuestion ? activeQuestion.expected : "?";
            feedbackDiv.innerHTML = `❌ INCORRECT! The correct answer is: ${correctAns}`;
            speakMessage(`Wrong answer. The correct answer is ${correctAns}.`);
        } else {
            feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
        }
        
        isTimeoutFlag = false;
        currentQuestionIndex++;
        progressSpan.textContent = currentQuestionIndex;
        
        // Check if level is complete (30 questions)
        if (currentQuestionIndex >= 30) {
            let percentage = (currentLevelScore / 30) * 100;
            if (percentage >= 80) {
                if (currentLevel < 5) {
                    levelInfoDiv.innerHTML = `🎉 LEVEL ${currentLevel} PASSED! ${Math.floor(percentage)}% → Moving to LEVEL ${currentLevel + 1}`;
                    speakMessage(`Congratulations! You passed level ${currentLevel}. Moving to next level.`);
                    currentLevel++;
                    currentQuestionIndex = 0;
                    currentLevelScore = 0;
                    isTransitioning = false;
                    initializeLevel(currentLevel);
                } else {
                    feedbackDiv.innerHTML = "🏆🏆🏆 AMAZING! You completed ALL 5 LEVELS! YOU ARE A CHAMPION! 🏆🏆🏆";
                    levelInfoDiv.innerHTML = "🇰🇪🇰🇪 GAME COMPLETE! Refresh to play again. Stay safe! 🇰🇪🇰🇪";
                    speakMessage("Congratulations! You completed all five levels. You are a champion!");
                    submitButton.disabled = true;
                    answerInput.disabled = true;
                    return;
                }
            } else {
                levelInfoDiv.innerHTML = `❌ LEVEL ${currentLevel} FAILED! ${Math.floor(percentage)}% (Need 80%). Restarting level...`;
                speakMessage(`You scored ${Math.floor(percentage)} percent. Need 80 to pass. Restarting level ${currentLevel}.`);
                currentQuestionIndex = 0;
                currentLevelScore = 0;
                isTransitioning = false;
                initializeLevel(currentLevel);
            }
            return;
        }
        
        isTransitioning = false;
        loadCurrentQuestion();
    }
    
    function loadCurrentQuestion() {
        activeQuestion = currentQuestionsList[currentQuestionIndex];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        answerInput.disabled = false;
        submitButton.disabled = false;
        feedbackDiv.innerHTML = "⏳ Type your answer & click SUBMIT. Timer: 40 seconds.";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        scoreSpan.textContent = currentLevelScore;
        levelSpan.textContent = currentLevel;
        progressSpan.textContent = currentQuestionIndex;
        isTransitioning = false;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    function handleAnswerSubmit() {
        if (isTransitioning) {
            feedbackDiv.innerHTML = "⏳ Please wait...";
            return;
        }
        if (!activeQuestion) return;
        
        let userAnswer = answerInput.value.trim();
        if (userAnswer === "") {
            feedbackDiv.innerHTML = "📝 Please type an answer!";
            speakMessage("Type your answer first.");
            return;
        }
        
        stopGameTimer();
        let isCorrect = activeQuestion.checkAnswer(userAnswer);
        isTransitioning = true;
        isTimeoutFlag = false;
        moveToNextQuestion(isCorrect);
    }
    
    function speakActiveQuestion() {
        if (!activeQuestion || isTransitioning) {
            speakMessage("Please wait, the next question is loading.");
            return;
        }
        speakMessage(activeQuestion.text);
    }
    
    function initializeLevel(level) {
        currentLevel = level;
        currentQuestionsList = generateQuestionsForLevel(level);
        currentQuestionIndex = 0;
        currentLevelScore = 0;
        isTransitioning = false;
        isTimeoutFlag = false;
        
        levelSpan.textContent = level;
        scoreSpan.textContent = "0";
        progressSpan.textContent = "0";
        totalSpan.textContent = "30";
        feedbackDiv.innerHTML = `🇰🇪 LEVEL ${level} START! Answer 30 questions, need 80% to advance. 💧`;
        levelInfoDiv.innerHTML = `🎵 Kenya National Anthem + 💧 Water Safety | Level ${level} of 5 | You can do it!`;
        
        submitButton.disabled = false;
        answerInput.disabled = false;
        
        // Show first question
        activeQuestion = currentQuestionsList[0];
        questionDiv.textContent = activeQuestion.text;
        answerInput.value = "";
        hintDiv.innerHTML = `📚 Topic: ${activeQuestion.topic} | Type short answer.`;
        stopGameTimer();
        startGameTimer();
        answerInput.focus();
    }
    
    // Event Listeners
    submitButton.addEventListener("click", handleAnswerSubmit);
    speakButton.addEventListener("click", speakActiveQuestion);
    answerInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter" && !isTransitioning && activeQuestion) {
            handleAnswerSubmit();
        }
    });
    
    // Start the game
    initializeLevel(1);
</script>
</body>
</html>
