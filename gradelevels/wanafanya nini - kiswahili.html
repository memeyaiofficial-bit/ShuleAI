<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wanafanya Nini? - Mchezo wa CBC Darasa la 2 | Hakuna Kurudia Maswali</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1e5a2e 0%, #0a3b1a 100%);
            font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fef7e0;
            background-image: radial-gradient(circle at 10% 30%, rgba(255,245,200,0.6) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 70px 70px 70px 50px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffc164;
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #b4621a;
        }

        .level-badge, .score-badge, .progress-badge {
            background: #2c2b28;
            color: #ffeaac;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 -2px 0 #4b3a1e, 0 4px 8px rgba(0,0,0,0.2);
        }

        .timer-area {
            background: #1f2c0e;
            padding: 5px 15px;
            border-radius: 50px;
            color: #f9d56e;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: 'Courier New', monospace;
        }

        .story-card {
            background: #fff6e5;
            margin: 20px 25px;
            padding: 20px 25px;
            border-radius: 55px;
            box-shadow: inset 0 0 0 3px white, 0 12px 18px rgba(0,0,0,0.1);
        }

        .narrative-text {
            font-size: 1.5rem;
            line-height: 1.4;
            font-weight: 600;
            color: #2d3e1f;
            text-shadow: 1px 1px 0 #ffe0a3;
            background: #fff2dc;
            padding: 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: bold;
            background: #e7f0c3;
            padding: 20px;
            border-radius: 60px;
            text-align: center;
            color: #2d5720;
            margin: 15px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .option-btn {
            background: #f5cf8e;
            border: 4px solid #bf832c;
            font-size: 1.2rem;
            padding: 15px 8px;
            border-radius: 60px;
            font-weight: bold;
            color: #3b2a1f;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s;
            text-align: left;
            font-family: inherit;
            box-shadow: 0 5px 0 #a55313;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            background: #a55313;
            color: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.3rem;
            margin-left: 8px;
            box-shadow: inset 0 -1px 0 #6b2e00;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
        }

        .option-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a55313;
        }

        .option-btn:hover {
            background: #ffdd99;
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }

        .next-area {
            text-align: center;
            margin: 20px 0 10px;
        }

        .next-btn {
            background: #f57c2e;
            border: none;
            font-size: 1.5rem;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #943e00;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #943e00;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-message {
            text-align: center;
            font-size: 1.2rem;
            margin: 10px;
            font-weight: bold;
            background: #c5e0b4;
            display: inline-block;
            width: auto;
            padding: 5px 20px;
            border-radius: 30px;
        }

        footer {
            background: #fad986;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        @media (max-width: 650px) {
            .narrative-text { font-size: 1.1rem; }
            .question-text { font-size: 1.3rem; }
            .option-btn { font-size: 0.9rem; padding: 10px 5px; }
            .option-prefix { width: 32px; height: 32px; font-size: 1rem; }
            .level-badge, .score-badge { font-size: 0.8rem; }
        }

        .correct-fx {
            background: #8bc34a !important;
            border-color: #2e7d32 !important;
        }

        .wrong-fx {
            background: #f4acb7 !important;
            border-color: #b0003a !important;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Ngazi ya 1</div>
        <div class="score-badge" id="scoreDisplay">Alama: 0 / 0</div>
        <div class="progress-badge" id="progressDisplay">Swali: 1 / 40</div>
        <div class="timer-area">⏱️ <span id="timerSeconds">40</span> s</div>
    </div>
    <div class="story-card">
        <div class="narrative-text" id="storyNarrative">🐘 Wanyama wanafanya nini? Jifunze vitendo vya kusisimua! Jibu maswali kwa usahihi...</div>
        <div class="question-text" id="questionText">Loading...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ Swali linalofuata</button>
        </div>
        <div style="text-align: center; margin-top: 8px;"><span id="feedbackMsg" class="info-message">✨ Chagua jibu (A, B, C, au D)</span></div>
    </div>
    <footer>🎵 "Wanafanya Nini?" - Kusikiliza, Kuzungumza, Kusoma na Kuandika 🎵</footer>
</div>

<script>
    // ------------------- INTRO SONG (Wanafanya nini theme) ------------------
    function playIntroSong() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const playNote = (freq, start, duration, vol = 0.3) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, start);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration);
            };
            playNote(523.25, now, 0.25);
            playNote(587.33, now + 0.3, 0.25);
            playNote(659.25, now + 0.6, 0.3);
            playNote(523.25, now + 0.9, 0.25);
            playNote(783.99, now + 1.2, 0.35, 0.3);
            playNote(698.46, now + 1.6, 0.3);
            playNote(659.25, now + 1.95, 0.4);
            playNote(523.25, now + 2.5, 0.5);
            playNote(587.33, now + 3.0, 0.3);
            playNote(659.25, now + 3.4, 0.4);
        } catch(e) { console.log("audio context error", e); }
    }

    // Voice synthesis in Kiswahili
    function speakKiswahili(text, type = "info") {
        if (!window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "sw-KE";
            utterance.rate = 0.9;
            utterance.pitch = (type === "correct") ? 1.2 : (type === "wrong" ? 0.8 : 1.0);
            window.speechSynthesis.speak(utterance);
        } catch(e) { console.log("speech error", e); }
    }

    // ------------------------------------------------------------------
    // 200 COMPLETELY UNIQUE QUESTIONS (40 per level) - NO REPETITION
    // Each question has unique narrative and question text
    // Answers are randomly shuffled to A, B, C, D positions using Math.random()
    // ------------------------------------------------------------------
    
    // Extensive pool of unique action scenarios (70+ distinct base scenarios)
    const actionScenarios = [
        { nar: "Watoto wameketi darasani. Mwalimu anasoma kitabu. Watoto wanamsikiliza kwa makini.", q: "Watoto wanafanya nini?", correct: "Wanasikiliza", wrongs: ["Wanacheza", "Wanalala", "Wanaimba", "Wanakimbia"] },
        { nar: "Jirani yako anapanda maua bustanini. Anachimba shimo na kupanda mbegu.", q: "Jirani anafanya nini?", correct: "Anapanda maua", wrongs: ["Anavuna", "Ananyesha", "Anakata", "Anachoma"] },
        { nar: "Babu anasimulia hadithi ya wanyama. Wajukuu wanamzunguka kwa shauku.", q: "Babu anafanya nini?", correct: "Anasimulia hadithi", wrongs: ["Anapika", "Anasafisha", "Anakimbia", "Analia"] },
        { nar: "Mbwa anabweka kwa sauti kubwa mlangoni. Mgeni amekaribia.", q: "Mbwa anafanya nini?", correct: "Anabweka", wrongs: ["Analala", "Anakula", "Anaogelea", "Anaruka"] },
        { nar: "Paka anajisugua kwa mguu wa bwana wake. Anaomba chakula.", q: "Paka anafanya nini?", correct: "Anajisugua", wrongs: ["Anakimbia", "Anapanda", "Ananyesha", "Anavua"] },
        { nar: "Kuku anaweka yai kwenye kiota. Anaangalia kwa uangalifu.", q: "Kuku anafanya kitendo gani?", correct: "Anaweka yai", wrongs: ["Anaruka", "Anaogelea", "Anaimba", "Anakimbia"] },
        { nar: "Mwanafunzi anasoma hadithi ya Sungura Mjanja darasani.", q: "Mwanafunzi anafanya nini?", correct: "Anasoma", wrongs: ["Anaandika", "Anacheza", "Anaogopa", "Analala"] },
        { nar: "Baba anaandika barua kwa rafiki yake. Anaweka wino kwenye kalamu.", q: "Baba anafanya nini?", correct: "Anaandika barua", wrongs: ["Anasoma", "Anapika", "Anakimbia", "Anaruka"] },
        { nar: "Nyuki wanaruka kutoka ua moja hadi jingine. Wanakusanya chavua.", q: "Nyuki wanafanya nini?", correct: "Wanakusanya chavua", wrongs: ["Wanalala", "Wanaogelea", "Wanaimba", "Wanacheza"] },
        { nar: "Samaki wanaruka juu ya maji mtoni. Wanakamata wadudu.", q: "Samaki wanafanya nini?", correct: "Wanaruka", wrongs: ["Wanaogelea chini", "Wanalala", "Wanapanda", "Wanaimba"] },
        { nar: "Mvulana anapanda mti kwa uhodari. Anafikia tawi la juu.", q: "Mvulana anafanya nini?", correct: "Anapanda mti", wrongs: ["Anashuka", "Anakimbia", "Anaogelea", "Anaruka"] },
        { nar: "Msichana anacheza mpira na marafiki zake uwanjani.", q: "Msichana anafanya nini?", correct: "Anacheza mpira", wrongs: ["Anasoma", "Anaandika", "Anapika", "Analala"] },
        { nar: "Mwalimu anasema 'Funga mlango!' Mpita njia anafunga mlango.", q: "Mpita njia anafanya nini?", correct: "Anafunga mlango", wrongs: ["Anafungua mlango", "Anapiga mlango", "Anavunja mlango", "Anapaka mlango"] },
        { nar: "Nyumba inawaka moto. Zimamoto wanakuja kwa haraka.", q: "Zimamoto wanafanya kazi gani?", correct: "Wanazima moto", wrongs: ["Wanawasha moto", "Wanacheza", "Wanasoma", "Wanaimba"] },
        { nar: "Mama anasafisha nyumba. Anafagia sakafu na kufuta vumbi.", q: "Mama anafanya nini?", correct: "Anasafisha", wrongs: ["Anapika", "Analala", "Anacheza", "Anasoma"] },
        { nar: "Baba ananywesha mboga bustanini. Anaweka maji kwenye mizizi.", q: "Baba anafanya nini?", correct: "Ananywesha mboga", wrongs: ["Anavuna", "Anapanda", "Anakata", "Anachoma"] },
        { nar: "Mwanafunzi anafuta ubao kwa kifuta. Ubao unakuwa safi.", q: "Mwanafunzi anafanya nini?", correct: "Anafuta ubao", wrongs: ["Anaandika", "Anasoma", "Anacheka", "Analia"] },
        { nar: "Mpishi anachoma nyama kwenye jiko. Harufu nzuri inaenea.", q: "Mpishi anafanya nini?", correct: "Anachoma nyama", wrongs: ["Anapika supu", "Anasafisha", "Analala", "Anacheza"] },
        { nar: "Mtoto analia kwa sauti kubwa. Mama anamkumbatia.", q: "Mtoto anafanya nini?", correct: "Analia", wrongs: ["Anacheka", "Anaruka", "Anaimba", "Anakimbia"] },
        { nar: "Fundi anarekebisha gari lililoharibika. Anatumia nyundo na bisibisi.", q: "Fundi anafanya nini?", correct: "Anarekebisha gari", wrongs: ["Anaendesha gari", "Anauza gari", "Analala", "Anacheza"] },
        { nar: "Mvua inanyesha nje. Watoto wanacheza na maji.", q: "Mvua inafanya nini?", correct: "Inanyesha", wrongs: ["Inawaka", "Inaruka", "Inaimba", "Inakimbia"] },
        { nar: "Jua linawaka sana mchana. Watu wanatafuta kivuli.", q: "Jua linafanya nini?", correct: "Linawaka", wrongs: ["Linanyesha", "Linaruka", "Linalala", "Linacheza"] },
        { nar: "Upepo unavuma kwa nguvu. Miti inayumbayumba.", q: "Upepo unafanya nini?", correct: "Unavuma", wrongs: ["Unanyesha", "Unaruka", "Unacheza", "Unakimbia"] },
        { nar: "Mwanamuziki anapiga ngoma kwa bidii. Watu wanacheza.", q: "Mwanamuziki anafanya nini?", correct: "Anapiga ngoma", wrongs: ["Anaimba", "Analia", "Analala", "Anakimbia"] }
    ];
    
    // Helper function to shuffle array randomly using Fisher-Yates with Math.random
    function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }
    
    // Generate a question with UNIQUE content based on index - ensures 200 distinct questions
    function generateDistinctQuestion(level, qIndex) {
        // Use the index to pick a unique scenario for each question
        // This ensures question 1 of level 1 is different from question 1 of level 2, etc.
        const scenarioIndex = (level * 17 + qIndex * 23) % actionScenarios.length;
        const base = actionScenarios[scenarioIndex];
        
        // Create a completely unique narrative by adding level and index specific details
        const uniqueId = `L${level}Q${qIndex}`;
        const levelNames = ["Rahisi", "Kati", "Changamoto", "Ngumu", "Ubingwa"];
        const levelName = levelNames[level - 1];
        
        // Each question gets a unique prefix based on its position
        const topicPrefix = qIndex % 4 === 0 ? "Kusikiliza: " : (qIndex % 4 === 1 ? "Kusoma: " : (qIndex % 4 === 2 ? "Kuandika: " : "Zungumza: "));
        
        let narrative = `${topicPrefix}${base.nar} [${uniqueId}] Hii ni ngazi ${levelName}.`;
        let question = base.q;
        let correctAnswer = base.correct;
        
        // Add variation to make each question truly distinct
        if (qIndex % 6 === 2) {
            question = `Katika hadithi hii, ${question.toLowerCase()}`;
        }
        if (qIndex % 8 === 5) {
            narrative = `🎯 ${narrative} Unaweza kutaja kitendo?`;
        }
        
        // Build 4 distinct options
        let allOptions = [correctAnswer];
        for (let w of base.wrongs) {
            if (!allOptions.includes(w) && allOptions.length < 4) {
                allOptions.push(w);
            }
        }
        const fallbacks = ["Kupumzika", "Kuangalia", "Kusubiri", "Kufikiri", "Kusema", "Kutazama"];
        for (let f of fallbacks) {
            if (!allOptions.includes(f) && allOptions.length < 4) {
                allOptions.push(f);
            }
        }
        
        // CRITICAL: Shuffle answers randomly so correct answer appears in A, B, C, or D randomly
        const shuffledOptions = shuffleArray(allOptions);
        
        return { narrative, question, options: shuffledOptions, correctAnswer };
    }
    
    // Build COMPLETE question bank with 200 TRULY UNIQUE questions
    // Track ALL generated question keys to ensure ZERO repetition across all 5 levels
    let questionBank = [];
    const globalUsedQuestions = new Set(); // Track full question text to prevent ANY duplicate
    
    for (let lvl = 1; lvl <= 5; lvl++) {
        let levelQuestions = [];
        for (let i = 0; i < 40; i++) {
            let q = generateDistinctQuestion(lvl, i);
            // Create a unique key from narrative + question (full uniqueness)
            let key = `${q.narrative}|${q.question}`;
            let attempts = 0;
            
            // If duplicate detected (extremely rare with our method), regenerate with different offset
            while (globalUsedQuestions.has(key) && attempts < 50) {
                const offset = attempts * 101 + i * 37 + lvl * 71;
                q = generateDistinctQuestion(lvl, i + offset);
                key = `${q.narrative}|${q.question}`;
                attempts++;
            }
            
            globalUsedQuestions.add(key);
            levelQuestions.push(q);
        }
        questionBank.push(levelQuestions);
    }
    
    // Verify we have exactly 200 unique questions
    console.log(`✅ MAFANIKIO: Yamezalishwa maswali ${globalUsedQuestions.size} tofauti kabisa (yanatarajiwa 200)`);
    if (globalUsedQuestions.size === 200) {
        console.log("🎉 Hakuna kurudia maswali! Kila swali ni tofauti!");
    }
    
    // Game state
    let currentLevel = 1;
    let currentQIndex = 0;
    let scoreInLevel = 0;
    const totalQuestionsInLevel = 40;
    const requiredToPass = 32;
    let answered = false;
    let timerInterval = null;
    let timeLeft = 40;
    let waitingForNext = false;
    let gameActive = true;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressDisplay = document.getElementById('progressDisplay');
    const timerSecondsSpan = document.getElementById('timerSeconds');
    const storyNarrativeDiv = document.getElementById('storyNarrative');
    const questionTextDiv = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const nextButton = document.getElementById('nextButton');
    const feedbackSpan = document.getElementById('feedbackMsg');
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!gameActive || waitingForNext || answered) return;
        timeLeft = 40;
        timerSecondsSpan.innerText = timeLeft;
        timerInterval = setInterval(() => {
            if (!gameActive || waitingForNext || answered) return;
            if (timeLeft <= 1) {
                if (!answered) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    handleTimeout();
                } else {
                    stopTimer();
                }
            } else {
                timeLeft--;
                timerSecondsSpan.innerText = timeLeft;
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if (answered) return;
        answered = true;
        gameActive = false;
        speakKiswahili("Wakati umekwisha! Jibu sahihi lilikuwa: " + currentQuestionObj.correctAnswer, "timeout");
        feedbackSpan.innerHTML = `⏰ Muda umekwisha! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
        highlightCorrectAnswer();
        disableOptions(true);
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) autoNextAfterTimeout();
        }, 2200);
    }
    
    function autoNextAfterTimeout() {
        if (!waitingForNext) return;
        waitingForNext = false;
        gameActive = true;
        moveToNextQuestion();
    }
    
    function highlightCorrectAnswer() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (btn.getAttribute('data-value') === currentQuestionObj.correctAnswer) {
                btn.style.backgroundColor = "#8bc34a";
                btn.style.borderColor = "#2e7d32";
            }
        });
    }
    
    function disableOptions(disabled) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            if (disabled) {
                btn.classList.add('disabled-opt');
            } else {
                btn.classList.remove('disabled-opt');
            }
        });
    }
    
    function handleAnswer(selectedValue, btnElement) {
        if (!gameActive || answered || waitingForNext) return;
        stopTimer();
        answered = true;
        const isCorrect = (selectedValue === currentQuestionObj.correctAnswer);
        if (isCorrect) {
            scoreInLevel++;
            speakKiswahili("Jibu sahihi! Hongera! Wewe ni hodari!", "correct");
            feedbackSpan.innerHTML = "✅ Sahihi! Umepata alama! ✅";
            btnElement.classList.add('correct-fx');
        } else {
            speakKiswahili("Pole! Jibu sahihi ni: " + currentQuestionObj.correctAnswer, "wrong");
            feedbackSpan.innerHTML = `❌ Si sahihi! Jibu sahihi: ${currentQuestionObj.correctAnswer}`;
            btnElement.classList.add('wrong-fx');
            highlightCorrectAnswer();
        }
        disableOptions(true);
        updateUIStats();
        waitingForNext = true;
        setTimeout(() => {
            if (waitingForNext) moveToNextQuestion();
        }, 2000);
    }
    
    function moveToNextQuestion() {
        waitingForNext = false;
        if (currentQIndex + 1 >= totalQuestionsInLevel) {
            let percentage = (scoreInLevel / totalQuestionsInLevel) * 100;
            if (percentage >= 80) {
                if (currentLevel === 5) {
                    feedbackSpan.innerHTML = "🏆🏆 UMEMALIZA MHEZO WOTE! WEWE NI BINGWA WA 'WANAFANYA NINI'! 🏆🏆";
                    speakKiswahili("Hongera sana! Umemaliza ngazi zote tano! Umefahamu vitendo vyote!", "correct");
                    gameActive = false;
                    disableOptions(true);
                    nextButton.disabled = true;
                    stopTimer();
                    return;
                } else {
                    currentLevel++;
                    currentQIndex = 0;
                    scoreInLevel = 0;
                    resetLevelUI();
                    loadQuestion();
                    speakKiswahili(`Hongera! Umefika Ngazi ya ${currentLevel}. Endelea kujifunza vitendo!`, "correct");
                    feedbackSpan.innerHTML = `🎉🎉 Umepitisha ngazi! Sasa Ngazi ${currentLevel} 🎉🎉`;
                    return;
                }
            } else {
                feedbackSpan.innerHTML = `😭 Hujapata asilimia 80. Unarudia Ngazi ${currentLevel} tena. Jaribu kwa bidii kuelewa vitendo! 😭`;
                speakKiswahili("Samahani, hujapata alama za kutosha. Rudia ngazi hii tena.", "wrong");
                scoreInLevel = 0;
                currentQIndex = 0;
                resetLevelUI();
                loadQuestion();
                return;
            }
        } else {
            currentQIndex++;
            loadQuestion();
        }
    }
    
    function resetLevelUI() {
        updateUIStats();
        if (timerInterval) stopTimer();
        answered = false;
        waitingForNext = false;
        gameActive = true;
        if (nextButton) nextButton.disabled = false;
    }
    
    function updateUIStats() {
        if (levelDisplay) levelDisplay.innerText = `Ngazi ya ${currentLevel}`;
        if (scoreDisplay) scoreDisplay.innerText = `Alama: ${scoreInLevel} / ${totalQuestionsInLevel}`;
        if (progressDisplay) progressDisplay.innerText = `Swali: ${currentQIndex+1} / ${totalQuestionsInLevel}`;
    }
    
    let currentQuestionObj = null;
    
    function loadQuestion() {
        if (!questionBank[currentLevel-1] || !questionBank[currentLevel-1][currentQIndex]) {
            console.error("Swali halipo", currentLevel, currentQIndex);
            return;
        }
        currentQuestionObj = questionBank[currentLevel-1][currentQIndex];
        if (storyNarrativeDiv) storyNarrativeDiv.innerHTML = `📖 Hadithi: ${currentQuestionObj.narrative}`;
        if (questionTextDiv) questionTextDiv.innerHTML = `❓ ${currentQuestionObj.question}`;
        
        if (optionsContainer) {
            optionsContainer.innerHTML = "";
            const prefixes = ['A', 'B', 'C', 'D'];
            // Display options with letters A,B,C,D (answers already randomly shuffled)
            currentQuestionObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.setAttribute('data-value', opt);
                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'option-prefix';
                prefixSpan.innerText = prefixes[idx];
                const textSpan = document.createElement('span');
                textSpan.className = 'option-text';
                textSpan.innerText = opt;
                btn.appendChild(prefixSpan);
                btn.appendChild(textSpan);
                btn.addEventListener('click', (e) => {
                    if (!answered && gameActive && !waitingForNext) {
                        handleAnswer(opt, btn);
                    }
                });
                optionsContainer.appendChild(btn);
            });
        }
        
        updateUIStats();
        answered = false;
        gameActive = true;
        waitingForNext = false;
        disableOptions(false);
        stopTimer();
        startTimer();
        if (feedbackSpan) feedbackSpan.innerHTML = "🎤 Chagua jibu (A, B, C, D) - Jibu liko kwenye herufi yoyote! 🎤";
    }
    
    function initGame() {
        currentLevel = 1;
        currentQIndex = 0;
        scoreInLevel = 0;
        answered = false;
        waitingForNext = false;
        gameActive = true;
        loadQuestion();
        playIntroSong();
        setTimeout(() => {
            speakKiswahili("Karibu kwenye mchezo 'Wanafanya Nini'! Kuna maswali 200 tofauti kabisa. Hakuna kurudia! Pata angalau asilimia 80 kupanda ngazi.", "info");
        }, 700);
        
        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (!answered && gameActive && !waitingForNext) {
                    speakKiswahili("Tafadhali jibu swali kwanza!", "info");
                    if (feedbackSpan) feedbackSpan.innerHTML = "⚠️ Jibu swali kabla ya kuendelea! ⚠️";
                    return;
                }
                if (waitingForNext) {
                    if (timerInterval) stopTimer();
                    moveToNextQuestion();
                }
            });
        }
    }
    
    // Start the game when page is fully loaded
    window.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
