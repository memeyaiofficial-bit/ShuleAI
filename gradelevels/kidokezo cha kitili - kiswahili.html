<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tito Shuleni - Mchezo wa Kiswahili na Sauti | Daraja la 2</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e5f3a 0%, #0a3b2a 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Comic Sans MS', 'Segoe UI', 'Poppins', 'Chalkboard SE', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fef9e8;
            border-radius: 72px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            transition: all 0.2s ease;
            border: 5px solid #ffcf4a;
        }

        .game-header {
            background: #ffb347;
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 6px solid #ff8c1a;
            color: #2c1a0a;
            font-weight: bold;
        }

        .level-box, .score-box, .timer-box, .sound-box {
            background: white;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #c0c0c0, 0 5px 0 #9b5e1a;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-box {
            background: #2c2b28;
            color: #ffd966;
            font-family: monospace;
            font-size: 1.8rem;
        }

        .sound-btn {
            background: #3c8dbc;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            border-radius: 50px;
            padding: 5px 15px;
            color: white;
            font-weight: bold;
            transition: 0.1s;
            box-shadow: 0 3px 0 #1f4e6e;
        }
        .sound-btn:active {
            transform: translateY(2px);
        }

        .story-area {
            background: #fff3df;
            margin: 25px 25px 15px 25px;
            padding: 30px 20px;
            border-radius: 58px;
            box-shadow: inset 0 0 0 3px white, 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .story-text {
            font-size: 1.7rem;
            line-height: 1.4;
            background: #ffffffcc;
            padding: 20px;
            border-radius: 50px;
            color: #2e3b1f;
            font-weight: bold;
        }

        .question-wrapper {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .question-text {
            font-size: 2rem;
            background: #fffaec;
            display: inline-block;
            padding: 12px 28px;
            border-radius: 48px;
            box-shadow: 0 5px 0 #e0c8a0;
            color: #b45f1b;
        }

        .speaker-icon {
            background: #ffb347;
            border: none;
            font-size: 2rem;
            border-radius: 60px;
            padding: 8px 18px;
            cursor: pointer;
            transition: 0.1s;
            font-weight: bold;
        }

        .answer-area {
            margin: 20px 25px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .answer-input {
            width: 90%;
            max-width: 550px;
            padding: 18px 25px;
            font-size: 1.6rem;
            font-family: inherit;
            border: 4px solid #ffb347;
            border-radius: 60px;
            outline: none;
            text-align: center;
            background: white;
            color: #2c2b28;
            font-weight: bold;
        }

        .answer-input:focus {
            border-color: #f28500;
            box-shadow: 0 0 0 3px #ffcf4a;
        }

        .btn-group {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-btn {
            background: #ff914d;
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: inherit;
            padding: 12px 32px;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.05s linear;
            box-shadow: 0 6px 0 #b85c1a;
        }

        .game-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b85c1a;
        }

        .game-btn.next-btn {
            background: #3ba53b;
            box-shadow: 0 6px 0 #1e6b1e;
        }

        .feedback {
            background: #ebd5b3;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1.3rem;
            font-weight: bold;
            width: 80%;
            text-align: center;
        }

        .progress-container {
            margin: 10px 25px 25px;
            background: #e2cba4;
            border-radius: 40px;
            height: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background: #4caf50;
            width: 0%;
            height: 100%;
            border-radius: 40px;
            transition: width 0.2s;
        }

        @media (max-width: 680px) {
            .story-text { font-size: 1.2rem; }
            .question-text { font-size: 1.4rem; }
            .answer-input { font-size: 1.2rem; }
            .game-btn { font-size: 1rem; padding: 8px 20px; }
            .level-box, .score-box, .timer-box { font-size: 0.9rem; }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffefcf;
            padding: 30px;
            border-radius: 70px;
            text-align: center;
            max-width: 400px;
            border: 8px solid gold;
        }
        .modal-content h2 { font-size: 2rem; color: #1e5f3a; }
        .close-modal {
            background: #ff914d;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="game-header">
        <div class="level-box">⭐ Kiwango: <span id="levelNum">1</span></div>
        <div class="score-box">🎯 Alama: <span id="scoreCount">0</span> / <span id="totalNeeded">0</span></div>
        <div class="timer-box">⏱️ <span id="timerDisplay">00:00</span></div>
        <div class="sound-box">🔊 <button id="globalSoundBtn" class="sound-btn">Sauti IMEWASHWA</button></div>
    </div>
    <div class="story-area">
        <div class="story-text" id="storyNarrative">Habari! Karibu shuleni kwa Tito. Jibu maswali kwa kuandika jibu sahihi!</div>
        <div class="question-wrapper">
            <div class="question-text" id="questionText">...</div>
            <button id="readQuestionBtn" class="speaker-icon">🔊 Soma Sauti</button>
        </div>
    </div>
    <div class="answer-area">
        <input type="text" id="answerInput" class="answer-input" placeholder="Andika jibu lako hapa..." autocomplete="off">
        <div class="btn-group">
            <button class="game-btn" id="submitBtn">✓ Jibu</button>
            <button class="game-btn next-btn" id="nextBtn">➡️ Swali linalofuata</button>
        </div>
        <div id="feedbackMsg" class="feedback">💬 Sikiliza hadithi, bonyeza kitufe cha sauti, kisha andika jibu.</div>
    </div>
    <div class="progress-container">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 5 LEVELS, 40 QUESTIONS EACH - dynamic, narrative, Kiswahili
    // Voice output: reading questions, feedback, time up.
    // --------------------------------------------------------------

    // Function to generate 40 questions per level with Grade 2 appropriate topics (kusikiliza/kuzungumza, kusoma, kuandika)
    function generateQuestionsForLevel(level) {
        const questions = [];
        const baseTemplates = [
            { story: "Tito anaamka asubuhi. Anasikia sauti ya kengele. Ni wakati wa kwenda shule. Anamwambia mama yake: 'Mama, nimeamka!'", q: "Tito anamwambia nani?", ans: "mama" },
            { story: "Kabla ya kuondoka, Tito anavaa sare yake ya shule. Rangi ya sare yake ni buluu na kijivu.", q: "Sare ya Tito ina rangi gani na kijivu?", ans: "buluu" },
            { story: "Tito anabeba mkoba wake. Ndani ya mkoba ana vitabu, kalamu, na rula. Alisahau kalamu.", q: "Tito alisahau kubeba nini?", ans: "kalamu" },
            { story: "Barabarani, Tito anamkuku Mwenyewe aliyevaa kofia nyekundu. Anamjulisha jina lake.", q: "Rafiki wa Tito anaitwa nani?", ans: "mwenyewe" },
            { story: "Wanafunzi wanaingia darasani. Mwalimu anasema, 'Karibu darasani!' Wanafunzi wanamjibu 'Asante, mwalimu!'", q: "Mwalimu anasema neno gani la kukaribisha?", ans: "karibu" },
            { story: "Tito anapiga picha ya darasa. Anachora nyota tatu kwenye daftari lake.", q: "Amchora nyota ngapi?", ans: "3" },
            { story: "Mwalimu anauliza: 'Nani anajua herufi ya kwanza ya alfabeti?' Tito anainua mkono.", q: "Herufi ya kwanza ya alfabeti ni?", ans: "a" },
            { story: "Tito anasoma hadithi: 'Paka anakimbia panya.'", q: "Ni mnyama gani anakimbia?", ans: "paka" },
            { story: "Tito anaandika sentensi: 'Mimi napenda kusoma.'", q: "Neno 'kusoma' linamaanisha nini?", ans: "kusoma" },
            { story: "Tito aliandika jina lake TITO. Herufi ya kwanza ni T.", q: "Herufi ya kwanza ya jina TITO?", ans: "t" },
            { story: "Darasani Tito anamwomba rafiki yake kalamu ya ziada. Rafiki yake anaitwa Aisha.", q: "Rafiki anayempa kalamu anaitwa nani?", ans: "aisha" },
            { story: "Mwalimu anauliza hesabu: 2 + 2 = ? Tito anajua jibu.", q: "2 + 2 ni sawa na?", ans: "4" },
            { story: "Wakati wa kusoma, Tito anapata kitabu cha wanyama. Anamwona simba.", q: "Simba ana rangi gani?", ans: "njano" },
            { story: "Tito anapenda kuandika barua kwa bibi yake. Anamwandikia 'Nakupenda bibi'.", q: "Tito anamwandikia nani barua?", ans: "bibi" }
        ];
        
        for (let i = 0; i < 40; i++) {
            const base = baseTemplates[i % baseTemplates.length];
            let narrative = base.story;
            let question = base.q;
            let answer = base.ans.toLowerCase();
            
            // level-specific variations to add diversity
            if (level === 2) {
                narrative = `[Kiwango cha 2] ${narrative} Tito anajifunza zaidi.`;
                if (answer === "kalamu") answer = "kalamu";
                if (answer === "mama") answer = "mama";
            } else if (level === 3) {
                narrative = `Wakati wa mapumziko: ${narrative}`;
                if (i % 7 === 2) { narrative = "Tito anacheza mpira na wenzake. Alifunga mabao 4."; question = "Alifunga mabao mangapi?"; answer = "4"; }
            } else if (level === 4) {
                narrative = `Katika maktaba: ${narrative}`;
                if (i % 5 === 3) { narrative = "Tito alikopa kitabu cha 'Hadithi za Kiswahili'. Alisoma hadithi kumi."; question = "Alisoma hadithi ngapi?"; answer = "10"; }
            } else if (level === 5) {
                narrative = `Sherehe ya shule! ${narrative} Tito anafurahi sana.`;
                if (i % 9 === 4) { narrative = "Tito alipata zawadi ya penseli 8 na kifuta 2. Ana jumla ya vitu vingapi?"; question = "Ana vitu vingapi kwa jumla?"; answer = "10"; }
            }
            // ensure some numbers / words
            if (i % 13 === 6 && level === 1) { narrative = "Asubuhi Tito anaenda shule na dada yake. Dada yake anaitwa Zainabu."; question = "Dada ya Tito anaitwa nani?"; answer = "zainabu"; }
            if (i % 11 === 8 && level === 4) { question = "Andika neno 'shule' kwa Kiswahili. Je ni neno gani?"; answer = "shule"; narrative = "Tito anapenda shule yake."; }
            
            questions.push({ narrative, question, answer });
        }
        return questions;
    }

    let levelsData = [];
    for (let lvl = 1; lvl <= 5; lvl++) levelsData.push(generateQuestionsForLevel(lvl));

    // Game state
    let currentLevel = 1, currentQIndex = 0, scoreForThisLevel = 0;
    const totalPerLevel = 40, requiredCorrect = 32;
    let timerInterval = null, timeLeft = 50;
    let answeredCurrent = false, waitingForNext = false;
    let soundEnabled = true;  // voice output flag

    // DOM elements
    const levelSpan = document.getElementById('levelNum');
    const scoreSpan = document.getElementById('scoreCount');
    const totalNeededSpan = document.getElementById('totalNeeded');
    const timerDisplay = document.getElementById('timerDisplay');
    const storyDiv = document.getElementById('storyNarrative');
    const questionDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackDiv = document.getElementById('feedbackMsg');
    const progressFill = document.getElementById('progressFill');
    const readQuestionBtn = document.getElementById('readQuestionBtn');
    const globalSoundBtn = document.getElementById('globalSoundBtn');

    // ---------- VOICE OUTPUT (Kiswahili) ----------
    function speakText(text, isError = false, isCorrect = false) {
        if (!soundEnabled) return;
        if (!window.speechSynthesis) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'sw-KE';
        utterance.rate = 0.9;
        if (isCorrect) utterance.pitch = 1.2;
        else if (isError) utterance.pitch = 0.9;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    // Read current question and story aloud
    function readCurrentQuestionAloud() {
        if (!soundEnabled) {
            speakText("Sauti imezimwa. Washa sauti kwenye kitufe cha juu.", false);
            return;
        }
        const qData = levelsData[currentLevel-1][currentQIndex];
        const fullText = `Hadithi: ${qData.narrative}. Swali: ${qData.question}. Andika jibu lako.`;
        speakText(fullText, false, false);
        feedbackDiv.innerHTML = "🔊 Ninasoma hadithi na swali kwa sauti... Sikiliza kwa makini!";
    }

    // Timer voice alert when time is up
    function timeUpAlert() {
        if (soundEnabled) speakText("Muda umekwisha! Hamna jibu sahihi. Bonyeza swali linalofuata.", true, false);
    }

    // correct/wrong voice feedback
    function playAnswerFeedback(correct, userAnswer, correctAnswer) {
        if (!soundEnabled) return;
        if (correct) {
            speakText(`Hongera! Jibu lako ${userAnswer} ni sahihi! Umepata alama.`, false, true);
        } else {
            speakText(`Pole, jibu sahihi ni ${correctAnswer}. Endelea kujifunza Kiswahili!`, true, false);
        }
    }

    // Toggle global sound
    function toggleSound() {
        soundEnabled = !soundEnabled;
        globalSoundBtn.innerText = soundEnabled ? "Sauti IMEWASHWA 🔊" : "Sauti IMEFUTWA 🔇";
        speakText(soundEnabled ? "Sauti imewashwa. Furahia mchezo." : "Sauti imefutwa.", false);
        if (!soundEnabled) window.speechSynthesis.cancel();
    }
    globalSoundBtn.addEventListener('click', toggleSound);

    // Timer functions
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function updateTimerDisplay() { let m = Math.floor(timeLeft/60), s = timeLeft%60; timerDisplay.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    
    function startTimer() {
        stopTimer();
        timeLeft = 50;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!answeredCurrent && !waitingForNext && currentQIndex < totalPerLevel) {
                if (timeLeft <= 1) {
                    stopTimer();
                    if (!answeredCurrent) {
                        answeredCurrent = true;
                        waitingForNext = true;
                        userAnswerCorrect = false;
                        feedbackDiv.innerHTML = "⏰ Muda umekwisha! Jibu si sahihi. Bonyeza 'Swali linalofuata'.";
                        timeUpAlert();
                        answerInput.disabled = true;
                        submitBtn.disabled = true;
                        nextBtn.disabled = false;
                        updateProgressUI();
                    }
                } else {
                    timeLeft--;
                    updateTimerDisplay();
                }
            }
        }, 1000);
    }

    function updateProgressUI() {
        const percent = (scoreForThisLevel / totalPerLevel) * 100;
        progressFill.style.width = `${percent}%`;
        scoreSpan.innerText = `${scoreForThisLevel}`;
        totalNeededSpan.innerText = `${requiredCorrect}`;
    }

    function loadQuestion() {
        if (currentQIndex >= totalPerLevel) { finishLevel(); return; }
        answeredCurrent = false;
        waitingForNext = false;
        answerInput.disabled = false;
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        answerInput.value = '';
        answerInput.focus();
        const qData = levelsData[currentLevel-1][currentQIndex];
        storyDiv.innerHTML = `📖 ${qData.narrative}`;
        questionDiv.innerHTML = `❓ ${qData.question}`;
        feedbackDiv.innerHTML = "🔊 Bonyeza kitufe cha sauti kusikiliza, kisha jibu. Andika kwa Kiswahili!";
        updateProgressUI();
        startTimer();
        // auto-read option on new question if sound enabled? but manual is better, but we can optionally read on load?
        if (soundEnabled) {
            // gentle: speak only if sound flag but we don't force automatic to avoid annoyance, but we can provide a message
        }
    }

    function handleSubmit() {
        if (answeredCurrent) { feedbackDiv.innerHTML = "Umeshajibu! Bonyeza 'Swali linalofuata'."; speakText("Umeshajibu. Endelea", false); return; }
        if (waitingForNext) return;
        const userAns = answerInput.value.trim().toLowerCase();
        if (userAns === "") { feedbackDiv.innerHTML = "Tafadhali andika jibu lako!"; speakText("Andika jibu kabla ya kubonyeza jibu", false); return; }
        const currentAns = levelsData[currentLevel-1][currentQIndex].answer;
        const isCorrect = (userAns === currentAns);
        answeredCurrent = true;
        stopTimer();
        if (isCorrect) {
            scoreForThisLevel++;
            feedbackDiv.innerHTML = `✅ Sahihi! "${userAns}" ni jibu zuri! Hongera!`;
            playAnswerFeedback(true, userAns, currentAns);
        } else {
            feedbackDiv.innerHTML = `❌ Pole! Jibu sahihi ni "${currentAns}". Wewe uliandika "${userAns}". Jaribu tena swali linalofuata!`;
            playAnswerFeedback(false, userAns, currentAns);
        }
        updateProgressUI();
        answerInput.disabled = true;
        submitBtn.disabled = true;
        waitingForNext = true;
        nextBtn.disabled = false;
        // if after answering and level might be finished if last question and score meets, will be handled in next
    }

    function nextQuestion() {
        if (!waitingForNext && !answeredCurrent && currentQIndex < totalPerLevel) {
            feedbackDiv.innerHTML = "Jibu swali la sasa kwanza!";
            speakText("Jibu swali la sasa kwanza", false);
            return;
        }
        if (currentQIndex < totalPerLevel - 1) {
            currentQIndex++;
            loadQuestion();
        } else {
            // last question - finish level after submitting answer and hitting next
            if (currentQIndex === totalPerLevel - 1) {
                currentQIndex++; // mark as completed
                finishLevel();
            } else {
                finishLevel();
            }
        }
    }

    function finishLevel() {
        stopTimer();
        const passed = scoreForThisLevel >= requiredCorrect;
        if (passed) {
            if (currentLevel === 5) {
                speakText("Hongera sana! Umemaliza michezo yote mitano! Wewe ni bingwa wa Kiswahili!", false, true);
                alert("🎉🏆 HONGERA! UMEMALIZA KIWANGO CHOTE 5! 🏆🎉\nUmefanya vizuri sana! Unaweza kuanza upya mchezo.");
                resetGame();
                return;
            } else {
                showLevelUpModal();
                currentLevel++;
                currentQIndex = 0;
                scoreForThisLevel = 0;
                levelSpan.innerText = currentLevel;
                updateProgressUI();
                loadQuestion();
                speakText(`Hongera umepanda kiwango cha ${currentLevel}`, false, true);
            }
        } else {
            speakText(`Samahani, umepata alama ${scoreForThisLevel} kati ya ${totalPerLevel}. Unahitaji angalau ${requiredCorrect} kupanda. Rudia kiwango hiki.`, true, false);
            alert(`😔 Umepata alama ${scoreForThisLevel}/${totalPerLevel}. Unahitaji ${requiredCorrect} alama (80%) kupanda ngazi. Jaribu tena!`);
            currentQIndex = 0;
            scoreForThisLevel = 0;
            updateProgressUI();
            loadQuestion();
        }
    }

    function showLevelUpModal() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content">
            <h2>🎉 Umepanda Kiwango ${currentLevel+1} 🎉</h2>
            <p style="font-size:1.3rem">Umefikia ${currentLevel === 1 ? 'Kiwango cha 2' : currentLevel === 2 ? 'Kiwango cha 3' : currentLevel === 3 ? 'Kiwango cha 4' : 'Kiwango cha 5'}<br>Endelea kujifunza kwa Tito!</p>
            <button class="close-modal" id="modalCloseBtn">Sawa ➡️</button>
        </div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('modalCloseBtn').onclick = () => modalDiv.remove();
    }

    function resetGame() {
        stopTimer();
        currentLevel = 1;
        currentQIndex = 0;
        scoreForThisLevel = 0;
        answeredCurrent = false;
        waitingForNext = false;
        levelSpan.innerText = "1";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', handleSubmit);
    nextBtn.addEventListener('click', nextQuestion);
    readQuestionBtn.addEventListener('click', readCurrentQuestionAloud);
    answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !answeredCurrent && !waitingForNext) handleSubmit(); });

    // Initialize UI
    totalNeededSpan.innerText = `${requiredCorrect}`;
    loadQuestion();
    // initial sound message
    setTimeout(() => { if(soundEnabled) speakText("Karibu kwenye mchezo wa Tito Shuleni. Bonyeza kitufe cha sauti kusikiliza swali.", false); }, 500);
</script>
</body>
</html>
