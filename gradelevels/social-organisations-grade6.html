<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cultural Guardians | Grade 4 Social Studies | Traditions & Social Organizations</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #5d3a1a 0%, #3a2210 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #c67b2e, #9b5a1a);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #6b3c0a;
            color: white;
            text-shadow: 2px 2px 0 #6b3c0a;
        }

        .level-badge {
            background: #2c1a0a;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #7a4a1a, 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #1a0f05;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 0 3px #f5d79c, 0 6px 0 #3a220a;
        }

        .timer-number {
            background: #000000;
            padding: 6px 20px;
            border-radius: 50px;
            color: #ffbf7e;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e8ddc5;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #5a3a1a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-card {
            padding: 30px 28px 20px;
            background: #fffaf0;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            background: #f5e6d3;
            padding: 24px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 18px rgba(0,0,0,0.1);
            color: #3a2a1a;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa8e6c;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #c67b2e;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #7a4a1a;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.correct-highlight .option-prefix {
            background: #1b5e20;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn.wrong-highlight .option-prefix {
            background: #8b2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #f4a261;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 45px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #c45c1a;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #5a3a1a;
            color: #f5e6d3;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px solid #f5bc70;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 0.95rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
            .timer-number { font-size: 1.5rem; min-width: 75px; letter-spacing: 2px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-critical {
            background: #8b0000 !important;
            color: #ffcc44 !important;
            text-shadow: 0 0 4px red;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.85; transform: scale(1.03);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .culture-icon {
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">🪘 LEVEL <span id="levelNum">1</span> 🏫</div>
        <div class="timer-area">⏱️ TIME LEFT <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 80% TO PASS → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading cultural traditions...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">🪘 CULTURAL GUARDIAN! Learn traditions, ceremonies, and how we organize in county & school. Timer is RUNNING — become a heritage hero!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC SOCIAL STUDIES: ASPECTS OF TRADITIONAL CULTURE IN THE COUNTY AND THE SCHOOL ON SOCIAL ORGANISATIONS
    // Topics: Traditional ceremonies, rites of passage, cultural values, social organizations (age sets, councils, clans)
    // School social organizations (prefects, clubs, class leaders), preservation of culture
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- BANK 1: TRADITIONAL CULTURE (Ceremonies, Customs, Values) ----------
    const traditionsBank = [
        { q: "A traditional ceremony marking the transition from childhood to adulthood is called:", correct: "Rite of passage", options: ["Birthday party", "Rite of passage", "Graduation", "Wedding"] },
        { q: "Which of these is an example of a traditional ceremony in many Kenyan communities?", correct: "Harvest festival", options: ["Car racing", "Harvest festival", "Video game tournament", "Swimming gala"] },
        { q: "Elders in a traditional council are respected because:", correct: "They have wisdom and experience", options: ["They are rich", "They have wisdom and experience", "They are young", "They can fight"] },
        { q: "What is 'dowry' or 'bride price' in traditional culture?", correct: "Gifts given by groom's family to bride's family", options: ["Money for school", "Gifts given by groom's family to bride's family", "Tax to government", "Payment for land"] },
        { q: "Traditional songs and dances are important because they:", correct: "Preserve history and values", options: ["Only entertain", "Preserve history and values", "Replace school", "Make noise"] },
        { q: "Storytelling around a fire in the evening was used to:", correct: "Teach morals and pass on history", options: ["Scare children", "Teach morals and pass on history", "Cook food", "Count people"] },
        { q: "Traditional attire (clothing) varies among communities and shows:", correct: "Identity and cultural pride", options: ["Only fashion", "Identity and cultural pride", "Wealth only", "School grades"] },
        { q: "Which traditional value means working together as a community?", correct: "Cooperation / Harambee", options: ["Individualism", "Cooperation / Harambee", "Greed", "Laziness"] }
    ];

    // ---------- BANK 2: SOCIAL ORGANIZATIONS IN THE COUNTY (Traditional) ----------
    const countySocialBank = [
        { q: "A council of elders in a county is a traditional:", correct: "Governing and advisory body", options: ["School club", "Governing and advisory body", "Sports team", "Market group"] },
        { q: "Among the Maasai, a group of warriors of similar age is called an:", correct: "Age-set", options: ["Clan", "Age-set", "Family", "School"] },
        { q: "A 'clan' in traditional society means:", correct: "A group of families with common ancestry", options: ["A school", "A group of families with common ancestry", "A market", "A farm"] },
        { q: "Who resolves disputes in a traditional village setting?", correct: "Council of elders", options: ["Police", "Council of elders", "Teacher", "Doctor"] },
        { q: "Traditional social organizations help to:", correct: "Maintain order and unity", options: ["Create chaos", "Maintain order and unity", "Isolate people", "Stop farming"] },
        { q: "In many Kenyan communities, initiation ceremonies are organized by:", correct: "Elders and community leaders", options: ["Children", "Elders and community leaders", "Foreigners", "Teachers only"] },
        { q: "The 'Njuri Ncheke' is a council of elders from which community?", correct: "Ameru (Meru)", options: ["Luo", "Ameru (Meru)", "Maasai", "Kikuyu"] }
    ];

    // ---------- BANK 3: SOCIAL ORGANIZATIONS IN THE SCHOOL ----------
    const schoolSocialBank = [
        { q: "A group of students chosen to maintain discipline in school is called:", correct: "Prefects or student council", options: ["Teachers", "Prefects or student council", "Cooks", "Drivers"] },
        { q: "Which school club promotes cultural heritage?", correct: "Cultural club or heritage club", options: ["Math club", "Cultural club", "Football club", "Drama club only"] },
        { q: "The head of a school's student government is usually called:", correct: "Head boy/Head girl", options: ["Principal", "Head boy/Head girl", "Class teacher", "Chairperson"] },
        { q: "Class monitors help the teacher by:", correct: "Collecting books and maintaining order", options: ["Teaching lessons", "Collecting books and maintaining order", "Cleaning the staff room", "Writing exams"] },
        { q: "A school social organization that helps the needy and visits children's homes is:", correct: "Charity club or Red Cross club", options: ["Debate club", "Charity club", "Science club", "Swimming team"] },
        { q: "Why do schools have a student council?", correct: "To represent students' ideas and solve problems", options: ["To replace teachers", "To represent students' ideas and solve problems", "To clean toilets", "To cook lunch"] },
        { q: "The 'Environmental club' in school focuses on:", correct: "Planting trees and keeping the school clean", options: ["Playing games", "Planting trees and keeping the school clean", "Singing", "Cooking"] }
    ];

    // ---------- BANK 4: CULTURAL PRESERVATION & COUNTY MODERN ORGANIZATIONS ----------
    const culturalPreservationBank = [
        { q: "A museum in a county helps preserve culture by:", correct: "Displaying traditional artifacts and history", options: ["Selling food", "Displaying traditional artifacts and history", "Teaching math", "Playing music only"] },
        { q: "Cultural festivals in a county allow people to:", correct: "Showcase traditional dances, food, and crafts", options: ["Fight each other", "Showcase traditional dances, food, and crafts", "Ignore elders", "Wear school uniform"] },
        { q: "The government protects traditional culture by:", correct: "Declaring national heritage sites and cultural days", options: ["Banning all songs", "Declaring national heritage sites and cultural days", "Destroying artifacts", "Forcing everyone to dress the same"] },
        { q: "Why should young people learn about their traditional culture?", correct: "To understand their identity and respect ancestors", options: ["To forget the past", "To understand their identity and respect ancestors", "To avoid school", "To travel abroad"] },
        { q: "Which day is celebrated in Kenya to honor cultural diversity?", correct: "Utamaduni Day (formerly Moi Day) – 10th October", options: ["Christmas", "Utamaduni Day", "Easter", "New Year"] },
        { q: "Traditional crafts like beadwork and pottery are important because they:", correct: "Provide income and keep skills alive", options: ["Are useless", "Provide income and keep skills alive", "Replace computers", "Only for tourists"] }
    ];

    // ---------- BANK 5: VALUES, ROLES, AND LEADERSHIP IN CULTURE & SCHOOL ----------
    const valuesBank = [
        { q: "Respecting elders in both school and county shows:", correct: "Good character and cultural value", options: ["Weakness", "Good character and cultural value", "Ignorance", "Modern life"] },
        { q: "In school, a 'class captain' is responsible for:", correct: "Leading the class and assisting teachers", options: ["Cooking lunch", "Leading the class and assisting teachers", "Cleaning the staff room", "Driving the bus"] },
        { q: "What does 'unity' mean in a social organization?", correct: "Working together towards common goals", options: ["Fighting each other", "Working together towards common goals", "Ignoring others", "Competing negatively"] },
        { q: "A traditional chief in a county helps to:", correct: "Lead the community and settle disputes", options: ["Sell goods", "Lead the community and settle disputes", "Teach science", "Build houses"] },
        { q: "Which value is important in both traditional culture and school?", correct: "Responsibility", options: ["Selfishness", "Responsibility", "Laziness", "Dishonesty"] },
        { q: "A school's 'Guidance and Counseling' committee helps students with:", correct: "Personal and academic challenges", options: ["Sports only", "Personal and academic challenges", "Cleaning duties", "Cooking"] },
        { q: "Traditional proverbs are used to:", correct: "Teach lessons and share wisdom", options: ["Confuse people", "Teach lessons and share wisdom", "Replace school books", "Only for fun"] },
        { q: "The 'Baraza' (community meeting) in traditional counties serves to:", correct: "Discuss issues and make decisions together", options: ["Sleep", "Discuss issues and make decisions together", "Fight", "Sing all day"] }
    ];

    // Combine all banks into categories (6 categories, each contributes 5 questions per level =30)
    const categories = [traditionsBank, countySocialBank, schoolSocialBank, culturalPreservationBank, valuesBank];
    
    // Build 5 levels (30 Q each, each category contributes 6 per level)
    let levelsData = [];

    function buildGame() {
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            for (let cat of categories) {
                // each category gives 6 questions (total 30 per level)
                for (let i = 0; i < 6; i++) {
                    let source = cat[i % cat.length];
                    let newQ = {
                        text: source.q,
                        options: [...source.options],
                        correct: source.correct
                    };
                    // Add challenge flavor based on level
                    if (lvl >= 3 && i % 2 === 0) newQ.text = "🪘 " + newQ.text;
                    if (lvl >= 4) newQ.text = "⭐ " + newQ.text + " ⭐";
                    if (lvl === 5 && i % 3 === 0) newQ.text = "🏆 CULTURAL GUARDIAN: " + newQ.text;
                    levelQs.push(newQ);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsData.push(levelQs);
        }
    }
    buildGame();

    // ---------- GAME ENGINE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100); // 24

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    // DOM elements
    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const optionsDiv = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Challenging timer: Level1=92s, L2=82s, L3=72s, L4=62s, L5=52s
        const timeMap = {1: 92, 2: 82, 3: 72, 4: 62, 5: 52};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                // TIME'S UP - Level failure
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableAllOptions();
                nextBtn.disabled = true;
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to become a culture guardian! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ONLY ${levelTimerSec} SECONDS! Our traditions need you! Answer fast! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => btn.disabled = true);
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '🪘 RESTART CULTURE CHALLENGE 🪘';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    function highlightCorrectAnswer(correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (rawText === correctText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    function handleAnswer(selected, correctAnswer, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) return;
        answerLocked = true;
        const isCorrect = (selected === correctAnswer);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            messageDiv.innerHTML = `✅ CULTURAL WISDOM! +1 point! (${levelScore}/${TOTAL_QS}) | Time left: ${levelTimerSec}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            // Show correct answer by highlighting it among all options
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswer) {
                    btn.classList.add('correct-highlight');
                }
            });
            messageDiv.innerHTML = `❌ NOT QUITE! Correct: "${correctAnswer}". Learn from our ancestors! Score: ${levelScore}/${TOTAL_QS}`;
        }
        disableAllOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const levelData = levelsData[currentLevel - 1];
        const q = levelData[currentQIndex];
        questionDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        
        const shuffledOps = shuffleArray([...q.options]);
        const prefixes = ['A', 'B', 'C', 'D'];
        shuffledOps.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsDiv.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        messageDiv.innerHTML = `🪘 Level ${currentLevel} • Question ${currentQIndex+1}/30 • Traditions & Social Organizations! Honor our heritage! ⏱️`;
    }

    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                // GRAND VICTORY
                messageDiv.innerHTML = `🏆🪘🏫✨ MAGNIFICENT! You have mastered traditional culture and social organizations in the county and school! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). You are a true Cultural Guardian! ✨🏫🪘🏆`;
                disableAllOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉🎊 LEVEL ${currentLevel} COMPLETE! 🎊🎉 ${levelScore}/${TOTAL_QS} PASS (${Math.round(levelScore/TOTAL_QS*100)}%). Moving to LEVEL ${currentLevel+1}... 🪘🏫`;
                disableAllOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadCurrentQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableAllOptions();
            nextBtn.disabled = true;
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect} correct). Press RESTART to become a culture hero! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadCurrentQuestion();
        nextBtn.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
