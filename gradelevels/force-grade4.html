<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Force Master | Grade 4 Science | Forces in Nature & Daily Life</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #5a2d7a 0%, #3a1a5a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffaf0;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 250, 210, 0.9);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #8e44ad, #6c3483);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 6px solid #4a235a;
            color: white;
            text-shadow: 2px 2px 0 #4a235a;
        }

        .level-badge {
            background: #2c0e3a;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.7rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #8e44ad, 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-area {
            background: #1a0a2a;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.6rem;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: inset 0 0 0 3px #d7bde2, 0 6px 0 #2c0e3a;
        }

        .timer-number {
            background: #000000;
            padding: 6px 20px;
            border-radius: 50px;
            color: #d7bde2;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 5px;
            font-family: 'Courier New', monospace;
            min-width: 110px;
            text-align: center;
            transition: 0.1s;
        }

        .score-progress {
            background: #e8ddc5;
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #b89a6e;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 12px;
        }

        .score-text, .required-text {
            background: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #6c3483;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .question-card {
            padding: 30px 28px 20px;
            background: #fffaf0;
        }

        .question-text {
            font-size: 1.55rem;
            font-weight: 700;
            background: #f5eef8;
            padding: 24px;
            border-radius: 60px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: inset 0 0 0 4px white, 0 10px 18px rgba(0,0,0,0.1);
            color: #4a235a;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: #f0e2d0;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 16px 12px;
            border-radius: 60px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.07s linear;
            cursor: pointer;
            box-shadow: 0 6px 0 #aa8e6c;
            color: #2d2418;
            font-family: inherit;
        }

        .option-prefix {
            background: #8e44ad;
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 2px 0 #4a235a;
        }

        .option-btn:hover:not(:disabled) {
            background: #ffefcf;
            transform: scale(0.97);
        }

        .option-btn.correct-highlight {
            background: #2e7d32;
            color: white;
            box-shadow: 0 3px 0 #1b5e1f;
        }

        .option-btn.correct-highlight .option-prefix {
            background: #1b5e20;
        }

        .option-btn.wrong-highlight {
            background: #c62828;
            color: white;
            text-decoration: line-through;
            box-shadow: 0 3px 0 #7f2a2a;
        }

        .option-btn.wrong-highlight .option-prefix {
            background: #8b2a2a;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .next-area {
            text-align: center;
            padding-bottom: 25px;
        }

        .next-btn {
            background: #f4a261;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 45px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #c45c1a;
            transition: 0.07s linear;
            font-family: inherit;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #c45c1a;
        }

        .next-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #6c3483;
            color: #f5eef8;
            text-align: center;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px solid #f5bc70;
        }

        .restart-btn {
            background: #3c2a1f;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            color: #ffddbb;
            font-weight: bold;
            cursor: pointer;
            margin-left: 18px;
            font-size: 0.95rem;
            transition: 0.1s;
        }

        .restart-btn:hover {
            background: #5e3f2a;
            color: white;
        }

        @media (max-width: 680px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.2rem; }
            .timer-number { font-size: 1.5rem; min-width: 75px; letter-spacing: 2px; }
            .level-badge { font-size: 1.2rem; }
        }

        .timer-critical {
            background: #8b0000 !important;
            color: #ffcc44 !important;
            text-shadow: 0 0 4px red;
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.85; transform: scale(1.03);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .force-icon {
            display: inline-block;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">⚡ LEVEL <span id="levelNum">1</span> 💪</div>
        <div class="timer-area">⏱️ TIME LEFT <span class="timer-number" id="timerDisplay">00</span></div>
    </div>
    <div class="score-progress">
        <div class="score-text">🏆 SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 80% TO PASS → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading force challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="next-area">
            <button class="next-btn" id="nextButton">➡️ NEXT QUESTION ⬅️</button>
        </div>
    </div>
    <div class="message-area" id="gameMessage">⚡ FORCE MASTER! Learn types of forces, their effects, uses, and importance. Timer is RUNNING — feel the force!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC SCIENCE AND TECHNOLOGY: FORCES
    // Topics: Types of forces in nature (gravity, friction, magnetic, buoyancy, muscular)
    // Effects of force on objects (movement, shape change, speed change, direction change, stopping)
    // Uses of force in daily life
    // Importance of force in day-to-day life
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- BANK 1: TYPES OF FORCES IN NATURE ----------
    const typesBank = [
        { q: "Which force pulls objects toward the Earth?", correct: "Gravity", options: ["Friction", "Gravity", "Magnetism", "Buoyancy"] },
        { q: "The force that opposes motion between two surfaces in contact is called:", correct: "Friction", options: ["Gravity", "Magnetism", "Friction", "Buoyancy"] },
        { q: "Which force attracts iron and steel objects?", correct: "Magnetic force", options: ["Gravitational force", "Magnetic force", "Frictional force", "Buoyant force"] },
        { q: "The upward force that makes objects float in water is called:", correct: "Buoyancy (upthrust)", options: ["Gravity", "Friction", "Buoyancy", "Magnetism"] },
        { q: "The force applied by our muscles to lift or push objects is called:", correct: "Muscular force", options: ["Gravitational force", "Magnetic force", "Muscular force", "Frictional force"] },
        { q: "Which force keeps us on the ground and makes things fall?", correct: "Gravitational force", options: ["Magnetic force", "Frictional force", "Gravitational force", "Buoyant force"] },
        { q: "When you rub your hands together, which force produces heat?", correct: "Friction", options: ["Gravity", "Magnetism", "Friction", "Buoyancy"] },
        { q: "A magnet can attract a paperclip without touching it. This is due to:", correct: "Magnetic force", options: ["Gravity", "Friction", "Magnetic force", "Buoyancy"] },
        { q: "A boat floating on water experiences:", correct: "Buoyant force (upthrust)", options: ["Only gravity", "Only friction", "Buoyant force", "Magnetic force"] },
        { q: "Kicking a football uses which type of force?", correct: "Muscular force", options: ["Gravity", "Friction", "Magnetic force", "Muscular force"] }
    ];

    // ---------- BANK 2: EFFECTS OF FORCE ON OBJECTS ----------
    const effectsBank = [
        { q: "A force can make a stationary object:", correct: "Start moving", options: ["Start moving", "Disappear", "Change color", "Become heavier"] },
        { q: "Applying a force to a moving object can:", correct: "Stop it or change its speed", options: ["Stop it or change its speed", "Only make it faster", "Only make it slower", "Only change its color"] },
        { q: "When you squash a plastic bottle, the force changes its:", correct: "Shape", options: ["Color", "Shape", "Temperature", "Smell"] },
        { q: "A goalkeeper catching a ball shows that force can:", correct: "Stop a moving object", options: ["Start motion", "Stop a moving object", "Change shape", "Change color"] },
        { q: "When you hit a tennis ball with a racket, the force changes the ball's:", correct: "Direction of motion", options: ["Color", "Size", "Direction of motion", "Temperature"] },
        { q: "Pushing a swing makes it move from rest. This shows force can:", correct: "Start motion", options: ["Start motion", "Stop motion", "Change shape", "Change color"] },
        { q: "Stretching a rubber band changes its:", correct: "Shape and length", options: ["Color", "Temperature", "Shape and length", "Weight"] },
        { q: "When you brake a bicycle, friction force:", correct: "Slows down and stops the bike", options: ["Speeds up the bike", "Slows down and stops the bike", "Changes its color", "Makes it float"] },
        { q: "A rolling ball eventually stops due to:", correct: "Frictional force", options: ["Gravitational force", "Frictional force", "Magnetic force", "Buoyant force"] }
    ];

    // ---------- BANK 3: USES OF FORCE IN DAILY LIFE ----------
    const usesBank = [
        { q: "We use muscular force to:", correct: "Lift, push, pull and carry objects", options: ["Only sleep", "Lift, push, pull and carry objects", "Only watch TV", "Only eat"] },
        { q: "Friction is useful when:", correct: "Walking without slipping", options: ["Walking without slipping", "Ice skating", "Flying", "Swimming"] },
        { q: "Gravity is used to:", correct: "Keep things on the ground and make water flow downhill", options: ["Make things float", "Keep things on the ground and make water flow downhill", "Push objects away", "Create magnets"] },
        { q: "Magnetic force is used in:", correct: "Compasses, fridge magnets, and magnetic toys", options: ["Compasses, fridge magnets, and magnetic toys", "Cooking food", "Growing plants", "Building houses"] },
        { q: "A parachute uses air resistance (a type of friction) to:", correct: "Slow down a falling person", options: ["Speed up falling", "Slow down a falling person", "Make the person float forever", "Change direction sideways"] },
        { q: "We use force to open a door by:", correct: "Pulling or pushing", options: ["Pulling or pushing", "Looking at it", "Talking to it", "Ignoring it"] },
        { q: "A spring balance measures force using:", correct: "Elastic force (stretching)", options: ["Gravity only", "Elastic force (stretching)", "Magnetic force", "Buoyancy"] },
        { q: "Brakes on a bicycle use:", correct: "Frictional force to stop the wheels", options: ["Gravity to stop", "Frictional force to stop", "Magnetism to stop", "Buoyancy to stop"] },
        { q: "A fan rotates because of:", correct: "Muscular force (switched on by electricity, but motor uses magnetic force)", options: ["Gravity", "Friction", "Magnetic force (in motor)", "Buoyancy"] }
    ];

    // ---------- BANK 4: IMPORTANCE OF FORCE IN DAY-TO-DAY LIFE ----------
    const importanceBank = [
        { q: "Without gravity, everything would:", correct: "Float away into space", options: ["Float away into space", "Stay perfectly still", "Fall faster", "Become heavier"] },
        { q: "Without friction, we would not be able to:", correct: "Walk, write, or hold objects", options: ["Walk, write, or hold objects", "See colors", "Hear sounds", "Taste food"] },
        { q: "Force is important for:", correct: "Moving, stopping, and changing the shape of objects", options: ["Moving, stopping, and changing the shape of objects", "Only sleeping", "Only eating", "Only watching"] },
        { q: "Muscular force allows us to:", correct: "Play sports, work, and perform daily tasks", options: ["Play sports, work, and perform daily tasks", "Only breathe", "Only dream", "Only sleep"] },
        { q: "Buoyant force helps:", correct: "Ships and boats to float", options: ["Ships and boats to float", "Ships to sink", "Fish to fly", "Birds to swim"] },
        { q: "Magnetic force is important for:", correct: "Separating scrap metal, compass navigation, and MRI machines", options: ["Separating scrap metal, compass navigation, and MRI machines", "Only toys", "Only cleaning", "Only cooking"] },
        { q: "Force is essential for:", correct: "All types of transportation (cars, trains, planes, ships)", options: ["All types of transportation", "Only walking", "Only flying", "Only swimming"] },
        { q: "Without forces, the universe would:", correct: "Have no motion or change", options: ["Have no motion or change", "Explode", "Collapse", "Spin faster"] }
    ];

    // ---------- BANK 5: FORCES IN NATURE AND THE ENVIRONMENT ----------
    const natureBank = [
        { q: "Which force causes rain to fall from clouds?", correct: "Gravitational force", options: ["Magnetic force", "Gravitational force", "Frictional force", "Buoyant force"] },
        { q: "Wind is moving air. What force moves wind?", correct: "Pressure difference (atmospheric force)", options: ["Gravity", "Magnetism", "Pressure difference", "Buoyancy"] },
        { q: "Rivers flow downhill due to:", correct: "Gravitational force", options: ["Magnetic force", "Gravitational force", "Friction", "Buoyancy"] },
        { q: "A rock falling off a cliff is an example of:", correct: "Gravity at work", options: ["Magnetism", "Gravity at work", "Friction", "Buoyancy"] },
        { q: "Tides in the ocean are caused mainly by:", correct: "Gravitational pull of the moon and sun", options: ["Wind", "Gravitational pull of the moon and sun", "Earthquakes", "Volcanoes"] },
        { q: "Erosion of rocks by wind and water involves:", correct: "Frictional and kinetic forces", options: ["Only gravity", "Only magnetism", "Frictional and kinetic forces", "Only buoyancy"] },
        { q: "A bird flying uses:", correct: "Muscular force and air resistance", options: ["Only gravity", "Only magnetism", "Muscular force and air resistance", "Only buoyancy"] },
        { q: "A seed falling from a tree is pulled down by:", correct: "Gravity", options: ["Magnetism", "Gravity", "Friction", "Buoyancy"] }
    ];

    // Combine all banks into categories
    const categories = [typesBank, effectsBank, usesBank, importanceBank, natureBank];
    
    // Build 5 levels (30 Q each, each category contributes 6 per level)
    let levelsData = [];

    function buildGame() {
        for (let lvl = 1; lvl <= 5; lvl++) {
            let levelQs = [];
            for (let cat of categories) {
                for (let i = 0; i < 6; i++) {
                    let source = cat[i % cat.length];
                    let newQ = {
                        text: source.q,
                        options: [...source.options],
                        correct: source.correct
                    };
                    if (lvl >= 3 && i % 2 === 0) newQ.text = "⚡ " + newQ.text;
                    if (lvl >= 4) newQ.text = "⭐ " + newQ.text + " ⭐";
                    if (lvl === 5 && i % 3 === 0) newQ.text = "🏆 FORCE MASTER: " + newQ.text;
                    levelQs.push(newQ);
                }
            }
            levelQs = shuffleArray(levelQs);
            levelsData.push(levelQs);
        }
    }
    buildGame();

    // ---------- GAME ENGINE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const optionsDiv = document.getElementById('optionsContainer');
    const nextBtn = document.getElementById('nextButton');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        const timeMap = {1: 90, 2: 80, 3: 70, 4: 60, 5: 50};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableAllOptions();
                nextBtn.disabled = true;
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to become a Force Master! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ONLY ${levelTimerSec} SECONDS! Feel the force — answer fast! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableAllOptions() {
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '⚡ RESTART FORCE CHALLENGE ⚡';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    function highlightCorrectAnswer(correctText) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = true;
            const rawText = btn.innerText.replace(/^[A-D]\.\s*/, '');
            if (rawText === correctText) {
                btn.classList.add('correct-highlight');
            }
        });
    }

    function handleAnswer(selected, correctAnswer, btnElement) {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) return;
        answerLocked = true;
        const isCorrect = (selected === correctAnswer);
        
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            btnElement.classList.add('correct-highlight');
            messageDiv.innerHTML = `✅ FORCE MASTER! +1 point! (${levelScore}/${TOTAL_QS}) | Time left: ${levelTimerSec}s`;
        } else {
            btnElement.classList.add('wrong-highlight');
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const txt = btn.innerText.replace(/^[A-D]\.\s*/, '');
                if (txt === correctAnswer) {
                    btn.classList.add('correct-highlight');
                }
            });
            messageDiv.innerHTML = `❌ NOT QUITE! Correct: "${correctAnswer}". Keep learning about the amazing world of forces! Score: ${levelScore}/${TOTAL_QS}`;
        }
        disableAllOptions();
        waitingForNext = true;
        nextBtn.disabled = false;
    }

    function loadCurrentQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const levelData = levelsData[currentLevel - 1];
        const q = levelData[currentQIndex];
        questionDiv.innerText = q.text;
        optionsDiv.innerHTML = '';
        
        const shuffledOps = shuffleArray([...q.options]);
        const prefixes = ['A', 'B', 'C', 'D'];
        shuffledOps.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}</span><span>${opt}</span>`;
            btn.addEventListener('click', () => handleAnswer(opt, q.correct, btn));
            optionsDiv.appendChild(btn);
        });
        
        answerLocked = false;
        waitingForNext = false;
        nextBtn.disabled = true;
        messageDiv.innerHTML = `💪 Level ${currentLevel} • Question ${currentQIndex+1}/30 • Force & Energy! Push, pull, and discover! ⏱️`;
    }

    function onNextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadCurrentQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                messageDiv.innerHTML = `🏆⚡💪✨ SPECTACULAR! You've mastered types of forces, their effects, uses, and importance in nature and daily life! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). You are a true Force Master! ✨💪⚡🏆`;
                disableAllOptions();
                nextBtn.disabled = true;
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉🎊 LEVEL ${currentLevel} COMPLETE! 🎊🎉 ${levelScore}/${TOTAL_QS} PASS (${Math.round(levelScore/TOTAL_QS*100)}%). Moving to LEVEL ${currentLevel+1}... ⚡💪`;
                disableAllOptions();
                nextBtn.disabled = true;
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadCurrentQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableAllOptions();
            nextBtn.disabled = true;
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect} correct). Press RESTART to become a Force Master! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadCurrentQuestion();
        nextBtn.addEventListener('click', onNextQuestion);
    }

    initGame();
</script>
</body>
</html>
