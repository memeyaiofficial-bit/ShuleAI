<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>CBC Grade 7 Social Studies: Ultimate Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a3c2c 0%, #0e2a1f 100%);
            font-family: system-ui, 'Segoe UI', 'Poppins', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 950px;
            background: #fef7e0;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,245,200,0.5) 2%, transparent 2.5%);
            background-size: 28px 28px;
            border-radius: 48px 48px 48px 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffcd7e;
            padding: 16px 18px;
            border-bottom: 5px solid #b97f3b;
            text-align: center;
        }

        .level-badge {
            background: #3c2a1f;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 60px;
            color: #ffeaac;
            font-weight: bold;
            font-size: clamp(0.8rem, 4vw, 1.2rem);
            box-shadow: inset 0 -1px 0 #5e3a22, 0 4px 8px rgba(0,0,0,0.2);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 12px;
            gap: 8px;
        }

        .score-box, .timer-box, .progress-box {
            background: #2e241d;
            padding: 6px 12px;
            border-radius: 40px;
            color: #ffefbf;
            font-weight: bold;
            font-size: clamp(0.7rem, 3.5vw, 1rem);
            backdrop-filter: blur(2px);
            flex: 1;
            text-align: center;
            white-space: nowrap;
        }

        .timer-box {
            background: #8b3c2c;
            font-family: monospace;
            font-size: clamp(1rem, 5vw, 1.5rem);
            font-weight: 800;
        }

        .question-area {
            padding: 18px 20px 20px;
        }

        .question-text {
            font-size: clamp(1rem, 5.5vw, 1.55rem);
            font-weight: 600;
            color: #2c2418;
            line-height: 1.4;
            background: #fff6e5;
            padding: 16px 18px;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #fff0cf, 0 8px 12px rgba(0,0,0,0.1);
            margin-bottom: 18px;
            word-break: break-word;
        }

        .voice-btn {
            background: #54b4b1;
            border: none;
            color: white;
            font-size: clamp(1rem, 5vw, 1.5rem);
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-weight: bold;
            box-shadow: 0 4px 0 #2f6b68;
            transition: 0.05s linear;
            width: auto;
            min-width: 160px;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2f6b68;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .option {
            background: #f2e5d2;
            border: 2px solid #cfbc9a;
            border-radius: 100px;
            padding: 14px 16px;
            font-size: clamp(0.85rem, 4vw, 1.05rem);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.08s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2a241c;
            touch-action: manipulation;
        }

        .option-letter {
            background: #b97f3b;
            width: 36px;
            height: 36px;
            min-width: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .option:active {
            background: #ffe2b5;
            transform: scale(0.98);
            border-color: #b97f3b;
        }

        .option.disabled-true, .option.disabled-true:active {
            opacity: 0.6;
            pointer-events: none;
            background: #ddd0bd;
            transform: none;
        }

        .correct-feedback {
            background: #388e3c;
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
            font-size: clamp(0.8rem, 3.8vw, 1rem);
        }

        .wrong-feedback {
            background: #c62828;
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
            font-size: clamp(0.8rem, 3.8vw, 1rem);
        }

        .next-btn {
            background: #ff914d;
            border: none;
            width: 100%;
            padding: 14px 12px;
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            font-weight: bold;
            border-radius: 60px;
            color: #2c1c0c;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 5px 0 #b45a2b;
            touch-action: manipulation;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b45a2b;
        }

        .feedback-message {
            margin-top: 12px;
            font-weight: bold;
            text-align: center;
        }

        .intro-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 16px;
        }

        .intro-card {
            background: linear-gradient(135deg, #fff3e0, #ffefcf);
            max-width: 550px;
            width: 100%;
            padding: 24px 20px 32px;
            border-radius: 56px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            border: 2px solid #ffcd94;
            animation: floatGlow 0.6s ease-out;
        }

        @keyframes floatGlow {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .intro-card h1 {
            font-size: clamp(1.6rem, 7vw, 2.3rem);
            color: #c25d2e;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #ffdd99;
        }

        .subject-badge {
            background: #2c6e4f;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            color: #ffefb9;
            font-weight: bold;
            font-size: clamp(0.8rem, 4vw, 1.1rem);
            margin: 10px 0;
        }

        .intro-text {
            font-size: clamp(0.85rem, 4vw, 1.05rem);
            line-height: 1.45;
            color: #2e3b2c;
            background: #fff7e8;
            padding: 14px;
            border-radius: 35px;
            margin: 15px 0;
        }

        .topics-highlight {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin: 15px 0;
        }

        .topic-chip {
            background: #ffb569;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: clamp(0.65rem, 3vw, 0.75rem);
            font-weight: bold;
            color: #2d2b1f;
        }

        .enter-btn {
            background: #e67e22;
            border: none;
            font-size: clamp(1.2rem, 6vw, 1.6rem);
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 60px;
            color: white;
            margin-top: 16px;
            cursor: pointer;
            box-shadow: 0 6px 0 #a04000;
            transition: 0.05s linear;
            width: 85%;
        }

        .enter-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #a04000;
        }

        .small-note {
            font-size: clamp(0.6rem, 3.2vw, 0.7rem);
            text-align: center;
            padding: 10px;
            background: #eeddbb;
            color: #5a3e28;
            border-radius: 30px;
            margin-top: 8px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #fff3e0;
            max-width: 380px;
            width: 90%;
            padding: 24px 20px;
            border-radius: 48px;
            text-align: center;
            box-shadow: 0 20px 35px black;
            border: 2px solid #ffcd7e;
        }

        .modal-card p {
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            margin: 12px 0;
        }

        .modal-card button {
            background: #2c6e4f;
            border: none;
            padding: 12px 20px;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            border-radius: 60px;
            color: white;
            margin-top: 18px;
            cursor: pointer;
            width: 90%;
            font-weight: bold;
        }

        @media (max-width: 550px) {
            body { padding: 8px; }
            .option { padding: 10px 12px; gap: 8px; }
            .option-letter { width: 32px; height: 32px; min-width: 32px; font-size: 1rem; }
            .stats { gap: 6px; }
            .voice-btn { min-width: 140px; padding: 8px 12px; }
        }
        @media (max-width: 380px) {
            .stats { flex-direction: column; align-items: stretch; }
        }
        button, .option, .next-btn, .enter-btn { cursor: pointer; user-select: none; }
        
        /* timer warning flash */
        .timer-warning {
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); background-color: #8b3c2c; }
            50% { transform: scale(1.05); background-color: #ff5722; }
            100% { transform: scale(1); background-color: #8b3c2c; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot" style="display: none;">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🌍 LEVEL 1 / 5</div>
        <div class="stats">
            <div class="score-box">⭐ SCORE: <span id="scoreValue">0</span> / <span id="totalQInLevel">40</span></div>
            <div class="timer-box">⏱️ <span id="timerSeconds">15</span> s</div>
            <div class="progress-box">📊 PROGRESS: <span id="progressCount">0</span>/<span id="totalQCountSpan">40</span></div>
        </div>
    </div>
    <div class="question-area">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION</button>
        <div class="question-text" id="questionText">Loading epic challenge...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <button class="next-btn" id="nextBtn">➡️ NEXT QUESTION</button>
        <div class="feedback-message" id="feedbackMsg"></div>
        <div class="small-note">✔️ 80% to pass level | 15 sec per question (counts down to zero)</div>
    </div>
</div>

<script>
    // ======================= SOCIAL STUDIES - 200 UNIQUE QUESTIONS =======================
    const topicsList = [
        "Human Origins", "Early Civilisations", "Slavery & Servitude",
        "Trade Developments", "Diversity & Relationships", "Peaceful Coexistence"
    ];
    
    function buildUniqueQuestionBank() {
        const bank = [];
        function addQ(topicIdx, text, optA, optB, optC, optD, correctText) {
            const options = [optA, optB, optC, optD];
            bank.push({
                topic: topicIdx,
                text: text,
                originalOptions: [...options],
                correctValue: correctText
            });
        }
        
        // TOPIC 0: HUMAN ORIGINS
        addQ(0, "Which continent is widely accepted as the cradle of humankind?", "Africa", "Asia", "Europe", "South America", "Africa");
        addQ(0, "What does 'bipedalism' refer to in early human evolution?", "Walking on two legs", "Using tools", "Living in caves", "Hunting in groups", "Walking on two legs");
        addQ(0, "The species 'Homo habilis' is known for which major innovation?", "Stone tool making", "Controlling fire", "Burial rituals", "Cave painting", "Stone tool making");
        addQ(0, "Which hominid is considered the first to migrate out of Africa?", "Homo erectus", "Homo sapiens", "Australopithecus", "Neanderthals", "Homo erectus");
        addQ(0, "The discovery of 'Lucy' (Australopithecus) happened in which country?", "Ethiopia", "Kenya", "Tanzania", "South Africa", "Ethiopia");
        addQ(0, "What is the significance of the Great Rift Valley?", "Rich fossil discoveries", "First agricultural tools", "Ancient trade route", "Birthplace of writing", "Rich fossil discoveries");
        addQ(0, "Which feature distinguished Homo sapiens from Neanderthals?", "Higher forehead and chin", "Larger brow ridges", "Shorter limbs", "More body hair", "Higher forehead and chin");
        addQ(0, "The Oldowan tool industry is associated with which early human?", "Homo habilis", "Homo erectus", "Homo neanderthalensis", "Homo floresiensis", "Homo habilis");
        addQ(0, "Which evidence suggests early humans had symbolic thinking?", "Cave art and beads", "Stone axes", "Bone needles", "Fire pits", "Cave art and beads");
        addQ(0, "Approximately when did modern humans (Homo sapiens) appear?", "300,000 years ago", "2 million years ago", "50,000 years ago", "10,000 years ago", "300,000 years ago");
        
        // TOPIC 1: EARLY CIVILISATIONS
        addQ(1, "Which ancient civilization developed the first known writing system (cuneiform)?", "Sumerians", "Egyptians", "Indus Valley", "Minoans", "Sumerians");
        addQ(1, "The Code of Hammurabi is famous for being one of the earliest what?", "Written legal codes", "Religious texts", "Medical guides", "Astronomical charts", "Written legal codes");
        addQ(1, "Which ancient people built the city of Machu Picchu?", "Incas", "Aztecs", "Mayas", "Olmecs", "Incas");
        addQ(1, "The Indus Valley Civilization was known for its advanced what?", "Urban planning and drainage", "Pyramid building", "Iron weapons", "Silk production", "Urban planning and drainage");
        addQ(1, "Which Pharaoh is known for the largest pyramid at Giza?", "Khufu", "Ramses II", "Tutankhamun", "Cleopatra", "Khufu");
        addQ(1, "The ancient Phoenicians were famous for their skill in:", "Maritime trade and alphabet", "Warfare", "Philosophy", "Sculpture", "Maritime trade and alphabet");
        addQ(1, "Which civilization built the Hanging Gardens of Babylon (one of Seven Wonders)?", "Babylonians", "Assyrians", "Persians", "Greeks", "Babylonians");
        addQ(1, "The Mandate of Heaven was a concept in which ancient civilization?", "China (Zhou dynasty)", "India (Maurya)", "Persia", "Greece", "China (Zhou dynasty)");
        addQ(1, "Which ancient African kingdom was known for its wealth and trade in gold?", "Kingdom of Ghana", "Great Zimbabwe", "Axum", "Kush", "Kingdom of Ghana");
        addQ(1, "The ancient Greeks invented which form of government?", "Democracy", "Oligarchy", "Monarchy", "Theocracy", "Democracy");
        
        // TOPIC 2: SLAVERY AND SERVITUDE
        addQ(2, "The term 'chattel slavery' means:", "Enslaved people treated as property", "Temporary servitude", "Religious slavery", "Military slavery", "Enslaved people treated as property");
        addQ(2, "Which European country was the first to engage in transatlantic slave trade?", "Portugal", "Spain", "England", "Netherlands", "Portugal");
        addQ(2, "The Middle Passage refers to:", "The journey of enslaved Africans across Atlantic", "A trade route in Asia", "A pilgrimage route", "A diplomatic mission", "The journey of enslaved Africans across Atlantic");
        addQ(2, "Which enslaved person led a famous rebellion in the United States in 1831?", "Nat Turner", "Frederick Douglass", "Harriet Tubman", "Denmark Vesey", "Nat Turner");
        addQ(2, "The abolition of slavery in the British Empire occurred in which year?", "1833", "1776", "1865", "1807", "1833");
        addQ(2, "What was the 'Underground Railroad'?", "Network helping enslaved people escape", "A real railway", "A secret tunnel system", "A political party", "Network helping enslaved people escape");
        addQ(2, "Which ancient empire had slaves called 'helots'?", "Sparta", "Rome", "Athens", "Persia", "Sparta");
        addQ(2, "The Thirteenth Amendment to the U.S. Constitution did what?", "Abolished slavery", "Gave voting rights", "Granted citizenship", "Limited presidents", "Abolished slavery");
        addQ(2, "Who wrote the anti-slavery novel 'Uncle Tom's Cabin'?", "Harriet Beecher Stowe", "Frederick Douglass", "Sojourner Truth", "William Lloyd Garrison", "Harriet Beecher Stowe");
        addQ(2, "Indentured servitude differed from slavery because it was:", "Temporary and contractual", "Lifelong", "Based on race", "Voluntary only", "Temporary and contractual");
        
        // TOPIC 3: TRADE DEVELOPMENTS
        addQ(3, "Which metal was first used as a standard medium of trade around 700 BCE?", "Gold", "Silver", "Bronze", "Copper", "Gold");
        addQ(3, "The Lydians are credited with inventing:", "Coined money", "Paper currency", "Banking", "Checks", "Coined money");
        addQ(3, "What was the main trade good on the Silk Road from China?", "Silk", "Spices", "Gold", "Horses", "Silk");
        addQ(3, "Cowrie shells were used as currency in which regions?", "Africa and Asia", "Europe", "Americas", "Australia", "Africa and Asia");
        addQ(3, "Which European country introduced the 'dollar' as a trade coin?", "Spain", "England", "France", "Portugal", "Spain");
        addQ(3, "The gold-salt trade was vital for which ancient empire?", "Ghana Empire", "Roman Empire", "Persian Empire", "Mongol Empire", "Ghana Empire");
        addQ(3, "What replaced barter system in advanced economies?", "Money", "Credit cards", "Digital currency", "Promissory notes", "Money");
        addQ(3, "The first paper money was issued in which dynasty of China?", "Song Dynasty", "Tang Dynasty", "Ming Dynasty", "Han Dynasty", "Song Dynasty");
        addQ(3, "Which commodity was known as 'white gold' in medieval trade?", "Salt", "Sugar", "Cotton", "Wool", "Salt");
        addQ(3, "The establishment of banks during the Renaissance allowed:", "Deposits and loans", "Only storage", "Gold mining", "Stock markets", "Deposits and loans");
        
        // TOPIC 4: DIVERSITY AND RELATIONSHIPS
        addQ(4, "Which term means respecting and valuing differences in people?", "Diversity", "Prejudice", "Segregation", "Discrimination", "Diversity");
        addQ(4, "Active listening requires:", "Full attention and feedback", "Planning a response", "Nodding only", "Silence", "Full attention and feedback");
        addQ(4, "What is empathy?", "Understanding others' feelings", "Feeling sorry for yourself", "Indifference", "Competition", "Understanding others' feelings");
        addQ(4, "Conflict resolution often involves:", "Compromise and dialogue", "Avoidance", "Aggression", "Blaming", "Compromise and dialogue");
        addQ(4, "Stereotypes can lead to:", "Unfair judgments", "Better understanding", "Stronger bonds", "Cultural pride", "Unfair judgments");
        addQ(4, "What is the best way to build positive interpersonal relationships?", "Respect and trust", "Competition", "Isolation", "Criticism", "Respect and trust");
        addQ(4, "Inclusive education means:", "All students learn together", "Separate classes", "Only gifted programs", "Online only", "All students learn together");
        addQ(4, "Which action demonstrates cultural humility?", "Learning about other cultures", "Mocking differences", "Avoiding others", "Forcing your beliefs", "Learning about other cultures");
        addQ(4, "Assertive communication is characterized by:", "Clear and respectful expression", "Aggressive shouting", "Passive silence", "Manipulation", "Clear and respectful expression");
        addQ(4, "Celebrating different festivals in school promotes:", "Unity in diversity", "Competition", "Confusion", "Isolation", "Unity in diversity");
        
        // TOPIC 5: PEACEFUL COEXISTENCE
        addQ(5, "The philosophy of Ubuntu originates from which region?", "Southern Africa", "South America", "Asia", "Europe", "Southern Africa");
        addQ(5, "What does 'Ubuntu' roughly mean?", "I am because we are", "Survival of fittest", "Individual power", "Divine right", "I am because we are");
        addQ(5, "Which international organization was founded to maintain world peace?", "United Nations", "World Bank", "IMF", "WTO", "United Nations");
        addQ(5, "Interfaith dialogue aims to:", "Promote understanding between religions", "Convert others", "Eliminate religion", "Start debates", "Promote understanding between religions");
        addQ(5, "Peaceful coexistence rejects:", "Violence and aggression", "Diplomacy", "Negotiation", "Respect", "Violence and aggression");
        addQ(5, "Which famous leader promoted nonviolent resistance in India?", "Mahatma Gandhi", "Jawaharlal Nehru", "Subhas Bose", "Ambedkar", "Mahatma Gandhi");
        addQ(5, "The Golden Rule 'treat others as you want to be treated' appears in:", "Many religions and cultures", "Only Christianity", "Only Islam", "Only Buddhism", "Many religions and cultures");
        addQ(5, "Which treaty ended World War I but also caused future conflict?", "Treaty of Versailles", "Treaty of Paris", "Treaty of Tordesillas", "Treaty of Rome", "Treaty of Versailles");
        addQ(5, "What is 'conflict transformation'?", "Turning conflict into positive change", "Winning at all costs", "Avoiding conflict", "Military victory", "Turning conflict into positive change");
        addQ(5, "The concept of 'Ahimsa' (non-violence) is central to which religions?", "Jainism, Buddhism, Hinduism", "Only Christianity", "Islam and Judaism", "Zoroastrianism", "Jainism, Buddhism, Hinduism");
        
        while(bank.length < 200) {
            addQ(bank.length % 6, "Which value promotes harmony among diverse groups?", "Mutual respect", "Exclusion", "Intolerance", "Discrimination", "Mutual respect");
        }
        return bank.slice(0, 200);
    }
    
    const masterRaw = buildUniqueQuestionBank();
    
    function getRandomizedQuestion(questionData) {
        const options = [...questionData.originalOptions];
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        const newCorrectIndex = options.findIndex(opt => opt === questionData.correctValue);
        return {
            text: questionData.text,
            options: options,
            correctIndex: newCorrectIndex,
            topic: questionData.topic
        };
    }
    
    let allShuffled = [...masterRaw];
    for (let i = allShuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allShuffled[i], allShuffled[j]] = [allShuffled[j], allShuffled[i]];
    }
    const questionsPerLevel = [];
    for (let lvl = 0; lvl < 5; lvl++) {
        questionsPerLevel.push(allShuffled.slice(lvl * 40, lvl * 40 + 40));
    }
    
    // Game state
    let currentLevel = 0, currentQIndex = 0, score = 0;
    const correctNeededToPass = 32;
    let answered = false, waitingForNext = false, timerInterval = null, timeLeft = 15;
    let currentQuestionObj = null;
    
    // DOM elements
    const gameContainer = document.getElementById("gameRoot");
    const levelDisplay = document.getElementById("levelDisplay");
    const scoreSpan = document.getElementById("scoreValue");
    const totalQInLevelSpan = document.getElementById("totalQInLevel");
    const timerSecondsSpan = document.getElementById("timerSeconds");
    const progressCountSpan = document.getElementById("progressCount");
    const totalQCountSpan = document.getElementById("totalQCountSpan");
    const questionTextDiv = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const nextBtn = document.getElementById("nextBtn");
    const feedbackMsgDiv = document.getElementById("feedbackMsg");
    const speakBtn = document.getElementById("speakBtn");
    
    function speakText(msg, rate=0.9) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(msg);
            utt.lang = 'en-US';
            utt.rate = rate;
            window.speechSynthesis.speak(utt);
        }
    }
    function playCorrectVoice() { speakText("Excellent! That is correct! Well done!", 0.95); }
    function playWrongVoice() { speakText("Oops! That is incorrect. Keep learning!", 0.95); }
    function playTimeUpVoice() { speakText("Time is up! Let's move to the next question.", 0.9); }
    
    function updateUIStats() {
        let total = questionsPerLevel[currentLevel].length;
        totalQInLevelSpan.innerText = total;
        scoreSpan.innerText = score;
        progressCountSpan.innerText = currentQIndex;
        totalQCountSpan.innerText = total;
        levelDisplay.innerText = `🌍 LEVEL ${currentLevel+1}/5 | Need ${correctNeededToPass} correct`;
    }
    
    function stopTimer() { 
        if(timerInterval) { 
            clearInterval(timerInterval); 
            timerInterval = null; 
        }
    }
    
    function startTimerForCurrent() {
        if(timerInterval) stopTimer();
        timeLeft = 15;
        timerSecondsSpan.innerText = timeLeft;
        timerSecondsSpan.style.color = "#ffefbf";
        
        timerInterval = setInterval(() => {
            if(!waitingForNext && !answered) {
                if(timeLeft <= 1) {
                    // Time reaches zero
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timerSecondsSpan.innerText = "0";
                    // Flash effect
                    timerSecondsSpan.style.color = "#ffaa00";
                    if(!answered) {
                        handleTimeout();
                    }
                } else {
                    timeLeft--;
                    timerSecondsSpan.innerText = timeLeft;
                    // Warning at 3 seconds
                    if(timeLeft <= 3) {
                        timerSecondsSpan.style.color = "#ffaa66";
                        timerSecondsSpan.classList.add("timer-warning");
                        setTimeout(() => timerSecondsSpan.classList.remove("timer-warning"), 300);
                    } else {
                        timerSecondsSpan.style.color = "#ffefbf";
                    }
                }
            }
        }, 1000);
    }
    
    function handleTimeout() {
        if(answered) return;
        answered = true;
        waitingForNext = true;
        // Disable all option clicks
        document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled-true'));
        const correctAns = currentQuestionObj.options[currentQuestionObj.correctIndex];
        feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">⏰ TIME'S UP! (0 seconds left) Correct answer: ${correctAns}</div>`;
        playTimeUpVoice();
        stopTimer();
    }
    
    function loadQuestion() {
        answered = false;
        waitingForNext = false;
        stopTimer();
        const levelQs = questionsPerLevel[currentLevel];
        if(currentQIndex >= levelQs.length) { 
            checkLevelCompletion(); 
            return; 
        }
        currentQuestionObj = getRandomizedQuestion(levelQs[currentQIndex]);
        questionTextDiv.innerText = currentQuestionObj.text;
        optionsContainer.innerHTML = "";
        const letters = ["A", "B", "C", "D"];
        currentQuestionObj.options.forEach((opt, idx) => {
            const optDiv = document.createElement("div");
            optDiv.className = "option";
            optDiv.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt}</span>`;
            optDiv.addEventListener("click", () => { 
                if(!answered && !waitingForNext) evaluateAnswer(idx); 
            });
            optionsContainer.appendChild(optDiv);
        });
        feedbackMsgDiv.innerHTML = "";
        nextBtn.innerText = "➡️ NEXT QUESTION";
        nextBtn.disabled = false;
        updateUIStats();
        startTimerForCurrent();
    }
    
    function evaluateAnswer(selectedIdx) {
        if(answered) return;
        answered = true;
        waitingForNext = true;
        stopTimer();
        const isCorrect = (selectedIdx === currentQuestionObj.correctIndex);
        if(isCorrect) {
            score++;
            feedbackMsgDiv.innerHTML = `<div class="correct-feedback">✅ CORRECT! +1 point (${currentQuestionObj.options[selectedIdx]})</div>`;
            playCorrectVoice();
        } else {
            feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">❌ WRONG! Correct: ${currentQuestionObj.options[currentQuestionObj.correctIndex]}</div>`;
            playWrongVoice();
        }
        document.querySelectorAll('.option').forEach(opt => opt.classList.add('disabled-true'));
        scoreSpan.innerText = score;
    }
    
    function nextQuestion() {
        if(!waitingForNext && !answered) {
            feedbackMsgDiv.innerHTML = `<div class="wrong-feedback">⚠️ Please answer the question first!</div>`;
            return;
        }
        currentQIndex++;
        if(currentQIndex < questionsPerLevel[currentLevel].length) {
            loadQuestion();
        } else {
            checkLevelCompletion();
        }
    }
    
    function checkLevelCompletion() {
        let percent = (score / questionsPerLevel[currentLevel].length) * 100;
        if(score >= correctNeededToPass) {
            if(currentLevel+1 < 5) {
                showModal(`✨ LEVEL ${currentLevel+1} COMPLETE! ✨<br>Score: ${score}/40 (${Math.floor(percent)}%)<br>🔓 UNLOCKED LEVEL ${currentLevel+2}!`, true);
            } else {
                showModal(`🏆 GRAND VICTORY! 🏆<br>You mastered all 5 levels!<br>Final Score: ${score}/40<br>YOU ARE A SOCIAL STUDIES LEGEND!`, false);
            }
        } else {
            showModal(`❌ LEVEL FAILED ❌<br>You got ${score}/40 (${Math.floor(percent)}%)<br>Need 80% (${correctNeededToPass} correct).<br>Restarting level...`, false);
        }
    }
    
    function showModal(msg, advance) {
        stopTimer();
        waitingForNext = true;
        const modal = document.createElement("div");
        modal.className = "modal-overlay";
        modal.innerHTML = `<div class="modal-card"><p>${msg}</p><button id="modalBtn">${advance ? "🚀 NEXT LEVEL 🚀" : "🔄 TRY AGAIN"}</button></div>`;
        document.body.appendChild(modal);
        document.getElementById("modalBtn").addEventListener("click", () => {
            modal.remove();
            if(advance && currentLevel+1 < 5) { 
                currentLevel++; 
                resetLevel(); 
            } else if(!advance) { 
                resetLevel(); 
            } else { 
                currentLevel = 0; 
                resetLevel(); 
            }
        });
    }
    
    function resetLevel() { 
        score = 0; 
        currentQIndex = 0; 
        answered = false; 
        waitingForNext = false; 
        stopTimer(); 
        updateUIStats(); 
        loadQuestion(); 
    }
    
    function speakCurrentQuestion() { 
        if(currentQuestionObj) speakText(currentQuestionObj.text, 0.9); 
        else speakText("Question loading"); 
    }
    
    speakBtn.addEventListener("click", speakCurrentQuestion);
    nextBtn.addEventListener("click", nextQuestion);
    
    function showIntro() {
        const intro = document.createElement("div");
        intro.className = "intro-modal";
        intro.innerHTML = `
            <div class="intro-card">
                <h1>📜 SOCIAL STUDIES 📜</h1>
                <div class="subject-badge">⭐ GRADE 7 CHALLENGE ⭐</div>
                <div class="intro-text">
                    🧭 <strong>Welcome, Young Historian & Peacemaker!</strong><br><br>
                    ⭐ <strong>200 UNIQUE QUESTIONS</strong> — NO REPETITION!<br>
                    🎲 <strong>Answers SHUFFLE every time</strong> — no cheating!<br>
                    🔥 5 Levels · 40 Qs each · 80% to pass<br>
                    🔊 Voice feedback for correct/wrong/time-up<br>
                    ⏱️ <strong>15-second timer counts down to ZERO</strong> — be quick!<br><br>
                    🌟 <em>Ready for the ultimate challenge?</em>
                </div>
                <div class="topics-highlight">${topicsList.map(t => `<span class="topic-chip">📖 ${t}</span>`).join('')}</div>
                <button class="enter-btn" id="startBtn">🚀 BEGIN JOURNEY 🚀</button>
            </div>
        `;
        document.body.appendChild(intro);
        document.getElementById("startBtn").addEventListener("click", () => { 
            intro.remove(); 
            gameContainer.style.display = "block"; 
            initGame(); 
        });
    }
    
    function initGame() { 
        currentLevel = 0; 
        score = 0; 
        currentQIndex = 0; 
        answered = false; 
        waitingForNext = false; 
        stopTimer(); 
        updateUIStats(); 
        loadQuestion(); 
    }
    
    showIntro();
</script>
</body>
</html>
