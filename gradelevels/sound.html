<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bobo's Sound Explorers - Grade 1 CBC | Sounds, Warnings & Safety</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2c3e50 0%, #1a2632 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffaf2;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffb84d;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #e09d32;
        }

        .level-badge, .score-badge, .timer-box {
            background: #2e241f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffecb3;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: inset 0 -2px 0 #5a3e2e, 0 4px 8px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #9b4b1f;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .story-area {
            background: #fff1df;
            padding: 25px 20px 15px 20px;
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #2c3e50;
            border-bottom: 3px dashed #f7d98c;
            min-height: 130px;
        }

        .question-area {
            padding: 25px 20px 20px;
            background: #fff9ef;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .speaker-btn {
            background: #2c7a47;
            border: none;
            font-size: 1.6rem;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1a5a34;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speaker-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a5a34;
        }

        .narrative-question {
            background: #f5ebd2;
            border-radius: 60px;
            padding: 20px 18px;
            font-size: 1.6rem;
            text-align: center;
            color: #2c4727;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.05);
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .answer-input-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #answerInput {
            flex: 3;
            min-width: 180px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-family: inherit;
            border-radius: 60px;
            border: 3px solid #c8b27a;
            background: white;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        #answerInput:focus {
            border-color: #f3a712;
            box-shadow: 0 0 0 3px rgba(243,167,18,0.3);
        }

        .btn-check {
            background: #f3a712;
            border: none;
            padding: 12px 28px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 60px;
            color: #2c2416;
            cursor: pointer;
            box-shadow: 0 5px 0 #b4621a;
        }

        .btn-check:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b4621a;
        }

        .feedback {
            background: #e9e0cb;
            border-radius: 50px;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            margin-top: 10px;
            min-height: 85px;
            font-weight: bold;
        }

        .next-level-msg {
            background: #cae3b5;
            text-align: center;
            padding: 12px;
            font-size: 1.2rem;
            border-radius: 40px;
            margin-top: 15px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .narrative-question { font-size: 1.3rem; }
            .story-area { font-size: 1.2rem; }
            .level-badge, .score-badge, .timer-box { font-size: 0.9rem; padding: 5px 12px; }
            .btn-check { padding: 10px 18px; font-size: 1.1rem; }
            .speaker-btn { font-size: 1.3rem; padding: 6px 12px; }
            #answerInput { font-size: 1rem; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">Level: 1</div>
        <div class="score-badge" id="scoreDisplay">Score: 0 / 40</div>
        <div class="timer-box" id="timerDisplay">⏱️ 40s</div>
    </div>
    <div class="story-area" id="storyArea">
        🔊🎵 Bobo's Sound Explorers! Learn about sounds, warnings, loud noises & safety.
    </div>
    <div class="question-area">
        <div class="question-header">
            <div class="narrative-question" id="questionText">
                Question will appear here...
            </div>
            <button class="speaker-btn" id="speakQuestionBtn">🔊 Read Question</button>
        </div>
        <div class="answer-input-area">
            <input type="text" id="answerInput" placeholder="Write your answer here..." autocomplete="off">
            <button class="btn-check" id="submitBtn">✅ Check Answer</button>
        </div>
        <div class="feedback" id="feedbackMsg">
            🎤 Bobo will help you! Type the correct answer. Click the speaker to hear the question.
        </div>
        <div id="nextLevelMsg" class="next-level-msg"></div>
    </div>
</div>

<script>
    // ---------- ENGLISH VOICE OUTPUT ----------
    function speakEnglish(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        utterance.volume = 1;
        window.speechSynthesis.speak(utterance);
    }

    function readCurrentQuestion() {
        if (!allowAnswer) {
            speakEnglish("Wait, this question is already answered. Next question coming soon.");
            return;
        }
        const qData = currentQuestions[currentQuestionIndex];
        if (qData) speakEnglish(qData.text);
        else speakEnglish("No question at the moment.");
    }

    // ---------- QUESTION BANK: Sounds Around Us, Objects, Warning, Loud Sounds, Dangers, Obeying ----------
    function generateQuestionsForLevel(level) {
        const questions = [];
        
        // SOUNDS AROUND US (nature, animals, daily life)
        const soundsAround = [
            { q: "The sound a dog makes is '______'.", a: "woof" },
            { q: "The sound a cat makes is '______'.", a: "meow" },
            { q: "The sound a bird makes is '______'.", a: "tweet" },
            { q: "The sound of rain falling is '______'.", a: "pitter patter" },
            { q: "The sound of wind blowing is '______'.", a: "whoosh" },
            { q: "The sound of thunder is a loud ______.", a: "boom" },
            { q: "The sound of a bee flying is '______'.", a: "buzz" },
            { q: "The sound of a clock ticking is '______'.", a: "tick tock" },
            { q: "The sound of footsteps is '______'.", a: "stomp" },
            { q: "The sound of leaves rustling is '______'.", a: "rustle" }
        ];
        
        // SOUNDS FROM OBJECTS
        const objectSounds = [
            { q: "A bell makes the sound '______'.", a: "ding dong" },
            { q: "A drum makes the sound '______'.", a: "boom boom" },
            { q: "A whistle makes a high-pitched ______ sound.", a: "peep" },
            { q: "A car horn makes the sound '______'.", a: "honk" },
            { q: "A doorbell makes the sound '______'.", a: "ring" },
            { q: "A telephone rings with a '______' sound.", a: "ring ring" },
            { q: "A hammer hitting a nail makes a '______' sound.", a: "bang" },
            { q: "Scissors cutting paper make a '______' sound.", a: "snip" },
            { q: "A pencil writing on paper makes a '______' sound.", a: "scratch" },
            { q: "A bouncing ball makes a '______' sound.", a: "bounce" }
        ];
        
        // WARNING SOUNDS
        const warningSounds = [
            { q: "A fire alarm makes a loud ______ sound to warn people.", a: "beep" },
            { q: "An ambulance siren goes '______'.", a: "wee woo" },
            { q: "A police car siren makes a ______ sound.", a: "wail" },
            { q: "A smoke detector beeps when there is ______.", a: "fire" },
            { q: "A school bell rings to warn that ______ is starting.", a: "class" },
            { q: "A car's horn warns other drivers of ______.", a: "danger" },
            { q: "A train horn blows to warn people on the ______.", a: "tracks" },
            { q: "A bicycle bell rings to warn ______ to move aside.", a: "pedestrians" },
            { q: "A warning sound tells us to be ______.", a: "careful" },
            { q: "A smoke alarm warns us to ______ the building.", a: "leave" }
        ];
        
        // SOURCES OF LOUD SOUNDS
        const loudSources = [
            { q: "A loud sound comes from a ______ at a concert.", a: "speaker" },
            { q: "A jet airplane makes a very ______ sound.", a: "loud" },
            { q: "A firecracker makes a loud '______' sound.", a: "bang" },
            { q: "A construction machine like a jackhammer is very ______.", a: "noisy" },
            { q: "A loudspeaker at a stadium makes ______ sounds.", a: "loud" },
            { q: "A gunshot makes a very loud ______ sound.", a: "explosive" },
            { q: "A rocket launch makes a deafening ______.", a: "roar" },
            { q: "A chainsaw cutting wood makes a loud ______ sound.", a: "buzzing" },
            { q: "A loud party can have ______ music.", a: "loud" },
            { q: "A thunderclap is a very ______ sound from the sky.", a: "loud" }
        ];
        
        // DANGERS OF LOUD SOUNDS
        const dangers = [
            { q: "Loud sounds can hurt our ______.", a: "ears" },
            { q: "Listening to very loud music can cause ______ loss.", a: "hearing" },
            { q: "Loud noises can give you a ______.", a: "headache" },
            { q: "Very loud sounds can make it hard to ______.", a: "sleep" },
            { q: "Loud sounds can make people feel ______.", a: "scared" },
            { q: "Protect your ears by wearing ______ plugs.", a: "ear" },
            { q: "If a sound is too loud, you should cover your ______.", a: "ears" },
            { q: "Loud sounds can damage the tiny hairs inside your ______.", a: "ear" },
            { q: "Being near loud sounds for a long time can cause permanent ______ loss.", a: "hearing" },
            { q: "Loud toys can be ______ for children's ears.", a: "dangerous" }
        ];
        
        // OBEYING WARNING SOUNDS
        const obeying = [
            { q: "When you hear a fire alarm, you should ______ the building.", a: "leave" },
            { q: "When you hear a car horn, you should look ______.", a: "both ways" },
            { q: "If you hear a warning siren, you should find a ______ place.", a: "safe" },
            { q: "When the school bell rings, you should go to ______.", a: "class" },
            { q: "If you hear a smoke detector, you should tell an ______.", a: "adult" },
            { q: "When a train horn blows, you should stay off the ______.", a: "tracks" },
            { q: "Obeying warning sounds can save your ______.", a: "life" },
            { q: "When you hear a warning sound, you should not ______.", a: "ignore" },
            { q: "If an ambulance siren is coming, you should move ______.", a: "aside" },
            { q: "Warning sounds are there to keep us ______.", a: "safe" }
        ];
        
        const allTopics = [...soundsAround, ...objectSounds, ...warningSounds, ...loudSources, ...dangers, ...obeying];
        
        for (let i = 1; i <= 40; i++) {
            let idx = (i * level + i * 3) % allTopics.length;
            let item = allTopics[idx];
            let qText = item.q;
            let correctAnswer = item.a;
            
            // Narrative variety based on level
            if (level >= 2 && i % 5 === 0) {
                qText = "Bobo hears a dog barking outside. The dog says '______'.";
                correctAnswer = "woof";
            }
            if (level >= 3 && i % 6 === 0) {
                qText = "When Bobo hears the fire alarm, he knows he must ______ the building quickly and safely.";
                correctAnswer = "leave";
            }
            if (level >= 4 && i % 7 === 0) {
                qText = "A very loud jet airplane can hurt Bobo's ______ if he is too close.";
                correctAnswer = "ears";
            }
            if (i % 8 === 0) {
                qText = "The ambulance goes '______' as it rushes to help people.";
                correctAnswer = "wee woo";
            }
            if (i % 9 === 0) {
                qText = "To protect his ears from loud sounds, Bobo wears ear ______.";
                correctAnswer = "plugs";
            }
            if (i % 11 === 0) {
                qText = "When Bobo hears a warning sound, he knows he must be ______ and pay attention.";
                correctAnswer = "careful";
            }
            questions.push({ text: qText, answer: correctAnswer.trim().toLowerCase() });
        }
        return questions.slice(0, 40);
    }
    
    // Preload 5 levels
    const levelsData = {
        1: generateQuestionsForLevel(1),
        2: generateQuestionsForLevel(2),
        3: generateQuestionsForLevel(3),
        4: generateQuestionsForLevel(4),
        5: generateQuestionsForLevel(5)
    };
    
    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestionIndex = 0;
    let currentQuestions = [...levelsData[1]];
    let scoreCorrect = 0;
    let totalQuestionsInLevel = 40;
    let timerInterval = null;
    let timeLeft = 40;
    let isWaitingForNext = false;
    let allowAnswer = true;
    let nextLevelUnlocked = false;
    
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const storyAreaDiv = document.getElementById('storyArea');
    const questionTextDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedbackMsgDiv = document.getElementById('feedbackMsg');
    const nextLevelMsgDiv = document.getElementById('nextLevelMsg');
    const speakBtn = document.getElementById('speakQuestionBtn');
    
    function updateScoreUI() {
        scoreDisplay.innerText = `Score: ${scoreCorrect} / ${totalQuestionsInLevel}`;
    }
    
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }
    
    function startTimer() {
        stopTimer();
        if (!allowAnswer) return;
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
        timerInterval = setInterval(() => {
            if (!allowAnswer) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (allowAnswer) {
                    allowAnswer = false;
                    timerDisplaySpan.innerText = `⏱️ 0s`;
                    const correctAns = currentQuestions[currentQuestionIndex].answer;
                    speakEnglish(`Time is up! The correct answer is ${correctAns}.`);
                    feedbackMsgDiv.innerHTML = `⏰ Time's up! Correct answer: <strong>${correctAns}</strong>. Moving to next question.`;
                    moveToNextQuestionAfterDelay();
                }
            } else {
                timeLeft--;
                timerDisplaySpan.innerText = `⏱️ ${timeLeft}s`;
            }
        }, 1000);
    }
    
    function moveToNextQuestionAfterDelay() {
        if (isWaitingForNext) return;
        isWaitingForNext = true;
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsInLevel) {
                resetForNewQuestion();
            } else {
                endOfLevel();
            }
        }, 2000);
    }
    
    function resetForNewQuestion() {
        isWaitingForNext = false;
        allowAnswer = true;
        stopTimer();
        const qData = currentQuestions[currentQuestionIndex];
        questionTextDiv.innerText = qData.text;
        answerInput.value = '';
        feedbackMsgDiv.innerHTML = "🎤 Write your answer! Click the speaker to hear the question again.";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        startTimer();
        updateStoryNarrative();
    }
    
    function updateStoryNarrative() {
        let levelDesc = "";
        if (currentLevel === 1) levelDesc = "Level 1: What sounds do we hear every day? Animals, nature, and objects!";
        else if (currentLevel === 2) levelDesc = "Level 2: Sounds from objects like bells, drums, and whistles!";
        else if (currentLevel === 3) levelDesc = "Level 3: Warning sounds! Fire alarms, sirens, and horns keep us safe!";
        else if (currentLevel === 4) levelDesc = "Level 4: Loud sounds and their dangers. Protect your ears!";
        else levelDesc = "Level 5: Final challenge! Obey warning sounds and stay safe!";
        const reqPass = Math.ceil(totalQuestionsInLevel * 0.8);
        storyAreaDiv.innerHTML = `📘 ${levelDesc} | Question ${currentQuestionIndex+1}/${totalQuestionsInLevel}. Need at least ${reqPass} correct to proceed. ⏱️ 40s each.`;
    }
    
    function endOfLevel() {
        stopTimer();
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        const required = Math.ceil(totalQuestionsInLevel * 0.8);
        const passed = (scoreCorrect >= required);
        
        if (passed) {
            if (currentLevel === 5) {
                feedbackMsgDiv.innerHTML = "🎉🏆 AMAZING! You completed all 5 levels! Bobo gives you the Sound Safety Champion Medal! 🏆🎉";
                speakEnglish("Congratulations! You finished all five levels. You are a champion of sounds, warning sounds, and sound safety! Always listen to warning sounds and protect your ears!");
                storyAreaDiv.innerHTML = "🏁 GAME COMPLETE! Bobo is proud of you! You know all about sounds, loud noises, dangers, and how to stay safe! 🔊🎵🛡️";
                nextLevelMsgDiv.innerHTML = "✨ YOU WIN! Refresh the page to play again ✨";
                return;
            } else {
                nextLevelUnlocked = true;
                feedbackMsgDiv.innerHTML = `🎉 You passed! Score: ${scoreCorrect}/${totalQuestionsInLevel} (≥${required}). Moving to Level ${currentLevel+1}! 🎉`;
                speakEnglish(`Congratulations! You passed level ${currentLevel}. Now moving to level ${currentLevel+1}. Keep learning about sounds and safety!`);
                nextLevelMsgDiv.innerHTML = "";
                const nextBtn = document.createElement('button');
                nextBtn.innerText = `🔓 Go to Level ${currentLevel+1}`;
                nextBtn.className = "btn-check";
                nextBtn.style.background = "#4caf50";
                nextBtn.style.marginTop = "10px";
                nextBtn.onclick = () => {
                    currentLevel++;
                    loadLevel(currentLevel);
                };
                nextLevelMsgDiv.appendChild(nextBtn);
                return;
            }
        } else {
            feedbackMsgDiv.innerHTML = `😭 Oops! You didn't reach 80%. Score: ${scoreCorrect}/${totalQuestionsInLevel}. Need ${required}. Try Level ${currentLevel} again.`;
            speakEnglish(`Oh no! You need at least 80 percent to pass. You have ${scoreCorrect} out of ${totalQuestionsInLevel}. Please try level ${currentLevel} again.`);
            nextLevelMsgDiv.innerHTML = "";
            const retryBtn = document.createElement('button');
            retryBtn.innerText = `🔄 Retry Level ${currentLevel}`;
            retryBtn.className = "btn-check";
            retryBtn.style.background = "#ff9800";
            retryBtn.onclick = () => {
                loadLevel(currentLevel);
            };
            nextLevelMsgDiv.appendChild(retryBtn);
            return;
        }
    }
    
    function loadLevel(level) {
        currentLevel = level;
        currentQuestions = [...levelsData[level]];
        currentQuestionIndex = 0;
        scoreCorrect = 0;
        totalQuestionsInLevel = 40;
        allowAnswer = true;
        nextLevelUnlocked = false;
        isWaitingForNext = false;
        stopTimer();
        levelDisplay.innerText = `Level: ${currentLevel}`;
        updateScoreUI();
        const firstQ = currentQuestions[0];
        questionTextDiv.innerText = firstQ.text;
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        feedbackMsgDiv.innerHTML = "🎤 Bobo is waiting! Type your answer. Click the speaker to hear the question.";
        nextLevelMsgDiv.innerHTML = "";
        timeLeft = 40;
        timerDisplaySpan.innerText = `⏱️ 40s`;
        updateStoryNarrative();
        startTimer();
    }
    
    function checkAnswer() {
        if (!allowAnswer) return;
        const userAnswerRaw = answerInput.value.trim().toLowerCase();
        if (userAnswerRaw === "") {
            feedbackMsgDiv.innerHTML = "🔊 Please write an answer! Bobo is waiting.";
            speakEnglish("Please write your answer.");
            return;
        }
        const currentQ = currentQuestions[currentQuestionIndex];
        const correctAns = currentQ.answer.toLowerCase();
        const normalizedUser = userAnswerRaw.replace(/\s+/g, ' ').trim();
        const normalizedCorrect = correctAns.replace(/\s+/g, ' ').trim();
        let isCorrect = (normalizedUser === normalizedCorrect);
        
        // Forgiving variations for sound words and common answers
        if (!isCorrect) {
            const forgiving = {
                "woof": ["bark", "ruff", "bow wow"],
                "meow": ["miaow", "meow meow", "cat sound"],
                "tweet": ["chirp", "sing", "tweet tweet"],
                "pitter patter": ["drip drop", "rain sound", "tap tap"],
                "whoosh": ["swish", "wind sound"],
                "boom": ["thunder", "loud bang", "crash"],
                "buzz": ["buzzing", "bee sound"],
                "tick tock": ["tick", "clock sound"],
                "stomp": ["footsteps", "thump"],
                "rustle": ["swish", "leaf sound"],
                "ding dong": ["bell sound", "ding", "dong"],
                "boom boom": ["drum sound", "bam bam"],
                "peep": ["whistle", "beep"],
                "honk": ["car horn", "beep beep"],
                "ring": ["doorbell", "ring ring"],
                "bang": ["hammer", "knock"],
                "snip": ["scissors", "cut"],
                "scratch": ["pencil sound", "scrape"],
                "bounce": ["boing", "ball sound"],
                "beep": ["alarm", "smoke detector"],
                "wee woo": ["siren", "ambulance sound", "wee wah"],
                "wail": ["police siren", "howl"],
                "fire": ["smoke", "danger"],
                "class": ["school", "lesson"],
                "danger": ["hazard", "risk"],
                "tracks": ["railroad", "train tracks"],
                "pedestrians": ["people walking", "walkers"],
                "careful": ["alert", "watchful"],
                "leave": ["exit", "evacuate", "get out"],
                "speaker": ["amplifier", "loudspeaker"],
                "loud": ["noisy", "deafening"],
                "noisy": ["loud", "rowdy"],
                "explosive": ["blast", "detonation"],
                "roar": ["thunderous sound"],
                "buzzing": ["drone", "hum"],
                "ears": ["ear", "hearing"],
                "hearing": ["ear", "auditory"],
                "headache": ["pain", "migraine"],
                "sleep": ["rest", "nap"],
                "scared": ["frightened", "afraid"],
                "ear": ["ears", "hearing"],
                "dangerous": ["harmful", "unsafe"],
                "both ways": ["left and right", "both directions"],
                "safe": ["secure", "protected"],
                "adult": ["grown-up", "parent", "teacher"],
                "life": ["live", "safety"],
                "ignore": ["disobey", "not listen"],
                "aside": ["out of the way", "to the side"],
                "safe": ["protected", "secure"],
                "plugs": ["earplugs", "protection"]
            };
            for (let key in forgiving) {
                if (normalizedCorrect === key && forgiving[key].includes(normalizedUser)) {
                    isCorrect = true;
                    break;
                }
            }
            // Accept plural/singular
            if (!isCorrect && (normalizedCorrect + "s" === normalizedUser || (normalizedCorrect.endsWith('s') && normalizedCorrect.slice(0,-1) === normalizedUser))) {
                isCorrect = true;
            }
        }
        
        stopTimer();
        if (isCorrect) {
            scoreCorrect++;
            updateScoreUI();
            feedbackMsgDiv.innerHTML = `✅ Correct! "${currentQ.answer}" is right! +1 point ✅`;
            speakEnglish(`Correct! The answer is ${currentQ.answer}. You earned a point!`);
        } else {
            feedbackMsgDiv.innerHTML = `❌ Not correct. The correct answer is: "${currentQ.answer}". Keep learning about sounds and safety! ❌`;
            speakEnglish(`Not correct. The correct answer is ${currentQ.answer}. Don't give up! Listen carefully!`);
        }
        allowAnswer = false;
        answerInput.disabled = true;
        submitBtn.disabled = true;
        moveToNextQuestionAfterDelay();
    }
    
    submitBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', readCurrentQuestion);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && allowAnswer) {
            e.preventDefault();
            checkAnswer();
        }
    });
    
    loadLevel(1);
    
    window.addEventListener('load', () => {
        setTimeout(() => {
            speakEnglish("Welcome to Bobo's Sound Explorers! Learn about sounds around us, sounds from objects, warning sounds, loud sounds, their dangers, and how to obey warning sounds. You have 40 seconds for each question. Click the speaker to hear the question. Type your answer. Let's listen and learn!");
        }, 500);
    });
</script>
</body>
</html>
