<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>What I Can Be | CBC Grade 5 English – Jobs & Occupations Quest</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e3c72 0%, #0f2a4a 100%);
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: #fffef7;
            background-image: radial-gradient(circle at 20% 40%, rgba(100, 150, 200, 0.08) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 3rem;
            box-shadow: 0 30px 45px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,250,210,0.9);
            overflow: hidden;
            transition: all 0.2s;
            border: 2px solid #6c9bd2;
        }

        .game-header {
            background: linear-gradient(98deg, #2c5282, #4299e1);
            padding: 1rem 2rem;
            color: #fff5e0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            border-bottom: 5px solid #f6e05e;
        }

        .level-badge {
            background: #f6e05e;
            color: #2c5282;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: inset 0 -1px 0 #c58f2a, 0 4px 8px rgba(0,0,0,0.2);
        }

        .score-timer {
            display: flex;
            gap: 25px;
            background: #1e3c5a;
            padding: 5px 24px;
            border-radius: 60px;
        }

        .score, .timer {
            font-weight: bold;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .score span, .timer span {
            color: #fef08a;
            margin-right: 6px;
        }

        .progress-area {
            background: #e2e8f0;
            padding: 10px 25px;
        }

        .progress-bar-bg {
            background: #8b6946;
            border-radius: 40px;
            height: 16px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            background: #4299e1;
            height: 100%;
            transition: width 0.2s ease;
            border-radius: 40px;
        }

        .q-counter {
            text-align: right;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: #2d3748;
        }

        .question-card {
            padding: 1.8rem 2rem 2rem;
        }

        .question-text {
            font-size: 1.45rem;
            font-weight: 600;
            background: white;
            padding: 1.3rem;
            border-radius: 2rem;
            box-shadow: 0 8px 0 #cbd5e0;
            margin-bottom: 1.4rem;
            line-height: 1.4;
            color: #1e3c72;
            border: 1px solid #bee3f8;
        }

        .voice-btn {
            background: #4299e1;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            border-radius: 60px;
            padding: 8px 24px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #2b6cb0;
        }

        .voice-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2b6cb0;
        }

        .answer-area {
            margin: 18px 0;
        }

        .answer-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #2c5282;
        }

        #userAnswer {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 3px solid #bee3f8;
            border-radius: 60px;
            background: #fffff5;
            font-family: monospace;
            font-weight: 500;
            transition: 0.1s;
            outline: none;
        }

        #userAnswer:focus {
            border-color: #f6e05e;
            box-shadow: 0 0 0 3px rgba(246,224,94,0.3);
        }

        .hint-message {
            background: #f7fafc;
            padding: 10px 18px;
            border-radius: 32px;
            font-size: 0.9rem;
            margin-top: 14px;
            color: #4a5568;
            font-style: italic;
            border-left: 7px solid #f6e05e;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
            justify-content: space-between;
        }

        button {
            background: #2c5282;
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            box-shadow: 0 4px 0 #1e3c5a;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e3c5a;
        }

        .submit-btn {
            background: #f6e05e;
            color: #2c5282;
            box-shadow: 0 4px 0 #b7791f;
            flex: 2;
        }

        .next-btn {
            background: #4a6fa5;
            flex: 1;
        }

        .feedback {
            margin: 20px 0 0;
            background: #edf2f7;
            border-radius: 50px;
            padding: 12px 22px;
            font-weight: bold;
            text-align: center;
            font-size: 1rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #fff9ef;
            max-width: 360px;
            padding: 2rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: 0 20px 30px black;
            border: 4px solid #f6e05e;
        }

        .timer.warning {
            color: #fef08a;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @media (max-width: 600px) {
            .question-text {
                font-size: 1.2rem;
            }
            .game-header {
                flex-direction: column;
                align-items: center;
            }
            .action-buttons button {
                padding: 10px 18px;
            }
        }
    </style>
</head>
<body>

<div class="game-container" id="gameRoot">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">LEVEL 1</div>
        <div class="score-timer">
            <div class="score"><span>⭐ SCORE</span> <span id="scoreValue">0</span></div>
            <div class="timer"><span>⏱️</span> <span id="timerValue">40</span>s</div>
        </div>
    </div>
    <div class="progress-area">
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="q-counter" id="qCounter">Question 1 / 30</div>
    </div>
    <div class="question-card">
        <button class="voice-btn" id="speakBtn">🔊 READ QUESTION ALOUD</button>
        <div class="question-text" id="questionText">What can you be? Dream job loading...</div>
        <div class="answer-area">
            <label class="answer-label">✍️ YOUR ANSWER (type the correct word/phrase):</label>
            <input type="text" id="userAnswer" placeholder="Type your answer here..." autocomplete="off">
            <div class="hint-message" id="hintArea">💡 Hint will appear when time is low (≤12s). You can be anything!</div>
        </div>
        <div class="action-buttons">
            <button class="submit-btn" id="submitBtn">✔ SUBMIT ANSWER</button>
            <button class="next-btn" id="nextBtn">➡ NEXT QUESTION</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // WHAT I CAN BE – CBC Grade 5 English
    // Topics: Listening, Speaking, Reading (Comprehension dialogue),
    // Grammar: Determiners as quantifiers (some, any, many, much, a few, a little, etc.)
    // Creative writing (Pictorial composition) on jobs & occupations.
    // 5 levels × 30 questions. Timer 40s. Pass 80% to advance.
    // Voice output, fully responsive, open-ended. Hints when time ≤12s.
    // --------------------------------------------------------------

    // Generate rich, varied question bank (150 questions)
    function generateBankForLevel(level) {
        const bank = [];
        // 5 strands: 0:Determiners(quantifiers)  1:Jobs & Occupations 2:Reading Dialogue 3:Listening/Speaking 4:Creative Writing (Pictorial)
        for (let i = 0; i < 30; i++) {
            let qText = "";
            let correctAnswer = "";
            let hintText = "";
            let category = (i + level * 3) % 5;
            if (level === 1) category = i % 5;
            if (level === 2) category = (i + 2) % 5;
            if (level === 3) category = (i + 4) % 5;
            if (level === 4) category = (i + 1) % 5;
            if (level === 5) category = (i + 3) % 5;

            if (category === 0) { // Determiners as quantifiers
                const detBank = [
                    { q: "There are ______ (many/much) doctors in the hospital.", ans: "many", hint: "used with countable nouns" },
                    { q: "How ______ (much/many) money does a teacher earn?", ans: "much", hint: "uncountable noun (money)" },
                    { q: "She has ______ (a few/a little) job interviews today.", ans: "a few", hint: "countable plural interviews" },
                    { q: "I need ______ (a little/a few) time to choose my career.", ans: "a little", hint: "uncountable time" },
                    { q: "There aren't ______ (some/any) pilots in the village.", ans: "any", hint: "negative sentence" },
                    { q: "______ (Several/Each) student wants to become an engineer.", ans: "each", hint: "singular emphasis" },
                    { q: "He has ______ (a lot of/much) skills for the job.", ans: "a lot of", hint: "positive statement, both countable/uncountable" }
                ];
                const pick = detBank[i % detBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 1) { // Jobs & Occupations (core topic)
                const jobBank = [
                    { q: "A person who treats sick animals is a ______.", ans: "veterinarian", hint: "animal doctor" },
                    { q: "Someone who designs buildings is an ______.", ans: "architect", hint: "plans houses" },
                    { q: "The pilot flies an ______.", ans: "airplane", hint: "aircraft" },
                    { q: "A chef works in the ______.", ans: "kitchen", hint: "cooking place" },
                    { q: "A ______ helps students learn.", ans: "teacher", hint: "school profession" },
                    { q: "A police officer ______ people.", ans: "protects", hint: "keeps safe" },
                    { q: "A farmer grows ______ and raises animals.", ans: "crops", hint: "plants for food" }
                ];
                const pick = jobBank[i % jobBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 2) { // Reading Comprehension (dialogue about jobs)
                const dialogueBank = [
                    { q: "In the dialogue, Mary asked: '______ can I become a doctor?'", ans: "how", hint: "question word" },
                    { q: "The father replied: 'Study ______ and work hard.'", ans: "science", hint: "biology/chemistry" },
                    { q: "The dialogue teaches that every job requires ______.", ans: "respect", hint: "honor" },
                    { q: "What did the teacher say? 'You ______ be whatever you dream.'", ans: "can", hint: "possibility" },
                    { q: "The character said: 'I want to help people, so I will be a ______.'", ans: "nurse", hint: "healthcare helper" }
                ];
                const pick = dialogueBank[i % dialogueBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else if (category === 3) { // Listening & Speaking (career conversations)
                const listenBank = [
                    { q: "When listening to a career talk, you should take ______.", ans: "notes", hint: "write key points" },
                    { q: "Speak ______ when describing your dream job.", ans: "clearly", hint: "enunciate" },
                    { q: "A good speaker makes ______ contact with the audience.", ans: "eye", hint: "look at people" },
                    { q: "You can ask ______ questions after a presentation.", ans: "polite", hint: "courteous" },
                    { q: "To learn about jobs, listen to ______ (professionals).", ans: "professionals", hint: "workers in that field" }
                ];
                const pick = listenBank[i % listenBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }
            else { // Creative writing (Pictorial composition) – describe a scene related to jobs
                const writeBank = [
                    { q: "In a pictorial composition, you draw and ______ about the scene.", ans: "write", hint: "add sentences" },
                    { q: "A picture showing a firefighter putting out fire teaches us about ______.", ans: "bravery", hint: "courage" },
                    { q: "The first step in pictorial writing is to ______ the image carefully.", ans: "observe", hint: "look closely" },
                    { q: "A drawing of a doctor with a stethoscope represents the job of ______.", ans: "healing", hint: "curing illness" },
                    { q: "Write one sentence: 'I want to be a ______ because I love building.'", ans: "engineer", hint: "constructs roads/bridges" }
                ];
                const pick = writeBank[i % writeBank.length];
                qText = pick.q;
                correctAnswer = pick.ans.toLowerCase();
                hintText = pick.hint;
            }

            bank.push({
                text: qText,
                answer: correctAnswer,
                hint: hintText
            });
        }
        return bank;
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQuestions = [];
    let currentIndex = 0;
    let levelScore = 0;
    let timerInterval = null;
    let timeLeft = 40;
    let canAnswer = true;
    let awaitingNext = false;
    let currentCorrectAnswer = "";
    let currentHintText = "";

    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const scoreSpan = document.getElementById('scoreValue');
    const timerSpan = document.getElementById('timerValue');
    const progressFill = document.getElementById('progressFill');
    const qCounterSpan = document.getElementById('qCounter');
    const questionTextDiv = document.getElementById('questionText');
    const userAnswerInput = document.getElementById('userAnswer');
    const hintArea = document.getElementById('hintArea');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const speakBtn = document.getElementById('speakBtn');

    // Speech synthesis
    let speechSynth = window.speechSynthesis;
    let utterance = null;

    function speakCurrentQuestion() {
        if (!speechSynth) return;
        if (utterance) speechSynth.cancel();
        const txt = questionTextDiv.innerText;
        utterance = new SpeechSynthesisUtterance(txt);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynth.speak(utterance);
    }

    function updateProgressUI() {
        const total = currentQuestions.length;
        const percent = (currentIndex / total) * 100;
        progressFill.style.width = `${percent}%`;
        qCounterSpan.innerText = `Question ${Math.min(currentIndex + 1, total)} / ${total}`;
        scoreSpan.innerText = `${levelScore}`;
    }

    function updateTimerUI() {
        timerSpan.innerText = timeLeft;
        if (timeLeft <= 10) timerSpan.classList.add('warning');
        else timerSpan.classList.remove('warning');

        if (timeLeft <= 12 && canAnswer && !awaitingNext && currentHintText) {
            hintArea.innerHTML = `💡⏰ HINT: ${currentHintText}`;
        } else if (timeLeft > 12 && canAnswer && !awaitingNext) {
            hintArea.innerHTML = `💡 Hint appears at ≤12s. Choose your future career wisely!`;
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!canAnswer || awaitingNext) return;
            if (timeLeft <= 1) {
                stopTimer();
                if (canAnswer && !awaitingNext) {
                    canAnswer = false;
                    awaitingNext = true;
                    feedbackMsg.innerHTML = `⏰ TIME'S UP! The correct answer: "${currentCorrectAnswer.toUpperCase()}". Press NEXT to continue.`;
                    userAnswerInput.disabled = true;
                    submitBtn.disabled = true;
                }
            } else {
                timeLeft--;
                updateTimerUI();
            }
        }, 1000);
    }

    function loadQuestion() {
        stopTimer();
        canAnswer = true;
        awaitingNext = false;
        userAnswerInput.disabled = false;
        submitBtn.disabled = false;
        userAnswerInput.value = "";
        feedbackMsg.innerHTML = "🚀 What can you be? Type your answer and shine! 🚀";
        hintArea.innerHTML = "💡 Hint appears when time runs low. Believe in yourself!";
        if (currentIndex < currentQuestions.length) {
            const q = currentQuestions[currentIndex];
            questionTextDiv.innerText = q.text;
            currentCorrectAnswer = q.answer;
            currentHintText = q.hint;
            timeLeft = 40;
            updateTimerUI();
            startTimer();
            updateProgressUI();
        } else {
            finishLevel();
        }
    }

    function evaluateAnswer() {
        if (!canAnswer || awaitingNext) {
            feedbackMsg.innerHTML = "❌ Already answered or time expired. Press NEXT for next mission.";
            return;
        }
        let userAns = userAnswerInput.value.trim().toLowerCase();
        userAns = userAns.replace(/[^\w\s]/g, '').trim();
        const correct = currentCorrectAnswer;
        let isCorrect = false;

        // flexible matching for grade 5
        if (userAns === correct) isCorrect = true;
        else if (correct === "many" && (userAns === "a lot of")) isCorrect = true;
        else if (correct === "much" && (userAns === "a lot")) isCorrect = false;
        else if (correct === "a few" && userAns === "several") isCorrect = true;
        else if (correct === "a little" && (userAns === "some" || userAns === "a bit")) isCorrect = true;
        else if (correct === "any" && userAns === "none") isCorrect = false;
        else if (correct === "each" && (userAns === "every")) isCorrect = true;
        else if (correct === "a lot of" && (userAns === "lots of" || userAns === "many")) isCorrect = true;
        else if (correct === "veterinarian" && (userAns === "vet" || userAns === "animal doctor")) isCorrect = true;
        else if (correct === "architect" && (userAns === "building designer")) isCorrect = true;
        else if (correct === "teacher" && (userAns === "educator")) isCorrect = true;
        else if (correct === "protects" && (userAns === "guard" || userAns === "defends")) isCorrect = true;
        else if (correct === "crops" && (userAns === "vegetables" || userAns === "plants")) isCorrect = true;
        else if (correct === "science" && (userAns === "biology" || userAns === "chemistry")) isCorrect = true;
        else if (correct === "notes" && userAns === "note") isCorrect = true;
        else if (correct === "eye" && userAns === "eyes") isCorrect = true;
        else if (correct === "write" && (userAns === "describe" || userAns === "compose")) isCorrect = true;
        else if (userAns.includes(correct) && correct.length > 3 && !correct.includes(" ")) isCorrect = true;
        else if (correct.includes(userAns) && userAns.length > 2) isCorrect = true;

        if (isCorrect) {
            levelScore++;
            feedbackMsg.innerHTML = `✅ CORRECT! +1 point. "${correct.toUpperCase()}" is right! You are becoming a career expert.`;
            scoreSpan.innerText = levelScore;
        } else {
            feedbackMsg.innerHTML = `❌ NOT YET! The correct answer is "${correct.toUpperCase()}". You typed "${userAns}". Keep exploring jobs!`;
        }

        canAnswer = false;
        awaitingNext = true;
        stopTimer();
        userAnswerInput.disabled = true;
        submitBtn.disabled = true;
    }

    function nextQuestion() {
        if (!awaitingNext && canAnswer) {
            feedbackMsg.innerHTML = "📢 Please submit your answer first or let the timer run out.";
            return;
        }
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        stopTimer();
        const total = currentQuestions.length;
        const percent = (levelScore / total) * 100;
        const passed = percent >= 80;

        if (passed) {
            if (currentLevel === 5) {
                showFinalModal("🏆 YOU CAN BE ANYTHING! 🏆", `You mastered all levels with ${percent.toFixed(0)}%! You know quantifiers, jobs, and career dreams. Mission accomplished!`, true);
            } else {
                showLevelTransition(`🎉 LEVEL ${currentLevel} ACCOMPLISHED! 🎉`, `Score: ${percent.toFixed(0)}% (≥80%). Ready for Level ${currentLevel+1}? New careers await!`, false);
            }
        } else {
            showLevelTransition(`⚠️ KEEP DREAMING!`, `You scored ${percent.toFixed(0)}% (need 80%). Restart Level ${currentLevel} to master determiners and occupations.`, true);
        }
    }

    function showLevelTransition(title, message, isRetry) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="modalBtn">${isRetry ? 'TRY AGAIN' : 'NEXT LEVEL'}</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#modalBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            if (isRetry) {
                initLevel();
            } else {
                currentLevel++;
                initLevel();
            }
        });
    }

    function showFinalModal(title, message, isEnd) {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-card">
                <h2>${title}</h2>
                <p>${message}</p>
                <button id="playAgainBtn">🌟 DREAM AGAIN 🌟</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const btn = modalDiv.querySelector('#playAgainBtn');
        btn.addEventListener('click', () => {
            modalDiv.remove();
            resetGame();
        });
    }

    function resetGame() {
        currentLevel = 1;
        initLevel();
    }

    function initLevel() {
        stopTimer();
        currentQuestions = generateBankForLevel(currentLevel);
        currentIndex = 0;
        levelScore = 0;
        canAnswer = true;
        awaitingNext = false;
        timeLeft = 40;
        levelDisplay.innerText = `LEVEL ${currentLevel}`;
        scoreSpan.innerText = "0";
        updateProgressUI();
        loadQuestion();
    }

    // Event listeners
    submitBtn.addEventListener('click', evaluateAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    speakBtn.addEventListener('click', speakCurrentQuestion);
    userAnswerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') evaluateAnswer();
    });

    // Start the adventure
    initLevel();
</script>
</body>
</html>
