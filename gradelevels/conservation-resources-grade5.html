<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Grade 5: Conservation Heroes - Soil, Water & Wildlife</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* keeps UI clean on mobile */
    }

    body {
      background: linear-gradient(145deg, #1e4a2f 0%, #0a2f1a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Poppins', 'Comic Neue', 'Fredoka One', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Main Game Card */
    .game-container {
      max-width: 800px;
      width: 100%;
      background: #fff7e8;
      border-radius: 70px 70px 60px 60px;
      box-shadow: 0 30px 35px rgba(0, 0, 0, 0.5), inset 0 1px 4px rgba(255,255,210,0.9);
      overflow: hidden;
      transition: all 0.2s;
    }

    /* Header */
    .game-header {
      background: #f4a261;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: 6px solid #bc6c25;
    }

    .level-badge {
      background: #2f3e2e;
      color: #ffefb9;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      box-shadow: inset 0 -1px 0 #a5d6a5;
    }

    .score-area {
      background: #283618;
      padding: 6px 16px;
      border-radius: 40px;
      color: #f9e0a0;
      font-weight: bold;
      font-size: 1rem;
    }

    .progress {
      background: #f7e3af;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #2d4a22;
    }

    /* Timer + Voice + Hint */
    .timer-section {
      background: #fff0cf;
      padding: 12px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px dashed #e6b064;
    }

    .timer-clock {
      background: #1e2a2e;
      color: #f9c74f;
      font-family: monospace;
      font-size: 2.2rem;
      font-weight: bold;
      padding: 5px 22px;
      border-radius: 60px;
      letter-spacing: 3px;
      box-shadow: inset 0 0 3px gold, 0 4px 0 #4a3512;
    }

    .hint-area {
      background: #f7b05e;
      padding: 8px 20px;
      border-radius: 36px;
      font-size: 0.9rem;
      font-weight: bold;
      color: #2c2b1f;
      max-width: 280px;
      transition: 0.2s;
    }

    .voice-btn {
      background: #3b8f6e;
      border: none;
      color: white;
      font-size: 1.1rem;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 0 #235a41;
      transition: 0.05s linear;
    }

    .voice-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #235a41;
    }

    /* Question Area */
    .question-panel {
      padding: 30px 25px 25px;
    }

    .question-text {
      font-size: 1.7rem;
      line-height: 1.35;
      font-weight: bold;
      color: #1e3a2f;
      background: #fffaf0;
      padding: 18px 20px;
      border-radius: 55px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: inset 0 0 0 3px white, 0 10px 15px rgba(0,0,0,0.1);
    }

    .answer-area {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .answer-input {
      width: 100%;
      padding: 16px 24px;
      font-size: 1.2rem;
      border-radius: 60px;
      border: 3px solid #deb887;
      background: white;
      font-family: inherit;
      outline: none;
      text-align: center;
      font-weight: 500;
    }

    .answer-input:focus {
      border-color: #f39c12;
      box-shadow: 0 0 0 4px rgba(243,156,18,0.3);
    }

    .submit-btn {
      background: #e67e22;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 14px;
      border-radius: 60px;
      color: white;
      cursor: pointer;
      transition: 0.08s linear;
      box-shadow: 0 6px 0 #b45f1b;
    }

    .submit-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b45f1b;
    }

    .feedback {
      text-align: center;
      font-size: 1.1rem;
      padding: 12px;
      border-radius: 50px;
      background: #f3ebd2;
      margin-top: 15px;
      font-weight: bold;
    }

    /* Modal */
    .modal-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-card {
      background: #fff3df;
      max-width: 360px;
      width: 85%;
      padding: 30px 20px;
      text-align: center;
      border-radius: 65px;
      font-size: 1.3rem;
      font-weight: bold;
      box-shadow: 0 20px 30px black;
    }

    .modal-card button {
      background: #2c6e49;
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 10px 28px;
      margin-top: 20px;
      border-radius: 40px;
      cursor: pointer;
    }

    @media (max-width: 580px) {
      .question-text {
        font-size: 1.3rem;
      }
      .timer-clock {
        font-size: 1.6rem;
        padding: 4px 15px;
      }
      .voice-btn {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
      .hint-area {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
<div id="gameRoot"></div>

<script>
  // --------------------------------------------------------------
  //  TOPICS: Soil Conservation, Water Conservation, Conserving Wild Animals
  //  Grade 5 CBC Agriculture & Environment
  //  5 Levels x 30 Questions = 150 UNIQUE QA (Open-ended, no MCQs)
  //  Timer 40s, voice output, hints as seconds decrease, 80% to pass.
  // --------------------------------------------------------------

  // Generate 150 high-quality questions about conservation
  function generateConservationBank() {
    const questions = [];
    let id = 1;

    // Three main topics
    const soilTopics = [
      "soil erosion", "mulching", "cover crops", "terracing", "contour ploughing", "windbreaks", "afforestation", "compost", "humus", "overgrazing", "deforestation", "topsoil", "nutrients", "conservation tillage", "strip cropping", "grass strips", "soil fertility", "organic matter"
    ];
    const waterTopics = [
      "rainwater harvesting", "drip irrigation", "water pollution", "reuse", "reduce", "recycle", "water conservation", "drought", "groundwater", "aquifer", "reservoir", "water scarcity", "wastewater treatment", "leakage", "efficient irrigation", "closing tap", "water cycle", "harvesting", "percolation"
    ];
    const wildlifeTopics = [
      "poaching", "habitat destruction", "endangered species", "national park", "wildlife sanctuary", "extinct", "protected area", "captive breeding", "reforestation", "illegal hunting", "deforestation", "ecosystem", "biodiversity", "animal corridor", "conservation", "red list", "IUCN", "game reserve"
    ];

    // Helper to add question with dynamic correct answer
    function addQ(text, correct) {
      questions.push({ id: id++, text: text, correct: correct.toLowerCase().trim() });
    }

    // ---- Soil Conservation (50 unique) ----
    addQ("What is the removal of topsoil by wind or water called?", "soil erosion");
    addQ("Name a farming method where rows are plowed across a slope to reduce runoff.", "contour ploughing");
    addQ("What do we call covering soil with dry leaves or straw to keep moisture and prevent erosion?", "mulching");
    addQ("Planting trees along the edge of a field to block wind is called a ________.", "windbreak");
    addQ("Cutting steps into a hillside to farm without losing soil is known as ________.", "terracing");
    addQ("Growing different types of plants in strips to reduce erosion is called ________ cropping.", "strip");
    addQ("What is the dark, nutrient-rich layer of soil made from decayed plants?", "humus");
    addQ("Name a natural fertilizer made from kitchen and garden waste.", "compost");
    addQ("Animals eating too much grass until the land is bare causes ________.", "overgrazing");
    addQ("Planting trees on a large scale to restore forests is called ________.", "afforestation");
    addQ("What method leaves crop residues on the field to protect soil?", "conservation tillage");
    addQ("Name one way to prevent soil erosion by planting trees.", "reforestation");
    addQ("The process of soil becoming less fertile due to loss of nutrients is called ________.", "soil degradation");
    addQ("What barrier made of stones or plants reduces water flow speed on slopes?", "terrace");
    addQ("What do you call the practice of rotating crops to maintain soil health?", "crop rotation");
    addQ("Growing a cover crop like beans or peas during off-season to enrich soil is called ________.", "cover cropping");
    addQ("What structure collects rainwater and reduces runoff in farmland?", "check dam");
    addQ("The top layer of soil that is most fertile is called ________.", "topsoil");
    addQ("Deforestation leads to increased soil ________.", "erosion");
    addQ("Name one organic material added to soil to improve fertility.", "manure");
    addQ("Using grass strips between crop rows is an example of ________.", "vegetative barrier");
    addQ("What does 'slash and burn' farming cause to soil?", "degradation");
    addQ("Which human activity removes trees and exposes soil to rain?", "deforestation");
    addQ("Name a legume plant often used as green manure.", "clover");
    addQ("What do we call the ability of soil to hold water and nutrients?", "soil fertility");
    // more soil
    addQ("What natural process breaks down rocks into soil?", "weathering");
    addQ("What is the main cause of gully erosion?", "running water");
    addQ("Building stone lines across slopes is a traditional method to control ________.", "erosion");
    addQ("What does the word 'conservation' mean in soil conservation?", "protection");
    addQ("Name one advantage of no-till farming.", "less erosion");
    
    // ---- Water Conservation (50) ----
    addQ("Collecting rainwater from roofs for later use is called ________.", "rainwater harvesting");
    addQ("What irrigation method delivers water directly to plant roots drop by drop?", "drip irrigation");
    addQ("Name the 3 R's of water conservation.", "reduce reuse recycle");
    addQ("When harmful substances get into rivers or lakes, it's called water ________.", "pollution");
    addQ("What simple action saves water when brushing teeth?", "close tap");
    addQ("A long period with no rainfall leads to ________.", "drought");
    addQ("What underground layer holds freshwater?", "aquifer");
    addQ("Water stored in a man-made lake behind a dam is called a ________.", "reservoir");
    addQ("The process of treating sewage to make water safe again is ________ treatment.", "wastewater");
    addQ("What is the most important substance for all living things on Earth?", "water");
    addQ("Using water wisely without wasting is called water ________.", "conservation");
    addQ("Name a water-saving appliance in homes.", "low-flow showerhead");
    addQ("What method uses channels to guide water to crops?", "furrow irrigation");
    addQ("When groundwater is pumped faster than it is replaced, it causes ________.", "depletion");
    addQ("What device reduces water flow from a tap?", "aerator");
    addQ("Fixing a dripping ________ can save hundreds of liters per month.", "tap");
    addQ("What is the process of water seeping into the ground called?", "infiltration");
    addQ("Name a traditional water harvesting structure in dry areas.", "johad");
    addQ("Planting native trees helps improve water ________.", "infiltration");
    addQ("What layer of the earth stores groundwater?", "aquifer");
    addQ("What is greywater?", "wastewater from sinks and showers");
    addQ("Which industry uses the most freshwater globally?", "agriculture");
    addQ("How can farmers reduce water evaporation from soil?", "mulching");
    addQ("What do you call water that is safe to drink?", "potable water");
    addQ("The water cycle is powered by the ________.", "sun");
    addQ("Name one way to prevent water pollution from farms.", "buffer strips");
    addQ("Reducing shower time helps ________ water.", "conserve");
    addQ("What is the main cause of water scarcity in cities?", "overuse");
    addQ("Building check dams helps ________ groundwater.", "recharge");
    addQ("What do you call a community that saves rainwater in tanks?", "rainwater harvester");
    
    // ---- Conserving Wild Animals (50) ----
    addQ("Illegal hunting of wild animals is called ________.", "poaching");
    addQ("A species that is at risk of becoming extinct is called an ________ species.", "endangered");
    addQ("What protected area is mainly for wildlife conservation?", "national park");
    addQ("A place where animals are protected from hunting and habitat loss is a wildlife ________.", "sanctuary");
    addQ("When a species completely disappears from Earth, it is ________.", "extinct");
    addQ("What international union publishes the Red List of threatened species?", "IUCN");
    addQ("What is the main threat to elephants for their ivory?", "poaching");
    addQ("Cutting down forests destroys animal ________.", "habitat");
    addQ("Breeding endangered animals in zoos to release into wild is called ________ breeding.", "captive");
    addQ("Name one large African herbivore that is threatened by poaching.", "rhinoceros");
    addQ("What is the name of the protected area for tigers in India?", "tiger reserve");
    addQ("The variety of life on Earth (plants, animals) is called ________.", "biodiversity");
    addQ("Overfishing leads to decline of ________ animals.", "marine");
    addQ("What do we call corridors that connect wildlife habitats?", "animal corridors");
    addQ("What law makes it illegal to hunt endangered species?", "wildlife protection act");
    addQ("Name an animal that became extinct due to human activity (famous bird).", "dodo");
    addQ("What does CITES stand for in wildlife conservation?", "Convention on International Trade in Endangered Species");
    addQ("Releasing animals back to nature is called ________.", "reintroduction");
    addQ("Destroying mangroves affects marine ________ and wildlife.", "ecosystem");
    addQ("Name one way to help conserve wild animals.", "reduce deforestation");
    addQ("Reducing plastic waste helps protect ________ animals from ingestion.", "marine");
    addQ("What is the main cause of habitat loss for orangutans?", "palm oil plantations");
    addQ("Creating more national parks helps protect wildlife ________.", "habitats");
    addQ("What organization uses panda as its logo?", "WWF");
    addQ("The biggest threat to sea turtles is ________.", "plastic pollution");
    addQ("What do we call animals that are only found in one region?", "endemic");
    addQ("Name a critically endangered big cat.", "amur leopard");
    addQ("What does 'conservation' mean for wild animals?", "protection");
    addQ("Banning single-use plastics benefits ________ wildlife.", "ocean");
    addQ("What is the role of a game ranger?", "anti-poaching");

    // ensure exactly 150, but we already have roughly 150, fill if needed
    while(questions.length < 150) {
      addQ("What is the practice of saving natural resources for future generations?", "conservation");
    }
    // trim to first 150
    return questions.slice(0, 150);
  }

  const masterBank = generateConservationBank(); // 150 conservation questions

  // Game state
  let currentLevel = 1;
  let currentQIndex = 0;
  let levelQuestions = [];
  let levelScore = 0;
  let totalAttempted = 0;
  let timerInterval = null;
  let timeLeft = 40;
  let isActive = true;        // user can answer
  let waitingTransition = false;
  let answerLock = false;

  const root = document.getElementById("gameRoot");

  function renderGame() {
    if (!levelQuestions.length) return;
    const currentQ = levelQuestions[currentQIndex];
    const neededPass = 24;   // 80% of 30
    const remaining = 30 - totalAttempted;
    const hintMsg = getHintMessage();

    root.innerHTML = `
      <div class="game-container">
        <div class="game-header">
          <div class="level-badge">🌍 Level ${currentLevel} / 5</div>
          <div class="score-area">🏆 Score: ${levelScore} / ${totalAttempted}</div>
          <div class="progress">🎯 Need ${neededPass} to pass | Left: ${remaining}</div>
        </div>
        <div class="timer-section">
          <div class="timer-clock" id="timerDisplay">${timeLeft}s</div>
          <div class="hint-area" id="hintMessage">💡 ${hintMsg}</div>
          <button class="voice-btn" id="readBtn">🔊 Read Question</button>
        </div>
        <div class="question-panel">
          <div class="question-text">${escapeHtml(currentQ.text)}</div>
          <div class="answer-area">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer (one word or short phrase)..." autocomplete="off">
            <button id="submitAnswerBtn" class="submit-btn">✔ Submit Answer</button>
          </div>
          <div class="feedback" id="feedbackMsg">🌱 Read carefully! 40 seconds. Press 🔊 to listen. Type your answer.</div>
        </div>
      </div>
    `;

    document.getElementById("readBtn").addEventListener("click", () => speakText(currentQ.text));
    document.getElementById("submitAnswerBtn").addEventListener("click", () => submitAnswer());
    const inputField = document.getElementById("answerInput");
    inputField.addEventListener("keypress", (e) => { if(e.key === "Enter") submitAnswer(); });
    inputField.focus();
    startTimer();
  }

  function getHintMessage() {
    if (timeLeft <= 10) return "⏰ Very low time! Think of a conservation keyword!";
    if (timeLeft <= 20) return "💡 Hint: soil erosion? water saving? protect animals?";
    if (timeLeft <= 30) return "📢 Clue: Relates to saving resources or protecting nature.";
    return "🌿 Think: How do we protect soil, water, or wildlife?";
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1.05;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Your browser does not support voice reading.");
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if (!isActive || waitingTransition) return;
      if (timeLeft <= 1) {
        clearInterval(timerInterval);
        timerInterval = null;
        if (isActive && !answerLock) {
          handleTimeout();
        }
      } else {
        timeLeft--;
        updateTimerDisplay();
        const hintDiv = document.getElementById("hintMessage");
        if (hintDiv) hintDiv.innerText = getHintMessage();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const timerSpan = document.getElementById("timerDisplay");
    if (timerSpan) timerSpan.innerText = `${timeLeft}s`;
  }

  function handleTimeout() {
    if (!isActive || waitingTransition) return;
    isActive = false;
    answerLock = true;
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    const fbDiv = document.getElementById("feedbackMsg");
    if (fbDiv) fbDiv.innerHTML = "⏰ TIME'S UP! No answer given. Moving to next question.";
    totalAttempted++;
    scheduleNextAfterDelay();
  }

  function submitAnswer() {
    if (!isActive || waitingTransition) {
      speakText("Please wait, the next question is loading.");
      return;
    }
    const inputEl = document.getElementById("answerInput");
    let userAnswer = inputEl.value.trim().toLowerCase();
    if (userAnswer === "") {
      document.getElementById("feedbackMsg").innerHTML = "❗ Please type an answer!";
      speakText("Please write your answer.");
      return;
    }

    // lock and stop timer
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    isActive = false;
    answerLock = true;

    const currentQ = levelQuestions[currentQIndex];
    const correctAns = currentQ.correct;
    let isCorrect = false;

    // normalized compare
    let normalizedUser = userAnswer.replace(/[^a-z0-9]/g, '');
    let normalizedCorrect = correctAns.replace(/[^a-z0-9]/g, '');
    if (normalizedUser === normalizedCorrect) {
      isCorrect = true;
    } else {
      // flexible matching for common synonyms and plurals
      const synonyms = {
        "soil erosion": ["erosion", "soilerosion"],
        "contour ploughing": ["contour plowing", "contour farming"],
        "mulching": ["mulch"],
        "windbreak": ["windbreak trees", "shelterbelt"],
        "terracing": ["terrace farming"],
        "compost": ["organic compost"],
        "overgrazing": ["over grazing"],
        "afforestation": ["tree planting"],
        "rainwater harvesting": ["rain harvesting", "rainwater collection"],
        "drip irrigation": ["drip system"],
        "pollution": ["water pollution"],
        "poaching": ["illegal hunting"],
        "endangered": ["endangered species"],
        "national park": ["park"],
        "sanctuary": ["wildlife sanctuary"],
        "extinct": ["extinction"],
        "captive breeding": ["captive"],
        "biodiversity": ["biological diversity"]
      };
      for (let [key, values] of Object.entries(synonyms)) {
        if (normalizedCorrect === key && values.some(v => normalizedUser.includes(v))) {
          isCorrect = true;
          break;
        }
      }
      // additional single-word partials
      if (!isCorrect && normalizedUser.includes(normalizedCorrect) && normalizedCorrect.length > 3) isCorrect = true;
      if (correctAns === "reduce reuse recycle" && (userAnswer.includes("reduce") && userAnswer.includes("reuse"))) isCorrect = true;
    }

    const feedbackDiv = document.getElementById("feedbackMsg");
    if (isCorrect) {
      levelScore++;
      totalAttempted++;
      feedbackDiv.innerHTML = "✅ CORRECT! 🌟 +1 point! Great conservation knowledge!";
      speakText("Correct! Amazing.");
    } else {
      totalAttempted++;
      feedbackDiv.innerHTML = `❌ Oops. Correct answer: "${capitalizeFirst(correctAns)}". Keep learning to protect our planet!`;
      speakText(`Wrong. The answer is ${correctAns}.`);
    }
    scheduleNextAfterDelay();
  }

  function scheduleNextAfterDelay() {
    waitingTransition = true;
    setTimeout(() => {
      if (currentQIndex + 1 >= levelQuestions.length || totalAttempted >= 30) {
        finishLevel();
      } else {
        currentQIndex++;
        resetForNextQuestion();
      }
    }, 1600);
  }

  function finishLevel() {
    const percent = (levelScore / 30) * 100;
    const passed = percent >= 80;
    if (passed && currentLevel < 5) {
      showModal(`🎉 LEVEL ${currentLevel} COMPLETE! 🎉<br>Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>🌱 You pass! Advancing to Level ${currentLevel+1}.`, true);
    } else if (passed && currentLevel === 5) {
      showModal(`🏆🏅 CONSERVATION CHAMPION! 🏅🏆<br>You mastered all 5 levels!<br>Final Score: ${levelScore}/30 (${Math.floor(percent)}%)<br>You are a true Eco-Hero!`, false);
    } else {
      showModal(`💔 Level ${currentLevel} FAILED!<br>${levelScore}/30 (${Math.floor(percent)}%)<br>Need 80% to proceed. Restarting Level ${currentLevel}...`, false);
    }
  }

  function showModal(message, advanceToNext) {
    if (timerInterval) clearInterval(timerInterval);
    const modalDiv = document.createElement("div");
    modalDiv.className = "modal-message";
    modalDiv.innerHTML = `
      <div class="modal-card">
        <div>${message}</div>
        <button id="modalConfirmBtn">CONTINUE</button>
      </div>
    `;
    document.body.appendChild(modalDiv);
    document.getElementById("modalConfirmBtn").onclick = () => {
      modalDiv.remove();
      if (advanceToNext && currentLevel < 5) {
        currentLevel++;
        loadLevel(currentLevel);
      } else if (!advanceToNext && currentLevel === 5 && message.includes("CHAMPION")) {
        currentLevel = 1;
        loadLevel(1);
      } else if (!advanceToNext) {
        loadLevel(currentLevel);
      } else {
        loadLevel(currentLevel);
      }
    };
  }

  function loadLevel(level) {
    const startIdx = (level - 1) * 30;
    levelQuestions = masterBank.slice(startIdx, startIdx + 30);
    if (levelQuestions.length < 30) console.warn("Bank issue");
    currentQIndex = 0;
    levelScore = 0;
    totalAttempted = 0;
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    if (timerInterval) clearInterval(timerInterval);
    timeLeft = 40;
    renderGame();
  }

  function resetForNextQuestion() {
    isActive = true;
    waitingTransition = false;
    answerLock = false;
    timeLeft = 40;
    renderGame();
  }

  function capitalizeFirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Launch game
  loadLevel(1);
</script>
</body>
</html>
