<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Grade 1 CBC Maths: Rectangles & Triangles | Shapes & Patterns</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 1300px;
            width: 100%;
            background: #fffef7;
            border-radius: 70px 70px 80px 80px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
        }

        .game-header {
            background: #ffaa4a;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 6px solid #e07c2c;
        }

        .level-badge {
            background: #2e7d64;
            padding: 8px 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: inset 0 -2px 0 #1e5a48, 0 4px 10px rgba(0,0,0,0.1);
        }

        .score-box {
            background: #f9a825;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #2c2c2c;
        }

        .timer-area {
            background: #1f2f3a;
            padding: 6px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: bold;
        }

        .timer-clock {
            font-size: 1.9rem;
            font-family: monospace;
            background: black;
            padding: 5px 14px;
            border-radius: 40px;
            letter-spacing: 2px;
        }

        .question-card {
            padding: 30px 35px 20px;
            text-align: center;
        }

        .question-text {
            font-size: 1.8rem;
            background: #fff2df;
            padding: 25px 20px;
            border-radius: 70px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02), 0 12px 20px rgba(0,0,0,0.1);
            font-weight: bold;
            margin-bottom: 30px;
            border: 3px solid #ffcf9a;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .voice-btn, .next-btn {
            background: #ffe0b5;
            border: none;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #b97f3a;
            color: #3b2a1f;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .next-btn {
            background: #66bb6a;
            box-shadow: 0 4px 0 #2e6b2f;
            color: white;
        }

        .voice-btn:active, .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b97f3a;
        }

        .next-btn:active {
            box-shadow: 0 1px 0 #2e6b2f;
        }

        .hint-area {
            background: #ffcd94;
            padding: 12px 26px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #3b2a1f;
            box-shadow: none;
            min-height: 70px;
        }

        .answer-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 25px 0 20px;
        }

        #studentAnswer {
            flex: 2;
            min-width: 200px;
            font-size: 1.5rem;
            padding: 18px 24px;
            border-radius: 60px;
            border: 3px solid #ffb465;
            font-family: inherit;
            text-align: center;
            background: white;
            outline: none;
        }

        .submit-btn {
            background: #4caf50;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #2e6b2f;
            transition: 0.05s linear;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #2e6b2f;
        }

        .feedback {
            margin: 15px 20px 25px;
            padding: 12px;
            font-size: 1.3rem;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
        }

        .progress-info {
            margin-top: 10px;
            font-size: 1rem;
            color: #7b5a3b;
        }

        /* Shape display styling */
        .shape-preview {
            display: inline-block;
            margin: 10px;
            vertical-align: middle;
        }
        .shape-rectangle {
            width: 80px;
            height: 50px;
            background-color: #ff6b6b;
            border: 3px solid #c0392b;
            border-radius: 8px;
            display: inline-block;
        }
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 70px solid #74b9ff;
            display: inline-block;
        }

        @media (max-width: 650px) {
            .game-header {
                flex-direction: column;
                text-align: center;
            }
            .question-text {
                font-size: 1.3rem;
            }
            #studentAnswer {
                font-size: 1.2rem;
                padding: 14px 18px;
            }
            .submit-btn {
                font-size: 1.2rem;
                padding: 12px 28px;
            }
            .shape-rectangle {
                width: 50px;
                height: 35px;
            }
            .shape-triangle {
                border-left: 25px solid transparent;
                border-right: 25px solid transparent;
                border-bottom: 45px solid #74b9ff;
            }
        }

        button:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <div class="level-badge" id="levelDisplay">🔺 LEVEL 1</div>
        <div class="score-box" id="scoreDisplay">✅ SCORE: 0 / 0</div>
        <div class="timer-area">
            ⏱️ TIME LEFT
            <span class="timer-clock" id="timerCountdown">40</span>
        </div>
    </div>

    <div class="question-card">
        <div class="question-text" id="questionText">Loading fun challenge...</div>
        <div class="action-buttons">
            <button class="voice-btn" id="readAloudBtn">🔊 READ QUESTION</button>
            <button class="next-btn" id="nextQuestionBtn">⏩ NEXT QUESTION</button>
        </div>
        <div class="hint-area" id="hintBox">💡 Hint will appear here as time goes</div>
        <div class="answer-area">
            <input type="text" id="studentAnswer" placeholder="Type your answer..." autocomplete="off">
            <button class="submit-btn" id="submitAnswer">✔️ CHECK ANSWER</button>
        </div>
        <div class="feedback" id="feedbackMsg">🔺 Answer each question! 80% needed to level up.</div>
        <div class="progress-info" id="progressInfo">Question 1 / 30</div>
    </div>
</div>

<script>
    (function() {
        // Speech helper
        function speakText(text, isTimeUp = false) {
            try {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                if (isTimeUp) utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            } catch(e) {
                console.log("Speech error:", e);
            }
        }
        
        // ---------- QUESTION BANK (2 main topics) ----------
        // Topic 1: Identifying rectangle and triangle shapes
        // Topic 2: Making patterns involving rectangles and triangles
        
        const allQuestions = [];
        
        // Helper function to add questions
        function addQuestions(arr) {
            for (let i = 0; i < arr.length; i++) {
                allQuestions.push(arr[i]);
            }
        }
        
        // TOPIC 1: Identifying rectangle and triangle shapes
        const identifyShapesBank = [
            { text: "How many sides does a triangle have?", correct: "3", alt: "three", topic: "Identify Shapes" },
            { text: "How many sides does a rectangle have?", correct: "4", alt: "four", topic: "Identify Shapes" },
            { text: "How many corners does a triangle have?", correct: "3", alt: "three", topic: "Identify Shapes" },
            { text: "How many corners does a rectangle have?", correct: "4", alt: "four", topic: "Identify Shapes" },
            { text: "Is a rectangle a square? (yes/no)", correct: "no", alt: "no", topic: "Identify Shapes" },
            { text: "A shape with 3 straight sides is called a ___", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "A shape with 4 sides where opposite sides are equal is a ___", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "Which shape has 4 corners: triangle or rectangle?", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "Which shape has 3 corners: triangle or rectangle?", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "A pizza slice looks like what shape?", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "A door usually looks like what shape?", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "A traffic warning sign often has what shape?", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "A TV screen is usually what shape?", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "A sail on a boat is often what shape?", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "A book is usually what shape?", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "A party hat is what shape?", correct: "triangle", alt: "triangle", topic: "Identify Shapes" },
            { text: "Does a rectangle have all sides equal? (yes/no)", correct: "no", alt: "no", topic: "Identify Shapes" },
            { text: "Does a square have all sides equal? (yes/no)", correct: "yes", alt: "yes", topic: "Identify Shapes" },
            { text: "A square is a special type of ___", correct: "rectangle", alt: "rectangle", topic: "Identify Shapes" },
            { text: "How many sides does a triangle have?", correct: "3", alt: "three", topic: "Identify Shapes" }
        ];
        
        // TOPIC 2: Making patterns involving rectangles and triangles
        const shapePatternsBank = [
            { text: "Pattern: rectangle, triangle, rectangle, triangle, ___ (next shape)", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Pattern: triangle, triangle, rectangle, triangle, triangle, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Pattern: rectangle, rectangle, triangle, rectangle, rectangle, ___", correct: "triangle", alt: "triangle", topic: "Shape Patterns" },
            { text: "What comes next? 🔲, 🔺, 🔲, 🔺, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "What comes next? 🔺, 🔲, 🔺, 🔲, ___", correct: "triangle", alt: "triangle", topic: "Shape Patterns" },
            { text: "Pattern: triangle, rectangle, rectangle, triangle, rectangle, rectangle, ___", correct: "triangle", alt: "triangle", topic: "Shape Patterns" },
            { text: "How many rectangles in this pattern: 🔲, 🔺, 🔲, 🔺, 🔲", correct: "3", alt: "three", topic: "Shape Patterns" },
            { text: "How many triangles in this pattern: 🔺, 🔲, 🔺, 🔲, 🔺, 🔲", correct: "3", alt: "three", topic: "Shape Patterns" },
            { text: "If the pattern is rectangle, triangle, rectangle, what shape comes after 2 more steps?", correct: "triangle", alt: "triangle", topic: "Shape Patterns" },
            { text: "Complete: triangle, rectangle, triangle, rectangle, triangle, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Complete: rectangle, rectangle, triangle, rectangle, rectangle, triangle, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Pattern: 🔲, 🔲, 🔺, 🔲, 🔲, 🔺, what comes next?", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Pattern: 🔺, 🔺, 🔲, 🔺, 🔺, 🔲, what comes next?", correct: "triangle", alt: "triangle", topic: "Shape Patterns" },
            { text: "In the pattern rectangle, triangle, triangle, rectangle, triangle, triangle, the next shape is ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "How many triangles in: 🔺, 🔲, 🔺, 🔲, 🔺, 🔲, 🔺", correct: "4", alt: "four", topic: "Shape Patterns" },
            { text: "How many rectangles in: 🔲, 🔺, 🔲, 🔺, 🔲, 🔺, 🔲", correct: "4", alt: "four", topic: "Shape Patterns" },
            { text: "Pattern: triangle, triangle, triangle, rectangle, triangle, triangle, triangle, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "Pattern: rectangle, triangle, triangle, rectangle, triangle, triangle, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "What is the 5th shape in: 🔲, 🔺, 🔲, 🔺, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" },
            { text: "What is the 6th shape in: 🔺, 🔲, 🔺, 🔲, 🔺, ___", correct: "rectangle", alt: "rectangle", topic: "Shape Patterns" }
        ];
        
        // Add all questions to master bank
        addQuestions(identifyShapesBank);
        addQuestions(shapePatternsBank);
        
        console.log("Total questions in bank:", allQuestions.length);
        
        // Fisher-Yates shuffle
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        // Generate 30 UNIQUE questions per level with balanced topics
        function generateLevelQuestions() {
            // Shuffle master bank
            let shuffled = shuffleArray([...allQuestions]);
            
            // Group by topic
            const identify = shuffled.filter(q => q.topic === "Identify Shapes");
            const patterns = shuffled.filter(q => q.topic === "Shape Patterns");
            
            // Take 15 from each topic to make 30
            let selected = [];
            selected = selected.concat(identify.slice(0, 15));
            selected = selected.concat(patterns.slice(0, 15));
            
            // Ensure we have 30 questions
            while (selected.length < 30) {
                selected.push(allQuestions[selected.length % allQuestions.length]);
            }
            if (selected.length > 30) selected = selected.slice(0, 30);
            
            // Shuffle and ensure uniqueness
            selected = shuffleArray(selected);
            const unique = [];
            const seen = new Set();
            for (let i = 0; i < selected.length; i++) {
                if (!seen.has(selected[i].text)) {
                    seen.add(selected[i].text);
                    unique.push(selected[i]);
                }
            }
            while (unique.length < 30) {
                unique.push(allQuestions[unique.length % allQuestions.length]);
            }
            return unique.slice(0, 30);
        }
        
        // DOM elements
        const levelDisplay = document.getElementById('levelDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timerSpan = document.getElementById('timerCountdown');
        const questionDiv = document.getElementById('questionText');
        const answerInput = document.getElementById('studentAnswer');
        const submitBtn = document.getElementById('submitAnswer');
        const readBtn = document.getElementById('readAloudBtn');
        const nextBtn = document.getElementById('nextQuestionBtn');
        const hintBoxDiv = document.getElementById('hintBox');
        const feedbackDiv = document.getElementById('feedbackMsg');
        const progressSpan = document.getElementById('progressInfo');
        
        // Game state
        let currentLevel = 0;
        let currentQIndex = 0;
        let currentQuestions = [];
        let correctCount = 0;
        let answeredCount = 0;
        let timerInterval = null;
        let timeLeft = 40;
        let waitingForAnswer = true;
        let answerSubmitted = false;
        let currentQuestion = null;
        let gameActive = true;
        let levelLocked = false;
        
        function updateUI() {
            scoreDisplay.innerText = "✅ SCORE: " + correctCount + " / " + answeredCount;
            progressSpan.innerText = "Question " + (answeredCount + 1) + " / " + currentQuestions.length;
        }
        
        function getTopicEmoji(topic) {
            if (topic === "Identify Shapes") return "🔍🔺";
            if (topic === "Shape Patterns") return "📊🔲";
            return "📐";
        }
        
        function updateHint(seconds, q) {
            if (!q) return;
            const emoji = getTopicEmoji(q.topic);
            if (seconds > 28) {
                hintBoxDiv.innerHTML = emoji + " Topic: " + q.topic + ". Think about rectangles (4 sides) and triangles (3 sides)!";
            } else if (seconds > 18) {
                hintBoxDiv.innerHTML = "🔎 Hint: A rectangle has 4 sides. A triangle has 3 sides. Look at the pattern!";
            } else if (seconds > 8) {
                let answerHint = q.correct;
                hintBoxDiv.innerHTML = "✨ Strong hint: The answer is \"" + answerHint + "\". Type it now!";
            } else if (seconds > 2) {
                hintBoxDiv.innerHTML = "🚀 Last " + seconds + " seconds! Answer: " + q.correct + " . Quickly!";
            } else {
                hintBoxDiv.innerHTML = "⏰ Almost out of time! Type a number, 'rectangle', or 'triangle'!";
            }
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function startTimer() {
            if (timerInterval) stopTimer();
            timeLeft = 40;
            timerSpan.innerText = timeLeft;
            updateHint(timeLeft, currentQuestion);
            timerInterval = setInterval(function() {
                if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (waitingForAnswer && !answerSubmitted) {
                        speakText("Time is up!", true);
                        waitingForAnswer = false;
                        answerSubmitted = true;
                        feedbackDiv.innerHTML = "⏰ TIME IS UP! Moving to next question.";
                        feedbackDiv.style.background = "#ffccbb";
                        setTimeout(function() {
                            if (!levelLocked) moveToNext();
                        }, 1500);
                    }
                } else {
                    timeLeft--;
                    timerSpan.innerText = timeLeft;
                    updateHint(timeLeft, currentQuestion);
                }
            }, 1000);
        }
        
        function checkAnswer() {
            if (!waitingForAnswer || levelLocked || !gameActive || answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ Wait! Already answered or question finished.";
                return;
            }
            let userAnswer = answerInput.value.trim().toLowerCase();
            if (userAnswer === "") {
                speakText("Please type an answer.");
                feedbackDiv.innerHTML = "✏️ Type your answer before checking!";
                return;
            }
            
            // Normalize common variations
            const normalizedMap = {
                "3": "3", "three": "3", "3 sides": "3",
                "4": "4", "four": "4", "4 sides": "4",
                "triangle": "triangle", "tri": "triangle",
                "rectangle": "rectangle", "rect": "rectangle",
                "square": "rectangle", "yes": "yes", "no": "no",
                "0": "0", "zero": "0", "2": "2", "two": "2"
            };
            
            let normalizedAnswer = normalizedMap[userAnswer] || userAnswer;
            const correctAns = currentQuestion.correct.toLowerCase();
            const altAns = currentQuestion.alt ? currentQuestion.alt.toLowerCase() : "";
            
            const isCorrect = (normalizedAnswer === correctAns) || (altAns !== "" && normalizedAnswer === altAns);
            
            answerSubmitted = true;
            waitingForAnswer = false;
            stopTimer();
            
            if (isCorrect) {
                correctCount++;
                speakText("Correct! Great job!");
                feedbackDiv.innerHTML = "🎉 CORRECT! +1 point 🎉";
                feedbackDiv.style.background = "#c8e6c9";
            } else {
                speakText("Incorrect. The correct answer is " + currentQuestion.correct + ".");
                feedbackDiv.innerHTML = "❌ INCORRECT! The right answer: \"" + currentQuestion.correct + "\". Keep trying!";
                feedbackDiv.style.background = "#ffcdd2";
            }
            answeredCount++;
            updateUI();
            submitBtn.disabled = true;
            answerInput.disabled = true;
        }
        
        function moveToNext() {
            if (levelLocked) return;
            if (answeredCount >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQIndex++;
            loadQuestion(currentQIndex);
        }
        
        function finishLevel() {
            const percent = (correctCount / currentQuestions.length) * 100;
            if (percent >= 80) {
                if (currentLevel + 1 < 5) {
                    speakText("Excellent! You passed level " + (currentLevel+1) + " with " + Math.floor(percent) + " percent. Get ready for level " + (currentLevel+2) + ".");
                    feedbackDiv.innerHTML = "🎊 LEVEL UP! 🎊 You scored " + correctCount + "/" + currentQuestions.length + " (" + Math.floor(percent) + "%) → Next Level!";
                    feedbackDiv.style.background = "#ffecb3";
                    currentLevel++;
                    loadLevel(currentLevel);
                } else {
                    gameActive = false;
                    stopTimer();
                    levelLocked = true;
                    feedbackDiv.innerHTML = "🏆🏆🏆 GRAND CHAMPION! You completed all 5 levels! Final score: " + correctCount + "/" + currentQuestions.length + " 🏆🏆🏆";
                    speakText("Congratulations! You finished the CBC Grade 1 Shapes challenge! You are a maths superstar!");
                    submitBtn.disabled = true;
                    readBtn.disabled = true;
                    nextBtn.disabled = true;
                    answerInput.disabled = true;
                    timerSpan.innerText = "🎉";
                    return;
                }
            } else {
                speakText("Oh no! You got " + correctCount + " out of " + currentQuestions.length + ". Need 80 percent to pass. Restarting level " + (currentLevel+1) + " with new questions.");
                feedbackDiv.innerHTML = "⚠️ " + Math.floor(percent) + "% only. Need 80% to pass. Same level restarts with fresh questions! ⚠️";
                feedbackDiv.style.background = "#ffb3ba";
                loadLevel(currentLevel);
            }
        }
        
        function loadQuestion(index) {
            if (index >= currentQuestions.length) {
                finishLevel();
                return;
            }
            currentQuestion = currentQuestions[index];
            questionDiv.innerText = currentQuestion.text;
            waitingForAnswer = true;
            answerSubmitted = false;
            submitBtn.disabled = false;
            answerInput.disabled = false;
            answerInput.value = "";
            answerInput.focus();
            feedbackDiv.style.background = "#fff3e0";
            feedbackDiv.innerHTML = "🔺 Type your answer and click CHECK!";
            updateUI();
            if (timerInterval) stopTimer();
            startTimer();
        }
        
        function loadLevel(levelIdx) {
            levelLocked = false;
            gameActive = true;
            currentLevel = levelIdx;
            currentQIndex = 0;
            correctCount = 0;
            answeredCount = 0;
            currentQuestions = generateLevelQuestions();
            levelDisplay.innerText = "🔺 LEVEL " + (currentLevel+1) + " 🔲";
            updateUI();
            loadQuestion(0);
        }
        
        function readQuestion() {
            if (currentQuestion && gameActive && !levelLocked) {
                speakText(currentQuestion.text);
            } else if (!currentQuestion) {
                speakText("No question loaded");
            }
        }
        
        function manualNext() {
            if (levelLocked || !gameActive) {
                feedbackDiv.innerHTML = "⚠️ Level transition or game finished!";
                return;
            }
            if (waitingForAnswer && !answerSubmitted) {
                feedbackDiv.innerHTML = "⚠️ You haven't answered yet! Please check your answer first.";
                speakText("Please check your answer before moving.");
                return;
            }
            if (answerSubmitted && !waitingForAnswer) {
                stopTimer();
                moveToNext();
            }
        }
        
        // Event listeners
        submitBtn.addEventListener('click', checkAnswer);
        readBtn.addEventListener('click', readQuestion);
        nextBtn.addEventListener('click', manualNext);
        answerInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !answerSubmitted && waitingForAnswer) {
                checkAnswer();
            }
        });
        
        // Start game
        loadLevel(0);
    })();
</script>
</body>
</html>
