<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Measure Master | Grade 4 CBC | Length, Area, Volume, Capacity, Mass, Time, Money</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0f3b2c, #1a5f45);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', 'Comic Neue', 'Fredoka One', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            max-width: 750px;
            width: 100%;
            background: #fffef7;
            border-radius: 60px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .game-header {
            background: linear-gradient(135deg, #1e4a3a, #0f2f24);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            color: white;
        }

        .level-badge {
            background: #f39c12;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.5rem;
            color: #1e3a2f;
        }

        .timer-area {
            background: #000000aa;
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 60px;
            font-family: monospace;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .timer-number {
            color: #f1c40f;
            background: #000;
            padding: 4px 14px;
            border-radius: 40px;
            margin-left: 10px;
            font-size: 2rem;
        }

        .score-progress {
            background: #f8f3e0;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #e0c8a0;
            font-weight: bold;
        }

        .score-text, .required-text {
            background: #1e4a3a;
            padding: 5px 18px;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
        }

        .question-card {
            padding: 30px 25px 25px;
            text-align: center;
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: #ecf0f1;
            padding: 30px 20px;
            border-radius: 50px;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            color: #1e3a2f;
            box-shadow: inset 0 0 0 3px white, 0 8px 12px rgba(0,0,0,0.1);
            line-height: 1.3;
        }

        .answer-area {
            margin-bottom: 30px;
        }

        .answer-input {
            width: 85%;
            font-size: 2rem;
            padding: 15px 20px;
            text-align: center;
            font-family: monospace;
            font-weight: bold;
            border: 4px solid #f39c12;
            border-radius: 60px;
            background: white;
            outline: none;
            transition: 0.1s;
        }

        .answer-input:focus {
            border-color: #e67e22;
            box-shadow: 0 0 0 3px #f39c1255;
        }

        .submit-btn {
            background: #27ae60;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 35px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 0 #1e8449;
            transition: 0.05s linear;
            width: 85%;
        }

        .submit-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1e8449;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        .message-area {
            background: #1e4a3a;
            color: #f1c40f;
            padding: 14px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
        }

        .restart-btn {
            background: #e67e22;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .next-area {
            margin-top: 10px;
        }

        .next-btn {
            background: #3498db;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 10px 40px;
            border: none;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #1f618d;
            transition: 0.05s linear;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #1f618d;
        }

        .next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .flex-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 550px) {
            .question-text { font-size: 1.3rem; }
            .answer-input { font-size: 1.5rem; width: 95%; }
            .submit-btn { width: 95%; font-size: 1.3rem; }
        }

        .timer-critical {
            color: #ff6b6b;
            text-shadow: 0 0 3px red;
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="level-badge">📏 LEVEL <span id="levelNum">1</span></div>
        <div class="timer-area">⏱️ TIME <span class="timer-number" id="timerDisplay">00</span>s</div>
    </div>
    <div class="score-progress">
        <div class="score-text">⭐ SCORE: <span id="currentScore">0</span> / <span id="totalQPerLevel">30</span></div>
        <div class="required-text">🎯 NEED 80% → <span id="passMark">24</span> correct</div>
    </div>
    <div class="question-card">
        <div class="question-text" id="questionText">Loading measurement challenge...</div>
        <div class="flex-col">
            <input type="text" id="answerInput" class="answer-input" placeholder="Type your answer" autocomplete="off">
            <button id="submitBtn" class="submit-btn">✓ CHECK ANSWER ✓</button>
            <div class="next-area">
                <button id="nextBtn" class="next-btn" disabled>➡️ NEXT QUESTION ⬅️</button>
            </div>
        </div>
    </div>
    <div class="message-area" id="gameMessage">📐 MEASURE MASTER! 📏 Type answers for Length, Area, Volume, Capacity, Mass, Time & Money. Timer is RUNNING!</div>
</div>

<script>
    // --------------------------------------------------------------
    // GRADE 4 CBC MATHEMATICS: MEASUREMENT
    // Topics: Length, Area, Volume, Capacity, Mass, Time, Money
    // 5 LEVELS × 30 QUESTIONS = 150 UNIQUE QUESTIONS
    // Student must type numeric answer (with units where applicable, but we accept numeric)
    // 80% to pass each level. Timed per level (total seconds).
    // --------------------------------------------------------------

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Helper: random int
    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Generate questions dynamically for each level (30 per level)
    function generateMeasurementQuestions(level, count = 30) {
        const questions = [];
        const topics = ["length", "area", "volume", "capacity", "mass", "time", "money"];
        
        for (let i = 0; i < count; i++) {
            let topic = topics[i % topics.length];
            let q = null;
            let diff = level; // 1 to 5 increasing difficulty
            
            if (topic === "length") {
                if (diff <= 2) {
                    let cm = rand(50, 500);
                    q = { text: `Convert ${cm} cm to meters. (Write number only)`, answer: cm / 100 };
                } else if (diff <= 4) {
                    let m = rand(2, 15);
                    let cm = rand(10, 99);
                    q = { text: `Add: ${m} m ${cm} cm + ${rand(1, m)} m ${rand(10, 80)} cm = ? (Write answer in cm only)`, answer: (m*100 + cm) + (rand(1,m)*100 + rand(10,80)) };
                } else {
                    let km = rand(1, 8);
                    let m = rand(100, 900);
                    q = { text: `Convert ${km} km ${m} m to meters.`, answer: km * 1000 + m };
                }
            }
            else if (topic === "area") {
                if (diff <= 2) {
                    let side = rand(3, 20);
                    q = { text: `Find the area of a square with side ${side} cm. (cm²)`, answer: side * side };
                } else if (diff <= 4) {
                    let l = rand(5, 30);
                    let w = rand(3, 20);
                    q = { text: `Rectangle length = ${l} m, width = ${w} m. Area = ? m²`, answer: l * w };
                } else {
                    let l = rand(12, 45);
                    let w = rand(8, 35);
                    q = { text: `A rectangle has area ${l*w} cm² and length ${l} cm. Find width (cm).`, answer: w };
                }
            }
            else if (topic === "volume") {
                if (diff <= 2) {
                    let edge = rand(2, 10);
                    q = { text: `Volume of a cube with side ${edge} cm = ? cm³`, answer: edge * edge * edge };
                } else if (diff <= 4) {
                    let l = rand(3, 15);
                    let w = rand(2, 12);
                    let h = rand(2, 10);
                    q = { text: `Cuboid: length ${l} cm, width ${w} cm, height ${h} cm. Volume = ? cm³`, answer: l * w * h };
                } else {
                    let vol = rand(120, 500);
                    let l = rand(5, 12);
                    let w = rand(3, 10);
                    let h = vol / (l * w);
                    if (Number.isInteger(h) && h > 0) {
                        q = { text: `A cuboid has volume ${vol} cm³, length ${l} cm, width ${w} cm. Find height (cm).`, answer: h };
                    } else {
                        q = { text: `Volume of a cube with side ${rand(4, 12)} cm = ?`, answer: Math.pow(rand(4,12),3) };
                    }
                }
            }
            else if (topic === "capacity") {
                if (diff <= 2) {
                    let liters = rand(1, 8);
                    q = { text: `Convert ${liters} liters to milliliters.`, answer: liters * 1000 };
                } else if (diff <= 4) {
                    let ml = rand(1500, 5000);
                    q = { text: `Convert ${ml} mL to liters and milliliters. (Write as decimal liters, e.g., 2.5)`, answer: ml / 1000 };
                } else {
                    let l1 = rand(2, 12);
                    let l2 = rand(1, 6);
                    q = { text: `Add capacities: ${l1} L ${rand(100,900)} mL + ${l2} L ${rand(100,900)} mL = ? (Answer in mL)`, answer: (l1*1000 + rand(100,900)) + (l2*1000 + rand(100,900)) };
                }
            }
            else if (topic === "mass") {
                if (diff <= 2) {
                    let kg = rand(1, 10);
                    q = { text: `Convert ${kg} kilograms to grams.`, answer: kg * 1000 };
                } else if (diff <= 4) {
                    let g = rand(2500, 9500);
                    q = { text: `Convert ${g} grams to kilograms and grams. (Write as decimal kg)`, answer: g / 1000 };
                } else {
                    let kg1 = rand(2, 15);
                    let g1 = rand(100, 900);
                    let kg2 = rand(1, 10);
                    let g2 = rand(100, 800);
                    q = { text: `Total mass: ${kg1} kg ${g1} g + ${kg2} kg ${g2} g = ? (Answer in grams)`, answer: (kg1*1000 + g1) + (kg2*1000 + g2) };
                }
            }
            else if (topic === "time") {
                if (diff <= 2) {
                    let hours = rand(1, 24);
                    q = { text: `How many minutes in ${hours} hours?`, answer: hours * 60 };
                } else if (diff <= 4) {
                    let startHour = rand(1, 11);
                    let startMin = rand(0, 59);
                    let duration = rand(30, 180);
                    let endMin = startMin + duration;
                    let addHour = Math.floor(endMin / 60);
                    let finalHour = startHour + addHour;
                    let finalMin = endMin % 60;
                    q = { text: `If the time is ${startHour}:${startMin.toString().padStart(2,'0')} and you add ${duration} minutes, what is the new time? (Write hour only, e.g., 14 for 2pm? Write 24h format like 13:45) Accept hour:minute`, answer: `${finalHour}:${finalMin.toString().padStart(2,'0')}` };
                } else {
                    let start = rand(8, 18);
                    let durationH = rand(2, 6);
                    let durationM = rand(10, 50);
                    let totalM = durationH*60 + durationM;
                    let endH = start + durationH;
                    let endM = durationM;
                    if (endM >= 60) { endH += Math.floor(endM/60); endM = endM%60; }
                    q = { text: `Start time: ${start}:00. Add ${durationH} hours and ${durationM} minutes. End time? (HH:MM)`, answer: `${endH}:${endM.toString().padStart(2,'0')}` };
                }
            }
            else if (topic === "money") {
                if (diff <= 2) {
                    let sh = rand(50, 500);
                    let cents = rand(10, 99);
                    q = { text: `You have KES ${sh}.${cents}. How many cents total? (1 KES = 100 cents) Write in cents.`, answer: sh * 100 + cents };
                } else if (diff <= 4) {
                    let price1 = rand(100, 1000);
                    let price2 = rand(50, 800);
                    q = { text: `Item A costs KES ${price1}, Item B costs KES ${price2}. You pay with KES 2000. Change = ?`, answer: 2000 - (price1 + price2) };
                } else {
                    let cost = rand(120, 5000);
                    let paid = cost + rand(10, 200);
                    q = { text: `A book costs KES ${cost}. You pay KES ${paid}. How much change?`, answer: paid - cost };
                }
            }
            
            if (q) {
                // Ensure answer is numeric or time string
                questions.push(q);
            } else {
                // fallback
                questions.push({ text: `Convert 5 meters to cm`, answer: 500 });
            }
        }
        return shuffleArray(questions);
    }

    let levelsData = [];
    for (let lvl = 1; lvl <= 5; lvl++) {
        levelsData.push(generateMeasurementQuestions(lvl, 30));
    }

    // ---------- GAME STATE ----------
    let currentLevel = 1;
    let currentQIndex = 0;
    let levelScore = 0;
    const TOTAL_QS = 30;
    const PASS_PERCENT = 80;
    let requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100); // 24

    let levelTimerSec = 0;
    let timerInterval = null;
    let gameActive = true;
    let answerLocked = false;
    let waitingForNext = false;
    let levelFinished = false;

    // DOM elements
    const levelSpan = document.getElementById('levelNum');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const scoreSpan = document.getElementById('currentScore');
    const totalQSpan = document.getElementById('totalQPerLevel');
    const passMarkSpan = document.getElementById('passMark');
    const questionDiv = document.getElementById('questionText');
    const answerInput = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const messageDiv = document.getElementById('gameMessage');

    function updateScoreUI() {
        scoreSpan.innerText = levelScore;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startLevelTimer() {
        if (timerInterval) stopTimer();
        // Challenging timers: L1=95s, L2=85s, L3=75s, L4=65s, L5=55s
        const timeMap = {1: 95, 2: 85, 3: 75, 4: 65, 5: 55};
        levelTimerSec = timeMap[currentLevel];
        timerDisplaySpan.innerText = levelTimerSec;
        timerDisplaySpan.classList.remove('timer-critical');
        
        timerInterval = setInterval(() => {
            if (!gameActive || levelFinished) return;
            if (levelTimerSec <= 1) {
                stopTimer();
                timerDisplaySpan.innerText = "0";
                gameActive = false;
                levelFinished = true;
                disableInputs();
                messageDiv.innerHTML = `⏰💀 TIME'S UP! Level ${currentLevel} FAILED! Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Restart to measure up! 💀⏰`;
                showRestartButton();
            } else {
                levelTimerSec--;
                timerDisplaySpan.innerText = levelTimerSec;
                if (levelTimerSec <= 10) {
                    timerDisplaySpan.classList.add('timer-critical');
                } else {
                    timerDisplaySpan.classList.remove('timer-critical');
                }
                if (levelTimerSec === 15) {
                    messageDiv.innerHTML = `⚠️ ${levelTimerSec} SECONDS LEFT! Type your measurement answer! ⚠️`;
                }
            }
        }, 1000);
    }

    function disableInputs() {
        answerInput.disabled = true;
        submitBtn.disabled = true;
        nextBtn.disabled = true;
    }

    function enableSubmit() {
        answerInput.disabled = false;
        submitBtn.disabled = false;
        answerInput.focus();
    }

    function showRestartButton() {
        let existing = document.querySelector('.restart-custom');
        if (existing) existing.remove();
        const restartBtn = document.createElement('button');
        restartBtn.innerText = '📏 RESTART MEASURE CHALLENGE 📐';
        restartBtn.className = 'restart-btn restart-custom';
        restartBtn.onclick = () => location.reload();
        messageDiv.appendChild(restartBtn);
    }

    // Normalize user answer (trim, handle fractions, time formats)
    function normalizeAnswer(userAns, correctAns) {
        userAns = userAns.trim().toLowerCase().replace(/\s/g, '');
        let correctStr = correctAns.toString().toLowerCase().replace(/\s/g, '');
        
        // For time answers like "14:30" compare both as strings
        if (correctStr.includes(':')) {
            // ensure leading zeros for minutes
            let partsUser = userAns.split(':');
            let partsCorrect = correctStr.split(':');
            if (partsUser.length === 2 && partsCorrect.length === 2) {
                let userHour = parseInt(partsUser[0]);
                let userMin = parseInt(partsUser[1]);
                let corHour = parseInt(partsCorrect[0]);
                let corMin = parseInt(partsCorrect[1]);
                if (!isNaN(userHour) && !isNaN(userMin) && !isNaN(corHour) && !isNaN(corMin)) {
                    return userHour === corHour && userMin === corMin;
                }
            }
            return userAns === correctStr;
        }
        
        // numeric comparison
        let userNum = parseFloat(userAns);
        let correctNum = parseFloat(correctStr);
        if (!isNaN(userNum) && !isNaN(correctNum)) {
            return Math.abs(userNum - correctNum) < 0.01;
        }
        return userAns === correctStr;
    }

    function checkAnswer() {
        if (answerLocked || waitingForNext || !gameActive || levelFinished) {
            messageDiv.innerHTML = "⏳ Please wait for next question!";
            return;
        }
        let userAnswer = answerInput.value;
        if (userAnswer === "") {
            messageDiv.innerHTML = "❓ Type your measurement answer first! ❓";
            return;
        }
        const currentQ = levelsData[currentLevel-1][currentQIndex];
        let isCorrect = normalizeAnswer(userAnswer, currentQ.answer);
        
        answerLocked = true;
        if (isCorrect) {
            levelScore++;
            updateScoreUI();
            messageDiv.innerHTML = `✅ CORRECT! +1 point! (${levelScore}/${TOTAL_QS}) Time left: ${levelTimerSec}s ✅`;
            answerInput.value = "";
        } else {
            messageDiv.innerHTML = `❌ WRONG! Correct answer: ${currentQ.answer}. Your answer: ${userAnswer}. No point. Keep measuring! ❌`;
            answerInput.value = "";
        }
        answerInput.disabled = true;
        submitBtn.disabled = true;
        waitingForNext = true;
        nextBtn.disabled = false;
        nextBtn.focus();
    }

    function loadQuestion() {
        if (!gameActive) return;
        if (currentQIndex >= TOTAL_QS) {
            finishLevel();
            return;
        }
        const qData = levelsData[currentLevel-1][currentQIndex];
        questionDiv.innerText = qData.text;
        answerInput.value = "";
        answerInput.disabled = false;
        submitBtn.disabled = false;
        waitingForNext = false;
        answerLocked = false;
        nextBtn.disabled = true;
        answerInput.focus();
        messageDiv.innerHTML = `📏 Q${currentQIndex+1}/${TOTAL_QS} • Type your answer! Timer: ${levelTimerSec}s left for level`;
    }

    function nextQuestion() {
        if (!waitingForNext) return;
        if (levelFinished) return;
        currentQIndex++;
        if (currentQIndex < TOTAL_QS) {
            loadQuestion();
        } else {
            finishLevel();
        }
    }

    function finishLevel() {
        if (levelFinished) return;
        levelFinished = true;
        stopTimer();
        const passed = (levelScore >= requiredCorrect);
        if (passed) {
            if (currentLevel === 5) {
                messageDiv.innerHTML = `🏆📐🎉 SPECTACULAR! You've conquered Length, Area, Volume, Capacity, Mass, Time & Money! Final Score: ${levelScore}/${TOTAL_QS} (${Math.round(levelScore/TOTAL_QS*100)}%). MEASURE MASTER! 🎉📏🏆`;
                disableInputs();
                gameActive = false;
                return;
            } else {
                messageDiv.innerHTML = `🎉 LEVEL ${currentLevel} COMPLETE! 🎉 ${levelScore}/${TOTAL_QS} PASS! Moving to LEVEL ${currentLevel+1}... 🚀📏`;
                disableInputs();
                currentLevel++;
                currentQIndex = 0;
                levelScore = 0;
                requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
                passMarkSpan.innerText = requiredCorrect;
                levelSpan.innerText = currentLevel;
                updateScoreUI();
                levelFinished = false;
                gameActive = true;
                answerLocked = false;
                waitingForNext = false;
                stopTimer();
                startLevelTimer();
                loadQuestion();
                return;
            }
        } else {
            gameActive = false;
            disableInputs();
            messageDiv.innerHTML = `😭 GAME OVER! Level ${currentLevel} failed. Score: ${levelScore}/${TOTAL_QS} (need ${requiredCorrect}). Press RESTART to become a Measure Master! 😭`;
            showRestartButton();
        }
    }

    function initGame() {
        totalQSpan.innerText = TOTAL_QS;
        requiredCorrect = Math.ceil(TOTAL_QS * PASS_PERCENT / 100);
        passMarkSpan.innerText = requiredCorrect;
        levelScore = 0;
        updateScoreUI();
        gameActive = true;
        levelFinished = false;
        answerLocked = false;
        waitingForNext = false;
        startLevelTimer();
        loadQuestion();
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);
        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !submitBtn.disabled && !waitingForNext && gameActive && !answerLocked) {
                checkAnswer();
            }
        });
    }

    initGame();
</script>
</body>
</html>
